<!doctype html>
<html lang="kk" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Мұғалім кабинеті – aitil</title>
<script>(function(){try{var th=localStorage.getItem("tilkz-theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Noto+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#F4F6F9; --panel:#FFFFFF; --ink:#18212E; --muted:#596476; --line:#DCE1E8;
  --accent:#1D5BA6; --accent-soft:#E3ECF7;
  --ok:#1C7A4E; --ok-soft:#E1F2E9; --bad:#B23A30; --bad-soft:#F8E4E2;
  --good:#5CCB8A; --mid:#F2C230; --weak:#E5534B;
  --f-text:"PT Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;caret-color:transparent}
input,textarea,select{caret-color:auto}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand a{font-family:var(--f-ui);font-weight:800;font-size:22px;letter-spacing:-.3px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand a .ai{color:var(--accent);font:inherit;letter-spacing:inherit}
.brand > span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:4px 10px;font-size:13px}
.themebtn{width:36px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:999px;display:grid;place-items:center;font-size:16px;padding:0}
main{padding-block:22px 60px}
h1{font-family:var(--f-text);font-size:28px;margin:0 0 4px;line-height:1.25}
h2{font-family:var(--f-text);font-size:21px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.eyebrow{font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--muted)}
.crumbs button{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
/* Кіру */
.auth{max-width:440px;margin:30px auto}
.af{display:grid;gap:12px}
.af label{display:grid;gap:5px;font-size:14px;font-weight:600}
.af input,.af select{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.af .err{color:var(--bad);font-size:14px;margin:0;min-height:1em}
.af .hint{font-size:13px;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Сыныптар */
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ccard h3{font-family:var(--f-text);font-size:19px;margin:0}
.ccard.closed{opacity:.7}
.code{font:700 22px/1 var(--f-ui);letter-spacing:4px;color:var(--accent)}
.meta{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.newclass{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.newclass input{flex:1 1 220px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* Сынып беті */
.classhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:700 24px var(--f-text);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.vtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.vtabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.vtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14px}
.filters select,.filters input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--paper)}
th button{border:0;background:none;padding:0;font-weight:700;color:inherit}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--accent-soft)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.pill.good{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:#FBF1CC;color:#7A5A00} .pill.weak{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--paper);color:var(--muted)}
:root[data-theme="dark"] .pill.mid{background:#3A3215;color:#F2C230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.mid{background:#3A3215;color:#F2C230}}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* Жолақтар */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 5.5em;gap:12px;align-items:center;font-size:14px}
.bar .track{height:12px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar .v small{color:var(--muted)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grp{font-weight:700;margin:16px 0 6px;font-size:14px}
/* Оқушы беті */
.qlist{display:grid;gap:10px}
.qi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.qi .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.qi .stem{font-weight:600;white-space:pre-line;margin-bottom:6px}
.qi .ans{display:grid;gap:3px}
.qi .ans .w{color:var(--bad)} .qi .ans .k{color:var(--ok)}
.status{font-weight:700}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.second{color:#B07A00}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.att{display:grid;gap:8px}
@media (min-width:1400px){
  .wrap{max-width:none;width:90%;padding-left:0;padding-right:0}
  body{font-size:16.5px} table{font-size:15.5px} th{font-size:13.5px} .btn{font-size:15px}
  h1{font-size:32px} h2{font-size:23px} .kpi b{font-size:28px} .kpi span,.meta{font-size:14.5px}
  .bar{font-size:15.5px} .qi{font-size:15.5px} .classes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media (max-width:760px){
  #stuBtn{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .twocol{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(0,1fr) 5em;}
  .bar .track{grid-column:1/-1;grid-row:2}
  h1{font-size:24px}
  .brand > span{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><a href="../"><span class="ai">ai</span>til</a><span>Мұғалім кабинеті</span></div>
  <a class="btn sm" id="stuBtn" href="../nzm-bil/" hidden title="Тестті оқушы көзімен тапсырып көру">Оқушы ретінде тексеру</a>
  <button class="btn sm" id="outBtn" type="button" hidden>Шығу</button>
  <button type="button" class="themebtn" id="themeBtn"></button>
</div></header>
<main class="wrap" id="app"></main>
<footer class="wrap" style="color:var(--muted);font-size:13px;text-align:center;padding-bottom:28px">aitil · <a href="../privacy/" style="color:inherit">Құпиялылық саясаты</a></footer>
<div class="toast" id="toast" hidden></div>
<script>
const SB_CFG = /*__SUPABASE__*/null;
const BANKS = /*__BANKS__*/[];
const LOGIN_DOMAIN = "oqushy.tilkz.app";
const SKILL_GROUPS = {A:"Ақпаратты табу", B:"Мәтінді түсіну", C:"Негізгі ой мен құрылым", D:"Автор және жанр"};
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b ? Math.round(100*a/b) : null;
const band = p => p==null ? "none" : p>=75 ? "good" : p>=50 ? "mid" : "weak";
const COLOR = {good:"var(--good)", mid:"var(--mid)", weak:"var(--weak)"};
const pill = p => `<span class="pill ${band(p)}">${p==null?"—":p+"%"}</span>`;
const p2 = n => String(n).padStart(2,"0");
const fmtDate = d => { if(!d) return "—"; const x=new Date(d); return `${p2(x.getDate())}.${p2(x.getMonth()+1)}.${x.getFullYear()}`; };
const fmtDT = d => { if(!d) return "—"; const x=new Date(d); return `${p2(x.getDate())}.${p2(x.getMonth()+1)}.${x.getFullYear()}, ${p2(x.getHours())}:${p2(x.getMinutes())}`; };
const bankById = Object.fromEntries(BANKS.map(b=>[b.bank_id,b]));
const itemById = {}; for(const b of BANKS) for(const it of b.items) itemById[it.id]={...it, bank:b};
const SKILLS = Object.assign({}, ...BANKS.map(b=>b.skills));
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
async function copy(text, msg){ try{ await navigator.clipboard.writeText(text); toast(msg||"Көшірілді"); }catch(e){ prompt("Көшіріп алыңыз:", text); } }

/* Тақырып */
const themeBtn=document.getElementById("themeBtn");
const isDark=()=>{ const t=document.documentElement.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function paintTheme(){ const d=isDark(); themeBtn.textContent=d?"☀":"☾"; themeBtn.title=d?"Жарық тақырып":"Қараңғы тақырып"; }
themeBtn.onclick=()=>{ const t=isDark()?"light":"dark"; document.documentElement.dataset.theme=t; try{localStorage.setItem("tilkz-theme",t);}catch(e){} paintTheme(); };
paintTheme();

/* Күй */
let sb=null, ME=null, classes=[], cur=null, data=null, view="classes", tab="students", stuId=null, trackF="all", authMode="login";
const st = {sort:"name"};

/* ---------- Кіру ---------- */
function renderAuth(msg=""){
  const reg=authMode==="reg";
  app.innerHTML=`<div class="auth"><span class="eyebrow">aitil</span><h1>Мұғалім кабинеті</h1>
   <p class="sub">Сынып ашу, оқушылардың нәтижесі мен дағдылары бойынша есеп.</p>
   <div class="panel"><div class="tabs"><button type="button" data-am="login" aria-pressed="${!reg}">Кіру</button><button type="button" data-am="reg" aria-pressed="${reg}">Алғаш рет тіркелу</button></div>
   <form class="af" id="authForm" novalidate>
     <label>Электрондық пошта<input name="email" type="email" autocomplete="email" required></label>
     <label>Құпиясөз<input name="password" type="password" autocomplete="${reg?"new-password":"current-password"}" required>${reg?'<span class="hint">Кемінде 8 таңба. Тек мұғалімдер тізіміндегі пошта тіркеле алады.</span>':""}</label>
     ${reg?'<label>Құпиясөзді қайталаңыз<input name="password2" type="password" autocomplete="new-password" required></label>':""}
     <p class="err" role="alert">${esc(msg)}</p>
     <button class="btn primary" type="submit">${reg?"Тіркелу":"Кіру"}</button></form></div></div>`;
}
app.addEventListener("click",e=>{ const b=e.target.closest("[data-am]"); if(b){ authMode=b.dataset.am; renderAuth(); } });
app.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm") return; e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target)), btn=e.target.querySelector("button[type=submit]"), err=e.target.querySelector(".err");
  const fail=m=>{ err.textContent=m; btn.disabled=false; };
  f.email=(f.email||"").trim().toLowerCase(); btn.disabled=true; err.textContent="";
  if(!f.email||!f.password) return fail("Пошта мен құпиясөзді енгізіңіз.");
  if(authMode==="reg"){
    if(f.password.length<8) return fail("Құпиясөз кемінде 8 таңба болуы керек.");
    if(f.password!==f.password2) return fail("Құпиясөздер бірдей емес.");
    const {data:d,error}=await sb.auth.signUp({email:f.email,password:f.password});
    if(error) return fail(/NOT_ALLOWED|Database error/i.test(error.message)?"Бұл пошта мұғалімдер тізімінде жоқ.":/registered|exists/i.test(error.message)?"Бұл пошта тіркелген. «Кіру» бөлімі арқылы кіріңіз.":"Тіркелу кезінде қате шықты: "+error.message);
    if(!d.session) return fail("Тіркелу аяқталмады. Поштаңызды тексеріңіз.");
    return start(d.user);
  }
  const {data:d,error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});
  if(error) return fail("Пошта не құпиясөз қате.");
  start(d.user);
});
document.getElementById("outBtn").onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

async function start(user){
  const {data:t}=await sb.from("teachers").select("user_id").eq("user_id",user.id).maybeSingle();
  document.getElementById("outBtn").hidden=false;
  if(!t){ app.innerHTML=`<div class="auth panel"><h2>Бұл бет тек мұғалімдерге арналған</h2><p class="sub">Сіз оқушы ретінде кірдіңіз. Тест тапсыру үшін курс бетіне өтіңіз.</p><a class="btn primary" href="../nzm-bil/">Курс бетіне өту</a></div>`; return; }
  ME=user; document.getElementById("stuBtn").hidden=false; await loadClasses(); route();
}

/* ---------- Деректер ---------- */
async function fetchAll(make){ let out=[], from=0; for(;;){ const {data:d,error}=await make().range(from,from+999); if(error) throw error; out=out.concat(d); if(d.length<1000) return out; from+=1000; } }
async function loadClasses(){
  const {data:cl,error}=await sb.from("classes").select("id,code,name,active,created_at").order("created_at");
  if(error){ app.innerHTML=`<p class="err">Қате: ${esc(error.message)}</p>`; return; }
  const {data:sc}=await sb.from("students").select("class_id");
  const cnt={}; for(const s of sc||[]) cnt[s.class_id]=(cnt[s.class_id]||0)+1;
  classes=cl.map(c=>({...c, n:cnt[c.id]||0}));
}
async function loadClass(c){
  app.innerHTML=`<p class="sub">Жүктеліп жатыр…</p>`;
  const students=await fetchAll(()=>sb.from("students").select("user_id,login,first_name,last_name,grade,city,school,created_at").eq("class_id",c.id).order("last_name"));
  const ids=students.map(s=>s.user_id);
  let attempts=[], answers=[];
  if(ids.length){
    // Сілтеме тым ұзын болмауы үшін оқушыларды 60-тан бөліп сұраймыз
    for(let i=0;i<ids.length;i+=60){ const part=ids.slice(i,i+60);
      attempts=attempts.concat(await fetchAll(()=>sb.from("attempts").select("id,user_id,bank_id,mode,started_at,finished_at,first_correct,total").in("user_id",part).order("started_at")));
      answers=answers.concat(await fetchAll(()=>sb.from("answers").select("attempt_id,user_id,bank_id,item_id,skill,level,tries,status,first_correct,updated_at").in("user_id",part).order("item_id")));
    }
  }
  data={students, attempts, answers};
}
// Әр сұрақтың соңғы жауабы (оқушы нұсқаны қайта орындаса, соңғы әрекет есептеледі)
function latestAnswers(rows){
  const at=Object.fromEntries(data.attempts.map(a=>[a.id,a])), best={};
  for(const r of rows){ const k=r.user_id+"|"+r.item_id, a=at[r.attempt_id]; const t=a?a.started_at:r.updated_at;
    if(!best[k] || t>best[k].t) best[k]={...r,t}; }
  return Object.values(best);
}
const inTrack = r => trackF==="all" || (bankById[r.bank_id]||{}).track===trackF;
const bankLabel = id => { const b=bankById[id]; if(!b) return id; const same=BANKS.filter(x=>x.track===b.track); return `${b.track==="second_language"?"Екінші тіл":"Бірінші тіл"} · ${same.indexOf(b)+1}-нұсқа`; };

/* ---------- Беттер ---------- */
function route(){ if(view==="classes") renderClasses(); else if(view==="class") renderClass(); else renderStudent(); window.scrollTo({top:0}); }
const invite = c => `Платформаға кіру сілтемесі: ${location.origin}${location.pathname.replace(/mugalim\/?(index\.html)?$/,"")}nzm-bil/\n«Тіркелу» бетінде сынып кодын енгіз: ${c.code}\nЛогин мен құпиясөзіңді жазып ал, келесі жолы солармен кіресің. Тіркелу үшін ата-анаңнан рұқсат сұра.`;

function renderClasses(){
  app.innerHTML=`<span class="eyebrow">Мұғалім кабинеті</span><h1>Сыныптарым</h1><p class="sub">Оқушы тек сынып коды арқылы тіркеле алады. Кодты және тіркелу сілтемесін оқушыларға жіберіңіз.</p>
   ${classes.length?`<div class="classes">${classes.map(c=>`<div class="ccard ${c.active?"":"closed"}">
      <h3>${esc(c.name)}</h3><div class="code">${esc(c.code)}</div>
      <div class="meta">${c.n} оқушы · ${c.active?"тіркелу ашық":"тіркелу жабық"} · ашылған күні ${fmtDate(c.created_at)}</div>
      <div class="row"><button class="btn primary sm" data-open="${c.id}">Ашу</button><button class="btn sm" data-inv="${c.id}">Шақыруды көшіру</button><button class="btn ghost sm" data-tog="${c.id}">${c.active?"Тіркелуді жабу":"Тіркелуді ашу"}</button></div></div>`).join("")}</div>`
   :`<div class="panel empty">Әзірге сынып жоқ. Төменде алғашқы сыныпты ашыңыз.</div>`}
   <form class="newclass" id="newClass"><input name="name" maxlength="60" placeholder="Жаңа сыныптың атауы, мысалы: 5А – НЗМ дайындық" required><button class="btn primary" type="submit">+ Сынып ашу</button></form>`;
}
app.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b||!ME) return;
  if(b.dataset.open){ cur=classes.find(c=>c.id===b.dataset.open); view="class"; tab="students"; await loadClass(cur); route(); }
  if(b.dataset.inv){ const c=classes.find(x=>x.id===b.dataset.inv); copy(invite(c),"Шақыру мәтіні көшірілді"); }
  if(b.dataset.tog){ const c=classes.find(x=>x.id===b.dataset.tog);
    const {error}=await sb.from("classes").update({active:!c.active}).eq("id",c.id); if(error) return toast("Қате: "+error.message);
    c.active=!c.active; toast(c.active?"Тіркелу ашылды":"Тіркелу жабылды. Тіркелген оқушылар бұрынғыдай кіре береді."); route(); }
  if(b.dataset.nav==="classes"){ view="classes"; await loadClasses(); route(); }
  if(b.dataset.nav==="class"){ view="class"; route(); }
  if(b.dataset.tab){ tab=b.dataset.tab; route(); }
  if(b.dataset.sort){ st.sort=b.dataset.sort; route(); }
  if(b.dataset.stu){ stuId=b.dataset.stu; view="student"; route(); }
  if(b.dataset.act==="pw") showPwForm();
  if(b.dataset.act==="pwsave") savePw();
  if(b.dataset.act==="pwgen"){ const i=document.getElementById("newPw"); if(i) i.value=genPw(); }
  if(b.dataset.act==="pwcopy") copy(b.dataset.text,"Көшірілді");
  if(b.dataset.act==="del") deleteStudent();
});
app.addEventListener("click",e=>{ const tr=e.target.closest("tr[data-stu]"); if(tr && !e.target.closest("button")){ stuId=tr.dataset.stu; view="student"; route(); } });
app.addEventListener("change",e=>{ if(e.target.id==="trackF"){ trackF=e.target.value; route(); } });
app.addEventListener("submit",async e=>{
  if(e.target.id!=="newClass") return; e.preventDefault();
  const name=new FormData(e.target).get("name").trim(); if(!name) return;
  const AL="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  for(let i=0;i<5;i++){
    const code=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>AL[x%AL.length]).join("");
    const {error}=await sb.from("classes").insert({code,name,teacher_id:ME.id});
    if(!error){ toast("Сынып ашылды: "+code); await loadClasses(); return route(); }
    if(!/duplicate|unique/i.test(error.message)) return toast("Қате: "+error.message);
  }
});

function studentStats(uid){
  const rows=latestAnswers(data.answers.filter(r=>r.user_id===uid && inTrack(r)));
  const first=rows.filter(r=>r.first_correct).length;
  const fin=data.attempts.filter(a=>a.user_id===uid && a.finished_at && inTrack(a)).length;
  const last=data.answers.filter(r=>r.user_id===uid).reduce((m,r)=>r.updated_at>m?r.updated_at:m,"");
  return {n:rows.length, first, p:pct(first,rows.length), fin, last};
}
function trackSelect(){ return `<label>Бағыт: <select id="trackF"><option value="all"${trackF==="all"?" selected":""}>Барлығы</option><option value="first_language"${trackF==="first_language"?" selected":""}>Бірінші тіл (қазақ сыныптары)</option><option value="second_language"${trackF==="second_language"?" selected":""}>Екінші тіл (орыс сыныптары)</option></select></label>`; }

function renderClass(){
  const c=cur, S=data.students;
  const all=latestAnswers(data.answers.filter(inTrack)), first=all.filter(r=>r.first_correct).length;
  const active=new Set(data.answers.map(r=>r.user_id)).size;
  let body="";
  if(tab==="students"){
    const rows=S.map(s=>({s, k:studentStats(s.user_id)}));
    const key={name:r=>(r.s.last_name+" "+r.s.first_name).toLowerCase(), p:r=>r.k.p==null?-1:r.k.p, n:r=>-r.k.n, last:r=>r.k.last?-new Date(r.k.last):0}[st.sort];
    rows.sort((a,b)=>{ const x=key(a), y=key(b); return x<y?-1:x>y?1:0; }); if(st.sort==="p") rows.reverse();
    body = S.length ? `<div class="tablewrap"><table><thead><tr>
       <th><button data-sort="name">Аты-жөні ${st.sort==="name"?"↓":""}</button></th><th>Сынып</th><th>Қала, мектеп</th>
       <th><button data-sort="n">Жауап берген ${st.sort==="n"?"↓":""}</button></th><th><button data-sort="p">Бірден дұрыс ${st.sort==="p"?"↑":""}</button></th>
       <th>Аяқталған нұсқа</th><th><button data-sort="last">Соңғы белсенділік ${st.sort==="last"?"↓":""}</button></th><th>Логин</th></tr></thead><tbody>
       ${rows.map(({s,k})=>`<tr class="click" data-stu="${s.user_id}"><td><b>${esc(s.last_name)} ${esc(s.first_name)}</b></td><td class="n">${s.grade}</td>
         <td>${esc(s.city)}, ${esc(s.school)}</td><td class="n">${k.n}</td><td class="n">${pill(k.p)}</td><td class="n">${k.fin}</td><td>${fmtDT(k.last||null)}</td><td>${esc(s.login)}</td></tr>`).join("")}
       </tbody></table></div>` : `<div class="panel empty">Бұл сыныпқа әлі ешкім тіркелмеген. Оқушыларға <b>${esc(c.code)}</b> кодын жіберіңіз.</div>`;
  } else if(tab==="skills"){
    body = skillBars(all) + `<p class="meta" style="margin-top:14px">Әр дағды бойынша оқушылардың бірінші реттен дұрыс жауап берген үлесі. Ең әлсіз дағдылар жоғарыда.</p>`;
  } else {
    const by={}; for(const r of all){ (by[r.item_id] ||= {n:0,f:0}); by[r.item_id].n++; if(r.first_correct) by[r.item_id].f++; }
    const list=Object.entries(by).filter(([id])=>itemById[id]).map(([id,v])=>({it:itemById[id], ...v, p:pct(v.f,v.n)})).sort((a,b)=>a.p-b.p||b.n-a.n);
    body = list.length ? `<div class="tablewrap"><table><thead><tr><th>Нұсқа</th><th>№</th><th>Сұрақ</th><th>Дағды</th><th>Жауап берген</th><th>Бірден дұрыс</th></tr></thead><tbody>
      ${list.slice(0,40).map(x=>`<tr><td>${esc(bankLabel(x.it.bank.bank_id))}</td><td class="n">${x.it.number}</td><td>${esc(x.it.stem.split("\n")[0])}</td><td>${esc(SKILLS[x.it.skill]||x.it.skill)}</td><td class="n">${x.n}</td><td class="n">${pill(x.p)}</td></tr>`).join("")}
      </tbody></table></div><p class="meta" style="margin-top:10px">Ең қиын сұрақтар жоғарыда (бірінші реттен дұрыс жауап берген оқушылардың үлесі бойынша).</p>` : `<div class="panel empty">Әлі жауап жоқ.</div>`;
  }
  app.innerHTML=`<div class="crumbs"><button data-nav="classes">← Сыныптарым</button></div>
   <div class="classhead"><div><span class="eyebrow">Сынып</span><h1>${esc(c.name)}</h1><div class="meta">Коды: <b class="code" style="font-size:17px;letter-spacing:3px">${esc(c.code)}</b> · ${c.active?"тіркелу ашық":"тіркелу жабық"}</div></div>
     <div class="row"><button class="btn sm" data-inv="${c.id}">Шақыруды көшіру</button><button class="btn ghost sm" data-open="${c.id}">↻ Жаңарту</button></div></div>
   <div class="kpis"><div class="kpi"><b>${S.length}</b><span>оқушы тіркелді</span></div><div class="kpi"><b>${active}</b><span>тест бастады</span></div>
     <div class="kpi"><b>${all.length}</b><span>жауап берілді</span></div><div class="kpi"><b>${pct(first,all.length)??"—"}${all.length?"%":""}</b><span>бірінші реттен дұрыс</span></div></div>
   <div class="vtabs"><button data-tab="students" aria-pressed="${tab==="students"}">Оқушылар</button><button data-tab="skills" aria-pressed="${tab==="skills"}">Дағдылар</button><button data-tab="items" aria-pressed="${tab==="items"}">Қиын сұрақтар</button></div>
   <div class="filters">${trackSelect()}</div>${body}`;
}
function skillBars(rows){
  if(!rows.length) return `<div class="panel empty">Әлі жауап жоқ.</div>`;
  const by={}; for(const r of rows){ if(!r.skill) continue; (by[r.skill] ||= {n:0,f:0}); by[r.skill].n++; if(r.first_correct) by[r.skill].f++; }
  const groups={}; for(const [k,v] of Object.entries(by)) (groups[k[0]] ||= []).push({k,...v,p:pct(v.f,v.n)});
  const order=Object.keys(groups).sort((a,b)=>{ const pa=Math.min(...groups[a].map(x=>x.p)), pb=Math.min(...groups[b].map(x=>x.p)); return pa-pb; });
  return `<div class="panel"><div class="bars">${order.map(g=>`<div class="grp">${esc(SKILL_GROUPS[g]||g)}</div>`+groups[g].sort((a,b)=>a.p-b.p).map(x=>
    `<div class="bar"><span>${esc(SKILLS[x.k]||x.k)}</span><div class="track"><i style="width:${x.p}%;background:${COLOR[band(x.p)]}"></i></div><span class="v">${x.p}% <small>(${x.f}/${x.n})</small></span></div>`).join("")).join("")}</div>
    <div class="lgd"><span><i style="background:var(--weak)"></i>Мән беру керек (&lt;50%)</span><span><i style="background:var(--mid)"></i>Орташа (50–74%)</span><span><i style="background:var(--good)"></i>Мықты (75%+)</span></div></div>`;
}

function renderStudent(){
  const s=data.students.find(x=>x.user_id===stuId); if(!s){ view="class"; return route(); }
  const k=studentStats(s.user_id);
  const rows=latestAnswers(data.answers.filter(r=>r.user_id===s.user_id && inTrack(r)));
  const atts=data.attempts.filter(a=>a.user_id===s.user_id && inTrack(a)).sort((a,b)=>b.started_at<a.started_at?-1:1);
  const mist=rows.filter(r=>!r.first_correct && itemById[r.item_id]).sort((a,b)=>(a.bank_id+a.item_id).localeCompare(b.bank_id+b.item_id,undefined,{numeric:true}));
  const stat = r => r.first_correct ? `<span class="status ok">✓ бірден дұрыс</span>` : r.status==="ok" ? `<span class="status second">↻ екінші мүмкіндікте дұрыс</span>` : r.status==="revealed" ? `<span class="status bad">✗ қате</span>` : `<span class="status bad">… бір рет қателесті</span>`;
  app.innerHTML=`<div class="crumbs"><button data-nav="classes">Сыныптарым</button> / <button data-nav="class">${esc(cur.name)}</button></div>
   <span class="eyebrow">Оқушы</span><h1>${esc(s.last_name)} ${esc(s.first_name)}</h1>
   <p class="sub">${s.grade}-сынып · ${esc(s.city)}, ${esc(s.school)} · логин: <b>${esc(s.login)}</b> · тіркелген күні ${fmtDate(s.created_at)}</p>
   <div class="row" style="margin:-6px 0 14px"><button class="btn sm" data-act="pw">🔑 Құпиясөзді ауыстыру</button><button class="btn ghost sm" data-act="del" style="color:var(--bad)">Оқушыны өшіру</button></div>
   <div id="stuTools"></div>
   <div class="kpis"><div class="kpi"><b>${k.n}</b><span>жауап берген сұрақ</span></div><div class="kpi"><b>${k.p??"—"}${k.p!=null?"%":""}</b><span>бірінші реттен дұрыс</span></div>
     <div class="kpi"><b>${k.fin}</b><span>аяқталған нұсқа</span></div><div class="kpi"><b>${mist.length}</b><span>қателер банкінде</span></div></div>
   <div class="filters">${trackSelect()}</div>
   <div class="twocol"><div><h2>Дағдылар</h2>${skillBars(rows)}</div>
    <div><h2>Тест әрекеттері</h2>${atts.length?`<div class="tablewrap"><table><thead><tr><th>Нұсқа</th><th>Басталды</th><th>Нәтиже</th></tr></thead><tbody>
      ${atts.map(a=>{ const n=data.answers.filter(r=>r.attempt_id===a.id).length, tot=(bankById[a.bank_id]||{items:[]}).items.length;
        return `<tr><td>${esc(bankLabel(a.bank_id))}</td><td>${fmtDT(a.started_at)}</td><td>${a.finished_at?`${a.first_correct}/${a.total} ${pill(pct(a.first_correct,a.total))}`:`<span class="meta">орындалуда: ${n}/${tot}</span>`}</td></tr>`; }).join("")}
      </tbody></table></div>`:`<div class="panel empty">Әлі тест бастамаған.</div>`}</div></div>
   <h2 style="margin-top:22px">Қателер банкі (${mist.length})</h2>
   <p class="sub">Оқушы бірінші реттен дұрыс жауап бере алмаған сұрақтар. Кейін осылар бойынша оқушыға жеке нұсқа құрастырылады.</p>
   ${mist.length?`<div class="qlist">${mist.map(r=>{ const it=itemById[r.item_id];
      return `<div class="qi"><div class="h"><b>${esc(bankLabel(r.bank_id))} · ${it.number}-сұрақ</b><span>${esc(SKILLS[it.skill]||it.skill)} · ${it.level}-деңгей</span>${stat(r)}</div>
        <div class="stem">${esc(it.stem)}</div><div class="ans">${r.tries.map(l=>`<span class="w">✗ Таңдағаны: ${esc(it.options[l]||l)}</span>`).join("")}<span class="k">✓ Дұрыс жауап: ${esc(it.options[it.key])}</span></div></div>`; }).join("")}</div>`
   :`<div class="panel empty">Қате жоқ.</div>`}`;
}

/* ---------- Оқушының құпиясөзі және өшіру ---------- */
// Оқушыға айтуға оңай құпиясөз: қысқа қазақ сөзі + 4 сан (мысалы, kitap4827)
function genPw(){ const W=["alma","kitap","dala","bala","tau","oqu","jyl","aqyl","bilim","oqushy","jaz","kun"];
  const r=crypto.getRandomValues(new Uint32Array(2)); return W[r[0]%W.length]+String(1000+r[1]%9000); }
const sbErr = e => /Could not find|PGRST202|does not exist/i.test(e.message||"") ? "Алдымен Supabase-те 002_teacher_tools.sql файлын іске қосу керек." : /NOT_ALLOWED/.test(e.message||"") ? "Бұл оқушы сіздің сыныбыңызда емес." : (e.message||"Қате");
function showPwForm(){
  const s=data.students.find(x=>x.user_id===stuId);
  document.getElementById("stuTools").innerHTML=`<div class="panel" style="margin-bottom:16px"><form class="af" onsubmit="return false">
    <label>«${esc(s.login)}» оқушысының жаңа құпиясөзі<input id="newPw" value="${genPw()}" autocomplete="off" spellcheck="false"><span class="hint">Кемінде 6 таңба. Ұсынылған құпиясөзді қалдыруға не өзгертуге болады.</span></label>
    <div class="row"><button class="btn primary sm" data-act="pwsave" type="button">Сақтау</button><button class="btn sm" data-act="pwgen" type="button">Басқасын ұсыну</button></div>
    <p class="err" id="pwMsg"></p></form></div>`;
}
async function savePw(){
  const s=data.students.find(x=>x.user_id===stuId), pw=document.getElementById("newPw").value.trim(), msg=document.getElementById("pwMsg");
  if(pw.length<6){ msg.textContent="Құпиясөз кемінде 6 таңба болуы керек."; return; }
  const {error}=await sb.rpc("teacher_set_password",{p_student:s.user_id, p_password:pw});
  if(error){ msg.textContent=sbErr(error); return; }
  const text=`Логин: ${s.login}\nЖаңа құпиясөз: ${pw}`;
  document.getElementById("stuTools").innerHTML=`<div class="panel" style="margin-bottom:16px;border-color:var(--ok)"><b style="color:var(--ok)">✓ Құпиясөз ауыстырылды</b>
    <p style="margin:8px 0">Логин: <b>${esc(s.login)}</b> · жаңа құпиясөз: <b style="font-size:18px;letter-spacing:1px">${esc(pw)}</b></p>
    <p class="meta" style="margin:0 0 10px">Оны оқушыға жеке хабарламамен жіберіңіз. Бұл құпиясөз кабинетте қайта көрсетілмейді.</p>
    <button class="btn sm" data-act="pwcopy" data-text="${esc(text)}">Көшіру</button></div>`;
}
async function deleteStudent(){
  const s=data.students.find(x=>x.user_id===stuId);
  const v=prompt(`«${s.last_name} ${s.first_name}» оқушысы және оның барлық нәтижелері біржола өшіріледі. Бұл әрекетті қайтару мүмкін емес.\n\nРастау үшін оқушының логинін жазыңыз: ${s.login}`);
  if(v===null) return; if(v.trim().toLowerCase()!==s.login){ toast("Логин сәйкес келмеді. Оқушы өшірілмеді."); return; }
  const {error}=await sb.rpc("teacher_delete_student",{p_student:s.user_id});
  if(error){ toast(sbErr(error)); return; }
  toast("Оқушы өшірілді"); await loadClass(cur); view="class"; route();
}

/* ---------- Іске қосу ---------- */
(async function(){
  if(!SB_CFG || !window.supabase){ app.innerHTML=`<p class="sub">Кабинет тек сайтта жұмыс істейді.</p>`; return; }
  sb=window.supabase.createClient(SB_CFG.url, SB_CFG.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"tilkz-auth"}});
  const {data:{session}}=await sb.auth.getSession();
  if(session) start(session.user); else renderAuth();
})();
</script>
