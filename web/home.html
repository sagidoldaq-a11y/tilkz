/* Визитка: сол жақта портрет, оң жақта аты-жөні мен байланыс; астында жетістіктер, тәжірибе, курстар */
:root{
  --paper:#F4F6F9; --panel:#FFFFFF; --ink:#18212E; --muted:#596476; --line:#DCE1E8;
  --accent:#1D5BA6; --accent-soft:#E3ECF7; --night:#18212E; --night-ink:#E9EEF5; --gold:#E7B53C;
  --wa:#1F9D55;
  --f-text:"PT Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --night:#0B1017; --night-ink:#E9EEF5; --wa:#3CC07A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --night:#0B1017; --night-ink:#E9EEF5; --wa:#3CC07A; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink)}
/* Мәтін теретін өрістерден басқа жерде жыпылықтаған курсор (каретка) көрінбейді */
body{caret-color:transparent}
input,textarea,select,[contenteditable="true"]{caret-color:auto}

body{font-family:var(--f-ui);font-size:16px;line-height:1.55}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* Жоғарғы жолақ */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px}
.brand{font-family:var(--f-ui);font-weight:800;font-size:21px;letter-spacing:-.3px;text-decoration:none}
.brand span{color:var(--accent)}
.tools{display:flex;align-items:center;gap:8px}
.themebtn{width:36px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:999px;display:grid;place-items:center;font-size:16px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Визитка */
.card{background:var(--night);color:var(--night-ink);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr)}
.photo{background:#fff;position:relative;min-height:100%}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.who{padding:40px 40px 34px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:600}
.who h1{font-family:var(--f-text);font-size:clamp(34px,5vw,52px);line-height:1.08;margin:0;text-wrap:balance}
.lead{margin:0;color:#C9D3DF;font-size:17px;max-width:46ch}
.contacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.cbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.cbtn:hover{background:rgba(255,255,255,.12)}
.cbtn.wa{background:var(--wa);border-color:var(--wa)}
.cbtn svg{width:18px;height:18px;flex:0 0 auto}

/* Жетістіктер */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font-family:var(--f-text);font-size:30px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat{display:flex;flex-direction:column;justify-content:flex-start}
.stat .lbl{order:-1;font-size:14px;color:var(--muted);margin-bottom:2px}

section{margin-top:44px}
h2{font-family:var(--f-text);font-size:26px;margin:0 0 16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.box p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;background:var(--paper)}
.works{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.works li{display:flex;gap:10px;align-items:flex-start}
.works li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--gold);margin-top:9px}

/* Курстар */
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.course{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.course.main{border:2px solid var(--accent)}
.tag{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.course h3{font-family:var(--f-text);font-size:21px;margin:0;line-height:1.25}
.course p{margin:0;color:var(--muted);font-size:15px}
.course ul{margin:0;padding-left:18px;font-size:15px;color:var(--ink)}
.course li{margin-bottom:4px}
.sub{border-top:1px dashed var(--line);padding-top:10px}
.sub b{display:block;font-size:14px;margin-bottom:2px}
.sub span{font-size:14px;color:var(--muted)}
.course .go{margin-top:auto;display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:11px 14px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid var(--accent);color:var(--accent)}
.course .go.primary{background:var(--accent);color:#fff}
.note{margin-top:12px;color:var(--muted);font-size:15px}
.note a{color:var(--wa);font-weight:700}

/* Байланыс */
.clist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.citem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.citem .ic{flex:0 0 40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.citem .ic svg{width:20px;height:20px}
.citem .tx{min-width:0;flex:1}
.citem small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.citem a{font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
footer{margin:48px 0 28px;color:var(--muted);font-size:13px;text-align:center}

/* Кең экранда жоғарғы бөліктегі аты-жөні мен мәтін оң жақтағы бос орынның ортасында тұрады */
@media (min-width:1000px){
  .who{justify-content:center;align-items:center;text-align:center}
  .lead{max-width:52ch}
  .contacts{justify-content:center}

/* Үлкен экран: визитка кеңірек әрі қаріптері сәл ірірек (курс бетімен үйлесімді) */
@media (min-width:1400px){

  .brand{font-size:22px} .seg button{font-size:14px}

  .who h1{font-size:clamp(52px,3.6vw,64px)}

  .who{padding:48px 56px 42px;gap:18px}
  .lead{font-size:19px}
  .cbtn{font-size:15.5px;padding:11px 16px}
  .stat b{font-size:34px} .stat span,.stat .lbl{font-size:15.5px}
  h2{font-size:30px} .box h3{font-size:14px}
  .chip{font-size:15.5px;padding:7px 14px}
  .tag{font-size:13px}
  .course h3{font-size:24px} .course p,.course ul{font-size:16.5px}
  .sub b,.sub span{font-size:15.5px}
  .note{font-size:16.5px} .citem small{font-size:13px} .copy{font-size:14px}
  footer{font-size:14px}
}
@media (max-width:860px){
  .card{grid-template-columns:minmax(0,1fr)}
  .photo{height:min(92vw,420px)}
  .who{padding:24px 20px 24px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat b{font-size:24px;white-space:nowrap}
  .two,.courses,.clist{grid-template-columns:minmax(0,1fr)}
  section{margin-top:34px}
}
</style>

// Тіл барлық беттерге ортақ: қолданушы өзі ауыстырмайынша өзгермейді
let lang="ru"; try{ const l=localStorage.getItem("tilkz-lang")||localStorage.getItem("tilkz-home-lang"); if(l==="kk"||l==="ru") lang=l; }catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const waLink=t=>`https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
function render(){
  const L=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent=L[el.dataset.t]; });
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.getElementById("price").innerHTML=esc(L.price).replace("{wa}",`<a href="${waLink(L.waPrice)}" target="_blank" rel="noopener">${esc(L.priceWa)}</a>`);
  document.getElementById("go2").href=waLink(L.waKids);
  document.getElementById("go3").href=waLink(L.waCorp);
  document.getElementById("contacts").innerHTML=
    `<a class="cbtn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">${ICON.wa}WhatsApp</a>
     <a class="cbtn" href="https://t.me/${TG}" target="_blank" rel="noopener">${ICON.tg}Telegram</a>
     <a class="cbtn" href="https://instagram.com/${IG}" target="_blank" rel="noopener">${ICON.ig}Instagram</a>
     <a class="cbtn" href="mailto:${MAIL}">${ICON.mail}Email</a>`;
  const rows=[["wa",`https://wa.me/${WA}`,PHONE,PHONE],["tg",`https://t.me/${TG}`,"@"+TG,"@"+TG],["ig",`https://instagram.com/${IG}`,IG,IG],["mail",`mailto:${MAIL}`,MAIL,MAIL]];
  document.getElementById("clist").innerHTML=rows.map(([k,href,show,val])=>
    `<div class="citem"><span class="ic">${ICON[k]}</span><div class="tx"><small>${L.lbl[k]}</small><a href="${href}" ${k==="mail"?"":'target="_blank" rel="noopener"'}>${esc(show)}</a></div>
     <button type="button" class="copy" data-copy="${esc(val)}">${L.copy}</button></div>`).join("");
}
document.querySelector(".seg").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(!b) return; lang=b.dataset.lang; try{localStorage.setItem("tilkz-lang",lang);}catch(e){} render(); });
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-copy]"); if(!b) return;
  try{ await navigator.clipboard.writeText(b.dataset.copy); b.textContent=T[lang].copied; setTimeout(()=>b.textContent=T[lang].copy,1500); }
  catch(err){ const r=document.createRange(); r.selectNodeContents(b.previousElementSibling.querySelector("a")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
});
/* Жарық / қараңғы тақырып: таңдау сақталады, әйтпесе құрылғының баптауы */
const themeBtn=document.getElementById("themeBtn");
const isDark=()=>{ const t=document.documentElement.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function paintTheme(){ const d=isDark(); themeBtn.textContent=d?"☀":"☾";
  const lbl=lang==="ru"?(d?"Светлая тема":"Тёмная тема"):(d?"Жарық тақырып":"Қараңғы тақырып"); themeBtn.title=lbl; themeBtn.setAttribute("aria-label",lbl); }
themeBtn.addEventListener("click",()=>{ const t=isDark()?"light":"dark"; document.documentElement.dataset.theme=t; try{localStorage.setItem("tilkz-theme",t);}catch(e){} paintTheme(); });
const _render=render; render=function(){ _render(); paintTheme(); };
render();
</script>
