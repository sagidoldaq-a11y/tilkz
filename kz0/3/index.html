function current(){

  const r=ROUNDS[S.ri]; return {r,it:r.items[S.qi],ri:S.ri,qi:S.qi,key:S.ri+":"+S.qi};
}
let tries=0, wrongs=[];
function taskScreen(){

function pickTask(head,r,it){

   ${it.p?`<div class="prompt" ${(it.prompt_ru||r.prompt_ru)?"":'lang="kk"'}>${esc(it.p)}</div>`:""}

  });
}

   <div class="slots" id="slots" lang="kk"><span class="ph">Нажимай на слова</span></div>
   <div class="tiles" id="tiles" lang="kk">${words.map((w,i)=>`<button class="tile" type="button" data-i="${i}">${esc(w)}</button>`).join("")}</div>
   <div class="actionbar"><div class="in" style="display:flex;gap:10px"><button class="btn" id="clr" type="button">Стереть</button><button class="btn primary" style="flex:1" id="chk" type="button" disabled>Проверить</button></div></div>`;
  wireBuild(words,built,it.a.length,()=>built.map(i=>words[i]).join(" "),it.a.join(" "),it," ");
}
function wireBuild(src,built,need,getStr,target,it,sep){
  const slots=document.getElementById("slots"), tiles=document.getElementById("tiles"), chk=document.getElementById("chk"), clr=document.getElementById("clr");
  function paint(){
    slots.className="slots";
    slots.innerHTML=built.length?built.map((i,k)=>`<button class="tile" type="button" data-k="${k}">${esc(src[i])}</button>`).join(""):`<span class="ph">${sep?"Нажимай на слова":"Нажимай на буквы"}</span>`;
    tiles.querySelectorAll(".tile").forEach(t=>t.classList.toggle("used",built.includes(+t.dataset.i)));
    chk.disabled=built.length!==need;
    slots.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{built.splice(+t.dataset.k,1); paint();});
  }
  tiles.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const i=+t.dataset.i; if(built.includes(i))return; built.push(i); paint();});
  clr.onclick=()=>{built.length=0; paint();};
  chk.onclick=()=>{
    const ok=getStr()===target;
    if(ok){ slots.classList.add("ok"); lock(); answer(true,it); }
    else{ tries++; wrongs.push(getStr()); slots.classList.add("bad");
      if(tries>=2){ lock(); answer(false,it,getStr(),target); }
      else { softWrong(()=>{built.length=0; paint();}); } }
  };
  function lock(){ tiles.querySelectorAll(".tile").forEach(t=>t.disabled=true); slots.querySelectorAll(".tile").forEach(t=>t.disabled=true); chk.disabled=true; clr.disabled=true; }
  paint();
}

/* ---------- scoring ---------- */
const PRAISE=["Дұрыс!","Жарайсың!","Керемет!","Тамаша!","Өте жақсы!","Міне, солай!"];
function softWrong(after){
  showSheet("bad","Почти!","Попробуй ещё раз — у тебя есть вторая попытка.","Ещё раз",()=>{hideSheet(); if(after)after();});
}
function answer(ok,it,given,target){
  const {key}=current();
  const firstTime=!S.log.some(l=>l.k===key);
  let gain=0, bonus=0;
  if(ok){
    gain = tries===0?10:5;
    if(S.inRetry) gain = 3;
    S.streak = tries===0 ? S.streak+1 : 0;
    if(S.streak>0 && S.streak%3===0){bonus=5;}
    S.best=Math.max(S.best,S.streak);
  } else S.streak=0;
  S.pts+=gain+bonus;
  if(firstTime){ S.log.push({k:key,first:ok&&tries===0,ok});
    const {r}=current(); S.dirty[it.id]={item_id:it.id, skill:it.skill||r.skill, level:1, tries:wrongs.slice(), status:ok?"ok":"revealed", first_correct:ok&&tries===0}; }
  if(firstTime && ok && tries===0) S.first++;
  if(!S.inRetry && !(ok&&tries===0) && !S.retry.includes(key)) S.retry.push(key);
  save(); paintTop(); flush();
  const ans=target||it.a, ru=it.pic&&PIC_RU[it.a]?` — ${PIC_RU[it.a]}`:"";
  if(ok){
    showSheet("ok",pick(PRAISE)+(bonus?" 🔥":""),`<span class="pts">+${gain}</span>${bonus?` и <span class="pts">+${bonus}</span> за серию из ${S.streak}!`:""} <span lang="kk">${esc(Array.isArray(ans)?ans.join(" "):ans)}</span>${esc(ru)}`,"Дальше",next);
  } else {
    showSheet("bad","Ничего страшного!",`Правильно: <b lang="kk">${esc(Array.isArray(ans)?ans.join(" "):ans)}</b>${esc(ru)}.${S.inRetry?" Запомни этот ответ!":" Это задание вернётся в конце, и ты его победишь."}`,"Дальше",next);
  }
}
function next(){
  hideSheet();
  if(S.inRetry){
    S.qi++;
    if(S.qi>=S.retry.length){S.inRetry=false; S.phase="about";}
    save(); return render();
  }
  S.qi++;
  if(S.qi>=ROUNDS[S.ri].items.length){
    S.ri++; S.qi=0;
    if(S.ri>=ROUNDS.length){ S.phase=S.retry.length?"retryIntro":"about"; }
    else S.phase="intro";
  }
  save(); render();
}
function retryIntro(){
  app.innerHTML=`<div class="big" aria-hidden="true">🔁</div><h1 class="center">Работа над ошибками</h1>
  <p class="center muted">Вернёмся к ${S.retry.length} ${ruN(S.retry.length,"заданию","заданиям","заданиям")}, где была ошибка. Каждое исправление: <b>+3</b>. Так слова запоминаются лучше всего.</p>
  <div class="actionbar"><div class="in"><button class="btn primary block" id="go" type="button">Исправить ошибки</button></div></div>`;
  document.getElementById("go").onclick=()=>{S.inRetry=true; S.qi=0; S.phase="task"; save(); render();};
}
function aboutScreen(){
  app.innerHTML=`<p class="eyebrow">Бонус · +20</p><div class="big" aria-hidden="true">✍️</div>
  <h1 class="center">${esc(M.about.title)}</h1>
  <p class="center muted">Напиши 3 предложения по-казахски. Используй образцы.</p>
  <div class="rule" style="margin-bottom:12px"><span aria-hidden="true">📌</span><span lang="kk">${esc(M.about.frame)}</span></div>
  <textarea id="ab" lang="kk" placeholder="${esc(M.about.placeholder)}">${esc(S.about)}</textarea>
  <p class="muted" style="margin-top:10px;font-size:15px">Учитель проверит твои предложения. А ещё запиши их голосом и отправь аудио учителю в WhatsApp.</p>
  <div class="actionbar"><div class="in" style="display:flex;gap:10px"><button class="btn" id="skip" type="button">Пропустить</button><button class="btn primary" style="flex:1" id="go" type="button" disabled>Готово</button></div></div>`;
  const ab=document.getElementById("ab"), go=document.getElementById("go");
  const cnt=()=>ab.value.split(/[.!?]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=2).length;
  const upd=()=>{S.about=ab.value; go.disabled=cnt()<1; save();}; upd(); ab.oninput=upd;
  go.onclick=()=>{ if(!S.aboutDone){ const n=Math.min(3,cnt()); S.pts+=n>=3?20:n*5; S.aboutDone=true; } S.phase="result"; save(); render(); };
  document.getElementById("skip").onclick=()=>{S.phase="result"; save(); render();};
}
function ruN(n,a,b,c){const m=n%10,h=n%100;return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<12||h>14))?b:c;}
function resultScreen(){
  const pct=Math.round(100*S.first/TOTAL);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  let emoji,title,msg;
  const nm=S.name?esc(S.name):"";

    msg=`Это потрясающий результат: ${S.first} из ${TOTAL} с первой попытки! ${M.win} Так учатся настоящие чемпионы. Учитель будет очень гордиться тобой!`;}
  else if(pct>=70){emoji="🌟";title=`Жарайсың${nm?", "+nm:""}!`;
    msg=`Очень сильно: ${S.first} из ${TOTAL} с первой попытки! Ты уже уверенно знаешь слова урока и умеешь строить фразы. Ещё чуть-чуть, и будет максимум!`;}
  else if(pct>=50){emoji="💪";title=`Жақсы бастама${nm?", "+nm:""}!`;

  else {emoji="🌱";title=`Рахмет за старание${nm?", "+nm:""}!`;
    msg=`Казахский язык для тебя новый, и ошибаться сейчас нормально: так растёт мозг. Ты дошёл(ла) до конца и исправил(а) ошибки, это главное. Пройди задание ещё раз завтра: увидишь, насколько станет легче!`;}
  S.bestScore=Math.max(S.bestScore||0,S.pts); if(!S.finDone){S.finDirty=true; S.finDone=true;} save(); flush().then(paintSaved);
  const miss=S.retry.map(k=>{const [ri,qi]=k.split(":").map(Number); const it=ROUNDS[ri].items[qi]; const a=Array.isArray(it.a)?it.a.join(" "):it.a; const q=it.p?it.p.replace(/ → \?$/,""):(PIC_RU[it.a]||it.pic); return `<div>${esc(q)} → <b lang="kk">${esc(a)}</b></div>`;}).join("");
  const report=`Домашнее задание · Урок ${M.n} «${M.ru}»\nУченик: ${S.name||"—"}\nС первой попытки: ${S.first}/${TOTAL} (${pct}%)\nОчки: ${S.pts}\nЛучшая серия: ${S.best}\nОшибки: ${S.retry.length}\n${M.about.label}: ${S.about.trim()||"—"}`;
  app.innerHTML=`<div class="big" aria-hidden="true">${emoji}</div>

  <p class="center">${msg}</p>
  <div class="tally"><div><b>${S.pts}</b><span>очков</span></div><div><b>${S.first}/${TOTAL}</b><span>с 1-й попытки</span></div><div><b>${S.best}</b><span>лучшая серия</span></div></div>
  ${miss?`<h2>Запомни</h2><div class="mistakes">${miss}</div>`:""}
  <div class="stack" style="margin-top:18px">
    <div class="saved wait" id="saved">Сохраняем результат…</div>
    <a class="btn primary block" id="send" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(report)}">Отправить голосовое учителю</a>
    <p class="muted center" style="font-size:14px;margin:0">Прочитай вслух свои предложения и отправь аудио в WhatsApp: +7 708 214 12 26</p>
    <button class="btn block" id="again" type="button">Пройти ещё раз</button>
    <a class="btn block" href="slides/">Повторить презентацию урока</a>
  </div>`;
  document.getElementById("again").onclick=()=>{const nm=S.name, bs=Math.max(S.bestScore||0,S.pts); S=fresh(); S.name=nm; S.bestScore=bs; S.phase="intro"; save(); render(); window.scrollTo({top:0});};
  if(stars>=2) confetti();
}

/* ---------- sheet ---------- */
let sheetCb=null;
function showSheet(kind,title,html,btn,cb){sheet.className="sheet show "+kind; shT.textContent=title; shX.innerHTML=html; shN.textContent=btn; sheetCb=cb; setTimeout(()=>shN.focus(),50);}
function hideSheet(){sheet.className="sheet";}
shN.onclick=()=>{const cb=sheetCb; sheetCb=null; if(cb)cb();};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&sheet.classList.contains("show")&&document.activeElement!==shN){e.preventDefault();shN.click();}});

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"), x=c.getContext("2d"); c.hidden=false;
  c.width=innerWidth; c.height=innerHeight;
  const cols=["#1F56A8","#E9A800","#0F7A55","#E0603F","#5B92E5"];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,a:Math.random()*6,c:pick(cols)}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});
    if(++t<220)requestAnimationFrame(f); else c.hidden=true;})();
}

/* ---------- аккаунт aitil: вход, регистрация, сохранение результатов ---------- */
const normPhone=v=>{let d=(v||"").replace(/\D/g,""); if(d.length===11&&d[0]==="8")d="7"+d.slice(1); if(d.length===10)d="7"+d; return /^7\d{10}$/.test(d)?d:null;};
const loginEmail=v=>{v=v.trim().toLowerCase(); if(v.includes("@"))return v; if(!/[a-z]/.test(v)){const ph=normPhone(v); if(ph)v=ph;} return v+"@"+LOGIN_DOMAIN;};
let authMode="reg", authBusy=false;
function authScreen(){
  const reg=authMode==="reg";
  const grades=`<option value="" selected disabled>— класс —</option>`+[4,5,6,7,8,9,10,11].map(n=>`<option value="${n}">${n} класс</option>`).join("");
  app.innerHTML=`<p class="eyebrow">Қазақша. Старт · Урок ${M.n}</p>
  <h1>${reg?"Зарегистрируйся, чтобы начать":"Войди, чтобы продолжить"}</h1>
  <p class="muted">${reg?"Так учитель увидит твои очки и ошибки, а прогресс сохранится на любом устройстве.":"Номер WhatsApp и пароль, которые ты указал(а) при регистрации."}</p>
  <div class="card">
    <div class="tabs" role="group"><button type="button" data-am="reg" aria-pressed="${reg}">Регистрация</button><button type="button" data-am="login" aria-pressed="${!reg}">Вход</button></div>
    ${reg?`<form class="af" id="regForm" novalidate>
      <div class="row2"><label>Имя<input name="first_name" maxlength="60" autocomplete="given-name" required></label><label>Фамилия<input name="last_name" maxlength="60" autocomplete="family-name" required></label></div>
      <label>Класс<select name="grade" required>${grades}</select></label>
      <label>Твой номер WhatsApp<input name="phone" type="tel" inputmode="tel" autocomplete="username" value="+7 " required><span class="hint">Если своего номера нет, укажи номер родителей. Этот номер — твой логин.</span></label>
      <label>Номер WhatsApp родителей<input name="parent_phone" type="tel" inputmode="tel" autocomplete="off" value="+7 " required></label>
      <label>Придумай пароль<input name="password" type="password" autocomplete="new-password" required><span class="hint">Не меньше 6 символов. Запиши его, чтобы не забыть.</span></label>
      <span class="hint">Регистрируясь, ты и родители соглашаетесь с <a href="../../privacy/" target="_blank" rel="noopener">политикой конфиденциальности</a>.</span>
      <p class="err" role="alert"></p>
      <button class="btn primary block" type="submit">Зарегистрироваться</button></form>`
    :`<form class="af" id="loginForm" novalidate>
      <label>Номер WhatsApp или логин<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" value="+7 " required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" role="alert"></p>
      <button class="btn primary block" type="submit">Войти</button></form>`}
  </div>`;
  app.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{authMode=b.dataset.am; render();});
  app.querySelectorAll("input[type=tel],input[name=login]").forEach(el=>el.addEventListener("input",()=>fmtPhone(el)));
  app.querySelector("form").addEventListener("submit",onAuthSubmit);
}
function fmtPhone(el){
  const v=el.value; if(/[a-zA-Z]/.test(v)){el.value=v.replace(/^\+7\s*/,""); return;}
  let d=v.replace(/^\+7\s*/,"").replace(/\D/g,""); if(d.length>10)d=d.slice(d.length-10);
  el.value=!d?"+7 ":"+7 "+d.slice(0,3)+(d.length>3?" "+d.slice(3,6):"")+(d.length>6?" "+d.slice(6,8):"")+(d.length>8?" "+d.slice(8,10):"");
}
async function onAuthSubmit(e){
  e.preventDefault(); if(authBusy||!sb) return;
  const form=e.target, f=Object.fromEntries(new FormData(form)); for(const k in f) f[k]=String(f[k]).trim();
  const btn=form.querySelector("button[type=submit]"), err=form.querySelector(".err"), label=btn.textContent;
  const fail=m=>{authBusy=false; err.textContent=m; btn.disabled=false; btn.textContent=label;};
  authBusy=true; err.textContent=""; btn.disabled=true; btn.textContent="Загрузка…";
  const NET="Нет связи. Проверь интернет и попробуй ещё раз.";
  try{
    if(form.id==="loginForm"){
      if(!f.login||!f.password) return fail("Заполни номер и пароль.");
      const {data,error}=await sb.auth.signInWithPassword({email:loginEmail(f.login),password:f.password});
      if(error) return fail(/fetch|network/i.test(error.message)?NET:"Неверный номер или пароль.");
      authBusy=false; return enterAs(data.user);
    }
    if(!f.first_name||!f.last_name||!f.grade||!f.password) return fail("Заполни все поля.");
    const ph=normPhone(f.phone), pph=normPhone(f.parent_phone);
    if(!ph) return fail("Проверь свой номер. Пример: +7 701 123 45 67");
    if(!pph) return fail("Проверь номер родителей. Пример: +7 701 123 45 67");
    if(f.password.length<6) return fail("Пароль должен быть не короче 6 символов.");
    const l=await sb.rpc("login_available",{p_login:ph}); if(l.error) return fail(NET);
    if(!l.data) return fail("С этим номером уже есть аккаунт. Открой вкладку «Вход».");
    const {data,error}=await sb.auth.signUp({email:loginEmail(ph),password:f.password,
      options:{data:{role:"student",mode:"open",phone:ph,parent_phone:pph,first_name:f.first_name,last_name:f.last_name,grade:f.grade,consent:"true"}}});
    if(error) return fail(/fetch|network/i.test(error.message)?NET:/registered|exists/i.test(error.message)?"С этим номером уже есть аккаунт. Открой вкладку «Вход».":"Не получилось зарегистрироваться. Проверь данные и попробуй ещё раз.");
    if(!data.session) return fail("Регистрация не завершена. Напиши учителю.");
    authBusy=false; return enterAs(data.user);
  }catch(x){ console.warn(x); fail(NET); }
}
async function enterAs(user){
  let prof=null; try{ const r=await sb.from("students").select("first_name,last_name").eq("user_id",user.id).maybeSingle(); prof=r.data||null; }catch(e){}
  USER=user; PROFILE=prof; KEY=`${HW.bank_id}-v1:`+user.id; loadState();
  S.name=(PROFILE&&PROFILE.first_name)||S.name||"";
  if(S.phase==="start"&&S.log.length) S.phase="start";
  save(); render(); window.scrollTo({top:0}); flush();
}
async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }

/* ответы уходят в общую базу aitil (attempts / answers) — учитель видит их в кабинете */
let flushing=null, again=false;
function flush(){
  if(!USER||!sb) return Promise.resolve(false);
  if(flushing){ again=true; return flushing; }
  flushing=(async()=>{
    let ok=true;
    do{ again=false;
      const rows=Object.values(S.dirty||{});
      if(!rows.length && !S.finDirty) break;
      if(!S.attempt){
        const {data,error}=await sb.from("attempts").insert({bank_id:HW.bank_id,mode:"practice"}).select("id").single();
        if(error){ console.warn(error); ok=false; break; }
        S.attempt=data.id; save();
      }
      if(rows.length){
        const now=new Date().toISOString();
        const {error}=await sb.from("answers").upsert(rows.map(r=>({...r,attempt_id:S.attempt,bank_id:HW.bank_id,updated_at:now})));
        if(error){ console.warn(error); ok=false; break; }
        rows.forEach(r=>{ if(S.dirty[r.item_id]===r) delete S.dirty[r.item_id]; }); save();
      }
      if(S.finDirty){
        const {error}=await sb.from("attempts").update({finished_at:new Date().toISOString(),first_correct:S.first,total:TOTAL}).eq("id",S.attempt);
        if(error){ console.warn(error); ok=false; break; }
        S.finDirty=false; save();
      }
    } while(again);
    return ok && !Object.keys(S.dirty||{}).length && !S.finDirty;
  })().catch(e=>{console.warn(e); return false;}).finally(()=>{flushing=null;});
  return flushing;
}
function paintSaved(ok){
  const el=document.getElementById("saved"); if(!el) return;
  if(ok){ el.className="saved"; el.textContent="✓ Результат сохранён. Учитель его видит."; }
  else { el.className="saved wait"; el.textContent="Результат сохранится, когда появится интернет."; }
}
addEventListener("online",()=>flush().then(paintSaved));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") flush(); });

async function boot(){
  if(SB_CFG && window.supabase){
    sb=window.supabase.createClient(SB_CFG.url,SB_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"tilkz-auth"}});
    try{ const {data:{session}}=await sb.auth.getSession(); if(session) return enterAs(session.user); }catch(e){ console.warn(e); }
    let had=false; try{ had=!!localStorage.getItem("tilkz-auth"); }catch(e){}
    authMode=had?"login":"reg";
  } else {
    app.innerHTML=`<p class="muted">Не удалось загрузить платформу. Обнови страницу.</p>`; return;
  }
  render();
}
app.innerHTML=`<p class="muted center" style="margin-top:40px">Загрузка…</p>`;
boot();

})();
