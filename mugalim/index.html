: {"A": "әке тағаны баланың бас тартқанынан кейін ғана сатты.", "C": "бала шиені әкесі тағаны сатып, шие сатып алғаннан кейін ғана терді.", "D": "әкесі ақылды ең соңында айтады, ал бала шиені одан бұрын терді."}, "distractor_notes_ru": {"A": "отец продал подкову только после того, как мальчик отказался её взять.", "C": "мальчик собирал вишни только после того, как отец продал подкову и купил вишни.", "D": "отец даёт совет в самом конце, а мальчик собирал вишни раньше."}, "distractor_evidence": {"A": ["Әкесі үндемеді, тағаны өзі иіліп алды да, жүре берді."], "C": [], "D": ["Ең соңында әкесі тоқтап тұрып айтты:"]}, "keywords": {"ok": {"kk": ["ескі тағаны алып неғылайын", "тағаны соларға үш тиынға сатты", "жерге түскен шиені", "Ең соңында"], "ru": ["зачем мне брать", "продал им ту подкову", "упавшую вишню", "наконец"]}, "A": {"kk": ["тағаны өзі иіліп алды"], "ru": ["сам нагнулся, поднял подкову"]}, "D": {"kk": ["Ең соңында"], "ru": ["наконец"]}}}, {"id": "l2v3-q17", "number": 17, "text_id": "l2v3-t7", "stem": "Бос орынға қай жауап сәйкес келеді?", "options": {"A": "ешкім саған көмектеспейді", "B": "бәрін бірден ала аласың", "C": "көп жұмысқа тап боласың", "D": "тез шаршап қаласың"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["— Көрдің бе, мана тағаны жамансынып жерден бір ғана иіліп көтеріп алуға еріндің, енді сол тағаға алған шиенің жерге түскенін аламын деп бір еңкеюдің орнына он еңкейдің."], "explanation": "Бала бір рет иіліп, тағаны алуға ерінді, кейін шие теремін деп он рет еңкейді. Яғни аз жұмысты қиынсынған адам көп жұмысқа тап болады.", "editor_changes": "", "explanation_ru": "Мальчик поленился нагнуться один раз за подковой, а потом нагибался десять раз за вишнями. Значит, кто ленится сделать малую работу, получает большую.", "distractor_notes": {"A": "әке баланың жалғыз қалатыны туралы айтпайды. Ол бір еңкеюдің орнына он еңкейгенін айтады.", "B": "бұл әкенің ойына қарама-қайшы: бала аз жұмысты істемей, артынан көп еңбек етті.", "D": "әке шаршау туралы емес, жұмыстың көбейгені туралы айтады."}, "distractor_notes_ru": {"A": "отец не говорит, что мальчик останется без помощи. Он говорит, что тот нагнулся десять раз вместо одного.", "B": "это противоречит мысли отца: мальчик не сделал малую работу и потом трудился больше.", "D": "отец говорит не об усталости, а о том, что работы стало больше."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["бір еңкеюдің орнына он еңкейдің"], "ru": ["десять раз вместо одного"]}}}, {"id": "l2v3-q18", "number": 18, "text_id": "l2v3-t8", "stem": "Жалманның сырт келбеті қай жануарға жақын?", "options": {"A": "тышқанға", "B": "кесірткеге", "C": "саршұнаққа", "D": "балапанға"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Тышқанға ұқсас кішілеу кеміргіш."], "explanation": "Мәтінде жалманның тышқанға ұқсас кішілеу кеміргіш екені айтылады.", "editor_changes": "Жақша ішіндегі өлшемдер мен жалманды тапқан ғалым туралы сөйлемдер алынды.", "explanation_ru": "В тексте сказано, что жалман — небольшой грызун, похожий на мышь.", "distractor_notes": {"B": "кесіртке – бауырымен жорғалаушы. Жалман – кеміргіш.", "C": "саршұнақ туралы мәтінде айтылмайды.", "D": "балапан – құстың баласы. Жалман – кеміргіш."}, "distractor_notes_ru": {"B": "ящерица — пресмыкающееся. А жалман — грызун.", "C": "о суслике в тексте не говорится.", "D": "балапан — птенец. А жалман — грызун."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Тышқанға ұқсас"], "ru": ["похожий на мышь"]}}}, {"id": "l2v3-q19", "number": 19, "text_id": "l2v3-t8", "stem": "Мәтіннің соңында автор неге назар аударды?", "options": {"A": "жалманның қандай жемді ерекше жақсы көретініне", "B": "жалманның есімі ғылыми басылымға берілгеніне", "C": "жалманды алғаш тауып алған жас ғалымның есіміне", "D": "жалманның қаншалықты тез көбейетініне"}, "key": "B", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Мұның атымен Қазақстан зоология журналы алынып отыр, онда жаңа және аз зерттелген жануарлар туралы мақалалар жарияланады."], "explanation": "Мәтіннің соңғы сөйлемінде Қазақстан зоология журналының жалманның атымен аталғаны айтылады.", "editor_changes": "", "explanation_ru": "В последнем предложении текста сказано, что именем жалмана назван зоологический журнал Казахстана.", "distractor_notes": {"A": "мәтінде жалманның немен қоректенетіні айтылмайды.", "C": "мәтінде жалманды тапқан ғалымның есімі аталмайды.", "D": "мәтінде жалманның көбеюі туралы айтылмайды. Керісінше, ол сирек кездеседі."}, "distractor_notes_ru": {"A": "в тексте не говорится, чем питается жалман.", "C": "в тексте не называется имя учёного, нашедшего жалмана.", "D": "в тексте не говорится о размножении жалмана. Наоборот, он встречается редко."}, "distractor_evidence": {"A": [], "C": [], "D": ["Ғалымдар үшін оның тіршілік жағдайы жұмбақ болып отыр, ол туралы мәліметтер тырнақтап жиналуда."]}, "keywords": {"ok": {"kk": ["Мұның атымен", "зоология журналы"], "ru": ["его именем", "зоологический журнал"]}, "D": {"kk": ["жұмбақ болып отыр"], "ru": ["остаётся для учёных загадкой"]}}}, {"id": "l2v3-q20", "number": 20, "text_id": "l2v3-t9", "stem": "Мәтіннің негізгі ойы қандай?", "options": {"A": "Көршіге ыдыс-аяқ беруге мүлде болмайды.", "B": "Қонақты әрдайым үлкен қазанмен күту керек.", "C": "Ескі қазанды жаңасына айырбастау керек.", "D": "Ашкөз адам ақырында өзі зиян шегеді."}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["«Бұл жолы да Қожанасыр қазанымның ішіне бір нәрсе салып әкелер», — деп ойлайды араны ашылған бай.", "— Байеке, сөкпеңіз! Туа білген қазан өле де біледі, — дейді."], "explanation": "Бай «қазаным балалады» дегенге сеніп, кішкене қазанды алып қалды, келесі жолы да олжа күтті. Ашкөздігінің салдарынан ол өз қазанынан айырылды. «Араны ашылған» – ашкөз деген сөз.", "editor_changes": "Мәтін қысқартылды (байдың сұрақтары, Қожаның ойлары мен кейбір сөздері алынды, екі төл сөз біріктірілді); «СондықтанҚожанасыр» → «Сондықтан Қожанасыр», «тағыда» → «тағы да».", "explanation_ru": "Бай поверил, что его казан «родил», оставил себе маленький казан и в следующий раз снова ждал прибыли. Из-за жадности он лишился своего казана. «Араны ашылған» значит «жадный».", "distractor_notes": {"A": "әңгімеде ыдыс бермеу туралы ой айтылмайды. Бай қазанынан ашкөздігі үшін айырылды.", "B": "әңгіме қонақ күту туралы емес, байдың ашкөздігі туралы.", "C": "әңгімеде қазан айырбастау туралы айтылмайды."}, "distractor_notes_ru": {"A": "в рассказе нет мысли, что нельзя давать посуду. Бай лишился казана из-за жадности.", "B": "рассказ не о приёме гостей, а о жадности бая.", "C": "в рассказе не говорится об обмене казанов."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["араны ашылған бай", "Туа білген қазан өле де біледі"], "ru": ["жадный бай", "умеет и умирать"]}}}]}, {"bank_id": "kaz-L2-v4", "track": "second_language", "source": "Автордың құрастырған нұсқасы: НЗМ «Қазақ тілі (екінші тіл)» үлгісінің деңгейінде, мәтіндер қазақстандық сайттардан алынған", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {"Оның құрылғысы жасанды интеллект арқылы басқарылады.": "Его устройство управляется с помощью искусственного интеллекта.", "6-сыныптан бастап мен қазақ тілін үйрене бастадым.": "С 6-го класса я начала учить казахский язык.", "Бұл курсқа төрт жастан 64 жасқа дейінгі адамдар келеді.": "На этот курс приходят люди от четырёх до 64 лет.", "Өзім орыс сыныбында оқыдым.": "Я сама училась в русском классе.", "Алматы облысында екі айдан бері қожайынының қабірін күзетіп, мазар басынан кетпеген иттің оқиғасы көпшіліктің жүрегін елжіретті.": "История собаки, которая два месяца охраняла могилу хозяина в Алматинской области и не уходила от неё, тронула сердца многих.", "Бұдан кейін иесіне адал болған жеті қазынаның бірін еріктілер панасына алып Лея деген ат қойыпты.": "После этого волонтёры забрали верную хозяину собаку в приют и назвали её Лея.", "Дәрігерлер денсаулығының жақсы екендігін қуана айтыпты.": "Врачи с радостью сообщили, что её здоровье в порядке.", "Ал, иттің иесі қай жақтан екені және бұған дейін қайда тұрғаны туралы әзірге белгісіз.": "А откуда был хозяин собаки и где она жила раньше, пока неизвестно.", "«Тамақты ары-бері өткендер осында әкеліп беріп тұрдық», – деді елді мекен тұрғыны.": "«Прохожие приносили ей сюда еду», — сказал житель села.", "Шолпы – шашқа тағатын, қымбат бағалы, сылдырмақты бұрым сәнін келтіретін, алтыннан, күмістен жасалатын бұйым.": "Шолпы — дорогое звенящее украшение для волос из золота или серебра, которое украшает косу.", "Қапсырма – әйел қамзолына тағылатын, түйме қызметін атқаратын жалпақ күміс бұйым.": "Қапсырма — плоская серебряная застёжка на женском камзоле, которая служит пуговицей.", "Оқшантай – ішіне шағын зат салатын, кемер белбеуге өткізілген әшекейлі былғары қалта.": "Оқшантай — украшенная кожаная сумочка для мелких вещей, которую носят на поясе.", "Қын – кемер белбеумен бірге тұратын, пышақ салынатын әшекейлі, былғары бұйым.": "Қын — украшенные кожаные ножны для ножа, которые носят вместе с поясом.", "Сырға – құлаққа тағатын сәнді асыл бұйым.": "Сырға — нарядное драгоценное украшение для ушей.", "Ғылыми қызметімде маған көмектесетін негізгі әдеттердің бірі — әр таң сайын кофе ішіп отырып ғылыми әдебиеттерді оқу.": "Одна из главных привычек, которая помогает мне в научной работе, — каждое утро за кофе читать научную литературу.", "Жоғары сыныпта мен ядролық физик болуды армандадым, бірақ бірқатар себептермен бұл арманыма қол жеткізе алмадым.": "В старших классах я мечтала стать физиком-ядерщиком, но по ряду причин не смогла осуществить эту мечту.", "Оқудың бірінші жылы аяқталғаннан кейін мен бакалавр дәрежесін «Генетика» мамандығы бойынша алу үшін Англияға кеттім.": "После первого года учёбы я уехала в Англию, чтобы получить степень бакалавра по специальности «Генетика».", "Мен Семей қаласында дәрігер отбасында дүниеге келдім.": "Я родилась в Семее в семье врачей.", "Қазақстандағы ғылымның дамуын бес жыл бұрынғы және бүгінгі жағдаймен салыстырғанда, үлкен айырмашылықты байқауға болады.": "Если сравнить развитие науки в Казахстане пять лет назад и сегодня, можно заметить большую разницу.", "Менің негізгі кеңесім: «Жаңа нәрседен қорықпаңыз».": "Мой главный совет: «Не бойтесь нового».", "Өзіңізді жетілдіруге ұмтылу, сыни ойлауды дамыту және сұрақ қоюдан ұялмау керек.": "Нужно стремиться к самосовершенствованию, развивать критическое мышление и не стесняться задавать вопросы.", "Менің бакалавриаттағы профессорым айтқандай: «Ақылсыз сұрақтар болмайды, оларды сұраудан қорқу ақымақтық».": "Как говорил мой профессор в бакалавриате: «Глупых вопросов не бывает, глупо бояться их задавать».", "Мен студенттермен және оқушылармен жұмыс істеуді ұнатамын.": "Мне нравится работать со студентами и школьниками.", "Осыны бақылап тұрған адам көбелекке жәрдемдескісі келіп, қолына бәкі алып пілләні кесіп, кішкене тесікті кеңейтті.": "Наблюдавший за этим человек захотел помочь бабочке: он взял нож, разрезал кокон и расширил маленькое отверстие.", "Көбелек өзінің әлсіз денесін жер бауырлап сүйретіп жүріп, қанаты жетілмеген күйде қалған өмірін өткізді.": "Бабочка всю оставшуюся жизнь ползала по земле, волоча слабое тело, с неразвитыми крыльями.", "Ол сол бойы ұша алмады.": "Она так и не смогла взлететь.", "Көбелек бірден сыртқа шықты.": "Бабочка сразу вышла наружу.", "Адам көбелектің қимылын бақылап тұрып, сәлден соң-ақ көбелектің қанаты қатайып, ұшып кетер деп ойлады.": "Человек смотрел на бабочку и думал, что скоро её крылья окрепнут и она улетит.", "Сейіт орам үстінде жүгіріп бара жатқанда, бір арбалы келіп, аңдаусыз соғып кетіп, аяғын сындырыпты.": "Когда Сеит бежал по улице, человек на телеге нечаянно сбил его и сломал ему ногу.", "Ойбайлап жылап жатқан баланы көріп шошынғаннан шешесі есінен танып қалыпты.": "Увидев плачущего мальчика, мать от испуга потеряла сознание.", "— Аяғың ауырмай ма, қабағыңды да шытпайсың? — деп сұрады.": "— Разве тебе не больно? Ты даже не морщишься, — спросил он.", "Сейіт, шешесі шығып кеткен соң демін алып, сынықшыға сыбырлап айтты дейді:": "Когда мать вышла, Сеит перевёл дух и шёпотом сказал костоправу:", "— Ауырмақ түгіл, жаным көзіме көрініп тұр, бірақ менің жанымның қиналғанын көрсе, ___(17)___, шыдап жатырмын, — деді.": "— Не то что больно — я едва терплю, но если она увидит, как я мучаюсь, ___(17)___, поэтому я терплю, — сказал он.", "Мұны көрген соң, Сейіт жыламақ түгіл, сынған аяғын орнына салып, таңып жатқанда да дыбысын шығармай, қабағын да шытпай жатты.": "Увидев это, Сеит не только перестал плакать, но даже когда ему вправляли и перевязывали ногу, не издал ни звука и не поморщился.", "Басы аса үлкен емес, мойны өте ұзын, бірақ мойын омыртқасының саны — жетеу.": "Голова у него небольшая, шея очень длинная, но шейных позвонков всего семь.", "Қазіргі кезде жирафтар, негізінен, ұлттық саябақтарда кездеседі.": "В наше время жирафы встречаются в основном в национальных парках.", "Ол осылай ойлап отырғанында басына тарс етіп бір жаңғақ түседі.": "Пока он так думал, ему на голову со стуком упал орех.", "Шекесі қызарып қалған Қожа жаңғаққа бір, асқабаққа бір қарап: «Тәубә, сөзімді кері алдым. Астында отырған мына ағаш асқабақ ағашы болғанда қайтер едім», – деген екен.": "Потирая покрасневший висок, Ходжа посмотрел то на орех, то на тыкву и сказал: «Слава Богу, беру свои слова назад. Что было бы, если бы дерево, под которым я сижу, было тыквенным!»"}, "style_notes": [], "texts": [{"id": "l2v4-t1", "title": "", "source_note": "24KZ: «Оқушы дронды физикалық тосқауылдан қорғайтын басқару жүйесін ойлап тапты» – https://24.kz/kz/zha-aly-tar/bilim-zh-ne-ylym/768262-okusy-drondy-fizikalyk-toskauyldan-korgajtyn-baskaru-zujesin-ojlap-tapty", "numbered_paragraphs": false, "paragraphs": ["Петропавлдық оқушы дронды физикалық тосқауылдан қорғайтын басқару жүйесін ойлап тапты.", "11-сынып оқушысы Әлібек Сейітқазин дронды радиоэлектронды оқшаулау кезінде де ұшырудың жолын ойлап тапқан. Оның құрылғысы жасанды интеллект арқылы басқарылады. Жазылған бейнені де лазермен жеткізеді.", "Дрон 7 шақырымға дейін лазермен басқарылады. Физикалық жоба Астанада өткен халықаралық байқауда үшінші орын иеленді."]}, {"id": "l2v4-t2", "title": "", "source_note": "24KZ: «Ақтөбе облысында шешен қызы қазақ тілін үйретіп жүр» – https://24.kz/kz/zha-aly-tar/kogam/764739-aktobe-oblysynda-sesen-kyzy-kazak-tilin-ujretip-zur", "numbered_paragraphs": false, "paragraphs": ["Шешен қызы қазақ тілін үйретіп жүр. Мемлекеттік тілді жіті меңгерген ақтөбелік ару жерлестерін төл тілімізге баулып жүр.", "Оның «қазақ vibe» деп аталатын оқу курсында еңбектеген баладан еңкейген қарияға дейін тіл сындырады. Ал Ализа Кайхарова: «Қазақ тілін білу – Қазақстан азаматы ретінде міндетім», – дейді.", "Ализа Кайхарова, Ақтөбе облысының тұрғыны: – 6-сыныпқа дейін мен мүлдем қазақ тілін білген жоқпын. Өзім орыс сыныбында оқыдым. 6-сыныптан бастап мен қазақ тілін үйрене бастадым. Одан кейін, 19 жасымда өзімнің «қазақ vibe» атты курсымды аштым. Бұл курсқа төрт жастан 64 жасқа дейінгі адамдар келеді."]}, {"id": "l2v4-t3", "title": "", "source_note": "KAZ.NUR.KZ: «Қазақтың Хатикосы»: Екі ай бойы иесінің қабірін күзеткен ит елдің жүрегін елжіретті – https://kaz.nur.kz/society/1891277-kazakty-hatikosy-eki-aj-bojy-iesini-kabirin-kzetken-it-eldi-zregin-elziretti/", "numbered_paragraphs": false, "paragraphs": ["Алматы облысында екі айдан бері қожайынының қабірін күзетіп, мазар басынан кетпеген иттің оқиғасы көпшіліктің жүрегін елжіретті. Өмірден өткен иесінің зираты жанында өлермен күйге түскен жануарды куәгерлердің бірі камераға түсіріп, видео интернетке тез тарап кетті. Жеті қазынаның бірі саналатын төрт аяқтыға жұрт «қазақтың Хатикосы» деп ат қойып үлгерген.", "Әуел баста мазар маңынан өтетіндер бұл иттің отырғанына назар аудармапты. Қаңғыбастар қатарына қосып, көңіл бөлмеген екен. Алайда, біраз уақыт өткеннен кейін бір ғана моланы күзететініне көз жеткізген.", "«Тамақты ары-бері өткендер осында әкеліп беріп тұрдық», – деді елді мекен тұрғыны.", "Бұдан кейін иесіне адал болған жеті қазынаның бірін еріктілер панасына алып Лея деген ат қойыпты. Мамандар Леяны толықтай тексеруден өткізгендерін жеткізді. Дәрігерлер денсаулығының жақсы екендігін қуана айтыпты.", "Ал, иттің иесі қай жақтан екені және бұған дейін қайда тұрғаны туралы әзірге белгісіз."]}, {"id": "l2v4-t4", "title": "", "source_note": "Bilim-all.kz: «Қолөнер – зор өнер» – https://bilim-all.kz/article/2309", "numbered_paragraphs": true, "paragraphs": ["Қын – кемер белбеумен бірге тұратын, пышақ салынатын әшекейлі, былғары бұйым.", "Оқшантай – ішіне шағын зат салатын, кемер белбеуге өткізілген әшекейлі былғары қалта.", "Шолпы – шашқа тағатын, қымбат бағалы, сылдырмақты бұрым сәнін келтіретін, алтыннан, күмістен жасалатын бұйым.", "Қапсырма – әйел қамзолына тағылатын, түйме қызметін атқаратын жалпақ күміс бұйым.", "Сырға – құлаққа тағатын сәнді асыл бұйым. Оның сапасына, құрамына сай көптеген түрлері болады."]}, {"id": "l2v4-t5", "title": "Балнұр Жайсанбаева – Назарбаев Университетінің ғалымы", "source_note": "WE Project: «Жаңа нәрседен қорықпаңыз» – Балнұр Жайсанбаева Назарбаев Университетіндегі ғалымдық карьерасы туралы – https://weproject.media/kz/articles/detail/zha-a-n-rseden-ory-pa-yz-baln-r-zhaysanbaeva-nazarbaev-universitetindegi-alymdy-karerasy-turaly/", "numbered_paragraphs": false, "paragraphs": ["1. Өзім туралы", "Мен Семей қаласында дәрігер отбасында дүниеге келдім. Әлемді тануға деген сүйіспеншілікті ата-анам маған дарытты. Жоғары сыныпта мен ядролық физик болуды армандадым, бірақ бірқатар себептермен бұл арманыма қол жеткізе алмадым. Оның орнына мен хирургия мен биологияға қызығып, Семей қаласындағы Медициналық университетке түстім. Оқудың бірінші жылы аяқталғаннан кейін мен бакалавр дәрежесін «Генетика» мамандығы бойынша алу үшін Англияға кеттім.", "2. Қызметім туралы", "Ғылыми қызметімде маған көмектесетін негізгі әдеттердің бірі — әр таң сайын кофе ішіп отырып ғылыми әдебиеттерді оқу. Бұл маған соңғы оқиғалардан хабардар болуға және ғылым әлеміндегі жаңа жетістіктерді білуге мүмкіндік береді. Ғылыми қызметтен бөлек, мен физикалық денсаулықты сақтау маңызды деп санаймын, сондықтан хатха-йогамен айналысамын.", "3. Қазақстандағы ғылым туралы", "Қазақстандағы ғылымның дамуын бес жыл бұрынғы және бүгінгі жағдаймен салыстырғанда, үлкен айырмашылықты байқауға болады. Жас ғалым ретінде мен өзімнің тәуелсіз мансабымды бастауға және идеяларымды жүзеге асыру үшін қаржыландыру алуға мүмкіндік алдым.", "4. Жас ғалымдарға кеңестер", "Мен студенттермен және оқушылармен жұмыс істеуді ұнатамын. Менің негізгі кеңесім: «Жаңа нәрседен қорықпаңыз». Өзіңізді жетілдіруге ұмтылу, сыни ойлауды дамыту және сұрақ қоюдан ұялмау керек. Менің бакалавриаттағы профессорым айтқандай: «Ақылсыз сұрақтар болмайды, оларды сұраудан қорқу ақымақтық»."]}, {"id": "l2v4-t6", "title": "", "source_note": "Bilim-all.kz: «Көбелектен алынған сабақ» – https://bilim-all.kz/article/2328", "numbered_paragraphs": false, "paragraphs": ["Жолдан өтіп бара жатқан кездейсоқ біреу жібек пілләсіндегі кішкентай тесікті, сол тесіктен шықпақ болып тырысып жатқан көбелекті көріп, ұзақ уақыт бақылап қарап тұрыпты. Осыны бақылап тұрған адам көбелекке жәрдемдескісі келіп, қолына бәкі алып пілләні кесіп, кішкене тесікті кеңейтті. Көбелек бірден сыртқа шықты. ___(15)___ оның денесі әлсіз, қуаты жоқ, қанаттары қатаймаған, өзі де зорға жылжитын еді.", "Адам көбелектің қимылын бақылап тұрып, сәлден соң-ақ көбелектің қанаты қатайып, ұшып кетер деп ойлады. Бірақ олай болмады. Көбелек өзінің әлсіз денесін жер бауырлап сүйретіп жүріп, қанаты жетілмеген күйде қалған өмірін өткізді. **Ол** сол бойы ұша алмады.", "Өмірде бізге де нақ осындай күш салуға тура келетін кездер бар. Кім өмір сүруі тиіс болса, жолында кедергілер болады. Кедергі болмаса біз көп нәрседен құр қалар едік, ешуақытта қазіргідей күшті бола алмас едік."]}, {"id": "l2v4-t7", "title": "", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Аурудан – аяған күштірек» – https://bilim-all.kz/article/1638", "numbered_paragraphs": false, "paragraphs": ["Сейіт орам үстінде жүгіріп бара жатқанда, бір арбалы келіп, аңдаусыз соғып кетіп, аяғын сындырыпты. Ойбайлап жылап жатқан баланы көріп шошынғаннан шешесі есінен танып қалыпты. Мұны көрген соң, Сейіт жыламақ түгіл, сынған аяғын орнына салып, таңып жатқанда да дыбысын шығармай, қабағын да шытпай жатты. Сонда сынықшы кісі:", "— Аяғың ауырмай ма, қабағыңды да шытпайсың? — деп сұрады.", "Сейіт, шешесі шығып кеткен соң демін алып, сынықшыға сыбырлап айтты дейді:", "— Ауырмақ түгіл, жаным көзіме көрініп тұр, бірақ менің жанымның қиналғанын көрсе, ___(17)___, шыдап жатырмын, — деді."]}, {"id": "l2v4-t8", "title": "", "source_note": "Bilim-all.kz: «Жираф» – https://bilim-all.kz/article/15922", "numbered_paragraphs": false, "paragraphs": ["Жираф, керік — жұп тұяқты, күйіс қайыратын жануардың бір тұқымдасы. Орталық, Шығыс Африканың оңтүстік аймағындағы бұталы, сирек орманды, жазық далалы жерлерін мекендейді. Басы аса үлкен емес, мойны өте ұзын, бірақ мойын омыртқасының саны — жетеу.", "Жалпы түсі ашық сары, қара қошқыл дақтары болады. Негізінен, акацияның бұтақтарымен, жапырақтарымен қоректенеді. Қазіргі кезде жирафтар, негізінен, ұлттық саябақтарда кездеседі."]}, {"id": "l2v4-t9", "title": "", "source_note": "Bilim-all.kz: «Қожанасыр, ағаш, асқабақ, жаңғақ туралы әзіл» – https://bilim-all.kz/quote/5030", "numbered_paragraphs": false, "paragraphs": ["Қожанасыр жолда келе жатып жаңғақ ағашының астына көлеңкелеп отырады. Ағаштың маңында асқабақ бақшасы бар еді. Қожа: «Мына табиғаттың қызығын-ай! Асқабақтың сабағы кіп-кішкентай, бірақ жемісі менің қапшығымдай үп-үлкен. Ал мына діңгегі қалың еңгезердей ағаштың жемісі болса есектің көзінен де кіп-кішкентай», – деп іштей ойлайды.", "Ол осылай ойлап отырғанында басына тарс етіп бір жаңғақ түседі. Шекесі қызарып қалған Қожа жаңғаққа бір, асқабаққа бір қарап: «Тәубә, сөзімді кері алдым. Астында отырған мына ағаш асқабақ ағашы болғанда қайтер едім», – деген екен."]}], "items": [{"id": "l2v4-q1", "number": 1, "text_id": "l2v4-t1", "stem": "Әлібектің құрылғысы немен басқарылады?", "options": {"A": "пульттің түймелері арқылы", "B": "ұялы телефон арқылы", "C": "оқушының дауыс бұйрығы арқылы", "D": "жасанды зерде көмегімен"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Оның құрылғысы жасанды интеллект арқылы басқарылады."], "explanation": "Мәтінде Әлібектің құрылғысы жасанды интеллект арқылы басқарылатыны айтылады. «Жасанды зерде» – жасанды интеллект деген сөз.", "editor_changes": "Мәтін қысқартылды (оқушының тікелей сөзі мен мектептің басқа жобалары туралы бөлік алынды).", "explanation_ru": "В тексте сказано, что устройство Алибека управляется искусственным интеллектом. «Жасанды зерде» — то же, что «жасанды интеллект».", "distractor_notes": {"A": "мәтінде пульт туралы айтылмайды.", "B": "мәтінде телефон туралы айтылмайды.", "C": "мәтінде дауыспен басқару туралы айтылмайды."}, "distractor_notes_ru": {"A": "в тексте не говорится о пульте.", "B": "в тексте не говорится о телефоне.", "C": "в тексте не говорится об управлении голосом."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["жасанды интеллект арқылы"], "ru": ["искусственного интеллекта"]}}}, {"id": "l2v4-q2", "number": 2, "text_id": "l2v4-t2", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Ализа қазақ тілін 6-сыныптан бастап үйренді.\n2. Ализаның курсына әр жастағы адамдар қатысады.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["6-сыныптан бастап мен қазақ тілін үйрене бастадым.", "Бұл курсқа төрт жастан 64 жасқа дейінгі адамдар келеді."], "explanation": "Екі тұжырым да дұрыс: Ализа қазақ тілін 6-сыныптан бастап үйренген, ал оның курсына төрт жастан 64 жасқа дейінгі адамдар келеді.", "editor_changes": "Мәтін қысқартылды; «–Қазақстан» → «– Қазақстан».", "explanation_ru": "Оба утверждения верны: Ализа учит казахский с 6-го класса, а на её курс приходят люди от четырёх до 64 лет.", "distractor_notes": {"A": "екінші тұжырым да мәтінде бар. Курсқа кімдер келетінін қайта оқы.", "B": "бірінші тұжырым да мәтінде бар. Ализаның қай сыныптан бастап қазақ тілін үйренгенін қайта оқы.", "D": "екі тұжырым да мәтінде бар. Ализаның сөзін қайта оқы."}, "distractor_notes_ru": {"A": "второе утверждение тоже есть в тексте. Перечитай, кто приходит на курс.", "B": "первое утверждение тоже есть в тексте. Перечитай, с какого класса Ализа учит казахский.", "D": "оба утверждения есть в тексте. Перечитай слова Ализы."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["6-сыныптан бастап", "төрт жастан 64 жасқа дейінгі"], "ru": ["с 6-го класса", "от четырёх до 64 лет"]}}}, {"id": "l2v4-q3", "number": 3, "text_id": "l2v4-t3", "stem": "Мәтін не туралы?\n... ит туралы", "options": {"A": "қожайынын ұмытпаған", "B": "ауылдан қашып кеткен", "C": "адамдарға шабуыл жасаған", "D": "жаңа үй іздеп жүрген"}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Алматы облысында екі айдан бері қожайынының қабірін күзетіп, мазар басынан кетпеген иттің оқиғасы көпшіліктің жүрегін елжіретті.", "Бұдан кейін иесіне адал болған жеті қазынаның бірін еріктілер панасына алып Лея деген ат қойыпты."], "explanation": "Мәтінде қайтыс болған иесінің қабірін екі ай бойы күзетіп, одан кетпеген ит туралы айтылады. Бұл ит қожайынын ұмытпай, оған адал болып қалды.", "editor_changes": "Мәтін қысқартылды; дереккөзге сілтеме алынды; тұрғынның сөзінің басы қысқартылды.", "explanation_ru": "В тексте рассказывается о собаке, которая два месяца охраняла могилу умершего хозяина и не уходила. Она не забыла хозяина и осталась ему верна.", "distractor_notes": {"B": "ит ешқайда қашқан жоқ, екі ай бойы мазар басында болды.", "C": "мәтінде иттің адамдарға шабуыл жасағаны айтылмайды. Керісінше, ол мейірімді.", "D": "ит жаңа үй іздеген жоқ: оны еріктілер өздері панасына алды."}, "distractor_notes_ru": {"B": "собака никуда не убегала, два месяца была у могилы.", "C": "в тексте не говорится, что собака нападала на людей.", "D": "собака не искала новый дом: волонтёры сами забрали её в приют."}, "distractor_evidence": {"B": [], "C": [], "D": ["Бұдан кейін иесіне адал болған жеті қазынаның бірін еріктілер панасына алып Лея деген ат қойыпты."]}, "keywords": {"ok": {"kk": ["қабірін күзетіп", "иесіне адал болған"], "ru": ["охраняла могилу", "верную хозяину"]}, "D": {"kk": ["еріктілер панасына алып"], "ru": ["волонтёры забрали"]}}}, {"id": "l2v4-q4", "number": 4, "text_id": "l2v4-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Иттің бұрынғы иесі кім екені белгілі болды.", "B": "Итті мазар басында ешкім тамақтандырмады.", "C": "Итке Хатико деген ат қойып, үйге алды.", "D": "Дәрігерлер иттің сау екенін айтты."}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Дәрігерлер денсаулығының жақсы екендігін қуана айтыпты."], "explanation": "Мамандар Леяны тексеріп, дәрігерлер оның денсаулығы жақсы екенін айтқан. «Сау» – денсаулығы жақсы деген сөз.", "editor_changes": "", "explanation_ru": "Специалисты обследовали Лею, и врачи сказали, что её здоровье в порядке. «Сау» значит «здоровый».", "distractor_notes": {"A": "мәтінде керісінше айтылған: иттің иесі кім екені әзірге белгісіз.", "B": "тұрғындар итке тамақ әкеліп беріп тұрған.", "C": "«Хатико» деп оны жұрт атады, ал еріктілер оған Лея деген ат қойды."}, "distractor_notes_ru": {"A": "в тексте сказано обратное: кто был хозяином собаки, пока неизвестно.", "B": "жители приносили собаке еду.", "C": "«Хатико» её назвали люди, а волонтёры дали ей имя Лея."}, "distractor_evidence": {"A": ["Ал, иттің иесі қай жақтан екені және бұған дейін қайда тұрғаны туралы әзірге белгісіз."], "B": ["«Тамақты ары-бері өткендер осында әкеліп беріп тұрдық», – деді елді мекен тұрғыны."], "C": ["Бұдан кейін иесіне адал болған жеті қазынаның бірін еріктілер панасына алып Лея деген ат қойыпты."]}, "keywords": {"ok": {"kk": ["денсаулығының жақсы"], "ru": ["здоровье в порядке"]}, "A": {"kk": ["әзірге белгісіз"], "ru": ["пока неизвестно"]}, "B": {"kk": ["Тамақты", "әкеліп беріп тұрдық"], "ru": ["приносили ей сюда еду"]}, "C": {"kk": ["Лея деген ат"], "ru": ["назвали её лея"]}}}, {"id": "l2v4-q5", "number": 5, "text_id": "l2v4-t4", "stem": "Қай абзацта шашқа тағылатын бұйым туралы айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "C", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Шолпы – шашқа тағатын, қымбат бағалы, сылдырмақты бұрым сәнін келтіретін, алтыннан, күмістен жасалатын бұйым. (3-азатжол)"], "explanation": "3-абзацта шолпы туралы айтылады. Шолпы – шашқа тағатын бұйым.", "editor_changes": "Мақаладағы бұйымдар тізімінен бесеуі ғана алынды, «Шолпы» мен «Қапсырма» сөздіктерінің орны ауыстырылды.", "explanation_ru": "В 3-м абзаце говорится о шолпы — украшении для волос.", "distractor_notes": {"A": "1-абзацта пышақ салынатын қын туралы айтылады.", "B": "2-абзацта шағын зат салатын оқшантай туралы айтылады.", "D": "4-абзацта камзолға тағатын қапсырма туралы айтылады."}, "distractor_notes_ru": {"A": "в 1-м абзаце говорится о ножнах для ножа.", "B": "во 2-м абзаце говорится о сумочке для мелких вещей.", "D": "в 4-м абзаце говорится о застёжке для камзола."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["шашқа тағатын"], "ru": ["для волос"]}}}, {"id": "l2v4-q6", "number": 6, "text_id": "l2v4-t4", "stem": "Қай ақпарат мәтін мазмұнына сай келеді?", "options": {"A": "Оқшантайды әдетте мойынға асып алып жүреді.", "B": "Қапсырма түйменің орнына қолданылады.", "C": "Шолпыны тек ағаштан ғана ойып жасайды.", "D": "Қынның ішіне шағын заттар салынады."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Қапсырма – әйел қамзолына тағылатын, түйме қызметін атқаратын жалпақ күміс бұйым."], "explanation": "Мәтінде қапсырманың түйме қызметін атқаратыны айтылады, яғни ол түйменің орнына қолданылады.", "editor_changes": "", "explanation_ru": "В тексте сказано, что қапсырма служит пуговицей, то есть используется вместо пуговицы.", "distractor_notes": {"A": "оқшантай мойынға емес, белбеуге тағылады.", "C": "шолпы ағаштан емес, алтыннан, күмістен жасалады.", "D": "қынға пышақ салынады, ал шағын заттар оқшантайға салынады."}, "distractor_notes_ru": {"A": "оқшантай носят не на шее, а на поясе.", "C": "шолпы делают не из дерева, а из золота и серебра.", "D": "в ножны кладут нож, а мелкие вещи — в оқшантай."}, "distractor_evidence": {"A": ["Оқшантай – ішіне шағын зат салатын, кемер белбеуге өткізілген әшекейлі былғары қалта."], "C": ["Шолпы – шашқа тағатын, қымбат бағалы, сылдырмақты бұрым сәнін келтіретін, алтыннан, күмістен жасалатын бұйым."], "D": ["Қын – кемер белбеумен бірге тұратын, пышақ салынатын әшекейлі, былғары бұйым."]}, "keywords": {"ok": {"kk": ["түйме қызметін атқаратын"], "ru": ["служит пуговицей"]}, "A": {"kk": ["кемер белбеуге өткізілген"], "ru": ["носят на поясе"]}, "C": {"kk": ["алтыннан, күмістен"], "ru": ["из золота или серебра"]}, "D": {"kk": ["пышақ салынатын"], "ru": ["ножны для ножа"]}}}, {"id": "l2v4-q7", "number": 7, "text_id": "l2v4-t4", "stem": "Мәтінге қандай тақырып сәйкес келеді?", "options": {"A": "Қазақтың ұлттық тағамдары", "B": "Ағаштан жасалған ыдыстар", "C": "Қыздардың шаш өру әдістері", "D": "Ұлттық сәндік бұйымдар"}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Шолпы – шашқа тағатын, қымбат бағалы, сылдырмақты бұрым сәнін келтіретін, алтыннан, күмістен жасалатын бұйым. (3-азатжол)", "Сырға – құлаққа тағатын сәнді асыл бұйым. (5-азатжол)"], "explanation": "Мәтінде қазақтың бес бұйымы – қын, оқшантай, шолпы, қапсырма, сырға – түсіндіріледі. Бұлардың бәрі – сәнге, әшекейге арналған ұлттық бұйымдар.", "editor_changes": "", "explanation_ru": "В тексте объясняются пять казахских изделий: ножны, сумочка, шолпы, застёжка и серьги. Всё это — национальные украшения.", "distractor_notes": {"A": "мәтінде тағам туралы айтылмайды.", "B": "мәтінде ыдыс туралы айтылмайды. Бұйымдар былғарыдан, алтыннан, күмістен жасалады.", "C": "шаш тек бір абзацта аталады, шаш өру әдістері айтылмайды."}, "distractor_notes_ru": {"A": "в тексте не говорится о еде.", "B": "в тексте не говорится о посуде. Изделия делают из кожи, золота и серебра.", "C": "волосы упоминаются только в одном абзаце, способы плетения кос не описаны."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["бұйым", "сәнді асыл бұйым"], "ru": ["украшение", "нарядное драгоценное украшение"]}}}, {"id": "l2v4-q8", "number": 8, "text_id": "l2v4-t5", "stem": "Қай бөлімде Балнұрдың күн сайынғы әдеті туралы айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "B", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Ғылыми қызметімде маған көмектесетін негізгі әдеттердің бірі — әр таң сайын кофе ішіп отырып ғылыми әдебиеттерді оқу. (2-бөлім)"], "explanation": "2-бөлімде Балнұр әр таң сайын кофе ішіп отырып ғылыми әдебиет оқитынын айтады.", "editor_changes": "Мақала қатты қысқартылды («Ғылыми зерттеулер туралы» бөлімі және күрделі терминдер бар сөйлемдер алынды, йога туралы сөйлемнің соңы қысқартылды); бөлімдер нөмірленді.", "explanation_ru": "Во 2-й части Балнур рассказывает, что каждое утро за кофе читает научную литературу.", "distractor_notes": {"A": "1-бөлімде Балнұрдың балалық шағы мен оқуы туралы айтылады.", "C": "3-бөлімде Қазақстандағы ғылым туралы айтылады.", "D": "4-бөлімде жас ғалымдарға кеңес беріледі."}, "distractor_notes_ru": {"A": "в 1-й части говорится о детстве и учёбе Балнур.", "C": "в 3-й части говорится о науке в Казахстане.", "D": "в 4-й части даются советы молодым учёным."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["әр таң сайын"], "ru": ["каждое утро"]}}}, {"id": "l2v4-q9", "number": 9, "text_id": "l2v4-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Балнұр мектепті бітірген соң ядролық физик болды.\n2. Балнұр бакалавр дәрежесін шетелде алды.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Жоғары сыныпта мен ядролық физик болуды армандадым, бірақ бірқатар себептермен бұл арманыма қол жеткізе алмадым.", "Оқудың бірінші жылы аяқталғаннан кейін мен бакалавр дәрежесін «Генетика» мамандығы бойынша алу үшін Англияға кеттім."], "explanation": "Тек екінші тұжырым дұрыс: Балнұр бакалавр дәрежесін алу үшін Англияға кеткен. Бірінші тұжырым қате: ол ядролық физик болуды армандаған, бірақ бұл арманы орындалмаған.", "editor_changes": "", "explanation_ru": "Верно только второе утверждение: Балнур уехала в Англию, чтобы получить степень бакалавра. Первое неверно: она мечтала стать физиком-ядерщиком, но мечта не сбылась.", "distractor_notes": {"A": "бірінші тұжырым мәтінге сәйкес келмейді: Балнұрдың бұл арманы орындалмады.", "C": "бірінші тұжырымды мәтінмен тағы салыстыр: Балнұр ядролық физик бола алды ма?", "D": "екінші тұжырым мәтінде бар. Балнұрдың қай елде оқығанын қайта оқы."}, "distractor_notes_ru": {"A": "первое утверждение не соответствует тексту: эта мечта Балнур не сбылась.", "C": "сравни первое утверждение с текстом ещё раз: стала ли Балнур физиком-ядерщиком?", "D": "второе утверждение есть в тексте. Перечитай, в какой стране училась Балнур."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["қол жеткізе алмадым", "Англияға кеттім"], "ru": ["не смогла осуществить", "уехала в англию"]}}}, {"id": "l2v4-q10", "number": 10, "text_id": "l2v4-t5", "stem": "Мәтін бөлімдерінің реті қандай?\n1. Жас ғалымдарға кеңес\n2. Балнұрдың балалық шағы\n3. Елдегі ғылымның жағдайы\n4. Балнұрдың жұмыс күні", "options": {"A": "1, 2, 3, 4", "B": "2, 4, 1, 3", "C": "2, 4, 3, 1", "D": "4, 2, 3, 1"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Мен Семей қаласында дәрігер отбасында дүниеге келдім.", "Ғылыми қызметімде маған көмектесетін негізгі әдеттердің бірі — әр таң сайын кофе ішіп отырып ғылыми әдебиеттерді оқу.", "Қазақстандағы ғылымның дамуын бес жыл бұрынғы және бүгінгі жағдаймен салыстырғанда, үлкен айырмашылықты байқауға болады.", "Менің негізгі кеңесім: «Жаңа нәрседен қорықпаңыз»."], "explanation": "Алдымен Балнұр балалық шағы туралы айтады (2), сосын күнделікті жұмысы мен әдеттері туралы (4), кейін Қазақстандағы ғылым туралы (3), соңында жас ғалымдарға кеңес береді (1).", "editor_changes": "", "explanation_ru": "Сначала Балнур рассказывает о детстве (2), затем о работе и привычках (4), потом о науке в Казахстане (3) и в конце даёт советы молодым учёным ( ", "B": "эти слова, наоборот, призывают не бояться задавать вопросы.", "D": "Балнур не говорит о тоске. Слова профессора приведены, чтобы подкрепить совет."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["сұрақ қоюдан ұялмау", "Ақылсыз сұрақтар болмайды"], "ru": ["не стесняться задавать вопросы", "глупых вопросов не бывает"]}}}, {"id": "l2v4-q13", "number": 13, "text_id": "l2v4-t6", "stem": "Адам көбелекке қалай көмектеспек болды?", "options": {"A": "көбелекті алақанына салып, ұшырып жіберді", "B": "көбелекке су мен тамақ әкеліп берді", "C": "пілләні күн көзіне апарып қойды", "D": "пілләдегі тесікті үлкейтіп берді"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Осыны бақылап тұрған адам көбелекке жәрдемдескісі келіп, қолына бәкі алып пілләні кесіп, кішкене тесікті кеңейтті."], "explanation": "Адам бәкімен пілләні кесіп, кішкене тесікті кеңейтті. «Кеңейту» – үлкейту деген сөз.", "editor_changes": "Мәтін қысқартылды (көбелектің неге ұша алмағанын түсіндіретін бөлік пен соңындағы өлең жолдары алынды).", "explanation_ru": "Человек разрезал кокон ножом и расширил маленькое отверстие. «Кеңейту» значит «увеличить, расширить».", "distractor_notes": {"A": "адам көбелекті ұшырған жоқ. Ол пілләні кесті.", "B": "мәтінде су мен тамақ туралы айтылмайды.", "C": "мәтінде күн көзі туралы айтылмайды."}, "distractor_notes_ru": {"A": "человек не подбрасывал бабочку. Он разрезал кокон.", "B": "в тексте не говорится о воде и еде.", "C": "в тексте не говорится о солнце."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["тесікті кеңейтті"], "ru": ["расширил маленькое отверстие"]}}}, {"id": "l2v4-q14", "number": 14, "text_id": "l2v4-t6", "stem": "«Ол сол бойы ұша алмады.»\nОсы сөйлемде «ол» деп кімді айтады?", "options": {"A": "көбелекті", "B": "адамды", "C": "пілләні", "D": "бәкіні"}, "key": "A", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Көбелек өзінің әлсіз денесін жер бауырлап сүйретіп жүріп, қанаты жетілмеген күйде қалған өмірін өткізді.", "Ол сол бойы ұша алмады."], "explanation": "Алдыңғы сөйлемде қанаты жетілмеген көбелек туралы айтылады. «Ол» – осы көбелек.", "editor_changes": "", "explanation_ru": "В предыдущем предложении говорится о бабочке с неразвитыми крыльями. «Ол» (она) — это бабочка.", "distractor_notes": {"B": "адам ұшуға тырыспайды. Ұша алмаған – қанаты жетілмеген жәндік.", "C": "пілле – көбелектің қабы, ол ұшпайды.", "D": "бәкі – пышақ, ол ұшпайды."}, "distractor_notes_ru": {"B": "человек не пытается летать. Не смогло взлететь существо с неразвитыми крыльями.", "C": "кокон — оболочка бабочки, он не летает.", "D": "бәкі — ножик, он не летает."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Көбелек", "қанаты жетілмеген"], "ru": ["бабочка", "неразвитыми крыльями"]}}}, {"id": "l2v4-q15", "number": 15, "text_id": "l2v4-t6", "stem": "Бос орынға қай сөз қойылады?", "options": {"A": "Сондықтан", "B": "Бірақ", "C": "Өйткені", "D": "Сонымен қатар"}, "key": "B", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Көбелек бірден сыртқа шықты."], "explanation": "Көбелек сыртқа шықты – бұл жақсы нәтиже сияқты. Бірақ келесі сөйлемде оның әлсіз, қанаты қатаймаған екені айтылады. Қарама-қарсы ойды «бірақ» жалғайды.", "editor_changes": "", "explanation_ru": "Бабочка вышла наружу — вроде бы хороший результат. Но в следующем предложении сказано, что она слабая и крылья не окрепли. Противопоставление выражает «бірақ» (но).", "distractor_notes": {"A": "«сондықтан» салдарды білдіреді. Ал көбелектің әлсіздігі оның сыртқа шыққанының салдары емес, күтпеген жағдай.", "C": "«өйткені» себепті білдіреді. Көбелектің әлсіздігі оның сыртқа шығуының себебі емес.", "D": "«сонымен қатар» қосымша ақпаратты қосады. Ал мұнда алдыңғы ойға қарсы ой айтылады."}, "distractor_notes_ru": {"A": "«Сондықтан» (поэтому) выражает следствие. А слабость бабочки — не следствие, а неожиданность.", "C": "«Өйткені» (потому что) выражает причину. Слабость бабочки не причина её выхода наружу.", "D": "«Сонымен қатар» (кроме того) добавляет информацию. А здесь мысль противоположна предыдущей."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["бірден сыртқа шықты"], "ru": ["сразу вышла наружу"]}}}, {"id": "l2v4-q16", "number": 16, "text_id": "l2v4-t7", "stem": "Мәтіндегі оқиғалардың реті қандай?\n1. Сынықшының сұрағы\n2. Арбаның соғып кетуі\n3. Сейіттің сыбырлап айтқан жауабы\n4. Шешесінің есінен тануы", "options": {"A": "2, 4, 1, 3", "B": "2, 1, 4, 3", "C": "4, 2, 1, 3", "D": "2, 4, 3, 1"}, "key": "A", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Сейіт орам үстінде жүгіріп бара жатқанда, бір арбалы келіп, аңдаусыз соғып кетіп, аяғын сындырыпты.", "Ойбайлап жылап жатқан баланы көріп шошынғаннан шешесі есінен танып қалыпты.", "— Аяғың ауырмай ма, қабағыңды да шытпайсың? — деп сұрады.", "Сейіт, шешесі шығып кеткен соң демін алып, сынықшыға сыбырлап айтты дейді:"], "explanation": "Алдымен арба Сейітті соғып кетеді (2), сосын шешесі есінен танады (4), кейін сынықшы сұрақ қояды (1), соңында Сейіт сыбырлап жауап береді (3).", "editor_changes": "", "explanation_ru": "Сначала телега сбивает Сеита (2), затем мать теряет сознание (4), потом костоправ задаёт вопрос (1), и в конце Сеит шёпотом отвечает (3).", "distractor_notes": {"B": "шешесі баланы көріп, сынықшы сұрақ қоймай тұрып-ақ есінен танды.", "C": "шешесі баласының жылағанын көргеннен кейін ғана есінен танды, ал бала арба соққаннан кейін жылады.", "D": "Сейіт сынықшының сұрағына жауап береді, сондықтан сұрақ жауаптан бұрын тұрады."}, "distractor_notes_ru": {"B": "мать потеряла сознание ещё до вопроса костоправа.", "C": "мать потеряла сознание, только увидев плачущего сына, а заплакал он после удара телеги.", "D": "Сеит отвечает на вопрос костоправа, поэтому вопрос идёт раньше ответа."}, "distractor_evidence": {"B": ["Ойбайлап жылап жатқан баланы көріп шошынғаннан шешесі есінен танып қалыпты."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["соғып кетіп", "есінен танып", "деп сұрады", "сыбырлап айтты"], "ru": ["сбил его", "потеряла сознание", "спросил он", "шёпотом сказал"]}, "B": {"kk": ["шешесі есінен танып"], "ru": ["мать от испуга потеряла сознание"]}}}, {"id": "l2v4-q17", "number": 17, "text_id": "l2v4-t7", "stem": "Бос орынға қай жауап сәйкес келеді?", "options": {"A": "әжем мені тезірек емдетіп алсын деп", "B": "ауылдағы жұрт мені батыр бала десін деп", "C": "әжем де қиналып, жүдемесін деп", "D": "сынықшы мені шыдамды деп мақтасын деп"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Ойбайлап жылап жатқан баланы көріп шошынғаннан шешесі есінен танып қалыпты.", "Мұны көрген соң, Сейіт жыламақ түгіл, сынған аяғын орнына салып, таңып жатқанда да дыбысын шығармай, қабағын да шытпай жатты."], "explanation": "Сейіттің жылағанын көріп, шешесі есінен танып қалды. Сейіт анасын аяп, оны қайта қинамау үшін шыдады. Мәтіннің атауы да – «Аурудан – аяған күштірек».", "editor_changes": "", "explanation_ru": "Увидев, как Сеит плачет, мать потеряла сознание. Сеит пожалел мать и терпел, чтобы снова её не расстроить. Название рассказа — «Жалость сильнее боли».", "distractor_notes": {"A": "Сейіт емделу туралы емес, анасының жағдайы туралы ойлайды.", "B": "Сейіт мақтау үшін емес, анасын аяғандықтан шыдады. Ол бұл сөзді сыбырлап, анасы шығып кеткенде айтты.", "D": "Сейіт сынықшының мақтауын күткен жоқ. Ол шешесін ойлады."}, "distractor_notes_ru": {"A": "Сеит думает не о лечении, а о состоянии матери.", "B": "Сеит терпел не ради похвалы, а из жалости к матери. Он сказал это шёпотом, когда мать вышла.", "D": "Сеит не ждал похвалы костоправа. Он думал о матери."}, "distractor_evidence": {"A": [], "B": ["Сейіт, шешесі шығып кеткен соң демін алып, сынықшыға сыбырлап айтты дейді:"], "D": []}, "keywords": {"ok": {"kk": ["шешесі есінен танып", "Мұны көрген соң"], "ru": ["потеряла сознание", "увидев это"]}, "B": {"kk": ["шешесі шығып кеткен соң"], "ru": ["когда мать вышла"]}}}, {"id": "l2v4-q18", "number": 18, "text_id": "l2v4-t8", "stem": "Жирафтың мойнында неше омыртқа бар?", "options": {"A": "бес", "B": "жеті", "C": "он", "D": "он екі"}, "key": "B", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Басы аса үлкен емес, мойны өте ұзын, бірақ мойын омыртқасының саны — жетеу."], "explanation": "Мәтінде жирафтың мойны өте ұзын болса да, мойын омыртқасының саны жетеу екені айтылады.", "editor_changes": "Мәтін қысқартылды (өлшемдері мен окапи туралы бөлік, соңғы сөйлемнің «қолда көбейе береді» деген бөлігі алынды); «омыртқасынын» → «омыртқасының».", "explanation_ru": "В тексте сказано, что хотя шея у жирафа очень длинная, шейных позвонков всего семь (жетеу).", "distractor_notes": {"A": "бес саны мәтінде жоқ.", "C": "он саны мәтінде жоқ.", "D": "он екі саны мәтінде жоқ."}, "distractor_notes_ru": {"A": "числа пять нет в тексте.", "C": "числа десять нет в тексте.", "D": "числа двенадцать нет в тексте."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["омыртқасының саны — жетеу"], "ru": ["всего семь"]}}}, {"id": "l2v4-q19", "number": 19, "text_id": "l2v4-t8", "stem": "Мәтіннің соңында автор неге назар аударды?", "options": {"A": "жирафтардың қазіргі мекеніне", "B": "жирафтың тез жүгіретін қабілетіне", "C": "жирафтың түсі мен дақтарының әдемілігіне", "D": "жирафтың мойны қаншалықты ұзын екеніне"}, "key": "A", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Қазіргі кезде жирафтар, негізінен, ұлттық саябақтарда кездеседі."], "explanation": "Мәтіннің соңғы сөйлемінде қазір жирафтардың көбіне ұлттық саябақтарда кездесетіні айтылады. Автор олардың қазіргі мекеніне назар аударады.", "editor_changes": "", "explanation_ru": "В последнем предложении сказано, что сейчас жирафы встречаются в основном в национальных парках. Автор обращает внимание на их нынешнее место обитания.", "distractor_notes": {"B": "мәтінде жирафтың жүгіруі туралы айтылмайды.", "C": "жирафтың түсі туралы мәтіннің ортасында айтылады, соңында емес.", "D": "жирафтың мойны туралы мәтіннің басында айтылады."}, "distractor_notes_ru": {"B": "в тексте не говорится о беге жирафа.", "C": "о цвете жирафа сказано в середине текста, а не в конце.", "D": "о шее жирафа сказано в начале текста."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Қазіргі кезде", "ұлттық саябақтарда"], "ru": ["в наше время", "национальных парках"]}}}, {"id": "l2v4-q20", "number": 20, "text_id": "l2v4-t9", "stem": "Мәтіннің негізгі ойы қандай?", "options": {"A": "Асқабақ жаңғақтан әлдеқайда дәмді болады.", "B": "Ағаш көлеңкесінде ұйықтау өте қауіпті.", "C": "Үлкен ағаштың жемісі де үлкен болуы керек.", "D": "Табиғаттағы әр нәрсе орынды жаралған."}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ол осылай ойлап отырғанында басына тарс етіп бір жаңғақ түседі.", "Шекесі қызарып қалған Қожа жаңғаққа бір, асқабаққа бір қарап: «Тәубә, сөзімді кері алдым. Астында отырған мына ағаш асқабақ ағашы болғанда қайтер едім», – деген екен."], "explanation": "Қожа үлкен ағашта кішкентай жеміс өсетініне таңғалды. Бірақ басына жаңғақ түскенде, ағашта асқабақ өссе не болатынын түсініп, сөзін кері алды. Табиғатта бәрі орнымен жаралған.", "editor_changes": "Тыныс белгілері қойылды («қызығын-ай!», «кіп-кішкентай, бірақ», төл сөзден кейін «– деп»); «қожа» → «Қожа».", "explanation_ru": "Ходжа удивлялся, что на большом дереве растут маленькие плоды. Но когда орех упал ему на голову, он понял, ч мкоговорителя.", "Былтыр қыркүйек айында басталған «Кітап оқитын ұлт» жобасына 55 мың облыс тұрғыны қатысты.": "В проекте «Читающая нация», начавшемся в сентябре прошлого года, участвовали 55 тысяч жителей области.", "Шарт бойынша оларға 15 кітапты оқып шығу міндеттелді.": "По условию им нужно было прочитать 15 книг.", "Тәжірибелі кинолог «Зена» есімді мына иісшіл итті күшік кезінен бағып, осы салаға бейімдеген.": "Опытный кинолог растил собаку с острым чутьём по кличке Зена со щенячьего возраста и подготовил её к этой работе.", "Ол жерде 25 ит қатысты, соның арасынан Зена үздік шықты.": "Там участвовали 25 собак, и Зена оказалась лучшей среди них.", "Алмаз Жандәулетов Зенаның көмегімен осы уақытқа дейін облыс аумағындағы таулы аймақтарда өз бетімен тауға шығып, кейін адасып кеткен онға жуық демалушыны іздеп тапқан.": "С помощью Зены Алмаз Жандаулетов уже нашёл около десяти отдыхающих, которые сами поднялись в горы области и заблудились.", "– Жоғалған адамды тапқаннан кейін үріп, бізге белгі береді.": "– Найдя пропавшего человека, она лает и подаёт нам сигнал.", "2 жыл күнделікті дайындықтан өтіп, өз қабілетін шыңдағанын айтады.": "Он говорит, что собака два года ежедневно тренировалась и оттачивала свои способности.", "Сонымен қатар бұл басылымда жапондық Пурин деп аталатын футболшы-ит те бар. (3-азатжол)": "Кроме того, в этом издании есть японская собака-футболист по кличке Пурин.", "Сонымен қатар бұл басылымда жапондық Пурин деп аталатын футболшы-ит те бар.": "Кроме того, в этом издании есть японская собака-футболист по кличке Пурин.", "Ол «Қақпада 1 минутта алдыңғы екі аяғымен ең көп допты қайтарған» деген критериямен кірген.": "Она попала туда в категории «Больше всех мячей, отбитых передними лапами в воротах за 1 минуту».", "Ол 2014 жылы 23 жас 76 күнінде өлген.": "Она умерла в 2014 году в возрасте 23 лет и 76 дней.", "Ол бір сағатта 0,6 миль (966 м-ге жақын) жүреді, және 100 метрді 6 минутта жүріп өтеді екен.": "За час она проходит 0,6 мили (около 966 м), а 100 метров проходит за 6 минут.", "Ол қаңтар айында 11 доп қайтарса, бірнеше ай өткеннен кейін 14 доп қайтарған.": "В январе она отбила 11 мячей, а через несколько месяцев — 14.", "«Ең ұзын мүйіз» категориясын америкалық Лэйзи Блюграсс атты өгіз жеңіп алған.": "В категории «Самые длинные рога» победил американский бык по кличке Лэйзи Блюграсс.", "Кітаптағы мыңдаған рекордшылардың арасында – ең жылдам тасбақа, ең мамық қоян және ең мықты қақпашы ит бар.": "Среди тысяч рекордсменов в книге — самая быстрая черепаха, самый пушистый кролик и самая сильная собака-вратарь.", "Көрсетілімде олар жан-жануарлардың рекордтарына көптеу көңіл бөлді.": "На презентации они уделили особое внимание рекордам животных.", "Әкемнің өзі спортқа жақын, белсенді адам болғандықтан, мені 8 жасымнан бастап каратэге берді.": "Мой отец сам близок к спорту и активный человек, поэтому отдал меня в каратэ с 8 лет.", "– Алғашқы жеңісім Тараз қаласында өткен шағын турнирде болды.": "– Моя первая победа была на небольшом турнире в Таразе.", "Ондағы тәртіп өте қатаң: күн таңғы 6-да басталады.": "Там очень строгий режим: день начинается в 6 утра.", "– Мен, Маметолдин Ералы Серікұлы, Жамбыл облысы, Тараз қаласының тумасымын.": "– Я, Маметолдин Ералы Серикулы, родом из Тараза Жамбылской области.", "– Бұл жеңіс – ұзақ жылдар бойғы еңбектің нәтижесі.": "– Эта победа — результат многолетнего труда.", "Негізгі ереже – тәртіп, тұрақты еңбек, мотивация және нақты мақсат.": "Главное правило — дисциплина, постоянный труд, мотивация и конкретная цель.", "3. – Күнделікті жаттығу тәртібің қандай?": "3. – Какой у тебя ежедневный режим тренировок?", "1. – Спортқа келу жолың қалай басталды?": "1. – Как начался твой путь в спорт?", "Бір жұрттың бас әкімі екінші бір байға жолығысып сөйлесіп тұрғанда, қасынан бір жарлы мұжық өтіп бара жатып иіліп, басұрып сәлем берді дейді.": "Когда главный правитель одного народа встретился и беседовал с одним баем, мимо проходил бедный мужик и, низко поклонившись, поздоровался.", "– Ешбір ілім-білім үйренбеген мұжық сонша иіліп, әдептілігін көрсеткенде, мен онан әдепсіз болып қалайын ба? – деді дейді.": "– Если мужик, который ничему не учился, так низко поклонился и показал свою вежливость, разве я могу быть невежливее его? — сказал он.", "– Тақсыр, осынша жұрттың үстінен қараған әкімсіз, осы бір мұжыққа неге сонша басұрасыз? – деп айтты дейді.": "– Господин, вы правитель, стоящий над целым народом, почему вы так низко кланяетесь этому мужику? — сказал он.", "– Берген ақшамды қайда қойдың?": "– Куда ты дела деньги, которые я тебе дала?", "– Әлгі бала Құдай-тағаланың жаратқан кішкентай құсын ұстап алып, сатайын деп жүр екен.": "– Тот мальчик поймал маленькую птичку, созданную Богом, и хотел её продать.", "– Мен балаға ақша беріп сатып алып, құсты ұшырып қоя бердім.": "– Я дала мальчику деньги, купила птичку и отпустила её на волю.", "– Әрине, сауап, ___(17)___.": "– Конечно, это доброе дело, ___(17)___.", "Сонда алып жүрген бала тұмсығын қыса береді.": "А мальчик, который её держал, всё сжимал ей клюв.", "Жолбарыс 2-3 күшік туады, оларды 5-6 ай емізеді.": "Тигрица рождает 2–3 детёнышей и кормит их молоком 5–6 месяцев.", "Жолбарысты қазақ халқы ежелден күштіліктің символы санаған.": "Казахский народ издавна считал тигра символом силы.", "12-13-ғасырларда Тоқтамыс хан соқтырған тиында жолбарыс бейнесі салынған.": "На монете, отчеканенной ханом Тохтамышем в XII–XIII веках, изображён тигр.", "Жабайы шошқа, бұғы, марал, елік, т.б. тұяқты жануарларды ұстап жейді, кейде малға, қасқырға, итке де шабады.": "Он ловит и ест кабанов, оленей, маралов, косуль и других копытных, иногда нападает и на скот, волков, собак.", "– Мен хат танымаймын.": "– Я не умею читать.", "– Ендеше неге басыңызға сәлде орап алғансыз?": "– Тогда почему вы намотали на голову чалму?", "– Е, мәселе сәлдеде болса, мә, басыңа ора да, хатыңды оқып ала ғой, – депті оған Қожекең.": "– Э, если дело в чалме, на, намотай её на голову и сам прочитай своё письмо, — сказал ему Ходжа."}, "style_notes": [], "texts": [{"id": "l2v5-t1", "title": "", "source_note": "24KZ: «Түркістан облысында оқушылар тұрмыстық қалдықтардан робот жасады» – https://24.kz/kz/zha-aly-tar/bilim-zh-ne-ylym/763056-turkistan-oblysynda-okusylar-turmystyk-kaldyktardan-robot-zasady", "numbered_paragraphs": false, "paragraphs": ["Түркістан облысының Отырар ауданында ауыл мектебінің оқушылары ескі тұрмыстық заттардан робот жасап шығарды.", "Ал оқушылардың өздері ойлап тапқан мына робот күнделікті ағылшын тілі және өзге де пәндерде қолданылады. Робот флеш-жадтағы ақпаратты дыбысқа айналдырады. Ол істен шыққан шаңсорғыш пен дауыс зорайтқыш сынды тұрмыстық заттардың қаңқасынан құрастырылған.", "Дарынды оқушылар мен ұстаздардың тың идеясы арқылы іске асқан бұл жоба аудандық «Super star» байқауында бас жүлдеге ие болған."]}, {"id": "l2v5-t2", "title": "", "source_note": "24KZ: «Қостанайда кітапқұмарлар марапатталды» – https://24.kz/kz/zha-aly-tar/kogam/764948-kostanajda-kitapkumarlar-marapattaldy", "numbered_paragraphs": false, "paragraphs": ["Қостанайда «Кітап оқитын ұлт» жобасының жеңімпаздары марапатталды.", "Былтыр қыркүйек айында басталған «Кітап оқитын ұлт» жобасына 55 мың облыс тұрғыны қатысты. Шарт бойынша оларға 15 кітапты оқып шығу міндеттелді.", "Оқушылар арасында жеңімпаз атанғандардың бірі – Інжу Мақсұтбек. Ол Арқалық қаласынан келді. Кітапты кішкентай кезінен бастап оқитындықтан сайыс еш қиынға түспегенін айтады.", "– Менің сүйікті жазушым – Төлен Әбдік. Осы 15 кітаптың ішінде ол кісінің кітабы болды. Үлкен әсер алдым."]}, {"id": "l2v5-t3", "title": "", "source_note": "24KZ: «Түркістан облысының құтқарушылары 139 адамды аман сақтап қалды» – https://24.kz/kz/zha-aly-tar/kogam/800376-turkistan-oblysynyn-kutkarusylary-139-adamdy-aman-saktap-kaldy", "numbered_paragraphs": false, "paragraphs": ["Алмаз Жандәулетов 4 жылдан бері облыстық Төтенше жағдайлар департаментіне қарасты кинология бөлімін басқарады. Тәжірибелі кинолог «Зена» есімді мына иісшіл итті күшік кезінен бағып, осы салаға бейімдеген. 2 жыл күнделікті дайындықтан өтіп, өз қабілетін шыңдағанын айтады. Соның нәтижесінде 2024 жылы Алматыда өткен кинологтардың республикалық сайысында үздік нәтиже көрсетіпті.", "– Ол жерде үш тапсырма болды. Екіншісі үйінділердің астынан түнде адам іздеу, үшінші тапсырма – таулы аймақта тоғайдың ішінен жоғалған адамды іздедік. Ол жерде 25 ит қатысты, соның арасынан Зена үздік шықты.", "Алмаз Жандәулетов Зенаның көмегімен осы уақытқа дейін облыс аумағындағы таулы аймақтарда өз бетімен тауға шығып, кейін адасып кеткен онға жуық демалушыны іздеп тапқан.", "– Жоғалған адамды тапқаннан кейін үріп, бізге белгі береді. Біз иттің дауысы шыққан жаққа барып, жоғалған адамды тауып, көмек көрсетеміз."]}, {"id": "l2v5-t4", "title": "Жануарлардың рекордтары", "source_note": "Bilim-all.kz: «Әлемдегі ең жылдам тасбақа және жануарлардың басқа да рекордтары» – https://bilim-all.kz/article/2301", "numbered_paragraphs": true, "paragraphs": ["Гиннестің рекордтар кітабы 2016 жылғы басылымының көрсетілімін жасады. Көрсетілімде олар жан-жануарлардың рекордтарына көптеу көңіл бөлді. Кітаптағы мыңдаған рекордшылардың арасында – ең жылдам тасбақа, ең мамық қоян және ең мықты қақпашы ит бар.", "Жер бетіндегі ең кәрі шошқа – канадалық Эрнестина атты шошқа. Ол 2014 жылы 23 жас 76 күнінде өлген.", "Сонымен қатар бұл басылымда жапондық Пурин деп аталатын футболшы-ит те бар. Ол «Қақпада 1 минутта алдыңғы екі аяғымен ең көп допты қайтарған» деген критериямен кірген. Ол қаңтар айында 11 доп қайтарса, бірнеше ай өткеннен кейін 14 доп қайтарған.", "«Ең ұзын мүйіз» категориясын америкалық Лэйзи Блюграсс атты өгіз жеңіп алған. Ең ұзын жүн Франчески атты АҚШ-тық қоянға тиесілі.", "Ал ең жылдам тасбақа атағын англиялық Берти атты тасбақа жеңіп алған. Ол бір сағатта 0,6 миль (966 м-ге жақын) жүреді, және 100 метрді 6 минутта жүріп өтеді екен."]}, {"id": "l2v5-t5", "title": "Ералы Маметолдин – каратэден әлем чемпионы", "source_note": "Gov.kz (Шу ауданы әкімдігі): «Тараздық жас чемпион: табандылық пен жеңіс жолы» – https://www.gov.kz/memleket/entities/zhambyl-shu/press/news/details/1197074?lang=kk", "numbered_paragraphs": false, "paragraphs": ["1. – Спортқа келу жолың қалай басталды?", "– Мен, Маметолдин Ералы Серікұлы, Жамбыл облысы, Тараз қаласының тумасымын. Қазіргі таңда 18 жастамын. Спортқа келу жолым отбасымнан бастау алады. Әкемнің өзі спортқа жақын, белсенді адам болғандықтан, мені 8 жасымнан бастап каратэге берді.", "2. – Спорттағы алғашқы жетістіктерің туралы айтып берсең.", "– Алғашқы жеңісім Тараз қаласында өткен шағын турнирде болды. Сол жарыста 1-орын алған сәтім әлі күнге дейін есімде. Дәл сол жеңіс маған үлкен сенімділік беріп, «менің қолымнан келеді» деген сенімді қалыптастырды.", "3. – Күнделікті жаттығу тәртібің қандай?", "– Мен Тараз қаласындағы спорт мектебінде білім алдым. Ондағы тәртіп өте қатаң: күн таңғы 6-да басталады. Күніне екі мезгіл жаттығу жасаймыз, үш мезгіл дұрыс тамақтану режимі сақталады.", "4. – 2025 жылы Мәскеуде өткен әлем чемпионатында чемпион атандың. Бұл жеңіске жету жолындағы негізгі ережелер қандай?", "– Бұл жеңіс – ұзақ жылдар бойғы еңбектің нәтижесі. Негізгі ереже – тәртіп, тұрақты еңбек, мотивация және нақты мақсат. Әр жаттығу, әр қиындық сол жеңіске бір қадам жақындатты."]}, {"id": "l2v5-t6", "title": "", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Әдеп» – https://bilim-all.kz/article/2410", "numbered_paragraphs": false, "paragraphs": ["Бір жұрттың бас әкімі екінші бір байға жолығысып сөйлесіп тұрғанда, қасынан бір жарлы мұжық өтіп бара жатып иіліп, басұрып сәлем берді дейді. ___(15)___ әлгі үлкен әкім төре онан да төменірек басұрып сәлем алды. Қасындағы бай:", "– Тақсыр, осынша жұрттың үстінен қараған әкімсіз, осы бір мұжыққа неге сонша басұрасыз? – деп айтты дейді.", "Сонда әкім:", "– Ешбір ілім-білім үйренбеген мұжық сонша иіліп, әдептілігін көрсеткенде, мен **онан** әдепсіз болып қалайын ба? – деді дейді."]}, {"id": "l2v5-t7", "title": "", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Шеше мен бала» – https://bilim-all.kz/article/1636", "numbered_paragraphs": false, "paragraphs": ["Шешесі қыз баласынан сұрады:", "– Берген ақшамды қайда қойдың?", "– Бір тентек балаға бердім.", "– Мұнан былай тентек болма деп берген шығарсың?", "– Әлгі бала Құдай-тағаланың жаратқан кішкентай құсын ұстап алып, сатайын деп жүр екен. Құс кісі аярлық болып, шиқылдап тұрды. Сонда алып жүрген бала тұмсығын қыса береді.", "– Онда сен неғылдың?", "– Мен балаға ақша беріп сатып алып, құсты ұшырып қоя бердім. Менің бұл ісім сауап емес пе?", "– Әрине, сауап, ___(17)___."]}, {"id": "l2v5-t8", "title": "", "source_note": "Bilim-all.kz: «Жолбарыс» – https://bilim-all.kz/article/15920", "numbered_paragraphs": false, "paragraphs": ["Жолбарыс — сүтқоректілер класының мысықтар тұқымдасына жататын ірі жыртқыш аң.", "Жабайы шошқа, бұғы, марал, елік, т.б. тұяқты жануарларды ұстап жейді, кейде малға, қасқырға, итке де шабады. Жолбарыс 2-3 күшік туады, оларды 5-6 ай емізеді. Дүние жүзінде жолбарыстың саны жылдан жылға азаюда. Сондықтан жолбарыстың барлық түрі қорғауға алынып, Халықаралық табиғат қорғау одағының «Қызыл кітабына» енгізілген. Жолбарысты қазақ халқы ежелден күштіліктің символы санаған. 12-13-ғасырларда Тоқтамыс хан соқтырған тиында жолбарыс бейнесі салынған."]}, {"id": "l2v5-t9", "title": "", "source_note": "Bilim-all.kz: «Қожанасыр туралы әзілдер» – https://bilim-all.kz/quote/5030", "numbered_paragraphs": false, "paragraphs": ["Қожекең басына сәлдесін орап, көшеде келе жатады. Біреу аптығып жүгіріп келіп:", "– Қожеке, мына хатты оқып беріңізші! – деп өтініпті.", "– Мен хат танымаймын.", "– Ендеше неге басыңызға сәлде орап алғансыз?", "– Е, мәселе сәлдеде болса, мә, басыңа ора да, хатыңды оқып ала ғой, – депті оған Қожекең."]}], "items": [{"id": "l2v5-q1", "number": 1, "text_id": "l2v5-t1", "stem": "Оқушылар роботты неден жасады?", "options": {"A": "жаңа темір бөлшектерінен", "B": "ағаш пен қатты қағаздан", "C": "сатып алынған құралдардан", "D": "көне үй бұйымдарынан"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Түркістан облысының Отырар ауданында ауыл мектебінің оқушылары ескі тұрмыстық заттардан робот жасап шығарды."], "explanation": "Оқушылар роботты ескі тұрмыстық заттардан жасаған: істен шыққан шаңсорғыш пен дауыс зорайтқыштан. «Көне» – ескі, «бұйым» – зат деген сөз.", "editor_changes": "Мәтін қысқартылды («ақылды қоңырау» жобасы мен ұстаздардың сөзі алынды).", "explanation_ru": "Ученики сделали робота из старых бытовых вещей: сломанного пылесоса и громкоговорителя. «Көне» — то же, что «ескі» (старый), «бұйым» — то же, что «зат» (вещь).", "distractor_notes": {"A": "робот жаңа емес, ескі заттардан жасалған.", "B": "мәтінде ағаш пен қағаз туралы айтылмайды.", "C": "оқушылар ештеңе сатып алмаған, үйдегі ескі заттарды пайдаланған."}, "distractor_notes_ru": {"A": "робот сделан не из новых, а из старых вещей.", "B": "в тексте не говорится о дереве и бумаге.", "C": "ученики ничего не покупали, а использовали старые бытовые вещи."}, "distractor_evidence": {"A": [], "B": [], "C": ["Ол істен шыққан шаңсорғыш пен дауыс зорайтқыш сынды тұрмыстық заттардың қаңқасынан құрастырылған."]}, "keywords": {"ok": {"kk": ["ескі тұрмыстық заттардан"], "ru": ["старых бытовых вещей"]}, "C": {"kk": ["істен шыққан"], "ru": ["сломанных бытовых вещей"]}}}, {"id": "l2v5-q2", "number": 2, "text_id": "l2v5-t2", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Жоба биыл қаңтар айында басталды.\n2. Қатысушылар он кітап оқып шығуы тиіс болды.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Былтыр қыркүйек айында басталған «Кітап оқитын ұлт» жобасына 55 мың облыс тұрғыны қатысты.", "Шарт бойынша оларға 15 кітапты оқып шығу міндеттелді."], "explanation": "Екі тұжырым да қате: жоба биыл қаңтарда емес, былтыр қыркүйекте басталған. Қатысушылар он емес, 15 кітап оқуы керек болған.", "editor_changes": "Мәтін қысқартылды.", "explanation_ru": "Оба утверждения неверны: проект начался не в январе этого года, а в сентябре прошлого. Участникам нужно было прочитать не десять, а 15 книг.", "distractor_notes": {"A": "бірінші тұжырым қате. Жобаның қашан басталғанын қайта оқы.", "B": "екінші тұжырым қате. Неше кітап оқу керек болғанын қайта оқы.", "C": "екі тұжырымды да мәтінмен тағы салыстыр: уақыты мен кітап саны дұрыс па?"}, "distractor_notes_ru": {"A": "первое утверждение неверно. Перечитай, когда начался проект.", "B": "второе утверждение неверно. Перечитай, сколько книг нужно было прочитать.", "C": "сравни оба утверждения с текстом ещё раз: верны ли время и число книг?"}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["Былтыр қыркүйек айында", "15 кітапты"], "ru": ["в сентябре прошлого года", "15 книг"]}}}, {"id": "l2v5-q3", "number": 3, "text_id": "l2v5-t3", "stem": "Мәтін не туралы?\n... ит туралы", "options": {"A": "жолдан жаңылғандарға көмектескен", "B": "иесінен қашып, тауға кетіп қалған", "C": "күшік кезінен ауырып, әлсіреген", "D": "жарыста ешқандай орын алмай қалған"}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Алмаз Жандәулетов Зенаның көмегімен осы уақытқа дейін облыс аумағындағы таулы аймақтарда өз бетімен тауға шығып, кейін адасып кеткен онға жуық демалушыны іздеп тапқан.", "– Жоғалған адамды тапқаннан кейін үріп, бізге белгі береді."], "explanation": "Мәтінде Зена есімді қызметтік иттің тауда адасып кеткен адамдарды тауып, құтқарушыларға көмектесетіні айтылады. «Жаңылу» – адасу деген сөз.", "editor_changes": "Мақаланың ит туралы бөлігі ғана алынып, қысқартылды; кинологтың сөзінен «Бірінші тапсырма – тыңдау» деген сөйлем алынды.", "explanation_ru": "В тексте рассказывается, как служебная собака Зена находит заблудившихся в горах людей и помогает спасателям. «Жаңылу» значит «заблудиться».", "distractor_notes": {"B": "ит қашқан жоқ: тауға адамдар өз бетімен шығып, адасып кеткен.", "C": "мәтінде иттің ауырғаны айтылмайды. Оны күшік кезінен баптаған.", "D": "мәтінде керісінше айтылған: Зена жарыста ең үздігі болды."}, "distractor_notes_ru": {"B": "собака не убегала: это люди сами ушли в горы и заблудились.", "C": "в тексте не говорится, что собака болела. Её готовили со щенячьего возраста.", "D": "в тексте сказано обратное: Зена стала лучшей на соревновании."}, "distractor_evidence": {"B": [], "C": ["Тәжірибелі кинолог «Зена» есімді мына иісшіл итті күшік кезінен бағып, осы салаға бейімдеген."], "D": ["Ол жерде 25 ит қатысты, соның арасынан Зена үздік шықты."]}, "keywords": {"ok": {"kk": ["адасып кеткен", "Жоғалған адамды тапқаннан кейін"], "ru": ["заблудились", "найдя пропавшего человека"]}, "C": {"kk": ["күшік кезінен бағып"], "ru": ["со щенячьего возраста"]}, "D": {"kk": ["Зена үздік шықты"], "ru": ["зена оказалась лучшей"]}}}, {"id": "l2v5-q4", "number": 4, "text_id": "l2v5-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Зена дайындықтан небәрі екі ай ғана өтті.", "B": "Сайыста Зена озат шықты.", "C": "Ит адамды тапқанда үнсіз тұрып күтеді.", "D": "Алмаз Зенаны ересек кезінде сатып алған."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ол жерде 25 ит қатысты, соның арасынан Зена үздік шықты."], "explanation": "Сайысқа 25 ит қатысқан, солардың ішінде Зена үздік шыққан. «Озат» – үздік деген сөз.", "editor_changes": "", "explanation_ru": "В соревновании участвовали 25 собак, и Зена стала лучшей. «Озат» — то же, что «үздік» (лучший).", "distractor_notes": {"A": "Зена екі ай емес, екі жыл дайындықтан өткен.", "C": "ит адамды тапқанда үріп, белгі береді.", "D": "Алмаз Зенаны күшік кезінен бағып өсірген."}, "distractor_notes_ru": {"A": "Зена тренировалась не два месяца, а два года."  с текстом ещё раз: в каком городе была первая победа?", "D": "первое утверждение есть в тексте. Перечитай, кто отдал Ералы в каратэ."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Әкемнің", "каратэге берді", "Тараз қаласында"], "ru": ["мой отец", "отдал меня в каратэ", "в таразе"]}}}, {"id": "l2v5-q10", "number": 10, "text_id": "l2v5-t5", "stem": "Сұхбат бөлімдерінің реті қандай?\n1. Чемпиондыққа жеткізген ережелер\n2. Ералының күн тәртібі\n3. Спортқа келген жолы\n4. Алғашқы жеңісі", "options": {"A": "1, 2, 3, 4", "B": "3, 4, 1, 2", "C": "3, 4, 2, 1", "D": "3, 2, 4, 1"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["1. – Спортқа келу жолың қалай басталды?", "– Алғашқы жеңісім Тараз қаласында өткен шағын турнирде болды.", "3. – Күнделікті жаттығу тәртібің қандай?", "Негізгі ереже – тәртіп, тұрақты еңбек, мотивация және нақты мақсат."], "explanation": "Алдымен Ералы спортқа қалай келгенін айтады (3), сосын алғашқы жеңісі туралы (4), кейін күнделікті тәртібі туралы (2), соңында чемпиондыққа жеткізген ережелер туралы (1).", "editor_changes": "", "explanation_ru": "Сначала Ералы рассказывает, как пришёл в спорт (3), затем о первой победе (4), потом о режиме дня (2), и в конце о правилах, которые привели к чемпионству (1).", "distractor_notes": {"A": "сұхбат ережелерден басталмайды, ол туралы ең соңында айтылады.", "B": "алғашқы екі бөлім дұрыс. Бірақ күн тәртібі ережелерден бұрын айтылады.", "D": "алғашқы жеңіс туралы күн тәртібінен бұрын айтылады."}, "distractor_notes_ru": {"A": "интервью не начинается с правил — о них говорится в конце.", "B": "первые две части верны. Но о режиме дня сказано раньше, чем о правилах.", "D": "о первой победе сказано раньше, чем о режиме дня."}, "distractor_evidence": {"A": ["Негізгі ереже – тәртіп, тұрақты еңбек, мотивация және нақты мақсат."], "B": [], "D": ["– Алғашқы жеңісім Тараз қаласында өткен шағын турнирде болды."]}, "keywords": {"ok": {"kk": ["Спортқа келу жолың", "Алғашқы жеңісім", "жаттығу тәртібің", "Негізгі ереже"], "ru": ["путь в спорт", "первая победа", "режим тренировок", "главное правило"]}, "A": {"kk": ["Негізгі ереже"], "ru": ["главное правило"]}, "D": {"kk": ["Алғашқы жеңісім"], "ru": ["первая победа"]}}}, {"id": "l2v5-q11", "number": 11, "text_id": "l2v5-t5", "stem": "Ералының ойынша, жеңіске не жеткізеді?", "options": {"A": "Жеңіске адамды тек туа біткен қабілеті ғана жеткізеді.", "B": "Табанды еңбек пен анық мақсат табысқа жеткізеді.", "C": "Көп жарысқа қатысу ғана адамды жеңіске апарады.", "D": "Жақсы бапкер болса, күнделікті жаттығу қажет емес."}, "key": "B", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Негізгі ереже – тәртіп, тұрақты еңбек, мотивация және нақты мақсат."], "explanation": "Ералының ойынша, негізгі ереже – тәртіп, тұрақты еңбек, мотивация және нақты мақсат. «Табанды» – тұрақты, «анық» – нақты, «табыс» – жеңіс деген сөз.", "editor_changes": "", "explanation_ru": "По мнению Ералы, главное правило — дисциплина, постоянный труд, мотивация и конкретная цель. «Табанды» — то же, что «тұрақты» (постоянный), «анық» — «нақты» (конкретный), «табыс» — «жеңіс» (победа, успех).", "distractor_notes": {"A": "Ералы туа біткен қабілет туралы емес, еңбек туралы айтады.", "C": "Ералы жарыстың санын емес, еңбек пен мақсатты атайды.", "D": "Ералы керісінше, күніне екі мезгіл жаттығады."}, "distractor_notes_ru": {"A": "Ералы говорит не о врождённых способностях, а о труде.", "C": "Ералы называет не число соревнований, а труд и цель.", "D": "Ералы, наоборот, тренируется два раза в день."}, "distractor_evidence": {"A": ["– Бұл жеңіс – ұзақ жылдар бойғы еңбектің нәтижесі."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["тұрақты еңбек", "нақты мақсат"], "ru": ["постоянный труд", "конкретная цель"]}, "A": {"kk": ["еңбектің нәтижесі"], "ru": ["результат многолетнего труда"]}}}, {"id": "l2v5-q12", "number": 12, "text_id": "l2v5-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "ертегі", "B": "сұхбат", "C": "өлең", "D": "хабарландыру"}, "key": "B", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["3. – Күнделікті жаттығу тәртібің қандай?"], "explanation": "Мәтін сұрақ пен жауаптан тұрады: тілші сұрақ қояды, Ералы жауап береді. Мұндай мәтін – сұхбат.", "editor_changes": "", "explanation_ru": "Текст состоит из вопросов и ответов: журналист спрашивает, Ералы отвечает. Такой текст — интервью (сұхбат).", "distractor_notes": {"A": "ертегіде ойдан шығарылған оқиға болады. Мұнда нақты спортшымен әңгіме жазылған.", "C": "өлеңде ұйқас пен ырғақ болады. Бұл мәтін қара сөзбен жазылған.", "D": "хабарландыру – қысқа хабар. Ал мұнда сұрақ-жауап бар."}, "distractor_notes_ru": {"A": "в сказке бывают вымышленные события. Здесь записана беседа с реальным спортсменом.", "C": "в стихотворении есть рифма и ритм. Этот текст написан прозой.", "D": "объявление — короткое сообщение. А здесь есть вопросы и ответы."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["тәртібің қандай"], "ru": ["какой у тебя"]}}}, {"id": "l2v5-q13", "number": 13, "text_id": "l2v5-t6", "stem": "Мұжық әкімге қалай сәлем берді?", "options": {"A": "қолын жоғары көтеріп, айқайлап", "B": "басын сәл ғана изеп, күлімсіреп", "C": "сәлем бермей, жай өтіп кетті", "D": "қатты еңкейіп, тағзым етіп"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Бір жұрттың бас әкімі екінші бір байға жолығысып сөйлесіп тұрғанда, қасынан бір жарлы мұжық өтіп бара жатып иіліп, басұрып сәлем берді дейді."], "explanation": "Мұжық өтіп бара жатып иіліп, басұрып сәлем берген. «Еңкею» – иілу, «тағзым ету» – басұру, құрмет көрсету деген сөз.", "editor_changes": "Сызықшалар бірізге келтірілді.", "explanation_ru": "Проходя мимо, мужик низк app.addEventListener("click",e=>{ const b=e.target.closest("[data-am]"); if(b){ authMode=b.dataset.am; renderAuth(); } });
app.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm") return; e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target)), btn=e.target.querySelector("button[type=submit]"), err=e.target.querySelector(".err");
  const fail=m=>{ err.textContent=m; btn.disabled=false; };
  f.email=(f.email||"").trim().toLowerCase(); btn.disabled=true; err.textContent="";
  if(!f.email||!f.password) return fail("Пошта мен құпиясөзді енгізіңіз.");
  if(authMode==="reg"){
    if(f.password.length<8) return fail("Құпиясөз кемінде 8 таңба болуы керек.");
    if(f.password!==f.password2) return fail("Құпиясөздер бірдей емес.");
    const {data:d,error}=await sb.auth.signUp({email:f.email,password:f.password});
    if(error) return fail(/NOT_ALLOWED|Database error/i.test(error.message)?"Бұл пошта мұғалімдер тізімінде жоқ.":/registered|exists/i.test(error.message)?"Бұл пошта тіркелген. «Кіру» бөлімі арқылы кіріңіз.":"Тіркелу кезінде қате шықты: "+error.message);
    if(!d.session) return fail("Тіркелу аяқталмады. Поштаңызды тексеріңіз.");
    return start(d.user);
  }
  const {data:d,error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});
  if(error) return fail("Пошта не құпиясөз қате.");
  start(d.user);
});

async function fetchAll(make){ let out=[], from=0; for(;;){ const {data:d,error}=await make().range(from,from+999); if(error) throw error; out=out.concat(d); if(d.length<1000) return out; from+=1000; } }
async function loadClasses(){
  const {data:cl,error}=await sb.from("classes").select("id,code,name,active,created_at").order("created_at");
  if(error){ app.innerHTML=`<p class="err">Қате: ${esc(error.message)}</p>`; return; }
  const {data:sc}=await sb.from("students").select("class_id");
  const cnt={}; for(const s of sc||[]) cnt[s.class_id]=(cnt[s.class_id]||0)+1;
  classes=cl.map(c=>({...c, n:cnt[c.id]||0}));
}
async function loadClass(c){
  app.innerHTML=`<p class="sub">Жүктеліп жатыр…</p>`;
  // 003 көшіруі іске қосылмаған болса (phone бағандары жоқ), бұрынғы бағандармен оқиды
  let students=await fetchAll(()=>sb.from("students").select("user_id,login,first_name,last_name,grade,city,school,phone,parent_phone,created_at").eq("class_id",c.id).order("last_name")).catch(()=>null);
  if(!students) students=await fetchAll(()=>sb.from("students").select("user_id,login,first_name,last_name,grade,city,school,created_at").eq("class_id",c.id).order("last_name"));
  const ids=students.map(s=>s.user_id);
  let attempts=[], answers=[];
  if(ids.length){
    // Сілтеме тым ұзын болмауы үшін оқушыларды 60-тан бөліп сұраймыз
    for(let i=0;i<ids.length;i+=60){ const part=ids.slice(i,i+60);
      attempts=attempts.concat(await fetchAll(()=>sb.from("attempts").select("id,user_id,bank_id,mode,started_at,finished_at,first_correct,total").in("user_id",part).order("started_at")));
      answers=answers.concat(await fetchAll(()=>sb.from("answers").select("attempt_id,user_id,bank_id,item_id,skill,level,tries,status,first_correct,updated_at").in("user_id",part).order("item_id")));
    }
  }
  data={students, attempts, answers};
}
// Әр сұрақтың соңғы жауабы (оқушы нұсқаны қайта орындаса, соңғы әрекет есептеледі)
function latestAnswers(rows){
  const at=Object.fromEntries(data.attempts.map(a=>[a.id,a])), best={};
  for(const r of rows){ const k=r.user_id+"|"+r.item_id, a=at[r.attempt_id]; const t=a?a.started_at:r.updated_at;
    if(!best[k] || t>best[k].t) best[k]={...r,t}; }
  return Object.values(best);
}
