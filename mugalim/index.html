<style>
:root{
  --paper:#F4F6F9; --panel:#FFFFFF; --ink:#18212E; --muted:#596476; --line:#DCE1E8;
  --accent:#1D5BA6; --accent-soft:#E3ECF7;
  --ok:#1C7A4E; --ok-soft:#E1F2E9; --bad:#B23A30; --bad-soft:#F8E4E2;
  --good:#5CCB8A; --mid:#F2C230; --weak:#E5534B;
  --f-text:"PT Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;caret-color:transparent}
input,textarea,select{caret-color:auto}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand a{font-family:var(--f-ui);font-weight:800;font-size:22px;letter-spacing:-.3px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand a .ai{color:var(--accent);font:inherit;letter-spacing:inherit}
.brand > span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:4px 10px;font-size:13px}
.themebtn{width:36px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:999px;display:grid;place-items:center;font-size:16px;padding:0}
main{padding-block:22px 60px}
h1{font-family:var(--f-text);font-size:28px;margin:0 0 4px;line-height:1.25}
h2{font-family:var(--f-text);font-size:21px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.eyebrow{font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--muted)}
.crumbs button{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
/* Кіру */
.auth{max-width:440px;margin:30px auto}
.af{display:grid;gap:12px}
.af label{display:grid;gap:5px;font-size:14px;font-weight:600}
.af input,.af select{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.af .err{color:var(--bad);font-size:14px;margin:0;min-height:1em}
.af .hint{font-size:13px;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Сыныптар */
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ccard h3{font-family:var(--f-text);font-size:19px;margin:0}
.ccard.closed{opacity:.7}
.code{font:700 22px/1 var(--f-ui);letter-spacing:4px;color:var(--accent)}
.meta{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.newclass{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.newclass input{flex:1 1 220px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* Сынып беті */
.classhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:700 24px var(--f-text);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.vtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.vtabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.vtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14px}
.filters select,.filters input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--paper)}
th button{border:0;background:none;padding:0;font-weight:700;color:inherit}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--accent-soft)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.pill.good{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:#FBF1CC;color:#7A5A00} .pill.weak{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--paper);color:var(--muted)}
:root[data-theme="dark"] .pill.mid{background:#3A3215;color:#F2C230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.mid{background:#3A3215;color:#F2C230}}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* Жолақтар */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 5.5em;gap:12px;align-items:center;font-size:14px}
.bar .track{height:12px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar .v small{color:var(--muted)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grp{font-weight:700;margin:16px 0 6px;font-size:14px}
/* Оқушы беті */
.qlist{display:grid;gap:10px}
.qi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.qi .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.qi .stem{font-weight:600;white-space:pre-line;margin-bottom:6px}
.qi .ans{display:grid;gap:3px}
.qi .ans .w{color:var(--bad)} .qi .ans .k{color:var(--ok)}
.status{font-weight:700}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.second{color:#B07A00}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.att{display:grid;gap:8px}
@media (min-width:1400px){
  .wrap{max-width:none;width:90%;padding-left:0;padding-right:0}
  body{font-size:16.5px} table{font-size:15.5px} th{font-size:13.5px} .btn{font-size:15px}
  h1{font-size:32px} h2{font-size:23px} .kpi b{font-size:28px} .kpi span,.meta{font-size:14.5px}
  .bar{font-size:15.5px} .qi{font-size:15.5px} .classes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media (max-width:760px){
  #stuBtn{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .twocol{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(0,1fr) 5em;}
  .bar .track{grid-column:1/-1;grid-row:2}
  h1{font-size:24px}
  .brand > span{display:none}
}
</style>

const SB_CFG = {"url": "https://yqfepngubehrupkitklr.supabase.co", "key": "sb_publishable_R_DvPrvev24GFHUtyGwhRw_r5CopZYH"};

ть по стране и находить общий язык с местными жителями, мне пришлось выучить русский язык.", "Кейін жергілікті бір қарт маған америкалық археолог Рафаэль Пампелли туралы айтып берді.": "Позже один местный старик рассказал мне об американском археологе Рафаэле Пампелли.", "жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады": "им понравилась наша работа, потому что они могут свободно путешествовать вместе с нами", "Ал екі ұлым болашақта археолог болғысы келмесе де, бізбен бірге үлкен қазба жұмыстарына қатысып, жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады.": "А двое моих сыновей, хотя и не хотят в будущем становиться археологами, участвуют с нами в больших раскопках, и им понравилась наша работа, потому что они могут свободно путешествовать вместе с нами.", "Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық.": "Прошлым летом мы возили их на озеро Титикака в Андах, в Южной Америке.", "Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын.": "Этот человек ничем не отличается от меня. Я поступил бы точно так же.", "Мысалы, заманында кемелерден түскен тауарларды сақтайтын ескі үйдің алдынан 700 жылдық төсеніш тауып алдық.": "Например, перед старым домом, где когда-то хранили товары с кораблей, мы нашли подстилку 700-летней давности.", "теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын": "я участвую в нескольких проектах по изучению морского дна и до сих пор продолжаю рисовать найденные предметы", "Менің әйелім де археолог.": "Моя жена тоже археолог.", "Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды – бұл Қытаймен арадағы сауданың қызу жүруіне байланысты болса керек.": "Примерно в XVII веке во Франции и Англии зонты начинают широко распространяться — вероятно, благодаря оживлённой торговле с Китаем.", "Ежелгі мысырлықтар ... оны арнайы қызметшілер атқарған": "Древние египтяне ... это делали специальные слуги", "ежелгі Грецияға ... дұрысы, құлдары көтеріп жүретін": "в Древнюю Грецию ... вернее, его носили их рабы", "Қолшатыр шығыстан ежелгі Грецияға келе сала жергілікті сәнқой арулардың қолынан түспейтін аксессуарға айналды.": "Попав с Востока в Древнюю Грецию, зонт сразу стал любимым аксессуаром местных модниц."}, "style_notes": ["«Мазалама» деп жазба, оның орнына «Уайымдама» не «Алаң болма» де"], "texts": [{"id": "v1-t1", "title": "Қолшатыр тарихы", "source_note": "«OYLA» журналы", "source_note_ru": "журнал «OYLA»", "numbered_paragraphs": true, "paragraphs": ["Ең алғашқы қолшатырлар ұзын таяқшаға таңылған алып веер түрінде болған. Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған. Мұндай қолшатырлар түрлі шеру кезінде фараондар мен олардың отбасын Африканың шақырайған күн көзінен қорғаған. Әрине, қолшатырды әміршінің өзі ұстамаған: оны арнайы қызметшілер атқарған.", "Осыған ұқсас дәстүр Месопотамияда, Парсы елінде, Қытай, Жапония мен Үндістанда да болған. Ассирияда қолшатыр тек патшаларға тән атрибут болған, ал Қытайда көлеңкеге жасырыну құқығы тек ақсүйектерге берілген. Ежелгі өркениет тұрғындары қолшатырды көре сала оның астында аса маңызды біреу отырғанын бірден түсінген.", "Қолшатыр шығыстан ежелгі Грецияға келе сала жергілікті сәнқой арулардың қолынан түспейтін аксессуарға айналды. Белгілі бір себептерге байланысты оны тек әйелдер ғана (дұрысы, құлдары көтеріп жүретін) пайдаланатын, ал ер адамдар үшін қолшатыр ұстау ұят саналатын.", "Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды – бұл Қытаймен арадағы сауданың қызу жүруіне байланысты болса керек. Ол уақыттарда қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған, ал күмбезі – жасалуы аса қолайсыз майланған жібектен болған. Ақыры 1852 жылы британ кәсіпкері Сэмюэль Фокс тура қазіргі түрлері секілді іші қуыс болат тұтқаларды ұсынды. Конструкциясы жеңіл әрі берік бола түсті. Сондай-ақ қалталы азаматтар ішіне қылыштарын немесе құтыларын салып қоюға болатын ерекше тұтқалы қолшатырларға тапсырыс бере бастады. XIX ғасыр ортасында қолшатыр ерлер аксессуарларының арасынан ойып тұрып орын алды.", "Қазіргі таңда қолшатырды ерлер де, әйелдер де пайдалана береді, бірақ қызықты айырмашылық та бар. Мысалы, sunnycomb.com сайты 35 елдің тұрғындарының арасында жүргізген сауалнама нәтижесіне сәйкес, ер адамдар көбіне қара түсті, ал әйелдер жасыл не қызыл түсті қолшатырды құп көретіндері анықталды. Сондай-ақ ер азаматтар аксессуарды әйелдерге қарағанда екі есе жиі жоғалтады."]}, {"id": "v1-t2", "title": "Абзал мен етікші", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Баяғы бір заманда Күйік шаһарында бір етікші болыпты. Оның жақын көршісінің Абзал есімді баласы бар екен. Ол бала ата-анасынан жақсы тәрбие алып, ненің жаман, ненің жақсы екенін үйреніп алады. Үлкендерге құрмет көрсететін тіл алғыш, адал, көркем мінезді ұл болып өседі. Өз күшімен еңбек етіп, ата-анасына көмектесу ойымен, етікшінің жанына көмекші болып барады. Ерінбей, жалықпай етікшіліктің бар қыр-сырын үйренеді. Абзал бір күні етікшінің етік жамағанда үнемі жібін түймейтіндігін байқап қалыпты. Аң-таң болған бала етікші ұстазынан мұның мән-сырын сұрайды.", "Сонда ол:", "– Қарағым, етік жамағанда жіпті түймесең, ол етік көп ұзамай қайта жыртылады. Сөйтіп оның иесі оны жаматуға қайта әкеледі. Одан маған жұмыс, бала-шағама нан табылады, – дейді.", "Сонда Абзал ата-анасының айтқан ізгілік тәрбиесін есіне түсіріп:", "– Ағатай, бұл дұрыс емес қой, адам кәсібіне адал болуы қажет емес пе?! – дейді.", "Етікші бұл сөзге құлақ аспай:", "– Адалдық адамға нан болмайды ғой! – деп жауап береді. Абзал ұстазымен сөз таластырмайды.", "Ұстазының бұл әрекетіне іштей разы болмаса да, етікшілік кәсібін меңгеруді жалғастыра береді. Күндердің бір күнінде бала етікшілік кәсіпті ұстазынан кем білмейтін дәрежеге жетіп, өз бетінше етік тігуге кіріседі. Бірақ ол етік жамағанда жіпті түйіп тігеді. Арада көп уақыт өтпей-ақ шаһар халқы ісін ұқыпты істейтін етікші туралы естиді. Жұрттың барлығы етіктерін соған жамататын болады. Ал оның ұстазына етік жаматуға мүлде ешкім келмей қояды. Ұстазы мұның мәнісін білмек болып, шәкіртінен сұрайды. Ол: «__________», – депті."]}, {"id": "v1-t3", "title": "Пошташы көгершін", "source_note": "", "numbered_paragraphs": true, "paragraphs": ["Көгершін – жер тануда **алдына жан салмайтын** киелі құс. Туған жерін, ұя салған орнын жазбай таниды. Көгершінді ұстап алып, алысқа апарып тастаса да, ұясын іздеп табады. Мұны адамдар ежелден байқаған. Сондықтан көгершінді пошташы «қызметіне» алып, қарым-қатынас құралына айналдырған.", "Пошта тасуға басқа құстарды да үйретуге болады. Бірақ хатшылық – көгершіннің қанында бар қасиет. Оны үйретудің қажеті жоқ. Хатты байлап, ұшырып жіберсең болды – туған жерін айнымай табады. Көгершіннің кемшілігі – тек бір бағытта ғана хат таси алатыны, яғни тек үйіне қарай ұшатыны. Француздар шағаланы, орыстар сұңқарды, ағылшындар қарлығашты пошта тасуға үйретіп көрген. Алайда олар көгершіндей көрсеткіш көрсете алмады. Көгершін хатты жылдам жеткізеді әрі күн райының қиындығына қарамайды.", "Көгершінді қолға үйретудің тарихына үңілетін болсақ, бәрі көне гректерден басталғанын көреміз. Көне Грекияда адамдар көгершінді туған жерінен ұстап әкетіп, хат байлап қайта ұшырып жіберген. Мәселен, Олимпиада ойындарының жүлдегерін көгершін арқылы еліне хабарлаған.", "1176 жылы Мысырда Нұраддин патшаның кезінде ресми түрде мемлекеттік көгершін пошта қызметі құрылған. Ал француздар көгершінді 1870–1871 жылдары болған француз-неміс соғысында жиі пайдаланған. Тіпті немістер хабаршының жолын кесу үшін қаршығаны қолданған. Бірақ француздар мұның да амалын тапқан екен. Көгершіннің аяғына кішкентай ысқырық тағып жіберген. Ысқырық құс ұшқан кезде ауаға үйкеліп, ащы дыбыс шығарады. Бұл дыбыстан жыртқыш құстар қорқып, көгершінге жоламайды.", "Қазір коммуникацияның дамыған заманы. ХХ ғасыр логистиканың ғасыры болса, ХХІ ғасыр – ақпарат пен коммуникация ғасыры. Әлемнің кез келген жеріне қас қағым сәтте хат жіберуге болады. Алайда пошташы көгершіндердің ғұмыры таусылған уақыт десек, қателескен боламыз, себебі кей жерлерде олар әлі күнге дейін жақын арақашықтықта пошта тасуға қолданылады. Мәселен, ағылшынның Плимут қаласының дәрігерлері әлі күнге дейін клиникадағы қан талдамасын зертханаға көгершінмен жібереді. Клиника мен зертхананың арасы жап-жақын, бірақ көлік кептелісінің кесірінен дәрігерлер сараптама қорытындысын дер кезінде жеткізу үшін сол көгершіннің көмегіне әлі күнге дейін жүгінеді. Үндістан да шалғай елді мекендерге көгершінмен пошта жеткізеді екен."]}, {"id": "v1-t4", "title": "Археолог әңгімесі", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Археологтермен бірге алғаш жұмыс істей бастағанымда мен олар сияқты жерден заттарды қазумен айналысқан жоқпын. Оның орнына суретші болып жұмыс істедім, олар тапқан нәрселердің бейнесін қағаз бетіне түсіруге тырыстым. Алайда уақыт өте келе заттардың суретін салудан гөрі олардың тарихы, болмысы қызықтыратын болды. Археологиядағы мансабым осылай басталды. Қазірде Мысырдан Моңғолияға дейін созылған атақты «Жібек жолын» зерттеумен айналысамын. Сонымен қатар теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын.", "Археология саласындағы менің пірім – Рафаэль Пампелли деген америкалық зерттеуші. Мен ол туралы алғаш студент кезімде, Азияның дәл ортасында орналасқан Түркіменстанға саяхат барысында естідім. Елді аралау және жергілікті халықпен тіл табыса білу үшін орыс тілін үйренуге тура келді. Ол жерге жеткенде: «Уау! Мен мұнда аяқ басқан алғашқы америкалықтардың бірімін!» – деп ойладым. Кейін жергілікті бір қарт маған америкалық археолог Рафаэль Пампелли туралы айтып берді. Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен.", "Менің әйелім де археолог. Ал екі ұлым болашақта археолог болғысы келмесе де, бізбен бірге үлкен қазба жұмыстарына қатысып, жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады. Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық. Сондықтан отбасымызбен археологпыз десем, қателеспейтін шығармын.", "Осы салада басымнан өткен ең қызық жағдай Мысырдың Қызыл теңіз жағалауында жүргізілген қазба жұмысы кезінде болды. Ол жақта жаңбыр сирек жауып, ауа өте құрғақ болғаны сонша, көп нәрсе бастапқы қалпында сақталған. Мысалы, заманында кемелерден түскен тауарларды сақтайтын ескі үйдің алдынан 700 жылдық төсеніш тауып алдық. Астын көтеріп қарасақ, үй иесінің аты жазылған кілт сол қалпы жатыр екен. Иесі алыс сапарға шығып, кез келген минутта үйіне қайтып келетіндей көрінді. Сол кезде мен: «Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын», – деп ойладым."]}], "items": [{"id": "v1-q01", "number": 1, "text_id": "v1-t1", "stem": "Мәтін бойынша қолшатыр жасау үшін қай материал ҚОЛДАНЫЛМАҒАН?", "options": {"A": "Кит мұрты", "B": "Папирус", "C": "Емен жапырақтары", "D": "Болат"}, "key": "C", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 3, "negative": true, "evidence": ["Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған. (1-азатжол)", "қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған (4-азатжол)", "іші қуыс болат тұтқаларды ұсынды (4-азатжол)"], "explanation": "Мәтінде пальма жапырақтары айтылады, ал емен жапырақтары туралы еш жерде сөз жоқ.", "distractor_notes": {"A": "кит мұрты қолшатыр жасауға қолданылған. Ол туралы 4-азатжолда жазылған.", "B": "папирус қолшатыр жасауға қолданылған. Ол туралы 1-азатжолда жазылған.", "D": "болат та қолданылған. Болат тұтқалар туралы 4-азатжолда жазылған."}, "editor_changes": "«Қауырсын» нұсқасы алынды. Сұрақ толық сөйлемге айналды, болымсыздық бас әріппен берілді.", "distractor_evidence": {"A": ["қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған"], "B": ["Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған"], "D": ["іші қуыс болат тұтқаларды ұсынды"]}, "keywords": {"ok": {"kk": ["қауырсыннан", "папирус", "пальма жапырақтарынан", "қамыстан", "киттің мұртынан", "болат"], "ru": ["перьев", "папируса", "пальмовых листьев", "тростника", "китового уса", "стальные"]}, "A": {"kk": ["киттің мұртынан"], "ru": ["китового уса"]}, "B": {"kk": ["папирус"], "ru": ["папируса"]}, "D": {"kk": ["болат тұтқаларды"], "ru": ["стальные ручки"]}}, "explanation_ru": "В тексте упоминаются пальмовые листья, а о дубовых листьях не сказано нигде.", "distractor_notes_ru": {"A": "Китовый ус использовался для изготовления зонтов. Об этом написано в 4-м абзаце.", "B": "Папирус использовался для изготовления зонтов. Об этом написано в 1-м абзаце.", "D": "Сталь тоже использовалась. О стальных ручках написано в 4-м абзаце."}, "fixed_order": false}, {"id": "v1-q02", "number": 2, "text_id": "v1-t1", "stem": "Мәтін бойынша қолшатырды қызметшісіне ұстатқызу дәстүрі қай елге қатысты АЙТЫЛМАЙДЫ?", "options": {"A": "Франция", "B": "Үндістан", "C": "Мысыр", "D": "Греция"}, "key": "A", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 3, "negative": true, "evidence": ["Ежелгі мысырлықтар ... оны арнайы қызметшілер атқарған (1-азатжол)", "Осыған ұқсас дәстүр ... Үндістанда да болған (2-азатжол)", "ежелгі Грецияға ... дұрысы, құлдары көтеріп жүретін (3-азатжол)"], "explanation": "Франция 4-азатжолда аталады, бірақ онда қолшатырдың жаппай қолданысқа енгені айтылады, қызметші туралы сөз жоқ.", "distractor_notes": {"B": "мәтінде Үндістанда да осындай дәстүр болғаны айтылады. Ол туралы 2-азатжолда жазылған.", "C": "мысырлықтардың қолшатырын арнайы қызметшілер ұстаған. Ол туралы 1-азатжолда жазылған.", "D": "ежелгі Грецияда қолшатырды құлдар көтеріп жүрген. Ол туралы 3-азатжолда жазылған."}, "editor_changes": "«Қытай» нұсқасы алынды.", "distractor_evidence": {"B": ["Осыған ұқсас дәстүр Месопотамияда, Парсы елінде, Қытай, Жапония мен Үндістанда да болған"], "C": ["Ежелгі мысырлықтар", "оны арнайы қызметшілер атқарған"], "D": ["Қолшатыр шығыстан ежелгі Грецияға келе сала", "дұрысы, құлдары көтеріп жүретін"]}, "keywords": {"ok": {"kk": ["мысырлықтар", "қызметшілер", "дәстүр", "Үндістанда", "Грецияға", "құлдары"], "ru": ["египтяне", "слуги", "традиция", "Индии", "Древнюю Грецию", "рабы"]}, "B": {"kk": ["Осыған ұқсас дәстүр", "Үндістанда"], "ru": ["Похожая традиция", "Индии"]}, "C": {"kk": ["мысырлықтар", "қызметшілер"], "ru": ["египтяне", "слуги"]}, "D": {"kk": ["Грецияға", "құлдары"], "ru": ["Древнюю Грецию", "рабы"]}}, "explanation_ru": "Франция упоминается в 4-м абзаце, но там говорится о массовом распространении зонтов, а о слугах ничего не сказано.", "distractor_notes_ru": {"B": "В тексте сказано, что в Индии тоже была такая традиция. Об этом написано во 2-м абзаце.", "C": "Зонты египтян держали специальные слуги. Об этом написано в 1-м абзаце.", "D": "В Древней Греции зонты носили рабы. Об этом написано в 3-м абзаце."}, "fixed_order": false}, {"id": "v1-q03", "number": 3, "text_id": "v1-t1", "stem": "Мәтін мазмұны бойынша қай тұжырым дұрыс?", "options": {"A": "Сауалнамаға сәйкес, қазір әйелдер көбіне сары түсті қолшатыр таңдайды екен.", "B": "Ер адамдар шамамен 1850 жылдардан бастап қолшатырды еркін қолдана бастаған.", "C": "Ежелгі заманда барлық өңірде қолшатырды тек әйел адамдар қолданған.", "D": "Қолшатырдың қазіргідей үлгісі XVII ғасырда жасала бастады."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "evidence": ["XIX ғасыр ортасында қолшатыр ерлер аксессуарларының арасынан ойып тұрып орын алды. (4-азатжол)"], "explanation": "XIX ғасырдың ортасы – шамамен 1850 жылдар. Дәл осы кезде қолшатыр ерлердің аксессуарына айналған.", "distractor_notes": {"A": "мәтінде әйелдер сары емес, жасыл не қызыл түсті қолшатырды таңдайтыны айтылады. Ол туралы 5-азатжолда жазылған.", "C": "қолшатырды тек әйелдер ұстаған жер – ежелгі Греция ғана, ал Мысырда ол фараондарды қорғаған. Бұл туралы 1 және 3-азатжолдарда жазылған.", "D": "XVII ғасыр – 1600–1699 жылдар аралығы. Мәтінде XVII ғасырда қолшатыр Франция мен Англияда тек жаппай қолданысқа ене бастағаны айтылады. Ал қазіргідей болат тұтқалы қолшатырды Сэмюэль Фокс 1852 жылы ұсынған. 1852 жыл – XIX ғасыр (1800–1899 жылдар). Демек, қазіргі үлгі XVII ғасырда емес, одан шамамен 200 жыл кейін, XIX ғасырда пайда болған. Бұл туралы 4-азатжолда жазылған."}, "editor_changes": "Екіұшты «Қолшатыр Грецияға келе сала жаппай қолданысқа ене бастайды» нұсқасы алынды.", "distractor_evidence": {"A": ["әйелдер жасыл не қызыл түсті қолшатырды құп көретіндері анықталды"], "C": ["Қолшатыр шығыстан ежелгі Грецияға келе сала", "фараондар мен олардың отбасын", "оны тек әйелдер ғана"], "D": ["Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды", "Ақыры 1852 жылы британ кәсіпкері Сэмюэль Фокс тура қазіргі түрлері секілді іші қуыс болат тұтқаларды ұсынды"]}, "keywords": {"ok": {"kk": ["XIX ғасыр ортасында", "ерлер аксессуарларының"], "ru": ["В середине XIX века", "мужских аксессуаров"]}, "A": {"kk": ["жасыл не қызыл"], "ru": ["зелёные или красные"]}, "C": {"kk": ["фараондар", "Грецияға", "тек әйелдер ғана"], "ru": ["фараонов", "Древнюю Грецию", "только женщины"]}, "D": {"kk": ["XVII ғасырларда", "жаппай қолданысқа ене бастайды", "1852 жылы", "Сэмюэль Фокс", "болат тұтқаларды"], "ru": ["XVII веке", "широко распространяться", "1852 году", "Сэмюэль Фокс", "стальные ручки"]}}, "explanation_ru": "Середина XIX века — это примерно 1850-е годы. Именно тогда зонт стал мужским аксессуаром.", "distractor_notes_ru": {"A": "В тексте сказано, что женщины выбирают не жёлтые, а зелёные или красные зонты. Об этом написано в 5-м абзаце.", "C": "Только женщины пользовались зонтом лишь в Древней Греции, а в Египте зонт защищал фараонов. Об этом написано в 1-м и 3-м абзацах.", "D": "XVII век — это 1600–1699 годы. В тексте сказано, что в XVII веке зонты во Франции и Англии только начали широко распространяться. А современный зонт со стальной ручкой пр н түсіндіреді.", "distractor_notes": {"A": "Пампелли туралы тек бір абзацта ғана айтылады, мәтіннің басым бөлігі автордың өзі туралы.", "B": "автор ешкімді археолог болуға көндірмейді, тек өз тәжірибесімен бөліседі.", "D": "мәтінде археологтердің жұмыс процесі сипатталмайды, тек жекелеген оқиғалар айтылады."}, "editor_changes": "Өзгеріс жоқ. «Жазушы» сөзі «автор» деп өзгертілді.", "distractor_evidence": {"A": ["Археология саласындағы менің пірім – Рафаэль Пампелли деген америкалық зерттеуші"], "B": [], "D": []}, "keywords": {"ok": {"kk": ["қызықтыратын болды", "ең қызық жағдай"], "ru": ["стали интересовать", "Самый интересный случай"]}, "A": {"kk": ["Рафаэль Пампелли", "пірім"], "ru": ["кумир", "Рафаэль Пампелли"]}}, "explanation_ru": "Автор рассказывает, как пришёл в археологию, что его в ней интересует, и делится самым интересным случаем. Текст объясняет его интерес к этой профессии.", "distractor_notes_ru": {"A": "О Пампелли говорится только в одном абзаце, большая часть текста — о самом авторе.", "B": "Автор никого не уговаривает стать археологом, он просто делится своим опытом.", "D": "В тексте не описывается процесс работы археологов, рассказаны только отдельные случаи."}, "fixed_order": false}, {"id": "v1-q17", "number": 17, "text_id": "v1-t4", "stem": "Автор Рафаэль Пампеллиге қатысты қандай сезімде?", "options": {"A": "Пампеллидің жергілікті тілде сөйлей алатынына таң қалады.", "B": "Пампеллидің осындай табысты археолог болғанына қызғанышпен қарайды.", "C": "Пампелли Түркіменстанда сонша уақыт бұрын болғанына таң қалады.", "D": "Пампеллидің Түркіменстанда болғаны ешкімнің есінде қалмағанына қайғырады."}, "key": "C", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "evidence": ["Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен."], "explanation": "«Сөйтсе ... екен» құрылымы таңданысты білдіреді. Автор өзін мұнда келген алғашқы америкалықтардың бірімін деп ойлаған еді
