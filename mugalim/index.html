айша көрпешені, қазақтың ұлттық киімін, кең даласы, жануарларын, киіз үйді және басқа да дүниелерді кітабымда иллюстрациялар арқылы көрсетуді жөн деп шештім. Ақылды қазақ қызын бас кейіпкер ретінде таңдадым. Бір қызығы, Гүлмира Қазақстан жерін бұлттың үстінде пойызбен саяхаттайды. Үш жыл кеткен жұмысым жарық көргеніне өте қуаныштымын.", "4. – Қазір немен айналысасыз?", "– Қазір отбасыма жақын жерде тұрып жатырмын. Көптеген мәдениетпен танысу сол мәдениеттен өзіңе ұнағанды алып, ұнамаған тұсынан атап өтуге мүмкіндік береді. Қазір айналамдағы америкалықтарға қарағанда пайдалы әрі дұрыс тамақтанамын. Есіктен кіргенде табалдырықты баспаймын. Қалай шай дайындауды білемін. Біреудің үйіне аяқ киімімді шешіп кіремін."]}, {"id": "l2v2-t6", "title": "", "source_note": "Abai.kz: «Тәмсіл» – https://abai.kz/post/39862", "numbered_paragraphs": false, "paragraphs": ["Ертеде бір топ шәкірті бар ғұлама өмір сүріпті. Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты. ___(15)___ бірде қырға шығып, көбелек ұстап алады да, оны алақанына жасырған қалпы ұстазының алдына келеді:", "– Ұстаз, айтыңызшы: менің қолымдағы тірі көбелек пе, өлі көбелек пе?", "Шәкірт ұстаз жауабына орай көбелекті өлтіріп не ұшырып жіберуге даяр еді. Өлі десе ұшырып, тірі десе бір сығып өлтіре салмақ. Әйтеуір, өз айтары ақиқат болып шықса болды...", "Шәкіртіне назар да салмаған Ұстаз сонда былай деп жауап беріпті:", "– Бәрі **сенің** қолыңда.", "Егер ақиқаттың ақиқат болмағы тек саған байланысты болса, бұл ақиқат емес."]}, {"id": "l2v2-t7", "title": "", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Өрмекші, құмырсқа, қарлығаш» – https://bilim-all.kz/article/1632", "numbered_paragraphs": false, "paragraphs": ["Атасы он жасар ұл баласымен далада келе жатып, баласынан сұрады:", "— Анау өрмекшіні көремісің, не істеп жүр?", "— Көремін, өрмек тоқып жүр.", "— Анау құмырсқаны көремісің?", "— Көремін, аузында бір нанның уалшығы бар, жүгіріп кетіп барады.", "— Жоғары қара, аспанда не көрінеді?", "— Жоғарыда қарлығаш ұшып жүр, аузында кесе тістеген шөбі бар.", "Сонда атасы айтты:", "— Олай болса, шырағым, ол кішкентай жәндіктер саған әбірет. Өрмекші маса, шыбынға тұзақ құрып жүр, ұстап алған соң, өзіне азық етуге. Құмырсқа бала-шағаларына тамақ аулап, бір нанның уалшығын тапқан соң өзі жемей, аузына тістеп, қуанғаннан, үйіне жүгіріп қайтып барады. Қарлығаш балапандарына ұя істеуге шөп жиып жүр. Жұмыссыз жүрген бір жан жоқ. Сені де Құдай-Тағала бос жүруге жаратпаған, ___(17)___, — деді.", "Әбірет — өнеге, үлгі."]}, {"id": "l2v2-t8", "title": "", "source_note": "Bilim-all.kz: «Жарқанат» – https://bilim-all.kz/article/15929", "numbered_paragraphs": false, "paragraphs": ["Жарқанаттардың есту мүшесі жақсы жетілген. Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді. Күндіз жеке не топтанып, бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады. Кешкі ымыртта және түнде жемтігін қалықтап ұшып жүріп аулайды. Қазан-қараша айларында қысқы ұйқыға кетеді. Наурыз, сәуір айларында оянады.", "Жарқанаттар өсімдіктерге зиянды әр түрлі жәндіктермен қоректеніп, ауыл шаруашылығы және орман шаруашылықтарына пайда да келтіреді. Сондай-ақ, түрлі аурулар (әсіресе, құтыру) таратып, адамға, жануарларға залалын да тигізеді."]}, {"id": "l2v2-t9", "title": "", "source_note": "Bilim-all.kz: «Қожанасыр әңгімелері» – https://bilim-all.kz/quote/785", "numbered_paragraphs": false, "paragraphs": ["Баяғыда біреу той жасапты, тойға көп кісі жиналыпты, Қожа да келіпті. Қожанасырдың үстіндегі киімі жаман екен. Қожанасырды ешкім елемепті. «Төрге шық, тамақ іш», – демепті. Қожа үйден шығып кетеді де үйіне барып, тәуір киімдерін киіп, қайта келеді. Бұл жолы үй иесі Қожанасырды құрметтейді, төрден орын береді, ет келгенде:", "– Қожеке, алыңыз, алыңыз! – деп, қошеметтейді. Қожа етті жемей, табаққа шапанының жеңін малып:", "– Же, шапаным, же! – деп, отыра береді.", "Үй иесі:", "– Сіздің бұл не қылғаныңыз? Шапан ет жейтін бе еді? – дейді.", "Сонда Қожа:", "– Сен кісіні сыйламайды екенсің, киімді сыйлайды екенсің. Сондықтан шапаныма жегізіп отырғаным! – деп, жауап береді."]}], "items": [{"id": "l2v2-q1", "number": 1, "text_id": "l2v2-t1", "stem": "Мәтіндегі роботтың ерекшелігі неде?", "options": {"A": "ұлттық киімдерді өзі тігіп киюінде", "B": "оқушыларға информатикадан сабақ беруінде", "C": "қымыз туралы айтып, оны құюында", "D": "адамдарға пластикалық карта жасауында"}, "key": "C", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Содан кейін робот қымыздың шипалы қасиеті туралы қысқаша мағлұмат береді әрі ыдысқа пайдалы сусын құяды."], "explanation": "Робот Асылбек қымыздың шипалы қасиеті туралы қысқаша айтып береді және ыдысқа қымыз құяды. «Мағлұмат беру» – мәлімет, ақпарат беру деген сөз.", "explanation_ru": "Робот Асылбек коротко рассказывает о целебных свойствах кумыса и наливает его в посуду. «Мағлұмат беру» значит «давать сведения, информацию».", "distractor_notes": {"A": "робот ұлттық киім тікпейді, оның өзі ұлттық киім киген.", "B": "мәтінде роботтың сабақ бергені айтылмайды. Мәтінде мұғалім оқушыға роботты жасауға көмектескені айтылады.", "D": "пластикалық картаны робот жасамайды, адам оны роботқа жақындатады. Сонда ғана робот сөйлей бастайды."}, "distractor_notes_ru": {"A": "Робот не шьёт национальную одежду — он сам одет в неё.", "B": "В тексте не сказано, что робот проводит уроки. Там сказано, что учитель помог ученику сделать робота.", "D": "Пластиковую карту не делает робот — человек подносит её к роботу, и тогда робот начинает говорить."}, "distractor_evidence": {"A": ["Ұлттық сусынымызды насихаттайтын болғандықтан, Асылбектің ұлттық киімде болғаны дұрыс деп шештік, – дейді Жансұлтан."], "B": ["Оқушыға роботты жасап шығуға информатика пәнінің мұғалімі көмектескен."], "D": ["Кез келген адам роботқа арнайы пластикалық картаны жақындату арқылы Асылбекті сөйлете алады."]}, "keywords": {"ok": {"kk": ["қымыздың шипалы қасиеті туралы", "ыдысқа пайдалы сусын құяды"], "ru": ["о целебных свойствах кумыса", "наливает в посуду полезный напиток"]}, "A": {"kk": ["ұлттық киімде болғаны"], "ru": ["был в национальной одежде"]}, "B": {"kk": ["информатика пәнінің мұғалімі көмектескен"], "ru": ["помог учитель информатики"]}, "D": {"kk": ["пластикалық картаны жақындату арқылы"], "ru": ["поднеся пластиковую карту"]}}, "editor_changes": ""}, {"id": "l2v2-q2", "number": 2, "text_id": "l2v2-t2", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Құрылғы адамның даусын басқа біреудің даусына ұқсатып шығарады.\n2. Құрылғыны пайдалану үшін адамның бұрын жазылған дауысы қажет.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Құрылғы мойындағы өте әлсіз вибрацияларды анықтап, оларды адамның өз дауысына мейлінше ұқсас сөйлеуге айналдырады.", "Пайдалану жолы қарапайым: қолданушы даусынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді, кейін құрылғыны мойнына тағады — жүйе сол сәтте-ақ оның өз даусын синтездеп бере бастайды."], "explanation": "Тек екінші тұжырым дұрыс: адам дауысынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді. Ал бірінші тұжырым қате: құрылғы басқа біреудің емес, адамның өз дауысына ұқсас сөйлейді.", "explanation_ru": "Верно только второе утверждение: человек загружает в приложение аудиофайл, записанный, пока он ещё не потерял голос. А первое неверно: устройство говорит голосом, похожим не на чужой, а на собственный голос человека.", "distractor_notes": {"A": "бірінші тұжырымды мәтінмен тағы салыстыр: құрылғы кімнің дауысына ұқсас сөйлейтінін қайта оқы.", "C": "екі тұжырымның біреуі ғана мәтінге сай. Құрылғы кімнің дауысына ұқсас сөйлейтінін мәтіннің басынан қайта оқы.", "D": "тұжырымдардың біреуі мәтінде бар. Құрылғыны қалай пайдаланатыны туралы азатжолды қайта оқы."}, "distractor_notes_ru": {"A": "Ещё раз сравни первое утверждение с текстом: перечитай, на чей голос похожа речь устройства.", "C": "С текстом совпадает только одно утверждение. Перечитай в начале текста, на чей голос похожа речь устройства.", "D": "Одно из утверждений есть в тексте. Перечитай абзац о том, как пользоваться устройством."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["адамның өз дауысына", "даусынан айырылмай тұрған кезде жазылған аудиофайлды"], "ru": ["на собственный голос человека", "записанный, пока пользователь ещё не потерял голос"]}}, "editor_changes": ""}, {"id": "l2v2-q3", "number": 3, "text_id": "l2v2-t3", "stem": "Мәтін не туралы?\n... дельфиндер туралы", "options": {"A": "адамды аман сақтаған", "B": "адамнан қашып кеткен", "C": "жағаға шығып қалған", "D": "теңізде жоғалып кеткен"}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ашық теңіздегі адамды байқаған дельфиндер оған көмекке келіп, айналасында топтасып жүзе бастаған.", "Оның сөзінше, дельфиндер осылайша ер адамды қорғауға тырысқан."], "explanation": "Мәтіннің басты оқиғасы – дельфиндердің теңізде қалған адамға көмекке келіп, оның айналасында жүзіп, оны қорғауы. Сондықтан мәтін адамды қорғаған дельфиндер туралы.", "explanation_ru": "Главное событие текста — дельфины пришли на помощь человеку в море, плавали вокруг него и защищали его. Поэтому текст о дельфинах, которые защищали человека.", "distractor_notes": {"B": "дельфиндер адамнан қашпаған, керісінше, оның қасында қалған.", "C": "мәтінде дельфиндердің жағаға шыққаны айтылмайды. Оларды құтқарушылар теңізде көрген.", "D": "мәтінде дельфиндер емес, ер адам жоғалған. Құтқарушылар соны іздеген."}, "distractor_notes_ru": {"B": "Дельфины не уплыли от человека — наоборот, они оставались рядом с ним.", "C": "В тексте не сказано, что дельфины вышли на берег. Спасатели увидели их в море.", "D": "В тексте пропали не дельфины, а мужчина — его и искали спасатели."}, "distractor_evidence": {"B": ["Құтқару кемесінің капитаны О'Коннеллдің сөзінше, теңіз жануарлары ирландиялық азаматтың айналасында топтасып жүзіп жүрген."], "C": ["Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "D": ["Құтқарушылар қайықпен және тікұшақпен жоғалған адамды іздеуге кіріскен."]}, "keywords": {"ok": {"kk": ["оған көмекке келіп", "ер адамды қорғауға тырысқан"], "ru": ["пришли ему на помощь", "пытались защитить мужчину"]}, "B": {"kk": ["айналасында топтасып жүзіп жүрген"], "ru": ["плавали группой вокруг"]}, "C": {"kk": ["бір топ дельфиннің жүзіп жүргенін"], "ru": ["группу плавающих дельфинов"]}, "D": {"kk": ["жоғалған адамды іздеуге"], "ru": ["искать пропавшего человека"]}}, "editor_changes": ""}, {"id": "l2v2-q4", "number": 4, "text_id": "l2v2-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Ер адам теңізде кішкентай қайықпен жүзіп жүрген.", "B": "Дельфиндер ер адамды табуға көмектесті.", "C": "Құтқарушылар ер адамды бір сағатта тапты.", "D": "Дельфиндер ер адамды жағаға дейін жеткізді."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Сонымен қатар, құтқарушылар дельфиндер болмағанда, ер адамды дер кезінде тауып, құтқарып қалу екіталай еді деген пікірде.", "Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "explanation": "Құтқарушылар алдымен бір топ дельфинді байқаған, адам солардың ортасында болған. Олардың ойынша, дельфиндер болмағанда, адамды дер кезінде табу екіталай еді. «Екіталай» – болуы күмәнді, қиын деген сөз.", "explanation_ru": "Спасатели сначала заметили группу дельфинов, а человек был среди них. По их мнению, без дельфинов найти его вовремя вряд ли удалось бы. «Екіталай» значит «сомнительно, вряд ли».", "distractor_notes": {"A": "ер адам қайықпен емес, жалғыз өзі жүзіп өтпек болған. Қайықпен оны құтқарушылар іздеген.", "C": "құтқарушылар ер адамды бір сағатта емес, 12 сағаттан кейін тапты.", "D": "мәтінде дельфиндердің адамды жағаға жеткізгені айтылмайды. Оны судан құтқарушылар шығарды."}, "distractor_notes_ru": {"A": "Мужчина был не на лодке — он хотел проплыть расстояние сам. На лодке его искали спасатели.", "C": "Спасатели нашли мужчину не за час, а через 12 часов.", "D": "В тексте не сказано, что дельфины доставили человека к берегу. Из воды его вытащили спасатели."}, "distractor_evidence": {"A": ["Белгілі болғандай, ер адам 8 шақырым қашықтықты жалғыз өзі жүзіп өтпек болған."], "C": ["Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "D": ["Құтқарушылар ер адамды судан шығарып, оған алғашқы көмек көрсеткен."]}, "keywords": {"ok": {"kk": ["дельфиндер болмағанда", "дер кезінде тауып", "бір топ дельфиннің жүзіп жүргенін байқайды"], "ru": ["если бы не дельфины", "вовремя найти", "заметили группу плавающих дельфинов"]}, "A": {"kk": ["жалғыз өзі жүзіп өтпек болған"], "ru": ["в одиночку проплыть"]}, "C": {"kk": ["12 сағаттан кейін"], "ru": ["через 12 часов"]}, "D": {"kk": ["Құтқарушылар ер адамды судан шығарып"], "ru": ["Спасатели вытащили мужчину из воды"]}}, "editor_changes": ""}, {"id": "l2v2-q5", "number": 5, "text_id": "l2v2-t4", "stem": "Қай абзацта белгілі бір сөздің қосымша мағынасы түсіндіріледі?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "D", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Шаңырақ «үй, отбасы» деген мағынаны да білдіреді. (4-азатжол)"], "explanation": "4-азатжолда «шаңырақ» сөзі киіз үйдің бөлігін ғана емес, «үй, отбасы» деген мағынаны да білдіретіні айтылады.", "explanation_ru": "В 4-м абзаце сказано, что слово «шаңырақ» означает не только часть юрты, но и «дом, семья».", "distractor_notes": {"A": "1-азатжолда киіз үй қандай ағаштан жасалатыны айтылады, сөздің мағынасы түсіндірілмейді.", "B": "2-азатжолда «қанат» сөзі кездеседі, бірақ ол дайын кереге деп аталады, сөздің екінші мағынасы туралы айтылмайды.", "C": "3-азатжолда уықтың қандай бөлік екені айтылады, сөздің басқа мағынасы түсіндірілмейді."}, "distractor_notes_ru": {"A": "В 1-м абзаце говорится, из какого дерева делают юрту, — значение слова там не объясняется.", "B": "Во 2-м абзаце есть слово «қанат», но так просто называют готовую решётку — о втором значении слова там не говорится.", "C": "В 3-м абзаце говорится, что такое уық как часть юрты, — другое значение слова не объясняется."}, "distractor_evidence": {"A": ["Киіз үй берік ағаштан (қайыңнан, талдан) жасалады."], "B": ["Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады."], "C": ["Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі."]}, "keywords": {"ok": {"kk": ["«үй, отбасы» деген мағынаны да"], "ru": ["также значение «дом, семья»"]}, "A": {"kk": ["берік ағаштан"], "ru": ["из прочного дерева"]}, "B": {"kk": ["Дайын керегені қанат деп атайды"], "ru": ["Готовую решётку называют «қанат»"]}, "C": {"kk": ["кереге мен шаңырақ ортасын қосатын"], "ru": ["соединяющих решётку и шанырак"]}}, "editor_changes": ""}, {"id": "l2v2-q6", "number": 6, "text_id": "l2v2-t4", "stem": "Қай ақпарат мәтін мазмұнына сай келеді?", "options": {"A": "Киіз үй құрт түсіп, тез шіритін ағаштан жасалады.", "B": "Әр киіз үйде, көлеміне қарамастан, 18 уық болады.", "C": "Киіз үйдегі кереге саны қанат санымен бірдей.", "D": "Ши киіз үйге жылу бермейді, оны тек әсемдік үшін ұстайды."}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады. (2-азатжол)"], "explanation": "Мәтінде дайын кереге «қанат» деп аталатыны айтылады: 18 қанат үйде 18 кереге бар. Демек, кереге саны мен қанат саны бірдей.", "explanation_ru": "В тексте сказано, что готовую решётку называют «қанат»: в юрте на 18 «крыльев» — 18 решёток. Значит, число решёток и число «крыльев» одинаково.", "distractor_notes": {"A": "мәтінде керісінше айтылған: киіз үйдің ағашы тез шірімейді.", "B": "18 саны уыққа емес, керегеге қатысты. Уықтың саны үйдің көлеміне қарай әртүрлі.", "D": "ши тек әсемдік үшін емес: ол үйді жылытады және жәндіктерді кіргізбейді."}, "distractor_notes_ru": {"A": "В тексте сказано наоборот: дерево юрты быстро не гниёт.", "B": "Число 18 относится не к жердям, а к решёткам. Число жердей зависит от размера юрты.", "D": "Чий нужен не только для красоты: он утепляет дом и не пускает насекомых."}, "distractor_evidence": {"A": ["Оларға құрт түспейді, басқа ағаштар сияқты тез шірімейді."], "B": ["Әр үйде көлеміне қарай 60-160-тай уық болады."], "D": ["Оның әсемдікке әрі жылылыққа әсері мол.", "Сондай-ақ ши тұрғанда сырттан құрт-құмырсқа, кесіртке, жылан тағы басқа жәндіктер кіре алмайды."]}, "keywords": {"ok": {"kk": ["Дайын керегені қанат деп атайды", "18 қанат үйде 18 кереге"], "ru": ["Готовую решётку называют «қанат»", "18 решёток"]}, "A": {"kk": ["тез шірімейді"], "ru": ["не гниют быстро"]}, "B": {"kk": ["60-160-тай уық"], "ru": ["60–160 жердей"]}, "D": {"kk": ["жылылыққа", "жәндіктер кіре алмайды"], "ru": ["тепло", "не могут проникнуть насекомые"]}}, "editor_changes": ""}, {"id": "l2v2-q7", "number": 7, "text_id": "l2v2-t4", "stem": "Мәтінге қандай тақырып сәйкес келеді?", "options": {"A": "Қазақтың ізгі тілектері", "B": "Киіз үйдің бөліктері", "C": "Киіз үйдің түрлері мен атаулары", "D": "Ағаш шеберлерінің өнері"}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Кереге киіз үйдің негізін құрайды. (2-азатжол)", "Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі. (3-азатжол)", "Шаңырақ – киіз үйдің қасиетті, киелі мүлкі. (4-азатжол)", "Киіз үйдің бір бөлшегі – кәдімгі ши. (5-азатжол)"], "explanation": "Мәтіннің әр азатжолы киіз үйдің бір бөлігі туралы: кереге, уық, шаңырақ, ши. Сондықтан тақырып – «Киіз үйдің бөліктері».", "explanation_ru": "Каждый абзац текста рассказывает об одной части юрты: решётке, жердях, шаныраке, чие. Поэтому подходит заголовок «Части юрты».", "distractor_notes": {"A": "мәтінде «Керегең кең болсын», «Шаңырағың биік болсын» деген тілектер бар, бірақ олар кереге мен шаңырақ туралы айтқанда ғана келтірілген.", "C": "мәтінде киіз үйдің түрлері салыстырылмайды, бір киіз үйдің құрылысы сипатталады.", "D": "мәтінде киіз үйді жасайтын шеберлер туралы айтылмайды."}, "distractor_notes_ru": {"A": "В тексте есть пожелания «Керегең кең болсын», «Шаңырағың биік болсын», но они приведены только в рассказе о решётке и шаныраке.", "C": "В тексте не сравниваются виды юрт — описывается устройство одной юрты.", "D": "В тексте ничего не сказано о мастерах, которые делают юрту."}, "distractor_evidence": {"A": ["«Керегең кең болсын» деген тілек осыдан шыққан.", "«Шаңырағың биік болсын» деген тілек бар."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Кереге", "Уық", "Шаңырақ", "бөлшегі – кәдімгі ши"], "ru": ["Решётка", "Уық", "Шанырак", "часть юрты — обычный чий"]}, "A": {"kk": ["тілек"], "ru": ["пожелание"]}}, "editor_changes": ""}, {"id": "l2v2-q8", "number": 8, "text_id": "l2v2-t5", "stem": "Қай бөлімде Эшлидің қазақ салт-дәстүрін ұстанатыны айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "D", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Есіктен кіргенде табалдырықты баспаймын. (4-бөлім)", "Біреудің үйіне аяқ киімімді шешіп кіремін. (4-бөлім)"], "explanation": "4-бөлімде Эшли табалдырықты баспайтынын, шай дайындай алатынын, біреудің үйіне аяқ киімін шешіп кіретінін айтады. Бұл – қазақ дәстүрлері.", "explanation_ru": "В 4-й части Эшли рассказывает, что не наступает на порог, умеет готовить чай и разувается, входя в чужой дом. Это казахские традиции.", "distractor_notes": {"A": "1-бөлімде Эшли кітап жазу идеясы қалай пайда болғанын айтады.", "B": "2-бөлімде Эшли қандай тілдерді білетіні туралы айтады.", "C": "3-бөлімде Эшли кітабында қазақ мәдениетін суретпен көрсеткенін айтады, бірақ өзінің дәстүр ұстанатыны туралы айтпайды."}, "distractor_notes_ru": {"A": "В 1-й части Эшли рассказывает, как появилась идея написать книгу.", "B": "Во 2-й части Эшли говорит о том, какие языки она знает.", "C": "В 3-й части Эшли говорит, что показала казахскую культуру в иллюстрациях книги, но не о том, что сама соблюдает традиции."}, "distractor_evidence": {"A": ["Осылайша балаларға арналған алғашқы кітабымды жазуды қолға алдым."], "B": ["– Қазақша көп сөз білмеймін."], "C": ["Осылайша көрпешені, қазақтың ұлттық киімін, кең даласы, жануарларын, киіз үйді және басқа да дүниелерді кітабымда иллюстрациялар арқылы көрсетуді жөн деп шештім."]}, "keywords": {"ok": {"kk": ["табалдырықты баспаймын", "аяқ киімімді шешіп кіремін"], "ru": ["не наступаю на порог", "сняв обувь"]}, "A": {"kk": ["алғашқы кітабымды жазуды"], "ru": ["писать свою первую книгу"]}, "B": {"kk": ["Қазақша көп сөз білмеймін"], "ru": ["Я знаю немного казахских слов"]}, "C": {"kk": ["кітабымда иллюстрациялар арқылы"], "ru": ["в иллюстрациях своей книги"]}}, "editor_changes": ""}, {"id": "l2v2-q9", "number": 9, "text_id": "l2v2-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Эшлидің кітабы үш жылда жазылды.\n2. Эшли қазақ тілінде еркін сөйлейді.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "A", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Үш жыл кеткен жұмысым жарық көргеніне өте қуаныштымын. (3-бөлім)", "– Қазақша көп сөз білмеймін. (2-бөлім)"], "explanation": "Тек бірінші тұжырым дұрыс: Эшли кітабына үш жыл кеткенін айтады. Ал екінші тұжырым қате: ол қазақша көп сөз білмейді.", "explanation_ru": "Верно только первое утверждение: Эшли говорит, что на книгу ушло три года. А второе неверно: казахских слов она знает немного.", "distractor_notes": {"B": "екінші тұжырымды мәтінмен тағы салыстыр: Эшли қазақ тілін қаншалықты білетінін 2-бөлімнен қайта оқы.", "C": "екі тұжырымның біреуі ғана мәтінге сай. Эшлидің қазақ тілін қаншалықты білетінін 2-бөлімнен қайта оқы.", "D": "тұжырымдардың біреуі мәтінде бар. Кітаптың қанша уақытта жазылғанын 3-бөлімнен ізде."}, "distractor_notes_ru": {"B": "Ещё раз сравни второе утверждение с текстом: перечитай во 2-й части, насколько Эшли знает казахский.", "C": "С текстом совпадает только одно утверждение. Перечитай во 2-й части, насколько Эшли знает казахский.", "D": "Одно из утверждений есть в тексте. Поищи в 3-й части, сколько времени писалась книга."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Үш жыл кеткен жұмысым", "Қазақша көп сөз білмеймін"], "ru": ["работа, на которую ушло три года", "Я знаю немного казахских слов"]}}, "editor_changes": ""}, {"id": "l2v2-q10", "number": 10, "text_id": "l2v2-t5", "stem": "Сұхбат бөлімдерінің реті қандай?\n1. Кітаптың кейіпкері\n2. Эшлидің қазіргі өмірі\n3. Кітап жазу идеясы\n4. Эшлидің тіл білуі", "options": {"A": "1, 2, 3, 4", "B": "3, 1, 4, 2", "C": "3, 4, 1, 2", "D": "4, 3, 1, 2"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["– Эшли, Қазақстан жайлы кітап жазу идеясы қалай дүниеге келді? (1-бөлім)", "– Қазақша білесіз бе? (2-бөлім)", "– On a Train in Kazakhstan қандай кітап? (3-бөлім)", "– Қазір немен айналысасыз? (4-бөлім)"], "explanation": "Сұхбат бөлімдерінің реті: 1 – кітап жазу идеясы, 2 – тіл білуі, 3 – кітаптың кейіпкері, 4 – қазіргі өмірі. Тізімдегі нөмірлермен жазсақ: 3, 4, 1, 2.", "explanation_ru": "Порядок частей интервью: 1 — идея книги, 2 — знание языков, 3 — герой книги, 4 — нынешняя жизнь. Номерами из списка: 3, 4, 1, 2.", "distractor_notes": {"A": "сұхбат кітаптың кейіпкерінен басталмайды. Әр бөлімдегі сұрақты қайта оқып, тізімдегі тақырыппен салыстыр.", "B": "бірінші бөлім дұрыс табылды. Енді 2-бөлімдегі сұрақты қайта оқы: онда не туралы сұралады?", "D": "сұхбат тіл туралы сұрақтан басталмайды. 1-бөлімдегі сұрақты қайта оқы."}, "distractor_notes_ru": {"A": "Интервью начинается не с героя книги. Перечитай вопрос в каждой части и сравни с темами списка.", "B": "Первая часть найдена верно. Теперь перечитай вопрос 2-й части: о чём там спрашивают?", "D": "Интервью начинается не с вопроса о языке. Перечитай вопрос 1-й части."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["кітап жазу идеясы", "Қазақша білесіз бе", "қандай кітап", "Қазір немен айналысасыз"], "ru": ["идея написать книгу", "Вы знаете казахский", "Что это за книга", "Чем вы сейчас занимаетесь"]}}, "editor_changes": ""}, {"id": "l2v2-q11", "number": 11, "text_id": "l2v2-t5", "stem": "Эшлидің ойынша, көп мәдениетпен танысудың пайдасы неде?", "options": {"A": "Басқа елде ұзақ тұрып, жақсы жұмыс табуға мүмкіндік береді.", "B": "Өзіңе ұнаған дәстүрді өміріңе енгізуге мүмкіндік береді.", "C": "Туған жеріңді ұмытып, жаңа елде қалуға мүмкіндік береді.", "D": "Шет тілін тез әрі ешбір қиындықсыз үйренуге мүмкіндік береді."}, "key": "B", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Көптеген мәдениетпен танысу сол мәдениеттен өзіңе ұнағанды алып, ұнамаған тұсынан атап өтуге мүмкіндік береді. (4-бөлім)"], "explanation": "Эшлидің пікірінше, басқа мәдениетпен танысқанда, одан өзіңе ұнағанды алуға болады. Оның өзі де қазақтардың бірнеше әдетін үйреніп, күнде ұстанады.", "explanation_ru": "По мнению Эшли, знакомясь с другой культурой, можно взять из неё то, что тебе нравится. Она и сама переняла несколько казахских привычек и соблюдает их.", "distractor_notes": {"A": "Эшли мәдениетпен танысуды жұмыс табумен байланыстырмайды.", "C": "Эшли туған жерін ұмытпаған: ол қазір отбасына жақын жерде тұрады.", "D": "Эшли Қазақстанда ұзақ тұрса да, қазақ тілін көп білмейді. Демек, ол мәдениетпен танысу тілді тез үйретеді деп айтпайды."}, "distractor_notes_ru": {"A": "Эшли не связывает знакомство с культурой с поиском работы.", "C": "Эшли не забыла родину: сейчас она живёт рядом со своей семьёй.", "D": "Хотя Эшли долго жила в Казахстане, казахский она знает мало. Значит, она не говорит, что знакомство с культурой быстро учит языку."}, "distractor_evidence": {"A": [], "C": ["– Қазір отбасыма жақын жерде тұрып жатырмын."], "D": ["– Қазақша көп сөз білмеймін."]}, "keywords": {"ok": {"kk": ["өзіңе ұнағанды алып"], "ru": ["взять то, что тебе нравится"]}, "C": {"kk": ["отбасыма жақын жерде"], "ru": ["рядом со своей семьёй"]}, "D": {"kk": ["Қазақша көп сөз білмеймін"], "ru": ["Я знаю немного казахских слов"]}}, "editor_changes": ""}, {"id": "l2v2-q12", "number": 12, "text_id": "l2v2-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "күнделік", "B": "сұхбат", "C": "мақала", "D": "әңгіме"}, "key": "B", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["– Қазақша білесіз бе?", "– Қазір немен айналысасыз?"], "explanation": "Мәтін сұрақ пен жауаптан тұрады: тілші сұрақ қояды, Эшли Ланина жауап береді. Мұндай үлгі сұхбат деп аталады.", "explanation_ru": "Текст состоит из вопросов и ответов: журналист спрашивает, Эшли Ланина отвечает. Такой жанр называется интервью (сұхбат).", "distractor_notes": {"A": "күнделікті адам өзі үшін жазады, онда сұрақ қойып, жауап беретін екі адам болмайды.", "C": "мақалада автор өз ойын біртұтас мәтінмен баяндайды. Бұл мәтін сұрақ пен жауаптан құралған.", "D": "әңгімеде оқиға баяндалады. Ал бұл мәтінде тілші сұрақ қойып, Эшли жауап береді."}, "distractor_notes_ru": {"A": "Дневник человек пишет для себя — в нём нет двух людей, один из которых спрашивает, а другой отвечает.", "C": "В статье автор излагает мысли сплошным текстом, а этот текст состоит из вопросов и ответов.", "D": "В рассказе повествуется о событиях, а в этом тексте журналист задаёт вопросы, а Эшли отвечает."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["білесіз бе?", "айналысасыз?"], "ru": ["знаете", "занимаетесь"]}}, "editor_changes": ""}, {"id": "l2v2-q13", "number": 13, "text_id": "l2v2-t6", "stem": "Шәкірт нені армандады?", "options": {"A": "ұстазынан озып, елге танымал ғұлама болуды", "B": "күнде қырға шығып, әдемі көбелек аулауды", "C": "ұстазына есте қалатын жақсы сыйлық жасауды", "D": "ұстазын жауапсыз қалдыратын сұрақ табуды"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."], "explanation": "Шәкірт ұстазы жауап бере алмайтын сауал тауып қоюды армандаған. «Сауал» – сұрақ деген сөз.", "explanation_ru": "Ученик мечтал найти вопрос, на который учитель не сможет ответить. «Сауал» значит «вопрос».", "distractor_notes": {"A": "мәтінде шәкірттің ғұлама болуды армандағаны айтылмайды. «Ғұлама» деп мәтінде ұстазды атайды.", "B": "шәкірт көбелекті армандағаны үшін емес, ұстазына сұрақ қою үшін ұстады.", "C": "шәкірт көбелекті ұстазына сыйлық ретінде әкелмеді, оны алақанына жасырып, сұрақ қойды."}, "distractor_notes_ru": {"A": "В тексте не сказано, что ученик мечтал стать учёным. «Ғұлама» в тексте называют учителя.", "B": "Ученик поймал бабочку не потому, что мечтал о ней, а чтобы задать вопрос учителю.", "C": "Ученик принёс бабочку не в подарок: он спрятал её в ладони и задал вопрос."}, "distractor_evidence": {"A": ["Ертеде бір топ шәкірті бар ғұлама өмір сүріпті."], "B": [], "C": ["– Ұстаз, айтыңызшы: менің қолымдағы тірі көбелек пе, өлі көбелек пе?"]}, "keywords": {"ok": {"kk": ["ұстазы жауап бере алмайтын сауал", "армандапты"], "ru": ["вопрос, на который учитель не сможет ответить", "мечтал"]}, "A": {"kk": ["ғұлама"], "ru": ["мудрец"]}, "C": {"kk": ["тірі көбелек пе, өлі көбелек пе"], "ru": ["живая бабочка или мёртвая"]}}, "editor_changes": ""}, {"id": "l2v2-q14", "number": 14, "text_id": "l2v2-t6", "stem": "«Бәрі сенің қолыңда.»\nОсы сөйлемде ұстаз кімді атап тұр?", "options": {"A": "шәкіртті", "B": "көбелекті", "C": "ұстаздың өзін", "D": "басқа шәкірттерді"}, "key": "A", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Шәкірт ұстаз жауабына орай көбелекті өлтіріп не ұшырып жіберуге даяр еді.", "– Бәрі сенің қолыңда."], "explanation": "Ұстаз сұрақ қойған шәкіртке жауап беріп тұр. Көбелектің тірі не өлі болуы тек шәкіртке байланысты еді: ол көбелекті ұшырып та, өлтіріп те жібере алатын. Көбелек шынында да шәкірттің қолында тұр.", "explanation_ru": "Учитель отвечает ученику, который задал вопрос. Будет бабочка живой или мёртвой, зависело только от ученика: он мог и отпустить её, и убить. Бабочка и правда у ученика в руке.", "distractor_notes": {"B": "ұстаз көбелекпен сөйлесіп тұрған жоқ. Ол сұрақ қойған адамға жауап береді.", "C": "«сенің» – екінші жақ, яғни сөйлеуші емес, тыңдаушы. Ұстаз өзі туралы айтса, «менің» дер еді.", "D": "«сенің» – бір адамға айтылған сөз. Ұстаз сұрақты бір шәкірттен ғана естіді."}, "distractor_notes_ru": {"B": "Учитель не разговаривает с бабочкой — он отвечает тому, кто задал вопрос.", "C": "«Сенің» (твой) — второе лицо, то есть слушатель, а не говорящий. О себе учитель сказал бы «менің» (мой).", "D": "«Сенің» (твой) обращено к одному человеку. Учитель услышал вопрос только от одного ученика."}, "distractor_evidence": {"B": [], "C": [], "D": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."]}, "keywords": {"ok": {"kk": ["Шәкірт", "өлтіріп не ұшырып жіберуге даяр", "сенің қолыңда"], "ru": ["Ученик", "был готов убить или отпустить", "в твоих руках"]}, "D": {"kk": ["шәкірттерінің бірі"], "ru": ["из его учеников"]}}, "editor_changes": ""}, {"id": "l2v2-q15", "number": 15, "text_id": "l2v2-t6", "stem": "Бос орынға қай сөз қойылады?", "options": {"A": "Сол үшін", "B": "Сонда да", "C": "Керісінше", "D": "Сондай-ақ"}, "key": "A", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."], "explanation": "Шәкірт ұстазына қиын сұрақ қоюды армандады, сондықтан көбелек ұстап келді. Екінші сөйлем біріншісінің мақсатын, нәтижесін айтады. Оны «сол үшін» байланыстырады.", "explanation_ru": "Ученик мечтал задать учителю трудный вопрос, поэтому поймал бабочку. Второе предложение говорит о цели и следствии первого — его связывает «сол үшін» (для этого, поэтому).", "distractor_notes": {"B": "«сонда да» – «соған қарамастан» деген мағынада, қарама-қарсы ойды байланыстырады. Ал мұнда шәкірт арманын орындау үшін әрекет етеді, қарсылық жоқ.", "C": "«керісінше» алдыңғы ойға қарсы әрекетті білдіреді. Шәкірт армандағанына қарсы емес, сол арманы үшін әрекет етті.", "D": "«сондай-ақ» жаңа, қосымша ақпаратты қосады. Ал мұнда екінші сөйлем жаңа ақпарат емес, шәкірттің арманына жету үшін не істегенін айтады."}, "distractor_notes_ru": {"B": "«Сонда да» (и всё же, несмотря на это) связывает противоположные мысли. А здесь ученик действует, чтобы исполнить мечту, — противопоставления нет.", "C": "«Керісінше» (наоборот) означает действие вопреки сказанному. Ученик действовал не вопреки мечте, а ради неё.", "D": "«Сондай-ақ» (а также) добавляет новую информацию. А здесь второе предложение рассказывает, что ученик сделал ради своей мечты."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["сауал тауып қоюды армандапты"], "ru": ["мечтал найти вопрос"]}}, "editor_changes": ""}, {"id": "l2v2-q16", "number": 16, "text_id": "l2v2-t7", "stem": "Мәтіндегі оқиғалардың реті қандай?\n1. Нан тасыған құмырсқа\n2. Атасының ақылы\n3. Өрмек тоқыған өрмекші\n4. Шөп тасыған қарлығаш", "options": {"A": "1, 3, 4, 2", "B": "3, 1, 2, 4", "C": "3, 1, 4, 2", "D": "3, 4, 1, 2"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["— Көремін, өрмек тоқып жүр.", "— Көремін, аузында бір нанның уалшығы бар, жүгіріп кетіп барады.", "— Жоғарыда қарлығаш ұшып жүр, аузында кесе тістеген шөбі бар.", "Жұмыссыз жүрген бір жан жоқ."], "explanation": "Алдымен бала өрмек тоқыған өрмекшіні көреді (3), сосын нан тасыған құмырсқаны (1), кейін шөп тістеген қарлығашты (4), соңында атасы ақыл айтады (2).", "explanation_ru": "Сначала мальчик видит паука, плетущего паутину (3), потом муравья с хлебной крошкой (1), затем ласточку с травинкой (4), и в конце дед даёт совет (2).", "distractor_notes": {"A": "атасы алдымен құмырсқаны емес, басқа жәндікті көрсетті. Атасының бірінші сұрағын қайта оқы.", "B": "атасы ақылды ең соңында, үш жәндікті де көрсеткен соң айтады.", "D": "алғашқы оқиға дұрыс. Ал қарлығашты бала аспаннан ең соңында көрді, оған дейін жерде құмырсқаны көрді."}, "distractor_notes_ru": {"A": "Дед сначала показал не муравья, а другое существо. Перечитай первый вопрос деда.", "B": "Дед даёт совет в самом конце, после того как показал всех троих.", "D": "Первое событие верно. Но ласточку в небе мальчик увидел последней, а до неё — муравья на земле."}, "distractor_evidence": {"A": [], "B": ["Сонда атасы айтты:"], "D": ["— Жоғары қара, аспанда не көрінеді?"]}, "keywords": {"ok": {"kk": ["өрмек тоқып жүр", "нанның уалшығы", "қарлығаш ұшып жүр", "Жұмыссыз жүрген бір жан жоқ"], "ru": ["плетёт паутину", "хлебная крошка", "летает ласточка", "Нет ни одного существа без дела"]}, "B": {"kk": ["Сонда атасы айтты"], "ru": ["Тогда дед сказал"]}, "D": {"kk": ["Жоғары қара"], "ru": ["Посмотри наверх"]}}, "editor_changes": ""}, {"id": "l2v2-q17", "number": 17, "text_id": "l2v2-t7", "stem": "Бос орынға қай жауап сәйкес келеді?", "options": {"A": "атаңа көп сұрақ қою керек", "B": "жәндіктерге қамқор болу керек", "C": "далада көбірек серуендеп жүру керек", "D": "жұмыс істеуге әдеттену керек"}, "key": "D", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Жұмыссыз жүрген бір жан жоқ.", "Сені де Құдай-Тағала бос жүруге жаратпаған"], "explanation": "Атасы өрмекші, құмырсқа, қарлығаштың бәрі жұмыс істеп жүргенін көрсетіп, «Жұмыссыз жүрген бір жан жоқ» дейді. «Сені де … бос жүруге жаратпаған» деген сөзден кейін еңбекке шақыру келуі керек.", "explanation_ru": "Дед показывает, что паук, муравей и ласточка — все трудятся, и говорит: «Нет ни одного существа без дела». После слов «и ты создан не для безделья» должен следовать призыв к труду.", "distractor_notes": {"A": "бала атасының сұрақтарына жауап береді, атасы оны сұрақ қоюға шақырмайды. Атасы жәндіктердің не істеп жүргеніне назар аударады.", "B": "атасы жәндіктерге қамқор бол демейді, оларды үлгі етіп көрсетеді.", "C": "атасы мен бала далада келе жатыр, бірақ атасы серуендеуге шақырмайды. Ол «бос жүру» туралы не дейтінін қайта оқы."}, "distractor_notes_ru": {"A": "Мальчик отвечает на вопросы деда, а дед не призывает его задавать вопросы. Дед обращает внимание на то, чем заняты насекомые.", "B": "Дед не призывает заботиться о насекомых — он ставит их в пример.", "C": "Дед и мальчик идут по степи, но дед не зовёт гулять. Перечитай, что он говорит о «бос жүру» (безделье)."}, "distractor_evidence": {"A": [], "B": ["— Олай болса, шырағым, ол кішкентай жәндіктер саған әбірет."], "C": ["Атасы он жасар ұл баласымен далада келе жатып, баласынан сұрады:"]}, "keywords": {"ok": {"kk": ["Жұмыссыз жүрген бір жан жоқ", "бос жүруге жаратпаған"], "ru": ["Нет ни одного существа без дела", "не для того, чтобы бездельничать"]}, "B": {"kk": ["саған әбірет"], "ru": ["тебе пример"]}, "C": {"kk": ["далада келе жатып"], "ru": ["идя по степи"]}}, "editor_changes": ""}, {"id": "l2v2-q18", "number": 18, "text_id": "l2v2-t8", "stem": "Жарқанат күндіз қалай демалады?", "options": {"A": "басын төмен салбыратып", "B": "ұяда балаларымен бірге", "C": "ағаш басында ұшып жүріп", "D": "судың бетінде қалқып жүріп"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Күндіз жеке не топтанып, бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады."], "explanation": "Жарқанаттар күндіз бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады. «Салбырату» – төмен қарай асылып тұру деген сөз.", "explanation_ru": "Днём летучие мыши отдыхают, свесив голову вниз и цепляясь лапками за камни, деревья, обрывы. «Салбырату» значит «свешивать вниз».", "distractor_notes": {"B": "жарқанат ұя салмайды.", "C": "жарқанат ұшып жүріп күндіз емес, кешке және түнде аң аулайды.", "D": "мәтінде жарқанаттың суда жүзетіні айтылмайды. Ол тасқа, ағашқа, жарға жабысып демалады."}, "distractor_notes_ru": {"B": "Летучая мышь не строит гнёзд.", "C": "Летучая мышь летает и охотится не днём, а вечером и ночью.", "D": "В тексте не сказано, что летучая мышь плавает. Она отдыхает, цепляясь за камни, деревья, обрывы."}, "distractor_evidence": {"B": ["Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді."], "C": ["Кешкі ымыртта және түнде жемтігін қалықтап ұшып жүріп аулайды."], "D": []}, "keywords": {"ok": {"kk": ["Күндіз", "бастарын төмен салбыратып", "демалады"], "ru": ["Днём", "свесив голову вниз", "отдыхают"]}, "B": {"kk": ["ұя салмайды"], "ru": ["не строит гнёзд"]}, "C": {"kk": ["Кешкі ымыртта және түнде"], "ru": ["В вечерних сумерках и ночью"]}}, "editor_changes": ""}, {"id": "l2v2-q19", "number": 19, "text_id": "l2v2-t8", "stem": "Мәтіннің соңында автор неге назар аударды?", "options": {"A": "жарқанаттың қысқы ұйқысы мен оянатын уақытына", "B": "жарқанаттың ұя салмай мекендейтін жерлеріне", "C": "жарқанаттың адамға пайдасы мен зиянына", "D": "адамдардың жарқанатқа көрсететін қамқорлығына"}, "key": "C", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Жарқанаттар өсімдіктерге зиянды әр түрлі жәндіктермен қоректеніп, ауыл шаруашылығы және орман шаруашылықтарына пайда да келтіреді.", "Сондай-ақ, түрлі аурулар (әсіресе, құтыру) таратып, адамға, жануарларға залалын да тигізеді."], "explanation": "Мәтіннің соңғы бөлігінде автор жарқанаттың екі жағын көрсетеді: зиянды жәндіктерді жеп, шаруашылыққа пайда келтіреді, бірақ ауру таратып, залал да тигізеді. «Залал» – зиян деген сөз.", "explanation_ru": "В последней части автор показывает обе стороны: летучие мыши поедают вредных насекомых и приносят пользу хозяйству, но и распространяют болезни, нанося вред. «Залал» значит «вред».", "distractor_notes": {"A": "қысқы ұйқы туралы мәтіннің бірінші бөлігінде айтылады, соңында емес.", "B": "жарқанаттың мекені туралы мәтіннің басында айтылады, соңында емес.", "D": "мәтінде адамдардың жарқанатқа қамқор болатыны айтылмайды. Соңында жарқанаттың адамға не беретіні туралы айтылады."}, "distractor_notes_ru": {"A": "О зимней спячке говорится в первой части текста, а не в конце.", "B": "О местах обитания летучих мышей говорится в начале текста, а не в конце.", "D": "В тексте не сказано, что люди заботятся о летучих мышах. В конце речь о том, что летучие мыши дают человеку."}, "distractor_evidence": {"A": ["Қазан-қараша айларында қысқы ұйқыға кетеді."], "B": ["Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді."], "D": []}, "keywords": {"ok": {"kk": ["пайда да келтіреді", "залалын да тигізеді"], "ru": ["приносят пользу", "наносят вред"]}, "A": {"kk": ["қысқы ұйқыға кетеді"], "ru": ["впадают в зимнюю спячку"]}, "B": {"kk": ["мекендейді"], "ru": ["обитает"]}}, "editor_changes": ""}, {"id": "l2v2-q20", "number": 20, "text_id": "l2v2-t9", "stem": "Мәтіннің негізгі ойы қандай?", "options": {"A": "Тойға әрқашан жаңа, әдемі киіммен бару керек.", "B": "Үй иесі қонақты әрқашан етпен сыйлауы керек.", "C": "Тойға келген әр қонақ сыйлық әкелуі керек.", "D": "Адамды киіміне қарап бағалау дұрыс емес."}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Қожанасырдың үстіндегі киімі жаман екен.", "Бұл жолы үй иесі Қожанасырды құрметтейді, төрден орын береді, ет келгенде:", "– Сен кісіні сыйламайды екенсің, киімді сыйлайды екенсің."], "explanation": "Қожанасыр жаман киіммен келгенде, оны ешкім елемеді. Тәуір киім киіп келгенде, құрметтеді. Қожанасыр «кісіні емес, киімді сыйлайды екенсің» деп, адамды киіміне қарап бағалаудың дұрыс емес екенін көрсетті.", "explanation_ru": "Когда Ходжа пришёл в плохой одежде, его никто не замечал, а когда пришёл в хорошей — его стали почитать. Словами «уважаешь не человека, а одежду» Ходжа показал, что судить о человеке по одежде неправильно.", "distractor_notes": {"A": "Қожанасыр жаңа киім кигені үшін емес, адамдарға сабақ болу үшін киімін ауыстырды.", "B": "мәтінде қонаққа ет беріледі, бірақ негізгі ой – ет туралы емес. Қожанасырдың соңғы сөзін қайта оқы.", "C": "мәтінде сыйлық туралы айтылмайды."}, "distractor_notes_ru": {"A": "Ходжа переоделся не ради новой одежды, а чтобы преподать людям урок.", "B": "В тексте гостя угощают мясом, но главная мысль не о мясе. Перечитай последние слова Ходжи.", "C": "В тексте ничего не сказано о подарках."}, "distractor_evidence": {"A": ["Сондықтан шапаныма жегізіп отырғаным!"], "B": [], "C": []}, "keywords": {"ok": {"kk": ["киімі жаман", "Бұл жолы", "құрметтейді", "кісіні сыйламайды", "киімді сыйлайды"], "ru": ["была плохой", "На этот раз", "оказывает почёт", "не уважаешь человека", "уважаешь одежду"]}, "A": {"kk": ["шапаныма жегізіп"], "ru": ["кормлю свой халат"]}}, "editor_changes": ""}]}, {"bank_id": "kaz-L1-v4", "track": "first_language", "source": "Автордың құрастырған нұсқасы: НЗМ үлгісінің деңгейінде, мәтіндер қазақстандық сайттардан алынған (әр мәтіннің дереккөзі көрсетілген)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {}, "style_notes": [], "texts": [{"id": "l1v4-t1", "title": "", "source_note": "KAZ.NUR.KZ: «Тоқтар, Талғат, Айдын: қазақтан шыққан ғарышкерлер туралы не білесіз» – https://kaz.nur.kz/family/school/2079917-toqtar-talgat-aidyn-qazaqtan-syqqan-garyskerler-turaly-ne-bilesiz/", "numbered_paragraphs": false, "paragraphs": ["Тұңғыш қазақ ғарышкері Тоқтар Әубәкіров 1946 жылы 27 шілдесінде Қарағанды облысы, Қарқаралы ауданында дүниеге келген. 1991 жылы 2 сәуірде Кеңес Одағы Ғарышкерлер даярлау орталығында ғарышқа ұшу дайындығына кірісті. Сол жылы 2 қазанда Байқоңырдан «Союз ТМ-13» кемесімен ғарышқа ұшты. Ғарыш кемесі жер төңірегіндегі «Мир» орбиталық кешенімен түйісті. Онда ол өзге ғарышкерлермен бірге биотехнология, металлургия, медицина салалары және Арал аймағы бойынша ғылыми-зерттеу жұмыстарын жүргізді."]}, {"id": "l1v4-t2", "title": "", "source_note": "Informburo.kz: «Балалардың көзі нашарлап, өздері неге бүкірейіп барады және оған цифрлық технологиялардың қатысы қандай» – https://informburo.kz/kaz/kogam/balalardyn-kozi-nasarlap-ozderi-nege-bukireiip-barady-zane-ogan-cifrlyq-texnologiialardyn-qatysy-qandai", "numbered_paragraphs": false, "paragraphs": ["Санжар Асфендияров атындағы ҚазҰМУ Педиатрия кафедрасының меңгерушісі Гүлнар Ташенова Алматыда өткен халықаралық педиатрия конференциясының барысында жауап берді.", "– Ең бірінші орында – тыныс алу жолдарының аурулары. Вирустық инфекциялар, маусымдық тұмау және өзге де тыныс алу ауруларының статистикасы қай уақытта да жоғары. Одан кейін сезу мүшелерінің аурулары тұр. Олардың ішінде балалардың смартфонды шамадан тыс қолдануына байланысты көз ауруларының көбеюі алаңдатып отыр. Смартфонға шүйлігу, дұрыс отырмау себепті сүйек-бұлшық ет жүйесіне қатысты сколиоз, остеохондроз, омыртқаның қисаюы сынды аурулар да көбейген."]}, {"id": "l1v4-t3", "title": "Таза бұлақ", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Таза бұлақ» – https://bilim-all.kz/article/2409", "numbered_paragraphs": false, "paragraphs": ["Үш жолаушы бір бұлақтың басында бір-біріне кез болыпты. Бұлақ бір тастақ жерден шыққан, суы мұздай, салқын, шыныдай жылтылдап тұрған сонша әдемі, таза бұлақ екен. Су шыққан жеріне бір қазандай тасты біреу ойып қорғаныш қылып, тастың суағар жеріне жазу жазыпты:", "– Әй, жолаушы, болсаң осы бұлақтай бол, – деп. Манағы үш жолаушы бұлақтан ішіп қанған соң жазуды оқып, біреуі саудагер екен, ол айтты:", "– Бұл жазылған ақыл сөз екен, бұлақ күн-түн тынбай ағып, алыс жерлерге барады, бара-бара кеңейіп, үлкейеді. Мұнан мұрат сол: сен де, адам, тынбай қызмет қыл, ешуақытта жалқауланып тоқтап қалма, сөйтсең, ақырында, сен де зорайып мұратыңа жетесің дегені ме деп білемін, – деді.", "Екінші жолаушы мүсәпір молда екен, басын шайқап:", "– Жоқ, мен олай ойламаймын, бұл жазудың мағынасы сіздің ойлағаннан гөрі жоғарырақ соқса керек, бұл бұлақ: кім-кімге болса да даяр, ыстықтағанды салқындатып, жанын рақаттандырады, сусағанның сусынын қандырады, оның үшін ешкімнен ақы дәметпейді; бұлай болса, адамға да әбірет сол: біреуге жақсылық етсең, ол жақсылығыңды ешкімге міндет етпе дегені болса керек, – деді.", "Үшінші жолаушы көркем келген бір әдемі жігіт екен, бұл үндемей тұрды. Жолдастары: «Сен не ойлайсың?» – деп сұрады. Жігіт айтты:", "– Бұл бұлақтың суы бір орында тынып тұрып, шөп-шалам түсіп, лай-қоқым болса, бұған адам мен айуан мұнша ынтық болмас еді; бұлақ күні-түні тынбай ағып тазаланып тұрғаны үшін ынтық болады. Олай болса, жазудың мағынасы: көңіліңді, бойыңды осы бұлақтай таза сақта дегені ме деймін, – деді."]}, {"id": "l1v4-t4", "title": "", "source_note": "Massaget.kz: «Канадада жұмыс істейтін қазақ ғалымы шетелдегі өмірі туралы айтты» – https://massaget.kz/news/kanadada-jumyis-steytn-kazak-galyimyi-sheteldeg-omr-turalyi-88167/", "numbered_paragraphs": true, "paragraphs": ["Дінмұхамед Шахман 7-сыныптан бастап химияны терең оқуды қолға алған. 2010 жылы Назарбаев Зияткерлік мектебіне түскен ол бірден химия пәнінен олимпиадалық резервке өткен. Оның ғылым саласындағы жолы осы уақыттан басталады.", "«Талдықорғандағы Назарбаев Зияткерлік мектебіне оқуға түскенімде химия пәнінен олимпиадалық резервке іріктеу болды. Іріктеу нәтижесі бойынша олимпиадалық резервке түсіп, химияны оқуға кірістім. Республикалық және халықаралық олимпиадаларда жүлделі орындарға ие болған сайын бойымда сенімділік артты. Сондықтан химия қызығушылық емес, кәсібім дер едім», – дейді ол.", "Дінмұхамедтің айтуынша, оның олимпиадалық резерв іріктеуінен өткені кездейсоқ жағдай. Ол сол кезде химияға қандай да бір қызығушылығы болмағанын айтады. Алайда кейін ғылымның бұл саласы арқылы кейіпкер ел аралап, түрлі шәкіртақы, жүлде иегері атанды.", "«Екінші курста Есенов атындағы шәкіртақыны жеңіп алдым. Кейін жазда Оңтүстік Корея университетінде тағылымдамадан өттім. Үшінші курста Есенов атындағы қордың шетелде ғылыми тағылымдамадан өту конкурсы жеңімпаздарының бірі болдым. Шәкіртақыны жеңіп алғаныма өте қуаныштымын, өйткені Франция, Канада сияқты елдерде білімімді шыңдауға мүмкіндік пайда болды», – дейді ол.", "«Мектеп оқушыларына химия пәнінен олимпиадаға қатысуға кеңес берер едім, сонда біліміңізді жетілдіріп, арманыңыздағы оқу орнына түсе аласыз. Студенттерге мүмкіндігінше ертерек ғылыми жұмыспен айналысуға, жетекші профессорды табуға кеңес берер едім», – деп бөлісті маман."]}, {"id": "l1v4-t5", "title": "", "source_note": "KAZ.NUR.KZ: «Бұл ой Байзақтағы апаттан кейін туды»: тараздық оқушы өрт құрсауында қалған адамды іздеп табатын робот құрастырды – https://kaz.nur.kz/society/2011298-bul-oi-baizaqtagy-apattan-keiin-tudy-tarazdyq-oqusy-ort-qursauynda-qalgan-adamdy-izdep-tabatyn-robot-qurastyrdy/", "numbered_paragraphs": false, "paragraphs": ["Вячеслав Кузьмин кішкентайынан робот жасауға қызығушылық танытқан. (1) Жасөспірім 5-сыныптан бастап мектептен тыс уақытта «Техникалық шығармашылық орталықта» қосымша білім алады екен. Аталған жобаны ол орталықтың тәлімгері Айнұр Сұраншиеваның жетекшілігімен жасап шығарған.", "«Бұл идея Байзақта болған апаттан кейін өмірге келді. Шынайы прототип жасайық деп ойлап отырмыз. (2) Роботты әлі де жетілдіре түсу қажет. Отқа төзімді металлдан датчик жасауымыз керек. Қазір де отты өшіре алады. Бірақ ПВХ-дан құрастырылғандықтан отқа төзімді емес. Қолда бар материалдардан жасадық», – дейді Айнұр Сұраншиева.", "«Роботтың алдында кедергі болған заттарды итеруге арналған арнайы құрылғысы бар және алдында орналастырылған камерасы арқылы сыртқы жағдайды бақылай алады. Робот ішінде екі бак бар. Оны жағдайға қарай көпіршікпен немесе сумен толтыруға болады. (3) Сондай-ақ роботтың ультрадыбыстық қондырғысы бар. Ол оттың ошағын табуға көмектеседі», – дейді Вячеслав Кузьмин.", "(4) Алдағы уақытта роботты тағы да жетілдіріп, дронмен байланыстыру арқылы көпқабатты үйлерде өрт болған жағдайда жылдам әрі сапалы әрекет ету мүмкіндіктері де ойластырылуда.", "Робот әзірге патенттелмеген. (5) Жас өнертапқыш өз еңбегін төтенше жағдайлар департаментінің мамандарына таныстыруды жоспарлап отыр."]}, {"id": "l1v4-t6", "title": "Мектеп кітапханашыларының мәртебесі неге нақтыланбаған?", "source_note": "Egemen Qazaqstan: «Мектеп кітапханашыларының міндеті неге нақтыланбаған?» – https://egemen.kz/news/article251422-mektep-kitapkhanashylarynynh-mindeti-nege-naqtylanbaghan", "numbered_paragraphs": true, "paragraphs": ["Айгүл Мұқашева, заңгер: – Мектептегі мұғалімдер педагогикалық қызметкерлер құрамына кіреді, ал кітапханашылар, әдіскерлер, т.б. қызметкерлер оқу-көмекші қызметкерлері болып саналады. Мәселен, өзім еңбек ететін оқу орнында да кітапханашылар бар. Олар оқу-көмекші қызметкер ретінде шаруашылық қызметкерлерінен жоғары жалақы алады. Негізінен осы тәртіп мектептерде де сақталуы тиіс.", "Айман Сағидулла, мұғалім: – Кітапханашы қалай педагог қатарына кіреді? Кітапханашы – кітапхананың қызметкері. Олар Мәдениет және спорт министрлігіне қарайды. Ал педагог бала тәрбиесімен айналысады. Екеуі – екі басқа мамандық.", "Гүлмира Қайырбекқызы, кітапхана меңгерушісі: – Менің кітапхана саласындағы еңбек өтілім – 32 жыл. Кітапханашылар да мектептің тәрбие үдерісіне өзінің зор үлесін қосып отыр. Біз де түрлі іс-шара өткізіп, бала тәрбиесіне бір кісідей араласамыз. Сондықтан біздің педагог-қызметкерден еш айырмашылығымыз жоқ.", "Маржан Мануарқызы, кітапхана меңгерушісі: – Мектеп оқушыларын түрлі іс-шараға тарту, кітап оқуға деген ынтасын арттыру мақсатында тынымсыз еңбек атқарамыз. Бірақ еңбегіміз елеусіз қалады. Кітапханашы қызметіне педагогикалық білімі бар адамды алады, онда неге білім саласында жүрген кітапханашыларға кітапханашы-педагог мәртебесін бермеске?!"]}, {"id": "l1v4-t7", "title": "", "source_note": "Massaget.kz: «Швейцария отшашумен күтіп алды». Қызы анасына Еуропа сапары арқылы ерекше тосынсый жасады – https://massaget.kz/layfstayl/shveytsariya-otshashumen-kutp-aldyi-kyizyi-anasyina-europa-89320/", "numbered_paragraphs": false, "paragraphs": ["Саяхаттау адамға ерекше әсер сыйлайтыны анық. Ал әлемді анаңмен бірге аралау – тіпті бөлек сезім. Дүниедегі ең жақыны – анасымен бірге Еуропа аралаған Мереке Рахманова да дәл осындай пікірде.", "«Сапарда керемет жандар жолықты. Бәрі сәтті, оңынан болды. Барлық сапарымның, саяхатымның ішінде ең есте қаларлығы осы анаммен сапар болды. Барлығы «анаңмен жүрсің бе» деп қызыға қарап, көмекке ұмтылды. Өзім де армандарым орындалғанына қатты қуандым. Анам 55 жаста. Бірақ ешқандай шаршамай, белсенді болды.", "Швейцарияға барған күні сол елдің туған күніне тұспа-тұс түсіппіз. Негізі, бұлай жоспарламадық. Қала орталығына кіргеннен бастап мерекелік атмосфера сезілді. Түнде отшашу атылды. Бізді солай күтіп алғандай болды.", "Ал Швейцарияда Интерлакен қаласында зүбәржат түстес екі өзен бар. Сол өзендердің жағажайына бара жатқанда, себелеп жаңбыр жауа бастады. Ал жағажайға жеткенде, күн шығып, күннің артынан үлкен кемпірқосақ шықты. Сол сәтте ертегіге түскендей болдық. Анам екеуміз балаша қуандық. Ендігі арманым ата-анам мен жолдасымның ата-анасына Американы көрсеткім келеді», – дейді Мереке."]}, {"id": "l1v4-t8", "title": "Ақымақ дос", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Ақымақ дос» – https://bilim-all.kz/article/9603", "numbered_paragraphs": false, "paragraphs": ["Бір мырза орманнан бір аю баласын ұстап алып, үйіне алып келіп, сонша жақсы күтіп асырапты. Бір күндерде мырза қатты ауырып, бір айдай төсектен тұрмай жатып, сол уақытта аюды да қараған кісі болмай, бұл да қатты жүдеп зарығыпты. Аурудан аз-ғана тәуір болған соң, мырза бір күні далада, есік алдына отырып, күннің жылысымен маужырап қалғиды, бірақ маңдайына, бетіне шыбын қонып, шыдатпайды. Соның бәрін де манағы аю көріп отыр екен. Мырзаға тыныштық бермегені үшін шыбынға қатты кейіді. Сөйтіп, аю ыза бола тұра жұлқып кеткенде шынжыры үзіліп кетіп, жүгіріп барды да, мырзаның бетіне табанымен салып келіп кеткенде, мырза сол жерде-ақ жан тапсырды дейді.", "Аю жылап айтты дейді: – Қожам мені баласындай күтіп, асыраушы еді. Бүгін сол аурудан тәуірірек болып, қожамның далаға шыққанына қуанып қарап тұрғанымда, мырза есік алдына отырып, қалғиын деп еді, шыбындар тыныштық бермеді. Соған ашуым келіп ұрғанымда қожам өліп қалды. Мен қожама қастық ойламадым, шыбынды қырайын деп едім, – деді."]}, {"id": "l1v4-t9", "title": "", "source_note": "Aikyn.kz: «Балалар емес, ересектер шығармашылық қабілеттірек болып шықты – зерттеу» – https://aikyn.kz/312442/balalar-emes--eresekter-shyg-armashylyk-k-a-k-abilettirek-bolyp-shyk-ty---zertteu", "numbered_paragraphs": false, "paragraphs": ["Ғалымдар ересек адамдардың шығармашылық қабілеті балаларға қарағанда жоғары болуы мүмкін екенін анықтады. Зерттеуге 4 пен 7 жас аралығындағы 92 бала және негізінен жиырма жастағы 70 ересек адам қатысқан. Оларға қаңылтыр ыдысты пайдаланудың ерекше жолдарын ұсыну, еркін тақырыпта сурет салу және қиялдағы жануарды ойлап табу тапсырылған.", "Нәтижесінде ересектердің идеялары балалардікіне қарағанда тың әрі мазмұнды болып шыққан. Бірақ балалар өз қабілетіне көбірек сенген, тапсырмаларды қызығушылықпен орындаған және қателесуден қорықпаған. Ал ересектер нәтижеге шамадан тыс мән беріп, кейбір ерекше идеяларын жүзеге асырмай тұрып-ақ қабылдамай тастаған."]}], "items": [{"id": "l1v4-q1", "number": 1, "text_id": "l1v4-t1", "stem": "Тоқтар Әубәкіров ғарышқа ұшқанда неше жаста еді?", "options": {"A": "43 жаста", "B": "45 жаста", "C": "46 жаста", "D": "47 жаста"}, "key": "B", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Тұңғыш қазақ ғарышкері Тоқтар Әубәкіров 1946 жылы 27 шілдесінде Қарағанды облысы, Қарқаралы ауданында дүниеге келген.", "Сол жылы 2 қазанда Байқоңырдан «Союз ТМ-13» кемесімен ғарышқа ұшты."], "explanation": "Тоқтар Әубәкіров 1946 жылы шілдеде туған, ал ғарышқа 1991 жылы қазанда ұшқан. 1991 – 1946 = 45. Туған күні (27 шілде) ұшқанға дейін өтіп кеткен, демек ол 45 жаста болған.", "editor_changes": "«Арал туған аймағы» → «Арал аймағы» (дереккөздегі артық сөз алынды).", "distractor_notes": {"A": "43 саны мәтінде жоқ. Туған жылы мен ұшқан жылын салыстырып есепте.", "C": "1991 – 1946 = 45. Ғарышкер 46 жасқа келесі жылы ғана толар еді.", "D": "47 жас мәтіндегі деректерге сәйкес келмейді: 1991 – 1946 = 45."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["1946 жылы 27 шілдесінде", "Сол жылы 2 қазанда"], "ru": []}}}, {"id": "l1v4-q2", "number": 2, "text_id": "l1v4-t2", "stem": "Маман неге ерекше алаңдайды?", "options": {"A": "тұмау мен инфекцияның қай уақытта да жиі кездесетініне", "B": "асқазан ауруларының балаларда дұрыс емделмейтініне", "C": "телефон кесірінен көз ауруларының жиілегеніне", "D": "балалар дәрігерлерінің жетіспейтініне"}, "key": "C", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Олардың ішінде балалардың смартфонды шамадан тыс қолдануына байланысты көз ауруларының көбеюі алаңдатып отыр.", "Смартфонға шүйлігу, дұрыс отырмау себепті сүйек-бұлшық ет жүйесіне қатысты сколиоз, остеохондроз, омыртқаның қисаюы сынды аурулар да көбейген."], "explanation": "Маман балалардың смартфонды шамадан тыс қолдануынан көз ауруларының көбеюі алаңдатып отырғанын айтады. Смартфонға шүйлігу омыртқа ауруларын да көбейткен.", "editor_changes": "Кіріспе сөйлем қысқартылды; «өзгеде» → «өзге де».", "distractor_notes": {"A": "тұмау шынымен де жиі кездеседі, бірақ маман оны «алаңдатып отыр» деп айтпайды. Ол бұл аурулардың статистикасы қай уақытта да жоғары екенін ғана айтады.", "B": "мәтінде асқазан ауруларының емделуі туралы айтылмайды.", "D": "бұл үзіндіде дәрігерлердің саны туралы айтылмайды."}, "distractor_evidence": {"A": ["Вирустық инфекциялар, маусымдық тұмау және өзге де тыныс алу ауруларының статистикасы қай уақытта да жоғары."], "B": [], "D": []}, "keywords": {"ok": {"kk": ["смартфонды шамадан тыс қолдануына", "алаңдатып отыр"], "ru": []}, "A": {"kk": ["қай уақытта да жоғары"], "ru": []}}}, {"id": "l1v4-q3", "number": 3, "text_id": "l1v4-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Жазуды тасқа үш жолаушының өзі жазып кетті.\n2. Бұлақ басындағы тасқа өсиет сөз қалдырылған.", "options": {"A": "екеуі де бұрыс", "B": "екеуі де дұрыс", "C": "тек біріншісі", "D": "тек екіншісі"}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Су шыққан жеріне бір қазандай тасты біреу ойып қорғаныш қылып, тастың суағар жеріне жазу жазыпты:", "Манағы үш жолаушы бұлақтан ішіп қанған соң жазуды оқып, біреуі саудагер екен, ол айтты:"], "explanation": "Тек екінші тұжырым дұрыс: бұлақ басындағы тасқа біреу ақыл сөз жазып кеткен. Ал бірінші тұжырым қате: жолаушылар жазуды жазған жоқ, бұлаққа келгенде оны оқыды.", "editor_changes": "Мәтін қысқартылды; «Жоқ мен» → «Жоқ, мен», «ойлайсын» → «ойлайсың», «мағнасы» → «мағынасы»; сызықшалар бірізге келтірілді.", "distractor_notes": {"A": "екінші тұжырым мәтінде бар. Жазудың қайда жазылғанын қайта оқы.", "B": "бірінші тұжырымды мәтінмен тағы салыстыр: жазуды кім жазды?", "C": "бірінші тұжырым бойынша жазуды жолаушылар жазған. Олардың бұлаққа келгенде не істегенін қайта оқы."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["біреу ойып", "жазу жазыпты", "жазуды оқып"], "ru": []}}}, {"id": "l1v4-q4", "number": 4, "text_id": "l1v4-t3", "stem": "«Көңіліңді, бойыңды осы бұлақтай таза сақта».\nҮшінші жолаушы не айтқысы келді?", "options": {"A": "Адам денсаулығы үшін тек таза су ішуі керек.", "B": "Бұлақтың маңайын таза ұстау әр жолаушының міндеті.", "C": "Адамның ойы мен жүрегі пәк, адал болуы керек.", "D": "Бұлақтың суы тек ағып тұрғанда ғана ішуге жарайды."}, "key": "C", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Олай болса, жазудың мағынасы: көңіліңді, бойыңды осы бұлақтай таза сақта дегені ме деймін, – деді.", "бұлақ күні-түні тынбай ағып тазаланып тұрғаны үшін ынтық болады"], "explanation": "Үшінші жолаушы бұлақтың суы тынбай ағып, тазаланып тұрғандықтан жұрт оған ынтық екенін айтады. Ол адамның да көңілін, жан дүниесін таза сақтауы керек екенін меңзейді.", "editor_changes": "", "distractor_notes": {"A": "жолаушы ішетін су туралы емес, адамның көңілі туралы айтып тұр.", "B": "жолаушы бұлақтың маңайын тазалау туралы айтпайды. «Көңіліңді, бойыңды» деген сөзге назар аудар.", "D": "жолаушы бұлақтың суы туралы ғана емес, адамға үлгі туралы айтады."}, "distractor_evidence": {"A": [], "B": [], "D": ["Олай болса, жазудың мағынасы: көңіліңді, бойыңды осы бұлақтай таза сақта дегені ме деймін, – деді."]}, "keywords": {"ok": {"kk": ["көңіліңді, бойыңды", "таза сақта"], "ru": []}, "D": {"kk": ["жазудың мағынасы"], "ru": []}}}, {"id": "l1v4-q5", "number": 5, "text_id": "l1v4-t4", "stem": "Дінмұхамед химияны неге оқи бастады?", "options": {"A": "олимпиадаға дайындалатын топқа іріктелгендіктен", "B": "химияға кішкентай кезінен ерекше қызыққандықтан", "C": "Канадада тұрып, жұмыс істегісі келгендіктен", "D": "Есенов атындағы шәкіртақыны алғысы келгендіктен"}, "key": "A", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Іріктеу нәтижесі бойынша олимпиадалық резервке түсіп, химияны оқуға кірістім."], "explanation": "Дінмұхамед мектепке түскенде химиядан олимпиадалық резервке іріктеуден өтіп, сол себепті химияны оқуға кіріскен.", "editor_changes": "Дереккөздің бірнеше абзацынан қысқартылып құралды; редакцияның түсіндірмесі (жақша ішіндегі ескерту) алынды.", "distractor_notes": {"B": "мәтінде керісінше айтылған: ол кезде оның химияға қызығушылығы болмаған.", "C": "Канада туралы кейін, химиямен айналысып жүрген кезде айтылады. Бұл – себеп емес, нәтиже.", "D": "шәкіртақыны ол университеттің екінші курсында, химияны көп жыл оқығаннан кейін жеңіп алды."}, "distractor_evidence": {"B": ["Ол сол кезде химияға қандай да бір қызығушылығы болмағанын айтады."], "C": [], "D": ["«Екінші курста Есенов атындағы шәкіртақыны жеңіп алдым."]}, "keywords": {"ok": {"kk": ["олимпиадалық резервке түсіп", "химияны оқуға кірістім"], "ru": []}, "B": {"kk": ["қызығушылығы болмағанын"], "ru": []}, "D": {"kk": ["Екінші курста"], "ru": []}}}, {"id": "l1v4-q6", "number": 6, "text_id": "l1v4-t4", "stem": "«Химия қызығушылық емес, кәсібім дер едім».\nДінмұхамед не айтқысы келді?", "options": {"A": "Химия оның жай әуестігі емес, нағыз мамандығына айналды.", "B": "Ол химияны мүлде ұнатпайды, оны тек жалақы үшін ғана оқиды.", "C": "Ол химиядан басқа ешбір нәрсеге қызықпайтын адамға айналды.", "D": "Химия пәні ": "роботтарды тек ойын-сауық үшін жасайтын, еріншек оқушы.", "C": "өрт сөндіру бөлімінде жұмыс істейтін тәжірибелі маман.", "D": "өз роботын патенттеп, сатуға шығарған кәсіпкер."}, "key": "A", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 3, "negative": false, "fixed_order": false, "evidence": ["(1) Жасөспірім 5-сыныптан бастап мектептен тыс уақытта «Техникалық шығармашылық орталықта» қосымша білім алады екен.", "(2) Роботты әлі де жетілдіре түсу қажет.", "(5) Жас өнертапқыш өз еңбегін төтенше жағдайлар департаментінің мамандарына таныстыруды жоспарлап отыр."], "explanation": "Вячеслав 5-сыныптан бері қосымша білім алады, роботты одан әрі жетілдіріп, дронмен байланыстыруды жоспарлайды, жобасын мамандарға таныстырғысы келеді. Демек, ол – ізденімпаз, жұмысын жетілдіре беретін жас өнертапқыш.", "editor_changes": "", "distractor_notes": {"B": "Вячеслав робот жасауды ойын үшін емес, өрт кезінде адамдарға көмектесу үшін қолға алған.", "C": "Вячеслав – маман емес, мектептен тыс қосымша білім алатын жасөспірім.", "D": "мәтінде керісінше айтылған: робот әзірге патенттелмеген."}, "distractor_evidence": {"B": ["«Бұл идея Байзақта болған апаттан кейін өмірге келді."], "C": ["(1) Жасөспірім 5-сыныптан бастап мектептен тыс уақытта «Техникалық шығармашылық орталықта» қосымша білім алады екен."], "D": ["Робот әзірге патенттелмеген."]}, "keywords": {"ok": {"kk": ["5-сыныптан бастап", "жетілдіре түсу қажет", "таныстыруды жоспарлап отыр"], "ru": []}, "B": {"kk": ["Байзақта болған апаттан кейін"], "ru": []}, "C": {"kk": ["Жасөспірім"], "ru": []}, "D": {"kk": ["әзірге патенттелмеген"], "ru": []}}}, {"id": "l1v4-q9", "number": 9, "text_id": "l1v4-t5", "stem": "Робот жасау идеясы неден туды?", "options": {"A": "мектептегі сабақтың тапсырмасынан", "B": "Байзақтағы қайғылы оқиғадан кейін", "C": "төтенше жағдайлар бөлімінің өтінішінен", "D": "дрондарға деген үлкен қызығушылықтан"}, "key": "B", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["«Бұл идея Байзақта болған апаттан кейін өмірге келді."], "explanation": "Тәлімгері Айнұр Сұраншиева бұл идеяның Байзақта болған апаттан кейін туғанын айтады.", "editor_changes": "", "distractor_notes": {"A": "мәтінде сабақтың тапсырмасы туралы айтылмайды. Вячеслав мектептен тыс орталықта білім алады.", "C": "Вячеслав өз жобасын төтенше жағдайлар мамандарына енді ғана таныстырмақ. Олар оны жасауды өтінген жоқ.", "D": "дронмен байланыстыру – болашақтағы жоспар, идеяның себебі емес."}, "distractor_evidence": {"A": [], "C": ["(5) Жас өнертапқыш өз еңбегін төтенше жағдайлар департаментінің мамандарына таныстыруды жоспарлап отыр."], "D": ["(4) Алдағы уақытта роботты тағы да жетілдіріп, дронмен байланыстыру арқылы көпқабатты үйлерде өрт болған жағдайда жылдам әрі сапалы әрекет ету мүмкіндіктері де ойластырылуда."]}, "keywords": {"ok": {"kk": ["Байзақта болған апаттан кейін"], "ru": []}, "C": {"kk": ["таныстыруды жоспарлап отыр"], "ru": []}, "D": {"kk": ["Алдағы уақытта"], "ru": []}}}, {"id": "l1v4-q10", "number": 10, "text_id": "l1v4-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Робот отқа төзімді арнайы металдан жасалған.", "B": "Робот жолындағы заттарды ысыра алады.", "C": "Робот әлі ешқандай отты өзі сөндіре алмайды.", "D": "Робот әзірге патенттеліп, сатылып жатыр."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["«Роботтың алдында кедергі болған заттарды итеруге арналған арнайы құрылғысы бар және алдында орналастырылған камерасы арқылы сыртқы жағдайды бақылай алады."], "explanation": "Мәтінде роботтың алдындағы кедергі заттарды итеретін арнайы құрылғысы бар екені айтылады.", "editor_changes": "", "distractor_notes": {"A": "робот ПВХ-дан жасалған, сондықтан отқа төзімді емес.", "C": "мәтінде керісінше айтылған: робот қазірдің өзінде отты өшіре алады.", "D": "робот әзірге патенттелмеген."}, "distractor_evidence": {"A": ["Бірақ ПВХ-дан құрастырылғандықтан отқа төзімді емес."], "C": ["Қазір де отты өшіре алады."], "D": ["Робот әзірге патенттелмеген."]}, "keywords": {"ok": {"kk": ["кедергі болған заттарды итеруге"], "ru": []}, "A": {"kk": ["отқа төзімді емес"], "ru": []}, "C": {"kk": ["Қазір де отты өшіре алады"], "ru": []}, "D": {"kk": ["әзірге патенттелмеген"], "ru": []}}}, {"id": "l1v4-q11", "number": 11, "text_id": "l1v4-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "ертегі", "B": "әңгіме", "C": "сұхбат", "D": "мақала"}, "key": "D", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Вячеслав Кузьмин кішкентайынан робот жасауға қызығушылық танытқан.", "Робот әзірге патенттелмеген."], "explanation": "Мәтінде автор нақты оқушы мен оның жобасы туралы ақпарат беріп, оның және тәлімгерінің сөзін келтіреді. Сұрақ-жауап та, ойдан шығарылған оқиға да жоқ. Мұндай публицистикалық мәтін – мақала.", "editor_changes": "", "distractor_notes": {"A": "ертегіде қиял-ғажайып оқиғалар болады. Мұнда нақты оқушы мен оның жобасы туралы айтылады.", "B": "әңгіме – көркем шығарма, онда ойдан шығарылған оқиға баяндалады. Ал мұнда нақты ақпарат беріледі.", "C": "мәтінде кейіпкерлердің сөзі келтірілген, бірақ тілшінің сұрақтары жоқ. Сұхбат сұрақ пен жауаптан тұрады."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["Вячеслав Кузьмин", "Робот әзірге патенттелмеген"], "ru": []}}}, {"id": "l1v4-q12", "number": 12, "text_id": "l1v4-t6", "stem": "«Екеуі – екі басқа мамандық.»\nОсы сөйлемде «екеуі» деп нені айтады? (2-абзац)", "options": {"A": "мұғалім мен әдіскер-маманды", "B": "заңгер мен мектеп мұғалімін", "C": "кітапханашы мен ұстазды", "D": "екі түрлі министрлікті"}, "key": "C", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Кітапханашы – кітапхананың қызметкері. (2-азатжол)", "Ал педагог бала тәрбиесім
