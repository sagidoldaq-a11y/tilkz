егін алған оқушылардың бәрі грант жеңді.", "D": "Диас қазір оқушыларды дайындауды тоқтатқан."}, "key": "A", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["(3) Ол кезінде іріктеуден өте алмай қалғанымен, дайындықты тоқтатпай, керісінше өзгелерге көмектесуді жалғастырған."], "explanation": "Мәтінде Диастың кезінде іріктеуден өте алмай қалғаны, бірақ берілмегені айтылады.", "distractor_notes": {"B": "Диас алдымен онлайн, кейін офлайн кездесулерде де сабақ өткізген.", "C": "79 оқушының бәрі емес, 22-сі ғана грант жеңді.", "D": "мәтінде керісінше айтылған: Диас жаңа оқушыларды дайындауды тоқтатпаған."}, "distractor_evidence": {"B": ["Диас онлайн форматта сабақ өткізіп, кейін офлайн кездесулерде дайындықты жалғастырған."], "C": ["Алматы облысында тұратын 11-сынып оқушысы Диас Абдылхак бір жыл ішінде 79 оқушыға физика пәнінен тегін көмектесіп, олардың 22-сі білім грантын жеңіп алуына ықпал етті."], "D": ["(4) Қазір ол оқуын жалғастыра отырып, жаңа оқушыларды дайындауды тоқтатпаған."]}, "keywords": {"ok": {"kk": ["іріктеуден өте алмай қалғанымен"], "ru": []}, "B": {"kk": ["кейін офлайн кездесулерде"], "ru": []}, "C": {"kk": ["олардың 22-сі"], "ru": []}, "D": {"kk": ["дайындауды тоқтатпаған"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q11", "number": 11, "text_id": "l1v3-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "әңгіме", "B": "мақала", "C": "сұхбат", "D": "ертегі"}, "key": "B", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Диастың жеке жолы да оңай болмаған.", "Бұл тәсіл білім берудегі «peer-to-peer» немесе оқушылардың бір-біріне көмектесу қағидатына негізделеді."], "explanation": "Мәтінде автор нақты адам – Диас туралы ақпарат береді, оның сөзін келтіреді және оның тәсілін түсіндіреді. Сұрақ-жауап та, ойдан шығарылған оқиға да жоқ. Мұндай публицистикалық мәтін – мақала.", "distractor_notes": {"A": "әңгіме – көркем шығарма, онда ойдан құрастырылған оқиға баяндалады. Ал мұнда нақты оқушы туралы ақпарат беріледі.", "C": "мәтінде Диастың сөзі келтірілген, бірақ тілшінің сұрақтары жоқ. Сұхбат сұрақ пен жауаптан тұрады.", "D": "ертегіде қиял-ғажайып оқиғалар болады. Мұнда өмірде болған нақты жағдай айтылады."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Диастың жеке жолы", "Бұл тәсіл"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q12", "number": 12, "text_id": "l1v3-t6", "stem": "«Оларға қарап, балам алаңдайды.»\nОсы сөйлемде «оларға» деп кімдерді айтады? (4-абзац)", "options": {"A": "ұлының сыныптастарын", "B": "сыныптағы мұғалімдерді", "C": "Айнұрдың өз балаларын", "D": "мектеп әкімшілігін"}, "key": "A", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Сыныптастары телефон апарып, сабақ үстінде ойнап отыратындарын айтады. (4-азатжол)"], "explanation": "Алдыңғы сөйлемде ұлының сыныптастары сабақ үстінде телефон ойнайтыны айтылады. Демек, «оларға» – ұлының сыныптастарына.", "distractor_notes": {"B": "4-абзацта мұғалімдер туралы айтылмайды. Алдыңғы сөйлемде кімдердің телефон ойнайтынын қайта оқы.", "C": "Айнұр Тұмақбаева өз балаларына телефон бермейді, сондықтан олар сабақта телефон ойнамайды.", "D": "мектеп басшылары туралы бұл абзацта айтылмайды. Алдыңғы сөйлемді қайта оқы."}, "distractor_evidence": {"B": [], "C": ["– Мен өз басым балаларыма мектепке телефон апаруға рұқсат бермеймін."], "D": []}, "keywords": {"ok": {"kk": ["Сыныптастары телефон апарып"], "ru": []}, "C": {"kk": ["рұқсат бермеймін"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q13", "number": 13, "text_id": "l1v3-t6", "stem": "1-абзацтың негізгі ойы қандай?", "options": {"A": "Сабақта телефонды тек мұғалім ғана қолдана алады.", "B": "Оқушылар телефонды мектепке мүлде әкелмеуі керек.", "C": "Сабақтың ұзақтығы 45 минуттан артық болуы керек.", "D": "Телефон сабақтың жоспарлы өтуіне бөгет жасайды."}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Осы жұмыстарды ұйымдастырып, өткізуге әрине телефон кедергі жасайды. (1-азатжол)", "Өйткені 45 минут сабақтың өзінің кезеңдері бар. (1-азатжол)"], "explanation": "Зәуре Байменова сабақтың кезеңдерін атап (үй тапсырмасын тексеру, жаңа тақырыпты түсіндіру, бекіту, топпен жұмыс), оларды өткізуге телефон кедергі жасайтынын айтады.", "distractor_notes": {"A": "тыйым тек оқушыға емес, мұғалімге де қатысты екені айтылады.", "B": "1-абзацта телефонды мектепке әкелуге тыйым салу туралы айтылмайды, тек сабақ үстінде қолдану туралы айтылады.", "C": "45 минут – сабақтың ұзақтығы. Оны ұзарту керек деп айтылмайды."}, "distractor_evidence": {"A": ["Бұл оқушыға да, мұғалімге де қатысты мәселе."], "B": ["– Сабақ үстінде телефон қолдануға тыйым салынады."], "C": []}, "keywords": {"ok": {"kk": ["телефон кедергі жасайды", "кезеңдері бар"], "ru": []}, "A": {"kk": ["мұғалімге де қатысты"], "ru": []}, "B": {"kk": ["Сабақ үстінде"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q14", "number": 14, "text_id": "l1v3-t6", "stem": "Кімнің сөзінде телефонның сабақта қажет болатын кезі де айтылады?", "options": {"A": "Зәуре Байменова", "B": "Айжан Байжұманова", "C": "Іңкәр мен Гауһар", "D": "Айнұр Тұмақбаева"}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 3, "negative": false, "fixed_order": true, "evidence": ["Бірақ жаңа сабақтың тапсырмаларын бергенде интернетті қажет болатын кездер де болады. (2-азатжол)", "Осындай кезде телефонды қажет етеміз. (2-азатжол)"], "explanation": "Жас ұстаз Айжан Байжұманова тыйымды қолдайды, бірақ жаңа сабақтың тапсырмаларына интернет керек болатын кездер де болатынын айтады.", "distractor_notes": {"A": "Зәуре Байменова телефонның тек кедергі жасайтынын айтады.", "C": "Іңкәр мен Гауһар телефонсыз сабақтың пайдасын ғана айтады.", "D": "Айнұр Тұмақбаева телефон баланы алаңдататынын айтады."}, "distractor_evidence": {"A": ["Осы жұмыстарды ұйымдастырып, өткізуге әрине телефон кедергі жасайды."], "C": ["Ал ұялы телефонсыз сабаққа қатысқан оқушының сабаққа қызығушылығы артады, білімі көбейеді, мидағы артық ойдан арылады."], "D": ["Оларға қарап, балам алаңдайды."]}, "keywords": {"ok": {"kk": ["интернетті қажет болатын кездер", "телефонды қажет етеміз"], "ru": []}, "A": {"kk": ["телефон кедергі жасайды"], "ru": []}, "C": {"kk": ["ұялы телефонсыз"], "ru": []}, "D": {"kk": ["балам алаңдайды"], "ru": []}}, "editor_changes": "Мақаладағы пікірлер сөйлеушінің атымен төрт абзацқа топтастырылды (НЗМ үлгісіндегі 6-мәтін сияқты). «Телефон қолдану тыйым салынады» → «қолдануға тыйым салынады»; «бекіту,жеке» → «бекіту, жеке»."}, {"id": "l1v3-q15", "number": 15, "text_id": "l1v3-t7", "stem": "Кешке жиналған жастар өздерін қалай сезінді?", "options": {"A": "Ұйымдастыру жұмысынан әбден шаршап қалды.", "B": "Өзге ұлттардың мейрамына қонақ болғандай сезінді.", "C": "Өздерін туған елде жүргендей сезінді.", "D": "Туған елінен алыста жүргеніне қатты мұңайды."}, "key": "C", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Әз Наурыздың арқасында ағылшын елінде жүргенімізді бір сәтке ұмытып кеттік."], "explanation": "Жанар Әз Наурыздың арқасында ағылшын елінде жүргендерін бір сәтке ұмытып кеткендерін айтады.", "distractor_notes": {"A": "мәтінде шаршағаны емес, кешті көңілді өткізіп, ғажап әсермен қайтқаны айтылады.", "B": "кеш өз мерекесі – Наурызға арналды, оны қазақ, өзбек, түркімен жастары бірге өткізді.", "D": "Наурыз оларды мұңайтпады, керісінше шетелде жүргендерін ұмыттырды."}, "distractor_evidence": {"A": ["Кеште ұлттық тағамдар, ұлттық әшекейлер мен жәдігерлерден кішігірім көрме жасап, өзге жерде жүріп өз тілімізде ән шырқап, қазақ тілінде айтылған әнге би билеп ғажап әсермен үйге қайттық."], "B": ["19 наурызда Рединг университетінде білім алып жатқан қазақ, өзбек, түркімен азаматта ірім көрме жасап"], "ru": []}}, "editor_changes": "Сөйлем басындағы «Ал» шылауы алынды; «сезімізді» → «сезімімізді», «ән шырқып» → «ән шырқап»."}, {"id": "l1v3-q17", "number": 17, "text_id": "l1v3-t7", "stem": "Жанар Тұрлыбекқызы сөзінің соңында қандай ой түйеді?", "options": {"A": "Шетелде оқу қазақ студенттеріне өте қиын әрі ауыр тиеді.", "B": "Дәстүрді шетелде де ұстану отансүйгіштікті күшейтеді.", "C": "Наурызды тек туған елде ғана тойлаған әлдеқайда дұрыс.", "D": "Ағылшындар Наурызды бізден де әлдеқайда жақсы тойлайды."}, "key": "B", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Жалпы, қазағымыздың қайда жүрсе де өз дәстүрін ұмытпай дәріптеп жүретіні көкейіміздегі патриоттық сезімімізді оятады екен», – деді Ж.Тұрлыбекқызы."], "explanation": "Жанар сөзін қазақтың қай жерде жүрсе де өз дәстүрін ұмытпай дәріптейтіні патриоттық сезімді оятады деп түйіндейді.", "distractor_notes": {"A": "Жанар оқудың қиындығы туралы айтпайды. Ол Наурызды қалай тойлағаны туралы айтады.", "C": "Жанар керісінше Наурызды шетелде тойлап, ғажап әсер алғанын айтады.", "D": "мәтінде ағылшындардың Наурызды тойлағаны туралы айтылмайды."}, "distractor_evidence": {"A": [], "C": ["Кеште ұлттық тағамдар, ұлттық әшекейлер мен жәдігерлерден кішігірім көрме жасап, өзге жерде жүріп өз тілімізде ән шырқап, қазақ тілінде айтылған әнге би билеп ғажап әсермен үйге қайттық."], "D": []}, "keywords": {"ok": {"kk": ["қайда жүрсе де өз дәстүрін ұмытпай", "патриоттық сезімімізді оятады"], "ru": []}, "C": {"kk": ["өзге жерде жүріп"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q18", "number": 18, "text_id": "l1v3-t8", "stem": "Неліктен қазан сүтке емес, суға толды?", "options": {"A": "ауылдағы малдың бәрі ашаршылықта қырылғандықтан", "B": "басшы қазанға тек су құюды бұйырғандықтан", "C": "әркім өз суы байқалмайды деп ойлағандықтан", "D": "түнде қараңғыда сүт пен суды шатастырғандықтан"}, "key": "C", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Қазанға сүт құюға барғандар «Үлкен тайқазанға елдің бәрі сүт құйып жатқанда, оған менің бір кесе құйған суым әсер ете қоймас» деп пендешілік ойға барған еді."], "explanation": "Әркім «елдің бәрі сүт құйып жатқанда, менің бір кесе суым әсер етпейді» деп ойлаған. Осылай бәрі ойлағандықтан, қазан суға толды.", "distractor_notes": {"A": "мәтінде малдың қырылғаны айтылмайды. Әркімнің бір кеседен сүт құюға мүмкіндігі болған.", "B": "басшы сүт құюды бұйырған, су құюды емес.", "D": "олар шатастырған жоқ, әдейі су құйған. Түн ай жарықты болған."}, "distractor_evidence": {"A": [], "B": ["Сол қазанға ауыл тұрғындарына бір түнде бір кеседен сүт құюды әмір етіпті."], "D": ["Сол түнде-ақ ай жарығымен қазанды толтырып тастайды."]}, "keywords": {"ok": {"kk": ["менің бір кесе құйған суым әсер ете қоймас"], "ru": []}, "B": {"kk": ["бір кеседен сүт құюды әмір етіпті"], "ru": []}, "D": {"kk": ["ай жарығымен"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q19", "number": 19, "text_id": "l1v3-t8", "stem": "Автор қандай ой түйеді?", "options": {"A": "Ел өзгеруі үшін әркім алдымен өзін өзгертуі керек.", "B": "Ашаршылық кезінде ауыл басшысы ақылды болуы керек.", "C": "Көпшілікке арқа сүйеген адам ешқашан ұтылмайды.", "D": "Ауыл тұрғындары бір-біріне сенбей өмір сүруі керек."}, "key": "A", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Қоғамды түзеу біреуді жөнге салудан емес, әркім өзін түзеуден басталса керек.", "Демек, әркім міндетін толыққанды атқарса, қоғам түзелмек."], "explanation": "Автор қоғамдағы келеңсіздіктер әр адамның жауапкершілікті сезінбеуінен туатынын айтып, қоғамды түзеу әркімнің өзін түзеуінен басталады деп түйіндейді.", "distractor_notes": {"B": "басшы туралы мәтіннің басында ғана айтылады. Автордың түйіні – әр адамның жауапкершілігі туралы.", "C": "мәтін керісінше үйретеді: көпшілікке арқа сүйегендер қазанды суға толтырды.", "D": "автор сенбеуге шақырмайды, әркімді өз міндетін адал атқаруға шақырады."}, "distractor_evidence": {"B": [], "C": ["Осылайша, барлығы да көпшілікке арқа сүйеп, бір кесе суда тұрған ештеңе жоқ деп немқұрайлық танытқан еді."], "D": []}, "keywords": {"ok": {"kk": ["әркім өзін түзеуден басталса керек", "әркім міндетін толыққанды атқарса"], "ru": []}, "C": {"kk": ["көпшілікке арқа сүйеп"], "ru": []}}, "editor_changes": "«тай қазанға» → «тайқазанға»; тыныс белгілері түзетілді (артық үтірлер алынды, қажет жерге үтір қойылды); соңғы азатжол бөлек абзац етілді."}, {"id": "l1v3-q20", "number": 20, "text_id": "l1v3-t9", "stem": "Зерттеу бойынша жасөспірімдердің ұйқысының қысқаруына не әсер етті?", "options": {"A": "кешке ауыр сабақтарды ұзақ оқу", "B": "күндізгі спорт жаттығуларынан шаршау", "C": "таңертең ерте оянатын әдеттері", "D": "түнде телефонға ұзақ үңілу"}, "key": "D", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["АҚШ ғалымдары жүргізген жаңа зерттеу түнгі уақытта смартфонды небәрі жарты сағат артық пайдалану ұйқы ұзақтығын шамамен 13 минутқа қысқартатынын көрсетті."], "explanation": "Зерттеу түнде смартфонды жарты сағат артық пайдалану ұйқыны шамамен 13 минутқа қысқартатынын көрсеткен.", "distractor_notes": {"A": "мәтінде сабақ оқу туралы айтылмайды.", "B": "мәтінде спорт жаттығулары туралы айтылмайды.", "C": "жасөспірімдер ерте емес, керісінше 11 минут кеш оянған. Ұйқының қысқаруына басқа нәрсе әсер еткен."}, "distractor_evidence": {"A": [], "B": [], "C": ["Зерттеу нәтижесінде кешкі сағат 22:00-ден кейін телефонды әдеттегіден 30 минут артық пайдаланған жасөспірімдердің шамамен 26 минут кеш ұйықтап, 11 минут кеш оянатыны анықталды."]}, "keywords": {"ok": {"kk": ["смартфонды небәрі жарты сағат артық пайдалану", "13 минутқа қысқартатынын"], "ru": []}, "C": {"kk": ["11 минут кеш оянатыны"], "ru": []}}, "editor_changes": ""}]}, {"bank_id": "kaz-L2-nis-sample-v1", "track": "second_language", "source": "НЗМ 7-сыныпқа конкурстық іріктеудің тест үлгілері, «Қазақ тілі (екінші тіл)» (құжаттағы 21–40 тапсырмалар, платформада 1–20)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {"Олар кәдімгі қоңыраулы сағатқа тікұшақтікіндей қанаттар орнатыпты.": "Они приделали к обычному будильнику крылья, как у вертолёта.", "Қоңырау шырылдағанда, қанаттары айналып, сағатты төбеге көтеріп әкетеді.": "Когда звенит звонок, крылья вращаются и поднимают часы к потолку.", "Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады.": "Часы, работающие на двух обычных маленьких батарейках, могут звенеть под потолком три минуты.", "Таңертең белгіленген уақытта ұйқыдан оятатын сағат әр үйде бар.": "Будильник, который будит утром в назначенное время, есть в каждом доме.", "Балалар нені оқиды, қандай кітапқа қызығады, ата-ана қандай дүние іздейді – осының бәрін анықтаймыз.": "Что читают дети, какими книгами интересуются, что ищут родители — всё это мы выясняем.", "Олар панорама түрінде ашылып, кітаптың тақырыбына сай баланы қызықтырады.": "Они раскрываются в виде панорамы и увлекают ребёнка в соответствии с темой книги.", "Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті.": "История о собаке японца, который гордился своим псом, помогавшим пострадавшим от наводнения и спасавшим людей от беды, разошлась по всей стране.", "Арада бірнеше ай өткен соң, иттің иесі теледидардан тасқын кезінде құтқарылған адамдар мен жан-жануарларға көмек көрсеткен иттерді марапаттау рәсімін көреді.": "Через несколько месяцев хозяин увидел по телевизору церемонию награждения собак, которые помогали людям и животным, спасённым во время наводнения.", "Сол жаңалықтан соң үйден кетіп қалған итін иесі таба алмай қалады.": "После этих новостей собака ушла из дома, и хозяин не может её найти.", "Ең қызығы сол – арада үш жыл өткенде, жоғалып кеткен ит өз үйіне оралған.": "Самое интересное, что через три года пропавшая собака вернулась домой.", "Мемлекеттік орындарға хабарласып, итін іздейді.": "Он обращается в государственные органы и ищет свою собаку.", "Музыка дегеніміз – сырлы да сиқырлы дыбыс.": "Музыка — это таинственный и волшебный звук.", "Сазгер, музыка зерттеушісі Ахмет Жұбанов: «Қазақ күйлерінде шөптің сыбдыры, кең далада келе жатқан жалғыз жолаушының әні, аспанда қалықтап жүрген бүркіт қанатының суылы бар…» – деп ерекше тебірене жазыпты.": "Композитор и исследователь музыки Ахмет Жубанов с особым волнением писал: «В казахских кюях — шелест травы, песня одинокого путника в широкой степи, шум крыльев беркута, парящего в небе…»", "Жақсы ән мен сазды музыка – жан азығы.": "Хорошая песня и мелодичная музыка — пища для души.", "Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған.": "Учёные установили, что музыка влияет на мозг человека.", "Әсем ән, сазды музыканың ықпалынан қанайналым жүйесі, зат алмасу процесі жақсарады.": "Под влиянием красивой песни и мелодичной музыки улучшаются кровообращение и обмен веществ.", "Ертеде әуеннің көмегімен күйзелісті, қайғы-қасіретті емдеген.": "В древности с помощью мелодии лечили стресс и горе.", "Табиғаттағы жаңбыр, дауыл, жел үні, су сылдыры, құстар әні, аңдардың дауысы, қимылына еліктеуден әуен құралады.": "Мелодия складывается из подражания звукам природы: дождю, буре, ветру, журчанию воды, пению птиц, голосам и движениям зверей.", "Музыка көңілді көтереді, қайғыны жеңілдетеді, бойды сергітеді, жанға жайлы эмоция сыйлайды.": "Музыка поднимает настроение, облегчает горе, бодрит и дарит приятные эмоции.", "Сонымен қатар музыкамен айналысқан адам шет тілдерін жақсы меңгереді екен.": "Кроме того, человек, занимающийся музыкой, оказывается, хорошо осваивает иностранные языки.", "Шығыстың ұлы емшісі Авиценна музыканың адамды емдейтін емдік қасиеті бар екенін айтқан.": "Великий целитель Востока Авиценна говорил, что музыка обладает целебной силой и лечит человека.", "Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі.": "Когда человек играет на музыкальном инструменте, раскрываются его способности.", "Ал дыбыс дегеніміз – табиғат.": "А звук — это природа.", "– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты.": "— Детство маленького Асанали было трудным, ведь тогда шла война.", "– Анам еңбекқор, мейірімді, қарапайым адам болды.": "— Моя мама была трудолюбивым, добрым, простым человеком.", "– Балалық шағыңызда қандай ойындар ойнадыңыз?": "— В какие игры вы играли в детстве?", "– Балаларға қандай кеңес берер едіңіз?": "— Какой совет вы дали бы детям?", "Ауылдың барлық ер-азаматы соғысқа кетті, жұмыс істей алатын қарттардың, аналардың, балалардың барлығы жұмыс істеді.": "Все мужчины аула ушли на войну, работали все, кто мог: старики, матери, дети.", "Балалар жұмыс істеп жүріп те ойнай алдық.": "Мы, дети, умудрялись играть, даже работая.", "– Соғыс жүріп жатқандықтан, бізде ойыншық деген болған жоқ.": "— Шла война, поэтому игрушек у нас не было.", "Оқысаң, білімді болсаң, елге де көмегің тиеді.": "Если будешь учиться и станешь образованным, ты принесёшь пользу и своей стране.", "Балаларға айтарым: оқы, оқы және тағы оқы...": "Детям скажу: учись, учись и ещё раз учись...", "– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды.": "— Ребёнок, который хочет стать достойным человеком, слушает родителей, хорошо учится и с детства думает о своём будущем.", "Бала Асанәлі егінде жұмыс істеді.": "Маленький Асанали работал в поле.", "– Өміріңізде анаңыздың рөлі қандай?": "— Какова роль мамы в вашей жизни?", "Ол қарсыласына ауыр сөздер айтып, ызаландырады.": "Он говорит сопернику оскорбительные слова и доводит до ярости.", "Алайда самурай оған қалт етпейді.": "Однако самурай даже не шелохнулся.", "Ызаланған жауынгер есікті теуіп, кетіп қалады.": "Разъярённый воин пинает дверь и уходит.", "– Өзінің иесінде, – деп жауап береді шәкірттері.": "— У своего хозяина, — отвечают ученики.", "Оларды қабылдамасаң, барлығы өз иесінде қалады, – дейді самурай.": "Если их не принимать, всё это останется у своего хозяина, — говорит самурай.", "Дана самурай: – Сізге біреу сыйлық алып келіп, сіз қабылдамасаңыз, ол кімнің қолында қалады?": "Мудрый самурай: — Если кто-то принесёт вам подарок, а вы его не примете, у кого он останется?", "Шынында да, біреудің ашулы сөзін көңілге алмасаңыз, жүйкеңіз тозбайды.": "И правда, если не принимать близко к сердцу чьи-то злые слова, нервы не будут расшатаны.", "денсаулығыңыз да қалыпты болады": "здоровье тоже будет в порядке", "Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды.": "Потом намылил лицо и руки и долго с удовольствием умывался, пока не кончилась вода.", "– Ей, Сүлгі! – деді Қолжуғыш шыдай алмай.": "— Эй, Полотенце! — не выдержал Умывальник.", "Сабын да қарап тұра алмады.": "Мыло тоже не смогло стоять в стороне.", "Үшеуінің айтысы кешке дейін созылды.": "Спор троих длился до самого вечера.", "Адам қолжуғышқа су құйды.": "Человек налил воды в умывальник.", "Сүлгіге жақсылап сүртінді де, ішке кіріп кетті.": "Хорошенько вытерся полотенцем и ушёл в дом.", "Қарлығашты зерттеуші ғалымдар оның әуеде аузын ашып ұша алатынын анықтаған.": "Учёные, изучающие ласточек, установили, что она может летать с открытым клювом.", "Қатты жылдамдықпен самғап келе жатқан қарлығаштың аузына ауада ұшып жүрген шыбын-шіркейлер өздері кеп түсетін көрінеді, яғни бұл – қарлығаштың «аңшылығы».": "Оказывается, когда ласточка летит на большой скорости, мошки, летающие в воздухе, сами залетают ей в клюв — это и есть «охота» ласточки.", "Әрі-бері самғап, аузын толтырған соң, ол тапқан тамағын балапандарына әкеліп береді.": "Налетавшись туда-сюда и наполнив клюв, она приносит найденную пищу птенцам.", "Сондай-ақ қаншама зиянды шыбын-шіркейді жойып, адамға да көмегін тигізеді.": "Кроме того, уничтожая множество вредных насекомых, она помогает и человеку.", "Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды.": "Если ласточка свьёт гнездо у дома, это считают доброй приметой.", "Оның сырты ескіреді, бірақ ішіндегі ақыл ескірмейді, – депті сонда Қожанасыр.": "Обложка у неё стареет, но мудрость внутри не стареет, — сказал тогда Ходжа Насреддин.", "– Е, достым, не істеп жатырсың?": "— Эй, друг мой, что ты делаешь?", "– Қой, достым, киім ескіреді, бірақ кітап ескірмейді.": "— Не надо, друг мой: одежда стареет, а книга — нет."}, "style_notes": [], "texts": [{"id": "l2v1-t1", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Таңертең белгіленген уақытта ұйқыдан оятатын сағат әр үйде бар. Сағат шырылдаған кезде ұйқысын қимай, өшіре салып, әрі қарай ұйықтай беретін жалқаулар ортамызда аз емес. Осындайлар үшін жас инженерлер ұшатын қоңыраулы сағат ойлап тауыпты. Олар кәдімгі қоңыраулы сағатқа тікұшақтікіндей қанаттар орнатыпты. Қоңырау шырылдағанда, қанаттары айналып, сағатты төбеге көтеріп әкетеді. Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады. Осыдан кейін жалқаулар орнынан тұрмай көрсін?!"]}, {"id": "l2v1-t2", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Кітап оқып, кітаппен дос болып өскен баланың қиялы ұшқыр, кез келген іске алғыр болады. Балаларға арнап шығарма жазу үлкендерге арнап жазғаннан гөрі қиын.", "«Кітап кішкентай баланың қолға ұстап көруіне қызық болуы керек. Көркем безендірілген, бояуы қанық кітаптар баланы көбірек қызықтырады. Балаларға арналған кітапты шығарар алдында маркетингтік зерттеу жүргіземіз. Балалар нені оқиды, қандай кітапқа қызығады, ата-ана қандай дүние іздейді – осының бәрін анықтаймыз.", "Қазіргі кітаптар мәтінмен және суретпен шектелмейді. Олар панорама түрінде ашылып, кітаптың тақырыбына сай баланы қызықтырады. Мысалы, «Теңіз қарақшылары» кітабында кеменің суреті, ханшайым туралы кітапта үлкен сарай бар. Осындай 3D форматтағы кітаптар көбейіп, заман талабына сай түрленіп отырады», – дейді баспа үйінің редакторы."]}, {"id": "l2v1-t3", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Жапонияда орын алған мына оқиға жұртты қайран қалдырған. Бимо атты ит иесімен бірге теледидар көреді. Кезекті жаңалықтардан ит су тасқынына душар болған адамдарды көреді. Сол жаңалықтан соң үйден кетіп қалған итін иесі таба алмай қалады.", "Арада бірнеше ай өткен соң, иттің иесі теледидардан тасқын кезінде құтқарылған адамдар мен жан-жануарларға көмек көрсеткен иттерді марапаттау рәсімін көреді. Олардың арасынан өз итін таниды. Мемлекеттік орындарға хабарласып, итін іздейді. Алайда иесі оны сол күйі таппайды.", "Ең қызығы сол – арада үш жыл өткенде, жоғалып кеткен ит өз үйіне оралған. Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті."]}, {"id": "l2v1-t4", "title": "", "source_note": "", "numbered_paragraphs": true, "paragraphs": ["Сазгер, музыка зерттеушісі Ахмет Жұбанов: «Қазақ күйлерінде шөптің сыбдыры, кең далада келе жатқан жалғыз жолаушының әні, аспанда қалықтап жүрген бүркіт қанатының суылы бар…» – деп ерекше тебірене жазыпты.", "Музыка дегеніміз – сырлы да сиқырлы дыбыс. Ал дыбыс дегеніміз – табиғат. Табиғатсыз тіршілік жоқ болса, дыбыссыз музыка жоқ. Әуен көптеген сансыз дыбыстан құралады. Табиғаттағы жаңбыр, дауыл, жел үні, су сылдыры, құстар әні, аңдардың дауысы, қимылына еліктеуден әуен құралады.", "Жақсы ән мен сазды музыка – жан азығы. Әсем ән, сазды музыканың ықпалынан қанайналым жүйесі, зат алмасу процесі жақсарады. Музыка көңілді көтереді, қайғыны жеңілдетеді, бойды сергітеді, жанға жайлы эмоция сыйлайды.", "Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған. Музыка ми зейіндерін жақсартады екен. Шығыстың ұлы емшісі Авиценна музыканың адамды емдейтін емдік қасиеті бар екенін айтқан. Ертеде әуеннің көмегімен күйзелісті, қайғы-қасіретті емдеген.", "Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі. Сонымен қатар музыкамен айналысқан адам шет тілдерін жақсы меңгереді екен."]}, {"id": "l2v1-t5", "title": "Асанәлі Әшімов – театр және кино өнеріндегі ерекше талант иесі", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["1. – Асанәлі аға, сіз атақты адамсыз. Бүкіл жұрт сізді біледі, бірақ ешкім біле бермейтін бала Асанәлі туралы айтсаңыз...", "– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты. Ауылдың барлық ер-азаматы соғысқа кетті, жұмыс істей алатын қарттардың, аналардың, балалардың барлығы жұмыс істеді. Бала Асанәлі егінде жұмыс істеді. Аяқкиімі болмағандықтан, кейде мектепке жалаңаяқ баратын... Бірақ қанша ауырлық көрсе де, өмір оны қайсар, жігерлі қылып өсірді...", "2. – Өміріңізде анаңыздың рөлі қандай?", "– Анам еңбекқор, мейірімді, қарапайым адам болды. Колхоз жұмысын істеді. Әкем соғыстан келмеді. Мені жалғыз өзі өсірді. Үнемі еңбек ету керек, білім алу қажет деп айтты. Мен қалаған оқуыма түсе алмадым, сол себепті театр және кино әртістерін даярлайтын бөлімге оқуға түстім.", "3. – Балалық шағыңызда қандай ойындар ойнадыңыз?", "– Соғыс жүріп жатқандықтан, бізде ойыншық деген болған жоқ. Балалар жұмыс істеп жүріп те ойнай алдық. Сол кезде «Қызыл май» ойынын ойнадық, ол – қазіргі хоккей. Сиырдың жүнінен доп жасап, доп ойнадық.", "4. – Балаларға қандай кеңес берер едіңіз?", "– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды. Балаларға айтарым: оқы, оқы және тағы оқы... Оқысаң, білімді болсаң, елге де көмегің тиеді."]}, {"id": "l2v1-t6", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Қарт самурай өз шәкірттерін білімді, ақылды етіп тәрбиелейді. Бір күні сабаққа өзінің тәртіпсіздігімен, қатыгездігімен елге аты жайылған жауынгер келеді. Оның өзіндік әскери тактикасы болатын. Ол қарсыласына ауыр сөздер айтып, ызаландырады. Ызаланған қарсыласы жекпе-жекке шығып, қателіктер жіберіп, жеңілетін.", "Бұл жолы да жауынгер қарт самурайды ызаландыру үшін ауыр, балағат сөздерін жаудырады. Алайда самурай оған қалт етпейді. Әлгі жігіт үш рет қайталап көреді. Самурай сабағын жалғастыра береді. Ызаланған жауынгер есікті теуіп, кетіп қалады.", "Мұны бақылаған шәкірттері самурайдан: «Ұстаз, неге оның мұндай тәртіпсіздігіне жауап бермедіңіз? Оны жекпе-жекке шақыру керек еді!» – деп ызаланады.", "Дана самурай: – Сізге біреу сыйлық алып келіп, сіз қабылдамасаңыз, ол **кімнің** қолында қалады? – деп сұрайды.", "– Өзінің иесінде, – деп жауап береді шәкірттері.", "– Бұл қызғаныш, ашу, кемсіту мен мысқылға да қатысты. Оларды қабылдамасаң, барлығы өз иесінде қалады, – дейді самурай.", "Шынында да, біреудің ашулы сөзін көңілге алмасаңыз, жүйкеңіз тозбайды. ___(15)___ денсаулығыңыз да қалыпты болады. Бұл әңгіме адамды кешірімді болуға шақырады."]}, {"id": "l2v1-t7", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Адам қолжуғышқа су құйды. Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды. Сүлгіге жақсылап сүртінді де, ішке кіріп кетті.", "– Көрдіңдер ме, адамдарға менен зор қызмет ететіндерің жоқ десе, жеңістік бермейсіңдер. Әне, беті-қолын сүртіп едім, тап-таза болып шыға келді, – деді Сүлгі кеудесін соғып.", "– Ей, Сүлгі! – деді Қолжуғыш шыдай алмай. Ашуланғаны соншалық – қақпағы жерге түсіп кете жаздады. – Сен несіне кеудеңді көкке керіп тұрсың? Адам жуыну үшін бірінші кімге келеді? Маған. Келгенімен тұрмай, иіліп сәлем береді. Ал мен оны жақсылап жуындырып жіберемін.", "Сабын да қарап тұра алмады. Мұның да ашуланғаны сондай – тұла бойы көпіршік атты. – Менсіз адамның күні бар ма?! Жоқ! Қандай кірің болса да, жойып жіберемін. Сондықтан адамға менен қымбат ештеңе жоқ.", "Үшеуінің айтысы кешке дейін созылды. Бірінен-бірі қалғысы, жеңілгісі келмеді.", "Алайда бұлардың қасына кешке дейін ешкім жолаған жоқ. Өйткені ___(17)___."]}, {"id": "l2v1-t8", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Қарлығашты зерттеуші ғалымдар оның әуеде аузын ашып ұша алатынын анықтаған. Ол бекер емес екен. Қатты жылдамдықпен самғап келе жатқан қарлығаштың аузына ауада ұшып жүрген шыбын-шіркейлер өздері кеп түсетін көрінеді, яғни бұл – қарлығаштың «аңшылығы». Әрі-бері самғап, аузын толтырған соң, ол тапқан тамағын балапандарына әкеліп береді. Сөйтіп күні бойы ұшып жүріп аңшылық жасайтын қарлығаш өзін де, балапандарын да тойдыратын көрінеді.", "Сондай-ақ қаншама зиянды шыбын-шіркейді жойып, адамға да көмегін тигізеді. Халқымыз қарлығашты киелі құс санайды. Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды."]}, {"id": "l2v1-t9", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Бір күні Қожанасыр досынікіне келсе, ол үйін тазалап жатыр екен. Қожа одан:", "– Е, достым, не істеп жатырсың? – деп сұрайды.", "– Ә, Қожа екенсің ғой! Ескі киім, қағаз, кітап – бәрін өртейін деп жатырмын, – дейді досы.", "– Қой, достым, киім ескіреді, бірақ кітап ескірмейді. Оның сырты ескіреді, бірақ ішіндегі ақыл ескірмейді, – депті сонда Қожанасыр."]}], "items": [{"id": "l2v1-q21", "number": 1, "text_id": "l2v1-t1", "stem": "Мәтіндегі сағаттың ерекшелігі неде?", "options": {"A": "әндетуінде", "B": "батареядан қуат алуында", "C": "кез келген үйде болуында", "D": "қалықтауында"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Олар кәдімгі қоңыраулы сағатқа тікұшақтікіндей қанаттар орнатыпты.", "Қоңырау шырылдағанда, қанаттары айналып, сағатты төбеге көтеріп әкетеді."], "explanation": "Сағатқа тікұшақтікіндей қанаттар орнатылған: қоңырау шырылдағанда ол төбеге ұшып көтеріледі. «Қалықтау» – ауада ұшып, бір орында тұру деген сөз.", "explanation_ru": "К часам приделали крылья, как у вертолёта: когда звенит звонок, они взлетают к потолку. «Қалықтау» значит «парить, держаться в воздухе».", "distractor_notes": {"A": "мәтінде сағаттың ән айтатыны туралы айтылмайды, ол тек шырылдайды.", "B": "батареядан кез келген сағат жұмыс істейді. Мәтінде батарея «кәдімгі» деп аталады, яғни бұл ерекшелік емес.", "C": "«әр үйде бар» деп кәдімгі оятқыш сағат туралы айтылады, ал ұшатын сағат – жаңа өнертабыс."}, "distractor_notes_ru": {"A": "В тексте не сказано, что часы поют — они только звенят.", "B": "От батареек работают любые часы. В тексте батарейки названы «обычными», значит, это не особенность.", "C": "«Есть в каждом доме» сказано об обычном будильнике, а летающие часы — новое изобретение."}, "distractor_evidence": {"A": ["Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады."], "B": ["Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады."], "C": ["Таңертең белгіленген уақытта ұйқыдан оятатын сағат әр үйде бар."]}, "keywords": {"ok": {"kk": ["тікұшақтікіндей қанаттар", "төбеге көтеріп әкетеді"], "ru": ["как у вертолёта", "поднимают часы к потолку"]}, "A": {"kk": ["шырылдап"], "ru": ["звенеть"]}, "B": {"kk": ["Кәдімгі екі кішкентай батареямен"], "ru": ["двух обычных маленьких батарейках"]}, "C": {"kk": ["әр үйде бар"], "ru": ["в каждом доме"]}}, "editor_changes": ""}, {"id": "l2v1-q22", "number": 2, "text_id": "l2v1-t2", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Балалар кітабын жазу кезінде балалар мен ересектердің қалауы ескеріледі.\n2. Балаларды қызықтыру мақсатында кітаптар түрлі дизайнда шығарылады.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Балалар нені оқиды, қандай кітапқа қызығады, ата-ана қандай дүние іздейді – осының бәрін анықтаймыз.", "Олар панорама түрінде ашылып, кітаптың тақырыбына сай баланы қызықтырады."], "explanation": "Екі тұжырым да мәтінде бар. Баспа кітап шығарар алдында балалардың да, ата-аналардың да қалауын зерттейді (1). Кітаптар панорама, 3D сияқты түрлі дизайнмен шығады (2).", "explanation_ru": "Оба утверждения есть в тексте. Перед выпуском книги издательство изучает желания и детей, и родителей (1). Книги выходят в разном оформлении — панорамы, 3D (2).", "distractor_notes": {"A": "екінші тұжырымды да мәтінмен салыстырып көр: кітаптардың безендірілуі туралы мәтіннің соңғы бөлігін қайта оқы.", "B": "бірінші тұжырымды да мәтінмен салыстырып көр: баспа кітап шығарар алдында нені зерттейтінін қайта оқы.", "D": "тұжырымдардың кем дегенде біреуі мәтінде бар. Әрқайсысын мәтінмен жеке-жеке салыстыр."}, "distractor_notes_ru": {"A": "Сравни с текстом и второе утверждение: перечитай последнюю часть текста — об оформлении книг.", "B": "Сравни с текстом и первое утверждение: перечитай, что изучает издательство перед выпуском книги.", "D": "Хотя бы одно из утверждений есть в тексте. Сравни каждое с текстом отдельно."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["Балалар нені оқиды", "ата-ана қандай дүние іздейді", "панорама түрінде"], "ru": ["что читают дети", "что ищут родители", "в виде панорамы"]}}, "editor_changes": ""}, {"id": "l2v1-q23", "number": 3, "text_id": "l2v1-t3", "stem": "Мәтін не туралы?\n... ит туралы", "options": {"A": "жоғалған", "B": "күзетші", "C": "қабаған", "D": "қайырымды"}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті.", "Арада бірнеше ай өткен соң, иттің иесі теледидардан тасқын кезінде құтқарылған адамдар мен жан-жануарларға көмек көрсеткен иттерді марапаттау рәсімін көреді."], "explanation": "Мәтіннің басты оқиғасы – Бимоның тасқын кезінде адамдарға көмектесіп, оларды құтқаруы. Ол үшін ит марапатталды. Демек, мәтін қайырымды ит туралы.", "explanation_ru": "Главное в тексте — Бимо во время наводнения помогал людям и спасал их, за это его наградили. Значит, текст о доброй собаке.", "distractor_notes": {"A": "ит шынымен жоғалып кетті, бірақ бұл – мәтіннің бір бөлігі ғана. Мәтіннің басты оқиғасы неде екенін ойлан.", "B": "мәтінде Бимоның үй күзеткені туралы айтылмайды.", "C": "мәтінде иттің ашулы, қабаған екені туралы айтылмайды."}, "distractor_notes_ru": {"A": "Собака действительно пропала, но это лишь часть текста. Подумай, какое событие в тексте главное.", "B": "В тексте не сказано, что Бимо охранял дом.", "C": "В тексте не сказано, что собака была злой и кусачей."}, "distractor_evidence": {"A": ["Сол жаңалықтан соң үйден кетіп қалған итін иесі таба алмай қалады."], "B": [], "C": []}, "keywords": {"ok": {"kk": ["зардап шеккендерге көмектесіп", "адамдарды апаттан арашалап", "көмек көрсеткен иттерді марапаттау"], "ru": ["помогавшим пострадавшим", "спасавшим людей", "награждения собак"]}, "A": {"kk": ["таба алмай қалады"], "ru": ["не может её найти"]}}, "editor_changes": ""}, {"id": "l2v1-q24", "number": 4, "text_id": "l2v1-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Арнайы ұйым ит туралы ақпаратты жасырды.", "B": "Бимо өзінің иесіне деген адалдығын көрсетті.", "C": "Бимо жаңалықтарға шығу үшін қауіпті жерге барды.", "D": "Жапондар Бимоның ерлігі туралы ертегі шығарды."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ең қызығы сол – арада үш жыл өткенде, жоғалып кеткен ит өз үйіне оралған."], "explanation": "Бимо үш жылдан кейін өз үйіне, иесіне қайтып оралды. Бұл – иесіне деген адалдығының белгісі.", "explanation_ru": "Через три года Бимо вернулся домой, к хозяину. Это знак его верности хозяину.", "distractor_notes": {"A": "мәтінде ешкімнің ақпаратты жасырғаны айтылмайды. Иесі хабарласқанымен, итті таба алмаған.", "C": "Бимо жаңалыққа шығу үшін емес, тасқыннан зардап шеккендерге көмектесу үшін барды.", "D": "мәтінде ертегі емес, «хикая», яғни болған оқиға туралы әңгіме ел ішіне тарағаны айтылады."}, "distractor_notes_ru": {"A": "В тексте не сказано, что кто-то скрывал информацию. Хозяин обращался в органы, но не смог найти собаку.", "C": "Бимо пошёл не ради того, чтобы попасть в новости, а чтобы помогать пострадавшим от наводнения.", "D": "В тексте говорится не о сказке, а о «хикая» — рассказе о реальном случае, который разошёлся по стране."}, "distractor_evidence": {"A": ["Мемлекеттік орындарға хабарласып, итін іздейді."], "C": ["Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті."], "D": ["Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті."]}, "keywords": {"ok": {"kk": ["үш жыл өткенде", "өз үйіне оралған"], "ru": ["через три года", "вернулась домой"]}, "A": {"kk": ["хабарласып, итін іздейді"], "ru": ["обращается в государственные органы"]}, "C": {"kk": ["зардап шеккендерге көмектесіп"], "ru": ["помогавшим пострадавшим"]}, "D": {"kk": ["хикая ел ішіне жайылып кетті"], "ru": ["разошлась по всей стране"]}}, "editor_changes": ""}, {"id": "l2v1-q25", "number": 5, "text_id": "l2v1-t4", "stem": "Қай абзацта музыкаға түсініктеме беріледі?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "B", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Музыка дегеніміз – сырлы да сиқырлы дыбыс. (2-азатжол)"], "explanation": "«Музыка дегеніміз – …» деген сөйлем – музыкаға берілген түсініктеме, яғни анықтама. Ол 2-азатжолда тұр.", "explanation_ru": "Предложение «Музыка — это…» — объяснение, то есть определение музыки. Оно во 2-м абзаце.", "distractor_notes": {"A": "1-азатжолда Ахмет Жұбановтың қазақ күйлері туралы сөзі келтірілген, музыкаға анықтама берілмейді.", "C": "3-азатжолда музыканың адамға пайдасы айтылады, анықтама берілмейді.", "D": "4-азатжолда ғалымдардың музыканың миға әсері туралы зерттеуі айтылады."}, "distractor_notes_ru": {"A": "В 1-м абзаце приведены слова Ахмета Жубанова о казахских кюях, определения музыки нет.", "C": "В 3-м абзаце говорится о пользе музыки для человека, а не о том, что такое музыка.", "D": "В 4-м абзаце рассказывается об исследованиях учёных о влиянии музыки на мозг."}, "distractor_evidence": {"A": ["Сазгер, музыка зерттеушісі Ахмет Жұбанов: «Қазақ күйлерінде шөптің сыбдыры, кең далада келе жатқан жалғыз жолаушының әні, аспанда қалықтап жүрген бүркіт қанатының суылы бар…» – деп ерекше тебірене жазыпты."], "C": ["Жақсы ән мен сазды музыка – жан азығы."], "D": ["Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған."]}, "keywords": {"ok": {"kk": ["Музыка дегеніміз"], "ru": ["Музыка — это"]}, "A": {"kk": ["Қазақ күйлерінде"], "ru": ["казахских кюях"]}, "C": {"kk": ["жан азығы"], "ru": ["пища для души"]}, "D": {"kk": ["ми жүйесіне әсер ететінін"], "ru": ["влияет на мозг"]}}, "editor_changes": ""}, {"id": "l2v1-q26", "number": 6, "text_id": "l2v1-t4", "stem": "Қай ақпарат мәтін мазмұнына сай келеді?", "options": {"A": "Жанды әуен адамның денсаулығына әсер ете алады.", "B": "Музыка адамдардың көңіл көтеруіне ғана арналған.", "C": "Табиғаттағы сан алуан дыбыс жанға жайлылық береді.", "D": "Тілшілер музыкалық аспаптарда өте шебер ойнаған."}, "key": "A", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Әсем ән, сазды музыканың ықпалынан қанайналым жүйесі, зат алмасу процесі жақсарады. (3-азатжол)", "Ертеде әуеннің көмегімен күйзелісті, қайғы-қасіретті емдеген. (4-азатжол)"], "explanation": "Мәтінде музыканың қанайналым мен зат алмасуды жақсартатыны, ертеде күйзелісті емдегені айтылады. Демек, әуен денсаулыққа әсер ете алады.", "explanation_ru": "В тексте сказано, что музыка улучшает кровообращение и обмен веществ, а в древности ею лечили стресс. Значит, мелодия может влиять на здоровье.", "distractor_notes": {"B": "«ғана» деген сөзге назар аудар. Мәтінде музыканың көңіл көтеруден басқа да пайдасы айтылады.", "C": "мәтінде табиғат дыбыстарынан әуен құралатыны айтылады. Ал жанға жайлы эмоцияны табиғат емес, музыка сыйлайды.", "D": "мәтінде тілшілер (журналистер) туралы айтылмайды. Музыкамен айналысқан адам шет тілдерін жақсы меңгереді делінген."}, "distractor_notes_ru": {"B": "Обрати внимание на слово «только». В тексте говорится и о другой пользе музыки, кроме поднятия настроения.", "C": "В тексте сказано, что мелодия складывается из звуков природы. А приятные эмоции дарит не природа, а музыка.", "D": "В тексте ничего не сказано о журналистах («тілші»). Сказано, что человек, занимающийся музыкой, хорошо осваивает иностранные языки."}, "distractor_evidence": {"B": ["Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған."], "C": ["Табиғаттағы жаңбыр, дауыл, жел үні, су сылдыры, құстар әні, аңдардың дауысы, қимылына еліктеуден әуен құралады.", "Музыка көңілді көтереді, қайғыны жеңілдетеді, бойды сергітеді, жанға жайлы эмоция сыйлайды."], "D": ["Сонымен қатар музыкамен айналысқан адам шет тілдерін жақсы меңгереді екен."]}, "keywords": {"ok": {"kk": ["қанайналым жүйесі", "зат алмасу процесі жақсарады", "емдеген"], "ru": ["кровообращение", "обмен веществ", "лечили"]}, "B": {"kk": ["ми жүйесіне әсер ететінін"], "ru": ["влияет на мозг"]}, "C": {"kk": ["еліктеуден әуен құралады", "Музыка көңілді", "жанға жайлы эмоция"], "ru": ["Мелодия складывается", "Музыка поднимает", "приятные эмоции"]}, "D": {"kk": ["шет тілдерін жақсы меңгереді"], "ru": ["хорошо осваивает иностранные языки"]}}, "editor_changes": ""}, {"id": "l2v1-q27", "number": 7, "text_id": "l2v1-t4", "stem": "Мәтінге қандай тақырып сәйкес келеді?", "options": {"A": "Ғажайып табиғат", "B": "Зерттеу алаңы", "C": "Музыка құдіреті", "D": "Халық аспаптары"}, "key": "C", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Жақсы ән мен сазды музыка – жан азығы. (3-азатжол)", "Шығыстың ұлы емшісі Авиценна музыканың адамды емдейтін емдік қасиеті бар екенін айтқан. (4-азатжол)", "Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі. (5-азатжол)"], "explanation": "Мәтіннің азатжолдарының бәрі музыканың адамға күшті әсері туралы: жанға азық береді, денсаулықты жақсартады, емдейді, қабілетті ашады. «Құдірет» – ерекше күш деген сөз.", "explanation_ru": "Все абзацы текста — о сильном влиянии музыки на человека: она питает душу, улучшает здоровье, лечит, раскрывает способности. «Құдірет» значит «могущество, особая сила».", "distractor_notes": {"A": "табиғат тек 2-азатжолда, музыканың қайдан шығатынын түсіндіру үшін айтылады.", "B": "зерттеу тек 4-азатжолда аталады, мәтін тұтасымен зерттеу туралы емес.", "D": "мәтінде халық аспаптары туралы айтылмайды. Аспап тек 5-азатжолда, жалпы түрде аталады."}, "distractor_notes_ru": {"A": "Природа упоминается только во 2-м абзаце — чтобы объяснить, откуда берётся музыка.", "B": "Об исследованиях говорится только в 4-м абзаце, текст в целом не об исследованиях.", "D": "О народных инструментах в тексте не говорится. Инструмент упомянут только в 5-м абзаце, в общем виде."}, "distractor_evidence": {"A": ["Ал дыбыс дегеніміз – табиғат."], "B": ["Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған."], "D": ["Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі."]}, "keywords": {"ok": {"kk": ["жан азығы", "емдік қасиеті", "қабілеттері ашыла түседі"], "ru": ["пища для души", "целебной силой", "раскрываются его способности"]}, "A": {"kk": ["табиғат"], "ru": ["природа"]}, "B": {"kk": ["Ғалымдар"], "ru": ["Учёные"]}, "D": {"kk": ["Музыкалық аспапта"], "ru": ["музыкальном инструменте"]}}, "editor_changes": ""}, {"id": "l2v1-q28", "number": 8, "text_id": "l2v1-t5", "stem": "Қай бөлімде балалық шақтың қиындығы туралы айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "A", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты. (1-бөлім)"], "explanation": "1-бөлімде Асанәлі Әшімов балалық шағының ауыр болғанын айтады: соғыс кезінде егінде жұмыс істеп, кейде мектепке жалаңаяқ барған.", "explanation_ru": "В 1-й части Асанали Ашимов рассказывает, что детство было трудным: шла война, он работал в поле и иногда ходил в школу босиком.", "distractor_notes": {"B": "2-бөлім анасы туралы: оның еңбекқор, мейірімді адам болғаны айтылады.", "C": "3-бөлім бала кезгі ойындар туралы.", "D": "4-бөлімде балаларға берілген кеңес айтылады."}, "distractor_notes_ru": {"B": "2-я часть — о его маме: она была трудолюбивой и доброй.", "C": "3-я часть — о детских играх.", "D": "В 4-й части — совет детям."}, "distractor_evidence": {"B": ["– Анам еңбекқор, мейірімді, қарапайым адам болды."], "C": ["– Балалық шағыңызда қандай ойындар ойнадыңыз?"], "D": ["– Балаларға қандай кеңес берер едіңіз?"]}, "keywords": {"ok": {"kk": ["балалық шағы ауыр болды"], "ru": ["было трудным"]}, "B": {"kk": ["Анам"], "ru": ["Моя мама"]}, "C": {"kk": ["ойындар"], "ru": ["игры"]}, "D": {"kk": ["кеңес"], "ru": ["совет"]}}, "editor_changes": ""}, {"id": "l2v1-q29", "number": 9, "text_id": "l2v1-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Соғыс кезінде балалар жауынгер болып ойнады.\n2. Соғыс кезінде балалар үлкендерге көмектесті.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Ауылдың барлық ер-азаматы соғысқа кетті, жұмыс істей алатын қарттардың, аналардың, балалардың барлығы жұмыс істеді. (1-бөлім)", "Балалар жұмыс істеп жүріп те ойнай алдық. (3-бөлім)"], "explanation": "Мәтінде балалардың үлкендермен бірге жұмыс істегені айтылады (2-тұжырым дұрыс). Ал балалар жауынгер болып емес, «Қызыл май» (хоккей) және доп ойнаған (1-тұжырым қате).", "explanation_ru": "В тексте сказано, что дети работали вместе со взрослыми (утверждение 2 верно). А играли они не в войну, а в «Қызыл май» (хоккей) и в мяч (утверждение 1 неверно).", "distractor_notes": {"A": "балалардың қандай ойын ойнағанын 3-бөлімнен қайта оқып, бірінші тұжырымды тексер.", "C": "екі тұжырымды да мәтінмен жеке-жеке салыстыр. Балалардың қандай ойын ойнағаны 3-бөлімде жазылған.", "D": "тұжырымдардың біреуі мәтінде бар. Соғыс кезінде балалардың не істегенін 1-бөлімнен қайта оқы."}, "distractor_notes_ru": {"A": "Перечитай в 3-й части, во что играли дети, и проверь первое утверждение.", "C": "Сравни каждое утверждение с текстом отдельно. Во что играли дети, написано в 3-й части.", "D": "Одно из утверждений есть в тексте. Перечитай в 1-й части, что делали дети во время войны."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["балалардың барлығы жұмыс істеді", "жұмыс істеп жүріп"], "ru": ["работали все, кто мог", "даже работая"]}}, "editor_changes": ""}, {"id": "l2v1-q30", "number": 10, "text_id": "l2v1-t5", "stem": "Мәтіндегі оқиғалардың реті қандай?\n1. Бала күнгі ойындар\n2. Соғыс және балалық шақ\n3. Оқудың пайдасы\n4. Менің анам", "options": {"A": "1, 2, 3, 4", "B": "1, 2, 4, 3", "C": "2, 1, 4, 3", "D": "2, 4, 1, 3"}, "key": "D", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты. (1-бөлім)", "– Анам еңбекқор, мейірімді, қарапайым адам болды. (2-бөлім)", "– Соғыс жүріп жатқандықтан, бізде ойыншық деген болған жоқ. (3-бөлім)", "Оқысаң, білімді болсаң, елге де көмегің тиеді. (4-бөлім)"], "explanation": "Сұхбат бөлімдерінің реті: 1 – соғыс және балалық шақ, 2 – анасы, 3 – бала күнгі ойындар, 4 – оқудың пайдасы. Тізімдегі нөмірлермен жазсақ: 2, 4, 1, 3.", "explanation_ru": "Порядок частей интервью: 1 — война и детство, 2 — мама, 3 — детские игры, 4 — польза учёбы. Номерами из списка: 2, 4, 1, 3.", "distractor_notes": {"A": "мәтін бала күнгі ойындардан басталмайды. 1-бөлімнің не туралы екенін қайта оқы.", "B": "мәтін бала күнгі ойындардан басталмайды. 1-бөлімнің не туралы екенін қайта оқы.", "C": "бірінші бөлім дұрыс анықталған, бірақ қалғандарының ретін 2 және 3-бөлімдерден қайта тексер."}, "distractor_notes_ru": {"A": "Текст начинается не с детских игр. Перечитай, о чём 1-я часть.", "B": "Текст начинается не с детских игр. Перечитай, о чём 1-я часть.", "C": "Первая часть определена верно, но порядок остальных проверь по 2-й и 3-й частям."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["балалық шағы ауыр болды", "Анам", "ойыншық", "Оқысаң, білімді болсаң"], "ru": ["было трудным", "Моя мама", "игрушек", "Если будешь учиться"]}}, "editor_changes": ""}, {"id": "l2v1-q31", "number": 11, "text_id": "l2v1-t5", "stem": "Асанәлі Әшімов балаларға қандай кеңес береді?", "options": {"A": "Ата-ананың балаларына деген қамқорлығы ерекше.", "B": "Балалар кішкентайынан елдің қамын ойлауы тиіс.", "C": "Балалық шақта еңбекке араласқан дұрыс.", "D": "Білім жолында аянбай тер төгу қажет."}, "key": "D", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Балаларға айтарым: оқы, оқы және тағы оқы... (4-бөлім)"], "explanation": "Асанәлі Әшімов балаларға «оқы, оқы және тағы оқы» деп кеңес береді. Бұл – білім алу үшін көп еңбектену керек деген ой.", "explanation_ru": "Асанали Ашимов советует детям: «учись, учись и ещё раз учись». Это мысль о том, что ради знаний нужно много трудиться.", "distractor_notes": {"A": "кеңесте ата-ананың қамқорлығы туралы айтылмайды. Керісінше, ол баланың ата-анасын тыңдауы керек дейді.", "B": "ол балаларға елдің қамын емес, өз болашағын кішкентайынан ойлауды айтады. Елге көмек – білімнің нәтижесі.", "C": "балалық шақта жұмыс істегенін ол кеңес ретінде емес, соғыс кезіндегі ауыр жағдай ретінде айтады."}, "distractor_notes_ru": {"A": "О заботе родителей в совете не говорится. Наоборот, он говорит, что ребёнок должен слушать родителей.", "B": "Он советует детям с детства думать не о стране, а о своём будущем. Польза стране — результат знаний.", "C": "О работе в детстве он говорит не как о совете, а как о трудностях военного времени."}, "distractor_evidence": {"A": ["– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды."], "B": ["– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды.", "Оқысаң, білімді болсаң, елге де көмегің тиеді."], "C": ["Бала Асанәлі егінде жұмыс істеді."]}, "keywords": {"ok": {"kk": ["оқы, оқы және тағы оқы"], "ru": ["учись, учись и ещё раз учись"]}, "A": {"kk": ["ата-анасын тыңдап"], "ru": ["слушает родителей"]}, "B": {"kk": ["болашағын кішкентайынан ойлайды", "елге де көмегің тиеді"], "ru": ["с детства думает о своём будущем", "пользу и своей стране"]}, "C": {"kk": ["егінде жұмыс істеді"], "ru": ["работал в поле"]}}, "editor_changes": ""}, {"id": "l2v1-q32", "number": 12, "text_id": "l2v1-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "әңгіме", "B": "мақала", "C": "монолог", "D": "сұхбат"}, "key": "D", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["– Өміріңізде анаңыздың рөлі қандай?", "– Балаларға қандай кеңес берер едіңіз?"], "explanation": "Мәтін сұрақ пен жауаптан тұрады: біреуі сұрақ қояды, Асанәлі Әшімов жауап береді. Мұндай үлгі сұхбат деп аталады.", "explanation_ru": "Текст состоит из вопросов и ответов: один спрашивает, Асанали Ашимов отвечает. Такой жанр называется интервью (сұхбат).", "distractor_notes": {"A": "әңгімеде оқиға баяндалады, ал бұл мәтін сұрақ-жауап түрінде құрылған.", "B": "мақалада автор бір тақырыпты өз атынан түсіндіреді, ал мұнда екі адамның сұрақ-жауабы бар.", "C": "монологта бір адам ғана сөйлейді, ал мұнда сұрақ қоятын екінші адам бар."}, "distractor_notes_ru": {"A": "В рассказе (әңгіме) повествуется о событиях, а этот текст построен в форме вопросов и ответов.", "B": "В статье (мақала) автор сам раскрывает тему, а здесь вопросы и ответы двух людей.", "C": "В монологе говорит только один человек, а здесь есть второй — тот, кто задаёт вопросы."}, "distractor_evidence": {"A": [], "B": [], "C": ["– Өміріңізде анаңыздың рөлі қандай?"]}, "keywords": {"ok": {"kk": ["рөлі қандай?", "берер едіңіз?"], "ru": ["Какова роль", "дали бы"]}, "C": {"kk": ["рөлі қандай?"], "ru": ["Какова роль"]}}, "editor_changes": ""}, {"id": "l2v1-q33", "number": 13, "text_id": "l2v1-t6", "stem": "Жауынгердің өзіндік әдісі қандай?", "options": {"A": "бәсекелесін ашуландыру", "B": "бәсекелесін қолдау", "C": "сабырлық таныту", "D": "ұстазын құрметтеу"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Ол қарсыласына ауыр сөздер айтып, ызаландырады."], "explanation": "Жауынгердің тактикасы: қарсыласын ауыр сөзбен ызаландыру, яғни ашуландыру. Ашуланған қарсылас қателесіп, жеңіледі.", "explanation_ru": "Тактика воина — оскорблениями довести соперника до ярости, то есть разозлить. Разозлённый соперник ошибается и проигрывает.", "distractor_notes": {"B": "мәтінде жауынгердің ешкімді қолдағаны айтылмайды. Оның қарсыласына не істейтінін қайта оқы.", "C": "сабыр танытқан жауынгер емес, самурай.", "D": "жауынгер ұстазды құрметтемейді: ол есікті теуіп, кетіп қалады."}, "distractor_notes_ru": {"B": "В тексте не сказано, что воин кого-то поддерживал. Перечитай, что он делает со своим соперником.", "C": "Терпение проявил не воин, а самурай.", "D": "Воин не уважает учителя: он пинает дверь и уходит."}, false, "fixed_order": true, "evidence": ["Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды.", "– Ей, Сүлгі! – деді Қолжуғыш шыдай алмай.", "Сабын да қарап тұра алмады.", "Үшеуінің айтысы кешке дейін созылды."], "explanation": "Алдымен адам жуынады (1), сосын Сүлгі мақтанып, Қолжуғыш онымен дауласады (4), кейін айтысқа Сабын қосылады (3), соңында айтыс кешке дейін нәтижесіз созылады (2).", "explanation_ru": "Сначала человек умывается (1), потом Полотенце хвастается, и Умывальник с ним спорит (4), затем в спор вступает Мыло (3), и в конце спор безрезультатно длится до вечера (2).", "distractor_notes": {"A": "мәтіндегі оқиғаларды басынан бастап ретімен қайта оқы: айтысқа кім, қашан қосылады?", "B": "айтысқа алдымен кім кіріседі – Сабын ба, әлде Сүлгі мен Қолжуғыш па? Мәтінді қайта оқы.", "D": "мәтін айтыстан емес, адамның жуынуынан басталады."}, "distractor_notes_ru": {"A": "Перечитай события по порядку с начала: кто и когда вступает в спор?", "B": "Кто вступает в спор первым — Мыло или Полотенце с Умывальником? Перечитай текст.", "D": "Текст начинается не со спора, а с того, что человек умывается."}, "distractor_evidence": {"A": [], "B": [], "D": ["Адам қолжуғышқа су құйды."]}, "keywords": {"ok": {"kk": ["беті-қолын сабындап", "Қолжуғыш", "Сабын да", "кешке дейін созылды"], "ru": ["намылил лицо и руки", "Умывальник", "Мыло тоже", "до самого вечера"]}, "D": {"kk": ["Адам қолжуғышқа су құйды"], "ru": ["налил воды в умывальник"]}}, "editor_changes": ""}, {"id": "l2v1-q37", "number": 17, "text_id": "l2v1-t7", "stem": "Бос орынға қай жауап сәйкес келеді?", "options": {"A": "адам дауды тоқтатқан еді", "B": "олар әбден шаршаған еді", "C": "оларды ешкім естімеген еді", "D": "су таусылып қалған еді"}, "key": "D", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды."], "explanation": "Мәтіннің басында адамның «су біткенше» жуынғаны айтылады. Су таусылғандықтан, кешке дейін ешкім жуынуға келмеген.", "explanation_ru": "В начале текста сказано, что человек умывался, «пока не кончилась вода». Раз воды не осталось, до вечера к ним никто не подходил умываться.", "distractor_notes": {"A": "мәтінде адамның дауға араласқаны айтылмайды. Ол жуынып болған соң, ішке кіріп кетті.", "B": "шаршау – олардың өз жағдайы. Ал бос орын адамдардың неліктен келмегенін түсіндіруі керек.", "C": "адамдар оларды естімегендіктен келмеді деген ой мәтіннен шықпайды. Мәтіннің басын қайта оқы."}, "distractor_notes_ru": {"A": "В тексте не сказано, что человек вмешивался в спор. Умывшись, он ушёл в дом.", "B": "Усталость — это их собственное состояние, а пропуск должен объяснить, почему к ним не подходили люди.", "C": "Из текста не следует, что люди не приходили, потому что их не слышали. Перечитай начало текста."}, "distractor_evidence": {"A": ["Сүлгіге жақсылап сүртінді де, ішке кіріп кетті."], "B": [], "C": []}, "keywords": {"ok": {"kk": ["су біткенше"], "ru": ["пока не кончилась вода"]}, "A": {"kk": ["ішке кіріп кетті"], "ru": ["ушёл в дом"]}}, "editor_changes": ""}, {"id": "l2v1-q38", "number": 18, "text_id": "l2v1-t8", "stem": "Қарлығаш қорегін қалай тауып жейді?", "options": {"A": "аузын ашып ұшу арқылы", "B": "өте жылдам ұшу арқылы", "C": "балапандарымен бірге аңшылыққа шығу арқылы", "D": "жәндіктер мен шыбын-шіркейді теріп жеу арқылы"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Қарлығашты зерттеуші ғалымдар оның әуеде аузын ашып ұша алатынын анықтаған.", "Қатты жылдамдықпен самғап келе жатқан қарлығаштың аузына ауада ұшып жүрген шыбын-шіркейлер өздері кеп түсетін көрінеді, яғни бұл – қарлығаштың «аңшылығы»."], "explanation": "Қарлығаш аузын ашып ұшады, сонда шыбын-шіркейлер оның аузына өздері кеп түседі. Бұл – оның «аңшылығы».", "explanation_ru": "Ласточка летает с открытым клювом, и мошки сами залетают ей в клюв. Это её «охота».", "distractor_notes": {"B": "қарлығаш шынымен жылдам ұшады, бірақ қорегін тек жылдамдықтың арқасында таппайды. Қорек оған қалай түсетінін қайта оқы.", "C": "қарлығаш балапандарымен бірге аңшылыққа шықпайды, ол тамақты балапандарына әкеліп береді.", "D": "мәтінде қарлығаштың шыбын-шіркейді «теріп» жейтіні айтылмайды. Олардың қалай қорек болатынын мәтіннен тауып көр."}, "distractor_notes_ru": {"B": "Ласточка действительно летает быстро, но корм она добывает не только благодаря скорости. Перечитай, как корм к ней попадает.", "C": "Ласточка не охотится вместе с птенцами — она приносит им пищу.", "D": "В тексте не сказано, что ласточка «собирает» насекомых. Найди в тексте, как они становятся её пищей."}, "distractor_evidence": {"B": [], "C": ["Әрі-бері самғап, аузын толтырған соң, ол тапқан тамағын балапандарына әкеліп береді."], "D": []}, "keywords": {"ok": {"kk": ["аузын ашып ұша", "аузына", "өздері кеп түсетін"], "ru": ["с открытым клювом", "в клюв", "сами залетают"]}, "C": {"kk": ["балапандарына әкеліп береді"], "ru": ["приносит найденную пищу птенцам"]}}, "editor_changes": ""}, {"id": "l2v1-q39", "number": 19, "text_id": "l2v1-t8", "stem": "Мәтіннің соңында автор неге назар аударғысы келді?", "options": {"A": "адамдардың қарлығашқа деген қамқорлығына", "B": "қарлығаштың адамзатқа әкелетін пайдасына", "C": "қарлығаштың ұя салу қабілетіне", "D": "адамдардың сенгіштігіне"}, "key": "B", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Сондай-ақ қаншама зиянды шыбын-шіркейді жойып, адамға да көмегін тигізеді."], "explanation": "Мәтіннің соңғы бөлігі қарлығаштың зиянды шыбын-шіркейді жойып, адамға көмектесетіні туралы. Халықтың оны киелі санауы да осыған байланысты.", "explanation_ru": "Последняя часть текста — о том, что ласточка уничтожает вредных насекомых и помогает человеку. Поэтому народ и считает её священной.", "distractor_notes": {"A": "мәтінде адамдардың қарлығашқа қамқорлық жасағаны айтылмайды.", "C": "ұя туралы тек ырым ретінде айтылады, қарлығаштың ұя салу қабілеті сипатталмайды.", "D": "ырым туралы бір сөйлем бар, бірақ автор адамдарды сенгіш деп сынамайды."}, "distractor_notes_ru": {"A": "В тексте не сказано, что люди заботятся о ласточке.", "C": "О гнезде говорится только как о примете, умение строить гнёзда не описывается.", "D": "Есть одно предложение о примете, но автор не критикует людей за суеверность."}, "distractor_evidence": {"A": [], "C": ["Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды."], "D": ["Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды."]}, "keywords": {"ok": {"kk": ["зиянды шыбын-шіркейді жойып", "адамға да көмегін тигізеді"], "ru": ["вредных насекомых", "помогает и человеку"]}, "C": {"kk": ["ұя салса", "жақсы ырымға"], "ru": ["свьёт гнездо", "доброй приметой"]}, "D": {"kk": ["жақсы ырымға"], "ru": ["доброй приметой"]}}, "editor_changes": ""}, {"id": "l2v1-q40", "number": 20, "text_id": "l2v1-t9", "stem": "Мәтіннің негізгі ойы қандай?", "options": {"A": "Білім ешқашан тозбайды.", "B": "Достық ешқашан тозбайды.", "C": "Киім ешқашан тозбайды.", "D": "Кітап ешқашан тозбайды."}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Оның сырты ескіреді, бірақ ішіндегі ақыл ескірмейді, – депті сонда Қожанасыр."], "explanation": "Қожанасыр кітаптың сырты ескіргенімен, ішіндегі ақыл, яғни білім ескірмейтінін айтады. Демек, негізгі ой – білім ешқашан тозбайды.", "explanation_ru": "Ходжа Насреддин говорит, что обложка книги стареет, но мудрость внутри, то есть знание, не стареет. Значит, главная мысль — знание никогда не устаревает.", "distractor_notes": {"B": "мәтінде достық туралы ой айтылмайды. «Достым» деген сөз тек қаратпа ретінде қолданылған.", "C": "керісінше, Қожанасыр киімнің ескіретінін айтады.", "D": "Қожанасыр кітаптың сырты ескіретінін айтады. Кітаптың қай бөлігі ескірмейтінін қайта оқы."}, "distractor_notes_ru": {"B": "В тексте нет мысли о дружбе. Слово «достым» (друг мой) — просто обращение.", "C": "Наоборот, Ходжа Насреддин говорит, что одежда стареет.", "D": "Ходжа Насреддин говорит, что обложка книги стареет. Перечитай, какая часть книги не стареет."}, "distractor_evidence": {"B": ["– Е, достым, не істеп жатырсың?"], "C": ["– Қой, достым, киім ескіреді, бірақ кітап ескірмейді."], "D": []}, "keywords": {"ok": {"kk": ["ішіндегі ақыл ескірмейді"], "ru": ["мудрость внутри не стареет"]}, "B": {"kk": ["достым"], "ru": ["друг мой"]}, "C": {"kk": ["киім ескіреді"], "ru": ["одежда стареет"]}}, "editor_changes": ""}]}, {"bank_id": "kaz-L2-v2", "track": "second_language", "source": "Автордың құрастырған нұсқасы: мәтіндер қазақстандық сайттардан алынған (әр мәтіннің source_note өрісін қараңыз)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {"Содан кейін робот қымыздың шипалы қасиеті туралы қысқаша мағлұмат береді әрі ыдысқа пайдалы сусын құяды.": "После этого робот коротко рассказывает о целебных свойствах кумыса и наливает в посуду полезный напиток.", "Ұлттық сусынымызды насихаттайтын болғандықтан, Асылбектің ұлттық киімде болғаны дұрыс деп шештік, – дейді Жансұлтан.": "Раз он пропагандирует наш национальный напиток, мы решили, что будет правильно, если Асылбек был в национальной одежде, — говорит Жансултан.", "Оқушыға роботты жасап шығуға информатика пәнінің мұғалімі көмектескен.": "Создать робота ученику помог учитель информатики.", "Кез келген адам роботқа арнайы пластикалық картаны жақындату арқылы Асылбекті сөйлете алады.": "Любой человек может заставить Асылбека заговорить, поднеся пластиковую карту к роботу.", "Құрылғы мойындағы өте әлсіз вибрацияларды анықтап, оларды адамның өз дауысына мейлінше ұқсас сөйлеуге айналдырады.": "Устройство улавливает очень слабые вибрации на шее и превращает их в речь, максимально похожую на собственный голос человека.", "Пайдалану жолы қарапайым: қолданушы даусынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді, кейін құрылғыны мойнына тағады — жүйе сол сәтте-ақ оның өз даусын синтездеп бере бастайды.": "Пользоваться им просто: пользователь загружает в приложение аудиофайл, записанный, пока пользователь ещё не потерял голос, затем надевает устройство на шею — и система сразу начинает синтезировать его собственный голос.", "Ашық теңіздегі адамды байқаған дельфиндер оған көмекке келіп, айналасында топтасып жүзе бастаған.": "Дельфины, заметившие человека в открытом море, пришли ему на помощь и стали плавать группой вокруг него.", "Оның сөзінше, дельфиндер осылайша ер адамды қорғауға тырысқан.": "По его словам, так дельфины пытались защитить мужчину.", "Құтқару кемесінің капитаны О'Коннеллдің сөзінше, теңіз жануарлары ирландиялық азаматтың айналасында топтасып жүзіп жүрген.": "По словам капитана спасательного судна О'Коннелла, морские животные плавали группой вокруг ирландца.", "Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды.": "В итоге через 12 часов в четырёх километрах от берега спасатели заметили группу плавающих дельфинов.", "Құтқарушылар қайықпен және тікұшақпен жоғалған адамды іздеуге кіріскен.": "Спасатели на лодке и вертолёте начали искать пропавшего человека.", "Сонымен қатар, құтқарушылар дельфиндер болмағанда, ер адамды дер кезінде тауып, құтқарып қалу екіталай еді деген пікірде.": "Кроме того, спасатели считают, что если бы не дельфины, вовремя найти и спасти мужчину вряд ли удалось бы.", "Белгілі болғандай, ер адам 8 шақырым қашықтықты жалғыз өзі жүзіп өтпек болған.": "Как стало известно, мужчина хотел в одиночку проплыть 8 километров.", "Құтқарушылар ер адамды судан шығарып, оған алғашқы көмек көрсеткен.": "Спасатели вытащили мужчину из воды и оказали ему первую помощь.", "Шаңырақ «үй, отбасы» деген мағынаны да білдіреді.": "Шанырак имеет также значение «дом, семья».", "Киіз үй берік ағаштан (қайыңнан, талдан) жасалады.": "Юрту делают из прочного дерева (берёзы, ивы).", "Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады.": "Готовую решётку называют «қанат» (крыло), то есть в юрте на 18 «крыльев» — 18 решёток.", "Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі.": "Уық — одна из главных частей, соединяющих решётку и шанырак.", "Оларға құрт түспейді, басқа ағаштар сияқты тез шірімейді.": "Их не точат черви, они не гниют быстро, как другие деревья.", "Әр үйде көлеміне қарай 60-160-тай уық болады.": "В каждой юрте, в зависимости от её размера, бывает около 60–160 жердей (уық).", "Оның әсемдікке әрі жылылыққа әсері мол.": "Он придаёт дому красоту и тепло.", "Сондай-ақ ши тұрғанда сырттан құрт-құмырсқа, кесіртке, жылан тағы басқа жәндіктер кіре алмайды.": "Кроме того, когда стоит чий, снаружи не могут проникнуть насекомые, ящерицы, змеи и другие существа.", "Кереге киіз үйдің негізін құрайды.": "Решётка (кереге) составляет основу юрты.", "Шаңырақ – киіз үйдің қасиетті, киелі мүлкі.": "Шанырак — святое, почитаемое достояние юрты.", "Киіз үйдің бір бөлшегі – кәдімгі ши.": "Ещё одна часть юрты — обычный чий (циновка из стеблей).", "«Керегең кең болсын» деген тілек осыдан шыққан.": "Отсюда пошло пожелание «Керегең кең болсын» («Пусть твоя решётка будет широкой»).", "«Шаңырағың биік болсын» деген тілек бар.": "Есть пожелание «Шаңырағың биік болсын» («Пусть твой шанырак будет высоким»).", "Есіктен кіргенде табалдырықты баспаймын.": "Входя в дверь, я не наступаю на порог.", "Біреудің үйіне аяқ киімімді шешіп кіремін.": "В чужой дом я вхожу, сняв обувь.", "Осылайша балаларға арналған алғашқы кітабымды жазуды қолға алдым.": "Так я взялась писать свою первую книгу для детей.", "– Қазақша көп сөз білмеймін.": "— Я знаю немного казахских слов.", "Осылайша көрпешені, қазақтың ұлттық киімін, кең даласы, жануарларын, киіз үйді және басқа да дүниелерді кітабымда иллюстрациялар арқылы көрсетуді жөн деп шештім.": "Поэтому я решила показать в иллюстрациях своей книги көрпеше, казахскую национальную одежду, широкую степь, животных, юрту и многое другое.", "Үш жыл кеткен жұмысым жарық көргеніне өте қуаныштымын.": "Я очень рада, что вышла в свет моя работа, на которую ушло три года.", "– Эшли, Қазақстан жайлы кітап жазу идеясы қалай дүниеге келді?": "— Эшли, как появилась идея написать книгу о Казахстане?", "– Қазақша білесіз бе?": "— Вы знаете казахский?", "– On a Train in Kazakhstan қандай кітап?": "— Что это за книга — On a Train in Kazakhstan?", "Кейіпкерлері кім?": "Кто её герои?", "– Қазір немен айналысасыз?": "— Чем вы сейчас занимаетесь?", "Көптеген мәдениетпен танысу сол мәдениеттен өзіңе ұнағанды алып, ұнамаған тұсынан атап өтуге мүмкіндік береді.": "Знакомство со многими культурами позволяет взять то, что тебе нравится, а то, что не нравится, обойти стороной.", "– Қазір отбасыма жақын жерде тұрып жатырмын.": "— Сейчас я живу рядом со своей семьёй.", "Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты.": "Разве бывает жизнь без соперничества? Один из его учеников мечтал найти вопрос, на который учитель не сможет ответить.", "Ертеде бір топ шәкірті бар ғұлама өмір сүріпті.": "Давным-давно жил мудрец, у которого было много учеников.", "– Ұстаз, айтыңызшы: менің қолымдағы тірі көбелек пе, өлі көбелек пе?": "— Учитель, скажите: бабочка у меня в руке живая бабочка или мёртвая?", "Шәкірт ұстаз жауабына орай көбелекті өлтіріп не ұшырып жіберуге даяр еді.": "Ученик в зависимости от ответа учителя был готов убить или отпустить бабочку.", "– Бәрі сенің қолыңда.": "— Всё в твоих руках.", "— Көремін, өрмек тоқып жүр.": "— Вижу, он плетёт паутину.", "— Көремін, аузында бір нанның уалшығы бар, жүгіріп кетіп барады.": "— Вижу, во рту у него хлебная крошка, бежит куда-то.", "— Жоғарыда қарлығаш ұшып жүр, аузында кесе тістеген шөбі бар.": "— Наверху летает ласточка, в клюве у неё травинка.", "Жұмыссыз жүрген бір жан жоқ.": "Нет ни одного существа без дела.", "Сонда атасы айтты:": "Тогда дед сказал:", "— Жоғары қара, аспанда не көрінеді?": "— Посмотри наверх, что видно в небе?", "Сені де Құдай-Тағала бос жүруге жаратпаған": "И тебя Всевышний создал не для того, чтобы бездельничать", "— Олай болса, шырағым, ол кішкентай жәндіктер саған әбірет.": "— Раз так, дорогой мой, эти маленькие существа тебе пример.", "Атасы он жасар ұл баласымен далада келе жатып, баласынан сұрады:": "Дед, идя по степи со своим десятилетним внуком, спросил его:", "Күндіз жеке не топтанып, бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады.": "Днём они поодиночке или группами отдыхают, свесив голову вниз и цепляясь лапками за камни, деревья, обрывы.", "Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді.": "Летучая мышь не строит гнёзд, а обитает в пещерах, дуплах деревьев, на чердаках домов и построек, в птичьих норах на обрывах.", "Кешкі ымыртта және түнде жемтігін қалықтап ұшып жүріп аулайды.": "В вечерних сумерках и ночью охотится на добычу на лету.", "Жарқанаттар өсімдіктерге зиянды әр түрлі жәндіктермен қоректеніп, ауыл шаруашылығы және орман шаруашылықтарына пайда да келтіреді.": "Питаясь разными насекомыми, вредными для растений, летучие мыши приносят пользу сельскому и лесному хозяйству.", "Сондай-ақ, түрлі аурулар (әсіресе, құтыру) таратып, адамға, жануарларға залалын да тигізеді.": "Вместе с тем, распространяя разные болезни (особенно бешенство), они наносят вред людям и животным.", "Қазан-қараша айларында қысқы ұйқыға кетеді.": "В октябре–ноябре они впадают в зимнюю спячку.", "Қожанасырдың үстіндегі киімі жаман екен.": "Одежда на Ходже Насреддине была плохой.", "Бұл жолы үй иесі Қожанасырды құрметтейді, төрден орын береді, ет келгенде:": "На этот раз хозяин оказывает почёт Ходже Насреддину, сажает на почётное место, а когда подают мясо:", "– Сен кісіні сыйламайды екенсің, киімді сыйлайды екенсің.": "— Оказывается, ты не уважаешь человека, ты уважаешь одежду.", "Сондықтан шапаныма жегізіп отырғаным!": "Поэтому я и кормлю свой халат!"}, "style_notes": [], "texts": [{"id": "l2v2-t1", "title": "", "source_note": "BAQ.KZ: «Түркістандық оқушы қымыз құятын робот ойлап тапты» – https://baq.kz/turkistandyq-oqushy-qymyz-quyatyn-robot-oylap-tapty-296343/", "numbered_paragraphs": false, "paragraphs": ["Түркістан облысы Төле би ауданында 9-сынып оқушысы Жансұлтан Төребек қымыз құятын робот жасап шығарды. Робот Асылбек деп аталады. Кез келген адам роботқа арнайы пластикалық картаны жақындату арқылы Асылбекті сөйлете алады. Содан кейін робот қымыздың шипалы қасиеті туралы қысқаша мағлұмат береді әрі ыдысқа пайдалы сусын құяды. Ұлттық сусынымызды насихаттайтын болғандықтан, Асылбектің ұлттық киімде болғаны дұрыс деп шештік, – дейді Жансұлтан. Оқушыға роботты жасап шығуға информатика пәнінің мұғалімі көмектескен."]}, {"id": "l2v2-t2", "title": "", "source_note": "Egemen Qazaqstan: «Мектеп оқушылары адамға даусын қайтаратын құрылғы ойлап тапты» – https://egemen.kz/news/article395344-mektep-oqushylary-adamgha-dausyn-qaytaratyn-qurylghy-oylap-tapty", "numbered_paragraphs": false, "paragraphs": ["Астана қаласындағы Назарбаев Зияткерлік мектебінің оқушылары дауысынан айырылған адамдарға сөйлеу мүмкіндігін қайтаратын VoiceX атты құрылғының прототипін әзірледі. Құрылғы мойындағы өте әлсіз вибрацияларды анықтап, оларды адамның өз дауысына мейлінше ұқсас сөйлеуге айналдырады.", "«Мен бұрын дауысымды жоғалту дегеннің қандай екенін мүлде ойламаппын. Біз сөйлей алатынымызға үйреніп кеткеніміз соншалық, оны әдеттегі нәрсе деп қабылдаймыз. Алайда бір сәтте біреу үшін дауыс – жай ғана арман екенін түсінесің», – деп еске алды жобаның негізін қалаушылардың бірі Айзере.", "Пайдалану жолы қарапайым: қолданушы даусынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді, кейін құрылғыны мойнына тағады — жүйе сол сәтте-ақ оның өз даусын синтездеп бере бастайды.", "Жобаны медициналық деңгейге жақындату үшін оқушылар USC және Stanford университеттерінің профессорларымен, сондай-ақ бас және мойын хирургтарымен ақылдасты."]}, {"id": "l2v2-t3", "title": "", "source_note": "NUR.KZ: «Дельфиндер теңізде 12 сағат бойы қалқып жүрген ер адамды құтқарып қалды» – https://kaz.nur.kz/kaleidoscope/1928954-delfinder-tenizde-12-sagat-boiy-qalqygan-er-adamdy-qutqaryp-qaldy/", "numbered_paragraphs": false, "paragraphs": ["Ирландияның Трали шығанағында дельфиндер 12 сағат бойы теңіздің тастай суында қалқып жүрген ер адамды құтқарып қалды. Белгілі болғандай, ер адам 8 шақырым қашықтықты жалғыз өзі жүзіп өтпек болған. Алайда қашықтықты еңсеруге шамасы жетпей, теңізде 12 сағат бойы қалқып жүрген. Ашық теңіздегі адамды байқаған дельфиндер оған көмекке келіп, айналасында топтасып жүзе бастаған.", "Құтқарушылар қайықпен және тікұшақпен жоғалған адамды іздеуге кіріскен. Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды. Құтқару кемесінің капитаны О'Коннеллдің сөзінше, теңіз жануарлары ирландиялық азаматтың айналасында топтасып жүзіп жүрген. Оның сөзінше, дельфиндер осылайша ер адамды қорғауға тырысқан.", "Құтқарушылар ер адамды судан шығарып, оған алғашқы көмек көрсеткен. Ол әбден ашығып, әлсіреп, тоңып қалған екен. Сонымен қатар, құтқарушылар дельфиндер болмағанда, ер адамды дер кезінде тауып, құтқарып қалу екіталай еді деген пікірде."]}, {"id": "l2v2-t4", "title": "", "source_note": "Bilim-all.kz: «Киіз үйдің түрлері мен құрылысы» – https://bilim-all.kz/article/2306", "numbered_paragraphs": true, "paragraphs": ["Киіз үй берік ағаштан (қайыңнан, талдан) жасалады. Оларға құрт түспейді, басқа ағаштар сияқты тез шірімейді. Талдың керегеге қажетті жуан, жіңішкесін таңдап алуға да болады.", "Кереге киіз үйдің негізін құрайды. «Керегең кең болсын» деген тілек осыдан шыққан. Өйткені үйдің берік болуы, кеңдігі осы керегеге байланысты. Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады.", "Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі. Ол иінінен ішке иіле жасалады, яғни үйдің күмбезді үлгісі осы уықтан басталады. Әр үйде көлеміне қарай 60-160-тай уық болады.", "Шаңырақ – киіз үйдің қасиетті, киелі мүлкі. Қазақтың көптеген жақсы сөздері осыған байланысты айтылады. Шаңырақ «үй, отбасы» деген мағынаны да білдіреді. «Шаңырағың биік болсын» деген тілек бар.", "Киіз үйдің бір бөлшегі – кәдімгі ши. Ши кереге мен туырлықтың екі ортасына келеді. Оның әсемдікке әрі жылылыққа әсері мол. Сондай-ақ ши тұрғанда сырттан құрт-құмырсқа, кесіртке, жылан тағы басқа жәндіктер кіре алмайды."]}, {"id": "l2v2-t5", "title": "Эшли Ланина – америкалық жазушы, иллюстратор", "source_note": "Informburo.kz: «Қазақ елін әлем балаларына кім танытып жүр? Америкалық иллюстратормен сұхбат» – https://informburo.kz/kaz/elaynasy/gulmira-qyz-qalai-qazaq-elin-alem-balalaryna-tanytyp-zur-amerikalyq-illyustratormen-suxbat", "numbered_paragraphs": false, "paragraphs": ["1. – Эшли, Қазақстан жайлы кітап жазу идеясы қалай дүниеге келді?", "– 2011 жылы тұрмыс құрғаннан кейін көп ұзамай Қазақстанға қоныс аудардым. Қазақстан екінші үйіме айналып кетті, бірақ үнемі Нью-Йорктағы отбасымды сағынатын едім. Бұл жағдай ойымды жинақтап, Қазақстанда тұрған кезде уақытты құнды бір дүние жасауға жұмсауға түрткі болды. Осылайша балаларға арналған алғашқы кітабымды жазуды қолға алдым.", "2. – Қазақша білесіз бе?", "– Қазақша көп сөз білмеймін. Орысшам да жақсы емес. Дүкеннен қажетімді алуға, таксистке баратын жерімді түсіндіруге жетеді. Атырауда тұрғанда адамдар тіл үйрену үшін менімен ағылшынша сөйлесуді қалайтын.", "3. – On a Train in Kazakhstan қандай кітап? Кейіпкерлері кім?", "– Қазақстан жайлы таңнан кешке дейін айтуға бармын, бірақ отбасым мені түсінбеуі мүмкін. Осыл
