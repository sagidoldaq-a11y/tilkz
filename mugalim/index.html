r_notes_ru": {"B": "Дельфины не уплыли от человека — наоборот, они оставались рядом с ним.", "C": "В тексте не сказано, что дельфины вышли на берег. Спасатели увидели их в море.", "D": "В тексте пропали не дельфины, а мужчина — его и искали спасатели."}, "distractor_evidence": {"B": ["Құтқару кемесінің капитаны О'Коннеллдің сөзінше, теңіз жануарлары ирландиялық азаматтың айналасында топтасып жүзіп жүрген."], "C": ["Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "D": ["Құтқарушылар қайықпен және тікұшақпен жоғалған адамды іздеуге кіріскен."]}, "keywords": {"ok": {"kk": ["оған көмекке келіп", "ер адамды қорғауға тырысқан"], "ru": ["пришли ему на помощь", "пытались защитить мужчину"]}, "B": {"kk": ["айналасында топтасып жүзіп жүрген"], "ru": ["плавали группой вокруг"]}, "C": {"kk": ["бір топ дельфиннің жүзіп жүргенін"], "ru": ["группу плавающих дельфинов"]}, "D": {"kk": ["жоғалған адамды іздеуге"], "ru": ["искать пропавшего человека"]}}, "editor_changes": ""}, {"id": "l2v2-q4", "number": 4, "text_id": "l2v2-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Ер адам теңізде кішкентай қайықпен жүзіп жүрген.", "B": "Дельфиндер ер адамды табуға көмектесті.", "C": "Құтқарушылар ер адамды бір сағатта тапты.", "D": "Дельфиндер ер адамды жағаға дейін жеткізді."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Сонымен қатар, құтқарушылар дельфиндер болмағанда, ер адамды дер кезінде тауып, құтқарып қалу екіталай еді деген пікірде.", "Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "explanation": "Құтқарушылар алдымен бір топ дельфинді байқаған, адам солардың ортасында болған. Олардың ойынша, дельфиндер болмағанда, адамды дер кезінде табу екіталай еді. «Екіталай» – болуы күмәнді, қиын деген сөз.", "explanation_ru": "Спасатели сначала заметили группу дельфинов, а человек был среди них. По их мнению, без дельфинов найти его вовремя вряд ли удалось бы. «Екіталай» значит «сомнительно, вряд ли».", "distractor_notes": {"A": "ер адам қайықпен емес, жалғыз өзі жүзіп өтпек болған. Қайықпен оны құтқарушылар іздеген.", "C": "құтқарушылар ер адамды бір сағатта емес, 12 сағаттан кейін тапты.", "D": "мәтінде дельфиндердің адамды жағаға жеткізгені айтылмайды. Оны судан құтқарушылар шығарды."}, "distractor_notes_ru": {"A": "Мужчина был не на лодке — он хотел проплыть расстояние сам. На лодке его искали спасатели.", "C": "Спасатели нашли мужчину не за час, а через 12 часов.", "D": "В тексте не сказано, что дельфины доставили человека к берегу. Из воды его вытащили спасатели."}, "distractor_evidence": {"A": ["Белгілі болғандай, ер адам 8 шақырым қашықтықты жалғыз өзі жүзіп өтпек болған."], "C": ["Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "D": ["Құтқарушылар ер адамды судан шығарып, оған алғашқы көмек көрсеткен."]}, "keywords": {"ok": {"kk": ["дельфиндер болмағанда", "дер кезінде тауып", "бір топ дельфиннің жүзіп жүргенін байқайды"], "ru": ["если бы не дельфины", "вовремя найти", "заметили группу плавающих дельфинов"]}, "A": {"kk": ["жалғыз өзі жүзіп өтпек болған"], "ru": ["в одиночку проплыть"]}, "C": {"kk": ["12 сағаттан кейін"], "ru": ["через 12 часов"]}, "D": {"kk": ["Құтқарушылар ер адамды судан шығарып"], "ru": ["Спасатели вытащили мужчину из воды"]}}, "editor_changes": ""}, {"id": "l2v2-q5", "number": 5, "text_id": "l2v2-t4", "stem": "Қай абзацта белгілі бір сөздің қосымша мағынасы түсіндіріледі?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "D", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Шаңырақ «үй, отбасы» деген мағынаны да білдіреді. (4-азатжол)"], "explanation": "4-азатжолда «шаңырақ» сөзі киіз үйдің бөлігін ғана емес, «үй, отбасы» деген мағынаны да білдіретіні айтылады.", "explanation_ru": "В 4-м абзаце сказано, что слово «шаңырақ» означает не только часть юрты, но и «дом, семья».", "distractor_notes": {"A": "1-азатжолда киіз үй қандай ағаштан жасалатыны айтылады, сөздің мағынасы түсіндірілмейді.", "B": "2-азатжолда «қанат» сөзі кездеседі, бірақ ол дайын кереге деп аталады, сөздің екінші мағынасы туралы айтылмайды.", "C": "3-азатжолда уықтың қандай бөлік екені айтылады, сөздің басқа мағынасы түсіндірілмейді."}, "distractor_notes_ru": {"A": "В 1-м абзаце говорится, из какого дерева делают юрту, — значение слова там не объясняется.", "B": "Во 2-м абзаце есть слово «қанат», но так просто называют готовую решётку — о втором значении слова там не говорится.", "C": "В 3-м абзаце говорится, что такое уық как часть юрты, — другое значение слова не объясняется."}, "distractor_evidence": {"A": ["Киіз үй берік ағаштан (қайыңнан, талдан) жасалады."], "B": ["Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады."], "C": ["Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі."]}, "keywords": {"ok": {"kk": ["«үй, отбасы» деген мағынаны да"], "ru": ["также значение «дом, семья»"]}, "A": {"kk": ["берік ағаштан"], "ru": ["из прочного дерева"]}, "B": {"kk": ["Дайын керегені қанат деп атайды"], "ru": ["Готовую решётку называют «қанат»"]}, "C": {"kk": ["кереге мен шаңырақ ортасын қосатын"], "ru": ["соединяющих решётку и шанырак"]}}, "editor_changes": ""}, {"id": "l2v2-q6", "number": 6, "text_id": "l2v2-t4", "stem": "Қай ақпарат мәтін мазмұнына сай келеді?", "options": {"A": "Киіз үй құрт түсіп, тез шіритін ағаштан жасалады.", "B": "Әр киіз үйде, көлеміне қарамастан, 18 уық болады.", "C": "Киіз үйдегі кереге саны қанат санымен бірдей.", "D": "Ши киіз үйге жылу бермейді, оны тек әсемдік үшін ұстайды."}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады. (2-азатжол)"], "explanation": "Мәтінде дайын кереге «қанат» деп аталатыны айтылады: 18 қанат үйде 18 кереге бар. Демек, кереге саны мен қанат саны бірдей.", "explanation_ru": "В тексте сказано, что готовую решётку называют «қанат»: в юрте на 18 «крыльев» — 18 решёток. Значит, число решёток и число «крыльев» одинаково.", "distractor_notes": {"A": "мәтінде керісінше айтылған: киіз үйдің ағашы тез шірімейді.", "B": "18 саны уыққа емес, керегеге қатысты. Уықтың саны үйдің көлеміне қарай әртүрлі.", "D": "ши тек әсемдік үшін емес: ол үйді жылытады және жәндіктерді кіргізбейді."}, "distractor_notes_ru": {"A": "В тексте сказано наоборот: дерево юрты быстро не гниёт.", "B": "Число 18 относится не к жердям, а к решёткам. Число жердей зависит от размера юрты.", "D": "Чий нужен не только для красоты: он утепляет дом и не пускает насекомых."}, "distractor_evidence": {"A": ["Оларға құрт түспейді, басқа ағаштар сияқты тез шірімейді."], "B": ["Әр үйде көлеміне қарай 60-160-тай уық болады."], "D": ["Оның әсемдікке әрі жылылыққа әсері мол.", "Сондай-ақ ши тұрғанда сырттан құрт-құмырсқа, кесіртке, жылан тағы басқа жәндіктер кіре алмайды."]}, "keywords": {"ok": {"kk": ["Дайын керегені қанат деп атайды", "18 қанат үйде 18 кереге"], "ru": ["Готовую решётку называют «қанат»", "18 решёток"]}, "A": {"kk": ["тез шірімейді"], "ru": ["не гниют быстро"]}, "B": {"kk": ["60-160-тай уық"], "ru": ["60–160 жердей"]}, "D": {"kk": ["жылылыққа", "жәндіктер кіре алмайды"], "ru": ["тепло", "не могут проникнуть насекомые"]}}, "editor_changes": ""}, {"id": "l2v2-q7", "number": 7, "text_id": "l2v2-t4", "stem": "Мәтінге қандай тақырып сәйкес келеді?", "options": {"A": "Қазақтың ізгі тілектері", "B": "Киіз үйдің бөліктері", "C": "Киіз үйдің түрлері мен атаулары", "D": "Ағаш шеберлерінің өнері"}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Кереге киіз үйдің негізін құрайды. (2-азатжол)", "Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі. (3-азатжол)", "Шаңырақ – киіз үйдің қасиетті, киелі мүлкі. (4-азатжол)", "Киіз үйдің бір бөлшегі – кәдімгі ши. (5-азатжол)"], "explanation": "Мәтіннің әр азатжолы киіз үйдің бір бөлігі туралы: кереге, уық, шаңырақ, ши. Сондықтан тақырып – «Киіз үйдің бөліктері».", "explanation_ru": "Каждый абзац текста рассказывает об одной части юрты: решётке, жердях, шаныраке, чие. Поэтому подходит заголовок «Части юрты».", "distractor_notes": {"A": "мәтінде «Керегең кең болсын», «Шаңырағың биік болсын» деген тілектер бар, бірақ олар кереге мен шаңырақ туралы айтқанда ғана келтірілген.", "C": "мәтінде киіз үйдің түрлері салыстырылмайды, бір киіз үйдің құрылысы сипатталады.", "D": "мәтінде киіз үйді жасайтын шеберлер туралы айтылмайды."}, "distractor_notes_ru": {"A": "В тексте есть пожелания «Керегең кең болсын», «Шаңырағың биік болсын», но они приведены только в рассказе о решётке и шаныраке.", "C": "В тексте не сравниваются виды юрт — описывается устройство одной юрты.", "D": "В тексте ничего не сказано о мастерах, которые делают юрту."}, "distractor_evidence": {"A": ["«Керегең кең болсын» деген тілек осыдан шыққан.", "«Шаңырағың биік болсын» деген тілек бар."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Кереге", "Уық", "Шаңырақ", "бөлшегі – кәдімгі ши"], "ru": ["Решётка", "Уық", "Шанырак", "часть юрты — обычный чий"]}, "A": {"kk": ["тілек"], "ru": ["пожелание"]}}, "editor_changes": ""}, {"id": "l2v2-q8", "number": 8, "text_id": "l2v2-t5", "stem": "Қай бөлімде Эшлидің қазақ салт-дәстүрін ұстанатыны айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "D", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Есіктен кіргенде табалдырықты баспаймын. (4-бөлім)", "Біреудің үйіне аяқ киімімді шешіп кіремін. (4-бөлім)"], "explanation": "4-бөлімде Эшли табалдырықты баспайтынын, шай дайындай алатынын, біреудің үйіне аяқ киімін шешіп кіретінін айтады. Бұл – қазақ дәстүрлері.", "explanation_ru": "В 4-й части Эшли рассказывает, что не наступает на порог, умеет готовить чай и разувается, входя в чужой дом. Это казахские традиции.", "distractor_notes": {"A": "1-бөлімде Эшли кітап жазу идеясы қалай пайда болғанын айтады.", "B": "2-бөлімде Эшли қандай тілдерді білетіні туралы айтады.", "C": "3-бөлімде Эшли кітабында қазақ мәдениетін суретпен көрсеткенін айтады, бірақ өзінің дәстүр ұстанатыны туралы айтпайды."}, "distractor_notes_ru": {"A": "В 1-й части Эшли рассказывает, как появилась идея написать книгу.", "B": "Во 2-й части Эшли говорит о том, какие языки она знает.", "C": "В 3-й части Эшли говорит, что показала казахскую культуру в иллюстрациях книги, но не о том, что сама соблюдает традиции."}, "distractor_evidence": {"A": ["Осылайша балаларға арналған алғашқы кітабымды жазуды қолға алдым."], "B": ["– Қазақша көп сөз білмеймін."], "C": ["Осылайша көрпешені, қазақтың ұлттық киімін, кең даласы, жануарларын, киіз үйді және басқа да дүниелерді кітабымда иллюстрациялар арқылы көрсетуді жөн деп шештім."]}, "keywords": {"ok": {"kk": ["табалдырықты баспаймын", "аяқ киімімді шешіп кіремін"], "ru": ["не наступаю на порог", "сняв обувь"]}, "A": {"kk": ["алғашқы кітабымды жазуды"], "ru": ["писать свою первую книгу"]}, "B": {"kk": ["Қазақша көп сөз білмеймін"], "ru": ["Я знаю немного казахских слов"]}, "C": {"kk": ["кітабымда иллюстрациялар арқылы"], "ru": ["в иллюстрациях своей книги"]}}, "editor_changes": ""}, {"id": "l2v2-q9", "number": 9, "text_id": "l2v2-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Эшлидің кітабы үш жылда жазылды.\n2. Эшли қазақ тілінде еркін сөйлейді.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "A", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Үш жыл кеткен жұмысым жарық көргеніне өте қуаныштымын. (3-бөлім)", "– Қазақша көп сөз білмеймін. (2-бөлім)"], "explanation": "Тек бірінші тұжырым дұрыс: Эшли кітабына үш жыл кеткенін айтады. Ал екінші тұжырым қате: ол қазақша көп сөз білмейді.", "explanation_ru": "Верно только первое утверждение: Эшли говорит, что на книгу ушло три года. А второе неверно: казахских слов она знает немного.", "distractor_notes": {"B": "екінші тұжырымды мәтінмен тағы салыстыр: Эшли қазақ тілін қаншалықты білетінін 2-бөлімнен қайта оқы.", "C": "екі тұжырымның біреуі ғана мәтінге сай. Эшлидің қазақ тілін қаншалықты білетінін 2-бөлімнен қайта оқы.", "D": "тұжырымдардың біреуі мәтінде бар. Кітаптың қанша уақытта жазылғанын 3-бөлімнен ізде."}, "distractor_notes_ru": {"B": "Ещё раз сравни второе утверждение с текстом: перечитай во 2-й части, насколько Эшли знает казахский.", "C": "С текстом совпадает только одно утверждение. Перечитай во 2-й части, насколько Эшли знает казахский.", "D": "Одно из утверждений есть в тексте. Поищи в 3-й части, сколько времени писалась книга."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Үш жыл кеткен жұмысым", "Қазақша көп сөз білмеймін"], "ru": ["работа, на которую ушло три года", "Я знаю немного казахских слов"]}}, "editor_changes": ""}, {"id": "l2v2-q10", "number": 10, "text_id": "l2v2-t5", "stem": "Сұхбат бөлімдерінің реті қандай?\n1. Кітаптың кейіпкері\n2. Эшлидің қазіргі өмірі\n3. Кітап жазу идеясы\n4. Эшлидің тіл білуі", "options": {"A": "1, 2, 3, 4", "B": "3, 1, 4, 2", "C": "3, 4, 1, 2", "D": "4, 3, 1, 2"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["– Эшли, Қазақстан жайлы кітап жазу идеясы қалай дүниеге келді? (1-бөлім)", "– Қазақша білесіз бе? (2-бөлім)", "– On a Train in Kazakhstan қандай кітап? (3-бөлім)", "– Қазір немен айналысасыз? (4-бөлім)"], "explanation": "Сұхбат бөлімдерінің реті: 1 – кітап жазу идеясы, 2 – тіл білуі, 3 – кітаптың кейіпкері, 4 – қазіргі өмірі. Тізімдегі нөмірлермен жазсақ: 3, 4, 1, 2.", "explanation_ru": "Порядок частей интервью: 1 — идея книги, 2 — знание языков, 3 — герой книги, 4 — нынешняя жизнь. Номерами из списка: 3, 4, 1, 2.", "distractor_notes": {"A": "сұхбат кітаптың кейіпкерінен басталмайды. Әр бөлімдегі сұрақты қайта оқып, тізімдегі тақырыппен салыстыр.", "B": "бірінші бөлім дұрыс табылды. Енді 2-бөлімдегі сұрақты қайта оқы: онда не туралы сұралады?", "D": "сұхбат тіл туралы сұрақтан басталмайды. 1-бөлімдегі сұрақты қайта оқы."}, "distractor_notes_ru": {"A": "Интервью начинается не с героя книги. Перечитай вопрос в каждой части и сравни с темами списка.", "B": "Первая часть найдена верно. Теперь перечитай вопрос 2-й части: о чём там спрашивают?", "D": "Интервью начинается не с вопроса о языке. Перечитай вопрос 1-й части."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["кітап жазу идеясы", "Қазақша білесіз бе", "қандай кітап", "Қазір немен айналысасыз"], "ru": ["идея написать книгу", "Вы знаете казахский", "Что это за книга", "Чем вы сейчас занимаетесь"]}}, "editor_changes": ""}, {"id": "l2v2-q11", "number": 11, "text_id": "l2v2-t5", "stem": "Эшлидің ойынша, көп мәдениетпен танысудың пайдасы неде?", "options": {"A": "Басқа елде ұзақ тұрып, жақсы жұмыс табуға мүмкіндік береді.", "B": "Өзіңе ұнаған дәстүрді өміріңе енгізуге мүмкіндік береді.", "C": "Туған жеріңді ұмытып, жаңа елде қалуға мүмкіндік береді.", "D": "Шет тілін тез әрі ешбір қиындықсыз үйренуге мүмкіндік береді."}, "key": "B", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Көптеген мәдениетпен танысу сол мәдениеттен өзіңе ұнағанды алып, ұнамаған тұсынан атап өтуге мүмкіндік береді. (4-бөлім)"], "explanation": "Эшлидің пікірінше, басқа мәдениетпен танысқанда, одан өзіңе ұнағанды алуға болады. Оның өзі де қазақтардың бірнеше әдетін үйреніп, күнде ұстанады.", "explanation_ru": "По мнению Эшли, знакомясь с другой культурой, можно взять из неё то, что тебе нравится. Она и сама переняла несколько казахских привычек и соблюдает их.", "distractor_notes": {"A": "Эшли мәдениетпен танысуды жұмыс табумен байланыстырмайды.", "C": "Эшли туған жерін ұмытпаған: ол қазір отбасына жақын жерде тұрады.", "D": "Эшли Қазақстанда ұзақ тұрса да, қазақ тілін көп білмейді. Демек, ол мәдениетпен танысу тілді тез үйретеді деп айтпайды."}, "distractor_notes_ru": {"A": "Эшли не связывает знакомство с культурой с поиском работы.", "C": "Эшли не забыла родину: сейчас она живёт рядом со своей семьёй.", "D": "Хотя Эшли долго жила в Казахстане, казахский она знает мало. Значит, она не говорит, что знакомство с культурой быстро учит языку."}, "distractor_evidence": {"A": [], "C": ["– Қазір отбасыма жақын жерде тұрып жатырмын."], "D": ["– Қазақша көп сөз білмеймін."]}, "keywords": {"ok": {"kk": ["өзіңе ұнағанды алып"], "ru": ["взять то, что тебе нравится"]}, "C": {"kk": ["отбасыма жақын жерде"], "ru": ["рядом со своей семьёй"]}, "D": {"kk": ["Қазақша көп сөз білмеймін"], "ru": ["Я знаю немного казахских слов"]}}, "editor_changes": ""}, {"id": "l2v2-q12", "number": 12, "text_id": "l2v2-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "күнделік", "B": "сұхбат", "C": "мақала", "D": "әңгіме"}, "key": "B", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["– Қазақша білесіз бе?", "– Қазір немен айналысасыз?"], "explanation": "Мәтін сұрақ пен жауаптан тұрады: тілші сұрақ қояды, Эшли Ланина жауап береді. Мұндай үлгі сұхбат деп аталады.", "explanation_ru": "Текст состоит из вопросов и ответов: журналист спрашивает, Эшли Ланина отвечает. Такой жанр называется интервью (сұхбат).", "distractor_notes": {"A": "күнделікті адам өзі үшін жазады, онда сұрақ қойып, жауап беретін екі адам болмайды.", "C": "мақалада автор өз ойын біртұтас мәтінмен баяндайды. Бұл мәтін сұрақ пен жауаптан құралған.", "D": "әңгімеде оқиға баяндалады. Ал бұл мәтінде тілші сұрақ қойып, Эшли жауап береді."}, "distractor_notes_ru": {"A": "Дневник человек пишет для себя — в нём нет двух людей, один из которых спрашивает, а другой отвечает.", "C": "В статье автор излагает мысли сплошным текстом, а этот текст состоит из вопросов и ответов.", "D": "В рассказе повествуется о событиях, а в этом тексте журналист задаёт вопросы, а Эшли отвечает."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["білесіз бе?", "айналысасыз?"], "ru": ["знаете", "занимаетесь"]}}, "editor_changes": ""}, {"id": "l2v2-q13", "number": 13, "text_id": "l2v2-t6", "stem": "Шәкірт нені армандады?", "options": {"A": "ұстазынан озып, елге танымал ғұлама болуды", "B": "күнде қырға шығып, әдемі көбелек аулауды", "C": "ұстазына есте қалатын жақсы сыйлық жасауды", "D": "ұстазы жауап бере алмайтын сұрақ қоюды"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."], "explanation": "Шәкірт ұстазы жауап бере алмайтын сауал тауып қоюды армандаған. «Сауал» – сұрақ деген сөз.", "explanation_ru": "Ученик мечтал найти вопрос, на который учитель не сможет ответить. «Сауал» значит «вопрос».", "distractor_notes": {"A": "мәтінде шәкірттің ғұлама болуды армандағаны айтылмайды. «Ғұлама» деп мәтінде ұстазды атайды.", "B": "шәкірт көбелекті армандағаны үшін емес, ұстазына сұрақ қою үшін ұстады.", "C": "шәкірт көбелекті ұстазына сыйлық ретінде әкелмеді, оны алақанына жасырып, сұрақ қойды."}, "distractor_notes_ru": {"A": "В тексте не сказано, что ученик мечтал стать учёным. «Ғұлама» в тексте называют учителя.", "B": "Ученик поймал бабочку не потому, что мечтал о ней, а чтобы задать вопрос учителю.", "C": "Ученик принёс бабочку не в подарок: он спрятал её в ладони и задал вопрос."}, "distractor_evidence": {"A": ["Ертеде бір топ шәкірті бар ғұлама өмір сүріпті."], "B": [], "C": ["– Ұстаз, айтыңызшы: менің қолымдағы тірі көбелек пе, өлі көбелек пе?"]}, "keywords": {"ok": {"kk": ["ұстазы жауап бере алмайтын сауал", "армандапты"], "ru": ["вопрос, на который учитель не сможет ответить", "мечтал"]}, "A": {"kk": ["ғұлама"], "ru": ["мудрец"]}, "C": {"kk": ["тірі көбелек пе, өлі көбелек пе"], "ru": ["живая бабочка или мёртвая"]}}, "editor_changes": ""}, {"id": "l2v2-q14", "number": 14, "text_id": "l2v2-t6", "stem": "«Бәрі сенің қолыңда.»\nОсы сөйлемде ұстаз кімді атап тұр?", "options": {"A": "шәкіртті", "B": "көбелекті", "C": "ұстаздың өзін", "D": "басқа шәкірттерді"}, "key": "A", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Шәкірт ұстаз жауабына орай көбелекті өлтіріп не ұшырып жіберуге даяр еді.", "– Бәрі сенің қолыңда."], "explanation": "Ұстаз сұрақ қойған шәкіртке жауап беріп тұр. Көбелектің тірі не өлі болуы тек шәкіртке байланысты еді: ол көбелекті ұшырып та, өлтіріп те жібере алатын. Көбелек шынында да шәкірттің қолында тұр.", "explanation_ru": "Учитель отвечает ученику, который задал вопрос. Будет бабочка живой или мёртвой, зависело только от ученика: он мог и отпустить её, и убить. Бабочка и правда у ученика в руке.", "distractor_notes": {"B": "ұстаз көбелекпен сөйлесіп тұрған жоқ. Ол сұрақ қойған адамға жауап береді.", "C": "«сенің» – екінші жақ, яғни сөйлеуші емес, тыңдаушы. Ұстаз өзі туралы айтса, «менің» дер еді.", "D": "«сенің» – бір адамға айтылған сөз. Ұстаз сұрақты бір шәкірттен ғана естіді."}, "distractor_notes_ru": {"B": "Учитель не разговаривает с бабочкой — он отвечает тому, кто задал вопрос.", "C": "«Сенің» (твой) — второе лицо, то есть слушатель, а не говорящий. О себе учитель сказал бы «менің» (мой).", "D": "«Сенің» (твой) обращено к одному человеку. Учитель услышал вопрос только от одного ученика."}, "distractor_evidence": {"B": [], "C": [], "D": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."]}, "keywords": {"ok": {"kk": ["Шәкірт", "өлтіріп не ұшырып жіберуге даяр", "сенің қолыңда"], "ru": ["Ученик", "был готов убить или отпустить", "в твоих руках"]}, "D": {"kk": ["шәкірттерінің бірі"], "ru": ["из его учеников"]}}, "editor_changes": ""}, {"id": "l2v2-q15", "number": 15, "text_id": "l2v2-t6", "stem": "Бос орынға қай сөз қойылады?", "options": {"A": "Сол үшін", "B": "Сонда да", "C": "Керісінше", "D": "Сондай-ақ"}, "key": "A", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."], "explanation": "Шәкірт ұстазына қиын сұрақ қоюды армандады, сондықтан көбелек ұстап келді. Екінші сөйлем біріншісінің мақсатын, нәтижесін айтады. Оны «сол үшін» байланыстырады.", "explanation_ru": "Ученик мечтал задать учителю трудный вопрос, поэтому поймал бабочку. Второе предложение говорит о цели и следствии первого — его связывает «сол үшін» (для этого, поэтому).", "distractor_notes": {"B": "«сонда да» – «соған қарамастан» деген мағынада, қарама-қарсы ойды байланыстырады. Ал мұнда шәкірт арманын орындау үшін әрекет етеді, қарсылық жоқ.", "C": "«керісінше» алдыңғы ойға қарсы әрекетті білдіреді. Шәкірт армандағанына қарсы емес, сол арманы үшін әрекет етті.", "D": "«сондай-ақ» жаңа, қосымша ақпаратты қосады. Ал мұнда екінші сөйлем жаңа ақпарат емес, шәкірттің арманына жету үшін не істегенін айтады."}, "distractor_notes_ru": {"B": "«Сонда да» (и всё же, несмотря на это) связывает противоположные мысли. А здесь ученик действует, чтобы исполнить мечту, — противопоставления нет.", "C": "«Керісінше» (наоборот) означает действие вопреки сказанному. Ученик действовал не вопреки мечте, а ради неё.", "D": "«Сондай-ақ» (а также) добавляет новую информацию. А здесь второе предложение рассказывает, что ученик сделал ради своей мечты."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["сауал тауып қоюды армандапты"], "ru": ["мечтал найти вопрос"]}}, "editor_changes": ""}, {"id": "l2v2-q16", "number": 16, "text_id": "l2v2-t7", "stem": "Мәтіндегі оқиғалардың реті қандай?\n1. Нан тасыған құмырсқа\n2. Атасының ақылы\n3. Өрмек тоқыған өрмекші\n4. Шөп тасыған қарлығаш", "options": {"A": "1, 3, 4, 2", "B": "3, 1, 2, 4", "C": "3, 1, 4, 2", "D": "3, 4, 1, 2"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["— Көремін, өрмек тоқып жүр.", "— Көремін, аузында бір нанның уалшығы бар, жүгіріп кетіп барады.", "— Жоғарыда қарлығаш ұшып жүр, аузында кесе тістеген шөбі бар.", "Жұмыссыз жүрген бір жан жоқ."], "explanation": "Алдымен бала өрмек тоқыған өрмекшіні көреді (3), сосын нан тасыған құмырсқаны (1), кейін шөп тістеген қарлығашты (4), соңында атасы ақыл айтады (2).", "explanation_ru": "Сначала мальчик видит паука, плетущего паутину (3), потом муравья с хлебной крошкой (1), затем ласточку с травинкой (4), и в конце дед даёт совет (2).", "distractor_notes": {"A": "атасы алдымен құмырсқаны емес, басқа жәндікті көрсетті. Атасының бірінші сұрағын қайта оқы.", "B": "атасы ақылды ең соңында, үш жәндікті де көрсеткен соң айтады.", "D": "алғашқы оқиға дұрыс. Ал қарлығашты бала аспаннан ең соңында көрді, оған дейін жерде құмырсқаны көрді."}, "distractor_notes_ru": {"A": "Дед сначала показал не муравья, а другое существо. Перечитай первый вопрос деда.", "B": "Дед даёт совет в самом конце, после того как показал всех троих.", "D": "Первое событие верно. Но ласточку в небе мальчик увидел последней, а до неё — муравья на земле."}, "distractor_evidence": {"A": [], "B": ["Сонда атасы айтты:"], "D": ["— Жоғары қара, аспанда не көрінеді?"]}, "keywords": {"ok": {"kk": ["өрмек тоқып жүр", "нанның уалшығы", "қарлығаш ұшып жүр", "Жұмыссыз жүрген бір жан жоқ"], "ru": ["плетёт паутину", "хлебная крошка", "летает ласточка", "Нет ни одного существа без дела"]}, "B": {"kk": ["Сонда атасы айтты"], "ru": ["Тогда дед сказал"]}, "D": {"kk": ["Жоғары қара"], "ru": ["Посмотри наверх"]}}, "editor_changes": ""}, {"id": "l2v2-q17", "number": 17, "text_id": "l2v2-t7", "stem": "Бос орынға қай жауап сәйкес келеді?", "options": {"A": "атаңа көп сұрақ қою керек", "B": "жәндіктерге қамқор болу керек", "C": "далада көбірек серуендеп жүру керек", "D": "жұмыс істеуге әдеттену керек"}, "key": "D", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Жұмыссыз жүрген бір жан жоқ.", "Сені де Құдай-Тағала бос жүруге жаратпаған"], "explanation": "Атасы өрмекші, құмырсқа, қарлығаштың бәрі жұмыс істеп жүргенін көрсетіп, «Жұмыссыз жүрген бір жан жоқ» дейді. «Сені де … бос жүруге жаратпаған» деген сөзден кейін еңбекке шақыру келуі керек.", "explanation_ru": "Дед показывает, что паук, муравей и ласточка — все трудятся, и говорит: «Нет ни одного существа без дела». После слов «и ты создан не для безделья» должен следовать призыв к труду.", "distractor_notes": {"A": "бала атасының сұрақтарына жауап береді, атасы оны сұрақ қоюға шақырмайды. Атасы жәндіктердің не істеп жүргеніне назар аударады.", "B": "атасы жәндіктерге қамқор бол демейді, оларды үлгі етіп көрсетеді.", "C": "атасы мен бала далада келе жатыр, бірақ атасы серуендеуге шақырмайды. Ол «бос жүру» туралы не дейтінін қайта оқы."}, "distractor_notes_ru": {"A": "Мальчик отвечает на вопросы деда, а дед не призывает его задавать вопросы. Дед обращает внимание на то, чем заняты насекомые.", "B": "Дед не призывает заботиться о насекомых — он ставит их в пример.", "C": "Дед и мальчик идут по степи, но дед не зовёт гулять. Перечитай, что он говорит о «бос жүру» (безделье)."}, "distractor_evidence": {"A": [], "B": ["— Олай болса, шырағым, ол кішкентай жәндіктер саған әбірет."], "C": ["Атасы он жасар ұл баласымен далада келе жатып, баласынан сұрады:"]}, "keywords": {"ok": {"kk": ["Жұмыссыз жүрген бір жан жоқ", "бос жүруге жаратпаған"], "ru": ["Нет ни одного существа без дела", "не для того, чтобы бездельничать"]}, "B": {"kk": ["саған әбірет"], "ru": ["тебе пример"]}, "C": {"kk": ["далада келе жатып"], "ru": ["идя по степи"]}}, "editor_changes": ""}, {"id": "l2v2-q18", "number": 18, "text_id": "l2v2-t8", "stem": "Жарқанат күндіз қалай демалады?", "options": {"A": "басын төмен салбыратып", "B": "ұяда балаларымен бірге", "C": "ағаш басында ұшып жүріп", "D": "судың бетінде қалқып жүріп"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Күндіз жеке не топтанып, бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады."], "explanation": "Жарқанаттар күндіз бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады. «Салбырату» – төмен қарай асылып тұру деген сөз.", "explanation_ru": "Днём летучие мыши отдыхают, свесив голову вниз и цепляясь лапками за камни, деревья, обрывы. «Салбырату» значит «свешивать вниз».", "distractor_notes": {"B": "жарқанат ұя салмайды.", "C": "жарқанат ұшып жүріп күндіз емес, кешке және түнде аң аулайды.", "D": "мәтінде жарқанаттың суда жүзетіні айтылмайды. Ол тасқа, ағашқа, жарға жабысып демалады."}, "distractor_notes_ru": {"B": "Летучая мышь не строит гнёзд.", "C": "Летучая мышь летает и охотится не днём, а вечером и ночью.", "D": "В тексте не сказано, что летучая мышь плавает. Она отдыхает, цепляясь за камни, деревья, обрывы."}, "distractor_evidence": {"B": ["Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді."], "C": ["Кешкі ымыртта және түнде жемтігін қалықтап ұшып жүріп аулайды."], "D": []}, "keywords": {"ok": {"kk": ["Күндіз", "бастарын төмен салбыратып", "демалады"], "ru": ["Днём", "свесив голову вниз", "отдыхают"]}, "B": {"kk": ["ұя салмайды"], "ru": ["не строит гнёзд"]}, "C": {"kk": ["Кешкі ымыртта және түнде"], "ru": ["В вечерних сумерках и ночью"]}}, "editor_changes": ""}, {"id": "l2v2-q19", "number": 19, "text_id": "l2v2-t8", "stem": "Мәтіннің соңында автор неге назар аударды?", "options": {"A": "жарқанаттың қысқы ұйқысы мен оянатын уақытына", "B": "жарқанаттың ұя салмай мекендейтін жерлеріне", "C": "жарқанаттың адамға пайдасы мен зиянына", "D": "адамдардың жарқанатқа көрсететін қамқорлығына"}, "key": "C", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Жарқанаттар өсімдіктерге зиянды әр түрлі жәндіктермен қоректеніп, ауыл шаруашылығы және орман шаруашылықтарына пайда да келтіреді.", "Сондай-ақ, түрлі аурулар (әсіресе, құтыру) таратып, адамға, жануарларға залалын да тигізеді."], "explanation": "Мәтіннің соңғы бөлігінде автор жарқанаттың екі жағын көрсетеді: зиянды жәндіктерді жеп, шаруашылыққа пайда келтіреді, бірақ ауру таратып, залал да тигізеді. «Залал» – зиян деген сөз.", "explanation_ru": "В последней части автор показывает обе стороны: летучие мыши поедают вредных насекомых и приносят пользу хозяйству, но и распространяют болезни, нанося вред. «Залал» значит «вред».", "distractor_notes": {"A": "қысқы ұйқы туралы мәтіннің бірінші бөлігінде айтылады, соңында емес.", "B": "жарқанаттың мекені туралы мәтіннің басында айтылады, соңында емес.", "D": "мәтінде адамдардың жарқанатқа қамқор болатыны айтылмайды. Соңында жарқанаттың адамға не беретіні туралы айтылады."}, "distractor_notes_ru": {"A": "О зимней спячке говорится в первой части текста, а не в конце.", "B": "О местах обитания летучих мышей говорится в начале текста, а не в конце.", "D": "В тексте не сказано, что люди заботятся о летучих мышах. В конце речь о том, что летучие мыши дают человеку."}, "distractor_evidence": {"A": ["Қазан-қараша айларында қысқы ұйқыға кетеді."], "B": ["Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді."], "D": []}, "keywords": {"ok": {"kk": ["пайда да келтіреді", "залалын да тигізеді"], "ru": ["приносят пользу", "наносят вред"]}, "A": {"kk": ["қысқы ұйқыға кетеді"], "ru": ["впадают в зимнюю спячку"]}, "B": {"kk": ["мекендейді"], "ru": ["обитает"]}}, "editor_changes": ""}, {"id": "l2v2-q20", "number": 20, "text_id": "l2v2-t9", "stem": "Мәтіннің негізгі ойы қандай?", "options": {"A": "Тойға әрқашан жаңа, әдемі киіммен бару керек.", "B": "Үй иесі қонақты әрқашан етпен сыйлауы керек.", "C": "Тойға келген әр қонақ сыйлық әкелуі керек.", "D": "Адамды киіміне қарап бағалау дұрыс емес."}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Қожанасырдың үстіндегі киімі жаман екен.", "Бұл жолы үй иесі Қожанасырды құрметтейді, төрден орын береді, ет келгенде:", "– Сен кісіні сыйламайды екенсің, киімді сыйлайды екенсің."], "explanation": "Қожанасыр жаман киіммен келгенде, оны ешкім елемеді. Тәуір киім киіп келгенде, құрметтеді. Қожанасыр «кісіні емес, киімді сыйлайды екенсің» деп, адамды киіміне қарап бағалаудың дұрыс емес екенін көрсетті.", "explanation_ru": "Когда Ходжа пришёл в плохой одежде, его никто не замечал, а когда пришёл в хорошей — его стали почитать. Словами «уважаешь не человека, а одежду» Ходжа показал, что судить о человеке по одежде неправильно.", "distractor_notes": {"A": "Қожанасыр жаңа киім кигені үшін емес, адамдарға сабақ болу үшін киімін ауыстырды.", "B": "мәтінде қонаққа ет беріледі, бірақ негізгі ой – ет туралы емес. Қожанасырдың соңғы сөзін қайта оқы.", "C": "мәтінде сыйлық туралы айтылмайды."}, "distractor_notes_ru": {"A": "Ходжа переоделся не ради новой одежды, а чтобы преподать людям урок.", "B": "В тексте гостя угощают мясом, но главная мысль не о мясе. Перечитай последние слова Ходжи.", "C": "В тексте ничего не сказано о подарках."}, "distractor_evidence": {"A": ["Сондықтан шапаныма жегізіп отырғаным!"], "B": [], "C": []}, "keywords": {"ok": {"kk": ["киімі жаман", "Бұл жолы", "құрметтейді", "кісіні сыйламайды", "киімді сыйлайды"], "ru": ["была плохой", "На этот раз", "оказывает почёт", "не уважаешь человека", "уважаешь одежду"]}, "A": {"kk": ["шапаныма жегізіп"], "ru": ["кормлю свой халат"]}}, "editor_changes": ""}]}];

app.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm") return; e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target)), btn=e.target.querySelector("button[type=submit]"), err=e.target.querySelector(".err");
  const fail=m=>{ err.textContent=m; btn.disabled=false; };
  f.email=(f.email||"").trim().toLowerCase(); btn.disabled=true; err.textContent="";
  if(!f.email||!f.password) return fail("Пошта мен құпиясөзді енгізіңіз.");
  if(authMode==="reg"){
    if(f.password.length<8) return fail("Құпиясөз кемінде 8 таңба болуы керек.");
    if(f.password!==f.password2) return fail("Құпиясөздер бірдей емес.");
    const {data:d,error}=await sb.auth.signUp({email:f.email,password:f.password});
    if(error) return fail(/NOT_ALLOWED|Database error/i.test(error.message)?"Бұл пошта мұғалімдер тізімінде жоқ.":/registered|exists/i.test(error.message)?"Бұл пошта тіркелген. «Кіру» бөлімі арқылы кіріңіз.":"Тіркелу кезінде қате шықты: "+error.message);

async function fetchAll(make){ let out=[], from=0; for(;;){ const {data:d,error}=await make().range(from,from+999); if(error) throw error; out=out.concat(d); if(d.length<1000) return out; from+=1000; } }
async function loadClasses(){
  const {data:cl,error}=await sb.from("classes").select("id,code,name,active,created_at").order("created_at");
  if(error){ app.innerHTML=`<p class="err">Қате: ${esc(error.message)}</p>`; return; }
  const {data:sc}=await sb.from("students").select("class_id");
  const cnt={}; for(const s of sc||[]) cnt[s.class_id]=(cnt[s.class_id]||0)+1;
  classes=cl.map(c=>({...c, n:cnt[c.id]||0}));
}
async function loadClass(c){
  app.innerHTML=`<p class="sub">Жүктеліп жатыр…</p>`;
  const students=await fetchAll(()=>sb.from("students").select("user_id,login,first_name,last_name,grade,city,school,created_at").eq("class_id",c.id).order("last_name"));
  const ids=students.map(s=>s.user_id);
  let attempts=[], answers=[];
  if(ids.length){
    // Сілтеме тым ұзын болмауы үшін оқушыларды 60-тан бөліп сұраймыз
    for(let i=0;i<ids.length;i+=60){ const part=ids.slice(i,i+60);
      attempts=attempts.concat(await fetchAll(()=>sb.from("attempts").select("id,user_id,bank_id,mode,started_at,finished_at,first_correct,total").in("user_id",part).order("started_at")));
      answers=answers.concat(await fetchAll(()=>sb.from("answers").select("attempt_id,user_id,bank_id,item_id,skill,level,tries,status,first_correct,updated_at").in("user_id",part).order("item_id")));
    }
  }
  data={students, attempts, answers};
}
// Әр сұрақтың соңғы жауабы (оқушы нұсқаны қайта орындаса, соңғы әрекет есептеледі)
function latestAnswers(rows){
  const at=Object.fromEntries(data.attempts.map(a=>[a.id,a])), best={};
  for(const r of rows){ const k=r.user_id+"|"+r.item_id, a=at[r.attempt_id]; const t=a?a.started_at:r.updated_at;
    if(!best[k] || t>best[k].t) best[k]={...r,t}; }
  return Object.values(best);
}
const inTrack = r => trackF==="all" || (bankById[r.bank_id]||{}).track===trackF;
const bankLabel = id => { const b=bankById[id]; if(!b) return id; const same=BANKS.filter(x=>x.track===b.track); return `${b.track==="second_language"?"Екінші тіл":"Бірінші тіл"} · ${same.indexOf(b)+1}-нұсқа`; };

function studentStats(uid){
  const rows=latestAnswers(data.answers.filter(r=>r.user_id===uid && inTrack(r)));
  const first=rows.filter(r=>r.first_correct).length;
  const fin=data.attempts.filter(a=>a.user_id===uid && a.finished_at && inTrack(a)).length;
  const last=data.answers.filter(r=>r.user_id===uid).reduce((m,r)=>r.updated_at>m?r.updated_at:m,"");
  return {n:rows.length, first, p:pct(first,rows.length), fin, last};
}

function skillBars(rows){
  if(!rows.length) return `<div class="panel empty">Әлі жауап жоқ.</div>`;
  const by={}; for(const r of rows){ if(!r.skill) continue; (by[r.skill] ||= {n:0,f:0}); by[r.skill].n++; if(r.first_correct) by[r.skill].f++; }
  const groups={}; for(const [k,v] of Object.entries(by)) (groups[k[0]] ||= []).push({k,...v,p:pct(v.f,v.n)});
  const order=Object.keys(groups).sort((a,b)=>{ const pa=Math.min(...groups[a].map(x=>x.p)), pb=Math.min(...groups[b].map(x=>x.p)); return pa-pb; });
  return `<div class="panel"><div class="bars">${order.map(g=>`<div class="grp">${esc(SKILL_GROUPS[g]||g)}</div>`+groups[g].sort((a,b)=>a.p-b.p).map(x=>
    `<div class="bar"><span>${esc(SKILLS[x.k]||x.k)}</span><div class="track"><i style="width:${x.p}%;background:${COLOR[band(x.p)]}"></i></div><span class="v">${x.p}% <small>(${x.f}/${x.n})</small></span></div>`).join("")).join("")}</div>
    <div class="lgd"><span><i style="background:var(--weak)"></i>Мән беру керек (&lt;50%)</span><span><i style="background:var(--mid)"></i>Орташа (50–74%)</span><span><i style="background:var(--good)"></i>Мықты (75%+)</span></div></div>`;
}

   <div class="filters">${trackSelect()}</div>
   <div class="twocol"><div><h2>Дағдылар</h2>${skillBars(rows)}</div>
    <div><h2>Тест әрекеттері</h2>${atts.length?`<div class="tablewrap"><table><thead><tr><th>Нұсқа</th><th>Басталды</th><th>Нәтиже</th></tr></thead><tbody>
      ${atts.map(a=>{ const n=data.answers.filter(r=>r.attempt_id===a.id).length, tot=(bankById[a.bank_id]||{items:[]}).items.length;
        return `<tr><td>${esc(bankLabel(a.bank_id))}</td><td>${fmtDT(a.started_at)}</td><td>${a.finished_at?`${a.first_correct}/${a.total} ${pill(pct(a.first_correct,a.total))}`:`<span class="meta">орындалуда: ${n}/${tot}</span>`}</td></tr>`; }).join("")}
      </tbody></table></div>`:`<div class="panel empty">Әлі тест бастамаған.</div>`}</div></div>
   <h2 style="margin-top:22px">Қателер банкі (${mist.length})</h2>
   <p class="sub">Оқушы бірінші реттен дұрыс жауап бере алмаған сұрақтар. Кейін осылар бойынша оқушыға жеке нұсқа құрастырылады.</p>
   ${mist.length?`<div class="qlist">${mist.map(r=>{ const it=itemById[r.item_id];
      return `<div class="qi"><div class="h"><b>${esc(bankLabel(r.bank_id))} · ${it.number}-сұрақ</b><span>${esc(SKILLS[it.skill]||it.skill)} · ${it.level}-деңгей</span>${stat(r)}</div>
        <div class="stem">${esc(it.stem)}</div><div class="ans">${r.tries.map(l=>`<span class="w">✗ Таңдағаны: ${esc(it.options[l]||l)}</span>`).join("")}<span class="k">✓ Дұрыс жауап: ${esc(it.options[it.key])}</span></div></div>`; }).join("")}</div>`
   :`<div class="panel empty">Қате жоқ.</div>`}`;
}

/* ---------- Оқушының құпиясөзі және өшіру ---------- */
// Оқушыға айтуға оңай құпиясөз: қысқа қазақ сөзі + 4 сан (мысалы, kitap4827)
function genPw(){ const W=["alma","kitap","dala","bala","tau","oqu","jyl","aqyl","bilim","oqushy","jaz","kun"];
  const r=crypto.getRandomValues(new Uint32Array(2)); return W[r[0]%W.length]+String(1000+r[1]%9000); }
const sbErr = e => /Could not find|PGRST202|does not exist/i.test(e.message||"") ? "Алдымен Supabase-те 002_teacher_tools.sql файлын іске қосу керек." : /NOT_ALLOWED/.test(e.message||"") ? "Бұл оқушы сіздің сыныбыңызда емес." : (e.message||"Қате");
function showPwForm(){
  const s=data.students.find(x=>x.user_id===stuId);
  document.getElementById("stuTools").innerHTML=`<div class="panel" style="margin-bottom:16px"><form class="af" onsubmit="return false">
    <label>«${esc(s.login)}» оқушысының жаңа құпиясөзі<input id="newPw" value="${genPw()}" autocomplete="off" spellcheck="false"><span class="hint">Кемінде 6 таңба. Ұсынылған құпиясөзді қалдыруға не өзгертуге болады.</span></label>
    <div class="row"><button class="btn primary sm" data-act="pwsave" type="button">Сақтау</button><button class="btn sm" data-act="pwgen" type="button">Басқасын ұсыну</button></div>
    <p class="err" id="pwMsg"></p></form></div>`;
}
async function savePw(){
  const s=data.students.find(x=>x.user_id===stuId), pw=document.getElementById("newPw").value.trim(), msg=document.getElementById("pwMsg");
  if(pw.length<6){ msg.textContent="Құпиясөз кемінде 6 таңба болуы керек."; return; }
  const {error}=await sb.rpc("teacher_set_password",{p_student:s.user_id, p_password:pw});
  if(error){ msg.textContent=sbErr(error); return; }
  const text=`Логин: ${s.login}\nЖаңа құпиясөз: ${pw}`;
  document.getElementById("stuTools").innerHTML=`<div class="panel" style="margin-bottom:16px;border-color:var(--ok)"><b style="color:var(--ok)">✓ Құпиясөз ауыстырылды</b>
    <p style="margin:8px 0">Логин: <b>${esc(s.login)}</b> · жаңа құпиясөз: <b style="font-size:18px;letter-spacing:1px">${esc(pw)}</b></p>
    <p class="meta" style="margin:0 0 10px">Оны оқушыға жеке хабарламамен жіберіңіз. Бұл құпиясөз кабинетте қайта көрсетілмейді.</p>
    <button class="btn sm" data-act="pwcopy" data-text="${esc(text)}">Көшіру</button></div>`;
}
async function deleteStudent(){
  const s=data.students.find(x=>x.user_id===stuId);
  const v=prompt(`«${s.last_name} ${s.first_name}» оқушысы және оның барлық нәтижелері біржола өшіріледі. Бұл әрекетті қайтару мүмкін емес.\n\nРастау үшін оқушының логинін жазыңыз: ${s.login}`);
  if(v===null) return; if(v.trim().toLowerCase()!==s.login){ toast("Логин сәйкес келмеді. Оқушы өшірілмеді."); return; }
  const {error}=await sb.rpc("teacher_delete_student",{p_student:s.user_id});
  if(error){ toast(sbErr(error)); return; }
  toast("Оқушы өшірілді"); await loadClass(cur); view="class"; route();
}

/* ---------- Іске қосу ---------- */
(async function(){
  if(!SB_CFG || !window.supabase){ app.innerHTML=`<p class="sub">Кабинет тек сайтта жұмыс істейді.</p>`; return; }
  sb=window.supabase.createClient(SB_CFG.url, SB_CFG.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"tilkz-auth"}});
  const {data:{session}}=await sb.auth.getSession();
  if(session) start(session.user); else renderAuth();
})();
</script>
