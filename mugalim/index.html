4-t8", "stem": "Неліктен аю қожасын ұрып жіберді?", "options": {"A": "қожасы оны көп күн бойы мүлде тамақтандырмағандықтан", "B": "қожасының бетіндегі шыбындарды қумақ болғандықтан", "C": "шынжырдан босап, орманға қашып кетпек болғандықтан", "D": "қожасына ашуланып, кек алмақ болғандықтан"}, "key": "B", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Мырзаға тыныштық бермегені үшін шыбынға қатты кейіді.", "Мен қожама қастық ойламадым, шыбынды қырайын деп едім, – деді."], "explanation": "Аю қожасына тыныштық бермеген шыбындарға ашуланып, оларды қырамын деп, қожасының бетіне табанымен салып жіберген.", "editor_changes": "Мәтін қысқартылды («қалпақтай ұшып» тіркесі, сот көрінісі алынды).", "distractor_notes": {"A": "мәтінде аюды ешкім қарамағаны айтылады, бірақ ол қожасын осы үшін ұрған жоқ.", "C": "аю шынжырды қашу үшін емес, шыбындарға ызаланып жұлқығанда үзіп алды.", "D": "аю қожасына қастық ойламағанын, керісінше оны жақсы көретінін айтады."}, "distractor_evidence": {"A": [], "C": ["Сөйтіп, аю ыза бола тұра жұлқып кеткенде шынжыры үзіліп кетіп, жүгіріп барды да, мырзаның бетіне табанымен салып келіп кеткенде, мырза сол жерде-ақ жан тапсырды дейді."], "D": ["Мен қожама қастық ойламадым, шыбынды қырайын деп едім, – деді."]}, "keywords": {"ok": {"kk": ["шыбынға қатты кейіді", "шыбынды қырайын деп едім"], "ru": []}, "C": {"kk": ["ыза бола тұра жұлқып кеткенде"], "ru": []}, "D": {"kk": ["қастық ойламадым"], "ru": []}}}, {"id": "l1v4-q19", "number": 19, "text_id": "l1v4-t8", "stem": "Әңгімеден қандай түйін шығаруға болады?", "options": {"A": "Үйде жабайы аң асыраудың ешқандай қаупі жоқ.", "B": "Ауырған адамды ешкім де мазаламауы керек.", "C": "Шыбындармен күресу үшін күш керек.", "D": "Ақылсыз достың жақсылығы да зиян әкеледі."}, "key": "D", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Мен қожама қастық ойламадым, шыбынды қырайын деп едім, – деді.", "Қожам мені баласындай күтіп, асыраушы еді."], "explanation": "Аю қожасын жақсы көрді, оған жақсылық жасағысы келді, бірақ ақылсыздығынан оны өлтіріп алды. Әңгіменің атауы да – «Ақымақ дос». Ақылсыз достың жақсылығы да зиян әкелуі мүмкін.", "editor_changes": "", "distractor_notes": {"A": "әңгіме керісінше көрсетеді: үйде асыраған аю қожасын өлтіріп алды.", "B": "әңгіменің негізгі ойы ауырған адамды мазаламау туралы емес. Әңгіменің атауына назар аудар.", "C": "әңгіме шыбынмен күресу туралы емес, ақылсыз достың әрекеті туралы."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["қастық ойламадым", "баласындай күтіп"], "ru": []}}}, {"id": "l1v4-q20", "number": 20, "text_id": "l1v4-t9", "stem": "Неліктен ересектер кейбір ерекше идеяларын жүзеге асырмады?", "options": {"A": "уақыттары жетпей қалғандықтан", "B": "тапсырманың мәнін мүлде түсінбегендіктен", "C": "балалар оларға кедергі келтіргендіктен", "D": "қорытындыны тым қатты ойлағандықтан"}, "key": "D", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Ал ересектер нәтижеге шамадан тыс мән беріп, кейбір ерекше идеяларын жүзеге асырмай тұрып-ақ қабылдамай тастаған."], "explanation": "Зерттеу бойынша ересектер нәтижеге шамадан тыс мән беріп, кейбір ерекше идеяларын жүзеге асырмай тұрып-ақ қабылдамай тастаған.", "editor_changes": "Дереккөзге сілтеме («– деп хабарлайды Aikyn.kz сайты») алынды; мәтін қысқартылды.", "distractor_notes": {"B": "мәтінде ересектердің тапсырманы түсінбегені айтылмайды. Олардың идеялары тың әрі мазмұнды болған.", "A": "мәтінде уақыттың жетпегені туралы айтылмайды.", "C": "мәтінде балалардың ересектерге кедергі жасағаны айтылмайды."}, "distractor_evidence": {"B": ["Нәтижесінде ересектердің идеялары балалардікіне қарағанда тың әрі мазмұнды болып шыққан."], "A": [], "C": []}, "keywords": {"ok": {"kk": ["нәтижеге шамадан тыс мән беріп"], "ru": []}, "B": {"kk": ["тың әрі мазмұнды"], "ru": []}}}]}, {"bank_id": "kaz-L1-v5", "track": "first_language", "source": "Автордың құрастырған нұсқасы: НЗМ үлгісінің деңгейінде, мәтіндер қазақстандық сайттардан алынған (әр мәтіннің дереккөзі көрсетілген)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {}, "style_notes": [], "texts": [{"id": "l1v5-t1", "title": "", "source_note": "KAZ.NUR.KZ: «Қызылордадан шыққан алғашқы «гроссмейстер» туралы не білеміз» – https://kaz.nur.kz/sport/about-sports/1994857-qyzylordadan-syqqan-algasqy-grossmeister-turaly-ne-bilemiz/", "numbered_paragraphs": false, "paragraphs": ["Қорқыт ата атындағы Қызылорда университетінің түлегі, шахматшы Әсел Серікбай Италияның Сардиния қаласында өткен Әлем чемпионатының күміс жүлдегері атанды. Нәтижесінде Қазақстандағы тоғызыншы, Қызылорда облысындағы тұңғыш «гроссмейстер» атанды.", "Айта кетейік, Әсел Серікбай 4 дүркін Әлем чемпионы атанып, Азия чемпионатында 7 мәрте жеңімпаз болды. Сондай-ақ, ел біріншілігінде 17 рет топ жарған.", "«Әрбір жеңісімнің артында ұстаздарымның тәрбиесі мен табанды еңбегімнің нәтижесі бар. Қорқыт ата атындағы Қызылорда университетінің түлегі болу үлкен мақтаныш», – деді Әсел Серікбай."]}, {"id": "l1v5-t2", "title": "", "source_note": "Aikyn.kz: «Шаштың ерте ағаруы тек адамның жасына байланысты емес – зерттеу» – https://aikyn.kz/310609/shashtyn--erte-ag-aruy-tek-adamnyn--zhasyna-baylanysty-emes---zertteu", "numbered_paragraphs": false, "paragraphs": ["Ақ шаштың пайда болуы тек адамның жасына байланысты емес. Оған тұқым қуалаушылықтан бастап, темекі шегу мен ағзадағы кейбір витаминдер мен микроэлементтердің деңгейіне дейін әртүрлі фактор әсер етуі мүмкін.", "Шаштың түсін меланин пигменті анықтайды. Ол шаш фолликулындағы меланоциттер арқылы өндіріледі. Жас ұлғайған сайын немесе белгілі бір факторлардың әсерінен бұл жүйенің жұмысы бұзылып, меланин азаяды. Соның салдарынан шаш сұр немесе ақ түске өзгереді.", "Сондықтан ақ шаштың пайда болуын тек витамин жетіспеушілігімен, күйзеліспен немесе басқа бір фактормен түсіндіру дұрыс емес. Мамандар оның пайда болуына бірнеше фактор қатар әсер етуі мүмкін екенін айтады."]}, {"id": "l1v5-t3", "title": "Мұңсыз адам", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Мұңсыз адам» – https://bilim-all.kz/article/9593", "numbered_paragraphs": false, "paragraphs": ["Бір патшаның ханымы ауру болып, жұрттан неше-неше дәрігер жидырып, ем еткізсе де ешбір дауасы табылмады. Патша мұнан соң бақсы-балгерлерді жидырып жарлық айтты:", "– Балдарыңызды ашып, осы ханымға не ем болатынын табыңыздар, егер таппасаңыздар бәріңізді де астырып өлтіремін, – деп.", "Бақсы-балгерлер қорқып, сасып тұрғанда, ішінде біреуі айтты: «Мен бұл аурудың емін таптым». Сол сөзбен мұны ханға алып келісті. Бұл балгер ханға айтты:", "– Дүниеде мұңсыз кісі тауып, соның көйлегімен қақтырсаңыз, бұл ауруға сол ем екен.", "Патша жер жүзіне жасауылдарын таратып, қанша іздесе де мұңсыз адам табылмады. Біреу бай, не бақты болса баласы жоқ, екеуі де болса не қатыны, не баласының мейірімі жоқ, болмаса біреулерден көрген кемшілігі бар, болмаса не өзі, не қатын-балалары сырқау, ең болмаса сол айтылғанның бәрін құдай берген болса, қанағат жоқ болғаннан уайымы көп – тағы ілгерірек болмадым деп.", "Күдер үзіп, мұңсыз адам жоқ екен деп қойған кезде, бір күн патшаның баласы келе жатса, бір кедей адам даладағы бұзылған тамның түбіне келіп айтады: «Бүгін жұмысымды бітірдім, қарнымды тойдырдым, енді не уайымым бар, кел жатып ұйықтайын», – деп, тамның қасындағы жиынды салам үстіне жығылды да жатты. Сәлден соң қорылдап ұйықтап та қалды.", "Патшазада мұны көріп, мұңсыз кісі таптым деп патшаға хабар берді. Патша қуанып, жасауылдарын жіберді, ол мұңсызды алып келіңіз деп. Алып келген соң, бұл адамға алтын-күміс беріп, енді көйлегіңді бер деп қараса, мұңсыздың үстінде көйлегі де жоқ екен."]}, {"id": "l1v5-t4", "title": "", "source_note": "KAZ.NUR.KZ: «Әйгілі Google компаниясына тағы бір қазақстандық жұмысқа тұрды» – https://kaz.nur.kz/society/1811634-jgili-google-kompaniasyna-tagy-bir-kazakstandyk-zmyska-trdy-foto/", "numbered_paragraphs": true, "paragraphs": ["Әлемге әйгілі Google компаниясы тағы бір қазақстандықпен толықты. Шығыс Қазақстан облысының тумасы Жасан Байпақбаев аталмыш бірлестікке инженер маманы болып жұмысқа тұрған.", "«Шығыс Қазақстан облысының Күршім ауданы, Қаратоғай ауылында туып өстім. Мектеп бітірген соң, Алматыдағы Сүлейман Демирел атындағы университеттің «Ақпараттық жүйелер» мамандығына оқуға түстім. Бакалавр дәрежесін алып, Қазақ-британ техникалық университетіне дәл сол мамандық бойынша білімімді магистратурада жалғастырдым.", "Google секілді әйгілі компанияға жұмысқа кіру менің мамандығымда оқыған әрбір студенттің арманы екені рас. Оған қоса, ол жерге жұмысқа орналасу үрдісі де көпке мәлім. Жалпы бұған дейін АҚШ-та стартап саласында аздап еңбек еткенмін. Сол себепті, ақпараттық технологияда тәжірибе бар деуге болады», – деді жас жігіт.", "Қазақстандықтың сөзінше, Google-ға жұмысқа тұрған соң қызметкердің сол ортаға тез бейімделуі үшін арнайы дәрістер ұйымдастырылып тұрады екен. «Дәрісте компанияның құрылу тарихынан бастап, онда жұмыс істеу, қызметкердің мақсаты пен міндеті, ортаға тез сіңіп кету жолындағы пайдалы ақпараттар беріледі. Мен үшін ол дәрістің пайдасы көп болды», – дейді ол.", "«Көбіне академиялық білімге назар аударған жөн. Ғылымға өте жақын болу керек. Сол сияқты есеп шығару қабілеті де артық етпейді. Яғни алгоритм ережелерін терең білу маңызды. Одан бөлек, тәжірибеден өту қажет, онсыз болмайды», – дейді Жасан Байпақбаев."]}, {"id": "l1v5-t5", "title": "Атыраулық оқушылар «ақылды көзілдірік» ойлап тапты", "source_note": "24KZ: «Атыраулық оқушылар «ақылды көзілдірік» ойлап тапты» – https://24.kz/kz/zha-aly-tar/kogam/680440-atyrauly-o-ushylar-a-yldy-k-zildirik-ojlap-tapty", "numbered_paragraphs": false, "paragraphs": ["Хайдар мен Қайырхан ойлап тапқан ақылды көзілдірік жасанды интеллект арқылы жұмыс істейді. Қолданушыға құлаққап арқылы нұсқау беріп, алдындағы кедергілер туралы ескертіп отырады.", "Олардың жобасы Jasscience-2024 байқауында үздік атанып, әлемнің ең озық 100 инновациясының қатарына енді. Осылайша, жас өнертапқыштар жаһанның кез келген университетінде тегін оқу мүмкіндігіне ие болды.", "(1) Хайдар мен Қайырхан ақылды көзілдірікті дайындауға былтыр кіріскен. (2) Содан бері ұстаздарынан кеңес алып, жобаны дамытып жүр. (3) Бұған қоса көзі нашар көретін жандармен сұхбаттасып, олардың да қалауын ескерген.", "(4) Оқушылар қазір «ақылды көзілдіріктің» екінші нұсқасын әзірлеп жатыр. (5) Олар ыңғайлы әрі көпфункционалды құрылғыны дайындау үшін сабақтан кейінгі уақыттарын шеберханада өткізеді.", "Оқушылардың ынтасы жоғары. «Өнертапқыш балалардың қолынан шыққан туынды болашақта мүгедектігі бар жандардың қажетіне жарайды», – дейді ұстаздары."]}, {"id": "l1v5-t6", "title": "Шетелдегі ғылыми тағылымдама: нәтижесі қандай?", "source_note": "Egemen Qazaqstan: «Шетелдегі ғылыми тағылымдама: нәтижесі қандай?» – https://egemen.kz/article/380434", "numbered_paragraphs": true, "paragraphs": ["Айнұр Сләмғажы: – Тағылымдаманың маңызы шетелдік ғалымдармен танысу, байланыс орнату, тәжірибе алмасу керемет мүмкіндік болды. Мені ерекше қуантқан жайт, біз тағылымдамадан өтіп жатқан Джордж Вашингтон университетінде өзім еңбектерін, кітап, мақалаларын докторантурада оқып жүрген кезімде, одан кейін де талай оқып, ғылыми жұмыстарымда басшылыққа алған, сілтеме жасаған Себастьен Пейрус, Марлен Ларуэль сынды ғалымдармен жүзбе-жүз танысу, олар ұйымдастырған дөңгелек үстел, конференцияларына қатысу мүмкіндігі болды. Екеуімен де жүргізіп жатқан зерттеуімді талқылап, пікір алмастым.", "Бейімбет Дәрібаев: – Сондай-ақ қазақ мәдениетін өз әріптестеріммен бөлісуге тырыстым. Оларға дәстүрлі қазақ тағамдарын таныстырып, ұлттық мерекелер мен дәстүріміздің маңыздылығын түсіндірдім. Бұл мәдени алмасу өзара түсіністікке ықпал етіп, кәсіби ынтымақтастықтан тыс қарым-қатынасты нығайтты. Тағылымдама маған терең әсер қалдырды.", "Шырын Қадылқызы: – Тағылымдама барысында Жапония, Корея, Сауд Арабиясы және басқа да елдерден келген студенттермен танысып, олардың мәдениеті мен білім жүйелері туралы біліп, түрлі көзқараспен таныстым. Бұл халықаралық орта дүниетанымымның кеңеюіне үлкен ықпал етті.", "Достілек Дәуітбек: – АҚШ-та ғылымды қаржыландыру деңгейі өте жоғары. Ғылыми зерттеулер мемлекеттік гранттар, жекеменшік компаниялардың қолдауы және венчурлық капитал арқылы қаржыландырылады. Елімізде ғылым саласында бірқатар күрделі мәселелер бар. Ғалымдардың еңбекақысы төмен, ал университеттерде оқытушылардың жүктемесі көп."]}, {"id": "l1v5-t7", "title": "", "source_note": "24KZ: «Қазақ тіліне құштар америкалық бойжеткен Қазақстанға келуді армандайды» – https://24.kz/kz/zha-aly-tar/m-denie/654151-aza-tiline-shtar-amerikaly-bojzhetken-aza-stan-a-keludi-armandajdy", "numbered_paragraphs": false, "paragraphs": ["Шетелде қазақ тіліне қызығушылық танытып, үйренушілер қатары жыл сайын артып келеді.", "Солардың бірі – америкалық бойжеткен Кэмерон Фарр. Оның қазақ тілін үйреніп жүргеніне 5 жылдай болыпты. Жақсы меңгеріп алған соң америкалық балаларды оқытуға ниетті. Тіпті бойжеткен өзінің аты-жөнін Айбала Құдайбергенқызы деп қазақшалап алған. Әлеуметтік желіде тіл үйрену тәсілдерін үйретеді және қаралымы да жоғары.", "Бала күнінен тіл үйренуге құштар Айбала қазір немісше, испанша, французша, арабша, сонымен қатар жапон, қытай, корей тілдерін біледі. Ал оның қазақ тіліне деген қызығушылығын Қазақстан жайлы кітап оятқан. Осылайша, ол ғаламтор арқылы қазақ даласының мәдениетімен танысып, қазақша әндер тыңдауды да әдетке айналдыра бастаған. Полиглот қыз енді елімізге саяхаттап барып қайтуды ойлап жүр.", "«Бұл есімді мағынасы жағынан атыма жақын болғандықтан ұнатып алдым», – дейді полиглот қыз. Бірақ Кэмерон отбасында ата-анасы да, бауыры да қазақша білмейтінін айтады.", "Айбала өзі білетін көптеген тілдердің арасында қазақ тілі мен мәдениетіне айрықша ден қойып, зерттеп жүргенін үнемі мақтаныш тұтады. Бойжеткен қазақтың қазыналы құндылықтарын, ұлттық мұраларын, әдет-ғұрпы мен салт-дәстүрін және дархан даланың әсем табиғатын көзбен көретін сәтті асыға күтіп жүргенін айтады."]}, {"id": "l1v5-t8", "title": "Салақтық", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Салақтық» – https://bilim-all.kz/article/9602", "numbered_paragraphs": false, "paragraphs": ["Кәрім деген мешер өзі жұмысқа тәуір жігіт те болса, жуынып, кірсіз көйлек киіп, таза жүрумен ісі жоқ еді. Әркім айтушы еді:", "– Саған не болды, Кәрім, бойыңнан кіріңді ағызып жүргенше, жуынсаң болмай ма? – деп.", "Сөйтіп жүріп, тұлабойын шиқан қаптап және қотыр болды. Бұл күйде құрысып-тырысып жатқанында, әркім сұрайды:", "– Рас, Кәрім, Құдай-Тағала таза жүрмеген былғаныш кісіні сүймейді, тым болмаса жұмасына бір моншаға түсіп, не болмаса үйінде сабынмен жуынуды әдет етсең, бұ бәлеге душар болмас едің.", "Сонымен, Кәрімді ауру жататын үйге алып барып, таза жуындырып, таза киім киіндіріп, ем қылған соң аз ба, көп пе жатып жазылды. Мұнан соң, Кәрім бір зауытқа барып жалданыпты. Өздеріңе де белгілі шығар, зауытта нәрсе бояйтын бояулардың бәрі де у болады. Бір күні қожасы Кәрімге бір бояуды былғап қой деп беріпті. Былғап отырып-отырып, кәдімгі үйренген қалыбынша, қолын жумастан барып, тамаққа отырып нан жепті. Қолындағы бояудың жұғынының бәрі де жеп отырған нанына жабысып отырғанда, бір мезгілде Кәрімнің іші бүрісіп, ауыра бастапты. Әрлі-бері, олай-бұлай аунақшып, біраз жатып, Кәрім ұзамай-ақ жан тапсырыпты. Әлгі бояу у бояу екен."]}, {"id": "l1v5-t9", "title": "", "source_note": "Aikyn.kz: «Ми 30 жастан кейін қартая бастай ма: ғалымдар зерттеу нәтижесін жариялады» – https://aikyn.kz/312584/mi-30-zhastan-keyin-k-artaya-bastay-ma--g-alymdar-zertteu-n-tizhesin-zhariyalady", "numbered_paragraphs": false, "paragraphs": ["Адамның миы жас ұлғайған сайын ғана емес, ересек өмірдің алғашқы кезеңдерінен бастап өзгеріске ұшырайды. Ғалымдардың зерттеулері мидың кейбір құрылымдары мен қызметтерінде 30 жас шамасында да өзгерістер байқалатынын көрсетеді. Бірақ бұл жаста адамның ақыл-ой қабілеті күрт төмендей бастайды деген сөз емес.", "Мамандар күнделікті ұмытшақтықты бірден мидың қартаюымен байланыстыруға болмайтынын ескертеді. Адамның зейіні мен есте сақтауына күйзеліс, шаршау, ұйқы тапшылығы және эмоционалдық жағдай да әсер етеді. Сондықтан кейде таныс адамның есімін ұмыту немесе бір затты қайда қойғанын есіне түсіре алмау міндетті түрде ауыр дерттің белгісі емес."]}], "items": [{"id": "l1v5-q1", "number": 1, "text_id": "l1v5-t1", "stem": "Әсел Серікбай ел біріншілігінде неше рет жеңіске жетті?", "options": {"A": "4 рет", "B": "7 рет", "C": "9 рет", "D": "17 рет"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Сондай-ақ, ел біріншілігінде 17 рет топ жарған."], "explanation": "Мәтінде Әсел Серікбайдың ел біріншілігінде 17 рет топ жарғаны айтылады. «Топ жару» – жарыста бәрінен озып, жеңу.", "editor_changes": "Мәтін қысқартылды; дереккөзге сілтеме («деп жазады KAZ.NUR.KZ тілшісі…») алынды; «Сондықтан, әрбір» → «Әрбір».", "distractor_notes": {"A": "4 рет ол Әлем чемпионы атанған. Сұрақ ел біріншілігі туралы.", "B": "7 рет ол Азия чемпионатында жеңген. Сұрақ ел біріншілігі туралы.", "C": "тоғыз – Әселдің Қазақстандағы нешінші гроссмейстер екенін көрсететін сан."}, "distractor_evidence": {"A": ["Айта кетейік, Әсел Серікбай 4 дүркін Әлем чемпионы атанып, Азия чемпионатында 7 мәрте жеңімпаз болды."], "B": ["Айта кетейік, Әсел Серікбай 4 дүркін Әлем чемпионы атанып, Азия чемпионатында 7 мәрте жеңімпаз болды."], "C": ["Нәтижесінде Қазақстандағы тоғызыншы, Қызылорда облысындағы тұңғыш «гроссмейстер» атанды."]}, "keywords": {"ok": {"kk": ["ел біріншілігінде 17 рет топ жарған"], "ru": []}, "A": {"kk": ["4 дүркін Әлем чемпионы"], "ru": []}, "B": {"kk": ["Азия чемпионатында 7 мәрте"], "ru": []}, "C": {"kk": ["Қазақстандағы тоғызыншы"], "ru": []}}}, {"id": "l1v5-q2", "number": 2, "text_id": "l1v5-t2", "stem": "Мамандар шаштың ағаруы туралы не дейді?", "options": {"A": "оған бірнеше себеп бірге ықпал етуі мүмкін екенін", "B": "шаш тек адамның жасы ұлғайған кезде ғана ағаратынын", "C": "ағарған шашты тек витаминмен ғана емдеуге болатынын", "D": "меланин көбейген кезде шаштың ағара бастайтынын"}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Сондықтан ақ шаштың пайда болуын тек витамин жетіспеушілігімен, күйзеліспен немесе басқа бір фактормен түсіндіру дұрыс емес.", "Мамандар оның пайда болуына бірнеше фактор қатар әсер етуі мүмкін екенін айтады."], "explanation": "Мамандар шаштың ағаруын бір ғана себеппен түсіндіруге болмайды дейді: оған бірнеше фактор қатар әсер етуі мүмкін.", "editor_changes": "Мақаланың үш абзацы ғана алынды, зерттеулер туралы бөлік қысқартылды.", "distractor_notes": {"B": "мәтінде керісінше айтылған: ақ шаш тек жасқа байланысты емес.", "C": "мәтінде шашты емдеу туралы айтылмайды. Витамин жетіспеушілігі себептердің бірі ғана.", "D": "мәтінде керісінше айтылған: меланин азайғанда шаш ағарады."}, "distractor_evidence": {"B": ["Ақ шаштың пайда болуы тек адамның жасына байланысты емес."], "C": [], "D": ["Жас ұлғайған сайын немесе белгілі бір факторлардың әсерінен бұл жүйенің жұмысы бұзылып, меланин азаяды.", "Соның салдарынан шаш сұр немесе ақ түске өзгереді."]}, "keywords": {"ok": {"kk": ["бірнеше фактор қатар әсер етуі мүмкін"], "ru": []}, "B": {"kk": ["тек адамның жасына байланысты емес"], "ru": []}, "D": {"kk": ["меланин азаяды", "ақ түске өзгереді"], "ru": []}}}, {"id": "l1v5-q3", "number": 3, "text_id": "l1v5-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Ханымды емдеген дәрігерлер оның ауруына шипа таба алмады.\n2. Мұңсыз адамды патшаның өзі тауып алды.", "options": {"A": "екеуі де бұрыс", "B": "екеуі де дұрыс", "C": "тек біріншісі", "D": "тек екіншісі"}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Бір патшаның ханымы ауру болып, жұрттан неше-неше дәрігер жидырып, ем еткізсе де ешбір дауасы табылмады.", "Патшазада мұны көріп, мұңсыз кісі таптым деп патшаға хабар берді."], "explanation": "Тек бірінші тұжырым дұрыс: талай дәрігер ем жасаса да, ханымның ауруына дауа табылмады. Екінші тұжырым қате: мұңсыз адамды патшаның өзі емес, баласы көріп, патшаға хабар берді.", "editor_changes": "Сызықшалар мен тырнақшалар бірізге келтірілді («ұйықтайын», – деп); бетте мәтіннен кейін тұрған оқырман пікірі алынды.", "distractor_notes": {"A": "бірінші тұжырым мәтінде бар. Әңгіменің басын қайта оқы.", "B": "екінші тұжырымды мәтінмен тағы салыстыр: мұңсыз адамды кім көрді?", "D": "бірінші тұжырым мәтінде бар, ал екіншісі мәтінге сәйкес келмейді. Мұңсыз адамды кім тапқанын қайта оқы."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["ешбір дауасы табылмады", "Патшазада мұны көріп"], "ru": []}}}, {"id": "l1v5-q4", "number": 4, "text_id": "l1v5-t3", "stem": "Мұңсыз адамның үстінде көйлегі де болмауы нені аңғартады?", "options": {"A": "Патшаның жасауылдары өз міндетін нашар атқарғанын.", "B": "Бақыт байлық пен дәулетке байланысты емес екенін.", "C": "Кедей адамның патшаның сыйлығын алғысы келмегенін.", "D": "Балгердің айтқан емі ханымға шынымен көмектескенін."}, "key": "B", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Алып келген соң, бұл адамға алтын-күміс беріп, енді көйлегіңді бер деп қараса, мұңсыздың үстінде көйлегі де жоқ екен.", "Бүгін жұмысымды бітірдім, қарнымды тойдырдым, енді не уайымым бар, кел жатып ұйықтайын"], "explanat п оятқан."], "explanation": "Айбаланың қазақ тіліне деген қызығушылығын Қазақстан туралы кітап оятқан.", "editor_changes": "", "distractor_notes": {"A": "қазақша әндерді ол қызығушылығы оянғаннан кейін тыңдай бастаған.", "C": "Айбала Қазақстанда әлі болған жоқ, тек барғысы келеді.", "D": "мәтінде достарының кеңесі туралы айтылмайды."}, "distractor_evidence": {"A": ["Осылайша, ол ғаламтор арқылы қазақ даласының мәдениетімен танысып, қазақша әндер тыңдауды да әдетке айналдыра бастаған."], "C": ["Полиглот қыз енді елімізге саяхаттап барып қайтуды ойлап жүр."], "D": []}, "keywords": {"ok": {"kk": ["Қазақстан жайлы кітап оятқан"], "ru": []}, "A": {"kk": ["Осылайша", "әдетке айналдыра бастаған"], "ru": []}, "C": {"kk": ["барып қайтуды ойлап жүр"], "ru": []}}}, {"id": "l1v5-q18", "number": 18, "text_id": "l1v5-t8", "stem": "Кәрім неден қайтыс болды?", "options": {"A": "денесін шиқан мен қотыр басқандықтан", "B": "зауыттағы қожасы оны қатты ұрып жібергендіктен", "C": "моншаға түсіп, суық тигізіп алғандықтан", "D": "бояу жұққан қолын жумай, ас ішкендіктен"}, "key": "D", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Былғап отырып-отырып, кәдімгі үйренген қалыбынша, қолын жумастан барып, тамаққа отырып нан жепті.", "Әлгі бояу у бояу екен."], "explanation": "Кәрім әдетінше у бояуды былғаған қолын жумай, нан жеген. Бояу нанға жұғып, Кәрім уланып қайтыс болды.", "editor_changes": "Сызықшалар бірізге келтірілді.", "distractor_notes": {"A": "шиқан мен қотырдан Кәрім емделіп, жазылған.", "B": "қожасы оған тек бояуды былғауды тапсырған, ұрған жоқ.", "C": "Кәрім моншаға түспеген. Жұрт оған моншаға түсуге кеңес берген."}, "distractor_evidence": {"A": ["Сонымен, Кәрімді ауру жататын үйге алып барып, таза жуындырып, таза киім киіндіріп, ем қылған соң аз ба, көп пе жатып жазылды."], "B": ["Бір күні қожасы Кәрімге бір бояуды былғап қой деп беріпті."], "C": []}, "keywords": {"ok": {"kk": ["қолын жумастан барып", "у дықтан", "D": "оған уайым мен қажу да ықпал ететіндіктен"}, "key": "D", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Адамның зейіні мен есте сақтауына күйзеліс, шаршау, ұйқы тапшылығы және эмоционалдық жағдай да әсер етеді."], "explanation": "Мамандардың айтуынша, адамның есте сақтауына күйзеліс, шаршау, ұйқы тапшылығы да әсер етеді. Сондықтан ұмытшақтық әрдайым мидың қартаюының белгісі емес.", "editor_changes": "Дереккөзге сілтеме («– деп хабарлайды Aikyn.kz сайты») алынды; мәтін қысқартылды.", "distractor_notes": {"A": "мәтінде керісінше айтылған: 30 жас шамасында мидың кейбір қызметтерінде өзгерістер байқалады.", "B": "мәтінде ұмытшақтықтың тек балаларда кездесетіні айтылмайды.", "C": "мәтінде керісінше айтылған: ми ересек өмірдің алғашқы кезеңдерінен бастап өзгереді."}, "distractor_evidence": {"A": ["Ғалымдардың зерттеулері мидың кейбір құрылымдары мен қызметтерінде 30 жас шамасында да өзгерістер байқалатынын көрсетеді."], "B": [], "C": ["Адамның миы жас ұлғайған сайын ғана емес, ересек өмірдің алғашқы кезеңдерінен бастап өзгеріске ұшырайды."]}, "keywords": {"ok": {"kk": ["күйзеліс, шаршау", "әсер етеді"], "ru": []}, "A": {"kk": ["30 жас шамасында да өзгерістер"], "ru": []}, "C": {"kk": ["алғашқы кезеңдерінен бастап"], "ru": []}}}]}, {"bank_id": "kaz-L2-v3", "track": "second_language", "source": "Автордың құрастырған нұсқасы: НЗМ «Қазақ тілі (екінші тіл)» үлгісінің деңгейінде, мәтіндер қазақстандық сайттардан алынған", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {"Аталған дрон өрістегі төрт түлікті санап, түгендейді, ауырып тұрған малды анықтайды, тіпті отардан бөлініп қалған қойды тауып береді.": "Этот дрон пересчитывает скот на пастбище, выявляет больных животных и даже находит овцу, отбившуюся от отары.", "Ең бастысы, бұл құрылғы кез келген ауа райына төтеп береді.": "Самое главное — это устройство выдерживает любую погоду.", "Жаңа жобаны дайындауға екі ай уақыт кеткен.": "На подготовку нового проекта ушло два месяца.", "Әрине, оны темірбетонды ауыр көпірлерге қолдануға келмейді.": "Конечно, её нельзя применять для тяжёлых железобетонных мостов.", "Ал оның қырағы иті Джесси болса, қауіп төнгенін бірден сезіп, күтпеген жерден қасқырдың алдынан жүгіріп шығады.": "А его бдительная собака Джесси сразу почувствовала опасность и неожиданно выбежала навстречу волку.", "Ол жыртқышқа қарсы шығып, Емельянды ажалдан арашалап қалған.": "Она выступила против хищника и спасла Емельяна от гибели.", "Ал қансыраған ит орманнан табылып, төрт күннен кейін ауыр жарақаттардан өлген.": "А раненую собаку нашли в лесу, через четыре дня она умерла от тяжёлых ран.", "Себебі, ол өзіне жақындап қалған қасқырды мүлде байқамапты.": "Потому что он совсем не заметил приблизившегося к нему волка.", "Адамдардың жақындағанын сезген қасқыр қаша жөнелген.": "Почуяв приближение людей, волк убежал.", "Иттің қожайыны үй маңына бұған дейін қасқырлар бұрын-соңды мұншалық жақындамағанын айтады.": "Хозяин собаки говорит, что раньше волки никогда так близко к дому не подходили.", "Жер қозғалар алдында олардың тіршілігі өзгеріске ұшырап, түні бойы қарбаласқа түсетіні анықталған.": "Установлено, что перед землетрясением их жизнь меняется и они всю ночь суетятся.", "Бір құмырсқа өз салмағынан 10 есе ауыр салмақты көтере алады.": "Один муравей может поднять груз в 10 раз тяжелее собственного веса.", "Жауынгер құмырсқалар адамдар секілді өз отарларын қорғайды.": "Муравьи-воины, как люди, защищают свои колонии.", "Құмырсқалар азық табу үшін аңшы құмырсқаларды жібереді.": "Чтобы найти пищу, муравьи отправляют муравьёв-охотников.", "Құмырсқалар күндіз қоректеніп, түнде ұйықтайды.": "Муравьи питаются днём, а ночью спят.", "Бұлар жүрген іздерінде құмырсқа қышқылынан тамшы қалдырады, сол иіс бойынша адаспай табады.": "На своём пути они оставляют капли муравьиной кислоты и по этому запаху безошибочно находят дорогу.", "Кейде отарлар арасында адамдар секілді соғысады.": "Иногда между колониями, как у людей, бывают войны.", "Әкем инженер-техник, анам университетте ағылшын тілі пәнінің оқытушысы болып жұмыс істейді.": "Мой отец — инженер-техник, мама работает преподавателем английского языка в университете.", "Сөйтіп, 15 жасымда кәсіби деңгейде сайттарды бағдарламалап, алғашқы табысымды IT арқылы таба бастадым.": "Так в 15 лет я начал профессионально программировать сайты и получил первый заработок в IT.", "Барлығы – инженерлер мен әзірлеушілер және көпшілігі Қазақстаннан шыққан жас мамандар.": "Все они — инженеры и разработчики, и большинство — молодые специалисты из Казахстана.", "– Біздің командада қазір 6 адам бар.": "– Сейчас в нашей команде 6 человек.", "– Мен Алматыда туып-өстім.": "– Я родился и вырос в Алматы.", "Мұнда қазақ жастарын еңбекқор, тез үйренетін, техникалық жағынан мықты және жауапкершілігі жоғары мамандар ретінде бағалайды.": "Здесь казахстанскую молодёжь ценят как трудолюбивых, быстро обучающихся, технически сильных и ответственных специалистов.", "Әзірге АҚШ-та тұрақтап, негізгі жұмысты осы жерде жалғастыруды жоспарлап отырмыз.": "Пока мы планируем обосноваться в США и продолжать основную работу здесь.", "Ең бастысы, нәтижеге еңбек етіп, тоқтап қалмау қажет.": "Главное — трудиться ради результата и не останавливаться.", "Жерлестеріміз көбірек жасанды интеллект пен IT саласына қызықса дейміз.": "Хотелось бы, чтобы наши земляки больше интересовались искусственным интеллектом и IT.", "4. – Елге оралып, жаңа жобаларды жүзеге асыру ойда бар ма?": "4. – Есть ли в планах вернуться на родину и реализовать новые проекты?", "1. – Командаларыңызда қанша адам бар? Оның қаншасы қазақ жастары?": "1. – Сколько человек в вашей команде? Сколько из них казахстанская молодёжь?", "Злиха ахылап-ухілеп шаршадым деп, Бәтима күліп, әзілдесіп келе жатады.": "Злиха охала и стонала, что устала, а Батима шла, смеясь и шутя.", "— Мен жәшігімнің ішіне ауырды жеңілдететін бір шөп салдым, — деді Бәтима.": "— Я положила в свой ящик траву, которая облегчает тяжесть, — сказала Батима.", "— Ол шөп сенің қолыңа түспей ме деп қорқамын, аты: сабыр деген екен.": "— Боюсь, что эта трава тебе не достанется: её название — терпение.", "— Ай, ондай болса шөбіңнің атын айтшы, мен де ауырымды жеңілдетейін, — деді Злиха.": "— Ах, если так, скажи название своей травы, я тоже облегчу свою ношу, — сказала Злиха.", "Злиха мен Бәтима деген біреудің қызметінде тұрған екі қыз бала төбесіне бір-бір жәшік жеміс көтеріп қалаға келе жатыпты-мыс.": "Две девочки, Злиха и Батима, служившие у одного человека, шли в город, неся на голове по ящику фруктов.", "— Сынып қалған ескі тағаны алып неғылайын, — деді.": "— Зачем мне брать старую сломанную подкову? — сказал он.", "Қаланың шетінде темірші ұсталар бар екен, соған жеткен соң, әкесі қайырылып, манағы тағаны соларға үш тиынға сатты.": "На окраине города были кузнецы; дойдя до них, отец продал им ту подкову за три копейки.", "Артында келе жатқан бала да тым-ақ қызығып келеді екен, жерге түскен шиені жалма-жан жерден алып, аузына салды.": "Мальчик, шедший сзади, очень хотел вишен: он тут же поднял упавшую вишню и положил в рот.", "Ең соңында әкесі тоқтап тұрып айтты:": "Наконец отец остановился и сказал:", "— Көрдің бе, мана тағаны жамансынып жерден бір ғана иіліп көтеріп алуға еріндің, енді сол тағаға алған шиенің жерге түскенін аламын деп бір еңкеюдің орнына он еңкейдің.": "— Видишь, ты поленился один раз нагнуться за подковой, а теперь, собирая упавшие вишни, купленные на эту подкову, нагнулся десять раз вместо одного.", "Әкесі үндемеді, тағаны өзі иіліп алды да, жүре берді.": "Отец промолчал, сам нагнулся, поднял подкову и пошёл дальше.", "Тышқанға ұқсас кішілеу кеміргіш.": "Небольшой грызун, похожий на мышь.", "Мұның атымен Қазақстан зоология журналы алынып отыр, онда жаңа және аз зерттелген жануарлар туралы мақалалар жарияланады.": "Его именем назван зоологический журнал Казахстана, в котором публикуются статьи о новых и малоизученных животных.", "Ғалымдар үшін оның тіршілік жағдайы жұмбақ болып отыр, ол туралы мәліметтер тырнақтап жиналуда.": "Его образ жизни остаётся для учёных загадкой, сведения о нём собираются по крупицам.", "«Бұл жолы да Қожанасыр қазанымның ішіне бір нәрсе салып әкелер», — деп ойлайды араны ашылған бай.": "«Может, и в этот раз Қожанасыр что-нибудь положит в мой казан», — думает жадный бай.", "— Байеке, сөкпеңіз! Туа білген қазан өле де біледі, — дейді.": "— Бай-ага, не ругайтесь! Казан, который умеет рожать, умеет и умирать, — говорит он.", "Бай сөзден жығылып, үйіне қайтып кетіпті.": "Бай не нашёл что ответить и ушёл домой.", "Сондықтан Қожанасыр көршілес отырған байдың үлкен қазанын сұрайды.": "Поэтому Қожанасыр просит большой казан у соседа-бая."}, "style_notes": [], "texts": [{"id": "l2v3-t1", "title": "", "source_note": "Egemen Qazaqstan: «Ғалам ғажаптары: Робот-шопан» – https://egemen.kz/news/article378066", "numbered_paragraphs": false, "paragraphs": ["Ақтаулық оқушылар Артем Ахметханов пен Мәдина Абдулла төрт түлікті жоғарыдан бақылайтын робот-шопан ойлап тапты. «Кью Агро» деп аталатын құрылғы өзін-өзі қуаттап, адамның көмегінсіз ұша береді.", "Аталған дрон өрістегі төрт түлікті санап, түгендейді, ауырып тұрған малды анықтайды, тіпті отардан бөлініп қалған қойды тауып береді. Ең бастысы, бұл құрылғы кез келген ауа райына төтеп береді."]}, {"id": "l2v3-t2", "title": "", "source_note": "24KZ: «Қостанай облысының оқушысы «Ақылды көпір» ойлап тапты» – https://24.kz/kz/zha-aly-tar/kogam/696016-k-ostanaj-oblysynyn-ok-usysy-ak-yldy-kopir-ojlap-tapty", "numbered_paragraphs": false, "paragraphs": ["Қостанай облысының 10-сынып оқушысы тасқын кезінде көпірді қираудан сақтайтын инновациялық шешім ұсынды.", "Оның «Ақылды көпір» атты жобасы республикалық өнертапқыштар байқауында бірінші орынды иеленді. Жас өнертапқыштың идеясы өткен жылғы су тасқыны кезінде пайда болған. Ол арнайы бағдарламамен жұмыс істейтін өлшеуіш құралдар арқылы судың деңгейі артқанда көпірдің автоматты түрде жоғары көтерілетін жүйесін ойлап тапты. Жаңа жобаны дайындауға екі ай уақыт кеткен.", "Виктор Рыжков, оқушы: – Бұл жүйе қозғалмалы көпір, тіреуіш, реттегіш құрылғы және датчиктерден тұрады. Әрине, оны темірбетонды ауыр көпірлерге қолдануға келмейді. Тым қымбатқа түседі. Ал жеңіл көпірлерге әбден жарайды."]}, {"id": "l2v3-t3", "title": "", "source_note": "KAZ.NUR.KZ: «Ит қасқырға қарсы шығып, 10 жасар қожайынын құтқарып қалды» – https://kaz.nur.kz/kaleidoscope/1891456-10-zasar-balany-kaskyrdan-ktkaryp-kalgan-it-z-zanyn-krban-etti/", "numbered_paragraphs": false, "paragraphs": ["Ресей субъектісі болып табылатын Коми Республикасында 10 жасар баланы иті қасқырдан құтқарып қалды. Руслан Губар есімді азаматтың айтуынша, оның үш баласы аулада тығылыспақ ойнап жүрген.", "Бір сәтте кішкентай Емельян аула қақпасынан шығып, қар үйіндісінің артына жасырынуды ұйғарыпты. Жеткіншек өзіне қауіп төніп тұрғанынан мүлде бейхабар болған. Себебі, ол өзіне жақындап қалған қасқырды мүлде байқамапты.", "Ал оның қырағы иті Джесси болса, қауіп төнгенін бірден сезіп, күтпеген жерден қасқырдың алдынан жүгіріп шығады. Ол жыртқышқа қарсы шығып, Емельянды ажалдан арашалап қалған.", "Джек-рассел тұқымдас итін қасқырдан құтқармақ болған әкесі достарын ертіп қасқырдың ізіне түседі. Адамдардың жақындағанын сезген қасқыр қаша жөнелген. Ал қансыраған ит орманнан табылып, төрт күннен кейін ауыр жарақаттардан өлген.", "Иттің қожайыны үй маңына бұған дейін қасқырлар бұрын-соңды мұншалық жақындамағанын айтады. Руслан баласын бір ажалдан құтқарған итін ешуақытта ұмытпайтынын алға тартты."]}, {"id": "l2v3-t4", "title": "", "source_note": "Bilim-all.kz: «Еңбекшіл құмырсқалар» – https://bilim-all.kz/article/2308", "numbered_paragraphs": true, "paragraphs": ["Бір құмырсқа өз салмағынан 10 есе ауыр салмақты көтере алады.", "Жауынгер құмырсқалар адамдар секілді өз отарларын қорғайды. Кейде отарлар арасында адамдар секілді соғысады.", "Құмырсқалар азық табу үшін аңшы құмырсқаларды жібереді. Бұлар жүрген іздерінде құмырсқа қышқылынан тамшы қалдырады, сол иіс бойынша адаспай табады.", "Жер қозғалар алдында олардың тіршілігі өзгеріске ұшырап, түні бойы қарбаласқа түсетіні анықталған.", "Құмырсқалар күндіз қоректеніп, түнде ұйықтайды."]}, {"id": "l2v3-t5", "title": "Ерсұлтан Жүнісақынов – өнертапқыш, стартапер", "source_note": "Aikyn.kz: «Ерсұлтан Жүнісақынов, өнертапқыш: Қазақ жастары жаһандық деңгейде бағаланып отыр» – https://aikyn.kz/294968", "numbered_paragraphs": false, "paragraphs": ["1. – Командаларыңызда қанша адам бар? Оның қаншасы қазақ жастары?", "– Біздің командада қазір 6 адам бар. Барлығы – инженерлер мен әзірлеушілер және көпшілігі Қазақстаннан шыққан жас мамандар.", "2. – Өзіңіз қай жердің тумасысыз, стартаптарға қызығушылық қай кезден басталды?", "– Мен Алматыда туып-өстім. Бұл – менің туған қалам. Қарапайым қазақ отбасынан шыққанмын. Әкем инженер-техник, анам университетте ағылшын тілі пәнінің оқытушысы болып жұмыс істейді. Олар мені еңбекке баулып, қиындыққа төзімді болуға үйретіп, жақсы тәлім-тәрбие берді. Технологияға деген қызығушылығым өте ерте кезден басталды. Сөйтіп, 15 жасымда кәсіби деңгейде сайттарды бағдарламалап, алғашқы табысымды IT арқылы таба бастадым.", "3. – АҚШ-та қазақстандық мамандар қалай бағаланады?", "– Мұнда қазақ жастарын еңбекқор, тез үйренетін, техникалық жағынан мықты және жауапкершілігі жоғары мамандар ретінде бағалайды. Жерлестеріміз көбірек жасанды интеллект пен IT саласына қызықса дейміз. Ең бастысы, нәтижеге еңбек етіп, тоқтап қалмау қажет.", "4. – Елге оралып, жаңа жобаларды жүзеге асыру ойда бар ма?", "– Әрине, кім болсын өз елін ойлайды, туған жерін аңсайды. Әзірге АҚШ-та тұрақтап, негізгі жұмысты осы жерде жалғастыруды жоспарлап отырмыз. Осындай деңгейге жеткен кезде біз Қазақстанда 1000-нан астам жаңа жұмыс орнын аша аламыз."]}, {"id": "l2v3-t6", "title": "", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Асыл шөп» – https://bilim-all.kz/article/22", "numbered_paragraphs": false, "paragraphs": ["Злиха мен Бәтима деген біреудің қызметінде тұрған екі қыз бала төбесіне бір-бір жәшік жеміс көтеріп қалаға келе жатыпты-мыс. Злиха ахылап-ухілеп шаршадым деп, Бәтима күліп, әзілдесіп келе жатады. ___(15)___ Злиха айтты:", "— Сен неге мәз болып қуанып келесің, төбеңдегі жәшіктің ауырлығы да менің басымдағыдан кем емес, өзің де менен күшті емессің?", "— Мен жәшігімнің ішіне ауырды жеңілдететін бір шөп салдым, — деді Бәтима.", "— Ай, ондай болса шөбіңнің атын айтшы, мен де ауырымды жеңілдетейін, — деді Злиха.", "— Ол шөп **сенің** қолыңа түспей ме деп қорқамын, аты: сабыр деген екен."]}, {"id": "l2v3-t7", "title": "", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Әке мен бала» – https://bilim-all.kz/article/1635", "numbered_paragraphs": false, "paragraphs": ["Бір адам он жасар баласын ертіп, егіннен жаяу келе жатса, жолда қалған аттың бір ескі тағасын көріп, баласына айтты:", "— Анау тағаны, балам, ала жүр, — деп.", "Бала әкесіне:", "— Сынып қалған ескі тағаны алып неғылайын, — деді.", "Әкесі үндемеді, тағаны өзі иіліп алды да, жүре берді.", "Қаланың шетінде темірші ұсталар бар екен, соған жеткен соң, әкесі қайырылып, манағы тағаны соларға үш тиынға сатты. Одан біраз жер өткен соң, шие сатып отырғандардан ол үш тиынға бірталай шие сатып алды. Сонымен, шиені орамалына түйіп, шетінен өзі бірем-бірем алып жеп, баласына қарамай, аяңдап жүре берді. Біраз жер өткен соң, әкесінің қолынан бір шие жерге түседі. Артында келе жатқан бала да тым-ақ қызығып келеді екен, жерге түскен шиені жалма-жан жерден алып, аузына салды. Сонымен әр жерде бір әкесінің қолынан түскен шиені он шақты рет иіліп, жерден алып жеді. Ең соңында әкесі тоқтап тұрып айтты:", "— Көрдің бе, мана тағаны жамансынып жерден бір ғана иіліп көтеріп алуға еріндің, енді сол тағаға алған шиенің жерге түскенін аламын деп бір еңкеюдің орнына он еңкейдің. Мұнан былай есіңде болсын: аз жұмысты қиынсынсаң — ___(17)___, азға қанағат ете білмесең — көптен де құр боласың, — деді."]}, {"id": "l2v3-t8", "title": "", "source_note": "Bilim-all.kz: «Жалман» – https://bilim-all.kz/article/15937", "numbered_paragraphs": false, "paragraphs": ["Жалман — Қазақстан шөлінің эндемигі. Тышқанға ұқсас кішілеу кеміргіш. Ол ғылымға 65 жыл бұрын ғана әйгілі болды. Осы уақыт аралығында ғалымдар қолына небары 50 жалманды ғана ұстаған болар.", "Ғалымдар үшін оның тіршілік жағдайы жұмбақ болып отыр, ол туралы мәліметтер тырнақтап жиналуда. Сирек эндемик, әрі зерттелмеген түр ретінде Қазақстан Қызыл кітабына енгізілген. Мұның атымен Қазақстан зоология журналы алынып отыр, онда жаңа және аз зерттелген жануарлар туралы мақалалар жарияланады."]}, {"id": "l2v3-t9", "title": "", "source_note": "Bilim-all.kz: «Өлген» қазан – https://bilim-all.kz/article/22470", "numbered_paragraphs": false, "paragraphs": ["Бір күні Қожанасырдың үйіне қонақ келіп қалады. Қожанасырдың үйінде кішкене ғана қазан бар екен. Бұл кішкене қазанға пісірген ас қонақтарына жетпейтін болады. Сондықтан Қожанасыр көршілес отырған байдың үлкен қазанын сұрайды. Тамақтарын ішіп, қонағын жөнелтіп болған соң, Қожанасыр байдың қазанын алып барады.", "— Уа, Қожа, қазанымды сындырған жоқпысың? — деп сұрайды.", "— Жоқ, тақсыр, қазаныңыз сынған жоқ, қайта балалады! Міне, қазаныңыздың баласы, — деп Қожанасыр байдың қазанының ішінен бір кішкене қазанды алып көрсетті.", "— Уа, Қожа, рақмет, сау бол! Керек болса, қазанды тағы да алып тұруыңа болады, — дейді бай көңілденіп.", "Біраз уақыт өткен соң Қожанасыр әлгі байдың қазанын тағы да сұрай келеді. «Бұл жолы да Қожанасыр қазанымның ішіне бір нәрсе салып әкелер», — деп ойлайды араны ашылған бай.", "Қожа байдың қазанын қайтармай қояды. Бір күн өтеді, екі күн өтеді, үшінші күні бай қазанын өзі іздеп келеді.", "— Байеке, айыпқа бұйыра көрмеңіз! Қазаныңыз екі күн ауырып, бүгін өлді, — дейді Қожанасыр қынжылып. Бай ашуланып, бұлқан-талқан болады.", "— Ақымақ! Не айтып отырсың? Қазан өле ме екен? — деп ақырады.", "— Байеке, сөкпеңіз! Туа білген қазан өле де біледі, — дейді. Бай сөзден жығылып, үйіне қайтып кетіпті."]}], "items": [{"id": "l2v3-q1", "number": 1, "text_id": "l2v3-t1", "stem": "Мәтіндегі дронның ерекшелігі неде?", "options": {"A": "қойлардың жүнін өзі қырқып беруінде", "B": "малға жем-шөп тасып жеткізуінде", "C": "адасқан қойды іздеп табуында", "D": "тек ашық күні ғана ұша алуында"}, "key": "C", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Аталған дрон өрістегі төрт түлікті санап, түгендейді, ауырып тұрған малды анықтайды, тіпті отардан бөлініп қалған қойды тауып береді."], "explanation": "Дрон малды санап, ауырған малды анықтайды, отардан бөлініп қалған қойды тауып береді. «Отардан бөлініп қалған» – адасқан деген сөз.", "editor_changes": "Мәтін қысқартылды (сайыс туралы соңғы сөйлем алынды).", "explanation_ru": "Дрон считает скот, выявляет больных животных и находит овцу, отбившуюся от отары. «Отардан бөлініп қалған» значит «заблудившаяся, отбившаяся».", "distractor_notes": {"A": "мәтінде қой қырқу туралы айтылмайды.", "B": "мәтінде дронның жем-шөп тасуы туралы айтылмайды. Ол малды бақылайды.", "D": "мәтінде керісінше айтылған: дрон кез келген ауа райына төтеп береді."}, "distractor_notes_ru": {"A": "в тексте не говорится о стрижке овец.", "B": "в тексте не говорится, что дрон возит корм. Он наблюдает за скотом.", "D": "в тексте сказано обратное: дрон выдерживает любую погоду."}, "distractor_evidence": {"A": [], "B": [], "D": ["Ең бастысы, бұл құрылғы кез келген ауа райына төтеп береді."]}, "keywords": {"ok": {"kk": ["отардан бөлініп қалған қойды тауып береді"], "ru": ["находит овцу, отбившуюся от отары"]}, "D": {"kk": ["кез келген ауа райына"], "ru": ["любую погоду"]}}}, {"id": "l2v3-q2", "number": 2, "text_id": "l2v3-t2", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Оқушы жобасын екі айда жасап шықты.\n2. Бұл жүйені ауыр темірбетон көпірлерге де орнатуға болады.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "A", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Жаңа жобаны дайындауға екі ай уақыт кеткен.", "Әрине, оны темірбетонды ауыр көпірлерге қолдануға келмейді."], "explanation": "Тек бірінші тұжырым дұрыс: жобаны дайындауға екі ай кеткен. Екінші тұжырым қате: оқушының өзі жүйені ауыр темірбетон көпірлерге қолдануға келмейтінін айтады.", "editor_changes": "Мәтін қысқартылды; «көпір,тіреуіш» → «көпір, тіреуіш».", "explanation_ru": "Верно только первое утверждение: на подготовку проекта ушло два месяца. Второе неверно: сам ученик говорит, что систему нельзя применять для тяжёлых железобетонных мостов.", "distractor_notes": {"B": "екінші тұжырым мәтінге сәйкес келмейді: жүйе тек жеңіл көпірлерге жарайды.", "C": "екінші тұжырымды мәтінмен тағы салыстыр: оқушы ауыр көпірлер туралы не дейді?", "D": "бірінші тұжырым мәтінде бар. Жобаны дайындауға қанша уақыт кеткенін қайта оқы."}, "distractor_notes_ru": {"B": "второе утверждение не соответствует тексту: система подходит только для лёгких мостов.", "C": "сравни второе утверждение с текстом ещё раз: что ученик говорит о тяжёлых мостах?", "D": "первое утверждение есть в тексте. Перечитай, сколько времени ушло на подготовку проекта."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["екі ай уақыт кеткен", "қолдануға келмейді"], "ru": ["ушло два месяца", "нельзя применять"]}}}, {"id": "l2v3-q3", "number": 3, "text_id": "l2v3-t3", "stem": "Мәтін не туралы?\n... ит туралы", "options": {"A": "баланы қасқырдан қорғаған", "B": "қасқырдан қорқып, үйге қашқан", "C": "орманда адасып, жоғалып кеткен", "D": "қасқырмен ойнап, дос болған"}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ал оның қырағы иті Джесси болса, қауіп төнгенін бірден сезіп, күтпеген жерден қасқырдың алдынан жүгіріп шығады.", "Ол жыртқышқа қарсы шығып, Емельянды ажалдан арашалап қалған."], "explanation": "Мәтінде Джесси есімді иттің қасқырға қарсы шығып, кішкентай Емельянды ажалдан арашалап қалғаны айтылады. «Арашалау» – қорғап, құтқарып қалу.", "editor_changes": "Дереккөзге сілтеме («деп хабарлайды KAZ.NUR.KZ порталы») мен видео туралы сөйлем алынды; «еcімді» (латын c) → «есімді».", "explanation_ru": "В тексте рассказывается, как собака по кличке Джесси выступила против волка и спасла маленького Емельяна от гибели. «Арашалау» значит «защитить, спасти».", "distractor_notes": {"B": "ит қашқан жоқ, керісінше қасқырдың алдынан жүгіріп шықты.", "C": "ит орманнан табылды, бірақ ол адасқан жоқ: қасқырмен алысып, жараланған.", "D": "ит қасқырмен ойнаған жоқ, баланы одан қорғады."}, "distractor_notes_ru": {"B": "собака не убежала, наоборот, выбежала навстречу волку.", "C": "собаку нашли в лесу, но она не заблудилась: она была ранена в схватке с волком.", "D": "собака не играла с волком, а защищала от него мальчика."}, "distractor_evidence": {"B": ["Ал оның қырағы иті Джесси болса, қауіп төнгенін бірден сезіп, күтпеген жерден қасқырдың алдынан жүгіріп шығады."], "C": ["Ал қансыраған ит орманнан табылып, төрт күннен кейін ауыр жарақаттардан өлген."], "D": []}, "keywords": {"ok": {"kk": ["қасқырдың алдынан жүгіріп шығады", "ажалдан арашалап"], "ru": ["выбежала навстречу волку", "спасла емельяна от гибели"]}, "B": {"kk": ["қасқырдың алдынан"], "ru": ["навстречу волку"]}, "C": {"kk": ["қансыраған ит"], "ru": ["раненую собаку"]}}}, {"id": "l2v3-q4", "number": 4, "text_id": "l2v3-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Емельян жақындаған қасқырды алдымен өзі байқап қалды.", "B": "Әкесі қасқырды ұстап алып, ауылға әкеліп көрсетті.", "C": "Қасқырлар бұл үйге бұрын да жиі келетін.", "D": "Ит жараланып, бірнеше күннен соң тірі қалмады."}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ал қансыраған ит орманнан табылып, төрт күннен кейін ауыр жарақаттардан өлген."], "explanation": "Қансыраған ит орманнан табылған, ол төрт күннен кейін ауыр жарақаттан өлген.", "editor_changes": "", "explanation_ru": "Раненую собаку нашли в лесу, через четыре дня она умерла от тяжёлых ран.", "distractor_notes": {"A": "мәтінде керісінше айтылған: Емельян қасқырды мүлде байқамаған.", "B": "әкесі қасқырды ұстаған жоқ: адамдар жақындағанда қасқыр қашып кетті.", "C": "иттің қожайыны қасқырлар бұрын үйге мұншалық жақындамағанын айтады."}, "distractor_notes_ru": {"A": "в тексте сказано обратное: Емельян совсем не заметил волка.", "B": "отец не поймал волка: когда люди приблизились, волк убежал.", "C": "хозяин собаки говорит, что раньше волки никогда так близко к дому не подходили."}, "distractor_evidence": {"A": ["Себебі, ол өзіне жақындап қалған қасқырды мүлде байқамапты."], "B": ["Адамдардың жақындағанын сезген қасқыр қаша жөнелген."], "C": ["Иттің қожайыны үй маңына бұған дейін қасқырлар бұрын-соңды мұншалық жақындамағанын айтады."]}, "keywords": {"ok": {"kk": ["төрт күннен кейін", "жарақаттардан өлген"], "ru": ["через четыре дня", "умерла от тяжёлых ран"]}, "A": {"kk": ["мүлде байқамапты"], "ru": ["совсем не заметил"]}, "B": {"kk": ["қаша жөнелген"], "ru": ["волк убежал"]}, "C": {"kk": ["бұрын-соңды мұншалық жақындамағанын"], "ru": ["никогда так близко"]}}}, {"id": "l2v3-q5", "number": 5, "text_id": "l2v3-t4", "stem": "Қай абзацта құмырсқалардың жер сілкінісін алдын ала сезетіні айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "D", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Жер қозғалар алдында олардың тіршілігі өзгеріске ұшырап, түні бойы қарбаласқа түсетіні анықталған. (4-азатжол)"], "explanation": "4-абзацта жер қозғалар алдында құмырсқалардың түні бойы қарбаласқа түсетіні айтылады. «Жер қозғалу» – жер сілкінісі.", "editor_changes": "Мақаладағы «Құмырсқалар туралы қызықты мәліметтер» деген нөмірленген тізім ғана алынды.", "explanation_ru": "В 4-м абзаце сказано, что перед землетрясением муравьи всю ночь суетятся. «Жер қозғалу» значит «землетрясение».", "distractor_notes": {"A": "1-абзацта құмырсқаның күші туралы айтылады.", "B": "2-абзацта жауынгер құмырсқалар туралы айтылады.", "C": "3-абзацта құмырсқалардың азықты қалай табатыны айтылады."}, "distractor_notes_ru": {"A": "в 1-м абзаце говорится о силе муравья.", "B": "во 2-м абзаце говорится о муравьях-воинах.", "C": "в 3-м абзаце говорится о том, как муравьи находят пищу."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["Жер қозғалар алдында"], "ru": ["перед землетрясением"]}}}, {"id": "l2v3-q6", "number": 6, "text_id": "l2v3-t4", "stem": "Қай ақпарат мәтін мазмұнына сай келеді?", "options": {"A": "Құмырсқалар түнде қоректеніп, күндіз ұйықтап демалады.", "B": "Аңшы құмырсқалар жолды тек көздерімен ғана табады.", "C": "Құмырсқа өзінен әлдеқайда ауыр жүкті көтере алады.", "D": "Жауынгер құмырсқалар бір-бірімен ешқашан соғыспайды."}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Бір құмырсқа өз салмағынан 10 есе ауыр салмақты көтере алады."], "explanation": "Мәтінде бір құмырсқаның өз салмағынан 10 есе ауыр салмақты көтере алатыны айтылады.", "editor_changes": "", "explanation_ru": "В тексте сказано, что один муравей может поднять груз в 10 раз тяжелее собственного веса.", "distractor_notes": {"A": "мәтінде керісінше айтылған: құмырсқалар күндіз қоректеніп, түнде ұйықтайды.", "B": "аңшы құмырсқалар жолды иіс бойынша табады.", "D": "мәтінде керісінше айтылған: кейде отарлар арасында соғыс болады."}, "distractor_notes_ru": {"A": "в тексте сказано обратное: муравьи питаются днём, а ночью спят.", "B": "муравьи-охотники находят дорогу по запаху.", "D": "в тексте сказано обратное: иногда между колониями бывают войны."}, "distractor_evidence": {"A": ["Құмырсқалар күндіз қоректеніп, түнде ұйықтайды."], "B": ["Бұлар жүрген іздерінде құмырсқа қышқылынан тамшы қалдырады, сол иіс бойынша адаспай табады."], "D": ["Кейде отарлар арасында адамдар секілді соғысады."]}, "keywords": {"ok": {"kk": ["10 есе ауыр салмақты"], "ru": ["в 10 раз тяжелее"]}, "A": {"kk": ["күндіз қоректеніп"], "ru": ["питаются днём"]}, "B": {"kk": ["иіс бойынша"], "ru": ["по этому запаху"]}, "D": {"kk": ["соғысады"], "ru": ["бывают войны"]}}}, {"id": "l2v3-q7", "number": 7, "text_id": "l2v3-t4", "stem": "Мәтінге қандай тақырып сәйкес келеді?", "options": {"A": "Жер сілкінісінің себептері", "B": "Құмырсқаның ұя салуы", "C": "Жәндіктердің қысқы ұйқысы", "D": "Ғажайып құмырсқалар"}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Бір құмырсқа өз салмағынан 10 есе ауыр салмақты көтере алады. (1-азатжол)", "Құмырсқалар азық табу үшін аңшы құмырсқаларды жібереді. (3-азатжол)"], "explanation": "Мәтінде құмырсқалар туралы бес қызықты дерек берілген: олардың күші, жауынгерлері, аңшылары, жер сілкінісін сезуі. Сондықтан «Ғажайып құмырсқалар» деген тақырып сәйкес келеді.", "editor_changes": "", "explanation_ru": "В тексте пять интересных фактов о муравьях: их сила, воины, охотники, чувствительность к землетрясениям. Поэтому подходит заголовок «Удивительные муравьи».", "distractor_notes": {"A": "жер сілкінісі бір абзацта ғана аталады, оның себептері айтылмайды.", "B": "мәтінде құмырсқаның ұя салуы туралы айтылмайды.", "C": "мәтінде қысқы ұйқы туралы айтылмайды."}, "distractor_notes_ru": {"A": "землетрясение упоминается только в одном абзаце, его причины не называются.", "B": "в тексте не говорится о том, как муравьи строят муравейник.", "C": "в тексте не говорится о зимней спячке."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["10 есе ауыр салмақты", "аңшы құмырсқаларды"], "ru": ["в 10 раз тяжелее", "муравьёв-охотников"]}}}, {"id": "l2v3-q8", "number": 8, "text_id": "l2v3-t5", "stem": "Қай бөлімде Ерсұлтанның ата-анасы туралы айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "B", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Әкем инженер-техник, анам университетте ағылшын тілі пәнінің оқытушысы болып жұмыс істейді. (2-бөлім)"], "explanation": "2-бөлімде Ерсұлтан әкесі инженер-техник, анасы ағылшын тілінің оқытушысы екенін айтады.", "editor_changes": "Сұхбаттың төрт сұрағы мен жауабы ғана алынып, қатты қысқартылды; сұрақтар нөмірленді.", "explanation_ru": "Во 2-й части Ерсултан рассказывает, что его отец — инженер-техник, а мама — преподаватель английского языка.", "distractor_notes": {"A": "1-бөлімде Ерсұлтанның командасы туралы айтылады.", "C": "3-бөлімде АҚШ-та қазақ жастарының қалай бағаланатыны айтылады.", "D": "4-бөлімде Ерсұлтанның болашақ жоспары туралы айтылады."}, "distractor_notes_ru": {"A": "в 1-й части говорится о команде Ерсултана.", "C": "в 3-й части говорится о том, как в США оценивают казахстанскую молодёжь.", "D": "в 4-й части говорится о планах Ерсултана на будущее."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Әкем инженер-техник, анам"], "ru": ["мой отец — инженер-техник, мама"]}}}, {"id": "l2v3-q9", "number": 9, "text_id": "l2v3-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Ерсұлтанның командасындағы мамандардың бәрі – шетелдіктер.\n2. Ерсұлтан алғашқы ақшасын 15 жасында тапқан.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Сөйтіп, 15 жасымда кәсіби деңгейде сайттарды бағдарламалап, алғашқы табысымды IT арқылы таба бастадым.", "Барлығы – инженерлер мен әзірлеушілер және көпшілігі Қазақстаннан шыққан жас мамандар."], "explanation": "Тек екінші тұжырым дұрыс: Ерсұлтан алғашқы табысын 15 жасында тапқан. Бірінші тұжырым қате: командадағы мамандардың көпшілігі – Қазақстаннан шыққан жастар.", "editor_changes": "", "explanation_ru": "Верно только второе утверждение: Ерсултан получил первый заработок в 15 лет. Первое неверно: большинство специалистов команды — молодёжь из Казахстана.", "distractor_notes": {"A": "бірінші тұжырым мәтінге сәйкес келмейді. Командадағы мамандардың қай елден шыққанын қайта оқы.", "C": "бірінші тұжырымды мәтінмен тағы салыстыр: мамандардың көпшілігі қай елден?", "D": "екінші тұжырым мәтінде бар. Ерсұлтанның алғашқы табысы туралы қайта оқы."}, "distractor_notes_ru": {"A": "первое утверждение не соответствует тексту. Перечитай, откуда родом специалисты команды.", "C": "сравни первое утверждение с текстом ещё раз: откуда большинство специалистов?", "D": "второе утверждение есть в тексте. Перечитай о первом заработке Ерсултана."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["15 жасымда", "алғашқы табысымды", "Қазақстаннан шыққан"], "ru": ["в 15 лет", "первый заработок", "из казахстана"]}}}, {"id": "l2v3-q10", "number": 10, "text_id": "l2v3-t5", "stem": "Сұхбат бөлімдерінің реті қандай?\n1. Елге оралу жоспары\n2. Ерсұлтанның балалық шағы\n3. Компаниядағы мамандар\n4. Қазақ жастарына берілетін баға", "options": {"A": "1, 2, 3, 4", "B": "3, 2, 1, 4", "C": "3, 2, 4, 1", "D": "2, 3, 4, 1"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["– Біздің командада қазір 6 адам бар.", "– Мен Алматыда туып-өстім.", "Мұнда қазақ жастарын еңбекқор, тез үйренетін, техникалық жағынан мықты және жауапкершілігі жоғары мамандар ретінде бағалайды.", "Әзірге АҚШ-та тұрақтап, негізгі жұмысты осы жерде жалғастыруды жоспарлап отырмыз."], "explanation": "Алдымен Ерсұлтан командасындағы мамандар туралы айтады (3), сосын туған жері мен балалық шағы туралы (2), кейін АҚШ-та қазақ жастарының қалай бағаланатыны туралы (4), соңында елге оралу жоспары туралы (1).", "editor_changes": "", "explanation_ru": "Сначала Ерсултан говорит о специалистах команды (3), затем о родном городе и детстве (2), потом о том, как в США ценят казахстанскую молодёжь (4), и в конце о планах вернуться на родину (1).", "distractor_notes": {"A": "сұхбат елге оралу туралы сұрақпен басталмайды, ол сұрақ ең соңында.", "B": "алғашқы екі бөлім дұрыс. Бірақ елге оралу туралы сұрақ ең соңында қойылған.", "D": "сұхбат балалық шақтан емес, команда туралы сұрақтан басталады."}, "distractor_notes_ru": {"A": "интервью не начинается с вопроса о возвращении на родину — он последний.", "B": "первые две части верны. Но вопрос о возвращении задан в самом конце.", "D": "интервью начинается не с детства, а с вопроса о команде."}, "distractor_evidence": {"A": ["4. – Елге оралып, жаңа жобаларды жүзеге асыру ойда бар ма?"], "B": [], "D": ["1. – Командаларыңызда қанша адам бар? Оның қаншасы қазақ жастары?"]}, "keywords": {"ok": {"kk": ["командада қазір 6 адам", "Алматыда туып-өстім", "бағалайды", "жоспарлап отырмыз"], "ru": ["в нашей команде 6 человек", "родился и вырос в алматы", "ценят", "планируем"]}, "A": {"kk": ["Елге оралып"], "ru": ["вернуться на родину"]}, "D": {"kk": ["Командаларыңызда қанша адам бар"], "ru": ["сколько человек в вашей команде"]}}}, {"id": "l2v3-q11", "number": 11, "text_id": "l2v3-t5", "stem": "Ерсұлтан жастарға қандай кеңес береді?", "options": {"A": "Мақсатқа жету үшін тынбай еңбек ету керек.", "B": "Жастар тек шетелде ғана жұмыс істеуі керек.", "C": "Бала кезден бастап ақша табуды үйрену керек.", "D": "Әр адам өзінің жеке компаниясын ашуы керек."}, "key": "A", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым" шыны"}, "key": "A", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": true, "evidence": ["— Ай, ондай болса шөбіңнің атын айтшы, мен де ауырымды жеңілдетейін, — деді Злиха.", "— Ол шөп сенің қолыңа түспей ме деп қорқамын, аты: сабыр деген екен."], "explanation": "Злиха шөптің атын сұрайды, Бәтима оған жауап береді. Сондықтан «сенің» деп Бәтима Злиханы айтып тұр.", "editor_changes": "", "explanation_ru": "Злиха спрашивает название травы, а Батима ей отвечает. Поэтому словом «сенің» (твой) Батима обращается к Злихе.", "distractor_notes": {"B": "Бәтима – сөйлеп тұрған адамның өзі. Ол өзін «сен» деп атамайды.", "C": "қожайын тек бірінші сөйлемде аталады, ол әңгімеге қатыспайды.", "D": "мәтінде жеміс сатушы жоқ."}, "distractor_notes_ru": {"B": "Батима — та, кто говорит. Она не называет себя «ты».", "C": "хозяин упоминается только в первом предложении и в разговоре не участвует.", "D": "в тексте нет продавца фруктов."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["деді Злиха", "сенің қолыңа"], "ru": ["сказала злиха", "тебе не достанется"]}}}, {"id": "l2v3-q15", "number": 15, "text_id": "l2v3-t6", "stem": "Бос орынға қай сөз қойылады?", "options": {"A": "Өйткені", "B": "Керісінше", "C": "Сонымен қатар", "D": "Сонда"}, "key": "D", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Злиха ахылап-ухілеп шаршадым деп, Бәтима күліп, әзілдесіп келе жатады."], "explanation": "Злиха шаршап келе жатқанда, Бәтиманың күліп келе жатқанын көріп, сол сәтте одан себебін сұрайды. «Сонда» – «сол кезде, сол сәтте» деген мағынада оқиғаны жалғастырады.", "editor_changes": "", "explanation_ru": "Уставшая Злиха видит, что Батима идёт смеясь, и в этот момент спрашивает её о причине. «Сонда» (тогда, в этот момент) продолжает рассказ.", "distractor_notes": {"A": "«өйткені» себепті білдіреді. Ал Злиханың сұрағы алдыңғы сөйлемнің себебі емес.", "
