"A": "мәтінде автордың әйелімен қалай танысқаны айтылмайды.", "B": "бұл мәтінге қайшы: ұлдары болашақта археолог болғысы келмейді.", "C": "Анд тауларына сапар өткен жазда болған, алдағы уақытта емес."}, "editor_changes": "Өзгеріс жоқ.", "distractor_evidence": {"A": [], "B": ["екі ұлым болашақта археолог болғысы келмесе де"], "C": ["Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық"]}, "keywords": {"ok": {"kk": ["еркін саяхаттай алады"], "ru": ["свободно путешествовать"]}, "B": {"kk": ["археолог болғысы келмесе де"], "ru": ["не хотят в будущем становиться археологами"]}, "C": {"kk": ["Өткен жаз"], "ru": ["Прошлым летом"]}}, "explanation_ru": "Сыновьям нравится путешествовать вместе с родителями.", "distractor_notes_ru": {"A": "В тексте не говорится, как автор познакомился с женой.", "B": "Это противоречит тексту: сыновья не хотят в будущем становиться археологами.", "C": "Поездка в Анды была прошлым летом, а не в будущем."}, "fixed_order": false}, {"id": "v1-q19", "number": 19, "text_id": "v1-t4", "stem": "Мысырда жұмыс істеп жүргенде авторға не ерекше қызықты көрінді?", "options": {"A": "Әртүрлі дәуір адамдарының бір-біріне соншалықты ұқсас болуы.", "B": "Төсеніштің бұл күнге дейін жақсы сақталуы.", "C": "Адамдардың осындай құрғақ жерде қалай өмір сүргені.", "D": "Бұл аймақта сауда-саттықтың жақсы дамығаны."}, "key": "A", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 3, "negative": false, "evidence": ["Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын."], "explanation": "Кілтті төсеніштің астына тастап кеткен 700 жыл бұрынғы адам автордың өзі сияқты әрекет еткен. Автор осы ұқсастыққа таң қалды.", "distractor_notes": {"B": "төсеніштің сақталғаны айтылады, бірақ бұл – автор таң қалған нәрсенің өзі емес. Автордың соңғы ойына назар аудар.", "C": "мәтінде адамдардың құрғақ жерде қалай өмір сүргені туралы айтылмайды.", "D": "сауда туралы тек «тауарларды сақтайтын ескі үй» деп жанама айтылады."}, "editor_changes": "Өзгеріс жоқ.", "distractor_evidence": {"B": ["700 жылдық төсеніш тауып алдық"], "C": [], "D": ["заманында кемелерден түскен тауарларды сақтайтын ескі үйдің"]}, "keywords": {"ok": {"kk": ["менен айырмашылығы жоқ", "дәл солай"], "ru": ["ничем не отличается", "точно так же"]}, "B": {"kk": ["700 жылдық төсеніш"], "ru": ["подстилку 700-летней давности"]}, "D": {"kk": ["тауарларды сақтайтын ескі үйдің"], "ru": ["хранили товары с кораблей"]}}, "explanation_ru": "Человек, оставивший ключ под подстилкой 700 лет назад, поступил так же, как поступил бы сам автор. Автора удивило это сходство.", "distractor_notes_ru": {"B": "О сохранившейся подстилке сказано, но автора удивило не это. Обрати внимание на последнюю мысль автора.", "C": "В тексте не говорится о том, как люди жили в засушливой местности.", "D": "О торговле сказано лишь косвенно — через «старый дом для хранения товаров»."}, "fixed_order": false}, {"id": "v1-q20", "number": 20, "text_id": "v1-t4", "stem": "Автор күнделік жүргізген болса, күнделігінде қандай жазба қалдырар еді?", "options": {"A": "Түркіменстан қызықты. Мен мұнда келген бірінші америкалықпын, бірақ бұл шетелге шыққан соңғы сапарым болғанына қуаныштымын.", "B": "Бүгін су астына сүңгіп, көрмеге қоюға болатын тағы бірнеше зат таптым. Суреттерін салуды жаңа ғана бітірдім.", "C": "Мен әйелімнің археологияға көбірек қызығушылық танытқанын қалаймын. Онымен осы тәжірибемді бөліскім келеді.", "D": "Қараңғы түсейін деді, бірақ Рафаэль әлі сол ескі үйді қазумен айналысып жатыр. Кейде адамды қатты шаршатып жібереді. Өзін мұнда ең маңызды адаммын деп санайды."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 3, "negative": false, "evidence": ["теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын"], "explanation": "Автор теңіз астын зерттейтін жобаларға қатысады және табылған заттардың суретін әлі де салады. Дұрыс жауап осы екі деректі біріктіреді.", "distractor_notes": {"A": "автор өзін алғашқы америкалықтардың бірі деп ойлаған, бірақ Пампелли одан бұрын келген. Соңғы сапар туралы да айтылмайды.", "C": "автордың әйелі де археолог, яғни ол бұл салаға қызығады.", "D": "Пампелли автордан 100 жыл бұрын жұмыс істеген, олар бірге қазба жүргізбеген."}, "editor_changes": "Өзгеріс жоқ.", "distractor_evidence": {"A": ["Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен"], "C": ["Менің әйелім де археолог"], "D": ["шамамен 100 жыл бұрын"]}, "keywords": {"ok": {"kk": ["теңіз астын зерттейтін", "суретін салуды"], "ru": ["изучению морского дна", "рисовать найденные предметы"]}, "A": {"kk": ["шамамен 100 жыл бұрын"], "ru": ["примерно 100 лет назад"]}, "C": {"kk": ["әйелім де археолог"], "ru": ["жена тоже археолог"]}, "D": {"kk": ["100 жыл бұрын"], "ru": ["100 лет назад"]}}, "explanation_ru": "Автор участвует в проектах по изучению морского дна и до сих пор рисует найденные предметы. Правильный ответ объединяет эти два факта.", "distractor_notes_ru": {"A": "Автор думал, что он один из первых американцев, но Пампелли был там раньше. О последней поездке тоже ничего не сказано.", "C": "Жена автора тоже археолог, значит, ей интересна эта сфера.", "D": "Пампелли работал на 100 лет раньше автора, они не вели раскопки вместе."}, "fixed_order": false}]}, {"bank_id": "kaz-L1-nis-sample-v1", "track": "first_language", "source": "НЗМ 7-сыныпқа конкурстық іріктеудің тест үлгілері, «Қазақ тілі (бірінші тіл)» (1–20 тапсырмалар)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {}, "style_notes": [], "texts": [{"id": "l1v2-t1", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Екінші дүниежүзілік соғыстың аяқталғанына талай жыл өтті. Сол сұрапыл соғыста ерлік көрсеткен белгісіз батырлар қаншама?! Солардың бірі – Хиуаз Доспанова. Атақ апайды алпыс жыл адасып жүріп тапты. Ол кісінің кеудесінде қазір «Халық қаһарманы» ордені жарқырайды. Қазақтың тұңғыш әскери ұшқыш қызы Хиуаз Доспанова 300-ден астам рет майдан көгіне көтеріліп, талай жауды жеңген. Ол кішкентай кезінен бастап аспанға ұшуды армандайтын. Орал қаласындағы орта мектепті бітіргенде, «әскери ұшқыш» деген атағы бар еді. Хиуаз Доспанова Қырым, Кавказ, Украина, Беларусь, Польша, Германия майданында болды. Ол – әуедегі ұрыстардың жеңімпазы."]}, {"id": "l1v2-t2", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["– Бүгінде қазақ даласын 1,5 миллионнан астам жылқы дүбірге бөлеп жүрсе, алдағы уақытта олардың саны екі есе көбейіп, 3 миллион басқа жетпек. Алайда бұл жылқыға қатысты мәселе жоқ деген сөз емес. Мәселен, бізде жылқыны жете зерттейтін арнайы ғылыми институт жоқ. Елімізде балық, құс, жем-шөп институттары – бөлек отау. Жалғыз ғана жылқыға институт бұйырмаған, – дейді «Қазақ тұлпары» ұйымының директоры. Оның айтуынша, институт ашылса, үлкен ауқымдағы асылдандыру жұмыстарынан бастап қымызды өндіруге дейінгі небір шаруалар шешіліп, қолға алынар еді. Осындай орталықтардың жоқтығынан болар, біздің қазы-қартамызды өзгелер патенттеп, көкпарды құжаттап алған. Бұдан шығатын қорытынды: жылқы саны миллионнан асты деп жайбарақат отырмау керек."]}, {"id": "l1v2-t3", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["«Ақылы көпті дау алмайды, досы көпті жау алмайды» демекші, қашан да адам баласына серік болар жолдастарының көп болғаны жақсы. Басына іс түссе, қасынан табылатын, қуанса, шаттығын бірге бөлісетін мұндай жандардың бір-біріне деген сый-құрметі де ерекше болады. Өмірдің қатал сындарынан жұмылған жұдырықтай болып, сүрінбей өтуге тырысатын жандар бұл жалғаннан айырылмас егіздердей болып өтеді. Әдетте дос деген ұғымның рөлі көбіне жігіттер арасында өзгеше. Алайда ойы, мақсаты сәйкес келмейтін адамдарды да кездестіруге болады. Мұндай пейілі нашарларға ата-бабамыз: «Жаман аттан аяғым артық, жаман жолдастан таяғым артық», – деген екен.", "«Достықтың неше түрі бар?» – деп сұрай қалсаңыз, әркім білгенінше жауап беріп жатады. Ертеректе ел ішінде Әйтімбет деген сөзге шешен адам өмір сүріпті. Бір күні замандастары әңгіме-дүкен құрып отырған шақта:", "– Осы достықтың неше түрі болады? – деп сауал тастаған екен. Сонда Әйтімбет:", "– Достықтың екі түрі болады. Бірі – адал достық, екіншісі – амал достық, – деп жауап қайтарыпты. Замандастары тағы да:", "– Енді осы екі достықты қалай ажыратамыз? – деп сұрапты. Әйтімбет ойланбастан:", "– Адал достық өмірлік нұсқа болады. Амал достықтың өрісі қысқа болады, – депті."]}, {"id": "l1v2-t4", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["АҚШ-тағы «Apple» компаниясында жұмыс істейтін Аяулым бала күнінен бастап бұзылған жабдықтарды жөндеуге құмар болған. Ол – алпауыт компанияда жұмыс істеп жүрген қазақтардың бірі. Бағдарламалар инженері болып жұмыс істейтін Аяулымның мұнда келгеніне шамамен жарты жыл болған. Сынақтардан сүрінбей өтіп, бірден қатардағы қызметкер болып қабылданған. Бұл мақсатына жету үшін көп дайындалған.", "– «Apple» компаниясында 150 мыңнан астам адам қызмет етеді. Барлығы – әлемдік деңгейдегі білікті инженерлер. Өзіңнен тәжірибелі, білімге құштар адамдардың жанында болсаң, өсе бересің, дами бересің. Негізгі мақсатым – өзімді дамыту, тәжірибе жинақтау, – дейді.", "Аяулымның жоғары оқу орнын бітіргеніне көп болмапты. Ол Солтүстік Америка университетінің грантын жеңіп алған. Бір жыл бұрын осы оқу орнының ақпараттық технологиялар бөлімін бітірген. Грант беру кезінде барлығы – үміткердің жеке мотивациясы мен мүмкіндіктері ескерілетінін айтады.", "– Мен АҚШ, Жапония, Корея, Қытай университеттеріне құжат тапсырдым. Бәрінен қабылдай алатындары туралы жауап келді, алайда Америкаға барамын деп мүлдем ойламаған едім. Таңдау еркі өзіме түскендіктен, Америкаға аттандым.", "Мен әлі жас маманмын, білмейтінім көп, тәжірибем аз. Бала күнімнен бүлінген заттарды қайта құрастырып, жөндеуге асығатынмын. Сол себепті осы салаға ерекше құштар болдым. Ақпараттық технология саласы қандай да бір сұрақтың түйінін логика арқылы жүйелі түрде шешумен ерекшеленеді. Осы салада қызмет істейтін қыздар өте аз, себебі олар ауқымды жобалардан жүрексінеді. Ал мен анамның қолдауының арқасында осындай компанияда жұмыс істейтініме ризамын, – деп сөзін түйіндеді."]}, {"id": "l1v2-t5", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Дәулет – IT маманы. Осы салада ұзақ жыл жұмыс жасап жүрген Дәулет былтырдан бері әлеуметтік жобаны қолға алған. Ол негізін салған «Rocket Plastic» шеберханасы пластикті қайта өңдеп, одан ұзақ уақыт қолданыста болатын заттар әзірлеумен айналысады.", "«Былтыр Алматыда өткен марафонға қатысқан едім. Сол кезде су ішуге арналған орындардың айналасында шашылып жатқан пластик бөтелкелер мен қағаз стақандарға көзім түсті. Қоқыс жәшіктерін көре тұра, адамдардың пластик қалдықтарын далаға тастағаны мені қатты таңғалдырды. (1) Сол кезден бастап осы мәселені зерттей бастадым.", "Қазақстанда пластик қалдықтарын қайта өңдеу жолға қойылмағанын білеміз. Әдетте барлық пластикті жинап, қала сыртындағы полигондарға шығарып тастайды. Қала көшелерінде шашылып жатқан пластикті көрмегеннен болар, біз үшін бұл проблема болып көрінбеуі мүмкін. Бірақ қала сыртындағы қоқыс қоршаған ортаға, адамдарға үлкен зиянын тигізеді. (2) Сіз қалада не ауылда тұрасыз ба, қарапайым адамсыз ба, жоқ миллионерсіз бе – бірі де маңызды емес. Экология – бәріне ортақ.", "Жоба жайлы идеямды досым әрі IT саласындағы серіктесіме айтқан едім, ол бірден қолдайтынын айтты. (3) Сондықтан мен әлеуметтік желіде эко-жобамен айналысқалы жатқанымды, егер командаға қосыламын дейтіндер болса, маған хабарласуын өтіндім. Осылайша қатарымызға бізге қолдау көрсететін топ жинақталып үлгерді. Олар біздің жұмысымызға қолдарынан келгенше көмек беріп, идеяларымен бөліседі.", "Біздің ел бұл проблемаға енді назар аударып келеді. Көшелерде арнайы қоқыс жәшіктері қойылып, кейбір дүкендер биопакеттер ұсынуда. Алайда халықтың тең жартысында қоқыс сұрыптауды ойлайтын уақыты да жоқ. Оларға пластиктің зияны, сұрыптаудың маңызы жайлы ақпарат жиі айтылмайды. (4) Адамдардың экологиялық сауаты мен белсенділігін арттырғымыз келеді», – дейді Дәулет.", "Дәулеттен кеңес:", "Егер саналы тұтынуға өтуге шешім қабылдасаңыз, бірінші кезекте дүкеннен пластик пакет алудан бас тартасыз. (5) Азық-түлік заттарын салу үшін өзіңізбен бірге бірнеше рет қолдануға болатын пакет немесе эко-сөмке ұстаңыз.", "Үйде бірнеше қоқыс жәшігін қойыңыз. Пластик, қағаз, шыны қалдықтарын бөлек жинаңыз. Егер үйіңіздің жанында қоқысты бөлек тастайтын контейнерлер болмаса, оны қабылдайтын жерлерге тапсырыңыз."]}, {"id": "l1v2-t6", "title": "Наурыз мейрамы туралы шетелдіктер не ойлайды?", "source_note": "", "numbered_paragraphs": true, "paragraphs": ["Исак Рамадани (Македония): – Македонияда дүниеге келдім, ұлтым – албан. Мұсылман болғаным үшін Наурыз мейрамы туралы көп естимін. Соңғы жылдары біздің елде де ауқымды тойлана бастады. Бірде түрлері түріктерге ұқсайтын еліміздің азаматтарының алдымнан шығып, арнайы мейрамға дайындалған асын ұсынғаны әлі есімде. Бір жыл өтсе де, дәмі аузымнан кетер емес. Өкінішке орай, оның атын ұмытып отырмын. Сіздерде осындай ортақ мейрамның бар екеніне ризамын.", "Агуэй-Боади (Гана): – Мен дүниеге келген елдің тең жартысы – мұсылмандар. Дегенмен мұнда Наурыз тойланбайды. Мүмкін географиялық аймақтарға байланысты тойланатын шығар. Осындай ұлттық мейрамның көп болғаны дұрыс. Әрқашан мейрамның маңыздылығын жоғалтып алмауға тырысу керек. Егер елде тек бір ұлт болса, оның жойылу мүмкіндігі болмайды. Ал көпұлтты елде мейрам сынды ұлттық құндылықтарды берік сақтау қиын. Өз еліңіздің ұлттық құндылықтарын қадірлеуден шаршамаңыздар дегім келеді.", "Эзар Чан (Қытай): – Қытайдың оңтүстік-шығыс аймағында тұрамын. Сондықтан Наурыз мейрамына қатысты дым естімеген екенмін. Түркі тектес ұлттар Қытайдың солтүстік-батыс жағын мекендеген. Мүмкін сол аймақта Наурыз мейрамы аталып өтілетін шығар.", "Энн-Джеймс (Ямайка): – Біздің елдің азаматтары әлемнің түкпір-түкпірінен келген. Мысалы, менің әкем үндістандық болса, анам – марокколық. Ал мен Ямайкада дүниеге келдім. Сондықтан біздің елге ғана тиесілі мейрам жоқ деуге болады. Әркім өзінің дәстүріне сай өмір сүреді. Ал сіздерде жалпы ұлтқа тән, тіпті бірнеше ұлттың басын қосатын мейрамның болғаны қуантады. Бұл халықтың бірлікте өмір сүруіне түрткі болады. Мен сіздерге қызығамын."]}, {"id": "l1v2-t7", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["– «Домбыра Party» туралы ең алғаш Facebook-тен білдім. Суреттер мен пікірлерді көріп, бұл жобаға қызыға бастадым. Біраз уақыттан кейін әлеуметтік желіден Нұрғиса ағамыздың жазған жазбасын оқыдым. Ағамыз Лондонға келетінін және «Домбыра Party» ұйымдастыратынын жазып, осы жерде жүрген қазақтардың хабарласуын сұрапты. Мен де «бұл мәселе қашан шешіледі екен, нақты болатын уақыты мен жері қашан анықталады екен» деп біраз уақыт күттім. Кейін анық-қанығын білдік. Сүйінші хабарды желі бойынша жан-жаққа тараттық. «Лондондағы домбыра кешіне аз адам келіп, ұят болып қалмағай!» – деп те уайымдадық. Себебі жанымда жүрген қазақ студенттерінің оқуы аяқталып, басым бөлігі елге оралған болатын.", "Абырой болғанда, елорданың туған күніне орай өткен шараға қырыққа жуық қазақ жиналды. Жиналып қана қоймай, Нұрғиса ағамызды қолдап, өздері де домбыраны қолға алып, өнер көрсетті. Көшеде серуендеп жүріп, бізді кездестіріп қуанған қазақтар да болды. Домбыраның үнін естіп, арамызға келіп қосылып жатты. Біраз бауырларымыздың шетелде жүріп, өз елін сағынғаны байқалды. «Домбыра Party» елден жырақта жүрген ағайынға Қазақстанда болып қайтқандай әсер сыйлады. Себебі айтылған әндер, тартылған күйлер елге деген сағынышымызды біршама басты деуге негіз бар. Осындай қазақтардың басын қосатын, елге, жерге деген сүйіспеншілікті арттыратын, рухымызды асқақтататын бастамалардың көбейе беруін тілеймін. Ал мен домбыра кешінің Лондонда жалғасын табуын қадағалап, септігімді тигізуге әзір екенімді баса айтқым келеді."]}, {"id": "l1v2-t8", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Бір орманда екі адам ағаш шабады екен. Бірінші адам таңертең ерте ұйқысынан оянып, бір ағашты шауып бітсе, дереу екіншісіне өтіп, тыным таппайды. Таңнан қара кешке дейін дәл осылай еңбектеніп, тынығу дегенді білмейді. Түскі асты ішуді де ұмытып кетеді. Кешкісін досынан кейін қалып, тағы бірнеше сағат жұмыс істейді. Екінші адам болса, ағаш шауып түсірген сайын біраз отырып тынығып, қас қарая бастағанда, үйіне қайтып кетеді.", "Бір апта бойы осылай еңбектенгеннен кейін, екеуі бір апталық ағаштарын санап көрмекші болады. Екінші адамның шапқан ағашы көбірек болып шығады. Тыным таппай еңбектенген бірінші адам ызаға булығып, қасындағы адамнан мұның сырын сұрайды. Екінші адам сәл ғана езу тартып, былай деп жауап қатады: – Мұның сен ойлағандай сыры жоқ. Сен еш тынбай еңбектенесің. Ал мен кейде тынығып отырып, балтамды қайрап аламын. Өткір балтамен жұмыс істеу жұмысты жеңілдетеді әрі шаршамайсың.", "Өз-өзіңді жетілдіру балтаны қайрағанға ұқсайды. Өз-өзімізге уақыт бөліп, істің көзін табуымыз керек. Кемшіліктеріміз болса, оларды толықтырып, жетілдіре түсуіміз қажет. Бұл рухани жан-дүниеміз бен ой-өрісіміздің кеңеюіне көп септігін тигізеді."]}, {"id": "l1v2-t9", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Эволюция теориясы бойынша адам маймыл тәріздес жануардан тік жүретін тұлғаға айналу үшін біршама уақыт кетіпті. Ал ғалымдар заманауи технологиялардың бұл жетістікті жоққа шығарып отырғанын айтады. Себебі ұялы телефон мен гаджеттерді күнделікті қолдану адамды бүкірейтіп, жүрісін өзгерте бастапты.", "Осы салада жүргізілген тәжірибеге 26 ерікті қатысты. Олар алғашында жолдарын телефонсыз жүріп өткен. Артынан мамандар олардың қолдарына смартфон ұстатып, хабарлама жазып не оқып жүрулерін өтінген. Тәжірибеге қатысқан адамдардың жүрісін, денесінің қалпын компьютерлік бағдарлама тіркеп отырған. Зерттеу нәтижесінде хабарлама жазу адамды бүкірейтіп, жүрісін ерекше қалыпқа түсіргені байқалды. Алға қарай еңкейіп, телефонға үңілгендер адам дамуының кері сатысын көрсете бастағандай. Осындай қалыптағы адамның басы мен омыртқасы 15 келі салмаққа тең қосымша жүктеме алады екен. Иық пен мойын бұлшықеттері де осы қалыпта зақымданады. Адам ағзасына омыртқа мен жүйке ауруларының қайдан келетінін ойлай беріңіз."]}], "items": [{"id": "l1v2-q1", "number": 1, "text_id": "l1v2-t1", "stem": "Хиуаз Доспанова батыр атағын қашан алды?", "options": {"A": "майданға аттанар алдында", "B": "мектеп кезінде", "C": "соғыс аяқталғаннан кейін", "D": "соғыс жылдары"}, "key": "C", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Екінші дүниежүзілік соғыстың аяқталғанына талай жыл өтті.", "Атақ апайды алпыс жыл адасып жүріп тапты."], "explanation": "Мәтінде «Атақ апайды алпыс жыл адасып жүріп тапты» делінген. Яғни Хиуаз Доспанова «Халық қаһарманы» атағын соғыс аяқталғаннан кейін, көп жыл өткен соң алды.", "distractor_notes": {"A": "майданға аттанар алдында оның «әскери ұшқыш» деген атағы болған. Бұл – батыр атағы емес.", "B": "мектеп бітіргенде оның «әскери ұшқыш» деген атағы болған. Ал «Халық қаһарманы» – басқа, батыр атағы.", "D": "соғыс жылдары ол 300-ден астам рет ұшып, талай жауды жеңген. Бірақ атақ оны кейін, «алпыс жыл адасып жүріп» тапты."}, "distractor_evidence": {"A": ["Орал қаласындағы орта мектепті бітіргенде, «әскери ұшқыш» деген атағы бар еді."], "B": ["Орал қаласындағы орта мектепті бітіргенде, «әскери ұшқыш» деген атағы бар еді."], "D": ["Қазақтың тұңғыш әскери ұшқыш қызы Хиуаз Доспанова 300-ден астам рет майдан көгіне көтеріліп, талай жауды жеңген."]}, "keywords": {"ok": {"kk": ["аяқталғанына талай жыл өтті", "алпыс жыл адасып жүріп тапты"], "ru": []}, "A": {"kk": ["«әскери ұшқыш» деген атағы"], "ru": []}, "B": {"kk": ["мектепті бітіргенде"], "ru": []}, "D": {"kk": ["300-ден астам рет"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q2", "number": 2, "text_id": "l1v2-t2", "stem": "Автор қандай мәселеге тоқталады?", "options": {"A": "жылқы санын арттыру кезінде кездесетін қиындықтарға", "B": "жылқы шаруашылығына қатысты мекеменің жоқтығына", "C": "көкпарды өзгенің патенттеуіне жол бермеу керектігіне", "D": "қазы-қартаны ұлттық тағам ретінде таныту қажеттігіне"}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Мәселен, бізде жылқыны жете зерттейтін арнайы ғылыми институт жоқ.", "Жалғыз ғана жылқыға институт бұйырмаған, – дейді «Қазақ тұлпары» ұйымының директоры."], "explanation": "Мәтінде жылқыны зерттейтін арнайы ғылыми институттың жоқтығы айтылады: балық, құс, жем-шөп институттары бар, ал жылқыға институт бұйырмаған. Мәтіндегі басқа ойлар осы мәселеден туындайды.", "distractor_notes": {"A": "мәтінде жылқы санын арттыру қиын деп айтылмайды. Керісінше, жылқы саны екі есе көбейіп, 3 миллионға жетпек.", "C": "көкпар туралы мәтінде бір сөйлем ғана бар. Онда көкпарды өзгелердің құжаттап алуы институттың жоқтығының салдары ретінде айтылады.", "D": "қазы-қарта туралы да мәтінде бір сөйлем ғана бар. Онда ол институттың жоқтығының салдары ретінде айтылады."}, "distractor_evidence": {"A": ["– Бүгінде қазақ даласын 1,5 миллионнан астам жылқы дүбірге бөлеп жүрсе, алдағы уақытта олардың саны екі есе көбейіп, 3 миллион басқа жетпек."], "C": ["Осындай орталықтардың жоқтығынан болар, біздің қазы-қартамызды өзгелер патенттеп, көкпарды құжаттап алған."], "D": ["Осындай орталықтардың жоқтығынан болар, біздің қазы-қартамызды өзгелер патенттеп, көкпарды құжаттап алған."]}, "keywords": {"ok": {"kk": ["арнайы ғылыми институт жоқ", "жылқыға институт бұйырмаған"], "ru": []}, "A": {"kk": ["екі есе көбейіп"], "ru": []}, "C": {"kk": ["Осындай орталықтардың жоқтығынан"], "ru": []}, "D": {"kk": ["қазы-қартамызды өзгелер патенттеп"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q3", "number": 3, "text_id": "l1v2-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Аға буын ниеті түзу адамдармен араласпаған.\n2. Шын достар әрқашан бір-біріне қолдау болады.", "options": {"A": "екеуі де бұрыс", "B": "екеуі де дұрыс", "C": "тек біріншісі", "D": "тек екіншісі"}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Басына іс түссе, қасынан табылатын, қуанса, шаттығын бірге бөлісетін мұндай жандардың бір-біріне деген сый-құрметі де ерекше болады.", "Мұндай пейілі нашарларға ата-бабамыз: «Жаман аттан аяғым артық, жаман жолдастан таяғым артық», – деген екен."], "explanation": "Тек екінші тұжырым дұрыс: шын достар басыңа іс түскенде қасыңнан табылады. Ал бірінші тұжырым қате: ата-бабамыз ниеті түзу адамдардан емес, пейілі нашар адамдардан аулақ болуды айтқан.", "distractor_notes": {"A": "екінші тұжырым мәтінде бар. Шын достардың қандай болатыны туралы 1-абзацты қайта оқы.", "B": "бірінші тұжырымды мәтінмен тағы салыстыр: ата-бабамыз қандай адамдар туралы айтқан?", "C": "бірінші тұжырымда «ниеті түзу» адамдар туралы айтылады. Ата-бабамыз қандай адамдар туралы айтқанын қайта оқы."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["Басына іс түссе, қасынан табылатын", "пейілі нашарларға"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q4", "number": 4, "text_id": "l1v2-t3", "stem": "«Амал достықтың өрісі қысқа болады.»\nӘйтімбет шешен не айтқысы келді?", "options": {"A": "Адамдардың шағын тобы ғана бір-бірімен дос бола алады.", "B": "Қызығушылығы бірдей достардың ортақ әңгімесі таусылады.", "C": "Өз пайдасын ғана ойлайтындардың достығы шынайы болмайды.", "D": "Тілеулес адамдардың достық қарым-қатынасы көпке созылмайды."}, "key": "C", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 3, "negative": false, "fixed_order": false, "evidence": ["– Достықтың екі түрі болады.", "Бірі – адал достық, екіншісі – амал достық, – деп жауап қайтарыпты.", "– Адал достық өмірлік нұсқа болады."], "explanation": "«Амал» – айла, есеп деген сөз. Амал достық – өз пайдасы үшін ғана жасалған достық. Пайда біткенде мұндай достық та бітеді, сондықтан оның «өрісі қысқа», яғни ол шынайы болмайды. Ал адал достық өмір бойы сақталады.", "distractor_notes": {"A": "Әйтімбет достардың саны туралы емес, достықтың түрі туралы айтады. «Амал» сөзінің мағынасын ойлан.", "B": "Әйтімбет достардың ортақ әңгімесі туралы айтпайды. Ол достықтың екі түрін салыстырады.", "D": "«тілеулес» – саған жақсылық тілейтін адам. Мұндай адамдардың достығы – адал достық, ол «өмірлік» болады."}, "distractor_evidence": {"A": [], "B": ["– Достықтың екі түрі болады."], "D": ["– Адал достық өмірлік нұсқа болады."]}, "keywords": {"ok": {"kk": ["адал достық", "амал достық", "өмірлік нұсқа"], "ru": []}, "B": {"kk": ["екі түрі"], "ru": []}, "D": {"kk": ["Адал достық өмірлік"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q5", "number": 5, "text_id": "l1v2-t4", "stem": "Неліктен Аяулым ақпараттық технологиялар бөлімін таңдады?", "options": {"A": "анасы қалағандықтан", "B": "икемі бар болғандықтан", "C": "оқу грантына ие болғандықтан", "D": "шетелдік оқу орны шақырғандықтан"}, "key": "B", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Бала күнімнен бүлінген заттарды қайта құрастырып, жөндеуге асығатынмын.", "Сол себепті осы салаға ерекше құштар болдым."], "explanation": "Аяулым бала кезінен бұзылған заттарды жөндеуге құмар болған: «Сол себепті осы салаға ерекше құштар болдым» дейді. Яғни ол бұл салаға икемі, бейімі бар болғандықтан таңдады.", "distractor_notes": {"A": "анасы Аяулымды тек қолдаған, ал мамандықты Аяулымның өзі таңдаған.", "C": "Аяулым грантты университетке түсу үшін жеңіп алған. Бірақ мамандықты таңдаудың себебі – грант емес.", "D": "бірнеше елдің университеттері оны қабылдай алатынын айтқан. Бірақ бұл елді таңдауға қатысты, мамандықты таңдауға емес."}, "distractor_evidence": {"A": ["Ал мен анамның қолдауының арқасында осындай компанияда жұмыс істейтініме ризамын, – деп сөзін түйіндеді."], "C": ["Ол Солтүстік Америка университетінің грантын жеңіп алған."], "D": ["Бәрінен қабылдай алатындары туралы жауап келді, алайда Америкаға барамын деп мүлдем ойламаған едім."]}, "keywords": {"ok": {"kk": ["бүлінген заттарды қайта құрастырып", "Сол себепті"], "ru": []}, "A": {"kk": ["анамның қолдауының арқасында"], "ru": []}, "C": {"kk": ["грантын жеңіп алған"], "ru": []}, "D": {"kk": ["Бәрінен қабылдай алатындары"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q6", "number": 6, "text_id": "l1v2-t4", "stem": "«Өзіңнен тәжірибелі, білімге құштар адамдардың жанында болсаң, өсе бересің, дами бересің.»\nАяулым не айтқысы келді?", "options": {"A": "аянбай еңбек ету керектігін", "B": "бәсекеге қабілетті болу керектігін", "C": "жас маманның тәжірибесінің аз болатынын", "D": "жан-жақты даму үшін ортаның маңызды екенін"}, "key": "D", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Өзіңнен тәжірибелі, білімге құштар адамдардың жанында болсаң, өсе бересің, дами бересің.", "Негізгі мақсатым – өзімді дамыту, тәжірибе жинақтау, – дейді."], "explanation": "Аяулым тәжірибелі, білімді адамдардың ортасында жүрсең, сен де өсіп, дамисың дейді. Яғни адамның жан-жақты дамуы үшін оның ортасының маңызы зор.", "distractor_notes": {"A": "бұл сөйлемде еңбек ету туралы емес, қандай адамдардың қасында болу туралы айтылады.", "B": "Аяулым тәжірибелі адамдармен бәсекелесу туралы емес, олардың жанында болып, үйрену туралы айтады.", "C": "Аяулым өзінің тәжірибесі аз екенін мәтіннің басқа жерінде айтады. Ал бұл сөйлемде ол адамның дамуына не көмектесетінін айтады."}, "distractor_evidence": {"A": [], "B": [], "C": ["Мен әлі жас маманмын, білмейтінім көп, тәжірибем аз."]}, "keywords": {"ok": {"kk": ["адамдардың жанында болсаң", "дами бересің"], "ru": []}, "C": {"kk": ["тәжірибем аз"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q7", "number": 7, "text_id": "l1v2-t4", "stem": "Соңғы абзацта Аяулымның қандай сезімі байқалады?", "options": {"A": "мақтаныш", "B": "қорқыныш", "C": "қызғаныш", "D": "сағыныш"}, "key": "A", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Осы салада қызмет істейтін қыздар өте аз, себебі олар ауқымды жобалардан жүрексінеді.", "Ал мен анамның қолдауының арқасында осындай компанияда жұмыс істейтініме ризамын, – деп сөзін түйіндеді."], "explanation": "Соңғы абзацта Аяулым бұл салада қыздар аз екенін, ал өзінің осындай компанияда жұмыс істейтініне риза екенін айтады. Ол өз жетістігін бағалап, мақтан тұтады. Бұл – мақтаныш сезімі.", "distractor_notes": {"B": "қорқыныш (жүрексіну) Аяулымның өзіне емес, басқа қыздарға қатысты айтылған.", "C": "Аяулым ешкімді қызғанбайды, керісінше, өз жұмысына риза.", "D": "соңғы абзацта Аяулым елін не жақындарын сағынғаны туралы айтпайды."}, "distractor_evidence": {"B": ["Осы салада қызмет істейтін қыздар өте аз, себебі олар ауқымды жобалардан жүрексінеді."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["қыздар өте аз", "жұмыс істейтініме ризамын"], "ru": []}, "B": {"kk": ["олар ауқымды жобалардан жүрексінеді"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q8", "number": 8, "text_id": "l1v2-t5", "stem": "Мәтіндегі 1–5-сөйлемдерден нені аңғаруға болады?\nДәулет –", "options": {"A": "ақпараттық технология саласының үздік маманы, әлеуметтік жоба жетекшісі.", "B": "қоқыс қалдықтарын қайта өңдейтін технологияны ойлап тапқан өнертапқыш.", "C": "қоқысты қайта сұрыптаумен айналысатын жаңашыл достары көп адам.", "D": "қоршаған ортаның мәселесіне бейжай қарамайтын, жанашыр азамат."}, "key": "D", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 3, "negative": false, "fixed_order": false, "evidence": ["(1) Сол кезден бастап осы мәселені зерттей бастадым.", "(2) Сіз қалада не ауылда тұрасыз ба, қарапайым адамсыз ба, жоқ миллионерсіз бе – бірі де маңызды емес.", "(4) Адамдардың экологиялық сауаты мен белсенділігін арттырғымыз келеді"], "explanation": "1–5-сөйлемдерде Дәулет қоқыс мәселесін зерттей бастағанын, экология бәріне ортақ екенін, адамдарға қоршаған ортаны қорғау туралы ақпарат жетпейтінін, олардың экологиялық сауатын арттырғысы келетінін айтып, эко-сөмке ұстауға кеңес береді. Демек, ол – қоршаған ортаның мәселесіне бейжай қарамайтын, жанашыр азамат.", "distractor_notes": {"A": "Дәулеттің IT маманы екені айтылады, бірақ оның үздік маман екені туралы ештеңе айтылмайды. 1–5-сөйлемдерде ол туралы мүлде сөз жоқ.", "B": "Дәулет технологияны ойлап тапқан жоқ: оның шеберханасы пластикті қайта өңдейді.", "C": "мәтінде Дәулеттің бір досы әрі серіктесі және оларға қолдау көрсететін топ туралы айтылады. Бірақ 1–5-сөйлемдер оның достарының көптігін емес, Дәулеттің өз ойы мен мінезін көрсетеді."}, "distractor_evidence": {"A": ["Дәулет – IT маманы."], "B": ["Ол негізін салған «Rocket Plastic» шеберханасы пластикті қайта өңдеп, одан ұзақ уақыт қолданыста болатын заттар әзірлеумен айналысады."], "C": ["Жоба жайлы идеямды досым әрі IT саласындағы серіктесіме айтқан едім, ол бірден қолдайтынын айтты."]}, "keywords": {"ok": {"kk": ["осы мәселені зерттей бастадым", "бірі де маңызды емес", "экологиялық сауаты мен белсенділігін арттырғымыз келеді"], "ru": []}, "A": {"kk": ["IT маманы"], "ru": []}, "B": {"kk": ["пластикті қайта өңдеп"], "ru": []}, "C": {"kk": ["досым әрі IT саласындағы серіктесіме"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q9", "number": 9, "text_id": "l1v2-t5", "stem": "Дәулеттің шеберхана ашуына не себеп болды?", "options": {"A": "дүкендердегі пластик пакет жарнамасы", "B": "елімізде қайта өңдеу өндірісінің жандануы", "C": "қала көшесінде шашылып жатқан пластик ыдыстар", "D": "сұрыптауға арналған қоқыс жәшігінің пайда болуы"}, "key": "C", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Сол кезде су ішуге арналған орындардың айналасында шашылып жатқан пластик бөтелкелер мен қағаз стақандарға көзім түсті.", "(1) Сол кезден бастап осы мәселені зерттей бастадым."], "explanation": "Дәулет Алматыдағы марафонда көшеде шашылып жатқан пластик бөтелкелерді көрген. «Сол кезден бастап осы мәселені зерттей бастадым» дейді.", "distractor_notes": {"A": "мәтінде пластик пакет жарнамасы туралы айтылмайды. Дәулет керісінше пластик пакеттен бас тартуға кеңес береді.", "B": "мәтінде керісінше айтылған: Қазақстанда пластикті қайта өңдеу жолға қойылмаған.", "D": "қоқыс жәшіктері туралы мәтіннің соңына қарай айтылады, бірақ бұл – шеберхана ашудың себебі емес."}, "distractor_evidence": {"A": ["Егер саналы тұтынуға өтуге шешім қабылдасаңыз, бірінші кезекте дүкеннен пластик пакет алудан бас тартасыз."], "B": ["Қазақстанда пластик қалдықтарын қайта өңдеу жолға қойылмағанын білеміз."], "D": ["Көшелерде арнайы қоқыс жәшіктері қойылып, кейбір дүкендер биопакеттер ұсынуда."]}, "keywords": {"ok": {"kk": ["шашылып жатқан пластик бөтелкелер", "Сол кезден бастап"], "ru": []}, "A": {"kk": ["пластик пакет алудан бас тартасыз"], "ru": []}, "B": {"kk": ["жолға қойылмағанын"], "ru": []}, "D": {"kk": ["арнайы қоқыс жәшіктері қойылып"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q10", "number": 10, "text_id": "l1v2-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Дәулет әлеуметтік желілер арқылы эко-сөмкені жарнамалады.", "B": "Дәулет достарымен бірге ауқымды эко-жобаны жүзеге асырды.", "C": "Дәулет мамандығы бойынша қосымша табыс табуды қалайды.", "D": "Дәулет пластикті арнайы орындарға тапсыру қажеттігін айтады."}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Егер үйіңіздің жанында қоқысты бөлек тастайтын контейнерлер болмаса, оны қабылдайтын жерлерге тапсырыңыз."], "explanation": "Дәулет кеңесінде үйдің жанында қоқысты бөлек тастайтын контейнер болмаса, оны қабылдайтын жерлерге тапсыруды айтады.", "distractor_notes": {"A": "Дәулет әлеуметтік желіде эко-сөмкені емес, командаға адам іздейтінін жариялады.", "B": "мәтінде жобаға қолдау көрсететін топ жиналғаны айтылады, бірақ ауқымды жобаны жүзеге асырғаны туралы айтылмайды.", "C": "мәтінде Дәулеттің қосымша табыс табуды қалайтыны айтылмайды. Ол әлеуметтік жобамен айналысады."}, "distractor_evidence": {"A": ["(3) Сондықтан мен әлеуметтік желіде эко-жобамен айналысқалы жатқанымды, егер командаға қосыламын дейтіндер болса, маған хабарласуын өтіндім."], "B": ["Осылайша қатарымызға бізге қолдау көрсететін топ жинақталып үлгерді."], "C": ["Осы салада ұзақ жыл жұмыс жасап жүрген Дәулет былтырдан бері әлеуметтік жобаны қолға алған."]}, "keywords": {"ok": {"kk": ["қабылдайтын жерлерге тапсырыңыз"], "ru": []}, "A": {"kk": ["командаға қосыламын дейтіндер"], "ru": []}, "B": {"kk": ["қолдау көрсететін топ"], "ru": []}, "C": {"kk": ["әлеуметтік жобаны"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q11", "number": 11, "text_id": "l1v2-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "әңгіме", "B": "баяндама", "C": "мақала", "D": "сұхбат"}, "key": "C", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Дәулет – IT маманы.", "(4) Адамдардың экологиялық сауаты мен белсенділігін арттырғымыз келеді», – дейді Дәулет."], "explanation": "Мәтінде автор нақты адам – Дәулет және оның жобасы туралы баяндап, оның сөзін келтіреді, соңында оның кеңесін береді. Сұрақ-жауап та, ойдан шығарылған оқиға да жоқ. Мұндай публицистикалық мәтін – мақала.", "distractor_notes": {"A": "әңгіме – көркем шығарма, онда ойдан құрастырылған оқиға баяндалады. Ал бұл мәтінде нақты адам мен оның жобасы туралы ақпарат беріледі.", "B": "баяндама жиналыста не конференцияда оқылады, онда баяндамашы бір тақырыпты өзі жүйелі баяндайды. Бұл мәтінде автор бір адамның жобасы туралы жазып, оның сөзін келтіреді.", "D": "мәтінде Дәулеттің ұзақ сөзі келтірілген, бірақ тілшінің сұрақтары жоқ. Сұхбат сұрақ пен жауаптан тұрады."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["Дәулет – IT маманы", "– дейді Дәулет"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q12", "number": 12, "text_id": "l1v2-t6", "stem": "«Өкінішке орай, оның атын ұмытып отырмын.»\nОсы сөйлемде «оның» деп кімді/нені айтады? (1-абзац)", "options": {"A": "дәстүрдің атауын", "B": "мейрамның түрін", "C": "тағамның атауын", "D": "танысының есімін"}, "key": "C", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Бірде түрлері түріктерге ұқсайтын еліміздің азаматтарының алдымнан шығып, арнайы мейрамға дайындалған асын ұсынғаны әлі есімде. (1-азатжол)", "Бір жыл өтсе де, дәмі аузымнан кетер емес. (1-азатжол)"], "explanation": "Алдыңғы сөйлемдерде мейрамға дайындалған ас және оның дәмі туралы айтылады. Демек, Исак Рамадани тағамның атын ұмытқан.", "distractor_notes": {"A": "бұл сөйлемдерде дәстүр туралы айтылмайды. Алдыңғы сөйлемде не туралы айтылғанын қайта оқы.", "B": "мейрамның атауы – Наурыз, оны Исак Рамадани біледі.", "D": "алдыңғы сөйлемде адам туралы емес, нәрсе туралы айтылады: оның «дәмі аузынан кетер емес»."}, "distractor_evidence": {"A": [], "B": ["Мұсылман болғаным үшін Наурыз мейрамы туралы көп естимін."], "D": ["Бір жыл өтсе де, дәмі аузымнан кетер емес."]}, "keywords": {"ok": {"kk": ["мейрамға дайындалған асын", "дәмі аузымнан кетер емес"], "ru": []}, "B": {"kk": ["Наурыз мейрамы туралы көп естимін"], "ru": []}, "D": {"kk": ["дәмі аузымнан кетер емес"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q13", "number": 13, "text_id": "l1v2-t6", "stem": "2-абзацтың негізгі ойы қандай?", "options": {"A": "Ұлттар арасындағы достықты бағалау қажет.", "B": "Ұлттық ерекшелікті жоғалтпау керек.", "C": "Ұлттық мейрамды лайықты атап өту қажет.", "D": "Ұлттық мейрамды мақтан тұту керек."}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Әрқашан мейрамның маңыздылығын жоғалтып алмауға тырысу керек. (2-азатжол)", "Өз еліңіздің ұлттық құндылықтарын қадірлеуден шаршамаңыздар дегім келеді. (2-азатжол)"], "explanation": "Агуэй-Боади мейрамның маңыздылығын жоғалтпауға, ұлттық құндылықтарды берік сақтауға шақырады. Демек, 2-абзацтың негізгі ойы – ұлттық ерекшелікті жоғалтпау керек.", "distractor_notes": {"A": "2-абзацта ұлттар арасындағы достық туралы айтылмайды. Бірнеше ұлттың басын қосатын мейрам туралы 4-абзацта айтылады.", "C": "2-абзацта мейрамды қалай атап өту керектігі туралы емес, оның маңызын, құндылығын сақтау туралы айтылады.", "D": "Агуэй-Боади мейрамды мақтан тұту туралы емес, ұлттық құндылықты жоғалтпай, сақтау туралы айтады."}, "distractor_evidence": {"A": ["Ал сіздерде жалпы ұлтқа тән, тіпті бірнеше ұлттың басын қосатын мейрамның болғаны қуантады."], "C": [], "D": ["Ал көпұлтты елде мейрам сынды ұлттық құндылықтарды берік сақтау қиын."]}, "keywords": {"ok": {"kk": ["маңыздылығын жоғалтып алмауға", "ұлттық құндылықтарын қадірлеуден"], "ru": []}, "A": {"kk": ["бірнеше ұлттың басын қосатын"], "ru": []}, "D": {"kk": ["берік сақтау қиын"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q14", "number": 14, "text_id": "l1v2-t6", "stem": "Кімнің сөзінде мерекеге қатысты немқұрайлық байқалады?", "options": {"A": "Исак Рамадани", "B": "Агуэй-Боади", "C": "Эзар Чан", "D": "Энн-Джеймс"}, "key": "C", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 3, "negative": false, "fixed_order": true, "evidence": ["Сондықтан Наурыз мейрамына қатысты дым естімеген екенмін. (3-азатжол)", "Мүмкін сол аймақта Наурыз мейрамы аталып өтілетін шығар. (3-азатжол)"], "explanation": "Эзар Чан Наурыз туралы «дым естімеген екенмін», «мүмкін сол аймақта аталып өтілетін шығар» дейді. Ол мейрамға қызығушылық та, сүйсіну де білдірмейді. «Немқұрайлық» – бей-жай, салғырт қарау деген сөз.", "distractor_notes": {"A": "Исак Рамадани мейрамды жақсы біледі, ортақ мейрамның бар екеніне риза.", "B": "Агуэй-Боадидің елінде Наурыз тойланбаса да, ол ұлттық мейрамның маңызы туралы ойын айтады.", "D": "Энн-Джеймс мұндай мейрамға қызығатынын айтады."}, "distractor_evidence": {"A": ["Сіздерде осындай ортақ мейрамның бар екеніне ризамын."], "B": ["Осындай ұлттық мейрамның көп болғаны дұрыс."], "D": ["Мен сіздерге қызығамын."]}, "keywords": {"ok": {"kk": ["дым естімеген екенмін", "Мүмкін сол аймақта"], "ru": []}, "A": {"kk": ["ризамын"], "ru": []}, "B": {"kk": ["көп болғаны дұрыс"], "ru": []}, "D": {"kk": ["қызығамын"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q15", "number": 15, "text_id": "l1v2-t7", "stem": "Домбыра кешіне жиналған көпшілік өздерін қалай сезінді?", "options": {"A": "Өздерін туған жерге барып келгендей сезінді.", "B": "Өздерін үлкен сахнада өнер көрсеткендей сезінді.", "C": "Тек қазақ күйлерін қатты сағынғандарын түсінді.", "D": "Туған жерден жырақта жүргендеріне қиналды."}, "key": "A", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "fixed_order": false, "evidence": ["«Домбыра Party» елден жырақта жүрген ағайынға Қазақстанда болып қайтқандай әсер сыйлады."], "explanation": "Мәтінде кеш елден жырақтағы қазақтарға Қазақстанда болып қайтқандай әсер сыйлағаны айтылады. Яғни олар өздерін туған жерге барып келгендей сезінді.", "distractor_notes": {"B": "қазақтар домбыра тартып, өнер көрсетті, бірақ шара көшеде өтті, үлкен сахна туралы айтылмайды.", "C": "кеште әндер де айтылды, күйлер де тартылды. Олар тек күйді емес, елді сағынған еді.", "D": "кеш олардың сағынышын басты, яғни оларды қиналдырған жоқ, керісінше, қуантты."}, "distractor_evidence": {"B": ["Көшеде серуендеп жүріп, бізді кездестіріп қуанған қазақтар да болды."], "C": ["Себебі айтылған әндер, тартылған күйлер елге деген сағынышымызды біршама басты деуге негіз бар."], "D": ["Себебі айтылған әндер, тартылған күйлер елге деген сағынышымызды біршама басты деуге негіз бар."]}, "keywords": {"ok": {"kk": ["Қазақстанда болып қайтқандай әсер"], "ru": []}, "B": {"kk": ["Көшеде серуендеп"], "ru": []}, "C": {"kk": ["елге деген сағынышымызды"], "ru": []}, "D": {"kk": ["біршама басты"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q16", "number": 16, "text_id": "l1v2-t7", "stem": "Қай ақпарат мәтін мазмұнына сәйкес КЕЛМЕЙДІ?", "options": {"A": "«Домбыра Party» ән-күйлері көрерменнің сағынышын басты.", "B": "«Домбыра Party» Нұрғиса ағаның басшылығымен өткізілді.", "C": "«Домбыра Party» Тәуелсіздік күніне орай ұйымдастырылды.", "D": "«Домбыра Party» шарасын тамашалауға біршама адам келді."}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": true, "fixed_order": false, "evidence": ["Абырой болғанда, елорданың туған күніне орай өткен шараға қырыққа жуық қазақ жиналды."], "explanation": "Шара Тәуелсіздік күніне емес, елорданың туған күніне орай өтті. Сондықтан бұл ақпарат мәтінге сәйкес келмейді.", "distractor_notes": {"A": "бұл ақпарат мәтінде бар: ән-күйлер сағынышты басты.", "B": "бұл ақпарат мәтінде бар: кешті Нұрғиса аға ұйымдастырды.", "D": "бұл ақпарат мәтінде бар: шараға қырыққа жуық қазақ жиналды."}, "distractor_evidence": {"A": ["Себебі айтылған әндер, тартылған күйлер елге деген сағынышымызды біршама басты деуге негіз бар."], "B": ["Ағамыз Лондонға келетінін және «Домбыра Party» ұйымдастыратынын жазып, осы жерде жүрген қазақтардың хабарласуын сұрапты."], "D": ["Абырой болғанда, елорданың туған күніне орай өткен шараға қырыққа жуық қазақ жиналды."]}, "keywords": {"ok": {"kk": ["елорданың туған күніне орай"], "ru": []}, "A": {"kk": ["сағынышымызды біршама басты"], "ru": []}, "B": {"kk": ["«Домбыра Party» ұйымдастыратынын"], "ru": []}, "D": {"kk": ["қырыққа жуық қазақ жиналды"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q17", "number": 17, "text_id": "l1v2-t7", "stem": "Автор «Домбыра Party» шарасына қандай тілек білдіреді?", "options": {"A": "Бұл бастаманың одан әрі жалғасын табуын қалайды.", "B": "Домбыра кешінің жоғары дәрежеде өтуін тілейді.", "C": "Елімізде домбыра кешінің жиі ұйымдастырылуын қалайды.", "D": "Шетелдегі студенттер үшін шараның қайта өткізілуін тілейді."}, "key": "A", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Осындай қазақтардың басын қосатын, елге, жерге деген сүйіспеншілікті арттыратын, рухымызды асқақтататын бастамалардың көбейе беруін тілеймін.", "Ал мен домбыра кешінің Лондонда жалғасын табуын қадағалап, септігімді тигізуге әзір екенімді баса айтқым келеді."], "explanation": "Автор осындай бастамалардың көбейе беруін тілейді және домбыра кешінің Лондонда жалғасын табуына көмектесуге дайын. Яғни ол бұл бастаманың одан әрі жалғасын табуын қалайды.", "distractor_notes": {"B": "автор өткен кешке риза, болашақ кештің деңгейі туралы тілек айтпайды.", "C": "автор кештің Қазақстанда емес, Лондонда жалғасын табуын қалайды.", "D": "шара тек студенттерге арналмаған. Автор студенттердің көбі елге оралғанын уайым ретінде ғана айтады."}, "distractor_evidence": {"B": [], "C": ["Ал мен домбыра кешінің Лондонда жалғасын табуын қадағалап, септігімді тигізуге әзір екенімді баса айтқым келеді."], "D": ["Себебі жанымда жүрген қазақ студенттерінің оқуы аяқталып, басым бөлігі елге оралған болатын."]}, "keywords": {"ok": {"kk": ["бастамалардың көбейе беруін тілеймін", "жалғасын табуын"], "ru": []}, "C": {"kk": ["Лондонда жалғасын табуын"], "ru": []}, "D": {"kk": ["басым бөлігі елге оралған"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q18", "number": 18, "text_id": "l1v2-t8", "stem": "Неліктен аз жұмыс істеген адамның ағашы көбірек болып шықты?", "options": {"A": "демалуына көңіл бөлетіндіктен", "B": "құралын ауыстырып отыратындықтан", "C": "түскі асты уақытында ішетіндіктен", "D": "үйіне ертерек қайтатындықтан"}, "key": "A", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ал мен кейде тынығып отырып, балтамды қайрап аламын.", "Өткір балтамен жұмыс істеу жұмысты жеңілдетеді әрі шаршамайсың."], "explanation": "Екінші адам тынығып отырған кезде балтасын қайрап алады. Өткір балтамен жұмыс жеңіл әрі тез жүреді, адам шаршамайды. Ол демалуға көңіл бөлгендіктен, күші де сақталып, балтасы да өткір болды.", "distractor_notes": {"B": "ол құралын ауыстырған жоқ, сол балтасын қайрап отырған.", "C": "мәтінде екінші адамның түскі асы туралы айтылмайды. Түскі асты бірінші адам ұмытып кетеді.", "D": "екінші адам үйіне ерте қайтады, бірақ ағашты көбірек шабуының себебі – бұл емес. Ол себебін өзі айтады."}, "distractor_evidence": {"B": ["Ал мен кейде тынығып отырып, балтамды қайрап аламын."], "C": ["Түскі асты ішуді де ұмытып кетеді."], "D": ["Өткір балтамен жұмыс істеу жұмысты жеңілдетеді әрі шаршамайсың."]}, "keywords": {"ok": {"kk": ["тынығып отырып", "балтамды қайрап аламын", "шаршамайсың"], "ru": []}, "B": {"kk": ["балтамды қайрап аламын"], "ru": []}, "C": {"kk": ["Түскі асты"], "ru": []}, "D": {"kk": ["Өткір балтамен"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q19", "number": 19, "text_id": "l1v2-t8", "stem": "Автор қандай кеңес береді?", "options": {"A": "Бәсекеге қабілетті болуымыз керек.", "B": "Демалмастан еңбек ете білуіміз керек.", "C": "Жеңіске жетуге тырысуымыз керек.", "D": "Өзімізді үнемі дамытуымыз керек."}, "key": "D", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Өз-өзіңді жетілдіру балтаны қайрағанға ұқсайды.", "Кемшіліктеріміз болса, оларды толықтырып, жетілдіре түсуіміз қажет."], "explanation": "Автор балтаны қайрауды өзін-өзі жетілдірумен салыстырады: кемшіліктерімізді толықтырып, үнемі дамуымыз керек.", "distractor_notes": {"A": "мәтінде екеуі ағаштарын санайды, бірақ автордың кеңесі бәсеке туралы емес. Соңғы абзацты қайта оқы.", "B": "мәтін керісінше үйретеді: демалмай еңбектенген адам аз ағаш шапты.", "C": "мәтінде жеңіске жету туралы кеңес жоқ. Соңғы абзацты қайта оқы."}, "distractor_evidence": {"A": [], "B": ["Екінші адамның шапқан ағашы көбірек болып шығады."], "C": []}, "keywords": {"ok": {"kk": ["Өз-өзіңді жетілдіру", "жетілдіре түсуіміз қажет"], "ru": []}, "B": {"kk": ["Екінші адамның шапқан ағашы көбірек"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q20", "number": 20, "text_id": "l1v2-t9", "stem": "Адам жүрісінің өзгеруіне не әсер етті?", "options": {"A": "ағзаның ауруға шалдығуы", "B": "ауыр заттарды көтеру", "C": "жануарларға еліктеу", "D": "технологияны қолдану"}, "key": "D", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Себебі ұялы телефон мен гаджеттерді күнделікті қолдану адамды бүкірейтіп, жүрісін өзгерте бастапты."], "explanation": "Ұялы телефон мен гаджеттерді, яғни технологияны күнделікті қолдану адамды бүкірейтіп, жүрісін өзгерткен.", "distractor_notes": {"A": "ауру – себеп емес, салдар: адам дұрыс емес қалыпта жүргендіктен омыртқа мен жүйке аурулары пайда болады.", "B": "мәтінде ауыр зат көтеру туралы айтылмайды. 15 келі – телефонға үңілгенде омыртқаға түсетін жүктеме.", "C": "мәтінде адамның жануарға еліктегені айтылмайды. Маймыл тек эволюция теориясына қатысты аталады."}, "distractor_evidence": {"A": ["Адам ағзасына омыртқа мен жүйке ауруларының қайдан келетінін ойлай беріңіз."], "B": ["Осындай қалыптағы адамның басы мен омыртқасы 15 келі салмаққа тең қосымша жүктеме алады екен."], "C": ["Эволюция теориясы бойынша адам маймыл тәріздес жануардан тік жүретін тұлғаға айналу үшін біршама уақыт кетіпті."]}, "keywords": {"ok": {"kk": ["ұялы телефон мен гаджеттерді күнделікті қолдану", "жүрісін өзгерте бастапты"], "ru": []}, "A": {"kk": ["омыртқа мен жүйке ауруларының"], "ru": []}, "B": {"kk": ["15 келі салмаққа тең"], "ru": []}, "C": {"kk": ["маймыл тәріздес жануардан"], "ru": []}}, "editor_changes": ""}]}, {"bank_id": "kaz-L1-v3", "track": "first_language", "source": "Автордың құрастырған нұсқасы: НЗМ үлгісінің деңгейінде, мәтіндер қазақстандық сайттардан алынған (әр мәтіннің source_note өрісін қараңыз)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {}, "style_notes": [], "texts": [{"id": "l1v3-t1", "title": "", "source_note": "Aikyn.kz: «Әкесі дзюдоға жібермеген»: 17 жасында Олимпиада чемпионы атанған Фатима Сұпығалиева туралы не білеміз? – https://aikyn.kz/312947/kesi-dzyudog-a-zhibermegen--17-zhasynda-olimpiada-chempiony-atang-an-fatima-su-pyg-alieva-turaly-ne-bilemiz", "numbered_paragraphs": false, "paragraphs": ["Фатима Сұпығалиева 2009 жылы Батыс Қазақстан облысы Теректі ауданының Подстепное ауылында дүниеге келген. Ол төрт баланың үлкені. Әкесі Алтынбек Сұпығалиев – дзюдодан Қазақстанның спорт шебері, самбодан халықаралық дәрежедегі спорт шебері. Бір қызығы, әкесі бастапқыда қызының дзюдомен айналысқанын қаламаған. Ол Фатиманы көркем гимнастикаға берген. Бірақ қыздың көңілі күреске ауып, әкесінің жаттығуларын қызыға тамашалайтын болған. Ақыры тоғыз жасында дзюдоға келіп, алғашқы әдіс-тәсілдерді үйрене бастайды. Фатима 13 жасынан бастап Қазақстанның жасөспірімдер құрамасы сапында өнер көрсете бастады."]}, {"id": "l1v3-t2", "title": "Театртанушы Мәншүк Тәшімова: Балалар әдебиетіне бойлай алатын драматургтер аз", "source_note": "Informburo.kz: «Театртанушы Мәншүк Тәшімова: Балалар әдебиетіне бойлай алатын драматургтер аз» – https://informburo.kz/kaz/elaynasy/teatrtanusy-mansuk-tasimova-balalar-adebietine-boilai-alatyn-dramaturgter-az", "numbered_paragraphs": false, "paragraphs": ["– Соңғы бір жылдың ішінде жазылған шығармаларға талдау жасау шарт екен. Сенсеңіз, былтыр, яғни, 2021 жылы балалар драматургиясына ешқандай шығарма жазылмапты. Әйтеуір көп ізденгеніммен, жаңа шығармаларды кезіктіре алмадым. Жастардың қалам тартуы, балалар әдебиетіне бойлай алуы тым сирек. Әрине, балалар әдебиетіне қалам тартуға, шығарма жазуға кез келген ақын-жазушының жүрегі дауалай бермейді. Өйткені, бұл өте талғампаз, талапшыл оқырмандар оқитын шығарма жазылатын орта. Сондықтан да көптеген қаламгерлер беттей қоймайды. Балалар әдебиетінің кенжелеп қалуы әдебиеттің тоқырауына әкеліп соғады."]}, {"id": "l1v3-t3", "title": "Тәкаппарлық", "source_note": "Bilim-all.kz: «Тәкаппарлық» (Ғибратты әңгімелер) – https://bilim-all.kz/article/8036", "numbered_paragraphs": false, "paragraphs": ["Күндердің күнінде, жапырағы жайқалған еңселі бір теректің түбінен шырмауық тұқым жарып бой көтере бастапты. Көктемнің келісімен-ақ, әлгі шырмауық ағаштың ортан беліне дейін өсіп, ұзара түсіпті. Жаңбыр мен күн нұрының арқасында азғантай уақыттың ішінде шырмауық терекпен бірдей болып өсіп жетіліпті. Содан бір күні шырмауық ағашқа қарап: «Ағаш-ау, сен қанша айда осындай үлкен болып өстің?» депті. Терек болса: «Он жылда», – деп жауап қатыпты. Оны естіген шырмауық ішек-сілесі қатып, мақтана күліп: «Он жылда ма? Мына мен көп болса екі-ақ айда сенімен бойым бірдей болды, қарашы», – деп масайрапты. Терек болса: «Дұрыс айтасың», – депті де қойыпты.", "Уақыттың ағысымен жаздың ыстық күндерін қоңыр күз басып, ауа райы салқындай түсіпті. Күздің салқын желінен шырмауықтың жапырақтары үзіліп, шырмауық қалтырай бастайды. Содан кейін шырмауық ақырын-ақырын бүгіліп, бір уыс болып жерге жапырылып қалыпты. Бұл халіне таң қалып, терекке қарап: «Уа, ағаш-ау! Маған не болып барады?» – деп сұрапты. Сонда терек оған: «Менің он жылда шыққан шыңыма сен екі айда шығуға тырыстың», – деп қана жауап қатқан екен."]}, {"id": "l1v3-t4", "title": "", "source_note": "KAZ.NUR.KZ: «Әйгілі Amazon-да қызмет ететін қазақ қызы туралы не білеміз» – https://kaz.nur.kz/society/1884901-jgili-amazon-da-kyzmet-etetin-kazak-kyzy-turaly-ne-bilemiz/", "numbered_paragraphs": false, "paragraphs": ["Дара Түменбаева 25 жаста. Алматыда туып өсті. Мектеп бітірген соң еліміздегі Халықаралық IT университетіне оқуға түсті. Бір жыл шамасында «Математикалық және компьютерлік модельдеу» мамандығын оқыған соң, өзіне программалау, есептеу техникасы, ақпараттық қамтамасыз ету саласы жақын екенін түсінген. Кейін ата-анасынан рұқсат алып, оқуын Малайзияда осы мамандық бойынша жалғастырды.", "«2019 жылы қыркүйекте Linkedin порталындағы жеке профайлыма рекрутер компаниясының өкілі хабарласып, жұмысқа шақырды. Amazon-ға жұмысқа орналасу үшін дайындыққа сегіз ай уақыт жұмсадым. Сынақтардан сүрінбей өтуге IT саласындағы біліміммен қатар іс-тәжірибем де көмектесті. Жанымдағы достарым, таныстарымның көп көмегі тиді, олар менімен кері байланыс жасап, нәтижелерімді тексеріп көруге мүмкіндік берді», – дейді Дара.", "«Шыны керек, бүгінгі мен – ол миллиондаған инвестиция. Сол инвестицияны қайтару үшін әлі де көп жұмыс жасаймын. Өйткені кішкентай кезімнен мені ата-анам қолдады, қабілетіме қарай бағыт бере алды. Менде басқа балаларға қарағанда бос уақыт аз болды. Күнім спорт секциялары мен үйірмелерде өтті. Ата-анамыз алдымен бізден не қалайтынымызды сұрады, мәжбүрлеген жоқ.", "Менің анам – дәрігер. Ол кісі тәулігіне 12 сағат жұмыс істейді. Жұмыс барысында қандай да бір проблемаға тап келсем, бірден анам есіме түседі. Сол үшін жұмысымды адал атқаруға тырысамын», – дейді ол.", "«Басында көп нәрсеге қызықтым. Дәрігер боламын, архитектор боламын, тіпті қаржы министрі боламын деп ойладым. Ақырында IT саласын таңдадым, өйткені инновация, технологияға бала кезімнен қызықтым. Мамандығымды жақсы көретін себебім – сен үнемі дамып, жетіліп отырасың. Бірнәрсені қайта-қайта істемейсің», – дейді Дара Түменбаева."]}, {"id": "l1v3-t5", "title": "", "source_note": "BAQ.KZ: «17 жастағы ауыл оқушысы 22 балаға грант ұтып алуға көмектесті» – https://baq.kz/17-zhastagy-auyl-oqushysy-22-balaga-grant-utyp-aluga-komektesti-320021536/", "numbered_paragraphs": false, "paragraphs": ["Алматы облысында тұратын 11-сынып оқушысы Диас Абдылхак бір жыл ішінде 79 оқушыға физика пәнінен тегін көмектесіп, олардың 22-сі білім грантын жеңіп алуына ықпал етті.", "Диас – Алмалыбақ ауылының тумасы. Ол жоғары сыныпта жүріп-ақ өзінен кіші оқушыларға сабақ түсіндіруді бастаған. Айтуынша, бұл оған бала кезден таныс рөл.", "– Мен үйдің үлкенімін, сондықтан біреуге «аға» болу мен үшін бала кезден үйреншікті нәрсе. (1) Мен оқушыларға әрқашан көмек қолымды созып, білмегенін түсіндіремін. (2) Уақыт өте келе бұл менің өзіме де күш беретінін сезіндім, – дейді ол.", "Біртіндеп бұл бастама жүйелі жұмысқа айналған. Диас онлайн форматта сабақ өткізіп, кейін офлайн кездесулерде дайындықты жалғастырған. Нәтижесінде оның көмегін алған ондаған оқушы білімін жақсартып, олардың бір бөлігі грант иегері атанды.", "Бұл тәсіл білім берудегі «peer-to-peer» немесе оқушылардың бір-біріне көмектесу қағидатына негізделеді. Халықаралық зерттеулерде дәл осындай форматтың тиімді екені дәлелденген: оқушы материалды өз деңгейінде, қарапайым тілмен түсіндіргенде, ақпарат тезірек әрі жеңіл қабылданады.", "Диастың жеке жолы да оңай болмаған. (3) Ол кезінде іріктеуден өте алмай қалғанымен, дайындықты тоқтатпай, керісінше өзгелерге көмектесуді жалғастырған. Кейін оның еңбегі бағаланып, ол ауыл оқушыларына арналған IQanat білім беру бастамасы аясында оқу мүмкіндігіне ие болды.", "(4) Қазір ол оқуын жалғастыра отырып, жаңа оқушыларды дайындауды тоқтатпаған. (5) Биыл да ауылға барып, жас буынға көмектесіп жүр. Оның шәкірттері кезекті іріктеу кезеңдерінің нәтижесін күтіп отыр."]}, {"id": "l1v3-t6", "title": "Сабақта телефон пайдалануға тыйым салу. Мұғалім, оқушы, ата-ана не дейді?", "source_note": "BAQ.KZ: «Сабақта телефон пайдалануға тыйым салу. Мұғалім-оқушы-ата-ана не дейді?» – https://baq.kz/sabaqta-telefon-paydalanuga-tyyym-salu-mugalim-oqushy-ata-ana-ne-deydi-299449/", "numbered_paragraphs": true, "paragraphs": ["Зәуре Байменова, Орта білім комитеті төрағасының орынбасары: – Сабақ үстінде телефон қолдануға тыйым салынады. Бұл оқушыға да, мұғалімге де қатысты мәселе. Өйткені 45 минут сабақтың өзінің кезеңдері бар. Мысалы, үй тапсырмасын тексеру, жаңа тақырыпты түсіндіру және оны бекіту, жеке және топпен жұмыс. Осы жұмыстарды ұйымдастырып, өткізуге әрине телефон кедергі жасайды.", "Айжан Байжұманова, жас ұстаз: – Мұндай бұйрықтың шыққанын құп көремін. Өйткені сабақ үстінде оқушылардың 100% болмаса да, 5-6 оқушы телефонға алаңдайды. Тіпті мұғалім оқушыға мән бермесе, сабақ үстінде ойын ойнап отыра береді. Осылайша, кейбір оқушылар жаңа сабақты түсінбей жатады. Бірақ жаңа сабақтың тапсырмаларын бергенде интернетті қажет болатын кездер де болады. Осындай кезде телефонды қажет етеміз.", "Іңкәр мен Гауһар, 11 және 9-сынып оқушылары: – Біз ұялы телефонды мұғалімнің жинап алғаны дұрыс деп ойлаймыз. Себебі оқушы сабақ үстінде ұялы телефонды ұстағанда сабаққа көңіл бөлмейді, бұл бір жағынан мектептің білім сапасын төмендетеді. Ал ұялы телефонсыз сабаққа қатысқан оқушының сабаққа қызығушылығы артады, білімі көбейеді, мидағы артық ойдан арылады.", "Айнұр Тұмақбаева, ата-ана: – Мен өз басым балаларыма мектепке телефон апаруға рұқсат бермеймін. Дегенмен бұл жаңалықты, яғни осындай бұйрықтың талқыға шыққанын естіп қуандым. Себебі бала мектепте сабақ оқуы керек. Ұлым 4-сынып оқиды. Сыныптастары телефон апарып, сабақ үстінде ойнап отыратындарын айтады. Оларға қарап, балам алаңдайды. Сөйтіп өткен сабақты дұрыс түсінбей қалады."]}, {"id": "l1v3-t7", "title": "", "source_note": "Aikyn.kz: «Шетелде ұлық мейрам қалай тойланады?» – https://aikyn.kz/264346/shetelde-u-lyk--meyram-k-alay-toylanady", "numbered_paragraphs": false, "paragraphs": ["«Болашақ» бағдарламасының стипендиаты Жанар Тұрлыбекқызы алғаш рет Наурыз мейрамын шетелде тойлап жатыр. Айтуынша, атаулы мерекеге өзге ұлт өкілдері де, түркі халықтары да белсене атсалысыпты.", "«Тағылымдамадан өтетін уақытымыз 2024 жылы қазақтың жаңа жылына тұспа-тұс келіп, Ұлыбританияның Рединг университетінде оқуымыз басталып кетті. Уақыт жақындаған сайын жан-жақтан мерекелік шаралар ұйымдастырылып, өзге ұлттардың атсалысып жүргенін байқадық. Сол өзге ұлттармен байланысқа шығып, біз де өз дайындығымызды бастадық. Ұлттық тағамдарымызды іздеп, ұлттық киімдерімізді дайындап, ұлттық салт-дәстүрімізден көріністер көрсетуді жоспарлай бастадық.", "19 наурызда Рединг университетінде білім алып жатқан қазақ, өзбек, түркімен азаматтарымен бірлесе кешімізді көңілді өткіздік. Кеште ұлттық тағамдар, ұлттық әшекейлер мен жәдігерлерден кішігірім көрме жасап, өзге жерде жүріп өз тілімізде ән шырқап, қазақ тілінде айтылған әнге би билеп ғажап әсермен үйге қайттық. Әз Наурыздың арқасында ағылшын елінде жүргенімізді бір сәтке ұмытып кеттік. Жалпы, қазағымыздың қайда жүрсе де өз дәстүрін ұмытпай дәріптеп жүретіні көкейіміздегі патриоттық сезімімізді оятады екен», – деді Ж.Тұрлыбекқызы."]}, {"id": "l1v3-t8", "title": "Бір қазан сүт", "source_note": "Bilim-all.kz: «Бір қазан сүт» (Ғибратты әңгімелер) – https://bilim-all.kz/article/19535", "numbered_paragraphs": false, "paragraphs": ["Бір ауылда ашаршылық басталыпты. Ауыл басшысы ашаршылыққа қарсы бір амал тауып, шара қолданбақ болады. Ертесіне ауылдың қақ ортасына тайқазан орнатады. Сол қазанға ауыл тұрғындарына бір түнде бір кеседен сүт құюды әмір етіпті. Бар болғаны бір кесе сүт қана. Бірақ әркім оңаша, жеке дара келіп құюын талап етіпті. Ауыл тұрғындары басшы бұйрығын жаппай орындауға кірісіп кетеді. Сол түнде-ақ ай жарығымен қазанды толтырып тастайды.", "Таңертең ауыл басшысы келіп қазанның қақпағын ашып қараса... Сұмдық-ай! Өз көзіне өзі сенер емес. Адамдар сүт емес, қазанды суға толтырып кетіпті. Әсілі, оқиға былай болған еді. Қазанға сүт құюға барғандар «Үлкен тайқазанға елдің бәрі сүт құйып жатқанда, оған менің бір кесе құйған суым әсер ете қоймас» деп пендешілік ойға барған еді. Осылайша, барлығы да көпшілікке арқа сүйеп, бір кесе суда тұрған ештеңе жоқ деп немқұрайлық танытқан еді.", "Бұл қиссаны түйіндей келе айтпағымыз, қоғамда болатын келеңсіздіктер әр адамның жауапкершілікті сезінбеуі немесе жағдайға немқұрайлы қарауынан келіп туындайды. Қоғамды түзеу біреуді жөнге салудан емес, әркім өзін түзеуден басталса керек. Демек, әркім міндетін толыққанды атқарса, қоғам түзелмек."]}, {"id": "l1v3-t9", "title": "", "source_note": "Aikyn.kz: «Түнде телефонға жарты сағат қарау ұйқыны 13 минутқа қысқартады – зерттеу» – https://aikyn.kz/312423/tunde-telefong-a-zharty-sag-at-k-arau-u-yk-yny-13-minutk-a-k-ysk-artady---zertteu", "numbered_paragraphs": false, "paragraphs": ["Ұйықтар алдында телефон қарау жасөспірімдердің ұйқысына айтарлықтай әсер етуі мүмкін. АҚШ ғалымдары жүргізген жаңа зерттеу түнгі уақытта смартфонды небәрі жарты сағат артық пайдалану ұйқы ұзақтығын шамамен 13 минутқа қысқартатынын көрсетті.", "Зерттеуге 425 жасөспірім қатысқан. Олардың орташа жасы 14,8 жасты құрады. Ғалымдар арнайы қосымша арқылы қатысушылардың смартфонды қанша уақыт пайдаланғанын бақылап, фитнес-білезіктер көмегімен ұйқы ұзақтығын өлшеген. Зерттеу нәтижесінде кешкі сағат 22:00-ден кейін телефонды әдеттегіден 30 минут артық пайдаланған жасөспірімдердің шамамен 26 минут кеш ұйықтап, 11 минут кеш оянатыны анықталды. Мамандардың түсіндіруінше, әлеуметтік желілердегі жазбалар, бейнежазбалар, хабарламалар мен экран жарығы адамның сергек жүруіне ықпал етуі мүмкін. Соның салдарынан ұйықтау қиындап, ағзаның қалыпты тынығу тәртібі бұзылады."]}], "items": [{"id": "l1v3-q1", "number": 1, "text_id": "l1v3-t1", "stem": "Фатима дзюдомен қай жылдан бастап айналыса бастады?", "options": {"A": "2009 жылдан", "B": "2013 жылдан", "C": "2018 жылдан", "D": "2022 жылдан"}, "key": "C", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Фатима Сұпығалиева 2009 жылы Батыс Қазақстан облысы Теректі ауданының Подстепное ауылында дүниеге келген.", "Ақыры тоғыз жасында дзюдоға келіп, алғашқы әдіс-тәсілдерді үйрене бастайды."], "explanation": "Фатима 2009 жылы туған, ал дзюдоға тоғыз жасында келген. Демек, 2009 + 9 = 2018 жылдан бастап айналыса бастады.", "distractor_notes": {"A": "2009 жыл – Фатиманың туған жылы. Ол дзюдоға бірнеше жылдан кейін келген.", "B": "мәтіндегі 13 саны жылды емес, Фатиманың жасын білдіреді: ол 13 жасынан құрамада өнер көрсеткен.", "D": "2022 жылы (2009 + 13) Фатима жасөспірімдер құрамасына алынған. Дзюдоға ол одан бұрын келген."}, "distractor_evidence": {"A": ["Фатима Сұпығалиева 2009 жылы Батыс Қазақстан облысы Теректі ауданының Подстепное ауылында дүниеге келген."], "B": ["Фатима 13 жасынан бастап Қазақстанның жасөспірімдер құрамасы сапында өнер көрсете бастады."], "D": ["Фатима 13 жасынан бастап Қазақстанның жасөспірімдер құрамасы сапында өнер көрсете бастады."]}, "keywords": {"ok": {"kk": ["2009 жылы", "дүниеге келген", "тоғыз жасында дзюдоға келіп"], "ru": []}, "A": {"kk": ["2009 жылы", "дүниеге келген"], "ru": []}, "B": {"kk": ["13 жасынан"], "ru": []}, "D": {"kk": ["13 жасынан", "құрамасы сапында"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q2", "number": 2, "text_id": "l1v3-t2", "stem": "Маман қандай мәселеге тоқталады?", "options": {"A": "балалар театрларының санының тым аз болуына", "B": "балаларға пьеса жазатын авторлардың аздығына", "C": "оқушылардың театрға өте сирек баратындықтарына", "D": "ересектерге арналған пьесалардың сапасының төмендігіне"}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Сенсеңіз, былтыр, яғни, 2021 жылы балалар драматургиясына ешқандай шығарма жазылмапты.", "Жастардың қалам тартуы, балалар әдебиетіне бойлай алуы тым сирек.", "Сондықтан да көптеген қаламгерлер беттей қоймайды."], "explanation": "Маман 2021 жылы балалар драматургиясына бірде-бір шығарма жазылмағанын, жастардың балалар әдебиетіне сирек қалам тартатынын айтады. Яғни балаларға пьеса жазатын авторлар аз.", "distractor_notes": {"A": "маман театрлардың санына емес, оларға арналған шығармалардың жазылмауына тоқталады.", "C": "мәтінде оқушылардың театрға қаншалықты баратыны туралы айтылмайды.", "D": "маман ересектерге емес, балаларға арналған шығармалар туралы айтады."}, "distractor_evidence": {"A": [], "C": [], "D": ["Сенсеңіз, былтыр, яғни, 2021 жылы балалар драматургиясына ешқандай шығарма жазылмапты."]}, "keywords": {"ok": {"kk": ["ешқандай шығарма жазылмапты", "тым сирек", "беттей қоймайды"], "ru": []}, "D": {"kk": ["балалар драматургиясына"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q3", "number": 3, "text_id": "l1v3-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Шырмауықтың бойы екі айда теректің бойымен теңесті.\n2. Терек шырмауықтың сөзіне ашуланып, онымен дауласты.", "options": {"A": "екеуі де бұрыс", "B": "екеуі де дұрыс", "C": "тек біріншісі", "D": "тек екіншісі"}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Мына мен көп болса екі-ақ айда сенімен бойым бірдей болды, қарашы», – деп масайрапты.", "Терек болса: «Дұрыс айтасың», – депті де қойыпты."], "explanation": "Тек бірінші тұжырым дұрыс: шырмауық екі айда терекпен бойы бірдей болғанын айтады. Ал екінші тұжырым қате: терек дауласқан жоқ, «Дұрыс айтасың» деп қана қойды.", "distractor_notes": {"A": "бірінші тұжырым мәтінде бар. Шырмауықтың терекке не деп мақтанғанын қайта оқы.", "B": "екінші тұжырымды мәтінмен тағы салыстыр: терек шырмауыққа не деп жауап берді?", "D": "екінші тұжырымда терек ашуланып, дауласты делінген. Теректің жауабын қайта оқы."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["екі-ақ айда сенімен бойым бірдей болды", "«Дұрыс айтасың», – депті де қойыпты"], "ru": []}}, "editor_changes": "Емле мен тыныс белгі түзетілді: «келісімен ақ» → «келісімен-ақ», «екі ақ айда» → «екі-ақ айда», «Ағаш ау» → «Ағаш-ау»; төл сөз алдындағы нүктелі үтір қос нүктемен ауыстырылды."}, {"id": "l1v3-q4", "number": 4, "text_id": "l1v3-t3", "stem": "«Менің он жылда шыққан шыңыма сен екі айда шығуға тырыстың».\nТерек не айтқысы келді?", "options": {"A": "Тез әрі оңай келген биіктік ұзаққа бармайды.", "B": "Шырмауық келесі жылы теректен де биік болады.", "C": "Екеуінің бойы бірдей болса да, жасы әртүрлі.", "D": "Күз келгенде барлық өсімдіктің жапырағы түседі."}, "key": "A", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Терек болса: «Он жылда», – деп жауап қатыпты.", "Содан кейін шырмауық ақырын-ақырын бүгіліп, бір уыс болып жерге жапырылып қалыпты."], "explanation": "Терек он жылда тамырын тереңге жайып, біртіндеп өсті, сондықтан берік. Ал шырмауық екі айда асығыс өсіп, алғашқы суықта жерге жапырылды. Терек тез әрі оңай келген биіктіктің ұзаққа бармайтынын айтып тұр.", "distractor_notes": {"B": "шырмауық келесі жылы өседі деп айтылмайды, керісінше күзде жерге жапырылды.", "C": "терек жастарын салыстырып тұрған жоқ. Ол шырмауықтың неге құлағанын түсіндіреді.", "D": "терек күздің табиғаты туралы емес, асығыс өсудің салдары туралы айтады. Жапырағы түскенмен, терек құлаған жоқ."}, "distractor_evidence": {"B": ["Содан кейін шырмауық ақырын-ақырын бүгіліп, бір уыс болып жерге жапырылып қалыпты."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["он жылда", "жерге жапырылып қалыпты"], "ru": []}, "B": {"kk": ["жерге жапырылып қалыпты"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q5", "number": 5, "text_id": "l1v3-t4", "stem": "Неліктен Дара IT саласын таңдады?", "options": {"A": "Анасы сияқты дәрігер болғысы келгендіктен", "B": "Amazon компаниясы жұмысқа шақырғандықтан", "C": "Малайзияда оқуға мүмкіндік алғандықтан", "D": "технологияға бала кезінен қызыққандықтан"}, "key": "D", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ақырында IT саласын таңдадым, өйткені инновация, технологияға бала кезімнен қызықтым."], "explanation": "Дара IT саласын таңдаудың себебін өзі айтады: «өйткені инновация, технологияға бала кезімнен қызықтым».", "distractor_notes": {"A": "Дара бала кезінде дәрігер болуды да ойлаған, бірақ ақырында IT саласын таңдаған.", "B": "Amazon оны IT маманы болған соң, оқуын бітіргеннен кейін шақырды. Бұл – таңдаудың себебі емес, нәтижесі.", "C": "Дара Малайзияда IT мамандығын таңдағаннан кейін барып оқыды."}, "distractor_evidence": {"A": ["Дәрігер боламын, архитектор боламын, тіпті қаржы министрі боламын деп ойладым."], "B": ["«2019 жылы қыркүйекте Linkedin порталындағы жеке профайлыма рекрутер компаниясының өкілі хабарласып, жұмысқа шақырды."], "C": ["Кейін ата-анасынан рұқсат алып, оқуын Малайзияда осы мамандық бойынша жалғастырды."]}, "keywords": {"ok": {"kk": ["IT саласын таңдадым", "бала кезімнен қызықтым"], "ru": []}, "A": {"kk": ["Дәрігер боламын"], "ru": []}, "B": {"kk": ["жұмысқа шақырды"], "ru": []}, "C": {"kk": ["осы мамандық бойынша жалғастырды"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q6", "number": 6, "text_id": "l1v3-t4", "stem": "«Шыны керек, бүгінгі мен – ол миллиондаған инвестиция».\nДара не айтқысы келді?", "options": {"A": "Бүгінгі жетістігі – ата-анасының оған салған еңбегінің жемісі.", "B": "Amazon компаниясы оған жыл сайын миллиондаған көлемде жалақы төлейді.", "C": "Оның стартап жобаларына миллиондаған инвестиция салынып жатыр.", "D": "Шетелде IT мамандығы бойынша оқу өте қымбат әрі қиын болып келеді."}, "key": "A", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Өйткені кішкентай кезімнен мені ата-анам қолдады, қабілетіме қарай бағыт бере алды.", "Күнім спорт секциялары мен үйірмелерде өтті."], "explanation": "«Инвестиция» – бір нәрсеге болашақта пайда әкелсін деп салынған қаржы мен еңбек. Дара ата-анасы бала кезінен оны қолдап, түрлі үйірмелер мен секцияларға бергенін айтады. Яғни бүгінгі жетістігі – ата-анасының оған салған еңбегі мен қаржысының жемісі.", "distractor_notes": {"B": "Дара жалақысы туралы айтып тұрған жоқ. Ол «инвестицияны қайтару үшін» өзі әлі көп жұмыс істейтінін айтады.", "C": "мәтінде Дараның стартаптары мен оларға салынған қаржы туралы айтылмайды.", "D": "Дара оқудың бағасы туралы емес, ата-анасы бала кезінен оған көп күш жұмсағаны туралы айтады."}, "distractor_evidence": {"B": ["Сол инвестицияны қайтару үшін әлі де көп жұмыс жасаймын."], "C": [], "D": ["Өйткені кішкентай кезімнен мені ата-анам қолдады, қабілетіме қарай бағыт бере алды."]}, "keywords": {"ok": {"kk": ["ата-анам қолдады", "спорт секциялары мен үйірмелерде"], "ru": []}, "B": {"kk": ["инвестицияны қайтару үшін"], "ru": []}, "D": {"kk": ["кішкентай кезімнен"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q7", "number": 7, "text_id": "l1v3-t4", "stem": "Дараның анасы туралы сөзінен қандай сезім байқалады?", "options": {"A": "аяныш", "B": "құрмет", "C": "қызғаныш", "D": "сағыныш"}, "key": "B", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Жұмыс барысында қандай да бір проблемаға тап келсем, бірден анам есіме түседі.", "Сол үшін жұмысымды адал атқаруға тырысамын», – дейді ол."], "explanation": "Дара анасы тәулігіне 12 сағат жұмыс істейтінін айтып, қиындыққа тап болғанда соны есіне алатынын, сол үшін өз жұмысын адал атқаруға тырысатынын жеткізеді. Анасын үлгі тұтады – бұл құрмет сезімі.", "distractor_notes": {"A": "Дара анасын аяп тұрған жоқ, керісінше оның еңбегін үлгі тұтады.", "C": "Дара анасын қызғанбайды. Ол анасынан үлгі алатынын айтады.", "D": "Дара анасын сағынғаны туралы айтпайды. Ол қиындыққа тап болғанда анасының еңбегін еске алады."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["бірден анам есіме түседі", "адал атқаруға тырысамын"], "ru": []}}, "editor_changes": ""}, {"id": "l1v3-q8", "number": 8, "text_id": "l1v3-t5", "stem": "Мәтіндегі 1–5-сөйлемдерден нені аңғаруға болады?\nДиас –", "options": {"A": "физиканы жақсы білетін, бірақ тек өз дайындығын ойлайтын оқушы.", "B": "ауыл мектебінде физикадан сабақ беретін тәжірибелі мұғалім.", "C": "алғашқы іріктеуден оңай өтіп, бірден оқуға түскен оқушы.", "D": "қиындыққа мойымайтын, өзгеге көмектесуге әрдайым дайын жан."}, "key": "D", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 3, "negative": false, "fixed_order": false, "evidence": ["(1) Мен оқушыларға әрқашан көмек қолымды созып, білмегенін түсіндіремін.", "(3) Ол кезінде іріктеуден өте алмай қалғанымен, дайындықты тоқтатпай, керісінше өзгелерге көмектесуді жалғастырған.", "(5) Биыл да ауылға барып, жас буынға көмектесіп жүр."], "explanation": "1–5-сөйлемдерде Диас оқушыларға әрқашан көмектесетінін, іріктеуден өте алмаса да берілмей, өзгелерге көмектесуді жалғастырғанын, қазір де ауылға барып көмектесетінін көреміз. Демек, ол – қиындыққа мойымайтын, өзгеге көмектесуге әрдайым дайын жан.", "distractor_notes": {"A": "Диас тек өзін ойламайды: ол бір жылда 79 оқушыға тегін көмектескен.", "B": "Диас – мұғалім емес, 11-сынып оқушысы.", "C": "мәтінде керісінше айтылған: Диас кезінде іріктеуден өте алмай қалған."}, "distractor_evidence": {"A": ["Алматы облысында тұратын 11-сынып оқушысы Диас Абдылхак бір жыл ішінде 79 оқушыға физика пәнінен тегін көмектесіп, олардың 22-сі білім грантын жеңіп алуына ықпал етті."], "B": ["Алматы облысында тұратын 11-сынып оқушысы Диас Абдылхак бір жыл ішінде 79 оқушыға физика пәнінен тегін көмектесіп, олардың 22-сі білім грантын жеңіп алуына ықпал етті."], "C": ["(3) Ол кезінде іріктеуден өте алмай қалғанымен, дайындықты тоқтатпай, керісінше өзгелерге көмектесуді жалғастырған."]}, "keywords": {"ok": {"kk": ["әрқашан көмек қолымды созып", "дайындықты тоқтатпай", "жас буынға көмектесіп жүр"], "ru": []}, "A": {"kk": ["79 оқушыға физика пәнінен тегін көмектесіп"], "ru": []},
