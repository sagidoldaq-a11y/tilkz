<style>
:root{
  --paper:#F4F6F9; --panel:#FFFFFF; --ink:#18212E; --muted:#596476; --line:#DCE1E8;
  --accent:#1D5BA6; --accent-soft:#E3ECF7;
  --ok:#1C7A4E; --ok-soft:#E1F2E9; --bad:#B23A30; --bad-soft:#F8E4E2;
  --good:#5CCB8A; --mid:#F2C230; --weak:#E5534B;
  --f-text:"PT Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;caret-color:transparent}
input,textarea,select{caret-color:auto}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand a{font-family:var(--f-ui);font-weight:800;font-size:22px;letter-spacing:-.3px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand a .ai{color:var(--accent);font:inherit;letter-spacing:inherit}
.brand > span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:4px 10px;font-size:13px}
.themebtn{width:36px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:999px;display:grid;place-items:center;font-size:16px;padding:0}
main{padding-block:22px 60px}
h1{font-family:var(--f-text);font-size:28px;margin:0 0 4px;line-height:1.25}
h2{font-family:var(--f-text);font-size:21px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.eyebrow{font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--muted)}
.crumbs button{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
/* Кіру */
.auth{max-width:440px;margin:30px auto}
.af{display:grid;gap:12px}
.af label{display:grid;gap:5px;font-size:14px;font-weight:600}
.af input,.af select{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.af .err{color:var(--bad);font-size:14px;margin:0;min-height:1em}
.af .hint{font-size:13px;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Сыныптар */
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ccard h3{font-family:var(--f-text);font-size:19px;margin:0}
.ccard.closed{opacity:.7}
.code{font:700 22px/1 var(--f-ui);letter-spacing:4px;color:var(--accent)}
.meta{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.newclass{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.newclass input{flex:1 1 220px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* Сынып беті */
.classhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:700 24px var(--f-text);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.vtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.vtabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.vtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14px}
.filters select,.filters input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--paper)}
th button{border:0;background:none;padding:0;font-weight:700;color:inherit}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--accent-soft)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.pill.good{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:#FBF1CC;color:#7A5A00} .pill.weak{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--paper);color:var(--muted)}
:root[data-theme="dark"] .pill.mid{background:#3A3215;color:#F2C230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.mid{background:#3A3215;color:#F2C230}}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* Жолақтар */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 5.5em;gap:12px;align-items:center;font-size:14px}
.bar .track{height:12px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar .v small{color:var(--muted)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grp{font-weight:700;margin:16px 0 6px;font-size:14px}
/* Оқушы беті */
.qlist{display:grid;gap:10px}
.qi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.qi .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.qi .stem{font-weight:600;white-space:pre-line;margin-bottom:6px}
.qi .ans{display:grid;gap:3px}
.qi .ans .w{color:var(--bad)} .qi .ans .k{color:var(--ok)}
.status{font-weight:700}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.second{color:#B07A00}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.att{display:grid;gap:8px}
@media (min-width:1400px){
  .wrap{max-width:none;width:90%;padding-left:0;padding-right:0}
  body{font-size:16.5px} table{font-size:15.5px} th{font-size:13.5px} .btn{font-size:15px}
  h1{font-size:32px} h2{font-size:23px} .kpi b{font-size:28px} .kpi span,.meta{font-size:14.5px}
  .bar{font-size:15.5px} .qi{font-size:15.5px} .classes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media (max-width:760px){
  #stuBtn{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .twocol{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(0,1fr) 5em;}
  .bar .track{grid-column:1/-1;grid-row:2}
  h1{font-size:24px}
  .brand > span{display:none}
}
</style>

const SB_CFG = {"url": "https://yqfepngubehrupkitklr.supabase.co", "key": "sb_publishable_R_DvPrvev24GFHUtyGwhRw_r5CopZYH"};

ть по стране и находить общий язык с местными жителями, мне пришлось выучить русский язык.", "Кейін жергілікті бір қарт маған америкалық археолог Рафаэль Пампелли туралы айтып берді.": "Позже один местный старик рассказал мне об американском археологе Рафаэле Пампелли.", "жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады": "им понравилась наша работа, потому что они могут свободно путешествовать вместе с нами", "Ал екі ұлым болашақта археолог болғысы келмесе де, бізбен бірге үлкен қазба жұмыстарына қатысып, жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады.": "А двое моих сыновей, хотя и не хотят в будущем становиться археологами, участвуют с нами в больших раскопках, и им понравилась наша работа, потому что они могут свободно путешествовать вместе с нами.", "Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық.": "Прошлым летом мы возили их на озеро Титикака в Андах, в Южной Америке.", "Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын.": "Этот человек ничем не отличается от меня. Я поступил бы точно так же.", "Мысалы, заманында кемелерден түскен тауарларды сақтайтын ескі үйдің алдынан 700 жылдық төсеніш тауып алдық.": "Например, перед старым домом, где когда-то хранили товары с кораблей, мы нашли подстилку 700-летней давности.", "теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын": "я участвую в нескольких проектах по изучению морского дна и до сих пор продолжаю рисовать найденные предметы", "Менің әйелім де археолог.": "Моя жена тоже археолог.", "Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды – бұл Қытаймен арадағы сауданың қызу жүруіне байланысты болса керек.": "Примерно в XVII веке во Франции и Англии зонты начинают широко распространяться — вероятно, благодаря оживлённой торговле с Китаем.", "Ежелгі мысырлықтар ... оны арнайы қызметшілер атқарған": "Древние египтяне ... это делали специальные слуги", "ежелгі Грецияға ... дұрысы, құлдары көтеріп жүретін": "в Древнюю Грецию ... вернее, его носили их рабы", "Қолшатыр шығыстан ежелгі Грецияға келе сала жергілікті сәнқой арулардың қолынан түспейтін аксессуарға айналды.": "Попав с Востока в Древнюю Грецию, зонт сразу стал любимым аксессуаром местных модниц."}, "style_notes": ["«Мазалама» деп жазба, оның орнына «Уайымдама» не «Алаң болма» де"], "texts": [{"id": "v1-t1", "title": "Қолшатыр тарихы", "source_note": "«OYLA» журналы", "source_note_ru": "журнал «OYLA»", "numbered_paragraphs": true, "paragraphs": ["Ең алғашқы қолшатырлар ұзын таяқшаға таңылған алып веер түрінде болған. Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған. Мұндай қолшатырлар түрлі шеру кезінде фараондар мен олардың отбасын Африканың шақырайған күн көзінен қорғаған. Әрине, қолшатырды әміршінің өзі ұстамаған: оны арнайы қызметшілер атқарған.", "Осыған ұқсас дәстүр Месопотамияда, Парсы елінде, Қытай, Жапония мен Үндістанда да болған. Ассирияда қолшатыр тек патшаларға тән атрибут болған, ал Қытайда көлеңкеге жасырыну құқығы тек ақсүйектерге берілген. Ежелгі өркениет тұрғындары қолшатырды көре сала оның астында аса маңызды біреу отырғанын бірден түсінген.", "Қолшатыр шығыстан ежелгі Грецияға келе сала жергілікті сәнқой арулардың қолынан түспейтін аксессуарға айналды. Белгілі бір себептерге байланысты оны тек әйелдер ғана (дұрысы, құлдары көтеріп жүретін) пайдаланатын, ал ер адамдар үшін қолшатыр ұстау ұят саналатын.", "Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды – бұл Қытаймен арадағы сауданың қызу жүруіне байланысты болса керек. Ол уақыттарда қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған, ал күмбезі – жасалуы аса қолайсыз майланған жібектен болған. Ақыры 1852 жылы британ кәсіпкері Сэмюэль Фокс тура қазіргі түрлері секілді іші қуыс болат тұтқаларды ұсынды. Конструкциясы жеңіл әрі берік бола түсті. Сондай-ақ қалталы азаматтар ішіне қылыштарын немесе құтыларын салып қоюға болатын ерекше тұтқалы қолшатырларға тапсырыс бере бастады. XIX ғасыр ортасында қолшатыр ерлер аксессуарларының арасынан ойып тұрып орын алды.", "Қазіргі таңда қолшатырды ерлер де, әйелдер де пайдалана береді, бірақ қызықты айырмашылық та бар. Мысалы, sunnycomb.com сайты 35 елдің тұрғындарының арасында жүргізген сауалнама нәтижесіне сәйкес, ер адамдар көбіне қара түсті, ал әйелдер жасыл не қызыл түсті қолшатырды құп көретіндері анықталды. Сондай-ақ ер азаматтар аксессуарды әйелдерге қарағанда екі есе жиі жоғалтады."]}, {"id": "v1-t2", "title": "Абзал мен етікші", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Баяғы бір заманда Күйік шаһарында бір етікші болыпты. Оның жақын көршісінің Абзал есімді баласы бар екен. Ол бала ата-анасынан жақсы тәрбие алып, ненің жаман, ненің жақсы екенін үйреніп алады. Үлкендерге құрмет көрсететін тіл алғыш, адал, көркем мінезді ұл болып өседі. Өз күшімен еңбек етіп, ата-анасына көмектесу ойымен, етікшінің жанына көмекші болып барады. Ерінбей, жалықпай етікшіліктің бар қыр-сырын үйренеді. Абзал бір күні етікшінің етік жамағанда үнемі жібін түймейтіндігін байқап қалыпты. Аң-таң болған бала етікші ұстазынан мұның мән-сырын сұрайды.", "Сонда ол:", "– Қарағым, етік жамағанда жіпті түймесең, ол етік көп ұзамай қайта жыртылады. Сөйтіп оның иесі оны жаматуға қайта әкеледі. Одан маған жұмыс, бала-шағама нан табылады, – дейді.", "Сонда Абзал ата-анасының айтқан ізгілік тәрбиесін есіне түсіріп:", "– Ағатай, бұл дұрыс емес қой, адам кәсібіне адал болуы қажет емес пе?! – дейді.", "Етікші бұл сөзге құлақ аспай:", "– Адалдық адамға нан болмайды ғой! – деп жауап береді. Абзал ұстазымен сөз таластырмайды.", "Ұстазының бұл әрекетіне іштей разы болмаса да, етікшілік кәсібін меңгеруді жалғастыра береді. Күндердің бір күнінде бала етікшілік кәсіпті ұстазынан кем білмейтін дәрежеге жетіп, өз бетінше етік тігуге кіріседі. Бірақ ол етік жамағанда жіпті түйіп тігеді. Арада көп уақыт өтпей-ақ шаһар халқы ісін ұқыпты істейтін етікші туралы естиді. Жұрттың барлығы етіктерін соған жамататын болады. Ал оның ұстазына етік жаматуға мүлде ешкім келмей қояды. Ұстазы мұның мәнісін білмек болып, шәкіртінен сұрайды. Ол: «__________», – депті."]}, {"id": "v1-t3", "title": "Пошташы көгершін", "source_note": "", "numbered_paragraphs": true, "paragraphs": ["Көгершін – жер тануда **алдына жан салмайтын** киелі құс. Туған жерін, ұя салған орнын жазбай таниды. Көгершінді ұстап алып, алысқа апарып тастаса да, ұясын іздеп табады. Мұны адамдар ежелден байқаған. Сондықтан көгершінді пошташы «қызметіне» алып, қарым-қатынас құралына айналдырған.", "Пошта тасуға басқа құстарды да үйретуге болады. Бірақ хатшылық – көгершіннің қанында бар қасиет. Оны үйретудің қажеті жоқ. Хатты байлап, ұшырып жіберсең болды – туған жерін айнымай табады. Көгершіннің кемшілігі – тек бір бағытта ғана хат таси алатыны, яғни тек үйіне қарай ұшатыны. Француздар шағаланы, орыстар сұңқарды, ағылшындар қарлығашты пошта тасуға үйретіп көрген. Алайда олар көгершіндей көрсеткіш көрсете алмады. Көгершін хатты жылдам жеткізеді әрі күн райының қиындығына қарамайды.", "Көгершінді қолға үйретудің тарихына үңілетін болсақ, бәрі көне гректерден басталғанын көреміз. Көне Грекияда адамдар көгершінді туған жерінен ұстап әкетіп, хат байлап қайта ұшырып жіберген. Мәселен, Олимпиада ойындарының жүлдегерін көгершін арқылы еліне хабарлаған.", "1176 жылы Мысырда Нұраддин патшаның кезінде ресми түрде мемлекеттік көгершін пошта қызметі құрылған. Ал француздар көгершінді 1870–1871 жылдары болған француз-неміс соғысында жиі пайдаланған. Тіпті немістер хабаршының жолын кесу үшін қаршығаны қолданған. Бірақ француздар мұның да амалын тапқан екен. Көгершіннің аяғына кішкентай ысқырық тағып жіберген. Ысқырық құс ұшқан кезде ауаға үйкеліп, ащы дыбыс шығарады. Бұл дыбыстан жыртқыш құстар қорқып, көгершінге жоламайды.", "Қазір коммуникацияның дамыған заманы. ХХ ғасыр логистиканың ғасыры болса, ХХІ ғасыр – ақпарат пен коммуникация ғасыры. Әлемнің кез келген жеріне қас қағым сәтте хат жіберуге болады. Алайда пошташы көгершіндердің ғұмыры таусылған уақыт десек, қателескен боламыз, себебі кей жерлерде олар әлі күнге дейін жақын арақашықтықта пошта тасуға қолданылады. Мәселен, ағылшынның Плимут қаласының дәрігерлері әлі күнге дейін клиникадағы қан талдамасын зертханаға көгершінмен жібереді. Клиника мен зертхананың арасы жап-жақын, бірақ көлік кептелісінің кесірінен дәрігерлер сараптама қорытындысын дер кезінде жеткізу үшін сол көгершіннің көмегіне әлі күнге дейін жүгінеді. Үндістан да шалғай елді мекендерге көгершінмен пошта жеткізеді екен."]}, {"id": "v1-t4", "title": "Археолог әңгімесі", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Археологтермен бірге алғаш жұмыс істей бастағанымда мен олар сияқты жерден заттарды қазумен айналысқан жоқпын. Оның орнына суретші болып жұмыс істедім, олар тапқан нәрселердің бейнесін қағаз бетіне түсіруге тырыстым. Алайда уақыт өте келе заттардың суретін салудан гөрі олардың тарихы, болмысы қызықтыратын болды. Археологиядағы мансабым осылай басталды. Қазірде Мысырдан Моңғолияға дейін созылған атақты «Жібек жолын» зерттеумен айналысамын. Сонымен қатар теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын.", "Археология саласындағы менің пірім – Рафаэль Пампелли деген америкалық зерттеуші. Мен ол туралы алғаш студент кезімде, Азияның дәл ортасында орналасқан Түркіменстанға саяхат барысында естідім. Елді аралау және жергілікті халықпен тіл табыса білу үшін орыс тілін үйренуге тура келді. Ол жерге жеткенде: «Уау! Мен мұнда аяқ басқан алғашқы америкалықтардың бірімін!» – деп ойладым. Кейін жергілікті бір қарт маған америкалық археолог Рафаэль Пампелли туралы айтып берді. Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен.", "Менің әйелім де археолог. Ал екі ұлым болашақта археолог болғысы келмесе де, бізбен бірге үлкен қазба жұмыстарына қатысып, жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады. Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық. Сондықтан отбасымызбен археологпыз десем, қателеспейтін шығармын.", "Осы салада басымнан өткен ең қызық жағдай Мысырдың Қызыл теңіз жағалауында жүргізілген қазба жұмысы кезінде болды. Ол жақта жаңбыр сирек жауып, ауа өте құрғақ болғаны сонша, көп нәрсе бастапқы қалпында сақталған. Мысалы, заманында кемелерден түскен тауарларды сақтайтын ескі үйдің алдынан 700 жылдық төсеніш тауып алдық. Астын көтеріп қарасақ, үй иесінің аты жазылған кілт сол қалпы жатыр екен. Иесі алыс сапарға шығып, кез келген минутта үйіне қайтып келетіндей көрінді. Сол кезде мен: «Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын», – деп ойладым."]}], "items": [{"id": "v1-q01", "number": 1, "text_id": "v1-t1", "stem": "Мәтін бойынша қолшатыр жасау үшін қай материал ҚОЛДАНЫЛМАҒАН?", "options": {"A": "Кит мұрты", "B": "Папирус", "C": "Емен жапырақтары", "D": "Болат"}, "key": "C", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 3, "negative": true, "evidence": ["Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған. (1-азатжол)", "қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған (4-азатжол)", "іші қуыс болат тұтқаларды ұсынды (4-азатжол)"], "explanation": "Мәтінде пальма жапырақтары айтылады, ал емен жапырақтары туралы еш жерде сөз жоқ.", "distractor_notes": {"A": "кит мұрты қолшатыр жасауға қолданылған. Ол туралы 4-азатжолда жазылған.", "B": "папирус қолшатыр жасауға қолданылған. Ол туралы 1-азатжолда жазылған.", "D": "болат та қолданылған. Болат тұтқалар туралы 4-азатжолда жазылған."}, "editor_changes": "«Қауырсын» нұсқасы алынды. Сұрақ толық сөйлемге айналды, болымсыздық бас әріппен берілді.", "distractor_evidence": {"A": ["қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған"], "B": ["Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған"], "D": ["іші қуыс болат тұтқаларды ұсынды"]}, "keywords": {"ok": {"kk": ["қауырсыннан", "папирус", "пальма жапырақтарынан", "қамыстан", "киттің мұртынан", "болат"], "ru": ["перьев", "папируса", "пальмовых листьев", "тростника", "китового уса", "стальные"]}, "A": {"kk": ["киттің мұртынан"], "ru": ["китового уса"]}, "B": {"kk": ["папирус"], "ru": ["папируса"]}, "D": {"kk": ["болат тұтқаларды"], "ru": ["стальные ручки"]}}, "explanation_ru": "В тексте упоминаются пальмовые листья, а о дубовых листьях не сказано нигде.", "distractor_notes_ru": {"A": "Китовый ус использовался для изготовления зонтов. Об этом написано в 4-м абзаце.", "B": "Папирус использовался для изготовления зонтов. Об этом написано в 1-м абзаце.", "D": "Сталь тоже использовалась. О стальных ручках написано в 4-м абзаце."}, "fixed_order": false}, {"id": "v1-q02", "number": 2, "text_id": "v1-t1", "stem": "Мәтін бойынша қолшатырды қызметшісіне ұстатқызу дәстүрі қай елге қатысты АЙТЫЛМАЙДЫ?", "options": {"A": "Франция", "B": "Үндістан", "C": "Мысыр", "D": "Греция"}, "key": "A", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 3, "negative": true, "evidence": ["Ежелгі мысырлықтар ... оны арнайы қызметшілер атқарған (1-азатжол)", "Осыған ұқсас дәстүр ... Үндістанда да болған (2-азатжол)", "ежелгі Грецияға ... дұрысы, құлдары көтеріп жүретін (3-азатжол)"], "explanation": "Франция 4-азатжолда аталады, бірақ онда қолшатырдың жаппай қолданысқа енгені айтылады, қызметші туралы сөз жоқ.", "distractor_notes": {"B": "мәтінде Үндістанда да осындай дәстүр болғаны айтылады. Ол туралы 2-азатжолда жазылған.", "C": "мысырлықтардың қолшатырын арнайы қызметшілер ұстаған. Ол туралы 1-азатжолда жазылған.", "D": "ежелгі Грецияда қолшатырды құлдар көтеріп жүрген. Ол туралы 3-азатжолда жазылған."}, "editor_changes": "«Қытай» нұсқасы алынды.", "distractor_evidence": {"B": ["Осыған ұқсас дәстүр Месопотамияда, Парсы елінде, Қытай, Жапония мен Үндістанда да болған"], "C": ["Ежелгі мысырлықтар", "оны арнайы қызметшілер атқарған"], "D": ["Қолшатыр шығыстан ежелгі Грецияға келе сала", "дұрысы, құлдары көтеріп жүретін"]}, "keywords": {"ok": {"kk": ["мысырлықтар", "қызметшілер", "дәстүр", "Үндістанда", "Грецияға", "құлдары"], "ru": ["египтяне", "слуги", "традиция", "Индии", "Древнюю Грецию", "рабы"]}, "B": {"kk": ["Осыған ұқсас дәстүр", "Үндістанда"], "ru": ["Похожая традиция", "Индии"]}, "C": {"kk": ["мысырлықтар", "қызметшілер"], "ru": ["египтяне", "слуги"]}, "D": {"kk": ["Грецияға", "құлдары"], "ru": ["Древнюю Грецию", "рабы"]}}, "explanation_ru": "Франция упоминается в 4-м абзаце, но там говорится о массовом распространении зонтов, а о слугах ничего не сказано.", "distractor_notes_ru": {"B": "В тексте сказано, что в Индии тоже была такая традиция. Об этом написано во 2-м абзаце.", "C": "Зонты египтян держали специальные слуги. Об этом написано в 1-м абзаце.", "D": "В Древней Греции зонты носили рабы. Об этом написано в 3-м абзаце."}, "fixed_order": false}, {"id": "v1-q03", "number": 3, "text_id": "v1-t1", "stem": "Мәтін мазмұны бойынша қай тұжырым дұрыс?", "options": {"A": "Сауалнамаға сәйкес, қазір әйелдер көбіне сары түсті қолшатыр таңдайды екен.", "B": "Ер адамдар шамамен 1850 жылдардан бастап қолшатырды еркін қолдана бастаған.", "C": "Ежелгі заманда барлық өңірде қолшатырды тек әйел адамдар қолданған.", "D": "Қолшатырдың қазіргідей үлгісі XVII ғасырда жасала бастады."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "evidence": ["XIX ғасыр ортасында қолшатыр ерлер аксессуарларының арасынан ойып тұрып орын алды. (4-азатжол)"], "explanation": "XIX ғасырдың ортасы – шамамен 1850 жылдар. Дәл осы кезде қолшатыр ерлердің аксессуарына айналған.", "distractor_notes": {"A": "мәтінде әйелдер сары емес, жасыл не қызыл түсті қолшатырды таңдайтыны айтылады. Ол туралы 5-азатжолда жазылған.", "C": "қолшатырды тек әйелдер ұстаған жер – ежелгі Греция ғана, ал Мысырда ол фараондарды қорғаған. Бұл туралы 1 және 3-азатжолдарда жазылған.", "D": "XVII ғасыр – 1600–1699 жылдар аралығы. Мәтінде XVII ғасырда қолшатыр Франция мен Англияда тек жаппай қолданысқа ене бастағаны айтылады. Ал қазіргідей болат тұтқалы қолшатырды Сэмюэль Фокс 1852 жылы ұсынған. 1852 жыл – XIX ғасыр (1800–1899 жылдар). Демек, қазіргі үлгі XVII ғасырда емес, одан шамамен 200 жыл кейін, XIX ғасырда пайда болған. Бұл туралы 4-азатжолда жазылған."}, "editor_changes": "Екіұшты «Қолшатыр Грецияға келе сала жаппай қолданысқа ене бастайды» нұсқасы алынды.", "distractor_evidence": {"A": ["әйелдер жасыл не қызыл түсті қолшатырды құп көретіндері анықталды"], "C": ["Қолшатыр шығыстан ежелгі Грецияға келе сала", "фараондар мен олардың отбасын", "оны тек әйелдер ғана"], "D": ["Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды", "Ақыры 1852 жылы британ кәсіпкері Сэмюэль Фокс тура қазіргі түрлері секілді іші қуыс болат тұтқаларды ұсынды"]}, "keywords": {"ok": {"kk": ["XIX ғасыр ортасында", "ерлер аксессуарларының"], "ru": ["В середине XIX века", "мужских аксессуаров"]}, "A": {"kk": ["жасыл не қызыл"], "ru": ["зелёные или красные"]}, "C": {"kk": ["фараондар", "Грецияға", "тек әйелдер ғана"], "ru": ["фараонов", "Древнюю Грецию", "только женщины"]}, "D": {"kk": ["XVII ғасырларда", "жаппай қолданысқа ене бастайды", "1852 жылы", "Сэмюэль Фокс", "болат тұтқаларды"], "ru": ["XVII веке", "широко распространяться", "1852 году", "Сэмюэль Фокс", "стальные ручки"]}}, "explanation_ru": "Середина XIX века — это примерно 1850-е годы. Именно тогда зонт стал мужским аксессуаром.", "distractor_notes_ru": {"A": "В тексте сказано, что женщины выбирают не жёлтые, а зелёные или красные зонты. Об этом написано в 5-м абзаце.", "C": "Только женщины пользовались зонтом лишь в Древней Греции, а в Египте зонт защищал фараонов. Об этом написано в 1-м и 3-м абзацах.", "D": "XVII век — это 1600–1699 годы. В тексте сказано, что в XVII веке зонты во Франции и Англии только начали широко распространяться. А современный зонт со стальной ручкой пр үсіндіреді.", "distractor_notes": {"A": "Пампелли туралы тек бір абзацта ғана айтылады, мәтіннің басым бөлігі автордың өзі туралы.", "B": "автор ешкімді археолог болуға көндірмейді, тек өз тәжірибесімен бөліседі.", "D": "мәтінде археологтердің жұмыс процесі сипатталмайды, тек жекелеген оқиғалар айтылады."}, "editor_changes": "Өзгеріс жоқ. «Жазушы» сөзі «автор» деп өзгертілді.", "distractor_evidence": {"A": ["Археология саласындағы менің пірім – Рафаэль Пампелли деген америкалық зерттеуші"], "B": [], "D": []}, "keywords": {"ok": {"kk": ["қызықтыратын болды", "ең қызық жағдай"], "ru": ["стали интересовать", "Самый интересный случай"]}, "A": {"kk": ["Рафаэль Пампелли", "пірім"], "ru": ["кумир", "Рафаэль Пампелли"]}}, "explanation_ru": "Автор рассказывает, как пришёл в археологию, что его в ней интересует, и делится самым интересным случаем. Текст объясняет его интерес к этой профессии.", "distractor_notes_ru": {"A": "О Пампелли говорится только в одном абзаце, большая часть текста — о самом авторе.", "B": "Автор никого не уговаривает стать археологом, он просто делится своим опытом.", "D": "В тексте не описывается процесс работы археологов, рассказаны только отдельные случаи."}, "fixed_order": false}, {"id": "v1-q17", "number": 17, "text_id": "v1-t4", "stem": "Автор Рафаэль Пампеллиге қатысты қандай сезімде?", "options": {"A": "Пампеллидің жергілікті тілде сөйлей алатынына таң қалады.", "B": "Пампеллидің осындай табысты археолог болғанына қызғанышпен қарайды.", "C": "Пампелли Түркіменстанда сонша уақыт бұрын болғанына таң қалады.", "D": "Пампеллидің Түркіменстанда болғаны ешкімнің есінде қалмағанына қайғырады."}, "key": "C", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "evidence": ["Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен."], "explanation": "«Сөйтсе ... екен» құрылымы таңданысты білдіреді. Автор өзін мұнда келген алғашқы америкалықтардың бірімін деп ойлаған еді, бірақ Пампелли 100 жыл бұрын келген болып шықты.", "distractor_notes": {"A": "орыс тілін Пампелли емес, автордың өзі үйренген.", "B": "автор Пампеллиді «пірім» дейді, мәтінде қызғаныш туралы сөз жоқ.", "D": "керісінше, Пампеллиді жергілікті қарт есіне сақтаған."}, "editor_changes": "«Рафаэель» → «Рафаэль», «жазушы» → «автор» деп түзетілді.", "distractor_evidence": {"A": ["Елді аралау және жергілікті халықпен тіл табыса білу үшін орыс тілін үйренуге тура келді"], "B": ["Археология саласындағы менің пірім – Рафаэль Пампелли"], "D": ["Кейін жергілікті бір қарт маған америкалық археолог Рафаэль Пампелли туралы айтып берді"]}, "keywords": {"ok": {"kk": ["Сөйтсе", "100 жыл бұрын"], "ru": ["Оказалось", "100 лет назад"]}, "A": {"kk": ["орыс тілін үйренуге"], "ru": ["выучить русский язык"]}, "B": {"kk": ["пірім"], "ru": ["кумир"]}, "D": {"kk": ["жергілікті бір қарт"], "ru": ["местный старик"]}}, "explanation_ru": "Конструкция «сөйтсе ... екен» выражает удивление. Автор думал, что он один из первых американцев здесь, а оказалось, что Пампелли был тут 100 лет назад.", "distractor_notes_ru": {"A": "Русский язык выучил не Пампелли, а сам автор.", "B": "Автор называет Пампелли своим кумиром, о зависти в тексте ничего не сказано.", "D": "Наоборот, Пампелли помнил местный старик."}, "fixed_order": false}, {"id": "v1-q18", "number": 18, "text_id": "v1-t4", "stem": "Автор өзінің отбасы туралы не айтады?", "options": {"A": "Ол әйелімен Оңтүстік Америкада жұмыс істеген кезде танысты.", "B": "Ұлдары алдағы уақытта әкелерінің ізін қуып, қазба жұмыстарымен айналысқысы келеді.", "C": "Ол алдағы уақытта отбасымен бірге таулы аймақтарға саяхаттап бармақшы.", "D": "Ұлдары ата-аналарымен бірге қыдырғанды жақсы көреді."}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "evidence": ["жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады"], "explanation": "Ұлдарына ата-анасымен бірге саяхаттау ұнайды.", "distractor_notes": {"A": "мәтінде автордың әйелімен қалай танысқаны айтылмайды.", "B": "бұл мәтінге қайшы: ұлдары болашақта археолог болғысы келмейді.", "C": "Анд тауларына сапар өткен жазда болған, алдағы уақытта емес."}, "editor_changes": "Өзгеріс жоқ.", "distractor_evidence": {"A": [], "B": ["екі ұлым болашақта археолог болғысы келмесе де"], "C": ["Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық"]}, "keywords": {"ok": {"kk": ["еркін саяхаттай алады"], "ru": ["свободно путешествовать"]}, "B": {"kk": ["археолог болғысы келмесе де"], "ru": ["не хотят в будущем становиться археологами"]}, "C": {"kk": ["Өткен жаз"], "ru": ["Прошлым летом"]}}, "explanation_ru": "Сыновьям нравится путешествовать вместе с родителями.", "distractor_notes_ru": {"A": "В тексте не говорится, как автор познакомился с женой.", "B": "Это противоречит тексту: сыновья не хотят в будущем становиться археологами.", "C": "Поездка в Анды была прошлым летом, а не в будущем."}, "fixed_order": false}, {"id": "v1-q19", "number": 19, "text_id": "v1-t4", "stem": "Мысырда жұмыс істеп жүргенде авторға не ерекше қызықты көрінді?", "options": {"A": "Әртүрлі дәуір адамдарының бір-біріне соншалықты ұқсас болуы.", "B": "Төсеніштің бұл күнге дейін жақсы сақталуы.", "C": "Адамдардың осындай құрғақ жерде қалай өмір сүргені.", "D": "Бұл аймақта сауда-саттықтың жақсы дамығаны."}, "key": "A", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 3, "negative": false, "evidence": ["Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын."], "explanation": "Кілтті төсеніштің астына тастап кеткен 700 жыл бұрынғы адам автордың өзі сияқты әрекет еткен. Автор осы ұқсастыққа таң қалды.", "distractor_notes": {"B": "төсеніштің сақталғаны айтылады, бірақ бұл – автор таң қалған нәрсенің өзі емес. Автордың соңғы ойына назар аудар.", "C": "мәтінде адамдардың құрғақ жерде қалай өмір сүргені туралы айтылмайды.", "D": "сауда туралы тек «тауарларды сақтайтын ескі үй» деп жанама айтылады."}, "editor_changes": "Өзгеріс жоқ.", "distractor_evidence": {"B": ["700 жылдық төсеніш тауып алдық"], "C": [], "D": ["заманында кемелерден түскен тауарларды сақтайтын ескі үйдің"]}, "keywords": {"ok": {"kk": ["менен айырмашылығы жоқ", "дәл солай"], "ru": ["ничем не отличается", "точно так же"]}, "B": {"kk": ["700 жылдық төсеніш"], "ru": ["подстилку 700-летней давности"]}, "D": {"kk": ["тауарларды сақтайтын ескі үйдің"], "ru": ["хранили товары с кораблей"]}}, "explanation_ru": "Человек, оставивший ключ под подстилкой 700 лет назад, поступил так же, как поступил бы сам автор. Автора удивило это сходство.", "distractor_notes_ru": {"B": "О сохранившейся подстилке сказано, но автора удивило не это. Обрати внимание на последнюю мысль автора.", "C": "В тексте не говорится о том, как люди жили в засушливой местности.", "D": "О торговле сказано лишь косвенно — через «старый дом для хранения товаров»."}, "fixed_order": false}, {"id": "v1-q20", "number": 20, "text_id": "v1-t4", "stem": "Автор күнделік жүргізген болса, күнделігінде қандай жазба қалдырар еді?", "options": {"A": "Түркіменстан қызықты. Мен мұнда келген бірінші америкалықпын, бірақ бұл шетелге шыққан соңғы сапарым болғанына қуаныштымын.", "B": "Бүгін су астына сүңгіп, көрмеге қоюға болатын тағы бірнеше зат таптым. Суреттерін салуды жаңа ғана бітірдім.", "C": "Мен әйелімнің археологияға көбірек қызығушылық танытқанын қалаймын. Онымен осы тәжірибемді бөліскім келеді.", "D": "Қараңғы түсейін деді, бірақ Рафаэль әлі сол ескі үйді қазумен айналысып жатыр. Кейде адамды қатты шаршатып жібереді. Өзін мұнда ең маңызды адаммын деп санайды."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 3, "negative": false, "evidence": ["теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын"], "explanation": "Автор теңіз астын зерттейтін жобаларға қатысады және табылған заттардың суретін әлі де салады. Дұрыс жауап осы екі деректі біріктіреді.", "distractor_notes": {"A": "автор өзін алғашқы америкалықтардың бірі деп ойлаған, бірақ Пампелли одан бұрын келген. Соңғы сапар туралы да айтылмайды.", "C": "автордың әйелі де археолог, яғни ол бұл салаға қызығады.", "D": "Пампелли автордан 100 жыл бұрын жұмыс істеген, олар бірге қазба жүргізбеген."}, "editor_changes": "Өзгеріс жоқ.", "distractor_evidence": {"A": ["Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен"], "C": ["Менің әйелім де археолог"], "D": ["шамамен 100 жыл бұрын"]}, "keywords": {"ok": {"kk": ["теңіз астын зерттейтін", "суретін салуды"], "ru": ["изучению морского дна", "рисовать найденные предметы"]}, "A": {"kk": ["шамамен 100 жыл бұрын"], "ru": ["примерно 100 лет назад"]}, "C": {"kk": ["әйелім де археолог"], "ru": ["жена тоже археолог"]}, "D": {"kk": ["100 жыл бұрын"], "ru": ["100 лет назад"]}}, "explanation_ru": "Автор участвует в проектах по изучению морского дна и до сих пор рисует найденные предметы. Правильный ответ объединяет эти два факта.", "distractor_notes_ru": {"A": "Автор думал, что он один из первых американцев, но Пампелли был там раньше. О последней поездке тоже ничего не сказано.", "C": "Жена автора тоже археолог, значит, ей интересна эта сфера.", "D": "Пампелли работал на 100 лет раньше автора, они не вели раскопки вместе."}, "fixed_order": false}]}, {"bank_id": "kaz-L1-nis-sample-v1", "track": "first_language", "source": "НЗМ 7-сыныпқа конкурстық іріктеудің тест үлгілері, «Қазақ тілі (бірінші тіл)» (1–20 тапсырмалар)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {}, "style_notes": [], "texts": [{"id": "l1v2-t1", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Екінші дүниежүзілік соғыстың аяқталғанына талай жыл өтті. Сол сұрапыл соғыста ерлік көрсеткен белгісіз батырлар қаншама?! Солардың бірі – Хиуаз Доспанова. Атақ апайды алпыс жыл адасып жүріп тапты. Ол кісінің кеудесінде қазір «Халық қаһарманы» ордені жарқырайды. Қазақтың тұңғыш әскери ұшқыш қызы Хиуаз Доспанова 300-ден астам рет майдан көгіне көтеріліп, талай жауды жеңген. Ол кішкентай кезінен бастап аспанға ұшуды армандайтын. Орал қаласындағы орта мектепті бітіргенде, «әскери ұшқыш» деген атағы бар еді. Хиуаз Доспанова Қырым, Кавказ, Украина, Беларусь, Польша, Германия майданында болды. Ол – әуедегі ұрыстардың жеңімпазы."]}, {"id": "l1v2-t2", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["– Бүгінде қазақ даласын 1,5 миллионнан астам жылқы дүбірге бөлеп жүрсе, алдағы уақытта олардың саны екі есе көбейіп, 3 миллион басқа жетпек. Алайда бұл жылқыға қатысты мәселе жоқ деген сөз емес. Мәселен, бізде жылқыны жете зерттейтін арнайы ғылыми институт жоқ. Елімізде балық, құс, жем-шөп институттары – бөлек отау. Жалғыз ғана жылқыға институт бұйырмаған, – дейді «Қазақ тұлпары» ұйымының директоры. Оның айтуынша, институт ашылса, үлкен ауқымдағы асылдандыру жұмыстарынан бастап қымызды өндіруге дейінгі небір шаруалар шешіліп, қолға алынар еді. Осындай орталықтардың жоқтығынан болар, біздің қазы-қартамызды өзгелер патенттеп, көкпарды құжаттап алған. Бұдан шығатын қорытынды: жылқы саны миллионнан асты деп жайбарақат отырмау керек."]}, {"id": "l1v2-t3", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["«Ақылы көпті дау алмайды, досы көпті жау алмайды» демекші, қашан да адам баласына серік болар жолдастарының көп болғаны жақсы. Басына іс түссе, қасынан табылатын, қуанса, шаттығын бірге бөлісетін мұндай жандардың бір-біріне деген сый-құрметі де ерекше болады. Өмірдің қатал сындарынан жұмылған жұдырықтай болып, сүрінбей өтуге тырысатын жандар бұл жалғаннан айырылмас егіздердей болып өтеді. Әдетте дос деген ұғымның рөлі көбіне жігіттер арасында өзгеше. Алайда ойы, мақсаты сәйкес келмейтін адамдарды да кездестіруге болады. Мұндай пейілі нашарларға ата-бабамыз: «Жаман аттан аяғым артық, жаман жолдастан таяғым артық», – деген екен.", "«Достықтың неше түрі бар?» – деп сұрай қалсаңыз, әркім білгенінше жауап беріп жатады. Ертеректе ел ішінде Әйтімбет деген сөзге шешен адам өмір сүріпті. Бір күні замандастары әңгіме-дүкен құрып отырған шақта:", "– Осы достықтың неше түрі болады? – деп сауал тастаған екен. Сонда Әйтімбет:", "– Достықтың екі түрі болады. Бірі – адал достық, екіншісі – амал достық, – деп жауап қайтарыпты. Замандастары тағы да:", "– Енді осы екі достықты қалай ажыратамыз? – деп сұрапты. Әйтімбет ойланбастан:", "– Адал достық өмірлік нұсқа болады. Амал достықтың өрісі қысқа болады, – депті."]}, {"id": "l1v2-t4", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["АҚШ-тағы «Apple» компаниясында жұмыс істейтін Аяулым бала күнінен бастап бұзылған жабдықтарды жөндеуге құмар болған. Ол – алпауыт компанияда жұмыс істеп жүрген қазақтардың бірі. Бағдарламалар инженері болып жұмыс істейтін Аяулымның мұнда келгеніне шамамен жарты жыл болған. Сынақтардан сүрінбей өтіп, бірден қатардағы қызметкер болып қабылданған. Бұл мақсатына жету үшін көп дайындалған.", "– «Apple» компаниясында 150 мыңнан астам адам қызмет етеді. Барлығы – әлемдік деңгейдегі білікті инженерлер. Өзіңнен тәжірибелі, білімге құштар адамдардың жанында болсаң, өсе бересің, дами бересің. Негізгі мақсатым – өзімді дамыту, тәжірибе жинақтау, – дейді.", "Аяулымның жоғары оқу орнын бітіргеніне көп болмапты. Ол Солтүстік Америка университетінің грантын жеңіп алған. Бір жыл бұрын осы оқу орнының ақпараттық технологиялар бөлімін бітірген. Грант беру кезінде барлығы – үміткердің жеке мотивациясы мен мүмкіндіктері ескерілетінін айтады.", "– Мен АҚШ, Жапония, Корея, Қытай университеттеріне құжат тапсырдым. Бәрінен қабылдай алатындары туралы жауап келді, алайда Америкаға барамын деп мүлдем ойламаған едім. Таңдау еркі өзіме түскендіктен, Америкаға аттандым.", "Мен әлі жас маманмын, білмейтінім көп, тәжірибем аз. Бала күнімнен бүлінген заттарды қайта құрастырып, жөндеуге асығатынмын. Сол себепті осы салаға ерекше құштар болдым. Ақпараттық технология саласы қандай да бір сұрақтың түйінін логика арқылы жүйелі түрде шешумен ерекшеленеді. Осы салада қызмет істейтін қыздар өте аз, себебі олар ауқымды жобалардан жүрексінеді. Ал мен анамның қолдауының арқасында осындай компанияда жұмыс істейтініме ризамын, – деп сөзін түйіндеді."]}, {"id": "l1v2-t5", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Дәулет – IT маманы. Осы салада ұзақ жыл жұмыс жасап жүрген Дәулет былтырдан бері әлеуметтік жобаны қолға алған. Ол негізін салған «Rocket Plastic» шеберханасы пластикті қайта өңдеп, одан ұзақ уақыт қолданыста болатын заттар әзірлеумен айналысады.", "«Былтыр Алматыда өткен марафонға қатысқан едім. Сол кезде су ішуге арналған орындардың айналасында шашылып жатқан пластик бөтелкелер мен қағаз стақандарға көзім түсті. Қоқыс жәшіктерін көре тұра, адамдардың пластик қалдықтарын далаға тастағаны мені қатты таңғалдырды. (1) Сол кезден бастап осы мәселені зерттей бастадым.", "Қазақстанда пластик қалдықтарын қайта өңдеу жолға қойылмағанын білеміз. Әдетте барлық пластикті жинап, қала сыртындағы полигондарға шығарып тастайды. Қала көшелерінде шашылып жатқан пластикті көрмегеннен болар, біз үшін бұл проблема болып көрінбеуі мүмкін. Бірақ қала сыртындағы қоқыс қоршаған ортаға, адамдарға үлкен зиянын тигізеді. (2) Сіз қалада не ауылда тұрасыз ба, қарапайым адамсыз ба, жоқ миллионерсіз бе – бірі де маңызды емес. Экология – бәріне ортақ.", "Жоба жайлы идеямды досым әрі IT саласындағы серіктесіме айтқан едім, ол бірден қолдайтынын айтты. (3) Сондықтан мен әлеуметтік желіде эко-жобамен айналысқалы жатқанымды, егер командаға қосыламын дейтіндер болса, маған хабарласуын өтіндім. Осылайша қатарымызға бізге қолдау көрсететін топ жинақталып үлгерді. Олар біздің жұмысымызға қолдарынан келгенше көмек беріп, идеяларымен бөліседі.", "Біздің ел бұл проблемаға енді назар аударып келеді. Көшелерде арнайы қоқыс жәшіктері қойылып, кейбір дүкендер биопакеттер ұсынуда. Алайда халықтың тең жартысында қоқыс сұрыптауды ойлайтын уақыты да жоқ. Оларға пластиктің зияны, сұрыптаудың маңызы жайлы ақпарат жиі айтылмайды. (4) Адамдардың экологиялық сауаты мен белсенділігін арттырғымыз келеді», – дейді Дәулет.", "Дәулеттен кеңес:", "Егер саналы тұтынуға өтуге шешім қабылдасаңыз, бірінші кезекте дүкеннен пластик пакет алудан бас тартасыз. (5) Азық-түлік заттарын салу үшін өзіңізбен бірге бірнеше рет қолдануға болатын пакет немесе эко-сөмке ұстаңыз.", "Үйде бірнеше қоқыс жәшігін қойыңыз. Пластик, қағаз, шыны қалдықтарын бөлек жинаңыз. Егер үйіңіздің жанында қоқысты бөлек тастайтын контейнерлер болмаса, оны қабылдайтын жерлерге тапсырыңыз."]}, {"id": "l1v2-t6", "title": "Наурыз мейрамы туралы шетелдіктер не ойлайды?", "source_note": "", "numbered_paragraphs": true, "paragraphs": ["Исак Рамадани (Македония): – Македонияда дүниеге келдім, ұлтым – албан. Мұсылман болғаным үшін Наурыз мейрамы туралы көп естимін. Соңғы жылдары біздің елде де ауқымды тойлана бастады. Бірде түрлері түріктерге ұқсайтын еліміздің азаматтарының алдымнан шығып, арнайы мейрамға дайындалған асын ұсынғаны әлі есімде. Бір жыл өтсе де, дәмі аузымнан кетер емес. Өкінішке орай, оның атын ұмытып отырмын. Сіздерде осындай ортақ мейрамның бар екеніне ризамын.", "Агуэй-Боади (Гана): – Мен дүниеге келген елдің тең жартысы – мұсылмандар. Дегенмен мұнда Наурыз тойланбайды. Мүмкін географиялық аймақтарға байланысты тойланатын шығар. Осындай ұлттық мейрамның көп болғаны дұрыс. Әрқашан мейрамның маңыздылығын жоғалтып алмауға тырысу керек. Егер елде тек бір ұлт болса, оның жойылу мүмкіндігі болмайды. Ал көпұлтты елде мейрам сынды ұлттық құндылықтарды берік сақтау қиын. Өз еліңіздің ұлттық құндылықтарын қадірлеуден шаршамаңыздар дегім келеді.", "Эзар Чан (Қытай): – Қытайдың оңтүстік-шығыс аймағында тұрамын. Сондықтан Наурыз мейрамына қатысты дым естімеген екенмін. Түркі тектес ұлттар Қытайдың солтүстік-батыс жағын мекендеген. Мүмкін сол аймақта Наурыз мейрамы аталып өтілетін шығар.", "Энн-Джеймс (Ямайка): – Біздің елдің азаматтары әлемнің түкпір-түкпірінен келген. Мысалы, менің әкем үндістандық болса, анам – марокколық. Ал мен Ямайкада дүниеге келдім. Сондықтан біздің елге ғана тиесілі мейрам жоқ деуге болады. Әркім өзінің дәстүріне сай өмір сүреді. Ал сіздерде жалпы ұлтқа тән, тіпті бірнеше ұлттың басын қосатын мейрамның болғаны қуантады. Бұл халықтың бірлікте өмір сүруіне түрткі болады. Мен сіздерге қызығамын."]}, {"id": "l1v2-t7", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["– «Домбыра Party» туралы ең алғаш Facebook-тен білдім. Суреттер мен пікірлерді көріп, бұл жобаға қызыға бастадым. Біраз уақыттан кейін әлеуметтік желіден Нұрғиса ағамыздың жазған жазбасын оқыдым. Ағамыз Лондонға келетінін және «Домбыра Party» ұйымдастыратынын жазып, осы жерде жүрген қазақтардың хабарласуын сұрапты. Мен де «бұл мәселе қашан шешіледі екен, нақты болатын уақыты мен жері қашан анықталады екен» деп біраз уақыт күттім. Кейін анық-қанығын білдік. Сүйінші хабарды желі бойынша жан-жаққа тараттық. «Лондондағы домбыра кешіне аз адам келіп, ұят болып қалмағай!» – деп те уайымдадық. Себебі жанымда жүрген қазақ студенттерінің оқуы аяқталып, басым бөлігі елге оралған болатын.", "Абырой болғанда, елорданың туған күніне орай өткен шараға қырыққа жуық қазақ жиналды. Жиналып қана қоймай, Нұрғиса ағамызды қолдап, өздері де домбыраны қолға алып, өнер көрсетті. Көшеде серуендеп жүріп, бізді кездестіріп қуанған қазақтар да болды. Домбыраның үнін естіп, арамызға келіп қосылып жатты. Біраз бауырларымыздың шетелде жүріп, өз елін сағынғаны байқалды. «Домбыра Party» елден жырақта жүрген ағайынға Қазақстанда болып қайтқандай әсер сыйлады. Себебі айтылған әндер, тартылған күйлер елге деген сағынышымызды біршама басты деуге негіз бар. Осындай қазақтардың басын қосатын, елге, жерге деген сүйіспеншілікті арттыратын, рухымызды асқақтататын бастамалардың көбейе беруін тілеймін. Ал мен домбыра кешінің Лондонда жалғасын табуын қадағалап, септігімді тигізуге әзір екенімді баса айтқым келеді."]}, {"id": "l1v2-t8", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Бір орманда екі адам ағаш шабады екен. Бірінші адам таңертең ерте ұйқысынан оянып, бір ағашты шауып бітсе, дереу екіншісіне өтіп, тыным таппайды. Таңнан қара кешке дейін дәл осылай еңбектеніп, тынығу дегенді білмейді. Түскі асты ішуді де ұмытып кетеді. Кешкісін досынан кейін қалып, тағы бірнеше сағат жұмыс істейді. Екінші адам болса, ағаш шауып түсірген сайын біраз отырып тынығып, қас қарая бастағанда, үйіне қайтып кетеді.", "Бір апта бойы осылай еңбектенгеннен кейін, екеуі бір апталық ағаштарын санап көрмекші болады. Екінші адамның шапқан ағашы көбірек болып шығады. Тыным таппай еңбектенген бірінші адам ызаға булығып, қасындағы адамнан мұның сырын сұрайды. Екінші адам сәл ғана езу тартып, былай деп жауап қатады: – Мұның сен ойлағандай сыры жоқ. Сен еш тынбай еңбектенесің. Ал мен кейде тынығып отырып, балтамды қайрап аламын. Өткір балтамен жұмыс істеу жұмысты жеңілдетеді әрі шаршамайсың.", "Өз-өзіңді жетілдіру балтаны қайрағанға ұқсайды. Өз-өзімізге уақыт бөліп, істің көзін табуымыз керек. Кемшіліктеріміз болса, оларды толықтырып, жетілдіре түсуіміз қажет. Бұл рухани жан-дүниеміз бен ой-өрісіміздің кеңеюіне көп септігін тигізеді."]}, {"id": "l1v2-t9", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Эволюция теориясы бойынша адам маймыл тәріздес жануардан тік жүретін тұлғаға айналу үшін біршама уақыт кетіпті. Ал ғалымдар заманауи технологиялардың бұл жетістікті жоққа шығарып отырғанын айтады. Себебі ұялы телефон мен гаджеттерді күнделікті қолдану адамды бүкірейтіп, жүрісін өзгерте бастапты.", "Осы салада жүргізілген тәжірибеге 26 ерікті қатысты. Олар алғашында жолдарын телефонсыз жүріп өткен. Артынан мамандар олардың қолдарына смартфон ұстатып, хабарлама жазып не оқып жүрулерін өтінген. Тәжірибеге қатысқан адамдардың жүрісін, денесінің қалпын компьютерлік бағдарлама тіркеп отырған. Зерттеу нәтижесінде хабарлама жазу адамды бүкірейтіп, жүрісін ерекше қалыпқа түсіргені байқалды. Алға қарай еңкейіп, телефонға үңілгендер адам дамуының кері сатысын көрсете бастағандай. Осындай қалыптағы адамның басы мен омыртқасы 15 келі салмаққа тең қосымша жүктеме алады екен. Иық пен мойын бұлшықеттері де осы қалыпта зақымданады. Адам ағзасына омыртқа мен жүйке ауруларының қайдан келетінін ойлай беріңіз."]}], "items": [{"id": "l1v2-q1", "number": 1, "text_id": "l1v2-t1", "stem": "Хиуаз Доспанова батыр атағын қашан алды?", "options": {"A": "майданға аттанар алдында", "B": "мектеп кезінде", "C": "соғыс аяқталғаннан кейін", "D": "соғыс жылдары"}, "key": "C", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Екінші дүниежүзілік соғыстың аяқталғанына талай жыл өтті.", "Атақ апайды алпыс жыл адасып жүріп тапты."], "explanation": "Мәтінде «Атақ апайды алпыс жыл адасып жүріп тапты» делінген. Яғни Хиуаз Доспанова «Халық қаһарманы» атағын соғыс аяқталғаннан кейін, көп жыл өткен соң алды.", "distractor_notes": {"A": "майданға аттанар алдында оның «әскери ұшқыш» деген атағы болған. Бұл – батыр атағы емес.", "B": "мектеп бітіргенде оның «әскери ұшқыш» деген атағы болған. Ал «Халық қаһарманы» – басқа, батыр атағы.", "D": "соғыс жылдары ол 300-ден астам рет ұшып, талай жауды жеңген. Бірақ атақ оны кейін, «алпыс жыл адасып жүріп» тапты."}, "distractor_evidence": {"A": ["Орал қаласындағы орта мектепті бітіргенде, «әскери ұшқыш» деген атағы бар еді."], "B": ["Орал қаласындағы орта мектепті бітіргенде, «әскери ұшқыш» деген атағы бар еді."], "D": ["Қазақтың тұңғыш әскери ұшқыш қызы Хиуаз Доспанова 300-ден астам рет майдан көгіне көтеріліп, талай жауды жеңген."]}, "keywords": {"ok": {"kk": ["аяқталғанына талай жыл өтті", "алпыс жыл адасып жүріп тапты"], "ru": []}, "A": {"kk": ["«әскери ұшқыш» деген атағы"], "ru": []}, "B": {"kk": ["мектепті бітіргенде"], "ru": []}, "D": {"kk": ["300-ден астам рет"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q2", "number": 2, "text_id": "l1v2-t2", "stem": "Автор қандай мәселеге тоқталады?", "options": {"A": "жылқы санын арттыру кезінде кездесетін қиындықтарға", "B": "жылқы шаруашылығына қатысты мекеменің жоқтығына", "C": "көкпарды өзгенің патенттеуіне жол бермеу керектігіне", "D": "қазы-қартаны ұлттық тағам ретінде таныту қажеттігіне"}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Мәселен, бізде жылқыны жете зерттейтін арнайы ғылыми институт жоқ.", "Жалғыз ғана жылқыға институт бұйырмаған, – дейді «Қазақ тұлпары» ұйымының директоры."], "explanation": "Мәтінде жылқыны зерттейтін арнайы ғылыми институттың жоқтығы айтылады: балық, құс, жем-шөп институттары бар, ал жылқыға институт бұйырмаған. Мәтіндегі басқа ойлар осы мәселеден туындайды.", "distractor_notes": {"A": "мәтінде жылқы санын арттыру қиын деп айтылмайды. Керісінше, жылқы саны екі есе көбейіп, 3 миллионға жетпек.", "C": "көкпар туралы мәтінде бір сөйлем ғана бар. Онда көкпарды өзгелердің құжаттап алуы институттың жоқтығының салдары ретінде айтылады.", "D": "қазы-қарта туралы да мәтінде бір сөйлем ғана бар. Онда ол институттың жоқтығының салдары ретінде айтылады."}, "distractor_evidence": {"A": ["– Бүгінде қазақ даласын 1,5 миллионнан астам жылқы дүбірге бөлеп жүрсе, алдағы уақытта олардың саны екі есе көбейіп, 3 миллион басқа жетпек."], "C": ["Осындай орталықтардың жоқтығынан болар, біздің қазы-қартамызды өзгелер патенттеп, көкпарды құжаттап алған."], "D": ["Осындай орталықтардың жоқтығынан болар, біздің қазы-қартамызды өзгелер патенттеп, көкпарды құжаттап алған."]}, "keywords": {"ok": {"kk": ["арнайы ғылыми институт жоқ", "жылқыға институт бұйырмаған"], "ru": []}, "A": {"kk": ["екі есе көбейіп"], "ru": []}, "C": {"kk": ["Осындай орталықтардың жоқтығынан"], "ru": []}, "D": {"kk": ["қазы-қартамызды өзгелер патенттеп"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q3", "number": 3, "text_id": "l1v2-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Аға буын ниеті түзу адамдармен араласпаған.\n2. Шын достар әрқашан бір-біріне қолдау болады.", "options": {"A": "екеуі де бұрыс", "B": "екеуі де дұрыс", "C": "тек біріншісі", "D": "тек екіншісі"}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Басына іс түссе, қасынан табылатын, қуанса, шаттығын бірге бөлісетін мұндай жандардың бір-біріне деген сый-құрметі де ерекше болады.", "Мұндай пейілі нашарларға ата-бабамыз: «Жаман аттан аяғым артық, жаман жолдастан таяғым артық», – деген екен."], "explanation": "Тек екінші тұжырым дұрыс: шын достар басыңа іс түскенде қасыңнан табылады. Ал бірінші тұжырым қате: ата-бабамыз ниеті түзу адамдардан емес, пейілі нашар адамдардан аулақ болуды айтқан.", "distractor_notes": {"A": "екінші тұжырым мәтінде бар. Шын достардың қандай болатыны туралы 1-абзацты қайта оқы.", "B": "бірінші тұжырымды мәтінмен тағы салыстыр: ата-бабамыз қандай адамдар туралы айтқан?", "C": "бірінші тұжырымда «ниеті түзу» адамдар туралы айтылады. Ата-бабамыз қандай адамдар туралы айтқанын қайта оқы."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["Басына іс түссе, қасынан табылатын", "пейілі нашарларға"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q4", "number": 4, "text_id": "l1v2-t3", "stem": "«Амал достықтың өрісі қысқа болады.»\nӘйтімбет шешен не айтқысы келді?", "options": {"A": "Адамдардың шағын тобы ғана бір-бірімен дос бола алады.", "B": "Қызығушылығы бірдей достардың ортақ әңгімесі таусылады.", "C": "Өз пайдасын ғана ойлайтындардың достығы шынайы болмайды.", "D": "Тілеулес адамдардың достық қарым-қатынасы көпке созылмайды."}, "key": "C", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 3, "negative": false, "fixed_order": false, "evidence": ["– Достықтың екі түрі болады.", "Бірі – адал достық, екіншісі – амал достық, – деп жауап қайтарыпты.", "– Адал достық өмірлік нұсқа болады."], "explanation": "«Амал» – айла, есеп деген сөз. Амал достық – өз пайдасы үшін ғана жасалған достық. Пайда біткенде мұндай достық та бітеді, сондықтан оның «өрісі қысқа», яғни ол шынайы болмайды. Ал адал достық өмір бойы сақталады.", "distractor_notes": {"A": "Әйтімбет достардың саны туралы емес, достықтың түрі туралы айтады. «Амал» сөзінің мағынасын ойлан.", "B": "Әйтімбет достардың ортақ әңгімесі туралы айтпайды. Ол достықтың екі түрін салыстырады.", "D": "«тілеулес» – саған жақсылық тілейтін адам. Мұндай адамдардың достығы – адал достық, ол «өмірлік» болады."}, "distractor_evidence": {"A": [], "B": ["– Достықтың екі түрі болады."], "D": ["– Адал достық өмірлік нұсқа болады."]}, "keywords": {"ok": {"kk": ["адал достық", "амал достық", "өмірлік нұсқа"], "ru": []}, "B": {"kk": ["екі түрі"], "ru": []}, "D": {"kk": ["Адал достық өмірлік"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q5", "number": 5, "text_id": "l1v2-t4", "stem": "Неліктен Аяулым ақпараттық технологиялар бөлімін таңдады?", "options": {"A": "анасы қалағандықтан", "B": "икемі бар болғандықтан", "C": "оқу грантына ие болғандықтан", "D": "шетелдік оқу орны шақырғандықтан"}, "key": "B", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Бала күнімнен бүлінген заттарды қайта құрастырып, жөндеуге асығатынмын.", "Сол себепті осы салаға ерекше құштар болдым."], "explanation": "Аяулым бала кезінен бұзылған заттарды жөндеуге құмар болған: «Сол себепті осы салаға ерекше құштар болдым» дейді. Яғни ол бұл салаға икемі, бейімі бар болғандықтан таңдады.", "distractor_notes": {"A": "анасы Аяулымды тек қолдаған, ал мамандықты Аяулымның өзі таңдаған.", "C": "Аяулым грантты университетке түсу үшін жеңіп алған. Бірақ мамандықты таңдаудың себебі – грант емес.", "D": "бірнеше елдің университеттері оны қабылдай алатынын айтқан. Бірақ бұл елді таңдауға қатысты, мамандықты таңдауға емес."}, "distractor_evidence": {"A": ["Ал мен анамның қолдауының арқасында осындай компанияда жұмыс істейтініме ризамын, – деп сөзін түйіндеді."], "C": ["Ол Солтүстік Америка университетінің грантын жеңіп алған."], "D": ["Бәрінен қабылдай алатындары туралы жауап келді, алайда Америкаға барамын деп мүлдем ойламаған едім."]}, "keywords": {"ok": {"kk": ["бүлінген заттарды қайта құрастырып", "Сол себепті"], "ru": []}, "A": {"kk": ["анамның қолдауының арқасында"], "ru": []}, "C": {"kk": ["грантын жеңіп алған"], "ru": []}, "D": {"kk": ["Бәрінен қабылдай алатындары"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q6", "number": 6, "text_id": "l1v2-t4", "stem": "«Өзіңнен тәжірибелі, білімге құштар адамдардың жанында болсаң, өсе бересің, дами бересің.»\nАяулым не айтқысы келді?", "options": {"A": "аянбай еңбек ету керектігін", "B": "бәсекеге қабілетті болу керектігін", "C": "жас маманның тәжірибесінің аз болатынын", "D": "жан-жақты даму үшін ортаның маңызды екенін"}, "key": "D", "skill": "C2", "skill_name": "Астарлы ойды түсіндіру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Өзіңнен тәжірибелі, білімге құштар адамдардың жанында болсаң, өсе бересің, дами бересің.", "Негізгі мақсатым – өзімді дамыту, тәжірибе жинақтау, – дейді."], "explanation": "Аяулым тәжірибелі, білімді адамдардың ортасында жүрсең, сен де өсіп, дамисың дейді. Яғни адамның жан-жақты дамуы үшін оның ортасының маңызы зор.", "distractor_notes": {"A": "бұл сөйлемде еңбек ету туралы емес, қандай адамдардың қасында болу туралы айтылады.", "B": "Аяулым тәжірибелі адамдармен бәсекелесу туралы емес, олардың жанында болып, үйрену туралы айтады.", "C": "Аяулым өзінің тәжірибесі аз екенін мәтіннің басқа жерінде айтады. Ал бұл сөйлемде ол адамның дамуына не көмектесетінін айтады."}, "distractor_evidence": {"A": [], "B": [], "C": ["Мен әлі жас маманмын, білмейтінім көп, тәжірибем аз."]}, "keywords": {"ok": {"kk": ["адамдардың жанында болсаң", "дами бересің"], "ru": []}, "C": {"kk": ["тәжірибем аз"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q7", "number": 7, "text_id": "l1v2-t4", "stem": "Соңғы абзацта Аяулымның қандай сезімі байқалады?", "options": {"A": "мақтаныш", "B": "қорқыныш", "C": "қызғаныш", "D": "сағыныш"}, "key": "A", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Осы салада қызмет істейтін қыздар өте аз, себебі олар ауқымды жобалардан жүрексінеді.", "Ал мен анамның қолдауының арқасында осындай компанияда жұмыс істейтініме ризамын, – деп сөзін түйіндеді."], "explanation": "Соңғы абзацта Аяулым бұл салада қыздар аз екенін, ал өзінің осындай компанияда жұмыс істейтініне риза екенін айтады. Ол өз жетістігін бағалап, мақтан тұтады. Бұл – мақтаныш сезімі.", "distractor_notes": {"B": "қорқыныш (жүрексіну) Аяулымның өзіне емес, басқа қыздарға қатысты айтылған.", "C": "Аяулым ешкімді қызғанбайды, керісінше, өз жұмысына риза.", "D": "соңғы абзацта Аяулым елін не жақындарын сағынғаны туралы айтпайды."}, "distractor_evidence": {"B": ["Осы салада қызмет істейтін қыздар өте аз, себебі олар ауқымды жобалардан жүрексінеді."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["қыздар өте аз", "жұмыс істейтініме ризамын"], "ru": []}, "B": {"kk": ["олар ауқымды жобалардан жүрексінеді"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q8", "number": 8, "text_id": "l1v2-t5", "stem": "Мәтіндегі 1–5-сөйлемдерден нені аңғаруға болады?\nДәулет –", "options": {"A": "ақпараттық технология саласының үздік маманы, әлеуметтік жоба жетекшісі.", "B": "қоқыс қалдықтарын қайта өңдейтін технологияны ойлап тапқан өнертапқыш.", "C": "қоқысты қайта сұрыптаумен айналысатын жаңашыл достары көп адам.", "D": "қоршаған ортаның мәселесіне бейжай қарамайтын, жанашыр азамат."}, "key": "D", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 3, "negative": false, "fixed_order": false, "evidence": ["(1) Сол кезден бастап осы мәселені зерттей бастадым.", "(2) Сіз қалада не ауылда тұрасыз ба, қарапайым адамсыз ба, жоқ миллионерсіз бе – бірі де маңызды емес.", "(4) Адамдардың экологиялық сауаты мен белсенділігін арттырғымыз келеді"], "explanation": "1–5-сөйлемдерде Дәулет қоқыс мәселесін зерттей бастағанын, экология бәріне ортақ екенін, адамдарға қоршаған ортаны қорғау туралы ақпарат жетпейтінін, олардың экологиялық сауатын арттырғысы келетінін айтып, эко-сөмке ұстауға кеңес береді. Демек, ол – қоршаған ортаның мәселесіне бейжай қарамайтын, жанашыр азамат.", "distractor_notes": {"A": "Дәулеттің IT маманы екені айтылады, бірақ оның үздік маман екені туралы ештеңе айтылмайды. 1–5-сөйлемдерде ол туралы мүлде сөз жоқ.", "B": "Дәулет технологияны ойлап тапқан жоқ: оның шеберханасы пластикті қайта өңдейді.", "C": "мәтінде Дәулеттің бір досы әрі серіктесі және оларға қолдау көрсететін топ туралы айтылады. Бірақ 1–5-сөйлемдер оның достарының көптігін емес, Дәулеттің өз ойы мен мінезін көрсетеді."}, "distractor_evidence": {"A": ["Дәулет – IT маманы."], "B": ["Ол негізін салған «Rocket Plastic» шеберханасы пластикті қайта өңдеп, одан ұзақ уақыт қолданыста болатын заттар әзірлеумен айналысады."], "C": ["Жоба жайлы идеямды досым әрі IT саласындағы серіктесіме айтқан едім, ол бірден қолдайтынын айтты."]}, "keywords": {"ok": {"kk": ["осы мәселені зерттей бастадым", "бірі де маңызды емес", "экологиялық сауаты мен белсенділігін арттырғымыз келеді"], "ru": []}, "A": {"kk": ["IT маманы"], "ru": []}, "B": {"kk": ["пластикті қайта өңдеп"], "ru": []}, "C": {"kk": ["досым әрі IT саласындағы серіктесіме"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q9", "number": 9, "text_id": "l1v2-t5", "stem": "Дәулеттің шеберхана ашуына не себеп болды?", "options": {"A": "дүкендердегі пластик пакет жарнамасы", "B": "елімізде қайта өңдеу өндірісінің жандануы", "C": "қала көшесінде шашылып жатқан пластик ыдыстар", "D": "сұрыптауға арналған қоқыс жәшігінің пайда болуы"}, "key": "C", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Сол кезде су ішуге арналған орындардың айналасында шашылып жатқан пластик бөтелкелер мен қағаз стақандарға көзім түсті.", "(1) Сол кезден бастап осы мәселені зерттей бастадым."], "explanation": "Дәулет Алматыдағы марафонда көшеде шашылып жатқан пластик бөтелкелерді көрген. «Сол кезден бастап осы мәселені зерттей бастадым» дейді.", "distractor_notes": {"A": "мәтінде пластик пакет жарнамасы туралы айтылмайды. Дәулет керісінше пластик пакеттен бас тартуға кеңес береді.", "B": "мәтінде керісінше айтылған: Қазақстанда пластикті қайта өңдеу жолға қойылмаған.", "D": "қоқыс жәшіктері туралы мәтіннің соңына қарай айтылады, бірақ бұл – шеберхана ашудың себебі емес."}, "distractor_evidence": {"A": ["Егер саналы тұтынуға өтуге шешім қабылдасаңыз, бірінші кезекте дүкеннен пластик пакет алудан бас тартасыз."], "B": ["Қазақстанда пластик қалдықтарын қайта өңдеу жолға қойылмағанын білеміз."], "D": ["Көшелерде арнайы қоқыс жәшіктері қойылып, кейбір дүкендер биопакеттер ұсынуда."]}, "keywords": {"ok": {"kk": ["шашылып жатқан пластик бөтелкелер", "Сол кезден бастап"], "ru": []}, "A": {"kk": ["пластик пакет алудан бас тартасыз"], "ru": []}, "B": {"kk": ["жолға қойылмағанын"], "ru": []}, "D": {"kk": ["арнайы қоқыс жәшіктері қойылып"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q10", "number": 10, "text_id": "l1v2-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Дәулет әлеуметтік желілер арқылы эко-сөмкені жарнамалады.", "B": "Дәулет достарымен бірге ауқымды эко-жобаны жүзеге асырды.", "C": "Дәулет мамандығы бойынша қосымша табыс табуды қалайды.", "D": "Дәулет пластикті арнайы орындарға тапсыру қажеттігін айтады."}, "key": "D", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Егер үйіңіздің жанында қоқысты бөлек тастайтын контейнерлер болмаса, оны қабылдайтын жерлерге тапсырыңыз."], "explanation": "Дәулет кеңесінде үйдің жанында қоқысты бөлек тастайтын контейнер болмаса, оны қабылдайтын жерлерге тапсыруды айтады.", "distractor_notes": {"A": "Дәулет әлеуметтік желіде эко-сөмкені емес, командаға адам іздейтінін жариялады.", "B": "мәтінде жобаға қолдау көрсететін топ жиналғаны айтылады, бірақ ауқымды жобаны жүзеге асырғаны туралы айтылмайды.", "C": "мәтінде Дәулеттің қосымша табыс табуды қалайтыны айтылмайды. Ол әлеуметтік жобамен айналысады."}, "distractor_evidence": {"A": ["(3) Сондықтан мен әлеуметтік желіде эко-жобамен айналысқалы жатқанымды, егер командаға қосыламын дейтіндер болса, маған хабарласуын өтіндім."], "B": ["Осылайша қатарымызға бізге қолдау көрсететін топ жинақталып үлгерді."], "C": ["Осы салада ұзақ жыл жұмыс жасап жүрген Дәулет былтырдан бері әлеуметтік жобаны қолға алған."]}, "keywords": {"ok": {"kk": ["қабылдайтын жерлерге тапсырыңыз"], "ru": []}, "A": {"kk": ["командаға қосыламын дейтіндер"], "ru": []}, "B": {"kk": ["қолдау көрсететін топ"], "ru": []}, "C": {"kk": ["әлеуметтік жобаны"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q11", "number": 11, "text_id": "l1v2-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "әңгіме", "B": "баяндама", "C": "мақала", "D": "сұхбат"}, "key": "C", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Дәулет – IT маманы.", "(4) Адамдардың экологиялық сауаты мен белсенділігін арттырғымыз келеді», – дейді Дәулет."], "explanation": "Мәтінде автор нақты адам – Дәулет және оның жобасы туралы баяндап, оның сөзін келтіреді, соңында оның кеңесін береді. Сұрақ-жауап та, ойдан шығарылған оқиға да жоқ. Мұндай публицистикалық мәтін – мақала.", "distractor_notes": {"A": "әңгіме – көркем шығарма, онда ойдан құрастырылған оқиға баяндалады. Ал бұл мәтінде нақты адам мен оның жобасы туралы ақпарат беріледі.", "B": "баяндама жиналыста не конференцияда оқылады, онда баяндамашы бір тақырыпты өзі жүйелі баяндайды. Бұл мәтінде автор бір адамның жобасы туралы жазып, оның сөзін келтіреді.", "D": "мәтінде Дәулеттің ұзақ сөзі келтірілген, бірақ тілшінің сұрақтары жоқ. Сұхбат сұрақ пен жауаптан тұрады."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["Дәулет – IT маманы", "– дейді Дәулет"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q12", "number": 12, "text_id": "l1v2-t6", "stem": "«Өкінішке орай, оның атын ұмытып отырмын.»\nОсы сөйлемде «оның» деп кімді/нені айтады? (1-абзац)", "options": {"A": "дәстүрдің атауын", "B": "мейрамның түрін", "C": "тағамның атауын", "D": "танысының есімін"}, "key": "C", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Бірде түрлері түріктерге ұқсайтын еліміздің азаматтарының алдымнан шығып, арнайы мейрамға дайындалған асын ұсынғаны әлі есімде. (1-азатжол)", "Бір жыл өтсе де, дәмі аузымнан кетер емес. (1-азатжол)"], "explanation": "Алдыңғы сөйлемдерде мейрамға дайындалған ас және оның дәмі туралы айтылады. Демек, Исак Рамадани тағамның атын ұмытқан.", "distractor_notes": {"A": "бұл сөйлемдерде дәстүр туралы айтылмайды. Алдыңғы сөйлемде не туралы айтылғанын қайта оқы.", "B": "мейрамның атауы – Наурыз, оны Исак Рамадани біледі.", "D": "алдыңғы сөйлемде адам туралы емес, нәрсе туралы айтылады: оның «дәмі аузынан кетер емес»."}, "distractor_evidence": {"A": [], "B": ["Мұсылман болғаным үшін Наурыз мейрамы туралы көп естимін."], "D": ["Бір жыл өтсе де, дәмі аузымнан кетер емес."]}, "keywords": {"ok": {"kk": ["мейрамға дайындалған асын", "дәмі аузымнан кетер емес"], "ru": []}, "B": {"kk": ["Наурыз мейрамы туралы көп естимін"], "ru": []}, "D": {"kk": ["дәмі аузымнан кетер емес"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q13", "number": 13, "text_id": "l1v2-t6", "stem": "2-абзацтың негізгі ойы қандай?", "options": {"A": "Ұлттар арасындағы достықты бағалау қажет.", "B": "Ұлттық ерекшелікті жоғалтпау керек.", "C": "Ұлттық мейрамды лайықты атап өту қажет.", "D": "Ұлттық мейрамды мақтан тұту керек."}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Әрқашан мейрамның маңыздылығын жоғалтып алмауға тырысу керек. (2-азатжол)", "Өз еліңіздің ұлттық құндылықтарын қадірлеуден шаршамаңыздар дегім келеді. (2-азатжол)"], "explanation": "Агуэй-Боади мейрамның маңыздылығын жоғалтпауға, ұлттық құндылықтарды берік сақтауға шақырады. Демек, 2-абзацтың негізгі ойы – ұлттық ерекшелікті жоғалтпау керек.", "distractor_notes": {"A": "2-абзацта ұлттар арасындағы достық туралы айтылмайды. Бірнеше ұлттың басын қосатын мейрам туралы 4-абзацта айтылады.", "C": "2-абзацта мейрамды қалай атап өту керектігі туралы емес, оның маңызын, құндылығын сақтау туралы айтылады.", "D": "Агуэй-Боади мейрамды мақтан тұту туралы емес, ұлттық құндылықты жоғалтпай, сақтау туралы айтады."}, "distractor_evidence": {"A": ["Ал сіздерде жалпы ұлтқа тән, тіпті бірнеше ұлттың басын қосатын мейрамның болғаны қуантады."], "C": [], "D": ["Ал көпұлтты елде мейрам сынды ұлттық құндылықтарды берік сақтау қиын."]}, "keywords": {"ok": {"kk": ["маңыздылығын жоғалтып алмауға", "ұлттық құндылықтарын қадірлеуден"], "ru": []}, "A": {"kk": ["бірнеше ұлттың басын қосатын"], "ru": []}, "D": {"kk": ["берік сақтау қиын"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q14", "number": 14, "text_id": "l1v2-t6", "stem": "Кімнің сөзінде мерекеге қатысты немқұрайлық байқалады?", "options": {"A": "Исак Рамадани", "B": "Агуэй-Боади", "C": "Эзар Чан", "D": "Энн-Джеймс"}, "key": "C", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 3, "negative": false, "fixed_order": true, "evidence": ["Сондықтан Наурыз мейрамына қатысты дым естімеген екенмін. (3-азатжол)", "Мүмкін сол аймақта Наурыз мейрамы аталып өтілетін шығар. (3-азатжол)"], "explanation": "Эзар Чан Наурыз туралы «дым естімеген екенмін», «мүмкін сол аймақта аталып өтілетін шығар» дейді. Ол мейрамға қызығушылық та, сүйсіну де білдірмейді. «Немқұрайлық» – бей-жай, салғырт қарау деген сөз.", "distractor_notes": {"A": "Исак Рамадани мейрамды жақсы біледі, ортақ мейрамның бар екеніне риза.", "B": "Агуэй-Боадидің елінде Наурыз тойланбаса да, ол ұлттық мейрамның маңызы туралы ойын айтады.", "D": "Энн-Джеймс мұндай мейрамға қызығатынын айтады."}, "distractor_evidence": {"A": ["Сіздерде осындай ортақ мейрамның бар екеніне ризамын."], "B": ["Осындай ұлттық мейрамның көп болғаны дұрыс."], "D": ["Мен сіздерге қызығамын."]}, "keywords": {"ok": {"kk": ["дым естімеген екенмін", "Мүмкін сол аймақта"], "ru": []}, "A": {"kk": ["ризамын"], "ru": []}, "B": {"kk": ["көп болғаны дұрыс"], "ru": []}, "D": {"kk": ["қызығамын"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q15", "number": 15, "text_id": "l1v2-t7", "stem": "Домбыра кешіне жиналған көпшілік өздерін қалай сезінді?", "options": {"A": "Өздерін туған жерге барып келгендей сезінді.", "B": "Өздерін үлкен сахнада өнер көрсеткендей сезінді.", "C": "Тек қазақ күйлерін қатты сағынғандарын түсінді.", "D": "Туған жерден жырақта жүргендеріне қиналды."}, "key": "A", "skill": "B4", "skill_name": "Кейіпкердің сезімі мен мінезі", "level": 2, "negative": false, "fixed_order": false, "evidence": ["«Домбыра Party» елден жырақта жүрген ағайынға Қазақстанда болып қайтқандай әсер сыйлады."], "explanation": "Мәтінде кеш елден жырақтағы қазақтарға Қазақстанда болып қайтқандай әсер сыйлағаны айтылады. Яғни олар өздерін туған жерге барып келгендей сезінді.", "distractor_notes": {"B": "қазақтар домбыра тартып, өнер көрсетті, бірақ шара көшеде өтті, үлкен сахна туралы айтылмайды.", "C": "кеште әндер де айтылды, күйлер де тартылды. Олар тек күйді емес, елді сағынған еді.", "D": "кеш олардың сағынышын басты, яғни оларды қиналдырған жоқ, керісінше, қуантты."}, "distractor_evidence": {"B": ["Көшеде серуендеп жүріп, бізді кездестіріп қуан қ қазақ жиналды"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q17", "number": 17, "text_id": "l1v2-t7", "stem": "Автор «Домбыра Party» шарасына қандай тілек білдіреді?", "options": {"A": "Бұл бастаманың одан әрі жалғасын табуын қалайды.", "B": "Домбыра кешінің жоғары дәрежеде өтуін тілейді.", "C": "Елімізде домбыра кешінің жиі ұйымдастырылуын қалайды.", "D": "Шетелдегі студенттер үшін шараның қайта өткізілуін тілейді."}, "key": "A", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Осындай қазақтардың басын қосатын, елге, жерге деген сүйіспеншілікті арттыратын, рухымызды асқақтататын бастамалардың көбейе беруін тілеймін.", "Ал мен домбыра кешінің Лондонда жалғасын табуын қадағалап, септігімді тигізуге әзір екенімді баса айтқым келеді."], "explanation": "Автор осындай бастамалардың көбейе беруін тілейді және домбыра кешінің Лондонда жалғасын табуына көмектесуге дайын. Яғни ол бұл бастаманың одан әрі жалғасын табуын қалайды.", "distractor_notes": {"B": "автор өткен кешке риза, болашақ кештің деңгейі туралы тілек айтпайды.", "C": "автор кештің Қазақстанда емес, Лондонда жалғасын табуын қалайды.", "D": "шара тек студенттерге арналмаған. Автор студенттердің көбі елге оралғанын уайым ретінде ғана айтады."}, "distractor_evidence": {"B": [], "C": ["Ал мен домбыра кешінің Лондонда жалғасын табуын қадағалап, септігімді тигізуге әзір екенімді баса айтқым келеді."], "D": ["Себебі жанымда жүрген қазақ студенттерінің оқуы аяқталып, басым бөлігі елге оралған болатын."]}, "keywords": {"ok": {"kk": ["бастамалардың көбейе беруін тілеймін", "жалғасын табуын"], "ru": []}, "C": {"kk": ["Лондонда жалғасын табуын"], "ru": []}, "D": {"kk": ["басым бөлігі елге оралған"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q18", "number": 18, "text_id": "l1v2-t8", "stem": "Неліктен аз жұмыс істеген адамның ағашы көбірек болып шықты?", "options": {"A": "демалуына көңіл бөлетіндіктен", "B": "құралын ауыстырып отыратындықтан", "C": "түскі асты уақытында ішетіндіктен", "D": "үйіне ертерек қайтатындықтан"}, "key": "A", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ал мен кейде тынығып отырып, балтамды қайрап аламын.", "Өткір балтамен жұмыс істеу жұмысты жеңілдетеді әрі шаршамайсың."], "explanation": "Екінші адам тынығып отырған кезде балтасын қайрап алады. Өткір балтамен жұмыс жеңіл әрі тез жүреді, адам шаршамайды. Ол демалуға көңіл бөлгендіктен, күші де сақталып, балтасы да өткір болды.", "distractor_notes": {"B": "ол құралын ауыстырған жоқ, сол балтасын қайрап отырған.", "C": "мәтінде екінші адамның түскі асы туралы айтылмайды. Түскі асты бірінші адам ұмытып кетеді.", "D": "екінші адам үйіне ерте қайтады, бірақ ағашты көбірек шабуының себебі – бұл емес. Ол себебін өзі айтады."}, "distractor_evidence": {"B": ["Ал мен кейде тынығып отырып, балтамды қайрап аламын."], "C": ["Түскі асты ішуді де ұмытып кетеді."], "D": ["Өткір балтамен жұмыс істеу жұмысты жеңілдетеді әрі шаршамайсың."]}, "keywords": {"ok": {"kk": ["тынығып отырып", "балтамды қайрап аламын", "шаршамайсың"], "ru": []}, "B": {"kk": ["балтамды қайрап аламын"], "ru": []}, "C": {"kk": ["Түскі асты"], "ru": []}, "D": {"kk": ["Өткір балтамен"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q19", "number": 19, "text_id": "l1v2-t8", "stem": "Автор қандай кеңес береді?", "options": {"A": "Бәсекеге қабілетті болуымыз керек.", "B": "Демалмастан еңбек ете білуіміз керек.", "C": "Жеңіске жетуге тырысуымыз керек.", "D": "Өзімізді үнемі дамытуымыз керек."}, "key": "D", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Өз-өзіңді жетілдіру балтаны қайрағанға ұқсайды.", "Кемшіліктеріміз болса, оларды толықтырып, жетілдіре түсуіміз қажет."], "explanation": "Автор балтаны қайрауды өзін-өзі жетілдірумен салыстырады: кемшіліктерімізді толықтырып, үнемі дамуымыз керек.", "distractor_notes": {"A": "мәтінде екеуі ағаштарын санайды, бірақ автордың кеңесі бәсеке туралы емес. Соңғы абзацты қайта оқы.", "B": "мәтін керісінше үйретеді: демалмай еңбектенген адам аз ағаш шапты.", "C": "мәтінде жеңіске жету туралы кеңес жоқ. Соңғы абзацты қайта оқы."}, "distractor_evidence": {"A": [], "B": ["Екінші адамның шапқан ағашы көбірек болып шығады."], "C": []}, "keywords": {"ok": {"kk": ["Өз-өзіңді жетілдіру", "жетілдіре түсуіміз қажет"], "ru": []}, "B": {"kk": ["Екінші адамның шапқан ағашы көбірек"], "ru": []}}, "editor_changes": ""}, {"id": "l1v2-q20", "number": 20, "text_id": "l1v2-t9", "stem": "Адам жүрісінің өзгеруіне не әсер етті?", "options": {"A": "ағзаның ауруға шалдығуы", "B": "ауыр заттарды көтеру", "C": "жануарларға еліктеу", "D": "технологияны қолдану"}, "key": "D", "skill": "A2", "skill_name": "Себеп пен салдарды табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Себебі ұялы телефон мен гаджеттерді күнделікті қолдану адамды бүкірейтіп, жүрісін өзгерте бастапты."], "explanation": "Ұялы телефон мен гаджеттерді, яғни технологияны күнделікті қолдану адамды бүкірейтіп, жүрісін өзгерткен.", "distractor_notes": {"A": "ауру – себеп емес, салдар: адам дұрыс емес қалыпта жүргендіктен омыртқа мен жүйке аурулары пайда болады.", "B": "мәтінде ауыр зат көтеру туралы айтылмайды. 15 келі – телефонға үңілгенде омыртқаға түсетін жүктеме.", "C": "мәтінде адамның жануарға еліктегені айтылмайды. Маймыл тек эволюция теориясына қатысты аталады."}, "distractor_evidence": {"A": ["Адам ағзасына омыртқа мен жүйке ауруларының қайдан келетінін ойлай беріңіз."], "B": ["Осындай қалыптағы адамның басы мен омыртқасы 15 келі салмаққа тең қосымша жүктеме алады екен."], "C": ["Эволюция теориясы бойынша адам маймыл тәріздес жануардан тік жүретін тұлғаға айналу үшін біршама уақыт кетіпті."]}, "keywords": {"ok": {"kk": ["ұялы телефон мен гаджеттерді күнделікті қолдану", "жүрісін өзгерте бастапты"], "ru": []}, "A": {"kk": ["омыртқа мен жүйке ауруларының"], "ru": []}, "B": {
