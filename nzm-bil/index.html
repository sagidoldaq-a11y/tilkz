 тілдерін жақсы меңгереді делінген."}, "distractor_notes_ru": {"B": "Обрати внимание на слово «только». В тексте говорится и о другой пользе музыки, кроме поднятия настроения.", "C": "В тексте сказано, что мелодия складывается из звуков природы. А приятные эмоции дарит не природа, а музыка.", "D": "В тексте ничего не сказано о журналистах («тілші»). Сказано, что человек, занимающийся музыкой, хорошо осваивает иностранные языки."}, "distractor_evidence": {"B": ["Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған."], "C": ["Табиғаттағы жаңбыр, дауыл, жел үні, су сылдыры, құстар әні, аңдардың дауысы, қимылына еліктеуден әуен құралады.", "Музыка көңілді көтереді, қайғыны жеңілдетеді, бойды сергітеді, жанға жайлы эмоция сыйлайды."], "D": ["Сонымен қатар музыкамен айналысқан адам шет тілдерін жақсы меңгереді екен."]}, "keywords": {"ok": {"kk": ["қанайналым жүйесі", "зат алмасу процесі жақсарады", "емдеген"], "ru": ["кровообращение", "обмен веществ", "лечили"]}, "B": {"kk": ["ми жүйесіне әсер ететінін"], "ru": ["влияет на мозг"]}, "C": {"kk": ["еліктеуден әуен құралады", "Музыка көңілді", "жанға жайлы эмоция"], "ru": ["Мелодия складывается", "Музыка поднимает", "приятные эмоции"]}, "D": {"kk": ["шет тілдерін жақсы меңгереді"], "ru": ["хорошо осваивает иностранные языки"]}}, "editor_changes": ""}, {"id": "l2v1-q27", "number": 7, "text_id": "l2v1-t4", "stem": "Мәтінге қандай тақырып сәйкес келеді?", "options": {"A": "Ғажайып табиғат", "B": "Зерттеу алаңы", "C": "Музыка құдіреті", "D": "Халық аспаптары"}, "key": "C", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Жақсы ән мен сазды музыка – жан азығы. (3-азатжол)", "Шығыстың ұлы емшісі Авиценна музыканың адамды емдейтін емдік қасиеті бар екенін айтқан. (4-азатжол)", "Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі. (5-азатжол)"], "explanation": "Мәтіннің азатжолдарының бәрі музыканың адамға күшті әсері туралы: жанға азық береді, денсаулықты жақсартады, емдейді, қабілетті ашады. «Құдірет» – ерекше күш деген сөз.", "explanation_ru": "Все абзацы текста — о сильном влиянии музыки на человека: она питает душу, улучшает здоровье, лечит, раскрывает способности. «Құдірет» значит «могущество, особая сила».", "distractor_notes": {"A": "табиғат тек 2-азатжолда, музыканың қайдан шығатынын түсіндіру үшін айтылады.", "B": "зерттеу тек 4-азатжолда аталады, мәтін тұтасымен зерттеу туралы емес.", "D": "мәтінде халық аспаптары туралы айтылмайды. Аспап тек 5-азатжолда, жалпы түрде аталады."}, "distractor_notes_ru": {"A": "Природа упоминается только во 2-м абзаце — чтобы объяснить, откуда берётся музыка.", "B": "Об исследованиях говорится только в 4-м абзаце, текст в целом не об исследованиях.", "D": "О народных инструментах в тексте не говорится. Инструмент упомянут только в 5-м абзаце, в общем виде."}, "distractor_evidence": {"A": ["Ал дыбыс дегеніміз – табиғат."], "B": ["Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған."], "D": ["Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі."]}, "keywords": {"ok": {"kk": ["жан азығы", "емдік қасиеті", "қабілеттері ашыла түседі"], "ru": ["пища для души", "целебной силой", "раскрываются его способности"]}, "A": {"kk": ["табиғат"], "ru": ["природа"]}, "B": {"kk": ["Ғалымдар"], "ru": ["Учёные"]}, "D": {"kk": ["Музыкалық аспапта"], "ru": ["музыкальном инструменте"]}}, "editor_changes": ""}, {"id": "l2v1-q28", "number": 8, "text_id": "l2v1-t5", "stem": "Қай бөлімде балалық шақтың қиындығы туралы айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "A", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты. (1-бөлім)"], "explanation": "1-бөлімде Асанәлі Әшімов балалық шағының ауыр болғанын айтады: соғыс кезінде егінде жұмыс істеп, кейде мектепке жалаңаяқ барған.", "explanation_ru": "В 1-й части Асанали Ашимов рассказывает, что детство было трудным: шла война, он работал в поле и иногда ходил в школу босиком.", "distractor_notes": {"B": "2-бөлім анасы туралы: оның еңбекқор, мейірімді адам болғаны айтылады.", "C": "3-бөлім бала кезгі ойындар туралы.", "D": "4-бөлімде балаларға берілген кеңес айтылады."}, "distractor_notes_ru": {"B": "2-я часть — о его маме: она была трудолюбивой и доброй.", "C": "3-я часть — о детских играх.", "D": "В 4-й части — совет детям."}, "distractor_evidence": {"B": ["– Анам еңбекқор, мейірімді, қарапайым адам болды."], "C": ["– Балалық шағыңызда қандай ойындар ойнадыңыз?"], "D": ["– Балаларға қандай кеңес берер едіңіз?"]}, "keywords": {"ok": {"kk": ["балалық шағы ауыр болды"], "ru": ["было трудным"]}, "B": {"kk": ["Анам"], "ru": ["Моя мама"]}, "C": {"kk": ["ойындар"], "ru": ["игры"]}, "D": {"kk": ["кеңес"], "ru": ["совет"]}}, "editor_changes": ""}, {"id": "l2v1-q29", "number": 9, "text_id": "l2v1-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Соғыс кезінде балалар жауынгер болып ойнады.\n2. Соғыс кезінде балалар үлкендерге көмектесті.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Ауылдың барлық ер-азаматы соғысқа кетті, жұмыс істей алатын қарттардың, аналардың, балалардың барлығы жұмыс істеді. (1-бөлім)", "Балалар жұмыс істеп жүріп те ойнай алдық. (3-бөлім)"], "explanation": "Мәтінде балалардың үлкендермен бірге жұмыс істегені айтылады (2-тұжырым дұрыс). Ал балалар жауынгер болып емес, «Қызыл май» (хоккей) және доп ойнаған (1-тұжырым қате).", "explanation_ru": "В тексте сказано, что дети работали вместе со взрослыми (утверждение 2 верно). А играли они не в войну, а в «Қызыл май» (хоккей) и в мяч (утверждение 1 неверно).", "distractor_notes": {"A": "балалардың қандай ойын ойнағанын 3-бөлімнен қайта оқып, бірінші тұжырымды тексер.", "C": "екі тұжырымды да мәтінмен жеке-жеке салыстыр. Балалардың қандай ойын ойнағаны 3-бөлімде жазылған.", "D": "тұжырымдардың біреуі мәтінде бар. Соғыс кезінде балалардың не істегенін 1-бөлімнен қайта оқы."}, "distractor_notes_ru": {"A": "Перечитай в 3-й части, во что играли дети, и проверь первое утверждение.", "C": "Сравни каждое утверждение с текстом отдельно. Во что играли дети, написано в 3-й части.", "D": "Одно из утверждений есть в тексте. Перечитай в 1-й части, что делали дети во время войны."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["балалардың барлығы жұмыс істеді", "жұмыс істеп жүріп"], "ru": ["работали все, кто мог", "даже работая"]}}, "editor_changes": ""}, {"id": "l2v1-q30", "number": 10, "text_id": "l2v1-t5", "stem": "Мәтіндегі оқиғалардың реті қандай?\n1. Бала күнгі ойындар\n2. Соғыс және балалық шақ\n3. Оқудың пайдасы\n4. Менің анам", "options": {"A": "1, 2, 3, 4", "B": "1, 2, 4, 3", "C": "2, 1, 4, 3", "D": "2, 4, 1, 3"}, "key": "D", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты. (1-бөлім)", "– Анам еңбекқор, мейірімді, қарапайым адам болды. (2-бөлім)", "– Соғыс жүріп жатқандықтан, бізде ойыншық деген болған жоқ. (3-бөлім)", "Оқысаң, білімді болсаң, елге де көмегің тиеді. (4-бөлім)"], "explanation": "Сұхбат бөлімдерінің реті: 1 – соғыс және балалық шақ, 2 – анасы, 3 – бала күнгі ойындар, 4 – оқудың пайдасы. Тізімдегі нөмірлермен жазсақ: 2, 4, 1, 3.", "explanation_ru": "Порядок частей интервью: 1 — война и детство, 2 — мама, 3 — детские игры, 4 — польза учёбы. Номерами из списка: 2, 4, 1, 3.", "distractor_notes": {"A": "мәтін бала күнгі ойындардан басталмайды. 1-бөлімнің не туралы екенін қайта оқы.", "B": "мәтін бала күнгі ойындардан басталмайды. 1-бөлімнің не туралы екенін қайта оқы.", "C": "бірінші бөлім дұрыс анықталған, бірақ қалғандарының ретін 2 және 3-бөлімдерден қайта тексер."}, "distractor_notes_ru": {"A": "Текст начинается не с детских игр. Перечитай, о чём 1-я часть.", "B": "Текст начинается не с детских игр. Перечитай, о чём 1-я часть.", "C": "Первая часть определена верно, но порядок остальных проверь по 2-й и 3-й частям."}, "distractor_evidence": {"A": [], "B": [], "C": []}, "keywords": {"ok": {"kk": ["балалық шағы ауыр болды", "Анам", "ойыншық", "Оқысаң, білімді болсаң"], "ru": ["было трудным", "Моя мама", "игрушек", "Если будешь учиться"]}}, "editor_changes": ""}, {"id": "l2v1-q31", "number": 11, "text_id": "l2v1-t5", "stem": "Асанәлі Әшімов балаларға қандай кеңес береді?", "options": {"A": "Ата-ананың балаларына деген қамқорлығы ерекше.", "B": "Балалар кішкентайынан елдің қамын ойлауы тиіс.", "C": "Балалық шақта еңбекке араласқан дұрыс.", "D": "Білім жолында аянбай тер төгу қажет."}, "key": "D", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Балаларға айтарым: оқы, оқы және тағы оқы... (4-бөлім)"], "explanation": "Асанәлі Әшімов балаларға «оқы, оқы және тағы оқы» деп кеңес береді. Бұл – білім алу үшін көп еңбектену керек деген ой.", "explanation_ru": "Асанали Ашимов советует детям: «учись, учись и ещё раз учись». Это мысль о том, что ради знаний нужно много трудиться.", "distractor_notes": {"A": "кеңесте ата-ананың қамқорлығы туралы айтылмайды. Керісінше, ол баланың ата-анасын тыңдауы керек дейді.", "B": "ол балаларға елдің қамын емес, өз болашағын кішкентайынан ойлауды айтады. Елге көмек – білімнің нәтижесі.", "C": "балалық шақта жұмыс істегенін ол кеңес ретінде емес, соғыс кезіндегі ауыр жағдай ретінде айтады."}, "distractor_notes_ru": {"A": "О заботе родителей в совете не говорится. Наоборот, он говорит, что ребёнок должен слушать родителей.", "B": "Он советует детям с детства думать не о стране, а о своём будущем. Польза стране — результат знаний.", "C": "О работе в детстве он говорит не как о совете, а как о трудностях военного времени."}, "distractor_evidence": {"A": ["– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды."], "B": ["– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды.", "Оқысаң, білімді болсаң, елге де көмегің тиеді."], "C": ["Бала Асанәлі егінде жұмыс істеді."]}, "keywords": {"ok": {"kk": ["оқы, оқы және тағы оқы"], "ru": ["учись, учись и ещё раз учись"]}, "A": {"kk": ["ата-анасын тыңдап"], "ru": ["слушает родителей"]}, "B": {"kk": ["болашағын кішкентайынан ойлайды", "елге де көмегің тиеді"], "ru": ["с детства думает о своём будущем", "пользу и своей стране"]}, "C": {"kk": ["егінде жұмыс істеді"], "ru": ["работал в поле"]}}, "editor_changes": ""}, {"id": "l2v1-q32", "number": 12, "text_id": "l2v1-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "әңгіме", "B": "мақала", "C": "монолог", "D": "сұхбат"}, "key": "D", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["– Өміріңізде анаңыздың рөлі қандай?", "– Балаларға қандай кеңес берер едіңіз?"], "explanation": "Мәтін сұрақ пен жауаптан тұрады: біреуі сұрақ қояды, Асанәлі Әшімов жауап береді. Мұндай үлгі сұхбат деп аталады.", "explanation_ru": "Текст состоит из вопросов и ответов: один спрашивает, Асанали Ашимов отвечает. Такой жанр называется интервью (сұхбат).", "distractor_notes": {"A": "әңгімеде оқиға баяндалады, ал бұл мәтін сұрақ-жауап түрінде құрылған.", "B": "мақалада автор бір тақырыпты өз атынан түсіндіреді, ал мұнда екі адамның сұрақ-жауабы бар.", "C": "монологта бір адам ғана сөйлейді, ал мұнда сұрақ қоятын екінші адам бар."}, "distractor_notes_ru": {"A": "В рассказе (әңгіме) повествуется о событиях, а этот текст построен в форме вопросов и ответов.", "B": "В статье (мақала) автор сам раскрывает тему, а здесь вопросы и ответы двух людей.", "C": "В монологе говорит только один человек, а здесь есть второй — тот, кто задаёт вопросы."}, "distractor_evidence": {"A": [], "B": [], "C": ["– Өміріңізде анаңыздың рөлі қандай?"]}, "keywords": {"ok": {"kk": ["рөлі қандай?", "берер едіңіз?"], "ru": ["Какова роль", "дали бы"]}, "C": {"kk": ["рөлі қандай?"], "ru": ["Какова роль"]}}, "editor_changes": ""}, {"id": "l2v1-q33", "number": 13, "text_id": "l2v1-t6", "stem": "Жауынгердің өзіндік әдісі қандай?", "options": {"A": "бәсекелесін ашуландыру", "B": "бәсекелесін қолдау", "C": "сабырлық таныту", "D": "ұстазын құрметтеу"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Ол қарсыласына ауыр сөздер айтып, ызаландырады."], "explanation": "Жауынгердің тактикасы: қарсыласын ауыр сөзбен ызаландыру, яғни ашуландыру. Ашуланған қарсылас қателесіп, жеңіледі.", "explanation_ru": "Тактика воина — оскорблениями довести соперника до ярости, то есть разозлить. Разозлённый соперник ошибается и проигрывает.", "distractor_notes": {"B": "мәтінде жауынгердің ешкімді қолдағаны айтылмайды. Оның қарсыласына не істейтінін қайта оқы.", "C": "сабыр танытқан жауынгер емес, самурай.", "D": "жауынгер ұстазды құрметтемейді: ол есікті теуіп, кетіп қалады."}, "distractor_notes_ru": {"B": "В тексте не сказано, что воин кого-то поддерживал. Перечитай, что он делает со своим соперником.", "C": "Терпение проявил не воин, а самурай.", "D": "Воин не уважает учителя: он пинает дверь и уходит."}, "distractor_evidence": {"B": [], "C": ["Алайда самурай оған қалт етпейді."], "D": ["Ызаланған жауынгер есікті теуіп, кетіп қалады."]}, "keywords": {"ok": {"kk": ["ауыр сөздер айтып, ызаландырады"], "ru": ["оскорбительные слова", "доводит до ярости"]}, "C": {"kk": ["самурай оған қалт етпейді"], "ru": ["самурай даже не шелохнулся"]}, "D": {"kk": ["есікті теуіп"], "ru": ["пинает дверь"]}}, "editor_changes": ""}, {"id": "l2v1-q34", "number": 14, "text_id": "l2v1-t6", "stem": "«…ол кімнің қолында қалады?»\nОсы сөйлемде самурай кімді атап тұр?", "options": {"A": "келген қонақты", "B": "күтіп алушыны", "C": "сыйлық алушыны", "D": "сыйлық берушіні"}, "key": "D", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["– Өзінің иесінде, – деп жауап береді шәкірттері.", "Оларды қабылдамасаң, барлығы өз иесінде қалады, – дейді самурай."], "explanation": "Сыйлықты қабылдамасаң, ол алып келген адамның, яғни сыйлық берушінің қолында қалады. Шәкірттер де «Өзінің иесінде» деп жауап береді.", "explanation_ru": "Если не принять подарок, он останется у того, кто его принёс, то есть у дарителя. Ученики так и отвечают: «У своего хозяина».", "distractor_notes": {"A": "«келген қонақ» деген сөз мәтінде жоқ. Сыйлық кімнің қолында қалатынын шәкірттердің жауабынан тап.", "B": "күтіп алушы туралы мәтінде айтылмайды.", "C": "сыйлықты алушы оны қабылдамады, сондықтан сыйлық оның қолында қалмайды."}, "distractor_notes_ru": {"A": "Слов «пришедший гость» в тексте нет. Найди ответ в словах учеников.", "B": "О встречающем в тексте не говорится.", "C": "Тот, кому принесли подарок, его не принял, поэтому подарок у него не остаётся."}, "distractor_evidence": {"A": [], "B": [], "C": ["Дана самурай: – Сізге біреу сыйлық алып келіп, сіз қабылдамасаңыз, ол кімнің қолында қалады?"]}, "keywords": {"ok": {"kk": ["Өзінің иесінде", "өз иесінде қалады"], "ru": ["У своего хозяина", "останется у своего хозяина"]}, "C": {"kk": ["сіз қабылдамасаңыз"], "ru": ["не примете"]}}, "editor_changes": ""}, {"id": "l2v1-q35", "number": 15, "text_id": "l2v1-t6", "stem": "Бос орынға қай сөз қойылады?", "options": {"A": "Бірақ", "B": "Дегенмен", "C": "Демек", "D": "Немесе"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Шынында да, біреудің ашулы сөзін көңілге алмасаңыз, жүйкеңіз тозбайды.", "денсаулығыңыз да қалыпты болады"], "explanation": "Екінші сөйлем біріншісінің нәтижесін, қорытындысын айтады: жүйке тозбаса, денсаулық та қалыпты болады. Нәтижені «демек» сөзі байланыстырады.", "explanation_ru": "Второе предложение — следствие первого: если нервы в порядке, то и здоровье в порядке. Следствие связывает слово «демек» (значит).", "distractor_notes": {"A": "«бірақ» қарама-қарсы ойларды байланыстырады. Екі сөйлемнің ойы бір-біріне қарсы ма, әлде жоқ па, ойлан.", "B": "«дегенмен» де қарама-қарсы ойды білдіреді. Екі сөйлемнің арасында қандай байланыс бар екенін ойлан.", "D": "«немесе» таңдауды білдіреді (не ол, не бұл). Мұнда таңдау жоқ."}, "distractor_notes_ru": {"A": "«Бірақ» (но) связывает противоположные мысли. Подумай, противоречат ли друг другу эти два предложения.", "B": "«Дегенмен» (однако) тоже выражает противопоставление. Подумай, как связаны два предложения.", "D": "«Немесе» (или) выражает выбор. Здесь выбора нет."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["жүйкеңіз тозбайды", "денсаулығыңыз да қалыпты болады"], "ru": ["нервы не будут расшатаны", "здоровье тоже будет в порядке"]}}, "editor_changes": ""}, {"id": "l2v1-q36", "number": 16, "text_id": "l2v1-t7", "stem": "Мәтіндегі оқиғалардың реті қандай?\n1. Беті-қолын жуған адам\n2. Нәтижесіз созылған айтыс\n3. Айтысқа қосылған Сабын\n4. Сүлгі мен Қолжуғыш дауы", "options": {"A": "1, 2, 3, 4", "B": "1, 3, 2, 4", "C": "1, 4, 3, 2", "D": "2, 1, 4, 3"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды.", "– Ей, Сүлгі! – деді Қолжуғыш шыдай алмай.", "Сабын да қарап тұра алмады.", "Үшеуінің айтысы кешке дейін созылды."], "explanation": "Алдымен адам жуынады (1), сосын Сүлгі мақтанып, Қолжуғыш онымен дауласады (4), кейін айтысқа Сабын қосылады (3), соңында айтыс кешке дейін нәтижесіз созылады (2).", "explanation_ru": "Сначала человек умывается (1), потом Полотенце хвастается, и Умывальник с ним спорит (4), затем в спор вступает Мыло (3), и в конце спор безрезультатно длится до вечера (2).", "distractor_notes": {"A": "мәтіндегі оқиғаларды басынан бастап ретімен қайта оқы: айтысқа кім, қашан қосылады?", "B": "айтысқа алдымен кім кіріседі – Сабын ба, әлде Сүлгі мен Қолжуғыш па? Мәтінді қайта оқы.", "D": "мәтін айтыстан емес, адамның жуынуынан басталады."}, "distractor_notes_ru": {"A": "Перечитай события по порядку с начала: кто и когда вступает в спор?", "B": "Кто вступает в спор первым — Мыло или Полотенце с Умывальником? Перечитай текст.", "D": "Текст начинается не со спора, а с того, что человек умывается."}, "distractor_evidence": {"A": [], "B": [], "D": ["Адам қолжуғышқа су құйды."]}, "keywords": {"ok": {"kk": ["беті-қолын сабындап", "Қолжуғыш", "Сабын да", "кешке дейін созылды"], "ru": ["намылил лицо и руки", "Умывальник", "Мыло тоже", "до самого вечера"]}, "D": {"kk": ["Адам қолжуғышқа су құйды"], "ru": ["налил воды в умывальник"]}}, "editor_changes": ""}, {"id": "l2v1-q37", "number": 17, "text_id": "l2v1-t7", "stem": "Бос орынға қай жауап сәйкес келеді?", "options": {"A": "адам дауды тоқтатқан еді", "B": "олар әбден шаршаған еді", "C": "оларды ешкім естімеген еді", "D": "су таусылып қалған еді"}, "key": "D", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды."], "explanation": "Мәтіннің басында адамның «су біткенше» жуынғаны айтылады. Су таусылғандықтан, кешке дейін ешкім жуынуға келмеген.", "explanation_ru": "В начале текста сказано, что человек умывался, «пока не кончилась вода». Раз воды не осталось, до вечера к ним никто не подходил умываться.", "distractor_notes": {"A": "мәтінде адамның дауға араласқаны айтылмайды. Ол жуынып болған соң, ішке кіріп кетті.", "B": "шаршау – олардың өз жағдайы. Ал бос орын адамдардың неліктен келмегенін түсіндіруі керек.", "C": "адамдар оларды естімегендіктен келмеді деген ой мәтіннен шықпайды. Мәтіннің басын қайта оқы."}, "distractor_notes_ru": {"A": "В тексте не сказано, что человек вмешивался в спор. Умывшись, он ушёл в дом.", "B": "Усталость — это их собственное состояние, а пропуск должен объяснить, почему к ним не подходили люди.", "C": "Из текста не следует, что люди не приходили, потому что их не слышали. Перечитай начало текста."}, "distractor_evidence": {"A": ["Сүлгіге жақсылап сүртінді де, ішке кіріп кетті."], "B": [], "C": []}, "keywords": {"ok": {"kk": ["су біткенше"], "ru": ["пока не кончилась вода"]}, "A": {"kk": ["ішке кіріп кетті"], "ru": ["ушёл в дом"]}}, "editor_changes": ""}, {"id": "l2v1-q38", "number": 18, "text_id": "l2v1-t8", "stem": "Қарлығаш қорегін қалай тауып жейді?", "options": {"A": "аузын ашып ұшу арқылы", "B": "өте жылдам ұшу арқылы", "C": "балапандарымен бірге аңшылыққа шығу арқылы", "D": "жәндіктер мен шыбын-шіркейді теріп жеу арқылы"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Қарлығашты зерттеуші ғалымдар оның әуеде аузын ашып ұша алатынын анықтаған.", "Қатты жылдамдықпен самғап келе жатқан қарлығаштың аузына ауада ұшып жүрген шыбын-шіркейлер өздері кеп түсетін көрінеді, яғни бұл – қарлығаштың «аңшылығы»."], "explanation": "Қарлығаш аузын ашып ұшады, сонда шыбын-шіркейлер оның аузына өздері кеп түседі. Бұл – оның «аңшылығы».", "explanation_ru": "Ласточка летает с открытым клювом, и мошки сами залетают ей в клюв. Это её «охота».", "distractor_notes": {"B": "қарлығаш шынымен жылдам ұшады, бірақ қорегін тек жылдамдықтың арқасында таппайды. Қорек оған қалай түсетінін қайта оқы.", "C": "қарлығаш балапандарымен бірге аңшылыққа шықпайды, ол тамақты балапандарына әкеліп береді.", "D": "мәтінде қарлығаштың шыбын-шіркейді «теріп» жейтіні айтылмайды. Олардың қалай қорек болатынын мәтіннен тауып көр."}, "distractor_notes_ru": {"B": "Ласточка действительно летает быстро, но корм она добывает не только благодаря скорости. Перечитай, как корм к ней попадает.", "C": "Ласточка не охотится вместе с птенцами — она приносит им пищу.", "D": "В тексте не сказано, что ласточка «собирает» насекомых. Найди в тексте, как они становятся её пищей."}, "distractor_evidence": {"B": [], "C": ["Әрі-бері самғап, аузын толтырған соң, ол тапқан тамағын балапандарына әкеліп береді."], "D": []}, "keywords": {"ok": {"kk": ["аузын ашып ұша", "аузына", "өздері кеп түсетін"], "ru": ["с открытым клювом", "в клюв", "сами залетают"]}, "C": {"kk": ["балапандарына әкеліп береді"], "ru": ["приносит найденную пищу птенцам"]}}, "editor_changes": ""}, {"id": "l2v1-q39", "number": 19, "text_id": "l2v1-t8", "stem": "Мәтіннің соңында автор неге назар аударғысы келді?", "options": {"A": "адамдардың қарлығашқа деген қамқорлығына", "B": "қарлығаштың адамзатқа әкелетін пайдасына", "C": "қарлығаштың ұя салу қабілетіне", "D": "адамдардың сенгіштігіне"}, "key": "B", "skill": "D2", "skill_name": "Автордың мақсаты мен көзқарасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Сондай-ақ қаншама зиянды шыбын-шіркейді жойып, адамға да көмегін тигізеді."], "explanation": "Мәтіннің соңғы бөлігі қарлығаштың зиянды шыбын-шіркейді жойып, адамға көмектесетіні туралы. Халықтың оны киелі санауы да осыған байланысты.", "explanation_ru": "Последняя часть текста — о том, что ласточка уничтожает вредных насекомых и помогает человеку. Поэтому народ и считает её священной.", "distractor_notes": {"A": "мәтінде адамдардың қарлығашқа қамқорлық жасағаны айтылмайды.", "C": "ұя туралы тек ырым ретінде айтылады, қарлығаштың ұя салу қабілеті сипатталмайды.", "D": "ырым туралы бір сөйлем бар, бірақ автор адамдарды сенгіш деп сынамайды."}, "distractor_notes_ru": {"A": "В тексте не сказано, что люди заботятся о ласточке.", "C": "О гнезде говорится только как о примете, умение строить гнёзда не описывается.", "D": "Есть одно предложение о примете, но автор не критикует людей за суеверность."}, "distractor_evidence": {"A": [], "C": ["Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды."], "D": ["Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды."]}, "keywords": {"ok": {"kk": ["зиянды шыбын-шіркейді жойып", "адамға да көмегін тигізеді"], "ru": ["вредных насекомых", "помогает и человеку"]}, "C": {"kk": ["ұя салса", "жақсы ырымға"], "ru": ["свьёт гнездо", "доброй приметой"]}, "D": {"kk": ["жақсы ырымға"], "ru": ["доброй приметой"]}}, "editor_changes": ""}, {"id": "l2v1-q40", "number": 20, "text_id": "l2v1-t9", "stem": "Мәтіннің негізгі ойы қандай?", "options": {"A": "Білім ешқашан тозбайды.", "B": "Достық ешқашан тозбайды.", "C": "Киім ешқашан тозбайды.", "D": "Кітап ешқашан тозбайды."}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Оның сырты ескіреді, бірақ ішіндегі ақыл ескірмейді, – депті сонда Қожанасыр."], "explanation": "Қожанасыр кітаптың сырты ескіргенімен, ішіндегі ақыл, яғни білім ескірмейтінін айтады. Демек, негізгі ой – білім ешқашан тозбайды.", "explanation_ru": "Ходжа Насреддин говорит, что обложка книги стареет, но мудрость внутри, то есть знание, не стареет. Значит, главная мысль — знание никогда не устаревает.", "distractor_notes": {"B": "мәтінде достық туралы ой айтылмайды. «Достым» деген сөз тек қаратпа ретінде қолданылған.", "C": "керісінше, Қожанасыр киімнің ескіретінін айтады.", "D": "Қожанасыр кітаптың сырты ескіретінін айтады. Кітаптың қай бөлігі ескірмейтінін қайта оқы."}, "distractor_notes_ru": {"B": "В тексте нет мысли о дружбе. Слово «достым» (друг мой) — просто обращение.", "C": "Наоборот, Ходжа Насреддин говорит, что одежда стареет.", "D": "Ходжа Насреддин говорит, что обложка книги стареет. Перечитай, какая часть книги не стареет."}, "distractor_evidence": {"B": ["– Е, достым, не істеп жатырсың?"], "C": ["– Қой, достым, киім ескіреді, бірақ кітап ескірмейді."], "D": []}, "keywords": {"ok": {"kk": ["ішіндегі ақыл ескірмейді"], "ru": ["мудрость внутри не стареет"]}, "B": {"kk": ["достым"], "ru": ["друг мой"]}, "C": {"kk": ["киім ескіреді"], "ru": ["одежда стареет"]}}, "editor_changes": ""}]}, {"bank_id": "kaz-L2-v2", "track": "second_language", "source": "Автордың құрастырған нұсқасы: мәтіндер қазақстандық сайттардан алынған (әр мәтіннің source_note өрісін қараңыз)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {"Содан кейін робот қымыздың шипалы қасиеті туралы қысқаша мағлұмат береді әрі ыдысқа пайдалы сусын құяды.": "После этого робот коротко рассказывает о целебных свойствах кумыса и наливает в посуду полезный напиток.", "Ұлттық сусынымызды насихаттайтын болғандықтан, Асылбектің ұлттық киімде болғаны дұрыс деп шештік, – дейді Жансұлтан.": "Раз он пропагандирует наш национальный напиток, мы решили, что будет правильно, если Асылбек был в национальной одежде, — говорит Жансултан.", "Оқушыға роботты жасап шығуға информатика пәнінің мұғалімі көмектескен.": "Создать робота ученику помог учитель информатики.", "Кез келген адам роботқа арнайы пластикалық картаны жақындату арқылы Асылбекті сөйлете алады.": "Любой человек может заставить Асылбека заговорить, поднеся пластиковую карту к роботу.", "Құрылғы мойындағы өте әлсіз вибрацияларды анықтап, оларды адамның өз дауысына мейлінше ұқсас сөйлеуге айналдырады.": "Устройство улавливает очень слабые вибрации на шее и превращает их в речь, максимально похожую на собственный голос человека.", "Пайдалану жолы қарапайым: қолданушы даусынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді, кейін құрылғыны мойнына тағады — жүйе сол сәтте-ақ оның өз даусын синтездеп бере бастайды.": "Пользоваться им просто: пользователь загружает в приложение аудиофайл, записанный, пока пользователь ещё не потерял голос, затем надевает устройство на шею — и система сразу начинает синтезировать его собственный голос.", "Ашық теңіздегі адамды байқаған дельфиндер оған көмекке келіп, айналасында топтасып жүзе бастаған.": "Дельфины, заметившие человека в открытом море, пришли ему на помощь и стали плавать группой вокруг него.", "Оның сөзінше, дельфиндер осылайша ер адамды қорғауға тырысқан.": "По его словам, так дельфины пытались защитить мужчину.", "Құтқару кемесінің капитаны О'Коннеллдің сөзінше, теңіз жануарлары ирландиялық азаматтың айналасында топтасып жүзіп жүрген.": "По словам капитана спасательного судна О'Коннелла, морские животные плавали группой вокруг ирландца.", "Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды.": "В итоге через 12 часов в четырёх километрах от берега спасатели заметили группу плавающих дельфинов.", "Құтқарушылар қайықпен және тікұшақпен жоғалған адамды іздеуге кіріскен.": "Спасатели на лодке и вертолёте начали искать пропавшего человека.", "Сонымен қатар, құтқарушылар дельфиндер болмағанда, ер адамды дер кезінде тауып, құтқарып қалу екіталай еді деген пікірде.": "Кроме того, спасатели считают, что если бы не дельфины, вовремя найти и спасти мужчину вряд ли удалось бы.", "Белгілі болғандай, ер адам 8 шақырым қашықтықты жалғыз өзі жүзіп өтпек болған.": "Как стало известно, мужчина хотел в одиночку проплыть 8 километров.", "Құтқарушылар ер адамды судан шығарып, оған алғашқы көмек көрсеткен.": "Спасатели вытащили мужчину из воды и оказали ему первую помощь.", "Шаңырақ «үй, отбасы» деген мағынаны да білдіреді.": "Шанырак имеет также значение «дом, семья».", "Киіз үй берік ағаштан (қайыңнан, талдан) жасалады.": "Юрту делают из прочного дерева (берёзы, ивы).", "Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады.": "Готовую решётку называют «қанат» (крыло), то есть в юрте на 18 «крыльев» — 18 решёток.", "Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі.": "Уық — одна из главных частей, соединяющих решётку и шанырак.", "Оларға құрт түспейді, басқа ағаштар сияқты тез шірімейді.": "Их не точат черви, они не гниют быстро, как другие деревья.", "Әр үйде көлеміне қарай 60-160-тай уық болады.": "В каждой юрте, в зависимости от её размера, бывает около 60–160 жердей (уық).", "Оның әсемдікке әрі жылылыққа әсері мол.": "Он придаёт дому красоту и тепло.", "Сондай-ақ ши тұрғанда сырттан құрт-құмырсқа, кесіртке, жылан тағы басқа жәндіктер кіре алмайды.": "Кроме того, когда стоит чий, снаружи не могут проникнуть насекомые, ящерицы, змеи и другие существа.", "Кереге киіз үйдің негізін құрайды.": "Решётка (кереге) составляет основу юрты.", "Шаңырақ – киіз үйдің қасиетті, киелі мүлкі.": "Шанырак — святое, почитаемое достояние юрты.", "Киіз үйдің бір бөлшегі – кәдімгі ши.": "Ещё одна часть юрты — обычный чий (циновка из стеблей).", "«Керегең кең болсын» деген тілек осыдан шыққан.": "Отсюда пошло пожелание «Керегең кең болсын» («Пусть твоя решётка будет широкой»).", "«Шаңырағың биік болсын» деген тілек бар.": "Есть пожелание «Шаңырағың биік болсын» («Пусть твой шанырак будет высоким»).", "Есіктен кіргенде табалдырықты баспаймын.": "Входя в дверь, я не наступаю на порог.", "Біреудің үйіне аяқ киімімді шешіп кіремін.": "В чужой дом я вхожу, сняв обувь.", "Осылайша балаларға арналған алғашқы кітабымды жазуды қолға алдым.": "Так я взялась писать свою первую книгу для детей.", "– Қазақша көп сөз білмеймін.": "— Я знаю немного казахских слов.", "Осылайша көрпешені, қазақтың ұлттық киімін, кең даласы, жануарларын, киіз үйді және басқа да дүниелерді кітабымда иллюстрациялар арқылы көрсетуді жөн деп шештім.": "Поэтому я решила показать в иллюстрациях своей книги көрпеше, казахскую национальную одежду, широкую степь, животных, юрту и многое другое.", "Үш жыл кеткен жұмысым жарық көргеніне өте қуаныштымын.": "Я очень рада, что вышла в свет моя работа, на которую ушло три года.", "– Эшли, Қазақстан жайлы кітап жазу идеясы қалай дүниеге келді?": "— Эшли, как появилась идея написать книгу о Казахстане?", "– Қазақша білесіз бе?": "— Вы знаете казахский?", "– On a Train in Kazakhstan қандай кітап?": "— Что это за книга — On a Train in Kazakhstan?", "Кейіпкерлері кім?": "Кто её герои?", "– Қазір немен айналысасыз?": "— Чем вы сейчас занимаетесь?", "Көптеген мәдениетпен танысу сол мәдениеттен өзіңе ұнағанды алып, ұнамаған тұсынан атап өтуге мүмкіндік береді.": "Знакомство со многими культурами позволяет взять то, что тебе нравится, а то, что не нравится, обойти стороной.", "– Қазір отбасыма жақын жерде тұрып жатырмын.": "— Сейчас я живу рядом со своей семьёй.", "Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты.": "Разве бывает жизнь без соперничества? Один из его учеников мечтал найти вопрос, на который учитель не сможет ответить.", "Ертеде бір топ шәкірті бар ғұлама өмір сүріпті.": "Давным-давно жил мудрец, у которого было много учеников.", "– Ұстаз, айтыңызшы: менің қолымдағы тірі көбелек пе, өлі көбелек пе?": "— Учитель, скажите: бабочка у меня в руке живая бабочка или мёртвая?", "Шәкірт ұстаз жауабына орай көбелекті өлтіріп не ұшырып жіберуге даяр еді.": "Ученик в зависимости от ответа учителя был готов убить или отпустить бабочку.", "– Бәрі сенің қолыңда.": "— Всё в твоих руках.", "— Көремін, өрмек тоқып жүр.": "— Вижу, он плетёт паутину.", "— Көремін, аузында бір нанның уалшығы бар, жүгіріп кетіп барады.": "— Вижу, во рту у него хлебная крошка, бежит куда-то.", "— Жоғарыда қарлығаш ұшып жүр, аузында кесе тістеген шөбі бар.": "— Наверху летает ласточка, в клюве у неё травинка.", "Жұмыссыз жүрген бір жан жоқ.": "Нет ни одного существа без дела.", "Сонда атасы айтты:": "Тогда дед сказал:", "— Жоғары қара, аспанда не көрінеді?": "— Посмотри наверх, что видно в небе?", "Сені де Құдай-Тағала бос жүруге жаратпаған": "И тебя Всевышний создал не для того, чтобы бездельничать", "— Олай болса, шырағым, ол кішкентай жәндіктер саған әбірет.": "— Раз так, дорогой мой, эти маленькие существа тебе пример.", "Атасы он жасар ұл баласымен далада келе жатып, баласынан сұрады:": "Дед, идя по степи со своим десятилетним внуком, спросил его:", "Күндіз жеке не топтанып, бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады.": "Днём они поодиночке или группами отдыхают, свесив голову вниз и цепляясь лапками за камни, деревья, обрывы.", "Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді.": "Летучая мышь не строит гнёзд, а обитает в пещерах, дуплах деревьев, на чердаках домов и построек, в птичьих норах на обрывах.", "Кешкі ымыртта және түнде жемтігін қалықтап ұшып жүріп аулайды.": "В вечерних сумерках и ночью охотится на добычу на лету.", "Жарқанаттар өсімдіктерге зиянды әр түрлі жәндіктермен қоректеніп, ауыл шаруашылығы және орман шаруашылықтарына пайда да келтіреді.": "Питаясь разными насекомыми, вредными для растений, летучие мыши приносят пользу сельскому и лесному хозяйству.", "Сондай-ақ, түрлі аурулар (әсіресе, құтыру) таратып, адамға, жануарларға залалын да тигізеді.": "Вместе с тем, распространяя разные болезни (особенно бешенство), они наносят вред людям и животным.", "Қазан-қараша айларында қысқы ұйқыға кетеді.": "В октябре–ноябре они впадают в зимнюю спячку.", "Қожанасырдың үстіндегі киімі жаман екен.": "Одежда на Ходже Насреддине была плохой.", "Бұл жолы үй иесі Қожанасырды құрметтейді, төрден орын береді, ет келгенде:": "На этот раз хозяин оказывает почёт Ходже Насреддину, сажает на почётное место, а когда подают мясо:", "– Сен кісіні сыйламайды екенсің, киімді сыйлайды екенсің.": "— Оказывается, ты не уважаешь человека, ты уважаешь одежду.", "Сондықтан шапаныма жегізіп отырғаным!": "Поэтому я и кормлю свой халат!"}, "style_notes": [], "texts": [{"id": "l2v2-t1", "title": "", "source_note": "BAQ.KZ: «Түркістандық оқушы қымыз құятын робот ойлап тапты» – https://baq.kz/turkistandyq-oqushy-qymyz-quyatyn-robot-oylap-tapty-296343/", "numbered_paragraphs": false, "paragraphs": ["Түркістан облысы Төле би ауданында 9-сынып оқушысы Жансұлтан Төребек қымыз құятын робот жасап шығарды. Робот Асылбек деп аталады. Кез келген адам роботқа арнайы пластикалық картаны жақындату арқылы Асылбекті сөйлете алады. Содан кейін робот қымыздың шипалы қасиеті туралы қысқаша мағлұмат береді әрі ыдысқа пайдалы сусын құяды. Ұлттық сусынымызды насихаттайтын болғандықтан, Асылбектің ұлттық киімде болғаны дұрыс деп шештік, – дейді Жансұлтан. Оқушыға роботты жасап шығуға информатика пәнінің мұғалімі көмектескен."]}, {"id": "l2v2-t2", "title": "", "source_note": "Egemen Qazaqstan: «Мектеп оқушылары адамға даусын қайтаратын құрылғы ойлап тапты» – https://egemen.kz/news/article395344-mektep-oqushylary-adamgha-dausyn-qaytaratyn-qurylghy-oylap-tapty", "numbered_paragraphs": false, "paragraphs": ["Астана қаласындағы Назарбаев Зияткерлік мектебінің оқушылары дауысынан айырылған адамдарға сөйлеу мүмкіндігін қайтаратын VoiceX атты құрылғының прототипін әзірледі. Құрылғы мойындағы өте әлсіз вибрацияларды анықтап, оларды адамның өз дауысына мейлінше ұқсас сөйлеуге айналдырады.", "«Мен бұрын дауысымды жоғалту дегеннің қандай екенін мүлде ойламаппын. Біз сөйлей алатынымызға үйреніп кеткеніміз соншалық, оны әдеттегі нәрсе деп қабылдаймыз. Алайда бір сәтте біреу үшін дауыс – жай ғана арман екенін түсінесің», – деп еске алды жобаның негізін қалаушылардың бірі Айзере.", "Пайдалану жолы қарапайым: қолданушы даусынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді, кейін құрылғыны мойнына тағады — жүйе сол сәтте-ақ оның өз даусын синтездеп бере бастайды.", "Жобаны медициналық деңгейге жақындату үшін оқушылар USC және Stanford университеттерінің профессорларымен, сондай-ақ бас және мойын хирургтарымен ақылдасты."]}, {"id": "l2v2-t3", "title": "", "source_note": "NUR.KZ: «Дельфиндер теңізде 12 сағат бойы қалқып жүрген ер адамды құтқарып қалды» – https://kaz.nur.kz/kaleidoscope/1928954-delfinder-tenizde-12-sagat-boiy-qalqygan-er-adamdy-qutqaryp-qaldy/", "numbered_paragraphs": false, "paragraphs": ["Ирландияның Трали шығанағында дельфиндер 12 сағат бойы теңіздің тастай суында қалқып жүрген ер адамды құтқарып қалды. Белгілі болғандай, ер адам 8 шақырым қашықтықты жалғыз өзі жүзіп өтпек болған. Алайда қашықтықты еңсеруге шамасы жетпей, теңізде 12 сағат бойы қалқып жүрген. Ашық теңіздегі адамды байқаған дельфиндер оған көмекке келіп, айналасында топтасып жүзе бастаған.", "Құтқарушылар қайықпен және тікұшақпен жоғалған адамды іздеуге кіріскен. Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды. Құтқару кемесінің капитаны О'Коннеллдің сөзінше, теңіз жануарлары ирландиялық азаматтың айналасында топтасып жүзіп жүрген. Оның сөзінше, дельфиндер осылайша ер адамды қорғауға тырысқан.", "Құтқарушылар ер адамды судан шығарып, оған алғашқы көмек көрсеткен. Ол әбден ашығып, әлсіреп, тоңып қалған екен. Сонымен қатар, құтқарушылар дельфиндер болмағанда, ер адамды дер кезінде тауып, құтқарып қалу екіталай еді деген пікірде."]}, {"id": "l2v2-t4", "title": "", "source_note": "Bilim-all.kz: «Киіз үйдің түрлері мен құрылысы» – https://bilim-all.kz/article/2306", "numbered_paragraphs": true, "paragraphs": ["Киіз үй берік ағаштан (қайыңнан, талдан) жасалады. Оларға құрт түспейді, басқа ағаштар сияқты тез шірімейді. Талдың керегеге қажетті жуан, жіңішкесін таңдап алуға да болады.", "Кереге киіз үйдің негізін құрайды. «Керегең кең болсын» деген тілек осыдан шыққан. Өйткені үйдің берік болуы, кеңдігі осы керегеге байланысты. Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады.", "Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі. Ол иінінен ішке иіле жасалады, яғни үйдің күмбезді үлгісі осы уықтан басталады. Әр үйде көлеміне қарай 60-160-тай уық болады.", "Шаңырақ – киіз үйдің қасиетті, киелі мүлкі. Қазақтың көптеген жақсы сөздері осыған байланысты айтылады. Шаңырақ «үй, отбасы» деген мағынаны да білдіреді. «Шаңырағың биік болсын» деген тілек бар.", "Киіз үйдің бір бөлшегі – кәдімгі ши. Ши кереге мен туырлықтың екі ортасына келеді. Оның әсемдікке әрі жылылыққа әсері мол. Сондай-ақ ши тұрғанда сырттан құрт-құмырсқа, кесіртке, жылан тағы басқа жәндіктер кіре алмайды."]}, {"id": "l2v2-t5", "title": "Эшли Ланина – америкалық жазушы, иллюстратор", "source_note": "Informburo.kz: «Қазақ елін әлем балаларына кім танытып жүр? Америкалық иллюстратормен сұхбат» – https://informburo.kz/kaz/elaynasy/gulmira-qyz-qalai-qazaq-elin-alem-balalaryna-tanytyp-zur-amerikalyq-illyustratormen-suxbat", "numbered_paragraphs": false, "paragraphs": ["1. – Эшли, Қазақстан жайлы кітап жазу идеясы қалай дүниеге келді?", "– 2011 жылы тұрмыс құрғаннан кейін көп ұзамай Қазақстанға қоныс аудардым. Қазақстан екінші үйіме айналып кетті, бірақ үнемі Нью-Йорктағы отбасымды сағынатын едім. Бұл жағдай ойымды жинақтап, Қазақстанда тұрған кезде уақытты құнды бір дүние жасауға жұмсауға түрткі болды. Осылайша балаларға арналған алғашқы кітабымды жазуды қолға алдым.", "2. – Қазақша білесіз бе?", "– Қазақша көп сөз білмеймін. Орысшам да жақсы емес. Дүкеннен қажетімді алуға, таксистке баратын жерімді түсіндіруге жетеді. Атырауда тұрғанда адамдар тіл үйрену үшін менімен ағылшынша сөйлесуді қалайтын.", "3. – On a Train in Kazakhstan қандай кітап? Кейіпкерлері кім?", "– Қазақстан жайлы таңнан кешке дейін айтуға бармын, бірақ отбасым мені түсінбеуі мүмкін. Осылайша көрпешені, қазақтың ұлттық киімін, кең даласы, жануарларын, киіз үйді және басқа да дүниелерді кітабымда иллюстрациялар арқылы көрсетуді жөн деп шештім. Ақылды қазақ қызын бас кейіпкер ретінде таңдадым. Бір қызығы, Гүлмира Қазақстан жерін бұлттың үстінде пойызбен саяхаттайды. Үш жыл кеткен жұмысым жарық көргеніне өте қуаныштымын.", "4. – Қазір немен айналысасыз?", "– Қазір отбасыма жақын жерде тұрып жатырмын. Көптеген мәдениетпен танысу сол мәдениеттен өзіңе ұнағанды алып, ұнамаған тұсынан атап өтуге мүмкіндік береді. Қазір айналамдағы америкалықтарға қарағанда пайдалы әрі дұрыс тамақтанамын. Есіктен кіргенде табалдырықты баспаймын. Қалай шай дайындауды білемін. Біреудің үйіне аяқ киімімді шешіп кіремін."]}, {"id": "l2v2-t6", "title": "", "source_note": "Abai.kz: «Тәмсіл» – https://abai.kz/post/39862", "numbered_paragraphs": false, "paragraphs": ["Ертеде бір топ шәкірті бар ғұлама өмір сүріпті. Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты. ___(15)___ бірде қырға шығып, көбелек ұстап алады да, оны алақанына жасырған қалпы ұстазының алдына келеді:", "– Ұстаз, айтыңызшы: менің қолымдағы тірі көбелек пе, өлі көбелек пе?", "Шәкірт ұстаз жауабына орай көбелекті өлтіріп не ұшырып жіберуге даяр еді. Өлі десе ұшырып, тірі десе бір сығып өлтіре салмақ. Әйтеуір, өз айтары ақиқат болып шықса болды...", "Шәкіртіне назар да салмаған Ұстаз сонда былай деп жауап беріпті:", "– Бәрі **сенің** қолыңда.", "Егер ақиқаттың ақиқат болмағы тек саған байланысты болса, бұл ақиқат емес."]}, {"id": "l2v2-t7", "title": "", "source_note": "Bilim-all.kz: Ыбырай Алтынсарин, «Өрмекші, құмырсқа, қарлығаш» – https://bilim-all.kz/article/1632", "numbered_paragraphs": false, "paragraphs": ["Атасы он жасар ұл баласымен далада келе жатып, баласынан сұрады:", "— Анау өрмекшіні көремісің, не істеп жүр?", "— Көремін, өрмек тоқып жүр.", "— Анау құмырсқаны көремісің?", "— Көремін, аузында бір нанның уалшығы бар, жүгіріп кетіп барады.", "— Жоғары қара, аспанда не көрінеді?", "— Жоғарыда қарлығаш ұшып жүр, аузында кесе тістеген шөбі бар.", "Сонда атасы айтты:", "— Олай болса, шырағым, ол кішкентай жәндіктер саған әбірет. Өрмекші маса, шыбынға тұзақ құрып жүр, ұстап алған соң, өзіне азық етуге. Құмырсқа бала-шағаларына тамақ аулап, бір нанның уалшығын тапқан соң өзі жемей, аузына тістеп, қуанғаннан, үйіне жүгіріп қайтып барады. Қарлығаш балапандарына ұя істеуге шөп жиып жүр. Жұмыссыз жүрген бір жан жоқ. Сені де Құдай-Тағала бос жүруге жаратпаған, ___(17)___, — деді.", "Әбірет — өнеге, үлгі."]}, {"id": "l2v2-t8", "title": "", "source_note": "Bilim-all.kz: «Жарқанат» – https://bilim-all.kz/article/15929", "numbered_paragraphs": false, "paragraphs": ["Жарқанаттардың есту мүшесі жақсы жетілген. Жарқанат ұя салмайды, үңгірлерді, ағаш қуыстарын, үй, құрылыс шатырларын, жарқабақтардағы құс індерін мекендейді. Күндіз жеке не топтанып, бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады. Кешкі ымыртта және түнде жемтігін қалықтап ұшып жүріп аулайды. Қазан-қараша айларында қысқы ұйқыға кетеді. Наурыз, сәуір айларында оянады.", "Жарқанаттар өсімдіктерге зиянды әр түрлі жәндіктермен қоректеніп, ауыл шаруашылығы және орман шаруашылықтарына пайда да келтіреді. Сондай-ақ, түрлі аурулар (әсіресе, құтыру) таратып, адамға, жануарларға залалын да тигізеді."]}, {"id": "l2v2-t9", "title": "", "source_note": "Bilim-all.kz: «Қожанасыр әңгімелері» – https://bilim-all.kz/quote/785", "numbered_paragraphs": false, "paragraphs": ["Баяғыда біреу той жасапты, тойға көп кісі жиналыпты, Қожа да келіпті. Қожанасырдың үстіндегі киімі жаман екен. Қожанасырды ешкім елемепті. «Төрге шық, тамақ іш», – демепті. Қожа үйден шығып кетеді де үйіне барып, тәуір киімдерін киіп, қайта келеді. Бұл жолы үй иесі Қожанасырды құрметтейді, төрден орын береді, ет келгенде:", "– Қожеке, алыңыз, алыңыз! – деп, қошеметтейді. Қожа етті жемей, табаққа шапанының жеңін малып:", "– Же, шапаным, же! – деп, отыра береді.", "Үй иесі:", "– Сіздің бұл не қылғаныңыз? Шапан ет жейтін бе еді? – дейді.", "Сонда Қожа:", "– Сен кісіні сыйламайды екенсің, киімді сыйлайды екенсің. Сондықтан шапаныма жегізіп отырғаным! – деп, жауап береді."]}], "items": [{"id": "l2v2-q1", "number": 1, "text_id": "l2v2-t1", "stem": "Мәтіндегі роботтың ерекшелігі неде?", "options": {"A": "ұлттық киімдерді өзі тігіп киюінде", "B": "оқушыларға информатикадан сабақ беруінде", "C": "қымыз туралы айтып, оны құюында", "D": "адамдарға пластикалық карта жасауында"}, "key": "C", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Содан кейін робот қымыздың шипалы қасиеті туралы қысқаша мағлұмат береді әрі ыдысқа пайдалы сусын құяды."], "explanation": "Робот Асылбек қымыздың шипалы қасиеті туралы қысқаша айтып береді және ыдысқа қымыз құяды. «Мағлұмат беру» – мәлімет, ақпарат беру деген сөз.", "explanation_ru": "Робот Асылбек коротко рассказывает о целебных свойствах кумыса и наливает его в посуду. «Мағлұмат беру» значит «давать сведения, информацию».", "distractor_notes": {"A": "робот ұлттық киім тікпейді, оның өзі ұлттық киім киген.", "B": "мәтінде роботтың сабақ бергені айтылмайды. Мәтінде мұғалім оқушыға роботты жасауға көмектескені айтылады.", "D": "пластикалық картаны робот жасамайды, адам оны роботқа жақындатады. Сонда ғана робот сөйлей бастайды."}, "distractor_notes_ru": {"A": "Робот не шьёт национальную одежду — он сам одет в неё.", "B": "В тексте не сказано, что робот проводит уроки. Там сказано, что учитель помог ученику сделать робота.", "D": "Пластиковую карту не делает робот — человек подносит её к роботу, и тогда робот начинает говорить."}, "distractor_evidence": {"A": ["Ұлттық сусынымызды насихаттайтын болғандықтан, Асылбектің ұлттық киімде болғаны дұрыс деп шештік, – дейді Жансұлтан."], "B": ["Оқушыға роботты жасап шығуға информатика пәнінің мұғалімі көмектескен."], "D": ["Кез келген адам роботқа арнайы пластикалық картаны жақындату арқылы Асылбекті сөйлете алады."]}, "keywords": {"ok": {"kk": ["қымыздың шипалы қасиеті туралы", "ыдысқа пайдалы сусын құяды"], "ru": ["о целебных свойствах кумыса", "наливает в посуду полезный напиток"]}, "A": {"kk": ["ұлттық киімде болғаны"], "ru": ["был в национальной одежде"]}, "B": {"kk": ["информатика пәнінің мұғалімі көмектескен"], "ru": ["помог учитель информатики"]}, "D": {"kk": ["пластикалық картаны жақындату арқылы"], "ru": ["поднеся пластиковую карту"]}}, "editor_changes": ""}, {"id": "l2v2-q2", "number": 2, "text_id": "l2v2-t2", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Құрылғы адамның даусын басқа біреудің даусына ұқсатып шығарады.\n2. Құрылғыны пайдалану үшін адамның бұрын жазылған дауысы қажет.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Құрылғы мойындағы өте әлсіз вибрацияларды анықтап, оларды адамның өз дауысына мейлінше ұқсас сөйлеуге айналдырады.", "Пайдалану жолы қарапайым: қолданушы даусынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді, кейін құрылғыны мойнына тағады — жүйе сол сәтте-ақ оның өз даусын синтездеп бере бастайды."], "explanation": "Тек екінші тұжырым дұрыс: адам дауысынан айырылмай тұрған кезде жазылған аудиофайлды қосымшаға жүктейді. Ал бірінші тұжырым қате: құрылғы басқа біреудің емес, адамның өз дауысына ұқсас сөйлейді.", "explanation_ru": "Верно только второе утверждение: человек загружает в приложение аудиофайл, записанный, пока он ещё не потерял голос. А первое неверно: устройство говорит голосом, похожим не на чужой, а на собственный голос человека.", "distractor_notes": {"A": "бірінші тұжырымды мәтінмен тағы салыстыр: құрылғы кімнің дауысына ұқсас сөйлейтінін қайта оқы.", "C": "екі тұжырымның біреуі ғана мәтінге сай. Құрылғы кімнің дауысына ұқсас сөйлейтінін мәтіннің басынан қайта оқы.", "D": "тұжырымдардың біреуі мәтінде бар. Құрылғыны қалай пайдаланатыны туралы азатжолды қайта оқы."}, "distractor_notes_ru": {"A": "Ещё раз сравни первое утверждение с текстом: перечитай, на чей голос похожа речь устройства.", "C": "С текстом совпадает только одно утверждение. Перечитай в начале текста, на чей голос похожа речь устройства.", "D": "Одно из утверждений есть в тексте. Перечитай абзац о том, как пользоваться устройством."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["адамның өз дауысына", "даусынан айырылмай тұрған кезде жазылған аудиофайлды"], "ru": ["на собственный голос человека", "записанный, пока пользователь ещё не потерял голос"]}}, "editor_changes": ""}, {"id": "l2v2-q3", "number": 3, "text_id": "l2v2-t3", "stem": "Мәтін не туралы?\n... дельфиндер туралы", "options": {"A": "адамды қорғаған", "B": "адамнан қашып кеткен", "C": "жағаға шығып қалған", "D": "теңізде жоғалып кеткен"}, "key": "A", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ашық теңіздегі адамды байқаған дельфиндер оған көмекке келіп, айналасында топтасып жүзе бастаған.", "Оның сөзінше, дельфиндер осылайша ер адамды қорғауға тырысқан."], "explanation": "Мәтіннің басты оқиғасы – дельфиндердің теңізде қалған адамға көмекке келіп, оның айналасында жүзіп, оны қорғауы. Сондықтан мәтін адамды қорғаған дельфиндер туралы.", "explanation_ru": "Главное событие текста — дельфины пришли на помощь человеку в море, плавали вокруг него и защищали его. Поэтому текст о дельфинах, которые защищали человека.", "distractor_notes": {"B": "дельфиндер адамнан қашпаған, керісінше, оның қасында қалған.", "C": "мәтінде дельфиндердің жағаға шыққаны айтылмайды. Оларды құтқарушылар теңізде көрген.", "D": "мәтінде дельфиндер емес, ер адам жоғалған. Құтқарушылар соны іздеген."}, "distractor_notes_ru": {"B": "Дельфины не уплыли от человека — наоборот, они оставались рядом с ним.", "C": "В тексте не сказано, что дельфины вышли на берег. Спасатели увидели их в море.", "D": "В тексте пропали не дельфины, а мужчина — его и искали спасатели."}, "distractor_evidence": {"B": ["Құтқару кемесінің капитаны О'Коннеллдің сөзінше, теңіз жануарлары ирландиялық азаматтың айналасында топтасып жүзіп жүрген."], "C": ["Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "D": ["Құтқарушылар қайықпен және тікұшақпен жоғалған адамды іздеуге кіріскен."]}, "keywords": {"ok": {"kk": ["оған көмекке келіп", "ер адамды қорғауға тырысқан"], "ru": ["пришли ему на помощь", "пытались защитить мужчину"]}, "B": {"kk": ["айналасында топтасып жүзіп жүрген"], "ru": ["плавали группой вокруг"]}, "C": {"kk": ["бір топ дельфиннің жүзіп жүргенін"], "ru": ["группу плавающих дельфинов"]}, "D": {"kk": ["жоғалған адамды іздеуге"], "ru": ["искать пропавшего человека"]}}, "editor_changes": ""}, {"id": "l2v2-q4", "number": 4, "text_id": "l2v2-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Ер адам теңізде кішкентай қайықпен жүзіп жүрген.", "B": "Дельфиндер ер адамды табуға көмектесті.", "C": "Құтқарушылар ер адамды бір сағатта тапты.", "D": "Дельфиндер ер адамды жағаға дейін жеткізді."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Сонымен қатар, құтқарушылар дельфиндер болмағанда, ер адамды дер кезінде тауып, құтқарып қалу екіталай еді деген пікірде.", "Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "explanation": "Құтқарушылар алдымен бір топ дельфинді байқаған, адам солардың ортасында болған. Олардың ойынша, дельфиндер болмағанда, адамды дер кезінде табу екіталай еді. «Екіталай» – болуы күмәнді, қиын деген сөз.", "explanation_ru": "Спасатели сначала заметили группу дельфинов, а человек был среди них. По их мнению, без дельфинов найти его вовремя вряд ли удалось бы. «Екіталай» значит «сомнительно, вряд ли».", "distractor_notes": {"A": "ер адам қайықпен емес, жалғыз өзі жүзіп өтпек болған. Қайықпен оны құтқарушылар іздеген.", "C": "құтқарушылар ер адамды бір сағатта емес, 12 сағаттан кейін тапты.", "D": "мәтінде дельфиндердің адамды жағаға жеткізгені айтылмайды. Оны судан құтқарушылар шығарды."}, "distractor_notes_ru": {"A": "Мужчина был не на лодке — он хотел проплыть расстояние сам. На лодке его искали спасатели.", "C": "Спасатели нашли мужчину не за час, а через 12 часов.", "D": "В тексте не сказано, что дельфины доставили человека к берегу. Из воды его вытащили спасатели."}, "distractor_evidence": {"A": ["Белгілі болғандай, ер адам 8 шақырым қашықтықты жалғыз өзі жүзіп өтпек болған."], "C": ["Нәтижесінде 12 сағаттан кейін теңізден төрт шақырым жерде құтқарушылар бір топ дельфиннің жүзіп жүргенін байқайды."], "D": ["Құтқарушылар ер адамды судан шығарып, оған алғашқы көмек көрсеткен."]}, "keywords": {"ok": {"kk": ["дельфиндер болмағанда", "дер кезінде тауып", "бір топ дельфиннің жүзіп жүргенін байқайды"], "ru": ["если бы не дельфины", "вовремя найти", "заметили группу плавающих дельфинов"]}, "A": {"kk": ["жалғыз өзі жүзіп өтпек болған"], "ru": ["в одиночку проплыть"]}, "C": {"kk": ["12 сағаттан кейін"], "ru": ["через 12 часов"]}, "D": {"kk": ["Құтқарушылар ер адамды судан шығарып"], "ru": ["Спасатели вытащили мужчину из воды"]}}, "editor_changes": ""}, {"id": "l2v2-q5", "number": 5, "text_id": "l2v2-t4", "stem": "Қай абзацта бір сөздің тағы бір мағынасы түсіндіріледі?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "D", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Шаңырақ «үй, отбасы» деген мағынаны да білдіреді. (4-азатжол)"], "explanation": "4-азатжолда «шаңырақ» сөзі киіз үйдің бөлігін ғана емес, «үй, отбасы» деген мағынаны да білдіретіні айтылады.", "explanation_ru": "В 4-м абзаце сказано, что слово «шаңырақ» означает не только часть юрты, но и «дом, семья».", "distractor_notes": {"A": "1-азатжолда киіз үй қандай ағаштан жасалатыны айтылады, сөздің мағынасы түсіндірілмейді.", "B": "2-азатжолда «қанат» сөзі кездеседі, бірақ ол дайын кереге деп аталады, сөздің екінші мағынасы туралы айтылмайды.", "C": "3-азатжолда уықтың қандай бөлік екені айтылады, сөздің басқа мағынасы түсіндірілмейді."}, "distractor_notes_ru": {"A": "В 1-м абзаце говорится, из какого дерева делают юрту, — значение слова там не объясняется.", "B": "Во 2-м абзаце есть слово «қанат», но так просто называют готовую решётку — о втором значении слова там не говорится.", "C": "В 3-м абзаце говорится, что такое уық как часть юрты, — другое значение слова не объясняется."}, "distractor_evidence": {"A": ["Киіз үй берік ағаштан (қайыңнан, талдан) жасалады."], "B": ["Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады."], "C": ["Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі."]}, "keywords": {"ok": {"kk": ["«үй, отбасы» деген мағынаны да"], "ru": ["также значение «дом, семья»"]}, "A": {"kk": ["берік ағаштан"], "ru": ["из прочного дерева"]}, "B": {"kk": ["Дайын керегені қанат деп атайды"], "ru": ["Готовую решётку называют «қанат»"]}, "C": {"kk": ["кереге мен шаңырақ ортасын қосатын"], "ru": ["соединяющих решётку и шанырак"]}}, "editor_changes": ""}, {"id": "l2v2-q6", "number": 6, "text_id": "l2v2-t4", "stem": "Қай ақпарат мәтін мазмұнына сай келеді?", "options": {"A": "Киіз үй құрт түсіп, тез шіритін ағаштан жасалады.", "B": "Әр киіз үйде, көлеміне қарамастан, 18 уық болады.", "C": "Киіз үйдегі кереге саны қанат санымен бірдей.", "D": "Ши киіз үйге жылу бермейді, оны тек әсемдік үшін ұстайды."}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Дайын керегені қанат деп атайды, яғни 18 қанат үйде 18 кереге болады. (2-азатжол)"], "explanation": "Мәтінде дайын кереге «қанат» деп аталатыны айтылады: 18 қанат үйде 18 кереге бар. Демек, кереге саны мен қанат саны бірдей.", "explanation_ru": "В тексте сказано, что готовую решётку называют «қанат»: в юрте на 18 «крыльев» — 18 решёток. Значит, число решёток и число «крыльев» одинаково.", "distractor_notes": {"A": "мәтінде керісінше айтылған: киіз үйдің ағашы тез шірімейді.", "B": "18 саны уыққа емес, керегеге қатысты. Уықтың саны үйдің көлеміне қарай әртүрлі.", "D": "ши тек әсемдік үшін емес: ол үйді жылытады және жәндіктерді кіргізбейді."}, "distractor_notes_ru": {"A": "В тексте сказано наоборот: дерево юрты быстро не гниёт.", "B": "Число 18 относится не к жердям, а к решёткам. Число жердей зависит от размера юрты.", "D": "Чий нужен не только для красоты: он утепляет дом и не пускает насекомых."}, "distractor_evidence": {"A": ["Оларға құрт түспейді, басқа ағаштар сияқты тез шірімейді."], "B": ["Әр үйде көлеміне қарай 60-160-тай уық болады."], "D": ["Оның әсемдікке әрі жылылыққа әсері мол.", "Сондай-ақ ши тұрғанда сырттан құрт-құмырсқа, кесіртке, жылан тағы басқа жәндіктер кіре алмайды."]}, "keywords": {"ok": {"kk": ["Дайын керегені қанат деп атайды", "18 қанат үйде 18 кереге"], "ru": ["Готовую решётку называют «қанат»", "18 решёток"]}, "A": {"kk": ["тез шірімейді"], "ru": ["не гниют быстро"]}, "B": {"kk": ["60-160-тай уық"], "ru": ["60–160 жердей"]}, "D": {"kk": ["жылылыққа", "жәндіктер кіре алмайды"], "ru": ["тепло", "не могут проникнуть насекомые"]}}, "editor_changes": ""}, {"id": "l2v2-q7", "number": 7, "text_id": "l2v2-t4", "stem": "Мәтінге қандай тақырып сәйкес келеді?", "options": {"A": "Қазақтың ізгі тілектері", "B": "Киіз үйдің бөліктері", "C": "Киіз үйдің түрлері мен атаулары", "D": "Ағаш шеберлерінің өнері"}, "key": "B", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Кереге киіз үйдің негізін құрайды. (2-азатжол)", "Уық – кереге мен шаңырақ ортасын қосатын негізгі бөліктің бірі. (3-азатжол)", "Шаңырақ – киіз үйдің қасиетті, киелі мүлкі. (4-азатжол)", "Киіз үйдің бір бөлшегі – кәдімгі ши. (5-азатжол)"], "explanation": "Мәтіннің әр азатжолы киіз үйдің бір бөлігі туралы: кереге, уық, шаңырақ, ши. Сондықтан тақырып – «Киіз үйдің бөліктері».", "explanation_ru": "Каждый абзац текста рассказывает об одной части юрты: решётке, жердях, шаныраке, чие. Поэтому подходит заголовок «Части юрты».", "distractor_notes": {"A": "мәтінде «Керегең кең болсын», «Шаңырағың биік болсын» деген тілектер бар, бірақ олар кереге мен шаңырақ туралы айтқанда ғана келтірілген.", "C": "мәтінде киіз үйдің түрлері салыстырылмайды, бір киіз үйдің құрылысы сипатталады.", "D": "мәтінде киіз үйді жасайтын шеберлер туралы айтылмайды."}, "distractor_notes_ru": {"A": "В тексте есть пожелания «Керегең кең болсын», «Шаңырағың биік болсын», но они приведены только в рассказе о решётке и шаныраке.", "C": "В тексте не сравниваются виды юрт — описывается устройство одной юрты.", "D": "В тексте ничего не сказано о мастерах, которые делают юрту."}, "distractor_evidence": {"A": ["«Керегең кең болсын» деген тілек осыдан шыққан.", "«Шаңырағың биік болсын» деген тілек бар."], "C": [], "D": []}, "keywords": {"ok": {"kk": ["Кереге", "Уық", "Шаңырақ", "бөлшегі – кәдімгі ши"], "ru": ["Решётка", "Уық", "Шанырак", "часть юрты — обычный чий"]}, "A": {"kk": ["тілек"], "ru": ["пожелание"]}}, "editor_changes": ""}, {"id": "l2v2-q8", "number": 8, "text_id": "l2v2-t5", "stem": "Қай бөлімде Эшлидің қазақ салт-дәстүрін ұстанатыны айтылады?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "D", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Есіктен кіргенде табалдырықты баспаймын. (4-бөлім)", "Біреудің үйіне аяқ киімімді шешіп кіремін. (4-бөлім)"], "explanation": "4-бөлімде Эшли табалдырықты баспайтынын, шай дайындай алатынын, біреудің үйіне аяқ киімін шешіп кіретінін айтады. Бұл – қазақ дәстүрлері.", "explanation_ru": "В 4-й части Эшли рассказывает, что не наступает на порог, умеет готовить чай и разувается, входя в чужой дом. Это казахские традиции.", "distractor_notes": {"A": "1-бөлімде Эшли кітап жазу идеясы қалай пайда болғанын айтады.", "B": "2-бөлімде Эшли қандай тілдерді білетіні туралы айтады.", "C": "3-бөлімде Эшли кітабында қазақ мәдениетін суретпен көрсеткенін айтады, бірақ өзінің дәстүр ұстанатыны туралы айтпайды."}, "distractor_notes_ru": {"A": "В 1-й части Эшли рассказывает, как появилась идея написать книгу.", "B": "Во 2-й части Эшли говорит о том, какие языки она знает.", "C": "В 3-й части Эшли говорит, что показала казахскую культуру в иллюстрациях книги, но не о том, что сама соблюдает традиции."}, "distractor_evidence": {"A": ["Осылайша балаларға арналған алғашқы кітабымды жазуды қолға алдым."], "B": ["– Қазақша көп сөз білмеймін."], "C": ["Осылайша көрпешені, қазақтың ұлттық киімін, кең даласы, жануарларын, киіз үйді және басқа да дүниелерді кітабымда иллюстрациялар арқылы көрсетуді жөн деп шештім."]}, "keywords": {"ok": {"kk": ["табалдырықты баспаймын", "аяқ киімімді шешіп кіремін"], "ru": ["не наступаю на порог", "сняв обувь"]}, "A": {"kk": ["алғашқы кітабымды жазуды"], "ru": ["писать свою первую книгу"]}, "B": {"kk": ["Қазақша көп сөз білмеймін"], "ru": ["Я знаю немного казахских слов"]}, "C": {"kk": ["кітабымда иллюстрациялар арқылы"], "ru": ["в иллюстрациях своей книги"]}}, "editor_changes": ""}, {"id": "l2v2-q9", "number": 9, "text_id": "l2v2-t5", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Эшлидің кітабы үш жылда жазылды.\n2. Эшли қазақ тілінде еркін сөйлейді.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "A", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Үш жыл кеткен жұмысым жарық көргеніне өте қуаныштымын. (3-бөлім)", "– Қазақша көп сөз білмеймін. (2-бөлім)"], "explanation": "Тек бірінші тұжырым дұрыс: Эшли кітабына үш жыл кеткенін айтады. Ал екінші тұжырым қате: ол қазақша көп сөз білмейді.", "explanation_ru": "Верно только первое утверждение: Эшли говорит, что на книгу ушло три года. А второе неверно: казахских слов она знает немного.", "distractor_notes": {"B": "екінші тұжырымды мәтінмен тағы салыстыр: Эшли қазақ тілін қаншалықты білетінін 2-бөлімнен қайта оқы.", "C": "екі тұжырымның біреуі ғана мәтінге сай. Эшлидің қазақ тілін қаншалықты білетінін 2-бөлімнен қайта оқы.", "D": "тұжырымдардың біреуі мәтінде бар. Кітаптың қанша уақытта жазылғанын 3-бөлімнен ізде."}, "distractor_notes_ru": {"B": "Ещё раз сравни второе утверждение с текстом: перечитай во 2-й части, насколько прос 1-й части."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["кітап жазу идеясы", "Қазақша білесіз бе", "қандай кітап", "Қазір немен айналысасыз"], "ru": ["идея написать книгу", "Вы знаете казахский", "Что это за книга", "Чем вы сейчас занимаетесь"]}}, "editor_changes": ""}, {"id": "l2v2-q11", "number": 11, "text_id": "l2v2-t5", "stem": "Эшлидің ойынша, көп мәдениетпен танысудың пайдасы неде?", "options": {"A": "Басқа елде ұзақ тұрып, жақсы жұмыс табуға мүмкіндік береді.", "B": "Өзіңе ұнаған дәстүрді өміріңе енгізуге мүмкіндік береді.", "C": "Туған жеріңді ұмытып, жаңа елде қалуға мүмкіндік береді.", "D": "Шет тілін тез әрі ешбір қиындықсыз үйренуге мүмкіндік береді."}, "key": "B", "skill": "C3", "skill_name": "Түйін, кеңес, тағылым", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Көптеген мәдениетпен танысу сол мәдениеттен өзіңе ұнағанды алып, ұнамаған тұсынан атап өтуге мүмкіндік береді. (4-бөлім)"], "explanation": "Эшлидің пікірінше, басқа мәдениетпен танысқанда, одан өзіңе ұнағанды алуға болады. Оның өзі де қазақтардың бірнеше әдетін үйреніп, күнде ұстанады.", "explanation_ru": "По мнению Эшли, знакомясь с другой культурой, можно взять из неё то, что тебе нравится. Она и сама переняла несколько казахских привычек и соблюдает их.", "distractor_notes": {"A": "Эшли мәдениетпен танысуды жұмыс табумен байланыстырмайды.", "C": "Эшли туған жерін ұмытпаған: ол қазір отбасына жақын жерде тұрады.", "D": "Эшли Қазақстанда ұзақ тұрса да, қазақ тілін көп білмейді. Демек, ол мәдениетпен танысу тілді тез үйретеді деп айтпайды."}, "distractor_notes_ru": {"A": "Эшли не связывает знакомство с культурой с поиском работы.", "C": "Эшли не забыла родину: сейчас она живёт рядом со своей семьёй.", "D": "Хотя Эшли долго жила в Казахстане, казахский она знает мало. Значит, она не говорит, что знакомство с культурой быстро учит языку."}, "distractor_evidence": {"A": [], "C": ["– Қазір отбасыма жақын жерде тұрып жатырмын."], "D": ["– Қазақша көп сөз білмеймін."]}, "keywords": {"ok": {"kk": ["өзіңе ұнағанды алып"], "ru": ["взять то, что тебе нравится"]}, "C": {"kk": ["отбасыма жақын жерде"], "ru": ["рядом со своей семьёй"]}, "D": {"kk": ["Қазақша көп сөз білмеймін"], "ru": ["Я знаю немного казахских слов"]}}, "editor_changes": ""}, {"id": "l2v2-q12", "number": 12, "text_id": "l2v2-t5", "stem": "Мәтін қандай үлгіде жазылған?", "options": {"A": "күнделік", "B": "сұхбат", "C": "мақала", "D": "әңгіме"}, "key": "B", "skill": "D1", "skill_name": "Мәтін үлгісі мен жанры", "level": 2, "negative": false, "fixed_order": false, "evidence": ["– Қазақша білесіз бе?", "– Қазір немен айналысасыз?"], "explanation": "Мәтін сұрақ пен жауаптан тұрады: тілші сұрақ қояды, Эшли Ланина жауап береді. Мұндай үлгі сұхбат деп аталады.", "explanation_ru": "Текст состоит из вопросов и ответов: журналист спрашивает, Эшли Ланина отвечает. Такой жанр называется интервью (сұхбат).", "distractor_notes": {"A": "күнделікті адам өзі үшін жазады, онда сұрақ қойып, жауап беретін екі адам болмайды.", "C": "мақалада автор өз ойын біртұтас мәтінмен баяндайды. Бұл мәтін сұрақ пен жауаптан құралған.", "D": "әңгімеде оқиға баяндалады. Ал бұл мәтінде тілші сұрақ қойып, Эшли жауап береді."}, "distractor_notes_ru": {"A": "Дневник человек пишет для себя — в нём нет двух людей, один из которых спрашивает, а другой отвечает.", "C": "В статье автор излагает мысли сплошным текстом, а этот текст состоит из вопросов и ответов.", "D": "В рассказе повествуется о событиях, а в этом тексте журналист задаёт вопросы, а Эшли отвечает."}, "distractor_evidence": {"A": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["білесіз бе?", "айналысасыз?"], "ru": ["знаете", "занимаетесь"]}}, "editor_changes": ""}, {"id": "l2v2-q13", "number": 13, "text_id": "l2v2-t6", "stem": "Шәкірт нені армандады?", "options": {"A": "ұстазынан озып, елге танымал ғұлама болуды", "B": "күнде қырға шығып, әдемі көбелек аулауды", "C": "ұстазына есте қалатын жақсы сыйлық жасауды", "D": "ұстазы жауап бере алмайтын сұрақ қоюды"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."], "explanation": "Шәкірт ұстазы жауап бере алмайтын сауал тауып қоюды армандаған. «Сауал» – сұрақ деген сөз.", "explanation_ru": "Ученик мечтал найти вопрос, на который учитель не сможет ответить. «Сауал» значит «вопрос».", "distractor_notes": {"A": "мәтінде шәкірттің ғұлама болуды армандағаны айтылмайды. «Ғұлама» деп мәтінде ұстазды атайды.", "B": "шәкірт көбелекті армандағаны үшін емес, ұстазына сұрақ қою үшін ұстады.", "C": "шәкірт көбелекті ұстазына сыйлық ретінде әкелмеді, оны алақанына жасырып, сұрақ қойды."}, "distractor_notes_ru": {"A": "В тексте не сказано, что ученик мечтал стать учёным. «Ғұлама» в тексте называют учителя.", "B": "Ученик поймал бабочку не потому, что мечтал о ней, а чтобы задать вопрос учителю.", "C": "Ученик принёс бабочку не в подарок: он спрятал её в ладони и задал вопрос."}, "distractor_evidence": {"A": ["Ертеде бір топ шәкірті бар ғұлама өмір сүріпті."], "B": [], "C": ["– Ұстаз, айтыңызшы: менің қолымдағы тірі көбелек пе, өлі көбелек пе?"]}, "keywords": {"ok": {"kk": ["ұстазы жауап бере алмайтын сауал", "армандапты"], "ru": ["вопрос, на который учитель не сможет ответить", "мечтал"]}, "A": {"kk": ["ғұлама"], "ru": ["мудрец"]}, "C": {"kk": ["тірі көбелек пе, өлі көбелек пе"], "ru": ["живая бабочка или мёртвая"]}}, "editor_changes": ""}, {"id": "l2v2-q14", "number": 14, "text_id": "l2v2-t6", "stem": "«Бәрі сенің қолыңда.»\nОсы сөйлемде ұстаз кімді атап тұр?", "options": {"A": "шәкіртті", "B": "көбелекті", "C": "ұстаздың өзін", "D": "басқа шәкірттерді"}, "key": "A", "skill": "B1", "skill_name": "Сілтемені анықтау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Шәкірт ұстаз жауабына орай көбелекті өлтіріп не ұшырып жіберуге даяр еді.", "– Бәрі сенің қолыңда."], "explanation": "Ұстаз сұрақ қойған шәкіртке жауап беріп тұр. Көбелектің тірі не өлі болуы тек шәкіртке байланысты еді: ол көбелекті ұшырып та, өлтіріп те жібере алатын. Көбелек шынында да шәкірттің қолында тұр.", "explanation_ru": "Учитель отвечает ученику, который задал вопрос. Будет бабочка живой или мёртвой, зависело только от ученика: он мог и отпустить её, и убить. Бабочка и правда у ученика в руке.", "distractor_notes": {"B": "ұстаз көбелекпен сөйлесіп тұрған жоқ. Ол сұрақ қойған адамға жауап береді.", "C": "«сенің» – екінші жақ, яғни сөйлеуші емес, тыңдаушы. Ұстаз өзі туралы айтса, «менің» дер еді.", "D": "«сенің» – бір адамға айтылған сөз. Ұстаз сұрақты бір шәкірттен ғана естіді."}, "distractor_notes_ru": {"B": "Учитель не разговаривает с бабочкой — он отвечает тому, кто задал вопрос.", "C": "«Сенің» (твой) — второе лицо, то есть слушатель, а не говорящий. О себе учитель сказал бы «менің» (мой).", "D": "«Сенің» (твой) обращено к одному человеку. Учитель услышал вопрос только от одного ученика."}, "distractor_evidence": {"B": [], "C": [], "D": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."]}, "keywords": {"ok": {"kk": ["Шәкірт", "өлтіріп не ұшырып жіберуге даяр", "сенің қолыңда"], "ru": ["Ученик", "был готов убить или отпустить", "в твоих руках"]}, "D": {"kk": ["шәкірттерінің бірі"], "ru": ["из его учеников"]}}, "editor_changes": ""}, {"id": "l2v2-q15", "number": 15, "text_id": "l2v2-t6", "stem": "Бос орынға қай сөз қойылады?", "options": {"A": "Сол үшін", "B": "Сонда да", "C": "Керісінше", "D": "Сондай-ақ"}, "key": "A", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 3, "negative": false, "fixed_order": false, "evidence": ["Өмір бәсекесіз бола ма, осы шәкірттерінің бірі ұстазы жауап бере алмайтын сауал тауып қоюды армандапты."], "explanation": "Шәкірт ұстазына қиын сұрақ қоюды армандады, сондықтан көбелек ұстап келді. Екінші сөйлем біріншісінің мақсатын, нәтижесін айтады. Оны «сол үшін» байланыстырады.", "explanation_ru": "Ученик мечтал задать учителю трудный вопрос, поэтому поймал бабочку. Второе предложение говорит о цели и следствии первого — его связывает «сол үшін» (для этого, поэтому).", "distractor_notes": {"B": "«сонда да» – «соған қарамастан» деген мағынада, қарама-қарсы ойды байланыстырады. Ал мұнда шәкірт арманын орындау үшін әрекет етеді, қарсылық жоқ.", "C": "«керісінше» алдыңғы ойға қарсы әрекетті білдіреді. Шәкірт армандағанына қарсы емес, сол арманы үшін әрекет етті.", "D": "«сондай-ақ» жаңа, қосымша ақпаратты қосады. Ал мұнда екінші сөйлем жаңа ақпарат емес, шәкірттің арманына жету үшін не істегенін айтады."}, "distractor_notes_ru": {"B": "«Сонда да» (и всё же, несмотря на это) связывает противоположные мысли. А здесь ученик действует, чтобы исполнить мечту, — противопоставления нет.", "C": "«Керісінше» (наоборот) означает действие вопреки сказанному. Ученик действовал не вопреки мечте, а ради неё.", "D": "«Сондай-ақ» (а также) добавляет новую информацию. А здесь второе предложение рассказывает, что ученик сделал ради своей мечты."}, "distractor_evidence": {"B": [], "C": [], "D": []}, "keywords": {"ok": {"kk": ["сауал тауып қоюды армандапты"], "ru": ["мечтал найти вопрос"]}}, "editor_changes": ""}, {"id": "l2v2-q16", "number": 16, "text_id": "l2v2-t7", "stem": "Мәтіндегі оқиғалардың реті қандай?\n1. Нан тасыған құмырсқа\n2. Атасының ақылы\n3. Өрмек тоқыған өрмекші\n4. Шөп тасыған қарлығаш", "options": {"A": "1, 3, 4, 2", "B": "3, 1, 2, 4", "C": "3, 1, 4, 2", "D": "3, 4, 1, 2"}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "fixed_order": true, "evidence": ["— Көремін, өрмек тоқып жүр.", "— Көремін, аузында бір нанның уалшығы бар, жүгіріп кетіп барады.", "— Жоғарыда қарлығаш ұшып жүр, аузында кесе тістеген шөбі бар.", "Жұмыссыз жүрген бір жан жоқ."], "explanation": "Алдымен бала өрмек тоқыған өрмекшіні көреді (3), сосын нан тасыған құмырсқаны (1), кей nation_ru": "Дед показывает, что паук, муравей и ласточка — все трудятся, и говорит: «Нет ни одного существа без дела». После слов «и ты создан не для безделья» должен следовать призыв к труду.", "distractor_notes": {"A": "бала атасының сұрақтарына жауап береді, атасы оны сұрақ қоюға шақырмайды. Атасы жәндіктердің не істеп жүргеніне назар аударады.", "B": "атасы жәндіктерге қамқор бол демейді, оларды үлгі етіп көрсетеді.", "C": "атасы мен бала далада келе жатыр, бірақ атасы серуендеуге шақырмайды. Ол «бос жүру» туралы не дейтінін қайта оқы."}, "distractor_notes_ru": {"A": "Мальчик отвечает на вопросы деда, а дед не призывает его задавать вопросы. Дед обращает внимание на то, чем заняты насекомые.", "B": "Дед не призывает заботиться о насекомых — он ставит их в пример.", "C": "Дед и мальчик идут по степи, но дед не зовёт гулять. Перечитай, что он говорит о «бос жүру» (безделье)."}, "distractor_evidence": {"A": [], "B": ["— Олай болса, шырағым, ол кішкентай жәндіктер саған әбірет."], "C": ["Атасы он жасар ұл баласымен далада келе жатып, баласынан сұрады:"]}, "keywords": {"ok": {"kk": ["Жұмыссыз жүрген бір жан жоқ", "бос жүруге жаратпаған"], "ru": ["Нет ни одного существа без дела", "не для того, чтобы бездельничать"]}, "B": {"kk": ["саған әбірет"], "ru": ["тебе пример"]}, "C": {"kk": ["далада келе жатып"], "ru": ["идя по степи"]}}, "editor_changes": ""}, {"id": "l2v2-q18", "number": 18, "text_id": "l2v2-t8", "stem": "Жарқанат күндіз қалай демалады?", "options": {"A": "басын төмен салбыратып", "B": "ұяда балаларымен бірге", "C": "ағаш басында ұшып жүріп", "D": "судың бетінде қалқып жүріп"}, "key": "A", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Күндіз жеке не топтанып, бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады."], "explanation": "Жарқанаттар күндіз бастарын төмен салбыратып, аяқтарымен тасқа, ағашқа, жарға жабысып демалады. «Салбырату» – төмен қарай асылып тұру function fullSentence(textId, frag){
  const tx=BANK.texts.find(x=>x.id===textId);
  for(const raw of tx.paragraphs){
    const p=raw.replace(/\*\*/g,""), i=p.indexOf(frag); if(i<0) continue;
    // Сөйлем шекарасы: тыныс белгісінен кейін бос орын тұрса ғана (sunnycomb.com сияқты сөздер бөлінбейді)
    let a=i; while(a>0 && !(p[a-1]===" " && /[.!?]/.test(p[a-2]||""))) a--;
    let b=i+frag.length;
    // Үзінді сөйлемнің соңымен аяқталса (нүкте, сұрау не леп белгісі), келесі сөйлемге өтпейміз
    const endsSentence = /[.!?…»]/.test(p[b-1]||"") && (b===p.length || p[b]===" ") && /[.!?]/.test(frag.replace(/[»"”\s]+$/,"").slice(-1));
    if(!endsSentence){ while(b<p.length && !(/[.!?]/.test(p[b]) && (b+1===p.length || p[b+1]===" "))) b++; if(b<p.length) b++; }
    return p.slice(a,b).trim();
  }
  return frag;
}

const userHl = tid => ((S.hl ||= {})[tid] ||= []);
function offsetIn(pEl, node, off){             // абзац мәтініндегі орын (нөмірді есептемей)
  const pt=pEl.querySelector(".pt"); if(!pt) return null;
  const r=document.createRange(); r.setStart(pt,0);
  if(!pt.contains(node)){ return (node.compareDocumentPosition(pt) & Node.DOCUMENT_POSITION_FOLLOWING) ? 0 : pt.textContent.length; }
  r.setEnd(node,off); return r.toString().length;
}
function selectionRanges(){
  const sel=getSelection(); if(!sel || sel.isCollapsed || !sel.rangeCount) return [];
  const rg=sel.getRangeAt(0), paper=document.getElementById("paper");
  if(!paper.contains(rg.commonAncestorContainer)) return [];
  const out=[];
  paper.querySelectorAll("p[data-pi]").forEach(pEl=>{
    if(!rg.intersectsNode(pEl)) return;
    const len=pEl.querySelector(".pt").textContent.length;
    const a = pEl.contains(rg.startContainer) ? offsetIn(pEl,rg.startContainer,rg.startOffset) : 0;
    const b = pEl.contains(rg.endContainer) ? offsetIn(pEl,rg.endContainer,rg.endOffset) : len;
    if(a!=null && b!=null && b>a) out.push({p:+pEl.dataset.pi, a:Math.max(0,a), b:Math.min(len,b)});
  });
  // Сөздің ортасынан басталса, тұтас сөзге дейін кеңейту
  for(const r of out){ const t=BANK.texts[S.text].paragraphs[r.p].replace(/\*\*/g,"");
    while(r.a>0 && /[\p{L}\p{N}]/u.test(t[r.a-1])) r.a--; while(r.b<t.length && /[\p{L}\p{N}]/u.test(t[r.b])) r.b++;
    while(r.a<r.b && /\s/.test(t[r.a])) r.a++; while(r.b>r.a && /\s/.test(t[r.b-1])) r.b--; }
  return out.filter(r=>r.b>r.a);
}
function addHl(ranges){
  const list=userHl(BANK.texts[S.text].id);
  for(const r of ranges){
    const same=list.filter(h=>h.p===r.p && h.a<=r.b && h.b>=r.a);
    const a=Math.min(r.a,...same.map(h=>h.a)), b=Math.max(r.b,...same.map(h=>h.b));
    for(const h of same) list.splice(list.indexOf(h),1);
    list.push({p:r.p,a,b});
  }
  save();
}
