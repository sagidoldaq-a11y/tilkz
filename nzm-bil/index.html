<meta name="claude:viewport-fit-sides" content="cover">
<script>(function(){try{var th=localStorage.getItem("tilkz-theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: оқулық беті сияқты — сол жақта мәтін (қағаз), оң жақта тапсырмалар; телефонда ауыстырғыш */
:root{
  --paper:#F4F6F9; --panel:#FFFFFF; --ink:#18212E; --muted:#596476; --line:#DCE1E8;
  --accent:#1D5BA6; --accent-soft:#E3ECF7; --mark:#F6D77A; --mark-ink:#18212E;
  --ok:#1C7A4E; --ok-soft:#E1F2E9; --bad:#B23A30; --bad-soft:#F8E4E2;
  --f-text:"PT Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --mark:#8C6B14; --mark-ink:#FFF6DA;
  --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --mark:#8C6B14; --mark-ink:#FFF6DA;
  --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
/* Мәтін теретін өрістерден басқа жерде жыпылықтаған курсор (каретка) көрінбейді */
body{caret-color:transparent}
input,textarea,select,[contenteditable="true"]{caret-color:auto}

body{font-family:var(--f-ui);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-text);font-size:22px;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:13px}
.brand b .ai{color:var(--accent);font-size:inherit;font-family:var(--f-ui);font-weight:700;letter-spacing:.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.themebtn{width:36px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:999px;display:grid;place-items:center;font-size:16px;line-height:1;padding:0}
.score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}

.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.texttabs{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px}
.texttabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;text-align:left;min-width:150px}
.texttabs button small{display:block;color:var(--muted);font-size:12px}
.texttabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.texttabs .done{color:var(--ok);font-size:12px;font-weight:600}

.mobswitch{display:none!important}
.backq{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:11px 20px}
.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:20px;padding-block:14px 40px;align-items:start}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.paper h2{font-family:var(--f-text);font-size:22px;margin:0 0 4px;text-wrap:balance}
.paper .meta{color:var(--muted);font-size:13px;margin-bottom:16px}
.paper p{font-family:var(--f-text);font-size:17.5px;line-height:1.72;margin:0 0 12px;text-indent:1.6em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.paper p .pn{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--accent);margin-right:6px;text-indent:0}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.paper strong{font-weight:700}
.paper .u{background:rgba(64,140,255,.22);box-shadow:inset 0 -2px 0 var(--accent);border-radius:2px;cursor:pointer}
.phead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.ptitle{min-width:0}
.mk{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.mk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.mktip{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:4px 0 12px;font-size:14px;position:relative}
.mktip::before{content:"";position:absolute;top:-7px;right:34px;width:12px;height:12px;background:var(--accent-soft);border-left:1px solid var(--accent);border-top:1px solid var(--accent);transform:rotate(45deg)}
.paper .mktip p{margin:0 0 6px;font-family:var(--f-ui);font-size:14px;line-height:1.5;text-align:left;text-indent:0;max-width:none} .paper .mktip .how{color:var(--muted);font-size:13px}
.mktip .btn{padding:5px 12px;font-size:13px}
.hltip{font-size:12.5px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hltip:empty{display:none}
.hltip .on{color:var(--accent);font-weight:600}
.paper.marking p{cursor:text;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.paper.marking .pt{cursor:crosshair}
.hlclear{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.hlbar{position:fixed;z-index:30;background:var(--ink);color:var(--panel);border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:3px}
.hlbar button{border:0;background:transparent;color:inherit;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px}
.hlbar button:hover{background:rgba(255,255,255,.12)}
mark.w{background:var(--bad-soft);box-shadow:inset 0 -2px 0 var(--bad)}
b.kw{font-weight:800}
.fb blockquote b.kw{color:var(--ink);font-weight:800}

.qs{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.is-ok{border-color:var(--ok)}
.card.is-bad{border-color:var(--bad)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.qnum{font-weight:700;font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent)}
.skillchip{border:0;cursor:pointer}
.skillchip:hover{text-decoration:underline}
.skillbox{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.skillbox p{margin:4px 0 0}
.skillbox .g{color:var(--muted)} .skillbox .g b{color:var(--ink)}
.legend{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.legend summary{font-family:var(--f-text);font-size:19px;font-weight:700;cursor:pointer}
.legend .lg{margin-top:14px}
.legend h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0}
.legend .sub{margin:4px 0 8px}
.legend dl{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
.legend dt{font-weight:600}
.legend dd{margin:0;color:var(--ink)}
@media (max-width:880px){.legend dl{grid-template-columns:minmax(0,1fr)} .legend dd{margin-bottom:6px;color:var(--muted)}}
.chip.lvl{background:transparent;border:1px solid var(--line);color:var(--muted)}
.stem{font-size:16px;font-weight:600;margin:0 0 12px;text-wrap:pretty;white-space:pre-line}
.stem .neg{font-weight:800;letter-spacing:.3px;text-decoration:underline;text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .l{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt .t{padding-top:2px;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);cursor:default}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.opt.off{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fb{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:14.5px}
.fb.ok{background:var(--ok-soft)}
.fb.reveal{background:var(--ok-soft);border-left:4px solid var(--ok)} .fb.reveal h4{color:var(--ok)}
.fb.second{background:var(--accent-soft)} .fb.second p{margin:0}
.fb.bad{background:var(--bad-soft)}
.fb h4{margin:0 0 4px;font-size:14.5px}
.fb.ok h4{color:var(--ok)} .fb.bad h4{color:var(--bad)}
.fb p{margin:0 0 6px}
.fb blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--mark);font-family:var(--f-text);font-size:15px;background:var(--panel);border-radius:0 6px 6px 0}
.fb blockquote.w{border-left-color:var(--bad)}
.fb blockquote .tr{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.fb ul{margin:4px 0 0;padding-left:18px}
.fb li{margin-bottom:3px}

.assist{margin-top:12px;border:1px dashed var(--accent);border-radius:8px;padding:12px;background:var(--paper)}
.assist .msgs{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;margin-bottom:10px}
.msg{padding:8px 11px;border-radius:8px;max-width:92%;white-space:pre-wrap;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--panel)}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.note{align-self:center;color:var(--muted);font-size:13px;background:transparent}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:13px}
.assist form{display:flex;gap:8px}
.assist textarea{flex:1;min-width:0;resize:vertical;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--panel);color:var(--ink)}

.btn:disabled{opacity:.5;cursor:not-allowed}
:root{--good:#5CCB8A;--mid:#F2C230;--weak:#E5534B;--on-status:#17202B;--good-soft:#E4F6EC;--mid-soft:#FDF4D6;--weak-soft:#FCE5E3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--good-soft:#173527;--mid-soft:#3A3115;--weak-soft:#3D1D1C}}
:root[data-theme="dark"]{--good-soft:#173527;--mid-soft:#3A3115;--weak-soft:#3D1D1C}
.finbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.finbar p{margin:10px 0 0;font-size:14px;color:var(--muted)}
.fprog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fprog i{display:block;height:100%;background:var(--accent)}
.rep-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{width:170px;height:170px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:14}
.r-bg{stroke:var(--line)} .r-good{stroke:var(--good);stroke-linecap:butt} .r-mid{stroke:var(--mid)}
.r-big{font:700 40px var(--f-text);fill:var(--ink);text-anchor:middle;dominant-baseline:middle;font-variant-numeric:tabular-nums}
.r-sm{font:500 13px var(--f-ui);fill:var(--muted);text-anchor:middle}
.rep-sum{flex:1 1 300px;min-width:0}
.rep-sum h2{font-family:var(--f-text);font-size:26px;margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.kpi b{font:700 24px var(--f-text);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .ki{font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--on-status);font-size:12px}
.kpi.good .ki{background:var(--good)} .kpi.mid .ki{background:var(--mid)} .kpi.weak .ki{background:var(--weak)}
.rep-sec{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
.rep-sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:10px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.good{background:var(--good)} .sw.mid{background:var(--mid)} .sw.weak{background:var(--weak)}
.qmap{display:flex;flex-direction:column;gap:8px}
.qm-row{display:grid;grid-template-columns:minmax(0,11em) 1fr;gap:10px;align-items:center}
.qm-t{font-size:13px;color:var(--muted)}
.qm-cells{display:flex;flex-wrap:wrap;gap:4px}
.qm{width:44px;height:40px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-status);font-size:13px;line-height:1.1;cursor:default}
.qm i{font-style:normal;font-size:11px;opacity:.9}
.qm.good{background:var(--good)} .qm.mid{background:var(--mid)} .qm.weak{background:var(--weak)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sw-box{border-radius:8px;padding:12px 14px}
.sw-box.good{background:var(--good-soft)} .sw-box.weak{background:var(--weak-soft)}
.sw-box h3{color:var(--ink)} .sw-box h3 .ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--on-status);margin-right:6px;font-size:12px} .sw-box.good .ic{background:var(--good)} .sw-box.weak .ic{background:var(--weak)}
.sw-box .note{margin:8px 0 0;font-size:13px;color:var(--muted)} .sw-box .sub2{margin:10px 0 6px;font-size:13px;font-weight:600}
.sks{display:flex;flex-wrap:wrap;gap:6px}
.sk{background:var(--panel);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,17em) 1fr 6.5em;gap:12px;align-items:center;font-size:14px}
.hb .track{height:16px;border-radius:4px;background:var(--line);overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb.good .track i{background:var(--good)} .hb.mid .track i{background:var(--mid)} .hb.weak .track i{background:var(--weak)}
.hb .hv{text-align:right;font-variant-numeric:tabular-nums}
.hb .hv small{color:var(--muted)}
.hb.none{color:var(--muted)} .hb.none .track{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px)}
@media (max-width:880px){
  .hb{grid-template-columns:minmax(0,1fr) 5.5em;gap:4px 10px}
  .hb .hl{grid-column:1/-1}
  .two{grid-template-columns:minmax(0,1fr)}
  .qm-row{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .kpi{flex-direction:row;align-items:center;gap:10px}
  .ring{width:140px;height:140px}
}
.landing{padding-block:28px 48px;max-width:760px}
.land-head .eyebrow{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700}
.land-head h1{font-family:var(--f-text);font-size:clamp(28px,4vw,40px);margin:6px 0 10px}
.land-head p{color:var(--muted);margin:0 0 22px;max-width:62ch}
.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.variant{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.variant h2{font-family:var(--f-text);font-size:24px;margin:0}
.vmeta{margin:0;color:var(--muted);font-size:14px}
.vprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.vprog i{display:block;height:100%;background:var(--accent)}
.vstatus{margin:4px 0 0;font-size:14px}
.variant .actions{margin-top:10px}
.tabsrow{display:flex;align-items:center;gap:8px;min-width:0}
.tabsrow .texttabs{flex:1;min-width:0}
.tolanding{flex:0 0 auto;padding-inline:4px}
.texttabs button{min-width:110px}
.results{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-block:16px 40px}
.results h2{font-family:var(--f-text);margin:0 0 4px}
.results .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.rgroup{margin-bottom:14px}

<script>
const BANKS = { kk: [{"bank_id": "kaz-L1-sagidolda-2026-v1", "track": "first_language", "source": "Сағидолда Қ. «Тест жинағы. НИШ, БИЛ. Қазақ тілі», 2026, 1-нұсқа", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {"Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған.": "Древние египтяне делали их из перьев, папируса и пальмовых листьев.", "қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған": "каркас зонта делали из тростника или китового уса", "іші қуыс болат тұтқаларды ұсынды": "предложил полые стальные ручки", "Ол уақыттарда қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған, ал күмбезі – жасалуы аса қолайсыз майланған жібектен болған.": "В те времена каркас зонта делали из тростника или китового уса, а купол — из промасленного шёлка, который было очень неудобно изготавливать.", "Ақыры 1852 жылы британ кәсіпкері Сэмюэль Фокс тура қазіргі түрлері секілді іші қуыс болат тұтқаларды ұсынды.": "Наконец, в 1852 году британский предприниматель Сэмюэль Фокс предложил полые стальные ручки — точно такие, как у современных зонтов.", "оны арнайы қызметшілер атқарған": "это делали специальные слуги", "Осыған ұқсас дәстүр ... Үндістанда да болған": "Похожая традиция ... была и в Индии", "дұрысы, құлдары көтеріп жүретін": "вернее, его носили их рабы", "Осыған ұқсас дәстүр Месопотамияда, Парсы елінде, Қытай, Жапония мен Үндістанда да болған.": "Похожая традиция была в Месопотамии, Персии, Китае, Японии и Индии.", "Әрине, қолшатырды әміршінің өзі ұстамаған: оны арнайы қызметшілер атқарған.": "Конечно, сам правитель зонт не держал: это делали специальные слуги.", "Белгілі бір себептерге байланысты оны тек әйелдер ғана (дұрысы, құлдары көтеріп жүретін) пайдаланатын, ал ер адамдар үшін қолшатыр ұстау ұят саналатын.": "По определённым причинам им пользовались только женщины (вернее, его носили их рабы), а мужчинам держать зонт считалось постыдным.", "XIX ғасыр ортасында қолшатыр ерлер аксессуарларының арасынан ойып тұрып орын алды.": "В середине XIX века зонт прочно занял место среди мужских аксессуаров.", "Мысалы, sunnycomb.com сайты 35 елдің тұрғындарының арасында жүргізген сауалнама нәтижесіне сәйкес, ер адамдар көбіне қара түсті, ал әйелдер жасыл не қызыл түсті қолшатырды құп көретіндері анықталды.": "Например, по результатам опроса сайта sunnycomb.com среди жителей 35 стран выяснилось, что мужчины чаще выбирают чёрные зонты, а женщины — зелёные или красные.", "Мұндай қолшатырлар түрлі шеру кезінде фараондар мен олардың отбасын Африканың шақырайған күн көзінен қорғаған.": "Во время шествий такие зонты защищали фараонов и их семьи от палящего африканского солнца.", "ер азаматтар аксессуарды әйелдерге қарағанда екі есе жиі жоғалтады": "мужчины теряют этот аксессуар в два раза чаще, чем женщины", "Ассирияда қолшатыр тек патшаларға тән атрибут болған, ал Қытайда көлеңкеге жасырыну құқығы тек ақсүйектерге берілген.": "В Ассирии зонт был атрибутом только царей, а в Китае право укрываться в тени давалось только знати.", "Ежелгі өркениет тұрғындары қолшатырды көре сала оның астында аса маңызды біреу отырғанын бірден түсінген.": "Жители древних цивилизаций, увидев зонт, сразу понимали, что под ним находится очень важный человек.", "– Адалдық адамға нан болмайды ғой! – деп жауап береді.": "— Честностью сыт не будешь! — отвечает он.", "Жұрттың барлығы етіктерін соған жамататын болады.": "Все жители стали чинить сапоги только у него.", "Ал оның ұстазына етік жаматуға мүлде ешкім келмей қояды.": "А к его учителю чинить сапоги вовсе перестали приходить.", "– Ағатай, бұл дұрыс емес қой, адам кәсібіне адал болуы қажет емес пе?!": "— Дядя, но ведь это неправильно! Разве человек не должен честно относиться к своему делу?!", "Ұстазының бұл әрекетіне іштей разы болмаса да...": "Хотя в душе он не одобрял такой поступок учителя...", "Ол бала ата-анасынан жақсы тәрбие алып, ненің жаман, ненің жақсы екенін үйреніп алады.": "Этот мальчик получил от родителей хорошее воспитание и знал, что плохо, а что хорошо.", "– Қарағым, етік жамағанда жіпті түймесең, ол етік көп ұзамай қайта жыртылады.": "— Сынок, если при починке сапога не завязать нитку, сапог скоро снова порвётся.", "адам кәсібіне адал болуы қажет емес пе?!": "разве человек не должен честно относиться к своему делу?!", "Абзал ұстазымен сөз таластырмайды.": "Абзал не спорит с учителем.", "Күндердің бір күнінде бала етікшілік кәсіпті ұстазынан кем білмейтін дәрежеге жетіп, өз бетінше етік тігуге кіріседі.": "Однажды мальчик освоил сапожное ремесло не хуже учителя и начал шить сапоги самостоятельно.", "Үлкендерге құрмет көрсететін тіл алғыш, адал, көркем мінезді ұл болып өседі.": "Он вырастает послушным, честным, воспитанным мальчиком, уважающим старших.", "Ұстазының бұл әрекетіне іштей разы болмаса да, етікшілік кәсібін меңгеруді жалғастыра береді.": "Хотя в душе он не одобрял такой поступок учителя, он продолжает осваивать сапожное ремесло.", "Сондықтан көгершінді пошташы «қызметіне» алып...": "Поэтому голубя взяли на «службу» почтальоном...", "бәрі көне гректерден басталғанын көреміз": "мы видим, что всё началось с древних греков", "әлі күнге дейін жақын арақашықтықта пошта тасуға қолданылады": "до сих пор используются для доставки почты на небольшие расстояния", "Алайда пошташы көгершіндердің ғұмыры таусылған уақыт десек, қателескен боламыз, себебі кей жерлерде олар әлі күнге дейін жақын арақашықтықта пошта тасуға қолданылады.": "Однако если сказать, что время голубей-почтальонов прошло, мы ошибёмся: в некоторых местах их до сих пор используют для доставки почты на небольшие расстояния.", "хатшылық – көгершіннің қанында бар қасиет": "носить письма — врождённое качество голубя", "Көгершін хатты жылдам жеткізеді әрі күн райының қиындығына қарамайды.": "Голубь быстро доставляет письма и не боится непогоды.", "Көгершінді қолға үйретудің тарихына үңілетін болсақ, бәрі көне гректерден басталғанын көреміз.": "Если заглянуть в историю приручения голубей, мы увидим, что всё началось с древних греков.", "Алайда олар көгершіндей көрсеткіш көрсете алмады.": "Однако они не смогли показать таких результатов, как голубь.", "Көгершіннің кемшілігі – тек бір бағытта ғана хат таси алатыны, яғни тек үйіне қарай ұшатыны.": "Недостаток голубя в том, что он может носить письма только в одном направлении, то есть летит только к своему дому.", "Көгершінді ұстап алып, алысқа апарып тастаса да, ұясын іздеп табады.": "Даже если поймать голубя и увезти далеко, он найдёт своё гнездо.", "Оны үйретудің қажеті жоқ.": "Этому его не нужно учить.", "ағылшынның Плимут қаласының дәрігерлері...": "врачи английского города Плимута...", "Үндістан да шалғай елді мекендерге көгершінмен пошта жеткізеді екен.": "Оказывается, в Индии тоже доставляют почту в отдалённые сёла с помощью голубей.", "Көгершін – жер тануда алдына жан салмайтын киелі құс.": "Голубь — священная птица, которой нет равных в умении находить дорогу.", "заттардың суретін салудан гөрі олардың тарихы, болмысы қызықтыратын болды": "меня стали интересовать не столько рисунки предметов, сколько их история и суть", "Осы салада басымнан өткен ең қызық жағдай...": "Самый интересный случай в моей работе...", "Археология саласындағы менің пірім – Рафаэль Пампелли деген америкалық зерттеуші.": "Мой кумир в археологии — американский исследователь Рафаэль Пампелли.", "Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен.": "Оказалось, что примерно 100 лет назад он вёл здесь археологические работы, точно как я.", "Елді аралау және жергілікті халықпен тіл табыса білу үшін орыс тілін үйренуге тура келді.": "Чтобы путешествовать по стране и находить общий язык с местными жителями, мне пришлось выучить русский язык.", "Кейін жергілікті бір қарт маған америкалық археолог Рафаэль Пампелли туралы айтып берді.": "Позже один местный старик рассказал мне об американском археологе Рафаэле Пампелли.", "жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады": "им понравилась наша работа, потому что они могут свободно путешествовать вместе с нами", "Ал екі ұлым болашақта археолог болғысы келмесе де, бізбен бірге үлкен қазба жұмыстарына қатысып, жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады.": "А двое моих сыновей, хотя и не хотят в будущем становиться археологами, участвуют с нами в больших раскопках, и им понравилась наша работа, потому что они могут свободно путешествовать вместе с нами.", "Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық.": "Прошлым летом мы возили их на озеро Титикака в Андах, в Южной Америке.", "Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын.": "Этот человек ничем не отличается от меня. Я поступил бы точно так же.", "Мысалы, заманында кемелерден түскен тауарларды сақтайтын ескі үйдің алдынан 700 жылдық төсеніш тауып алдық.": "Например, перед старым домом, где когда-то хранили товары с кораблей, мы нашли подстилку 700-летней давности.", "теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын": "я участвую в нескольких проектах по изучению морского дна и до сих пор продолжаю рисовать найденные предметы", "Менің әйелім де археолог.": "Моя жена тоже археолог.", "Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды – бұл Қытаймен арадағы сауданың қызу жүруіне байланысты болса керек.": "Примерно в XVII веке во Франции и Англии зонты начинают широко распространяться — вероятно, благодаря оживлённой торговле с Китаем.", "Ежелгі мысырлықтар ... оны арнайы қызметшілер атқарған": "Древние египтяне ... это делали специальные слуги", "ежелгі Грецияға ... дұрысы, құлдары көтеріп жүретін": "в Древнюю Грецию ... вернее, его носили их рабы", "Қолшатыр шығыстан ежелгі Грецияға келе сала жергілікті сәнқой арулардың қолынан түспейтін аксессуарға айналды.": "Попав с Востока в Древнюю Грецию, зонт сразу стал любимым аксессуаром местных модниц."}, "style_notes": ["«Мазалама» деп жазба, оның орнына «Уайымдама» не «Алаң болма» де"], "texts": [{"id": "v1-t1", "title": "Қолшатыр тарихы", "source_note": "«OYLA» журналы", "source_note_ru": "журнал «OYLA»", "numbered_paragraphs": true, "paragraphs": ["Ең алғашқы қолшатырлар ұзын таяқшаға таңылған алып веер түрінде болған. Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған. Мұндай қолшатырлар түрлі шеру кезінде фараондар мен олардың отбасын Африканың шақырайған күн көзінен қорғаған. Әрине, қолшатырды әміршінің өзі ұстамаған: оны арнайы қызметшілер атқарған.", "Осыған ұқсас дәстүр Месопотамияда, Парсы елінде, Қытай, Жапония мен Үндістанда да болған. Ассирияда қолшатыр тек патшаларға тән атрибут болған, ал Қытайда көлеңкеге жасырыну құқығы тек ақсүйектерге берілген. Ежелгі өркениет тұрғындары қолшатырды көре сала оның астында аса маңызды біреу отырғанын бірден түсінген.", "Қолшатыр шығыстан ежелгі Грецияға келе сала жергілікті сәнқой арулардың қолынан түспейтін аксессуарға айналды. Белгілі бір себептерге байланысты оны тек әйелдер ғана (дұрысы, құлдары көтеріп жүретін) пайдаланатын, ал ер адамдар үшін қолшатыр ұстау ұят саналатын.", "Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды – бұл Қытаймен арадағы сауданың қызу жүруіне байланысты болса керек. Ол уақыттарда қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған, ал күмбезі – жасалуы аса қолайсыз майланған жібектен болған. Ақыры 1852 жылы британ кәсіпкері Сэмюэль Фокс тура қазіргі түрлері секілді іші қуыс болат тұтқаларды ұсынды. Конструкциясы жеңіл әрі берік бола түсті. Сондай-ақ қалталы азаматтар ішіне қылыштарын немесе құтыларын салып қоюға болатын ерекше тұтқалы қолшатырларға тапсырыс бере бастады. XIX ғасыр ортасында қолшатыр ерлер аксессуарларының арасынан ойып тұрып орын алды.", "Қазіргі таңда қолшатырды ерлер де, әйелдер де пайдалана береді, бірақ қызықты айырмашылық та бар. Мысалы, sunnycomb.com сайты 35 елдің тұрғындарының арасында жүргізген сауалнама нәтижесіне сәйкес, ер адамдар көбіне қара түсті, ал әйелдер жасыл не қызыл түсті қолшатырды құп көретіндері анықталды. Сондай-ақ ер азаматтар аксессуарды әйелдерге қарағанда екі есе жиі жоғалтады."]}, {"id": "v1-t2", "title": "Абзал мен етікші", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Баяғы бір заманда Күйік шаһарында бір етікші болыпты. Оның жақын көршісінің Абзал есімді баласы бар екен. Ол бала ата-анасынан жақсы тәрбие алып, ненің жаман, ненің жақсы екенін үйреніп алады. Үлкендерге құрмет көрсететін тіл алғыш, адал, көркем мінезді ұл болып өседі. Өз күшімен еңбек етіп, ата-анасына көмектесу ойымен, етікшінің жанына көмекші болып барады. Ерінбей, жалықпай етікшіліктің бар қыр-сырын үйренеді. Абзал бір күні етікшінің етік жамағанда үнемі жібін түймейтіндігін байқап қалыпты. Аң-таң болған бала етікші ұстазынан мұның мән-сырын сұрайды.", "Сонда ол:", "– Қарағым, етік жамағанда жіпті түймесең, ол етік көп ұзамай қайта жыртылады. Сөйтіп оның иесі оны жаматуға қайта әкеледі. Одан маған жұмыс, бала-шағама нан табылады, – дейді.", "Сонда Абзал ата-анасының айтқан ізгілік тәрбиесін есіне түсіріп:", "– Ағатай, бұл дұрыс емес қой, адам кәсібіне адал болуы қажет емес пе?! – дейді.", "Етікші бұл сөзге құлақ аспай:", "– Адалдық адамға нан болмайды ғой! – деп жауап береді. Абзал ұстазымен сөз таластырмайды.", "Ұстазының бұл әрекетіне іштей разы болмаса да, етікшілік кәсібін меңгеруді жалғастыра береді. Күндердің бір күнінде бала етікшілік кәсіпті ұстазынан кем білмейтін дәрежеге жетіп, өз бетінше етік тігуге кіріседі. Бірақ ол етік жамағанда жіпті түйіп тігеді. Арада көп уақыт өтпей-ақ шаһар халқы ісін ұқыпты істейтін етікші туралы естиді. Жұрттың барлығы етіктерін соған жамататын болады. Ал оның ұстазына етік жаматуға мүлде ешкім келмей қояды. Ұстазы мұның мәнісін білмек болып, шәкіртінен сұрайды. Ол: «__________», – депті."]}, {"id": "v1-t3", "title": "Пошташы көгершін", "source_note": "", "numbered_paragraphs": true, "paragraphs": ["Көгершін – жер тануда **алдына жан салмайтын** киелі құс. Туған жерін, ұя салған орнын жазбай таниды. Көгершінді ұстап алып, алысқа апарып тастаса да, ұясын іздеп табады. Мұны адамдар ежелден байқаған. Сондықтан көгершінді пошташы «қызметіне» алып, қарым-қатынас құралына айналдырған.", "Пошта тасуға басқа құстарды да үйретуге болады. Бірақ хатшылық – көгершіннің қанында бар қасиет. Оны үйретудің қажеті жоқ. Хатты байлап, ұшырып жіберсең болды – туған жерін айнымай табады. Көгершіннің кемшілігі – тек бір бағытта ғана хат таси алатыны, яғни тек үйіне қарай ұшатыны. Француздар шағаланы, орыстар сұңқарды, ағылшындар қарлығашты пошта тасуға үйретіп көрген. Алайда олар көгершіндей көрсеткіш көрсете алмады. Көгершін хатты жылдам жеткізеді әрі күн райының қиындығына қарамайды.", "Көгершінді қолға үйретудің тарихына үңілетін болсақ, бәрі көне гректерден басталғанын көреміз. Көне Грекияда адамдар көгершінді туған жерінен ұстап әкетіп, хат байлап қайта ұшырып жіберген. Мәселен, Олимпиада ойындарының жүлдегерін көгершін арқылы еліне хабарлаған.", "1176 жылы Мысырда Нұраддин патшаның кезінде ресми түрде мемлекеттік көгершін пошта қызметі құрылған. Ал француздар көгершінді 1870–1871 жылдары болған француз-неміс соғысында жиі пайдаланған. Тіпті немістер хабаршының жолын кесу үшін қаршығаны қолданған. Бірақ француздар мұның да амалын тапқан екен. Көгершіннің аяғына кішкентай ысқырық тағып жіберген. Ысқырық құс ұшқан кезде ауаға үйкеліп, ащы дыбыс шығарады. Бұл дыбыстан жыртқыш құстар қорқып, көгершінге жоламайды.", "Қазір коммуникацияның дамыған заманы. ХХ ғасыр логистиканың ғасыры болса, ХХІ ғасыр – ақпарат пен коммуникация ғасыры. Әлемнің кез келген жеріне қас қағым сәтте хат жіберуге болады. Алайда пошташы көгершіндердің ғұмыры таусылған уақыт десек, қателескен боламыз, себебі кей жерлерде олар әлі күнге дейін жақын арақашықтықта пошта тасуға қолданылады. Мәселен, ағылшынның Плимут қаласының дәрігерлері әлі күнге дейін клиникадағы қан талдамасын зертханаға көгершінмен жібереді. Клиника мен зертхананың арасы жап-жақын, бірақ көлік кептелісінің кесірінен дәрігерлер сараптама қорытындысын дер кезінде жеткізу үшін сол көгершіннің көмегіне әлі күнге дейін жүгінеді. Үндістан да шалғай елді мекендерге көгершінмен пошта жеткізеді екен."]}, {"id": "v1-t4", "title": "Археолог әңгімесі", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Археологтермен бірге алғаш жұмыс істей бастағанымда мен олар сияқты жерден заттарды қазумен айналысқан жоқпын. Оның орнына суретші болып жұмыс істедім, олар тапқан нәрселердің бейнесін қағаз бетіне түсіруге тырыстым. Алайда уақыт өте келе заттардың суретін салудан гөрі олардың тарихы, болмысы қызықтыратын болды. Археологиядағы мансабым осылай басталды. Қазірде Мысырдан Моңғолияға дейін созылған атақты «Жібек жолын» зерттеумен айналысамын. Сонымен қатар теңіз астын зерттейтін бірнеше жобаға қатысып жүрмін және табылған дүниелердің суретін салуды әлі күнге дейін тастаған жоқпын.", "Археология саласындағы менің пірім – Рафаэль Пампелли деген америкалық зерттеуші. Мен ол туралы алғаш студент кезімде, Азияның дәл ортасында орналасқан Түркіменстанға саяхат барысында естідім. Елді аралау және жергілікті халықпен тіл табыса білу үшін орыс тілін үйренуге тура келді. Ол жерге жеткенде: «Уау! Мен мұнда аяқ басқан алғашқы америкалықтардың бірімін!» – деп ойладым. Кейін жергілікті бір қарт маған америкалық археолог Рафаэль Пампелли туралы айтып берді. Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен.", "Менің әйелім де археолог. Ал екі ұлым болашақта археолог болғысы келмесе де, бізбен бірге үлкен қазба жұмыстарына қатысып, жұмысымызды ұнатып қалды, өйткені бізбен бірге еркін саяхаттай алады. Өткен жаз біз оларды Оңтүстік Америкадағы Анд тауларында орналасқан Титикака көліне апардық. Сондықтан отбасымызбен археологпыз десем, қателеспейтін шығармын.", "Осы салада басымнан өткен ең қызық жағдай Мысырдың Қызыл теңіз жағалауында жүргізілген қазба жұмысы кезінде болды. Ол жақта жаңбыр сирек жауып, ауа өте құрғақ болғаны сонша, көп нәрсе бастапқы қалпында сақталған. Мысалы, заманында кемелерден түскен тауарларды сақтайтын ескі үйдің алдынан 700 жылдық төсеніш тауып алдық. Астын көтеріп қарасақ, үй иесінің аты жазылған кілт сол қалпы жатыр екен. Иесі алыс сапарға шығып, кез келген минутта үйіне қайтып келетіндей көрінді. Сол кезде мен: «Бұл адамның менен айырмашылығы жоқ. Мен де дәл солай жасаймын», – деп ойладым."]}], "items": [{"id": "v1-q01", "number": 1, "text_id": "v1-t1", "stem": "Мәтін бойынша қолшатыр жасау үшін қай материал ҚОЛДАНЫЛМАҒАН?", "options": {"A": "Кит мұрты", "B": "Папирус", "C": "Емен жапырақтары", "D": "Болат"}, "key": "C", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 3, "negative": true, "evidence": ["Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған. (1-азатжол)", "қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған (4-азатжол)", "іші қуыс болат тұтқаларды ұсынды (4-азатжол)"], "explanation": "Мәтінде пальма жапырақтары айтылады, ал емен жапырақтары туралы еш жерде сөз жоқ.", "distractor_notes": {"A": "кит мұрты қолшатыр жасауға қолданылған. Ол туралы 4-азатжолда жазылған.", "B": "папирус қолшатыр жасауға қолданылған. Ол туралы 1-азатжолда жазылған.", "D": "болат та қолданылған. Болат тұтқалар туралы 4-азатжолда жазылған."}, "editor_changes": "«Қауырсын» нұсқасы алынды. Сұрақ толық сөйлемге айналды, болымсыздық бас әріппен берілді.", "distractor_evidence": {"A": ["қолшатырдың қаңқасы қамыстан немесе киттің мұртынан жасалған"], "B": ["Ежелгі мысырлықтар оларды қауырсыннан, папирус пен пальма жапырақтарынан жасаған"], "D": ["іші қуыс болат тұтқаларды ұсынды"]}, "keywords": {"ok": {"kk": ["қауырсыннан", "папирус", "пальма жапырақтарынан", "қамыстан", "киттің мұртынан", "болат"], "ru": ["перьев", "папируса", "пальмовых листьев", "тростника", "китового уса", "стальные"]}, "A": {"kk": ["киттің мұртынан"], "ru": ["китового уса"]}, "B": {"kk": ["папирус"], "ru": ["папируса"]}, "D": {"kk": ["болат тұтқаларды"], "ru": ["стальные ручки"]}}, "explanation_ru": "В тексте упоминаются пальмовые листья, а о дубовых листьях не сказано нигде.", "distractor_notes_ru": {"A": "Китовый ус использовался для изготовления зонтов. Об этом написано в 4-м абзаце.", "B": "Папирус использовался для изготовления зонтов. Об этом написано в 1-м абзаце.", "D": "Сталь тоже использовалась. О стальных ручках написано в 4-м абзаце."}, "fixed_order": false}, {"id": "v1-q02", "number": 2, "text_id": "v1-t1", "stem": "Мәтін бойынша қолшатырды қызметшісіне ұстатқызу дәстүрі қай елге қатысты АЙТЫЛМАЙДЫ?", "options": {"A": "Франция", "B": "Үндістан", "C": "Мысыр", "D": "Греция"}, "key": "A", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 3, "negative": true, "evidence": ["Ежелгі мысырлықтар ... оны арнайы қызметшілер атқарған (1-азатжол)", "Осыған ұқсас дәстүр ... Үндістанда да болған (2-азатжол)", "ежелгі Грецияға ... дұрысы, құлдары көтеріп жүретін (3-азатжол)"], "explanation": "Франция 4-азатжолда аталады, бірақ онда қолшатырдың жаппай қолданысқа енгені айтылады, қызметші туралы сөз жоқ.", "distractor_notes": {"B": "мәтінде Үндістанда да осындай дәстүр болғаны айтылады. Ол туралы 2-азатжолда жазылған.", "C": "мысырлықтардың қолшатырын арнайы қызметшілер ұстаған. Ол туралы 1-азатжолда жазылған.", "D": "ежелгі Грецияда қолшатырды құлдар көтеріп жүрген. Ол туралы 3-азатжолда жазылған."}, "editor_changes": "«Қытай» нұсқасы алынды.", "distractor_evidence": {"B": ["Осыған ұқсас дәстүр Месопотамияда, Парсы елінде, Қытай, Жапония мен Үндістанда да болған"], "C": ["Ежелгі мысырлықтар", "оны арнайы қызметшілер атқарған"], "D": ["Қолшатыр шығыстан ежелгі Грецияға келе сала", "дұрысы, құлдары көтеріп жүретін"]}, "keywords": {"ok": {"kk": ["мысырлықтар", "қызметшілер", "дәстүр", "Үндістанда", "Грецияға", "құлдары"], "ru": ["египтяне", "слуги", "традиция", "Индии", "Древнюю Грецию", "рабы"]}, "B": {"kk": ["Осыған ұқсас дәстүр", "Үндістанда"], "ru": ["Похожая традиция", "Индии"]}, "C": {"kk": ["мысырлықтар", "қызметшілер"], "ru": ["египтяне", "слуги"]}, "D": {"kk": ["Грецияға", "құлдары"], "ru": ["Древнюю Грецию", "рабы"]}}, "explanation_ru": "Франция упоминается в 4-м абзаце, но там говорится о массовом распространении зонтов, а о слугах ничего не сказано.", "distractor_notes_ru": {"B": "В тексте сказано, что в Индии тоже была такая традиция. Об этом написано во 2-м абзаце.", "C": "Зонты египтян держали специальные слуги. Об этом написано в 1-м абзаце.", "D": "В Древней Греции зонты носили рабы. Об этом написано в 3-м абзаце."}, "fixed_order": false}, {"id": "v1-q03", "number": 3, "text_id": "v1-t1", "stem": "Мәтін мазмұны бойынша қай тұжырым дұрыс?", "options": {"A": "Сауалнамаға сәйкес, қазір әйелдер көбіне сары түсті қолшатыр таңдайды екен.", "B": "Ер адамдар шамамен 1850 жылдардан бастап қолшатырды еркін қолдана бастаған.", "C": "Ежелгі заманда барлық өңірде қолшатырды тек әйел адамдар қолданған.", "D": "Қолшатырдың қазіргідей үлгісі XVII ғасырда жасала бастады."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "evidence": ["XIX ғасыр ортасында қолшатыр ерлер аксессуарларының арасынан ойып тұрып орын алды. (4-азатжол)"], "explanation": "XIX ғасырдың ортасы – шамамен 1850 жылдар. Дәл осы кезде қолшатыр ерлердің аксессуарына айналған.", "distractor_notes": {"A": "мәтінде әйелдер сары емес, жасыл не қызыл түсті қолшатырды таңдайтыны айтылады. Ол туралы 5-азатжолда жазылған.", "C": "қолшатырды тек әйелдер ұстаған жер – ежелгі Греция ғана, ал Мысырда ол фараондарды қорғаған. Бұл туралы 1 және 3-азатжолдарда жазылған.", "D": "XVII ғасыр – 1600–1699 жылдар аралығы. Мәтінде XVII ғасырда қолшатыр Франция мен Англияда тек жаппай қолданысқа ене бастағаны айтылады. Ал қазіргідей болат тұтқалы қолшатырды Сэмюэль Фокс 1852 жылы ұсынған. 1852 жыл – XIX ғасыр (1800–1899 жылдар). Демек, қазіргі үлгі XVII ғасырда емес, одан шамамен 200 жыл кейін, XIX ғасырда пайда болған. Бұл туралы 4-азатжолда жазылған."}, "editor_changes": "Екіұшты «Қолшатыр Грецияға келе сала жаппай қолданысқа ене бастайды» нұсқасы алынды.", "distractor_evidence": {"A": ["әйелдер жасыл не қызыл түсті қолшатырды құп көретіндері анықталды"], "C": ["Қолшатыр шығыстан ежелгі Грецияға келе сала", "фараондар мен олардың отбасын", "оны тек әйелдер ғана"], "D": ["Шамамен XVII ғасырларда Франция мен Англияда қолшатыр жаппай қолданысқа ене бастайды", "Ақыры 1852 жылы британ кәсіпкері Сэмюэль Фокс тура қазіргі түрлері секілді іші қуыс болат тұтқаларды ұсынды"]}, "keywords": {"ok": {"kk": ["XIX ғасыр ортасында", "ерлер аксессуарларының"], "ru": ["В середине XIX века", "мужских аксессуаров"]}, "A": {"kk": ["жасыл не қызыл"], "ru": ["зелёные или красные"]}, "C": {"kk": ["фараондар", "Грецияға", "тек әйелдер ғана"], "ru": ["фараонов", "Древнюю Грецию", "только женщины"]}, "D": {"kk": ["XVII ғасырларда", "жаппай қолданысқа ене бастайды", "1852 жылы", "Сэмюэль Фокс", "болат тұтқаларды"], "ru": ["XVII веке", "широко распространяться", "1852 году", "Сэмюэль Фокс", "стальные ручки"]}}, "explanation_ru": "Середина XIX века — это примерно 1850-е годы. Именно тогда зонт стал мужским аксессуаром.", "distractor_notes_ru": {"A": "В тексте сказано, что женщины выбирают не жёлтые, а зелёные или красные зонты. Об этом написано в 5-м абзаце.", "C": "Только женщины пользовались зонтом лишь в Древней Греции, а в Египте зонт защищал фараонов. Об этом написано в 1-м и 3-м абзацах.", "D": "XVII век — это 1600–1699 годы. В тексте сказано, что в XVII веке зонты во Франции и Англии только начали широко распространяться. А современный зонт со стальной ручкой предложил Сэмюэль Фокс в 1852 году. 1852 год — это XIX век (1800–1899 годы). Значит, современный образец появился не в XVII веке, а примерно на 200 лет позже — в XIX веке. Об этом написано в 4-м абзаце."}, "fixed_order": false}, {"id": "v1-q04", "number": 4, "text_id": "v1-t1", "stem": "Мәтін бойынша қолшатырды қызметші немесе құлдардың ұстағаны туралы ақпарат қай азатжолдарда тікелей айтылған?", "options": {"A": "Тек 1", "B": "1 және 4", "C": "1 және 3", "D": "Тек 3"}, "key": "C", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 2, "negative": false, "evidence": ["оны арнайы қызметшілер атқарған (1-азатжол)", "дұрысы, құлдары көтеріп жүретін (3-азатжол)"], "explanation": "Қызметшілер 1-азатжолда, құлдар 3-азатжолда тікелей аталады.", "distractor_notes": {"A": "қызметшілер мен құлдар туралы мәтінде бір ғана азатжолда айтылмайды. Барлық азатжолды қайта қарап шық.", "B": "4-азатжолда қызметші не құл туралы айтылмайды.", "D": "қызметшілер мен құлдар туралы мәтінде бір ғана азатжолда айтылмайды. Барлық азатжолды қайта қарап шық."}, "editor_changes": "«1 және 5» нұсқасы алынды. Сұраққа «тікелей» сөзі қосылды.", "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["қызметшілер", "құлдары"], "ru": ["слуги", "рабы"]}}, "explanation_ru": "Слуги прямо упоминаются в 1-м абзаце, рабы — в 3-м.", "distractor_notes_ru": {"A": "О слугах и рабах в тексте говорится не в одном абзаце. Перечитай все абзацы.", "B": "В 4-м абзаце не говорится ни о слугах, ни о рабах.", "D": "О слугах и рабах в тексте говорится не в одном абзаце. Перечитай все абзацы."}, "fixed_order": true}, {"id": "v1-q05", "number": 5, "text_id": "v1-t1", "stem": "Мәтінде қай сұрақтың жауабы ЖОҚ?", "options": {"A": "Неліктен қолшатырды көрген адам оның астында маңызды адам бар деп түсінген?", "B": "Қазір қолшатырды пайдалануға қатысты ерлер мен әйелдердің арасында қандай ерекшеліктер бар?", "C": "Алғашқы қолшатырлар қай өңірде жасалған?", "D": "Не себепті ер адамдар әйелдерге fixed_order": false}, {"id": "v1-q06", "number": 6, "text_id": "v1-t2", "stem": "Мәтіндегі бос орынға мағынасы жағынан қай қанатты сөз сәйкес келеді?", "options": {"A": "Еңбектің наны тәтті.", "B": "Бірлік бар жерде тірлік бар.", "C": "Адал еңбек берекелі болады.", "D": "Өнер алды қызыл тіл."}, "key": "C", "skill": "C4", "skill_name": "Мәтін құрылымы мен логикасы", "level": 2, "negative": false, "evidence": ["– Адалдық адамға нан болмайды ғой! – деп жауап береді.", "Жұрттың барлығы етіктерін соған жамататын болады."], "explanation": "Ұстаз «адалдық нан болмайды» деген еді. Абзал адал жұмыс істеп, бүкіл шаһардың тапсырысын алды. Бұл ұстаздың сөзіне берілген жауап: адал еңбек береке әкеледі.", "distractor_notes": {"A": "бұл мақал жалпы еңбек туралы. Ұстаз да еңбек етті, бірақ оған ешкім келмей қойды. Абзал мен ұстаздың айырмашылығы неде екенін ойлан.", "B": "мәтінде бірлік туралы сөз жоқ.", "D": "мәтінде шешендік, сөз өнері туралы айтылмайды."}, "editor_changes": "«Досы көпті жау алмайды» нұсқасы алынды.", "distractor_evidence": {"A": ["Ал оның ұстазына етік жаматуға мүлде ешкім келмей қояды"], "B": [], "D": []}, "keywords": {"ok": {"kk": ["Адалдық", "Жұрттың барлығы"], "ru": ["Честностью", "Все жители"]}, "A": {"kk": ["ешкім келмей қояды"], "ru": ["перестали приходить"]}}, "explanation_ru": "Учитель говорил: «Честностью сыт не будешь». Абзал работал честно и получил заказы всего города. Это ответ на слова учителя: честный труд приносит достаток.", "distractor_notes_ru": {"A": "Эта пословица о труде вообще. Учитель тоже трудился, но к нему перестали приходить. Подумай, в чём разница между Абзалом и учителем.", "B": "В тексте ничего не говорится о единстве.", "D": "В тексте ничего не говорится о красноречии и искусстве слова."}, "fixed_order": false}, {"id": "v1-q07", "number": 7, "text_id": "v1-t2", "stem": "Мәтін мазмұны бойынша қай ақпарат ҚАТЕ?", "options": {"A": "Жұрт Абзалдың еңбегін ерекше бағалайды.", "B": "Ата-анасы Абзалға өте жақсы тәрбие берген.", "C": "Абз еді.", "distractor_notes": {"A": "автор өзін алғашқы америкалықтардың бірі деп ойлаған, бірақ Пампелли одан бұрын келген. Соңғы сапар туралы да айтылмайды.", "C": "автордың әйелі де археолог, яғни ол бұл салаға қызығады.", "D": "Пампелли автордан 100 жыл бұрын жұмыс істеген, олар бірге қазба жүргізбеген."}, "editor_changes": "Өзгеріс жоқ.", "distractor_evidence": {"A": ["Сөйтсе ол осы жерде шамамен 100 жыл бұрын дәл мен сияқты археологиялық жұмыстармен айналысқан екен"], "C": ["Менің әйелім де археолог"], "D": ["шамамен 100 жыл бұрын"]}, "keywords": {"ok": {"kk": ["теңіз астын зерттейтін", "суретін салуды"], "ru": ["изучению морского дна", "рисовать найденные предметы"]}, "A": {"kk": ["шамамен 100 жыл бұрын"], "ru": ["примерно 100 лет назад"]}, "C": {"kk": ["әйелім де археолог"], "ru": ["жена тоже археолог"]}, "D": {"kk": ["100 жыл бұрын"], "ru": ["100 лет назад"]}}, "explanation_ru": "Автор участвует в проектах по изучению морского дна и до сих пор рисует найденные предметы. Правильный ответ объединяет эти два факта.", "distractor_notes_ru": {"A": "Автор думал, что он один из первых американцев, но Пампелли был там раньше. О последней поездке тоже ничего не сказано.", "C": "Жена автора тоже археолог, значит, ей интересна эта сфера.", "D": "Пампелли работал на 100 лет раньше автора, они не вели раскопки вместе."}, "fixed_order": false}]}].filter(Boolean), ru: [{"bank_id": "kaz-L2-nis-sample-v1", "track": "second_language", "source": "НЗМ 7-сыныпқа конкурстық іріктеудің тест үлгілері, «Қазақ тілі (екінші тіл)» (құжаттағы 21–40 тапсырмалар, платформада 1–20)", "skills": {"A1": "Нақты деректі табу", "A2": "Себеп пен салдарды табу", "A3": "Ақпараттың орнын табу", "B1": "Сілтемені анықтау", "B2": "Сөздің мәтіндегі мағынасы", "B3": "Тұжырымды мәтінмен салыстыру", "B4": "Кейіпкердің сезімі мен мінезі", "C1": "Негізгі ой, тақырып, атау", "C2": "Астарлы ойды түсіндіру", "C3": "Түйін, кеңес, тағылым", "C4": "Мәтін құрылымы мен логикасы", "D1": "Мәтін үлгісі мен жанры", "D2": "Автордың мақсаты мен көзқарасы"}, "evidence_ru": {"Олар кәдімгі қоңыраулы сағатқа тікұшақтікіндей қанаттар орнатыпты.": "Они приделали к обычному будильнику крылья, как у вертолёта.", "Қоңырау шырылдағанда, қанаттары айналып, сағатты төбеге көтеріп әкетеді.": "Когда звенит звонок, крылья вращаются и поднимают часы к потолку.", "Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады.": "Часы, работающие на двух обычных маленьких батарейках, могут звенеть под потолком три минуты.", "Таңертең белгіленген уақытта ұйқыдан оятатын сағат әр үйде бар.": "Будильник, который будит утром в назначенное время, есть в каждом доме.", "Балалар нені оқиды, қандай кітапқа қызығады, ата-ана қандай дүние іздейді – осының бәрін анықтаймыз.": "Что читают дети, какими книгами интересуются, что ищут родители — всё это мы выясняем.", "Олар панорама түрінде ашылып, кітаптың тақырыбына сай баланы қызықтырады.": "Они раскрываются в виде панорамы и увлекают ребёнка в соответствии с темой книги.", "Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті.": "История о собаке японца, который гордился своим псом, помогавшим пострадавшим от наводнения и спасавшим людей от беды, разошлась по всей стране.", "Арада бірнеше ай өткен соң, иттің иесі теледидардан тасқын кезінде құтқарылған адамдар мен жан-жануарларға көмек көрсеткен иттерді марапаттау рәсімін көреді.": "Через несколько месяцев хозяин увидел по телевизору церемонию награждения собак, которые помогали людям и животным, спасённым во время наводнения.", "Сол жаңалықтан соң үйден кетіп қалған итін иесі таба алмай қалады.": "После этих новостей собака ушла из дома, и хозяин не может её найти.", "Ең қызығы сол – арада үш жыл өткенде, жоғалып кеткен ит өз үйіне оралған.": "Самое интересное, что через три года пропавшая собака вернулась домой.", "Мемлекеттік орындарға хабарласып, итін іздейді.": "Он обращается в государственные органы и ищет свою собаку.", "Музыка дегеніміз – сырлы да сиқырлы дыбыс.": "Музыка — это таинственный и волшебный звук.", "Сазгер, музыка зерттеушісі Ахмет Жұбанов: «Қазақ күйлерінде шөптің сыбдыры, кең далада келе жатқан жалғыз жолаушының әні, аспанда қалықтап жүрген бүркіт қанатының суылы бар…» – деп ерекше тебірене жазыпты.": "Композитор и исследователь музыки Ахмет Жубанов с особым волнением писал: «В казахских кюях — шелест травы, песня одинокого путника в широкой степи, шум крыльев беркута, парящего в небе…»", "Жақсы ән мен сазды музыка – жан азығы.": "Хорошая песня и мелодичная музыка — пища для души.", "Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған.": "Учёные установили, что музыка влияет на мозг человека.", "Әсем ән, сазды музыканың ықпалынан қанайналым жүйесі, зат алмасу процесі жақсарады.": "Под влиянием красивой песни и мелодичной музыки улучшаются кровообращение и обмен веществ.", "Ертеде әуеннің көмегімен күйзелісті, қайғы-қасіретті емдеген.": "В древности с помощью мелодии лечили стресс и горе.", "Табиғаттағы жаңбыр, дауыл, жел үні, су сылдыры, құстар әні, аңдардың дауысы, қимылына еліктеуден әуен құралады.": "Мелодия складывается из подражания звукам природы: дождю, буре, ветру, журчанию воды, пению птиц, голосам и движениям зверей.", "Музыка көңілді көтереді, қайғыны жеңілдетеді, бойды сергітеді, жанға жайлы эмоция сыйлайды.": "Музыка поднимает настроение, облегчает горе, бодрит и дарит приятные эмоции.", "Сонымен қатар музыкамен айналысқан адам шет тілдерін жақсы меңгереді екен.": "Кроме того, человек, занимающийся музыкой, оказывается, хорошо осваивает иностранные языки.", "Шығыстың ұлы емшісі Авиценна музыканың адамды емдейтін емдік қасиеті бар екенін айтқан.": "Великий целитель Востока Авиценна говорил, что музыка обладает целебной силой и лечит человека.", "Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі.": "Когда человек играет на музыкальном инструменте, раскрываются его способности.", "Ал дыбыс дегеніміз – табиғат.": "А звук — это природа.", "– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты.": "— Детство маленького Асанали было трудным, ведь тогда шла война.", "– Анам еңбекқор, мейірімді, қарапайым адам болды.": "— Моя мама была трудолюбивым, добрым, простым человеком.", "– Балалық шағыңызда қандай ойындар ойнадыңыз?": "— В какие игры вы играли в детстве?", "– Балаларға қандай кеңес берер едіңіз?": "— Какой совет вы дали бы детям?", "Ауылдың барлық ер-азаматы соғысқа кетті, жұмыс істей алатын қарттардың, аналардың, балалардың барлығы жұмыс істеді.": "Все мужчины аула ушли на войну, работали все, кто мог: старики, матери, дети.", "Балалар жұмыс істеп жүріп те ойнай алдық.": "Мы, дети, умудрялись играть, даже работая.", "– Соғыс жүріп жатқандықтан, бізде ойыншық деген болған жоқ.": "— Шла война, поэтому игрушек у нас не было.", "Оқысаң, білімді болсаң, елге де көмегің тиеді.": "Если будешь учиться и станешь образованным, ты принесёшь пользу и своей стране.", "Балаларға айтарым: оқы, оқы және тағы оқы...": "Детям скажу: учись, учись и ещё раз учись...", "– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды.": "— Ребёнок, который хочет стать достойным человеком, слушает родителей, хорошо учится и с детства думает о своём будущем.", "Бала Асанәлі егінде жұмыс істеді.": "Маленький Асанали работал в поле.", "– Өміріңізде анаңыздың рөлі қандай?": "— Какова роль мамы в вашей жизни?", "Ол қарсыласына ауыр сөздер айтып, ызаландырады.": "Он говорит сопернику оскорбительные слова и доводит до ярости.", "Алайда самурай оған қалт етпейді.": "Однако самурай даже не шелохнулся.", "Ызаланған жауынгер есікті теуіп, кетіп қалады.": "Разъярённый воин пинает дверь и уходит.", "– Өзінің иесінде, – деп жауап береді шәкірттері.": "— У своего хозяина, — отвечают ученики.", "Оларды қабылдамасаң, барлығы өз иесінде қалады, – дейді самурай.": "Если их не принимать, всё это останется у своего хозяина, — говорит самурай.", "Дана самурай: – Сізге біреу сыйлық алып келіп, сіз қабылдамасаңыз, ол кімнің қолында қалады?": "Мудрый самурай: — Если кто-то принесёт вам подарок, а вы его не примете, у кого он останется?", "Шынында да, біреудің ашулы сөзін көңілге алмасаңыз, жүйкеңіз тозбайды.": "И правда, если не принимать близко к сердцу чьи-то злые слова, нервы не будут расшатаны.", "денсаулығыңыз да қалыпты болады": "здоровье тоже будет в порядке", "Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды.": "Потом намылил лицо и руки и долго с удовольствием умывался, пока не кончилась вода.", "– Ей, Сүлгі! – деді Қолжуғыш шыдай алмай.": "— Эй, Полотенце! — не выдержал Умывальник.", "Сабын да қарап тұра алмады.": "Мыло тоже не смогло стоять в стороне.", "Үшеуінің айтысы кешке дейін созылды.": "Спор троих длился до самого вечера.", "Адам қолжуғышқа су құйды.": "Человек налил воды в умывальник.", "Сүлгіге жақсылап сүртінді де, ішке кіріп кетті.": "Хорошенько вытерся полотенцем и ушёл в дом.", "Қарлығашты зерттеуші ғалымдар оның әуеде аузын ашып ұша алатынын анықтаған.": "Учёные, изучающие ласточек, установили, что она может летать с открытым клювом.", "Қатты жылдамдықпен самғап келе жатқан қарлығаштың аузына ауада ұшып жүрген шыбын-шіркейлер өздері кеп түсетін көрінеді, яғни бұл – қарлығаштың «аңшылығы».": "Оказывается, когда ласточка летит на большой скорости, мошки, летающие в воздухе, сами залетают ей в клюв — это и есть «охота» ласточки.", "Әрі-бері самғап, аузын толтырған соң, ол тапқан тамағын балапандарына әкеліп береді.": "Налетавшись туда-сюда и наполнив клюв, она приносит найденную пищу птенцам.", "Сондай-ақ қаншама зиянды шыбын-шіркейді жойып, адамға да көмегін тигізеді.": "Кроме того, уничтожая множество вредных насекомых, она помогает и человеку.", "Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды.": "Если ласточка свьёт гнездо у дома, это считают доброй приметой.", "Оның сырты ескіреді, бірақ ішіндегі ақыл ескірмейді, – депті сонда Қожанасыр.": "Обложка у неё стареет, но мудрость внутри не стареет, — сказал тогда Ходжа Насреддин.", "– Е, достым, не істеп жатырсың?": "— Эй, друг мой, что ты делаешь?", "– Қой, достым, киім ескіреді, бірақ кітап ескірмейді.": "— Не надо, друг мой: одежда стареет, а книга — нет."}, "style_notes": [], "texts": [{"id": "l2v1-t1", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Таңертең белгіленген уақытта ұйқыдан оятатын сағат әр үйде бар. Сағат шырылдаған кезде ұйқысын қимай, өшіре салып, әрі қарай ұйықтай беретін жалқаулар ортамызда аз емес. Осындайлар үшін жас инженерлер ұшатын қоңыраулы сағат ойлап тауыпты. Олар кәдімгі қоңыраулы сағатқа тікұшақтікіндей қанаттар орнатыпты. Қоңырау шырылдағанда, қанаттары айналып, сағатты төбеге көтеріп әкетеді. Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады. Осыдан кейін жалқаулар орнынан тұрмай көрсін?!"]}, {"id": "l2v1-t2", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Кітап оқып, кітаппен дос болып өскен баланың қиялы ұшқыр, кез келген іске алғыр болады. Балаларға арнап шығарма жазу үлкендерге арнап жазғаннан гөрі қиын.", "«Кітап кішкентай баланың қолға ұстап көруіне қызық болуы керек. Көркем безендірілген, бояуы қанық кітаптар баланы көбірек қызықтырады. Балаларға арналған кітапты шығарар алдында маркетингтік зерттеу жүргіземіз. Балалар нені оқиды, қандай кітапқа қызығады, ата-ана қандай дүние іздейді – осының бәрін анықтаймыз.", "Қазіргі кітаптар мәтінмен және суретпен шектелмейді. Олар панорама түрінде ашылып, кітаптың тақырыбына сай баланы қызықтырады. Мысалы, «Теңіз қарақшылары» кітабында кеменің суреті, ханшайым туралы кітапта үлкен сарай бар. Осындай 3D форматтағы кітаптар көбейіп, заман талабына сай түрленіп отырады», – дейді баспа үйінің редакторы."]}, {"id": "l2v1-t3", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Жапонияда орын алған мына оқиға жұртты қайран қалдырған. Бимо атты ит иесімен бірге теледидар көреді. Кезекті жаңалықтардан ит су тасқынына душар болған адамдарды көреді. Сол жаңалықтан соң үйден кетіп қалған итін иесі таба алмай қалады.", "Арада бірнеше ай өткен соң, иттің иесі теледидардан тасқын кезінде құтқарылған адамдар мен жан-жануарларға көмек көрсеткен иттерді марапаттау рәсімін көреді. Олардың арасынан өз итін таниды. Мемлекеттік орындарға хабарласып, итін іздейді. Алайда иесі оны сол күйі таппайды.", "Ең қызығы сол – арада үш жыл өткенде, жоғалып кеткен ит өз үйіне оралған. Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті."]}, {"id": "l2v1-t4", "title": "", "source_note": "", "numbered_paragraphs": true, "paragraphs": ["Сазгер, музыка зерттеушісі Ахмет Жұбанов: «Қазақ күйлерінде шөптің сыбдыры, кең далада келе жатқан жалғыз жолаушының әні, аспанда қалықтап жүрген бүркіт қанатының суылы бар…» – деп ерекше тебірене жазыпты.", "Музыка дегеніміз – сырлы да сиқырлы дыбыс. Ал дыбыс дегеніміз – табиғат. Табиғатсыз тіршілік жоқ болса, дыбыссыз музыка жоқ. Әуен көптеген сансыз дыбыстан құралады. Табиғаттағы жаңбыр, дауыл, жел үні, су сылдыры, құстар әні, аңдардың дауысы, қимылына еліктеуден әуен құралады.", "Жақсы ән мен сазды музыка – жан азығы. Әсем ән, сазды музыканың ықпалынан қанайналым жүйесі, зат алмасу процесі жақсарады. Музыка көңілді көтереді, қайғыны жеңілдетеді, бойды сергітеді, жанға жайлы эмоция сыйлайды.", "Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған. Музыка ми зейіндерін жақсартады екен. Шығыстың ұлы емшісі Авиценна музыканың адамды емдейтін емдік қасиеті бар екенін айтқан. Ертеде әуеннің көмегімен күйзелісті, қайғы-қасіретті емдеген.", "Музыкалық аспапта ойнаған кезде адамның қабілеттері ашыла түседі. Сонымен қатар музыкамен айналысқан адам шет тілдерін жақсы меңгереді екен."]}, {"id": "l2v1-t5", "title": "Асанәлі Әшімов – театр және кино өнеріндегі ерекше талант иесі", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["1. – Асанәлі аға, сіз атақты адамсыз. Бүкіл жұрт сізді біледі, бірақ ешкім біле бермейтін бала Асанәлі туралы айтсаңыз...", "– Бала Асанәлінің балалық шағы ауыр болды, өйткені ол уақытта соғыс жүріп жатты. Ауылдың барлық ер-азаматы соғысқа кетті, жұмыс істей алатын қарттардың, аналардың, балалардың барлығы жұмыс істеді. Бала Асанәлі егінде жұмыс істеді. Аяқкиімі болмағандықтан, кейде мектепке жалаңаяқ баратын... Бірақ қанша ауырлық көрсе де, өмір оны қайсар, жігерлі қылып өсірді...", "2. – Өміріңізде анаңыздың рөлі қандай?", "– Анам еңбекқор, мейірімді, қарапайым адам болды. Колхоз жұмысын істеді. Әкем соғыстан келмеді. Мені жалғыз өзі өсірді. Үнемі еңбек ету керек, білім алу қажет деп айтты. Мен қалаған оқуыма түсе алмадым, сол себепті театр және кино әртістерін даярлайтын бөлімге оқуға түстім.", "3. – Балалық шағыңызда қандай ойындар ойнадыңыз?", "– Соғыс жүріп жатқандықтан, бізде ойыншық деген болған жоқ. Балалар жұмыс істеп жүріп те ойнай алдық. Сол кезде «Қызыл май» ойынын ойнадық, ол – қазіргі хоккей. Сиырдың жүнінен доп жасап, доп ойнадық.", "4. – Балаларға қандай кеңес берер едіңіз?", "– Адам болам деген бала ата-анасын тыңдап, жақсы оқып, болашағын кішкентайынан ойлайды. Балаларға айтарым: оқы, оқы және тағы оқы... Оқысаң, білімді болсаң, елге де көмегің тиеді."]}, {"id": "l2v1-t6", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Қарт самурай өз шәкірттерін білімді, ақылды етіп тәрбиелейді. Бір күні сабаққа өзінің тәртіпсіздігімен, қатыгездігімен елге аты жайылған жауынгер келеді. Оның өзіндік әскери тактикасы болатын. Ол қарсыласына ауыр сөздер айтып, ызаландырады. Ызаланған қарсыласы жекпе-жекке шығып, қателіктер жіберіп, жеңілетін.", "Бұл жолы да жауынгер қарт самурайды ызаландыру үшін ауыр, балағат сөздерін жаудырады. Алайда самурай оған қалт етпейді. Әлгі жігіт үш рет қайталап көреді. Самурай сабағын жалғастыра береді. Ызаланған жауынгер есікті теуіп, кетіп қалады.", "Мұны бақылаған шәкірттері самурайдан: «Ұстаз, неге оның мұндай тәртіпсіздігіне жауап бермедіңіз? Оны жекпе-жекке шақыру керек еді!» – деп ызаланады.", "Дана самурай: – Сізге біреу сыйлық алып келіп, сіз қабылдамасаңыз, ол **кімнің** қолында қалады? – деп сұрайды.", "– Өзінің иесінде, – деп жауап береді шәкірттері.", "– Бұл қызғаныш, ашу, кемсіту мен мысқылға да қатысты. Оларды қабылдамасаң, барлығы өз иесінде қалады, – дейді самурай.", "Шынында да, біреудің ашулы сөзін көңілге алмасаңыз, жүйкеңіз тозбайды. ___(15)___ денсаулығыңыз да қалыпты болады. Бұл әңгіме адамды кешірімді болуға шақырады."]}, {"id": "l2v1-t7", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Адам қолжуғышқа су құйды. Одан кейін беті-қолын сабындап, су біткенше рақаттанып, ұзақ жуынды. Сүлгіге жақсылап сүртінді де, ішке кіріп кетті.", "– Көрдіңдер ме, адамдарға менен зор қызмет ететіндерің жоқ десе, жеңістік бермейсіңдер. Әне, беті-қолын сүртіп едім, тап-таза болып шыға келді, – деді Сүлгі кеудесін соғып.", "– Ей, Сүлгі! – деді Қолжуғыш шыдай алмай. Ашуланғаны соншалық – қақпағы жерге түсіп кете жаздады. – Сен несіне кеудеңді көкке керіп тұрсың? Адам жуыну үшін бірінші кімге келеді? Маған. Келгенімен тұрмай, иіліп сәлем береді. Ал мен оны жақсылап жуындырып жіберемін.", "Сабын да қарап тұра алмады. Мұның да ашуланғаны сондай – тұла бойы көпіршік атты. – Менсіз адамның күні бар ма?! Жоқ! Қандай кірің болса да, жойып жіберемін. Сондықтан адамға менен қымбат ештеңе жоқ.", "Үшеуінің айтысы кешке дейін созылды. Бірінен-бірі қалғысы, жеңілгісі келмеді.", "Алайда бұлардың қасына кешке дейін ешкім жолаған жоқ. Өйткені ___(17)___."]}, {"id": "l2v1-t8", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Қарлығашты зерттеуші ғалымдар оның әуеде аузын ашып ұша алатынын анықтаған. Ол бекер емес екен. Қатты жылдамдықпен самғап келе жатқан қарлығаштың аузына ауада ұшып жүрген шыбын-шіркейлер өздері кеп түсетін көрінеді, яғни бұл – қарлығаштың «аңшылығы». Әрі-бері самғап, аузын толтырған соң, ол тапқан тамағын балапандарына әкеліп береді. Сөйтіп күні бойы ұшып жүріп аңшылық жасайтын қарлығаш өзін де, балапандарын да тойдыратын көрінеді.", "Сондай-ақ қаншама зиянды шыбын-шіркейді жойып, адамға да көмегін тигізеді. Халқымыз қарлығашты киелі құс санайды. Үйіне қарлығаш ұя салса, оны жақсы ырымға балайды."]}, {"id": "l2v1-t9", "title": "", "source_note": "", "numbered_paragraphs": false, "paragraphs": ["Бір күні Қожанасыр досынікіне келсе, ол үйін тазалап жатыр екен. Қожа одан:", "– Е, достым, не істеп жатырсың? – деп сұрайды.", "– Ә, Қожа екенсің ғой! Ескі киім, қағаз, кітап – бәрін өртейін деп жатырмын, – дейді досы.", "– Қой, достым, киім ескіреді, бірақ кітап ескірмейді. Оның сырты ескіреді, бірақ ішіндегі ақыл ескірмейді, – депті сонда Қожанасыр."]}], "items": [{"id": "l2v1-q21", "number": 1, "text_id": "l2v1-t1", "stem": "Мәтіндегі сағаттың ерекшелігі неде?", "options": {"A": "әндетуінде", "B": "батареядан қуат алуында", "C": "кез келген үйде болуында", "D": "қалықтауында"}, "key": "D", "skill": "A1", "skill_name": "Нақты деректі табу", "level": 1, "negative": false, "fixed_order": false, "evidence": ["Олар кәдімгі қоңыраулы сағатқа тікұшақтікіндей қанаттар орнатыпты.", "Қоңырау шырылдағанда, қанаттары айналып, сағатты төбеге көтеріп әкетеді."], "explanation": "Сағатқа тікұшақтікіндей қанаттар орнатылған: қоңырау шырылдағанда ол төбеге ұшып көтеріледі. «Қалықтау» – ауада ұшып, бір орында тұру деген сөз.", "explanation_ru": "К часам приделали крылья, как у вертолёта: когда звенит звонок, они взлетают к потолку. «Қалықтау» значит «парить, держаться в воздухе».", "distractor_notes": {"A": "мәтінде сағаттың ән айтатыны туралы айтылмайды, ол тек шырылдайды.", "B": "батареядан кез келген сағат жұмыс істейді. Мәтінде батарея «кәдімгі» деп аталады, яғни бұл ерекшелік емес.", "C": "«әр үйде бар» деп кәдімгі оятқыш сағат туралы айтылады, ал ұшатын сағат – жаңа өнертабыс."}, "distractor_notes_ru": {"A": "В тексте не сказано, что часы поют — они только звенят.", "B": "От батареек работают любые часы. В тексте батарейки названы «обычными», значит, это не особенность.", "C": "«Есть в каждом доме» сказано об обычном будильнике, а летающие часы — новое изобретение."}, "distractor_evidence": {"A": ["Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады."], "B": ["Кәдімгі екі кішкентай батареямен жұмыс істейтін сағат төбеде үш минут бойы шырылдап тұра алады."], "C": ["Таңертең белгіленген уақытта ұйқыдан оятатын сағат әр үйде бар."]}, "keywords": {"ok": {"kk": ["тікұшақтікіндей қанаттар", "төбеге көтеріп әкетеді"], "ru": ["как у вертолёта", "поднимают часы к потолку"]}, "A": {"kk": ["шырылдап"], "ru": ["звенеть"]}, "B": {"kk": ["Кәдімгі екі кішкентай батареямен"], "ru": ["двух обычных маленьких батарейках"]}, "C": {"kk": ["әр үйде бар"], "ru": ["в каждом доме"]}}, "editor_changes": ""}, {"id": "l2v1-q22", "number": 2, "text_id": "l2v1-t2", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?\n1. Балалар кітабын жазу кезінде балалар мен ересектердің қалауы ескеріледі.\n2. Балаларды қызықтыру мақсатында кітаптар түрлі дизайнда шығарылады.", "options": {"A": "тек біріншісі", "B": "тек екіншісі", "C": "екеуі де дұрыс", "D": "екеуі де бұрыс"}, "key": "C", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": true, "evidence": ["Балалар нені оқиды, қандай кітапқа қызығады, ата-ана қандай дүние іздейді – осының бәрін анықтаймыз.", "Олар панорама түрінде ашылып, кітаптың тақырыбына сай баланы қызықтырады."], "explanation": "Екі тұжырым да мәтінде бар. Баспа кітап шығарар алдында балалардың да, ата-аналардың да қалауын зерттейді (1). Кітаптар панорама, 3D сияқты түрлі дизайнмен шығады (2).", "explanation_ru": "Оба утверждения есть в тексте. Перед выпуском книги издательство изучает желания и детей, и родителей (1). Книги выходят в разном оформлении — панорамы, 3D (2).", "distractor_notes": {"A": "екінші тұжырымды да мәтінмен салыстырып көр: кітаптардың безендірілуі туралы мәтіннің соңғы бөлігін қайта оқы.", "B": "бірінші тұжырымды да мәтінмен салыстырып көр: баспа кітап шығарар алдында нені зерттейтінін қайта оқы.", "D": "тұжырымдардың кем дегенде біреуі мәтінде бар. Әрқайсысын мәтінмен жеке-жеке салыстыр."}, "distractor_notes_ru": {"A": "Сравни с текстом и второе утверждение: перечитай последнюю часть текста — об оформлении книг.", "B": "Сравни с текстом и первое утверждение: перечитай, что изучает издательство перед выпуском книги.", "D": "Хотя бы одно из утверждений есть в тексте. Сравни каждое с текстом отдельно."}, "distractor_evidence": {"A": [], "B": [], "D": []}, "keywords": {"ok": {"kk": ["Балалар нені оқиды", "ата-ана қандай дүние іздейді", "панорама түрінде"], "ru": ["что читают дети", "что ищут родители", "в виде панорамы"]}}, "editor_changes": ""}, {"id": "l2v1-q23", "number": 3, "text_id": "l2v1-t3", "stem": "Мәтін не туралы?\n... ит туралы", "options": {"A": "жоғалған", "B": "күзетші", "C": "қабаған", "D": "қайырымды"}, "key": "D", "skill": "C1", "skill_name": "Негізгі ой, тақырып, атау", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті.", "Арада бірнеше ай өткен соң, иттің иесі теледидардан тасқын кезінде құтқарылған адамдар мен жан-жануарларға көмек көрсеткен иттерді марапаттау рәсімін көреді."], "explanation": "Мәтіннің басты оқиғасы – Бимоның тасқын кезінде адамдарға көмектесіп, оларды құтқаруы. Ол үшін ит марапатталды. Демек, мәтін қайырымды ит туралы.", "explanation_ru": "Главное в тексте — Бимо во время наводнения помогал людям и спасал их, за это его наградили. Значит, текст о доброй собаке.", "distractor_notes": {"A": "ит шынымен жоғалып кетті, бірақ бұл – мәтіннің бір бөлігі ғана. Мәтіннің басты оқиғасы неде екенін ойлан.", "B": "мәтінде Бимоның үй күзеткені туралы айтылмайды.", "C": "мәтінде иттің ашулы, қабаған екені туралы айтылмайды."}, "distractor_notes_ru": {"A": "Собака действительно пропала, но это лишь часть текста. Подумай, какое событие в тексте главное.", "B": "В тексте не сказано, что Бимо охранял дом.", "C": "В тексте не сказано, что собака была злой и кусачей."}, "distractor_evidence": {"A": ["Сол жаңалықтан соң үйден кетіп қалған итін иесі таба алмай қалады."], "B": [], "C": []}, "keywords": {"ok": {"kk": ["зардап шеккендерге көмектесіп", "адамдарды апаттан арашалап", "көмек көрсеткен иттерді марапаттау"], "ru": ["помогавшим пострадавшим", "спасавшим людей", "награждения собак"]}, "A": {"kk": ["таба алмай қалады"], "ru": ["не может её найти"]}}, "editor_changes": ""}, {"id": "l2v1-q24", "number": 4, "text_id": "l2v1-t3", "stem": "Қай ақпарат мәтін мазмұнына сәйкес келеді?", "options": {"A": "Арнайы ұйым ит туралы ақпаратты жасырды.", "B": "Бимо өзінің иесіне деген адалдығын көрсетті.", "C": "Бимо жаңалықтарға шығу үшін қауіпті жерге барды.", "D": "Жапондар Бимоның ерлігі туралы ертегі шығарды."}, "key": "B", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Ең қызығы сол – арада үш жыл өткенде, жоғалып кеткен ит өз үйіне оралған."], "explanation": "Бимо үш жылдан кейін өз үйіне, иесіне қайтып оралды. Бұл – иесіне деген адалдығының белгісі.", "explanation_ru": "Через три года Бимо вернулся домой, к хозяину. Это знак его верности хозяину.", "distractor_notes": {"A": "мәтінде ешкімнің ақпаратты жасырғаны айтылмайды. Иесі хабарласқанымен, итті таба алмаған.", "C": "Бимо жаңалыққа шығу үшін емес, тасқыннан зардап шеккендерге көмектесу үшін барды.", "D": "мәтінде ертегі емес, «хикая», яғни болған оқиға туралы әңгіме ел ішіне тарағаны айтылады."}, "distractor_notes_ru": {"A": "В тексте не сказано, что кто-то скрывал информацию. Хозяин обращался в органы, но не смог найти собаку.", "C": "Бимо пошёл не ради того, чтобы попасть в новости, а чтобы помогать пострадавшим от наводнения.", "D": "В тексте говорится не о сказке, а о «хикая» — рассказе о реальном случае, который разошёлся по стране."}, "distractor_evidence": {"A": ["Мемлекеттік орындарға хабарласып, итін іздейді."], "C": ["Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті."], "D": ["Тасқын кезінде зардап шеккендерге көмектесіп, адамдарды апаттан арашалап келген итімен мақтанған жапондықтың иті туралы хикая ел ішіне жайылып кетті."]}, "keywords": {"ok": {"kk": ["үш жыл өткенде", "өз үйіне оралған"], "ru": ["через три года", "вернулась домой"]}, "A": {"kk": ["хабарласып, итін іздейді"], "ru": ["обращается в государственные органы"]}, "C": {"kk": ["зардап шеккендерге көмектесіп"], "ru": ["помогавшим пострадавшим"]}, "D": {"kk": ["хикая ел ішіне жайылып кетті"], "ru": ["разошлась по всей стране"]}}, "editor_changes": ""}, {"id": "l2v1-q25", "number": 5, "text_id": "l2v1-t4", "stem": "Қай абзацта музыкаға түсініктеме беріледі?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "key": "B", "skill": "A3", "skill_name": "Ақпараттың орнын табу", "level": 1, "negative": false, "fixed_order": true, "evidence": ["Музыка дегеніміз – сырлы да сиқырлы дыбыс. (2-азатжол)"], "explanation": "«Музыка дегеніміз – …» деген сөйлем – музыкаға берілген түсініктеме, яғни анықтама. Ол 2-азатжолда тұр.", "explanation_ru": "Предложение «Музыка — это…» — объяснение, то есть определение музыки. Оно во 2-м абзаце.", "distractor_notes": {"A": "1-азатжолда Ахмет Жұбановтың қазақ күйлері туралы сөзі келтірілген, музыкаға анықтама берілмейді.", "C": "3-азатжолда музыканың адамға пайдасы айтылады, анықтама берілмейді.", "D": "4-азатжолда ғалымдардың музыканың миға әсері туралы зерттеуі айтылады."}, "distractor_notes_ru": {"A": "В 1-м абзаце приведены слова Ахмета Жубанова о казахских кюях, определения музыки нет.", "C": "В 3-м абзаце говорится о пользе музыки для человека, а не о том, что такое музыка.", "D": "В 4-м абзаце рассказывается об исследованиях учёных о влиянии музыки на мозг."}, "distractor_evidence": {"A": ["Сазгер, музыка зерттеушісі Ахмет Жұбанов: «Қазақ күйлерінде шөптің сыбдыры, кең далада келе жатқан жалғыз жолаушының әні, аспанда қалықтап жүрген бүркіт қанатының суылы бар…» – деп ерекше тебірене жазыпты."], "C": ["Жақсы ән мен сазды музыка – жан азығы."], "D": ["Ғалымдар музыканың адамның ми жүйесіне әсер ететінін анықтаған."]}, "keywords": {"ok": {"kk": ["Музыка дегеніміз"], "ru": ["Музыка — это"]}, "A": {"kk": ["Қазақ күйлерінде"], "ru": ["казахских кюях"]}, "C": {"kk": ["жан азығы"], "ru": ["пища для души"]}, "D": {"kk": ["ми жүйесіне әсер ететінін"], "ru": ["влияет на мозг"]}}, "editor_changes": ""}, {"id": "l2v1-q26", "number": 6, "text_id": "l2v1-t4", "stem": "Қай ақпарат мәтін мазмұнына сай келеді?", "options": {"A": "Жанды әуен адамның денсаулығына әсер ете алады.", "B": "Музыка адамдардың көңіл көтеруіне ғана арналған.", "C": "Табиғаттағы сан алуан дыбыс жанға жайлылық береді.", "D": "Тілшілер музыкалық аспаптарда өте шебер ойнаған."}, "key": "A", "skill": "B3", "skill_name": "Тұжырымды мәтінмен салыстыру", "level": 2, "negative": false, "fixed_order": false, "evidence": ["Әсем ән, сазды музыканың ықпалынан қанайналым жүйесі, зат алмасу процесі жақсарады. (3-азатжол)", "Ертеде әуеннің көмегімен күйзелісті, қайғы-қасіретті емдеген. (4-азатжол)"], "explanation": "Мәтінде музыканың қанайналым мен зат алмасуды жақсартатыны, ертеде күйзелісті емдегені айтылады. Демек, әуен денсаулыққа әсер ете алады.", "explanation_ru": "В тексте сказано, что музыка улучшает кровообращение и обмен веществ, а в древности ею лечили стресс. Значит, мелодия может влиять на здоровье.", "distractor_notes": {"B": "«ғана» деген сөзге назар аудар. Мәтінде музыканың көңіл көтеруден басқа да пайдасы айтылады.", "C": "мәтінде табиғат дыбыстарынан әуен құралатыны айтылады. Ал жанға жайлы эмоцияны табиғат емес, музыка сыйлайды.", "D": "мәтінде тілшілер (журналистер) туралы айтылмайды. Музыкамен айналысқан адам шет
