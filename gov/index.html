<title>Мемлекеттік қызметтегі қазақ тілі – aitil</title>
<meta name="description" content="Мемлекеттік қызметтегі қазақ тілі: сөздік, тірек сөйлемдер, мәтін және сөйлеу жаттығулары.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Курс бетінің (nzm-bil) түстері мен қаріптері */
:root{
  --paper:#F4F6F9; --panel:#FFFFFF; --ink:#18212E; --muted:#596476; --line:#DCE1E8;
  --accent:#1D5BA6; --accent-soft:#E3ECF7; --ok:#1C7A4E; --ok-soft:#E1F2E9; --bad:#B23A30; --bad-soft:#F8E4E2;
  --warn-soft:#FFF4D6; --warn:#8A5A00;
  --f-text:"PT Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E;
  --warn-soft:#3A2F12; --warn:#F2C76B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E;
  --warn-soft:#3A2F12; --warn:#F2C76B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:17px;line-height:1.5;caret-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:1100px}
.brand{margin-right:auto;font-weight:800;font-size:22px;letter-spacing:-.3px;text-decoration:none;color:var(--ink)}
.brand .ai{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}

main{padding-block:22px 48px}
.eyebrow{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--f-text);font-size:30px;line-height:1.2;margin:6px 0 10px}
h2{font-family:var(--f-text);font-size:24px;line-height:1.25;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;text-decoration:none;color:var(--ink);min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px;min-height:40px}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1}
.back{margin:-6px 0 8px -6px}
/* Модуль мен сабақ */
.module{border-left:4px solid var(--accent)}
.module .mnum{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.lesson{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--paper)}
.lesson h3{margin:0 0 6px;font-family:var(--f-text);font-size:21px}
.goal{margin:0 0 12px;color:var(--muted);font-size:15.5px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{font-size:14px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14.5px}
.note a{color:inherit;font-weight:700}
/* Сабақ бөлімдері */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin:4px 0 18px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 6px;font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button small{font-weight:600;font-size:11.5px}
.tabs button[aria-current="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tabs button.done{color:var(--ok)}
.step{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
/* Сөз карточкасы */
.flip{perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip .in{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flip .back{transform:rotateY(180deg);border-color:var(--accent)}
.flip .ru{font-size:26px;font-weight:700}
.flip .kk{font-family:var(--f-text);font-size:30px;font-weight:700;color:var(--accent)}
.flip .col{font-size:15px;color:var(--muted)}
.flip .ex{font-family:var(--f-text);font-size:18px}
.flip .tap{font-size:13px;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
/* Тапсырма */
.prompt{font-family:var(--f-text);font-size:22px;line-height:1.35;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:13px 14px;font-size:17px;min-height:52px}
.opt b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:16px}
.fb h4{margin:0 0 4px;font-size:16px}
.fb.ok{background:var(--ok-soft)} .fb.ok h4{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad h4{color:var(--bad)}
.fb.hint{background:var(--warn-soft)} .fb.hint h4{color:var(--warn)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
/* Тірек сөйлемдер */
.phr{border-top:1px solid var(--line);padding:12px 0}
.phr:first-of-type{border-top:0}
.phr .k{font-family:var(--f-text);font-size:20px;line-height:1.35}
.phr .r{color:var(--muted);font-size:15px;margin-top:2px}
/* Мәтін */
.text p{font-family:var(--f-text);font-size:19px;line-height:1.6;margin:0 0 12px;text-indent:1.4em;text-align:justify;hyphens:auto}
.text .pn{display:inline-block;min-width:1.6em;font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--muted);text-indent:0}
details.peek{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.peek summary{padding:10px 14px;font-weight:700;color:var(--accent);cursor:pointer}
details.peek .text{padding:0 14px 6px}
/* Сөйлеу */
.sit{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px}
.sit .t{font-weight:700;font-size:17px}
.sit .m{font-size:13.5px;color:var(--muted)}
.sit .st{margin-left:auto;font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;font-size:16px}
.box b.lbl{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.box.know{background:var(--accent-soft)} .box.know b.lbl{color:var(--accent)}
.bubble{background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;font-family:var(--f-text);font-size:18px;line-height:1.4}
.bubble small{display:block;font-family:var(--f-ui);font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;text-align:center;letter-spacing:1px}
.timer.run{color:var(--bad)}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
audio{width:100%}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:16.5px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.model{font-family:var(--f-text);font-size:18px;line-height:1.5;background:var(--ok-soft);border-radius:10px;padding:14px}
.score{font-size:40px;font-weight:800;color:var(--accent)}
/* Кіру / тіркелу */
.auth{max-width:440px;margin:0 auto}
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.atabs button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.atabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.gbtn{width:100%;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.af{display:flex;flex-direction:column;gap:12px}
.af label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
.af input{font:inherit;font-weight:400;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px;min-height:48px;caret-color:auto}
.af .hint{font-weight:400;font-size:13.5px;color:var(--muted)}
.af .err{color:var(--bad);font-size:14.5px;margin:0;min-height:1em}
.userbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){
  body{font-size:16.5px} h1{font-size:26px} h2{font-size:21px} .prompt{font-size:20px}
  .tabs button{font-size:12.5px;padding:7px 4px} .flip .kk{font-size:27px} .flip .ru{font-size:23px}
  .userbtn{max-width:40vw}
}

/* 2-сабақ: блиц, сұрақ түрлері, құлыпталған сабақ, дереккөздер */
.lesson.locked{opacity:.65}
.lesson .lockrow{margin:0}
.blword{display:block;font-family:var(--f-text);font-size:32px;font-weight:700;color:var(--accent);text-align:center;padding:6px 0}
.qt-ex{font-family:var(--f-text);font-size:24px;line-height:1.35;padding:8px 0}
.phr-avoid .phr .k{color:var(--bad)}
.sources{margin-top:22px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sources b{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.sources a{color:var(--accent);text-decoration:none}
.sources a:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../" title="aitil"><span class="ai">ai</span>til</a>
  <button type="button" class="userbtn" id="user" hidden></button>
  <button type="button" class="icon" id="themeBtn" aria-label="Тақырып">☾</button>
  <div class="seg" role="group" aria-label="Interface language"><button type="button" data-lang="kk">ҚАЗ</button><button type="button" data-lang="ru">РУС</button></div>
</div></header>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* Сабақтардың мазмұны content/*.json файлдарынан өзгеріссіз енгізіледі (build_public.py) */
const LESSONS = [{"id": "gov-kz-L1-refusal-v1", "course": {"id": "gov-kazakh", "title": "Мемлекеттік қызметтегі қазақ тілі", "title_ru": "Казахский язык на государственной службе", "module": {"id": "auyr-dialog", "number": 1, "title": "Ауыр диалог", "title_ru": "Трудный диалог"}}, "lesson": {"number": 1, "title": "Сыпайы бас тарту", "title_ru": "Вежливый отказ", "goal": "Заң рұқсат етпейтін өтінішке 1 минутта сыпайы бас тартып, балама жол ұсыну.", "steps": ["Түсіну", "Бас тарту + себебі", "Балама", "Келесі қадам"]}, "vocabulary": [{"id": "v1", "word": "өтініш", "ru": "обращение, заявление", "collocation": "өтініш беру / қабылдау / тіркеу", "example": "Азамат өтініш берді."}, {"id": "v2", "word": "бас тарту", "ru": "отказать(ся)", "collocation": "-дан / -ден бас тарту", "example": "Мекеме өтініштен бас тартты."}, {"id": "v3", "word": "өкінішке орай", "ru": "к сожалению", "collocation": "сөйлем басында", "example": "Өкінішке орай, бұл мүмкін емес."}, {"id": "v4", "word": "заң бойынша", "ru": "по закону", "collocation": "заң бойынша рұқсат етілмейді", "example": "Заң бойынша кезек өзгермейді."}, {"id": "v5", "word": "өкілеттік", "ru": "полномочие", "collocation": "өкілеттігі бар / жоқ", "example": "Әкімдіктің мұндай өкілеттігі жоқ."}, {"id": "v6", "word": "құзырет", "ru": "компетенция", "collocation": "құзыретіне жатады / жатпайды", "example": "Бұл соттың құзыретіне жатады."}, {"id": "v7", "word": "балама", "ru": "альтернатива", "collocation": "балама жол, балама шешім", "example": "Біз балама жол табамыз."}, {"id": "v8", "word": "есесіне", "ru": "зато, взамен", "collocation": "екінші сөйлем басында", "example": "Тегін бере алмаймыз, есесіне жеңілдік бар."}, {"id": "v9", "word": "ұсыну", "ru": "предлагать", "collocation": "жол / көмек / балама ұсыну", "example": "Сізге басқа бағдарламаны ұсынамын."}, {"id": "v10", "word": "тіркеу", "ru": "регистрировать", "collocation": "өтінішті тіркеу", "example": "Өтініш бүгін тіркелді."}, {"id": "v11", "word": "тапсырма беру", "ru": "дать поручение", "collocation": "-ға / -ге тапсырма беру", "example": "Бөлім басшысына тапсырма бердім."}, {"id": "v12", "word": "хабарласу", "ru": "связаться", "collocation": "-ға / -ге хабарласу", "example": "Үш күн ішінде сізге хабарласамыз."}], "key_phrases": [{"step": 1, "kk": "Сіздің жағдайыңызды түсініп отырмын.", "ru": "Я понимаю вашу ситуацию."}, {"step": 1, "kk": "Мәселені ашық айтқаныңызға рахмет.", "ru": "Спасибо, что открыто сказали о проблеме."}, {"step": 1, "kk": "Бұл сіз үшін маңызды екенін білемін.", "ru": "Знаю, что для вас это важно."}, {"step": 2, "kk": "Өкінішке орай, бұл мүмкін емес.", "ru": "К сожалению, это невозможно."}, {"step": 2, "kk": "Заң бойынша бізде мұндай өкілеттік жоқ.", "ru": "По закону у нас нет таких полномочий."}, {"step": 2, "kk": "Бұл мәселе біздің құзыретімізге жатпайды.", "ru": "Этот вопрос не входит в нашу компетенцию."}, {"step": 3, "kk": "Есесіне мынадай жол бар: …", "ru": "Зато есть такой путь: …"}, {"step": 3, "kk": "Сізге … ұсына аламын.", "ru": "Могу предложить вам …"}, {"step": 3, "kk": "Бұл мәселені … арқылы шешуге болады.", "ru": "Этот вопрос можно решить через …"}, {"step": 4, "kk": "Өтінішіңізді ресми түрде тіркеп берейік.", "ru": "Давайте официально зарегистрируем ваше обращение."}, {"step": 4, "kk": "Жауапты маманға тапсырма беремін.", "ru": "Дам поручение ответственному специалисту."}, {"step": 4, "kk": "… күн ішінде сізге хабарласамыз.", "ru": "В течение … дней мы с вами свяжемся."}, {"step": "pressure", "kk": "Бұл сіздің құқығыңыз, бірақ шешім заң бойынша қабылданады.", "ru": "Это ваше право, но решение принимается по закону."}, {"step": "pressure", "kk": "Шағымыңызға жауап берілмегені үшін кешірім сұраймын.", "ru": "Прошу прощения, что на вашу жалобу не ответили."}], "reading": {"id": "r", "title": "Жақсы басшы «жоқ» деп қалай айтады?", "paragraphs": ["Мемлекеттік қызметкер күн сайын азаматтардың өтінішін қабылдайды. Олардың көбін орындауға болады, бірақ кейбір өтініштер заңға қайшы келеді. Мұндай жағдайда басшы бас тартуға мәжбүр. Бұл — оңай іс емес. Көмек сұрап келген адамға «жоқ» деген жауапты есту ауыр.", "Тәжірибелі басшы бірден «жоқ» демейді. Алдымен азаматты мұқият тыңдап, оның жағдайын түсінетінін айтады. Сосын ашық айтады: «Өкінішке орай, бұл өтінішті орындау мүмкін емес». Және себебін түсіндіреді: заң бойынша мекеменің мұндай өкілеттігі жоқ немесе бұл мәселе оның құзыретіне жатпайды.", "Бірақ әңгіме осымен бітпейді. Жақсы басшы әрдайым балама іздейді. Есесіне азаматқа басқа жол ұсынады: жаңа бағдарламаны, басқа мекемені немесе мәселені шешудің заңды тәсілін. Соңында өтінішті ресми түрде тіркеп, жауапты маманға тапсырма береді. Азаматқа қашан хабарласатынын да нақты айтады.", "Мұндай басшыдан азамат ренжіп кетпейді. Себебі ол өзін тыңдағанын, құрметтегенін және көмектесуге тырысқанын көреді. Сыпайы бас тарту — азаматтың сенімін сақтаудың жолы."]}, "items": [{"id": "gov1-v1", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«өтініш» сөзінің мағынасы:", "options": ["обращение, заявление", "полномочие", "альтернатива", "поручение"], "answer": 0, "hint": "Азамат мекемеге не береді?", "explanation": "Өтініш — обращение, заявление. Тіркесі: өтініш беру, қабылдау, тіркеу."}, {"id": "gov1-v2", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«бас тарту» сөзінің мағынасы:", "options": ["предлагать", "отказать", "связаться", "регистрировать"], "answer": 1, "hint": "«Жоқ» деп жауап беру.", "explanation": "Бас тарту — отказать. Тіркесі: -дан / -ден бас тарту."}, {"id": "gov1-v3", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«өкінішке орай» сөзінің мағынасы:", "options": ["по закону", "зато", "к сожалению", "в течение"], "answer": 2, "hint": "Жаман жаңалықтың алдында айтылады.", "explanation": "Өкінішке орай — к сожалению."}, {"id": "gov1-v4", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«заң бойынша» сөзінің мағынасы:", "options": ["по закону", "по v11", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«тапсырма беру» сөзінің мағынасы:", "options": ["получить задание", "дать поручение", "сдать отчёт", "принять решение"], "answer": 1, "hint": "Басшы маманға ...", "explanation": "Тапсырма беру — дать поручение. Тіркесі: -ға / -ге тапсырма беру."}, {"id": "gov1-v12", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«хабарласу» сөзінің мағынасы:", "options": ["связаться", "сообщить в СМИ", "пожаловаться", "встретиться"], "answer": 0, "hint": "Үш күн ішінде сізге ...", "explanation": "Хабарласу — связаться. Тіркесі: -ға / -ге хабарласу."}, {"id": "gov1-g1", "section": "grammar", "skill": "G", "level": 2, "type": "mcq", "prompt": "Бұл мәселе біздің ___ жатпайды.", "options": ["құзыретімізге", "құзыретімізде", "құзыретімізді", "құзыретіміз"], "answer": 0, "hint": "«Жатпайды» етістігі қай септікті талап етеді?", "explanation": "«Жату / жатпау» барыс септігін (-ға / -ге) талап етеді: құзыретімізге жатпайды."}, {"id": "gov1-g2", "section": "grammar", "skill": "G", "level": 1, "type": "mcq", "prompt": "___, бұл өтінішті орындау мүмкін емес.", "options": ["Есесіне", "Өкінішке орай", "Мысалы", "Сондай-ақ"], "answer": 1, "hint": "Жаман жаңалықты жұмсартатын сөз.", "explanation": "Бас тартуды «Өкінішке орай» деп бастаймыз."}, {"id": "gov1-g3", "section": "grammar", "skill": "G", "level": 2, "type": "mcq", "prompt": "Тегін бере алмаймыз, ___ жеңілдік бар.", "options": ["өйткені", "сондай-ақ", "есесіне", "мысалы"], "answer": 2, "hint": "Бас тартудан кейін балама ұсынамыз.", "explanation": "«Есесіне» баламаны енгізеді: бере алмаймыз, есесіне жеңілдік бар."}, {"id": "gov1-g4", "section": "grammar", "skill": "G", "level": 2, "type": "mcq", "prompt": "Әкімдіктің мұндай ___ жоқ.", "options": ["өкілеттік", "өкілеттігі", "өкілеттікке", "өкілеттікті"], "answer": 1, "hint": "«Әкімдіктің» — ілік септік. Оның жұбы тәуелдік жалғау алады.", "explanation": "Ілік септік + тәуелдік: әкімдіктің өкілеттігі жоқ."}, {"id": "gov1-g5", "section": "grammar", "skill": "G", "level": 2, "type": "mcq", "prompt": "Өтінішіңізді бүгін ___ береміз.", "options": ["тіркеу", "тіркеді", "тіркеп", "тіркейміз"], "answer": 2, "hint": "«Беру» көмекші етістігінің алдында көсемше (-п) келеді.", "explanation": "Тіркеп беру — көсемше + көмекші етістік: іс-әрекет біреу үшін орындалады."}, {"id": "gov1-g6", "section": "grammar", "skill": "G", "level": 1, "type": "mcq", "prompt": "Үш күн ішінде сізге ___.", "options": ["хабарласты", "хабарласамыз", "хабарласу", "хабарлассаңыз"], "answer": 1, "hint": "Келешекте кім хабарласады? Біз.", "explanation": "Уәде келер шақпен беріледі: хабарласамыз."}, {"id": "gov1-g7", "section": "grammar", "skill": "V", "level": 3, "type": "mcq", "prompt": "Бұл сұрақ соттың ___ жатады.", "options": ["өкілеттігіне", "құзыретіне", "өтінішіне", "баламасына"], "answer": 1, "hint": "Мекеме қандай мәселелермен айналысады — сала.", "explanation": "Сала, мәселе түрі туралы — құзырет: соттың құзыретіне жатады. Өкілеттік — нақты құқық (рұқсат беру, айыппұл салу)."}, {"id": "gov1-r1", "section": "reading", "skill": "R", "level": 1, "type": "mcq", "prompt": "Неліктен басшы кейде бас тартуға мәжбүр?", "options": ["Кейбір өтініштер заңға қайшы келеді", "Азамат дөрекі сөйлейді", "Басшының уақыты жоқ", "Өтініш тіркелмеген"], "answer": 0, "hint": "1-абзац.", "explanation": "Мәтінде: «кейбір өтініштер заңға қайшы келеді. Мұндай жағдайда басшы бас тартуға мәжбүр»."}, {"id": "gov1-r2", "section": "reading", "skill": "R", "level": 1, "type": "mcq", "prompt": "Тәжірибелі басшы алдымен не істейді?", "options": ["Бірден «жоқ» дейді", "Азаматты тыңдап, жағдайын түсінетінін айтады", "Маманға жібереді", "Заңды оқып береді"], "answer": 1, "hint": "2-абзац.", "explanation": "«Алдымен азаматты мұқият тыңдап, оның жағдайын түсінетінін айтады»."}, {"id": "gov1-r3", "section": "reading", "skill": "R", "level": 2, "type": "mcq", "prompt": "Бас тартудың қандай екі себебі аталды?", "options": ["Қаржы мен уақыттың жоқтығы", "Құжат пен кезектің жоқтығы", "Өкілеттіктің жоқтығы және мәселенің құзыретке жатпауы", "Басшының демалыста болуы"], "answer": 2, "hint": "2-абзацтың соңы.", "explanation": "«заң бойынша мекеменің мұндай өкілеттігі жоқ немесе бұл мәселе оның құзыретіне жатпайды»."}, {"id": "gov1-r4", "section": "reading", "skill": "R", "level": 2, "type": "mcq", "prompt": "Жақсы басшы бас тартқаннан кейін не істейді?", "options": ["Әңгімені аяқтайды", "Балама жол ұсынады", "Шағым жазуды ұсынады", "Басқа күні келуді сұрайды"], "answer": 1, "hint": "3-абзац.", "explanation": "«Жақсы басшы әрдайым балама іздейді. Есесіне азаматқа басқа жол ұсынады»."}, {"id": "gov1-r5", "section": "reading", "skill": "R", "level": 3, "type": "mcq", "prompt": "Мәтіннің негізгі ойы қандай?", "options": ["Басшы ешқашан бас тартпауы керек", "Барлық өтінішті орындау керек", "Сыпайы бас тарту азаматтың сенімін сақтайды", "Азаматтар заңды білмейді"], "answer": 2, "hint": "Соңғы сөйлем.", "explanation": "«Сыпайы бас тарту — азаматтың сенімін сақтаудың жолы»."}], "speaking": [{"id": "gov1-sA", "title": "А жағдайы: Аулада гараж", "level": 1, "time_limit_sec": 60, "use": ["baseline", "day7"], "situation": "Азамат көпқабатты үйдің ортақ ауласына жеке гараж салуға рұқсат сұрайды. Сіз — басшысыз.", "facts_for_leader": "Аула — барлық тұрғындардың ортақ мүлкі, жеке гаражға рұқсат жоқ. Балама: жақын маңдағы ақылы тұрақ немесе тұрғындар жиналысында тұрақ мәселесін көтеру.", "citizen_lines": ["Менің көлігімді түнде екі рет сызып кетті. Аулада бос жер бар, сол жерге шағын гараж салуға рұқсат беріңізші."], "model_answer": "Сәлеметсіз бе! Мәселені ашық айтқаныңызға рахмет, көлігіңіздің сызылғанын түсініп отырмын. Өкінішке орай, ауладағы жер — барлық тұрғындардың ортақ мүлкі, сондықтан жеке гараж салуға рұқсат бере алмаймыз. Есесіне жақын маңдағы ақылы тұраққа орын алуға болады. Сондай-ақ тұрғындар жиналысында аулаға бейнебақылау камерасын орнату мәселесін көтеруге болады. Өтінішіңізді ресми тіркеп берейік, бес күн ішінде сізге хабарласамыз."}, {"id": "gov1-sB", "title": "Б жағдайы: Коммуналдық төлем", "level": 1, "time_limit_sec": 60, "use": ["lesson"], "situation": "Зейнеткер коммуналдық төлемнен толық босатуды сұрайды. Азамат сабырлы.", "facts_for_leader": "Толық босату жоқ. Балама: табысы аз отбасыларға арналған тұрғын үй көмегі; өтініш ХҚКО немесе eGov арқылы беріледі.", "citizen_lines": ["Зейнетақым аз, жартысы коммуналдыққа кетеді. Мені төлемнен босатсаңыздар.", "Неге болмайды?", "Ал мен eGov-пен жұмыс істей алмаймын."], "model_answer": "Сізді түсініп отырмын, зейнетақының жартысы коммуналдық төлемге кетсе, қиын. Өкінішке орай, коммуналдық төлемнен толық босату заңда қарастырылмаған. Есесіне тұрғын үй көмегі бар: табысы аз отбасыларға төлемнің бір бөлігі өтеледі. eGov-пен жұмыс істеу қиын болса, маманымыз өтінішті толтыруға көмектеседі. Ертең сағат онда келіңіз, өтінішіңізді бірге тіркейміз."}, {"id": "gov1-sV", "title": "В жағдайы: Ауладағы ағаш", "level": 3, "time_limit_sec": 90, "use": ["lesson"], "situation": "Тұрғын терезесінің алдындағы үлкен ағашты ертең кесіп тастауды талап етеді. Алдымен наразы, сосын қысым жасайды.", "facts_for_leader": "Сау ағашты рұқсатсыз кесуге болмайды. Балама: маман ағаштың жағдайын тексереді, қажет болса бұтайды.", "citizen_lines": ["Үйімде күндіз де қараңғы! Бұтақтары тереземді сындырады. Үш рет шағым жаздым, ешкім келмеді.", "Сіздер тек сөйлей білесіздер! Ертең кеспесеңіздер, әлеуметтік желіге видео саламын. Жоғарыға да шағым жазамын!"], "model_answer": "Шағымыңызға жауап берілмегені үшін кешірім сұраймын. Терезеңізге бұтақ тиіп тұрғанын түсініп отырмын. Өкінішке орай, заң бойынша сау ағашты рұқсатсыз кесуге болмайды. Есесіне ертең маман келіп, ағаштың жағдайын тексереді, қажет болса бұтақтарын бұтайды. Әлеуметтік желіге жазу — сіздің құқығыңыз, бірақ шешім заң бойынша қабылданады. Жауапты маманға қазір тапсырма беремін, ертең сағат он екіге дейін сізге хабарласамыз."}, {"id": "gov1-sG", "title": "Г жағдайы: Орталық алаң", "level": 2, "time_limit_sec": 60, "use": ["day2"], "situation": "Кәсіпкер орталық алаңды жеке іс-шарасына тегін беруді сұрайды.", "facts_for_leader": "Тегін беруге өкілеттік жоқ. Балама: ресми өтініш беріп, белгіленген тәртіппен жалға алу.", "citizen_lines": ["Сенбі күні компаниямыздың мерекесі бар. Орталық алаңды бір күнге тегін беріп жіберсеңіздер."], "model_answer": "Ұсынысыңызға рахмет, іс-шара қала үшін де қызықты болуы мүмкін. Өкінішке орай, заң бойынша алаңды жеке іс-шараға тегін беруге өкілеттігіміз жоқ. Есесіне алаңды белгіленген тәртіппен жалға алуға болады. Ресми өтініш беріңіз, жауапты маманға тапсырма беремін, үш жұмыс күні ішінде сізге хабарласамыз."}, {"id": "gov1-sD", "title": "Д жағдайы: Көшедегі жол", "level": 2, "time_limit_sec": 60, "use": ["day3"], "situation": "Азамат көшесіне жол төсеуді биыл бітіруді талап етеді, ал жұмыс келесі жылға жоспарланған.", "facts_for_leader": "Биыл толық төсеу мүмкін емес. Балама: уақытша жөндеу және жоспар кестесін жіберу.", "citizen_lines": ["Көшеміздегі жол әбден бұзылды. Биыл жөндеп бітіріңіздер!"], "model_answer": "Көшеңіздегі жолдың жағдайын білемін, мәселені көтергеніңізге рахмет. Өкінішке орай, биыл жолды толық төсеу мүмкін емес: жұмыс келесі жылдың жоспарына енгізілген. Есесіне осы айда шұңқырларды уақытша жөндеуге тапсырма беремін. Жоспар кестесін сізге жібереміз, екі апта ішінде жұмыстың басталғаны туралы хабарласамыз."}], "self_check": ["Түсіністік білдірдім", "Бас тарттым және себебін айттым", "Балама жол ұсындым", "Нақты мерзім немесе келесі қадамды атадым", "Орысша сөз қолданбадым"], "schedule": [{"day": 1, "tasks": ["vocabulary", "key_phrases:shadowing"], "minutes": 7}, {"day": 2, "tasks": ["speaking:gov1-sG"], "minutes": 5}, {"day": 3, "tasks": ["vocabulary:missed", "grammar", "speaking:gov1-sD"], "minutes": 8}, {"day": 7, "tasks": ["vocabulary", "reading", "speaking:gov1-sA"], "minutes": 10}]}, {"id": "gov-kz-L2-journalist-v1", "course": {"id": "gov-kazakh", "title": "Мемлекеттік қызметтегі қазақ тілі", "title_ru": "Казахский язык на государственной службе", "module": {"id": "auyr-dialog", "number": 1, "title": "Ауыр диалог", "title_ru": "Трудный диалог"}}, "lesson": {"number": 2, "title": "Журналистің қиын сұрағы", "title_ru": "Трудный вопрос журналиста", "goal": "Журналистің қиын сұрағына 1 минутта сабырлы, нақты, жалтармай жауап беру.", "steps": ["Қабылдау", "Факті", "Көпір", "Келесі қадам"]}, "warmup": {"title": "Блиц-сұхбат", "rules": "1-сабақтың 6 сөзі. Журналист сұрайды, сіз 10 секунд ішінде сол сөзбен жауап бересіз. Дұрыс жалғау — 2 ұпай, жалғауы қате — 1 ұпай.", "source_bank_id": "gov-kz-L1-refusal-v1", "time_limit_sec": 10, "items": [{"id": "gov2-w1", "question": "Неге бұл мәселені өзіңіз шешпейсіз?", "word": "құзырет", "model_answer": "Бұл мәселе біздің құзыретімізге жатпайды."}, {"id": "gov2-w2", "question": "Сізде рұқсат беруге құқық бар ма?", "word": "өкілеттік", "model_answer": "Заң бойынша бізде мұндай өкілеттік жоқ."}, {"id": "gov2-w3", "question": "Сонда азамат енді не істеуі керек?", "word": "балама", "model_answer": "Балама жол бар: басқа бағдарламаға өтініш беруге болады."}, {"id": "gov2-w4", "question": "Тегін жасай алмайсыз ба?", "word": "есесіне", "model_answer": "Тегін жасай алмаймыз, есесіне жеңілдік бар."}, {"id": "gov2-w5", "question": "Сонда сіз бас тартасыз ба?", "word": "өкінішке қарай", "model_answer": "Өкінішке қарай, бұл өтінішті орындай алмаймыз."}, {"id": "gov2-w6", "question": "Мұны кім бақылайды?", "word": "тапсырма беру", "model_answer": "Жауапты маманға тапсырма бердім."}]}, "vocabulary": [{"id": "v1", "word": "баспасөз мәслихаты", "ru": "пресс-конференция", "collocation": "баспасөз мәслихатын өткізу", "example": "Ертең баспасөз мәслихатын өткіземіз."}, {"id": "v2", "word": "ресми мәлімдеме", "ru": "официальное заявление", "collocation": "ресми мәлімдеме жасау", "example": "Мекеме ресми мәлімдеме жасады."}, {"id": "v3", "word": "түсініктеме беру", "ru": "давать комментарий", "collocation": "-ға / -ге т  "example": "Осы қоғамдық мәселе бойынша ұстанымыңыз қандай?", "why_hard": "Сұрақ тақырыптан тыс, кез келген сөз саяси түсініледі."}, {"id": "q5", "title": "Сенім сұрағы", "example": "Неге сізге сенуіміз керек?", "why_hard": "Сұрақ мекемеге емес, басшының өзіне бағытталған."}], "key_phrases": [{"step": 1, "kk": "Сұрағыңыз орынды.", "ru": "Ваш вопрос уместен."}, {"step": 1, "kk": "Бұл адамдарды алаңдатып отырғанын түсінемін.", "ru": "Понимаю, что это тревожит людей."}, {"step": 2, "kk": "Қазір нақты білетінім — …", "ru": "Сейчас точно известно …"}, {"step": 2, "kk": "Әзірге белгісіз нәрсе — …, болжам жасамаймын.", "ru": "Пока неизвестно …, гадать не буду."}, {"step": 3, "kk": "Ең бастысы — …", "ru": "Самое главное — …"}, {"step": 3, "kk": "Біздің ұстанымымыз айқын: …", "ru": "Наша позиция ясна: …"}, {"step": 4, "kk": "Тексеру нәтижесін … дейін жариялаймыз.", "ru": "Результаты проверки опубликуем до …"}, {"step": 4, "kk": "Толық ақпаратты ресми мәлімдемеде береміз.", "ru": "Полную информацию дадим в официальном заявлении."}], "avoid_phrases": ["Түсініктеме жоқ.", "Орындалмайтын мерзім", "Жаттанды жұбаныш: «Бәрі бақылауда»"], "reading": {"id": "r", "title": "Микрофон алдындағы бір минут", "paragraphs": ["Баспасөз мәслихатында ең қиыны — дайындалған мәлімдеме емес, күтпеген сұрақ. Журналист кейде кінәлі адамды атауды сұрайды, кейде әлі белгісіз деректі талап етеді. Мұндай сәтте басшы не сұрақтан жалтарады, не асығыс болжам жасайды. Екеуі де мекеменің беделіне нұқсан келтіреді.", "Тәжірибелі басшы алдымен сұрақты қабылдайды: «Сұрағыңыз орынды» дейді. Содан кейін тек нақты дерекке сүйенеді. Білетінін айтады, білмейтінін жасырмайды. «Әзірге белгісіз» деу — әлсіздік емес, адалдық.", "Ең маңызды сәт — көпір. Басшы сұраққа жауап береді де, негізгі ойға көшеді: мекеме не істеп жатыр, азаматтарға не өзгереді. Осылайша оның ұстанымы айқын көрінеді, ал сөзін бұрмалау қиындайды.", "Соңында ол орындай алатын келесі қадамды атайды. Кепілдік бере алмайтын нәрсеге уәде бермейді. Қоғам уметтік желіден", "Ресми мәлімдемеден", "Айтылған сөздің орындалуынан"], "answer": 3, "hint": "4-абзац.", "explanation": "«Қоғамдық пікір бір сұхбаттан емес, айтылған сөздің орындалуынан қалыптасады»."}], "speaking": [{"id": "gov2-s1", "title": "1-жағдай: Су құбыры", "question_type": "q1", "level": 2, "time_limit_sec": 60, "speaker_label": "Журналист", "use": ["lesson", "day7"], "situation": "Қалада су құбыры жарылып, үш аудан екі күн сусыз қалды. Сіз — басшысыз, баспасөз мәслихатындасыз.", "facts_for_leader": "Құбыр ескі, жөндеу жоспарда болған, бірақ кешігіп қалған. Тексеру жүріп жатыр. Су бүгін кешке дейін беріледі.", "citizen_lines": ["Бұған кім кінәлі? Сіз жауапкершілікті мойындайсыз ба?", "Сіз сұрақтан жалтарып тұрсыз!"], "model_answer": "Сұрағыңыз орынды. Адамдар екі күн сусыз қалды, бұл — ауыр жағдай. Жөндеу кешігенін мойындаймын, мекеме ретінде жауапкершілікті аламыз. Нақты кімнің кінәсі бар екенін тексеру көрсетеді, болжам жасамаймын. Ең бастысы — су бүгін кешке дейін беріледі. Тексеру нәтижесін ресми мәлімдемеде жариялаймыз."}, {"id": "gov2-s2", "title": "2-жағдай: Қоймадағы өрт", "question_type": "q2", "level": 2, "time_limit_sec": 60, "speaker_label": "Журналист", "use": ["lesson"], "situation": "Қала шетіндегі қоймада өрт болды. Баспасөз мәслихаты бір сағаттан кейін өтіп жатыр.", "facts_for_leader": "Өрт сөндірілді, екі адам ауруханада. Басқа деректер нақтыланып жатыр.", "citizen_lines": ["Қанша адам зардап шекті? Нақты санын айтыңызшы.", "Сіз сұрақтан жалтарып тұрсыз!"], "model_answer": "Бұл бәрімізді алаңдатып отырғанын түсінемін. Қазір нақты білетінім: өрт сөндірілді, екі адам ауруханада. Басқа деректер нақтыланып жатыр, расталмаған санды айтпаймын. Ең бастысы — зардап шеккендерге көмек көрсетіліп жатыр. Жаңа ақпаратты екі сағат сайын ресми парақшада жариялаймыз."}, {"id": "gov2-s3", "title": "3-жағдай: Кешігіп жатқан жол", "question_type": "q3", "level": 2, "time_limit_sec": 60, "speaker_label": "Журналист", "use": ["lesson", "day2"], "situation": /* ---------- Күй: localStorage-та, пайдаланушыға бөлек ---------- */
let USER=null, sb=null, KEY="gov-v1:anon";
const blank = () => ({lang:"kk", lesson:null, items:{}, attempts:{}, view:"home", sec:null, pos:{}, card:0, flipped:false, grp:0, sit:null, checks:{}, model:{}, recDone:{}, line:{}, bi:0, qt:0});
function load(){ try{ const s=Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); if(s.sec!==null && typeof s.sec!=="string") s.sec=null; return s; }catch(e){ return blank(); } }
let S=load();
try{ const l=localStorage.getItem("tilkz-lang"); if(l==="kk"||l==="ru") S.lang=l; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ru = () => S.lang==="ru";
const st = id => (S.items[id] ||= {tries:[], status:"open"});
const isDone = it => ["ok","revealed"].includes(st(it.id).status);
const isFirst = it => st(it.id).status==="ok" && st(it.id).tries.length===0;
const doneCount = () => LESSON.items.filter(isDone).length;
const lessonDone = l => l.items.every(x=>["ok","revealed"].includes((S.items[x.id]||{}).status));
const lessonOpen = i => LESSONS.slice(0,i).every(lessonDone);
const listFor = k => k==="vocab" ? VQ.concat(hasQT?[]:GQ) : k==="grammar" ? GQ : RQ;

/* ---------- Серверге жазу (курс бетіндегі логикамен бірдей) ---------- */
let attemptReq={};
function ensureAttempt(bank){
  if(S.attempts[bank]) return Promise.resolve(S.attempts[bank]);
  return attemptReq[bank] ||= sb.from("attempts").insert({bank_id:bank, mode:"practice"}).select("id").single()
    .then(({data,error})=>{ delete attemptReq[bank]; if(error){ console.warn(error); return null; } S.attempts[bank]=data.id; save(); return data.id; });
}
let syncQ=Promise.resolve();
function syncItem(it, bank){ syncQ=syncQ.then(()=>syncItemNow(it,bank)).catch(e=>console.warn(e)); return syncQ; }
async function syncItemNow(it, bank){
  if(!USER||!sb) return; const s=st(it.id); if(s.status==="open") return;
  const aid=await ensureAttempt(bank); if(!aid) return;
  const {error}=await sb.from("answers").upsert({attempt_id:aid, bank_id:bank, item_id:it.id, skill:it.skill, level:it.level,
    tries:[...s.tries], status:s.status, first_correct:isFirst(it), updated_at:new Date().toISOString()});
  if(error) console.warn(error);
}
function syncFinish(bank, items){ syncQ=syncQ.then(()=>syncFinishNow(bank, items)).catch(e=>console.warn(e)); return syncQ; }
async function syncFinishNow(bank, items){
  if(!USER||!sb) return; const aid=await ensureAttempt(bank); if(!aid) return;
  const {error}=await sb.from("attempts").update({finished_at:new Date().toISOString(), first_correct:items.filter(isFirst).length, total:items.length}).eq("id",aid);
  if(error) console.warn(error);
}

/* Бөлімдер тізімі сабаққа байланысты */
function secList(){
  const t=T(), a=[];
  if(hasWarm) a.push({k:"blitz", l:t.blitz});
  a.push({k:"vocab", l:t.secs.vocab});
  if(hasQT) a.push({k:"qtypes", l:t.secs.qtypes});
  a.push({k:"phrases", l:t.secs.phrases});
  if(hasQT) a.push({k:"grammar", l:t.secs.grammar});
  a.push({k:"reading", l:t.secs.reading});
  a.push({k:"speaking", l:t.secs.speaking});
  return a;
}
function secState(k){
  const sp=LESSON.speaking;
  if(k==="blitz") return [LESSON.warmup.items.filter(w=>S.recDone[w.id]).length, LESSON.warmup.items.length];
  if(k==="vocab") { const l=listFor("vocab"); return [l.filter(isDone).length, l.length]; }
  if(k==="grammar") return [GQ.filter(isDone).length, GQ.length];
  if(k==="reading") return [RQ.filter(isDone).length, RQ.length];
  if(k==="speaking") return [sp.filter(x=>S.recDone[x.id]).length, sp.length];
  if(k==="qtypes") return [null, LESSON.question_types.length];
  if(k==="phrases") return [null, phraseGroups().length];
  return [null,null];
}
function lessonHTML(){
  const t=T(), n=LESSON.lesson.number;
  const tabs = secList().map(s=>{ const [a,b]=secState(s.k); const fin = a!==null && a===b && b>0;
    const sub = a!==null ? `${a}/${b}` : `${b}`;
    return `<button type="button" data-sec="${s.k}" aria-current="${S.sec===s.k}" class="${fin?"done":""}">${esc(s.l)}<small>${fin?"✓":sub}</small></button>`; }).join("");
  const body = {blitz:blitzHTML, vocab:vocabHTML, qtypes:qtypesHTML, phrases:phrasesHTML, grammar:grammarHTML, reading:readingHTML, speaking:speakingHTML}[S.sec || secList()[0].k]();
  const src = (LESSON.sources||[]).length ? `<div class="sources"><b>${t.sources}</b>${LESSON.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.publisher)} — ${esc(s.title)} (${s.year})</a>`).join("")}</div>` : "";
  return `<button class="btn ghost back" type="button" data-go="home">‹ ${t.lessons}</button>
    <span class="eyebrow">${esc(ru()?LESSONS[0].course.module.title_ru:LESSONS[0].course.module.title)}</span>
    <h1 style="font-size:24px">${ru()?`${t.lessonN(n)}. `:`${n}-${t.lesson}. `}${esc(lessonTitle())}</h1>
    <nav class="tabs">${tabs}</nav>${body}${src}`;
}

      <button class="btn rec" type="button" data-rec="stop">${rec.audio===false?t.timerStop:t.recStop}</button>`;

  else if(!done) ctrl=`<div class="timer">${fmtT(LESSON.warmup.time_limit_sec)}</div><button class="btn primary" type="button" data-rec="start" data-rid="${w.id}">${t.recStart}</button>`;
  else ctrl=`${AUDIO[w.id]?`<div><p class="meta" style="margin:0 0 6px">${t.yourRec}</p><audio controls src="${AUDIO[w.id]}"></audio></div>`:""}
      <div><h2 style="font-size:19px">${t.modelH}</h2><div class="model">${esc(w.model_answer)}</div></div>

/* --- Сөздік: карточкалар → сөздік тапсырмалары (және 1-сабақта грамматика) --- */
function vocabHTML(){
  const t=T(), p=S.pos.vocab ?? "cards";
  if(p==="cards"){
    const V=LESSON.vocabulary, i=Math.min(S.card, V.length-1), v=V[i];
    return `<div class="step"><span>${t.cards}</span><span>${t.card(i+1,V.length)}</span></div>
      <div class="flip ${S.flipped?"on":""}" id="flip" role="button" tabindex="0" aria-label="${t.tapFront}">
        <div class="in"><div class="face front"><div class="ru">${esc(v.ru)}</div><div class="tap">${t.tapFront}</div></div>
        <div class="face back"><div class="kk">${esc(v.word)}</div><div class="col">${esc(v.collocation)}</div><div class="ex">${esc(v.example)}</div><div class="tap">${t.tapBack}</div></div></div></div>
      <div class="nav"><button class="btn" type="button" data-card="-1" ${i===0?"disabled":""}>${t.prev}</button>
        ${i<V.length-1 ? `<button class="btn primary" type="button" data-card="1">${t.next}</button>` : `<button class="btn primary" type="button" data-pk="vocab" data-p="0">${t.toTasks}</button>`}</div>`;
  }
  return taskScreen("vocab", t.vtasks, p);
}
/* Тапсырма экраны: k – бөлім кілті, p – индекс (vocab/reading үшін алғашқы экран «cards»/«text») */
function taskScreen(k, title, p){
  const t=T(), list=listFor(k);
  if(p>=list.length) return secDoneHTML(k);
  const it=list[p], isG = it.section==="grammar";
  const num = isG ? GQ.indexOf(it)+1 : (k==="vocab" ? VQ.indexOf(it)+1 : RQ.indexOf(it)+1);
  const tot = isG ? GQ.length : (k==="vocab" ? VQ.length : RQ.length);
  const ttl = isG ? t.gtasks : title;
  const peek = it.section==="reading" ? `<details class="peek"><summary>${t.peek}</summary>${textHTML()}</details>` : "";
  const prevP = p>0 ? p-1 : (k==="vocab"?"cards":k==="reading"?"text":0);
  return itemHTML(it, ttl, t.q(num,tot), k, p, prevP, list.length, peek);
}
function itemHTML(it, title, counter, k, p, prevP, n, peek){
  const t=T(), s=st(it.id), fin=isDone(it);
  const opts=it.options.map((o,j)=>{ const L_=LETTERS[j];
    let cls=""; if(fin && j===it.answer) cls="ok"; else if(s.tries.includes(L_)) cls="bad";
    return `<button type="button" class="opt ${cls}" data-ans="${j}" data-id="${it.id}" ${fin||s.tries.includes(L_)?"disabled":""}><b>${L_}</b><span>${esc(o)}</span></button>`; }).join("");
  let fb="";
  if(s.status==="ok") fb=`<div class="fb ok" role="status"><h4>${t.ok}</h4><p style="margin:0">${esc(it.explanation)}</p></div>`;
  else if(s.status==="revealed") fb=`<div class="fb bad" role="status"><h4>${t.revealed}: ${LETTERS[it.answer]}) ${esc(it.options[it.answer])}</h4><p style="margin:0">${esc(it.explanation)}</p></div>`;
  else if(s.status==="wrong1") fb=`<div class="fb hint" role="status"><h4>${t.bad}</h4><p style="margin:0"><b>${t.hint}:</b> ${esc(it.hint)}</p></div>`;
  return `<div class="step"><span>${esc(title)}</span><span>${counter}</span></div>${peek||""}
    <div class="card"><p class="prompt">${esc(it.prompt)}</p><div class="opts">${opts}</div>${fb}</div>
    <div class="nav"><button class="btn" type="button" data-pk="${k}" data-p="${prevP}" ${(k!=="vocab" && k!=="reading" && p===0)?"disabled":""}>${t.prev}</button>
      <button class="btn ${fin?"primary":""}" type="button" data-pk="${k}" data-p="${p+1}" ${fin?"":"disabled"}>${t.next}</button></div>`;
}
function secDoneHTML(k){
  const t=T(), list=listFor(k), f=list.filter(isFirst).length;
  const all = doneCount()===LESSON.items.length;
  const nextKey = (()=>{ const a=secList().map(x=>x.k), i=a.indexOf(k); return a[i+1]; })();
  return `<div class="card stack" style="text-align:center"><h2>${all?t.finished:t.secDone}</h2>
    <div class="score">${f} / ${list.length}</div><p class="meta" style="margin:0">${t.firstOk(f,list.length)}</p>
    <div class="row" style="justify-content:center"><button class="btn" type="button" data-reset="${k}">${t.again}</button>
    ${nextKey?`<button class="btn primary" type="button" data-sec="${nextKey}">${t.nextSec}</button>`:""}</div></div>${saveNote()}`;
}

      ${i<Q.length-1 ? `<button class="btn primary" type="button" data-qt="${i+1}">${t.next}</button>` : `<button class="btn primary" type="button" data-sec="phrases">${t.secs.phrases} ›</button>`}</div>`;
}

/* --- Тірек сөйлемдер: қадамдар, қысым, «Нені айтпау керек» --- */
function phraseGroups(){
  const t=T(), g=LESSON.lesson.steps.map((s,i)=>({title:`${t.steps} ${i+1}. ${s}`, list:LESSON.key_phrases.filter(p=>p.step===i+1)}));
  g.push({title:t.pressure, list:LESSON.key_phrases.filter(p=>p.step==="pressure")});
  if(LESSON.avoid_phrases) g.push({title:t.avoid, avoid:LESSON.avoid_phrases, list:[]});
  return g.filter(x=>x.list.length || (x.avoid&&x.avoid.length));
}
function phrasesHTML(){
  const t=T(), G=phraseGroups(), i=Math.min(S.grp,G.length-1), g=G[i];
  const body = g.avoid
    ? `<div class="phr-avoid">${g.avoid.map(a=>`<div class="phr"><div class="k">${esc(a)}</div></div>`).join("")}</div>`
    : g.list.map(p=>`<div class="phr"><div class="k">${esc(p.kk)}</div><div class="r">${esc(p.ru)}</div></div>`).join("");
  return `<div class="step"><span>${t.secs.phrases}</span><span>${t.group(i+1,G.length)}</span></div>
    <div class="card"><h2>${esc(g.title)}</h2>${body}</div>
    <div class="nav"><button class="btn" type="button" data-grp="${i-1}" ${i===0?"disabled":""}>${t.prev}</button>
      ${i<G.length-1?`<button class="btn primary" type="button" data-grp="${i+1}">${t.next}</button>`:`<button class="btn primary" type="button" data-sec="${hasQT ? "grammar" : "reading"}">${t.nextSec}</button>`}</div>`;
}

/* --- Грамматика (2-сабақ: жеке бөлім) --- */
function grammarHTML(){
  const p=S.pos.grammar ?? 0;
  return taskScreen("grammar", T().gtasks, p);
}

/* --- Мәтін --- */
function textHTML(){ return `<div class="text">${LESSON.reading.paragraphs.map((p,i)=>`<p><span class="pn">${i+1}</span>${esc(p)}</p>`).join("")}</div>`; }
function readingHTML(){
  const t=T(), p=S.pos.reading ?? "text";
  if(p==="text") return `<div class="step"><span>${t.readText}</span></div>
    <div class="card"><h2>${esc(LESSON.reading.title)}</h2>${textHTML()}</div>

}

/* --- Сөйлеу (speaker_label болса – екінші репличка жауап жазылғаннан кейін шығады) --- */
function speakingHTML(){
  const t=T();
  if(!S.sit) return `<div class="step"><span>${t.situations}</span></div><div class="stack">${LESSON.speaking.map(x=>`
    <button type="button" class="sit" data-sit="${x.id}"><span><span class="t">${esc(x.title)}</span><br><span class="m">${x.level}-${t.level} · ${fmtT(x.time_limit_sec)}</span></span>${S.recDone[x.id]?`<span class="st">✓ ${t.done}</span>`:""}</button>`).join("")}</div>`;
  const x=LESSON.speaking.find(y=>y.id===S.sit), done=!!S.recDone[x.id], rec=REC.sid===x.id?REC:null;
  const spk = x.speaker_label || t.citizen, step = !!x.speaker_label;
  const ln=Math.min(S.line[x.id]||0, x.citizen_lines.length-1);
  const shown = step ? (done ? x.citizen_lines : x.citizen_lines.slice(0,1)) : x.citizen_lines.slice(0,ln+1);
  const lines=shown.map(l=>`<div class="bubble"><small>${esc(spk)}</small>${esc(l)}</div>`).join("");
  const more = (!step && ln<x.citizen_lines.length-1) ? `<button class="btn" type="button" data-line="1">${t.nextLine}</button>` : "";
  let ctrl;
  if(rec && rec.on) ctrl=`<div class="timer run" aria-live="polite"><span class="recdot"></span>${fmtT(rec.left)}</div><p class="meta" style="text-align:center;margin:0">${rec.audio===false?"":t.recording}</p>
      <button class="btn rec" type="button" data-rec="stop">${rec.audio===false?t.timerStop:t.recStop}</button>`;
  else if(MICERR===x.id) ctrl=`<div class="timer">${fmtT(x.time_limit_sec)}</div><p class="note">${t.noMic}</p><button class="btn primary" type="button" data-rec="timer" data-rid="${x.id}">${t.noMicGo}</button>`;
  else if(!done) ctrl=`<div class="timer">${fmtT(x.time_limit_sec)}</div><button class="btn primary" type="button" data-rec="start" data-rid="${x.id}">${t.recStart}</button>`;
  else ctrl=`<div class="stack">${AUDIO[x.id]?`<div><p class="meta" style="margin:0 0 6px">${t.yourRec}</p><audio controls src="${AUDIO[x.id]}"></audio></div>`:""}
      <div class="check"><h2 style="font-size:19px">${t.self}</h2>${LESSON.self_check.map((c,i)=>`<label><input type="checkbox" data-chk="${i}" ${(S.checks[x.id]||[])[i]?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>
      ${S.model[x.id]?`<div><h2 style="font-size:19px">${t.modelH}</h2><div class="model">${esc(x.model_answer)}</div></div>`:`<button class="btn primary" type="button" data-model="1">${t.model}</button>`}
      <button class="btn" type="button" data-rec="start" data-rid="${x.id}">${t.recAgain}</button></div>`;
  return `<button class="btn ghost back" type="button" data-sit="">‹ ${t.situations}</button>
    <div class="card stack"><h2>${esc(x.title)}</h2><p style="margin:0">${esc(x.situation)}</p>
      <div class="box know"><b class="lbl">${t.know}</b>${esc(x.facts_for_leader)}</div>
      ${lines}${more}</div>
    <div class="card stack" style="margin-top:14px">${ctrl}</div>`;
}

/* ---------- Дауыс жазу (MediaRecorder). Жазба IndexedDB-де, тек осы құрылғыда ---------- */
let REC={}, MICERR=null; const AUDIO={};
const idb = () => new Promise((res,rej)=>{ const r=indexedDB.open("aitil-gov",1); r.onupgradeneeded=()=>r.result.createObjectStore("rec"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function putRec(id,blob){ try{ const db=await idb(); db.transaction("rec","readwrite").objectStore("rec").put(blob, KEY+":"+id); }catch(e){} }
async function getRec(id){ try{ const db=await idb(); return await new Promise(r=>{ const q=db.transaction("rec").objectStore("rec").get(KEY+":"+id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }catch(e){ return null; } }
function tick(){ if(!REC.on) return; REC.left=Math.max(0, REC.total-Math.floor((Date.now()-REC.t0)/1000));
  const el=document.querySelector(".timer.run"); if(el) el.innerHTML=`<span class="recdot"></span>${fmtT(REC.left)}`;
  if(REC.left<=0) stopRec(); }
function findRec(id){ return LESSON.speaking.find(y=>y.id===id) || LESSON.warmup.items.find(w=>w.id===id) && {id, time_limit_sec:LESSON.warmup.time_limit_sec}; }
async function startRec(id, withMic){
  const x=findRec(id); MICERR=null; REC={sid:id, on:true, t0:Date.now(), total:x.time_limit_sec, left:x.time_limit_sec, audio:withMic};
  if(withMic){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mr=new MediaRecorder(stream), chunks=[];
      mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      mr.onstop=async()=>{ stream.getTracks().forEach(tr=>tr.stop()); const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
        if(AUDIO[id]) URL.revokeObjectURL(AUDIO[id]); AUDIO[id]=URL.createObjectURL(blob); await putRec(id, blob); render(); };
      REC.mr=mr; mr.start(); REC.t0=Date.now();
    }catch(e){ console.warn(e); REC={}; MICERR=id; render(); return; }
  }
  REC.iv=setInterval(tick, 250); render();
}
function stopRec(){ if(!REC.on) return; clearInterval(REC.iv); REC.on=false; S.recDone[REC.sid]=true; save();
  if(REC.mr && REC.mr.state!=="inactive") REC.mr.stop(); else render(); }

/* ---------- Оқиғалар ---------- */
app.addEventListener("click", async e=>{
  const b=e.target.closest("button,[data-flip]"); const flip=e.target.closest("#flip");
  if(flip && !b){ S.flipped=!S.flipped; save(); flip.classList.toggle("on", S.flipped); return; }
  if(!b) return; const d=b.dataset;
  if(d.lesson){ openLesson(d.lesson); return; }
  if(d.go==="home"){ goHome(); return; }
  if(d.sec){ S.sec=d.sec; if(d.sec==="speaking") S.sit=null; save(); render(); return; }
  if(d.card){ S.card=Math.max(0, Math.min(LESSON.vocabulary.length-1, S.card+ +d.card)); S.flipped=false; save(); render(); return; }
  if(d.pk){ S.pos[d.pk] = d.p==="cards"||d.p==="text" ? d.p : +d.p; save(); render(); return; }
  if(d.reset){ resetList(listFor(d.reset)); S.pos[d.reset]= d.reset==="vocab"?"cards":d.reset==="reading"?"text":0; save(); render(); return; }
  if(d.qt!=null){ S.qt=Math.max(0, +d.qt); save(); render(); return; }
  if(d.grp!=null){ S.grp=+d.grp; save(); render(); return; }
  if(d.bi!=null){ S.bi=Math.max(0, +d.bi); const w=LESSON.warmup.items[Math.min(S.bi, LESSON.warmup.items.length-1)]; save();
    if(!AUDIO[w.id]){ const bl=await getRec(w.id); if(bl) AUDIO[w.id]=URL.createObjectURL(bl); } render(); return; }
  if(d.ans!=null){ answer(LESSON.items.find(x=>x.id===d.id), +d.ans); return; }
  if(d.sit!=null){ if(REC.on) stopRec(); S.sit=d.sit||null; MICERR=null; save(); if(S.sit && !AUDIO[S.sit]){ const bl=await getRec(S.sit); if(bl) AUDIO[S.sit]=URL.createObjectURL(bl); } render(); return; }
  if(d.line){ S.line[S.sit]=(S.line[S.sit]||0)+1; save(); render(); return; }
  if(d.rec==="start"){ startRec(d.rid, !!(navigator.mediaDevices && window.MediaRecorder)); return; }
  if(d.rec==="timer"){ startRec(d.rid, false); return; }
  if(d.rec==="stop"){ stopRec(); return; }
  if(d.model){ S.model[S.sit]=true; save(); render(); return; }
});
app.addEventListener("keydown", e=>{ if(e.target.id==="flip" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.target.click(); } });
app.addEventListener("change", e=>{ const c=e.target.closest("[data-chk]"); if(!c) return; (S.checks[S.sit] ||= [])[+c.dataset.chk]=c.checked; save(); });
function resetList(list){ for(const it of list) delete S.items[it.id]; if(doneCount()===0) S.attempts[LESSON.id]=null; save(); }
function answer(it, j){
  const s=st(it.id); if(isDone(it)) return; const Lt=LETTERS[j], bank=LESSON.id, items=LESSON.items;
  if(j===it.answer) s.status="ok";
  else if(!s.tries.length){ s.tries.push(Lt); s.status="wrong1"; }
  else { s.tries.push(Lt); s.status="revealed"; }
  save(); render(); syncItem(it, bank);
  if(items.every(x=>isDone(x))) syncFinish(bank, items);
}
document.querySelector(".seg").addEventListener("click", e=>{ const b=e.target.closest("[data-lang]"); if(!b) return; S.lang=b.dataset.lang; try{localStorage.setItem("tilkz-lang",S.lang);}catch(e){} save(); render(); });
document.getElementById("themeBtn").addEventListener("click", ()=>{ const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const th=dark?"light":"dark"; document.documentElement.dataset.theme=th; try{localStorage.setItem("tilkz-theme",th);}catch(e){} });


/* ---------- Кіру / тіркелу: Google (OAuth) не email + құпиясөз. Бұрынғы оқушылар нөмірі не логинімен кіреді ---------- */
const LOGIN_DOMAIN = "oqushy.tilkz.app";
const normPhone = v => { let d=(v||"").replace(/\D/g,""); if(d.length===11 && d[0]==="8") d="7"+d.slice(1); if(d.length===10) d="7"+d; return /^7\d{10}$/.test(d) ? d : null; };
const loginEmail = v => { v=v.trim().toLowerCase(); if(v.includes("@")) return v; if(!/[a-z]/.test(v)){ const ph=normPhone(v); if(ph) v=ph; } return v+"@"+LOGIN_DOMAIN; };
/* Телефон өрісі: "+7 " префиксі тұрақты, қолданушы қалған цифрларды жазады (775 444 5566 → +7 775 444 55 66).
   Латын әріпі енгізілсе, бұл логин – префикс алынады. */
function fmtPhoneInput(el){
  const v = el.value;
  if(/[a-zA-Z]/.test(v)){ el.value = v.replace(/^\+7\s*/, ""); return; }
  const rest = v.replace(/^\+7\s*/, "");
  let d = rest.replace(/\D/g, "");
  if(d.length>10) d = d.slice(d.length-10);
  if(!d){ el.value = "+7 "; return; }
  el.value = "+7 " + d.slice(0,3) + (d.length>3 ? " "+d.slice(3,6) : "") + (d.length>6 ? " "+d.slice(6,8) : "") + (d.length>8 ? " "+d.slice(8,10) : "");
}
document.addEventListener("focusin", e=>{ if(e.target.matches && e.target.matches('input[name=phone],input[name=parent_phone],input[name=login]') && !e.target.value) e.target.value = "+7 "; });
document.addEventListener("input", e=>{ if(e.target.matches && e.target.matches('input[name=phone],input[name=parent_phone],input[name=login]')) fmtPhoneInput(e.target); });
let authMode="login", authMsg="", authBusy=false, GOOGLE_ON=false;
/* Google батырмасы Supabase-те Google провайдері қосылғанда ғана көрінеді */
async function checkProviders(){ try{ const r=await fetch(SB_CFG.url+"/auth/v1/settings",{headers:{apikey:SB_CFG.key}}); const d=await r.json(); GOOGLE_ON=!!(d.external&&d.external.google); }catch(e){ GOOGLE_ON=false; } }
const GICON='<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function authHTML(){
  const t=T(), reg=authMode==="reg";
  return `<div class="auth"><span class="eyebrow">aitil</span><h1>${esc(courseTitle())}</h1><p class="lead">${t.aLead}</p>
   <div class="card"><div class="atabs" role="group"><button type="button" data-am="login" aria-pressed="${!reg}">${t.aLogin}</button><button type="button" data-am="reg" aria-pressed="${reg}">${t.aReg}</button></div>
    ${GOOGLE_ON?`<div class="af"><button class="btn gbtn" type="button" data-google="1">${GICON}<span>${reg?t.googleReg:t.google}</span></button><div class="or">${t.or}</div></div>`:""}
    ${reg?`<form class="af" id="regForm" novalidate>
      <label>${t.name}<input name="name" maxlength="80" autocomplete="name" required></label>
      <label>${t.emailReg}<input name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required></label>
      <label>${t.pw}<input name="password" type="password" autocomplete="new-password" required><span class="hint">${t.pwHint}</span></label>
      <span class="hint" style="font-size:13.5px;color:var(--muted)">${t.policyPre} <a href="../privacy/" target="_blank" rel="noopener">${t.policy}</a> ${t.policyPost}</span>
      <p class="err" role="alert">${esc(authMsg)}</p><button class="btn primary" type="submit" ${authBusy?"disabled":""}>${authBusy?t.wait:t.doReg}</button></form>`
    :`<form class="af" id="loginForm" novalidate>
      <label>${t.email}<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" value="+7 " required></label>
      <label>${t.pw}<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" role="alert">${esc(authMsg)}</p><button class="btn primary" type="submit" ${authBusy?"disabled":""}>${authBusy?t.wait:t.doLogin}</button></form>`}
   </div></div>`;
}
app.addEventListener("click", async e=>{
  const am=e.target.closest("[data-am]"); if(am){ authMode=am.dataset.am; authMsg=""; render(); return; }
  if(e.target.closest("[data-google]")){
    const {error}=await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo:location.origin+location.pathname}});
    if(error){ console.warn(error); authMsg=/provider is not enabled|Unsupported provider/i.test(error.message)?T().e.google:T().e.net; render(); }
  }
});
app.addEventListener("submit", async e=>{
  e.preventDefault(); if(authBusy) return;
  const t=T(), f=Object.fromEntries(new FormData(e.target)); for(const k in f) f[k]=String(f[k]).trim();
  const form=e.target, btn=form.querySelector("button[type=submit]"), errEl=form.querySelector(".err"), label=btn.textContent;
  const fail=m=>{ authBusy=false; authMsg=m; errEl.textContent=m; btn.disabled=false; btn.textContent=label; };
  authBusy=true; authMsg=""; errEl.textContent=""; btn.disabled=true; btn.textContent=t.wait;
  try{
    if(form.id==="loginForm"){
      if(!f.login||!f.password) return fail(t.e.empty);
      const {data,error}=await sb.auth.signInWithPassword({email:loginEmail(f.login), password:f.password});
      if(error) return fail(/fetch|network/i.test(error.message)?t.e.net:t.e.bad);
      authBusy=false; await enterAs(data.user); return;
    }
    if(!f.name||!f.email||!f.password) return fail(t.e.empty);
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) return fail(t.e.email);
    if(f.password.length<6) return fail(t.e.pw);
    const {data,error}=await sb.auth.signUp({email:f.email.toLowerCase(), password:f.password, options:{data:{role:"learner", full_name:f.name}}});
    if(error) return fail(/fetch|network/i.test(error.message)?t.e.net:/registered|exists/i.test(error.message)?t.e.taken:t.e.fail);
    if(!data.session){ const r=await sb.auth.signInWithPassword({email:f.email.toLowerCase(), password:f.password}); if(r.error) return fail(t.e.fail); authBusy=false; await enterAs(r.data.user); return; }
    authBusy=false; await enterAs(data.user);
  }catch(err){ console.warn(err); fail(t.e.net); }
});
document.getElementById("user").addEventListener("click", async ()=>{ if(!confirm(T().out)) return; try{ await sb.auth.signOut(); }catch(e){} location.reload(); });
async function enterAs(u){
  const {data:p}=await sb.from("students").select("first_name,last_name").eq("user_id",u.id).maybeSingle();
  const md=u.user_metadata||{};
  USER={id:u.id, name: p?`${p.first_name} ${p.last_name}`:(md.full_name||md.name||u.email||"")};
  const lang=S.lang; KEY="gov-v1:"+u.id; S=load(); S.lang=lang; save(); render();
}

/* ---------- Кіру: курс бетімен ортақ сессия (tilkz-auth) ---------- */
async function boot(){
  setLesson(S.lesson);
  if(SB_CFG && window.supabase){
    sb=window.supabase.createClient(SB_CFG.url, SB_CFG.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"tilkz-auth"}});
    try{ const {data:{session}}=await sb.auth.getSession(); if(session){ await enterAs(session.user); return; } }catch(e){ console.warn(e); }
    await checkProviders();
  }
  render();
}
boot();
