<style>
/* Курс бетінің (nzm-bil) түстері мен қаріптері */
:root{
  --paper:#F4F6F9; --panel:#FFFFFF; --ink:#18212E; --muted:#596476; --line:#DCE1E8;
  --accent:#1D5BA6; --accent-soft:#E3ECF7; --ok:#1C7A4E; --ok-soft:#E1F2E9; --bad:#B23A30; --bad-soft:#F8E4E2;
  --warn-soft:#FFF4D6; --warn:#8A5A00;
  --f-text:"PT Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E;
  --warn-soft:#3A2F12; --warn:#F2C76B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#161D27; --ink:#E5E9EF; --muted:#9BA6B6; --line:#2A3442;
  --accent:#78AEEE; --accent-soft:#1D2B3D; --ok:#55C792; --ok-soft:#15302A; --bad:#F2796F; --bad-soft:#3A1E1E;
  --warn-soft:#3A2F12; --warn:#F2C76B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:17px;line-height:1.5;caret-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:1100px}
.brand{margin-right:auto;font-weight:800;font-size:22px;letter-spacing:-.3px;text-decoration:none;color:var(--ink)}
.brand .ai{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}
.user{font-size:13px;color:var(--muted);max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding-block:22px 48px}
.eyebrow{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--f-text);font-size:30px;line-height:1.2;margin:6px 0 10px}
h2{font-family:var(--f-text);font-size:24px;line-height:1.25;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;text-decoration:none;color:var(--ink);min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px;min-height:40px}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1}
.back{margin:-6px 0 8px -6px}
/* Модуль мен сабақ */
.module{border-left:4px solid var(--accent)}
.module .mnum{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.lesson{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--paper)}
.lesson h3{margin:0 0 6px;font-family:var(--f-text);font-size:21px}
.goal{margin:0 0 12px;color:var(--muted);font-size:15.5px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{font-size:14px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14.5px}
.note a{color:inherit;font-weight:700}
/* Сабақ бөлімдері */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 18px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 6px;font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button small{font-weight:600;font-size:11.5px}
.tabs button[aria-current="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tabs button.done{color:var(--ok)}
.step{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
/* Сөз карточкасы */
.flip{perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip .in{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flip .back{transform:rotateY(180deg);border-color:var(--accent)}
.flip .ru{font-size:26px;font-weight:700}
.flip .kk{font-family:var(--f-text);font-size:30px;font-weight:700;color:var(--accent)}
.flip .col{font-size:15px;color:var(--muted)}
.flip .ex{font-family:var(--f-text);font-size:18px}
.flip .tap{font-size:13px;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
/* Тапсырма */
.prompt{font-family:var(--f-text);font-size:22px;line-height:1.35;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:13px 14px;font-size:17px;min-height:52px}
.opt b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:16px}
.fb h4{margin:0 0 4px;font-size:16px}
.fb.ok{background:var(--ok-soft)} .fb.ok h4{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad h4{color:var(--bad)}
.fb.hint{background:var(--warn-soft)} .fb.hint h4{color:var(--warn)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
/* Тірек сөйлемдер */
.phr{border-top:1px solid var(--line);padding:12px 0}
.phr:first-of-type{border-top:0}
.phr .k{font-family:var(--f-text);font-size:20px;line-height:1.35}
.phr .r{color:var(--muted);font-size:15px;margin-top:2px}
/* Мәтін */
.text p{font-family:var(--f-text);font-size:19px;line-height:1.6;margin:0 0 12px;text-indent:1.4em;text-align:justify;hyphens:auto}
.text .pn{display:inline-block;min-width:1.6em;font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--muted);text-indent:0}
details.peek{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.peek summary{padding:10px 14px;font-weight:700;color:var(--accent);cursor:pointer}
details.peek .text{padding:0 14px 6px}
/* Сөйлеу */
.sit{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px}
.sit .t{font-weight:700;font-size:17px}
.sit .m{font-size:13.5px;color:var(--muted)}
.sit .st{margin-left:auto;font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;font-size:16px}
.box b.lbl{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.box.know{background:var(--accent-soft)} .box.know b.lbl{color:var(--accent)}
.bubble{background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;font-family:var(--f-text);font-size:18px;line-height:1.4}
.bubble small{display:block;font-family:var(--f-ui);font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;text-align:center;letter-spacing:1px}
.timer.run{color:var(--bad)}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
audio{width:100%}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:16.5px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.model{font-family:var(--f-text);font-size:18px;line-height:1.5;background:var(--ok-soft);border-radius:10px;padding:14px}
.score{font-size:40px;font-weight:800;color:var(--accent)}
@media (max-width:560px){
  body{font-size:16.5px} h1{font-size:26px} h2{font-size:21px} .prompt{font-size:20px}
  .tabs button{font-size:12.5px;padding:7px 4px} .flip .kk{font-size:27px} .flip .ru{font-size:23px}
  .user{display:none}
}
</style>
</head>

: "дать поручение", "collocation": "-ға / -ге тапсырма беру", "example": "Бөлім басшысына тапсырма бердім."}, {"id": "v12", "word": "хабарласу", "ru": "связаться", "collocation": "-ға / -ге хабарласу", "example": "Үш күн ішінде сізге хабарласамыз."}], "key_phrases": [{"step": 1, "kk": "Сіздің жағдайыңызды түсініп отырмын.", "ru": "Я понимаю вашу ситуацию."}, {"step": 1, "kk": "Мәселені ашық айтқаныңызға рахмет.", "ru": "Спасибо, что открыто сказали о проблеме."}, {"step": 1, "kk": "Бұл сіз үшін маңызды екенін білемін.", "ru": "Знаю, что для вас это важно."}, {"step": 2, "kk": "Өкінішке қарай, бұл мүмкін емес.", "ru": "К сожалению, это невозможно."}, {"step": 2, "kk": "Заң бойынша бізде мұндай өкілеттік жоқ.", "ru": "По закону у нас нет таких полномочий."}, {"step": 2, "kk": "Бұл мәселе біздің құзыретімізге жатпайды.", "ru": "Этот вопрос не входит в нашу компетенцию."}, {"step": 3, "kk": "Есесіне мынадай жол бар: …", "ru": "Зато есть такой путь: …"}, {"step": 3, "kk": "Сізге … ұсына аламын.", "ru": "Могу предложить вам …"}, {"step": 3, "kk": "Бұл мәселені … арқылы шешуге болады.", "ru": "Этот вопрос можно решить через …"}, {"step": 4, "kk": "Өтінішіңізді ресми түрде тіркеп берейік.", "ru": "Давайте официально зарегистрируем ваше обращение."}, {"step": 4, "kk": "Жауапты маманға тапсырма беремін.", "ru": "Дам поручение ответственному специалисту."}, {"step": 4, "kk": "… күн ішінде сізге хабарласамыз.", "ru": "В течение … дней мы с вами свяжемся."}, {"step": "pressure", "kk": "Бұл сіздің құқығыңыз, бірақ шешім заң бойынша қабылданады.", "ru": "Это ваше право, но решение принимается по закону."}, {"step": "pressure", "kk": "Шағымыңызға жауап берілмегені үшін кешірім сұраймын.", "ru": "Прошу прощения, что на вашу жалобу не ответили."}], "reading": {"id": "r", "title": "Жақсы басшы «жоқ» деп қалай айтады?", "paragraphs": ["Мемлекеттік қызметкер күн сайын азаматтардың өтінішін қабылдайды. Олардың көбін орындауға болады, бірақ кейбір өтініштер заңға қайшы келеді. Мұндай жағдайда басшы бас тартуға мәжбүр. Бұл — оңай іс емес. Көмек сұрап келген адамға «жоқ» деген жауапты есту ауыр.", "Тәжірибелі басшы бірден «жоқ» демейді. Алдымен азаматты мұқият тыңдап, оның жағдайын түсінетінін айтады. Сосын ашық айтады: «Өкінішке қарай, бұл өтінішті орындау мүмкін емес». Және себебін түсіндіреді: заң бойынша мекеменің мұндай өкілеттігі жоқ немесе бұл мәселе оның құзыретіне жатпайды.", "Бірақ әңгіме осымен бітпейді. Жақсы басшы әрдайым балама іздейді. Есесіне азаматқа басқа жол ұсынады: жаңа бағдарламаны, басқа мекемені немесе мәселені шешудің заңды тәсілін. Соңында өтінішті ресми түрде тіркеп, жауапты маманға тапсырма береді. Азаматқа қашан хабарласатынын да нақты айтады.", "Мұндай басшыдан азамат ренжіп кетпейді. Себебі ол өзін тыңдағанын, құрметтегенін және көмектесуге тырысқанын көреді. Сыпайы бас тарту — азаматтың сенімін сақтаудың жолы."]}, "items": [{"id": "gov1-v1", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«өтініш» сөзінің мағынасы:", "options": ["обращение, заявление", "полномочие", "альтернатива", "поручение"], "answer": 0, "hint": "Азамат мекемеге не береді?", "explanation": "Өтініш — обращение, заявление. Тіркесі: өтініш беру, қабылдау, тіркеу."}, {"id": "gov1-v2", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«бас тарту» сөзінің мағынасы:", "options": ["предлагать", "отказать", "связаться", "регистрировать"], "answer": 1, "hint": "«Жоқ» деп жауап беру.", "explanation": "Бас тарту — отказать. Тіркесі: -дан / -ден бас тарту."}, {"id": "gov1-v3", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«өкінішке қарай» сөзінің мағынасы:", "options": ["по закону", "зато", "к сожалению", "в течение"], "answer": 2, "hint": "Жаман жаңалықтың алдында айтылады.", "explanation": "Өкінішке қарай — к сожалению."}, {"id": "gov1-v4", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«заң бойынша» сөзінің мағынасы:", "options": ["по закону", "по просьбе", "по очереди", "по телефону"], "answer": 0, "hint": "Заң — закон.", "explanation": "Заң бойынша — по закону."}, {"id": "gov1-v5", "section": "vocabulary", "skill": "V", "level": 2, "type": "mcq", "prompt": "«өкілеттік» сөзінің мағынасы:", "options": ["компетенция", "полномочие", "обращение", "альтернатива"], "answer": 1, "hint": "Мекеменің не істеуге құқығы бар?", "explanation": "Өкілеттік — полномочие: мекеменің нені істеуге құқығы бар екені."}, {"id": "gov1-v6", "section": "vocabulary", "skill": "V", "level": 2, "type": "mcq", "prompt": "«құзырет» сөзінің мағынасы:", "options": ["полномочие", "поручение", "компетенция", "закон"], "answer": 2, "hint": "Мекеме қандай мәселелермен айналысады?", "explanation": "Құзырет — компетенция: мекеменің саласы, аумағы."}, {"id": "gov1-v7", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«балама» сөзінің мағынасы:", "options": ["отказ", "альтернатива", "жалоба", "решение суда"], "answer": 1, "hint": "Басқа жол.", "explanation": "Балама — альтернатива. Тіркесі: балама жол, балама шешім."}, {"id": "gov1-v8", "section": "vocabulary", "skill": "V", "level": 2, "type": "mcq", "prompt": "«есесіне» сөзінің мағынасы:", "options": ["потому что", "кроме того", "зато, взамен", "например"], "answer": 2, "hint": "Бас тартқаннан кейін баламаны осы сөзбен бастаймыз.", "explanation": "Есесіне — зато, взамен."}, {"id": "gov1-v9", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«ұсыну» сөзінің мағынасы:", "options": ["предлагать", "отказывать", "требовать", "проверять"], "answer": 0, "hint": "Балама жол ...", "explanation": "Ұсыну — предлагать. Тіркесі: жол, көмек, балама ұсыну."}, {"id": "gov1-v10", "section": "vocabulary", "skill": "V", "level": 1, "type": "mcq", "prompt": "«тіркеу» сөзінің мағынасы:", "options": ["отклонять", "регистрировать", "подписывать", "отправлять"], "answer": 1, "hint": "Өтінішті ресми түрде ...", "explanation": "Тіркеу — регистрировать."}, {"id": "g і ресми тіркеп берейік, бес күн ішінде сізге хабарласамыз."}, {"id": "gov1-sB", "title": "Б жағдайы: Коммуналдық төлем", "level": 1, "time_limit_sec": 60, "use": ["lesson"], "situation": "Зейнеткер коммуналдық төлемнен толық босатуды сұрайды. Азамат сабырлы.", "facts_for_leader": "Толық босату жоқ. Балама: табысы аз отбасыларға арналған тұрғын үй көмегі; өтініш ХҚКО немесе eGov арқылы беріледі.", "citizen_lines": ["Зейнетақым аз, жартысы коммуналдыққа кетеді. Мені төлемнен босатсаңыздар.", "Неге болмайды?", "Ал мен eGov-пен жұмыс істей алмаймын."], "model_answer": "Сізді түсініп отырмын, зейнетақының жартысы коммуналдық төлемге кетсе, қиын. Өкінішке қарай, коммуналдық төлемнен толық босату заңда қарастырылмаған. Есесіне тұрғын үй көмегі бар: табысы аз отбасыларға төлемнің бір бөлігі өтеледі. eGov-пен жұмыс істеу қиын болса, маманымыз өтінішті толтыруға көмектеседі. Ертең сағат онда келіңіз, өтінішіңізді бірге тіркейміз."}, {"id": "gov1-sV", "title": "В жағдайы: Ауладағы ағаш", "level": 3, "time_limit_sec": 90, "use": ["lesson"], "situation": "Тұрғын терезесінің алдындағы үлкен ағашты ертең кесіп тастауды талап етеді. Алдымен наразы, сосын қысым жасайды.", "facts_for_leader": "Сау ағашты рұқсатсыз кесуге болмайды. Балама: маман ағаштың жағдайын тексереді, қажет болса бұтайды.", "citizen_lines": ["Үйімде күндіз де қараңғы! Бұтақтары тереземді сындырады. Үш рет шағым жаздым, ешкім келмеді.", "Сіздер тек сөйлей білесіздер! Ертең кеспесеңіздер, әлеуметтік желіге видео саламын. Жоғарыға да шағым жазамын!"], "model_answer": "Шағымыңызға жауап берілмегені үшін кешірім сұраймын. Терезеңізге бұтақ тиіп тұрғанын түсініп отырмын. Өкінішке қарай, заң бойынша сау ағашты рұқсатсыз кесуге болмайды. Есесіне ертең маман келіп, ағаштың жағдайын тексереді, қажет болса бұтақтарын бұтайды. Әлеуметтік желіге жазу — сіздің құқығыңыз, бірақ шешім заң бойынша қабылданады. Жауапты маманға қазір тапсырма беремін, ертең сағат он екіге дейін сізге хабарласамыз."}, {"id": "gov1-sG", "title": "Г ж       know:"Басшы біледі", citizen:"Азамат", nextLine:"Следующая реплика ›",
      recStart:"🎙 Начать запись", recStop:"■ Стоп", recAgain:"Записать заново", recording:"Идёт запись",
      noMic:"Микрофон не подключился. Можно ответить вслух и запустить только таймер.", noMicGo:"Продолжить с таймером", timerStop:"■ Готово",
      yourRec:"Ваша запись (хранится только на этом устройстве)", self:"Проверь себя", model:"Показать образец ответа", modelH:"Образец ответа",
      saved:"Результаты сохраняются.", notSaved:"Результат хранится только на этом устройстве. Чтобы сохранять на сервере,", login:"нужно войти на платформу",
      results:"Результат", finished:"Задания урока выполнены!"}
})[S.lang];

/* ---------- Күй (бар курстағыдай localStorage-та сақталады) ---------- */
let USER=null, sb=null, KEY="gov-v1:anon";
const blank = () => ({lang:"kk", items:{}, attempt:null, view:"home", sec:0, pos:{}, card:0, flipped:false, grp:0, sit:null, checks:{}, model:{}, recDone:{}, line:{}});
function load(){ try{ return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ return blank(); } }
let S=load();
try{ const l=localStorage.getItem("tilkz-lang"); if(l==="kk"||l==="ru") S.lang=l; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ru = () => S.lang==="ru";
const LETTERS = "ABCD";
const itemsOf = sec => LESSON.items.filter(x=>x.section===sec);
const VQ = itemsOf("vocabulary"), GQ = itemsOf("grammar"), RQ = itemsOf("reading");
const st = id => (S.items[id] ||= {tries:[], status:"open"});
const isDone = it => ["ok","revealed"].includes(st(it.id).status);
const isFirst = it => st(it.id).status==="ok" && st(it.id).tries.length===0;
const doneCount = () => LESSON.items.filter(isDone).length;

/* ---------- Серверге жазу: курс бетіндегі ensureAttempt / syncItem логикасымен бірдей ---------- */
let attemptReq=null;
function ensureAttempt(){
  if(S.attempt) return Promise.resolve(S.attempt);
  return attemptReq ||= sb.from("attempts").insert({bank_id:BANK_ID, mode:"practice"}).select("id").single()
    .then(({data,error})=>{ attemptReq=null; if(error){ console.warn(error); return null; } S.attempt=data.id; save(); return data.id; });
}
/* Сұраулар кезекпен жіберіледі: жылдам басқанда «wrong1» жазбасы «ok» жазбасынан кейін жетіп, оны басып кетпеуі үшін */
let syncQ=Promise.resolve();
function syncItem(it){ syncQ=syncQ.then(()=>syncItemNow(it)).catch(e=>console.warn(e)); return syncQ; }
async function syncItemNow(it){
  if(!USER||!sb) return; const s=st(it.id); if(s.status==="open") return;
  const aid=await ensureAttempt(); if(!aid) return;
  const {error}=await sb.from("answers").upsert({attempt_id:aid, bank_id:BANK_ID, item_id:it.id, skill:it.skill, level:it.level,
    tries:[...s.tries], status:s.status, first_correct:isFirst(it), updated_at:new Date().toISOString()});
  if(error) console.warn(error);
}
function syncFinish(){ syncQ=syncQ.then(syncFinishNow).catch(e=>console.warn(e)); return syncQ; }
async function syncFinishNow(){
  if(!USER||!sb) return; const aid=await ensureAttempt(); if(!aid) return;
  const {error}=await sb.from("attempts").update({finished_at:new Date().toISOString(), first_correct:LESSON.items.filter(isFirst).length, total:LESSON.items.length}).eq("id",aid);
  if(error) console.warn(error);
}

/* ---------- Экрандар ---------- */
const app=document.getElementById("app");
function render(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===S.lang));
  document.getElementById("user").textContent = USER ? "👤 "+USER.name : "";
  app.innerHTML = S.view==="lesson" ? lessonHTML() : homeHTML();
  window.scrollTo({top:0});
}
const T = () => L();
const courseTitle = () => ru() ? LESSON.course.title_ru : LESSON.course.title;
const moduleTitle = () => ru() ? LESSON.course.module.title_ru : LESSON.course.module.title;
const lessonTitle = () => ru() ? LESSON.lesson.title_ru : LESSON.lesson.title;
function saveNote(){ const t=T(); return USER ? "" : `<p class="note">${t.notSaved} <a href="../nzm-bil/">${t.login}</a>.</p>`; }

function homeHTML(){
  const t=T(), n=LESSON.items.length, a=doneCount(), m=LESSON.course.module;
  return `<span class="eyebrow">aitil</span><h1>${esc(courseTitle())}</h1>
   <div class="card module"><div class="mnum">${ru()?`${t.module} ${m.number}`:`${m.number}-${t.module}`}</div><h2>${esc(moduleTitle())}</h2>
     <div class="lesson"><h3>${ru()?`Урок ${LESSON.lesson.number}. `:`${LESSON.lesson.number}-${t.lesson}. `}${esc(lessonTitle())}</h3>
       <p class="goal">${esc(LESSON.lesson.goal)}</p>
       <div class="bar"><i style="width:${Math.round(100*a/n)}%"></i></div>
       <p class="meta">${t.progress(a,n)}${a===n?` · ${t.firstOk(LESSON.items.filter(isFirst).length,n)}`:""}</p>
       <div class="row"><button class="btn primary" type="button" data-go="lesson">${a?t.cont:t.start}</button></div></div></div>
   <div style="margin-top:14px">${saveNote()}</div>`;
}

function lessonHTML(){
  const t=T();
  const prog = [VQ.length+GQ.length, 0, RQ.length, 0];
  const done = [VQ.concat(GQ).filter(isDone).length, null, RQ.filter(isDone).length, LESSON.speaking.filter(x=>S.recDone[x.id]).length];
  const tabs = t.secs.map((s,i)=>{ const sub = i===1 ? `${LESSON.key_phrases.length}` : i===3 ? `${done[3]}/${LESSON.speaking.length}` : `${done[i]}/${prog[i]}`;
    const fin = (i===0||i===2) ? done[i]===prog[i] : i===3 ? done[3]===LESSON.speaking.length : false;
    return `<button type="button" data-sec="${i}" aria-current="${S.sec===i}" class="${fin?"done":""}">${esc(s)}<small>${fin?"✓":sub}</small></button>`; }).join("");
  const body = [vocabHTML, phrasesHTML, readingHTML, speakingHTML][S.sec]();
  return `<button class="btn ghost back" type="button" data-go="home">‹ ${t.lessons}</button>
    <span class="eyebrow">${esc(moduleTitle())}</span><h1 style="font-size:24px">${ru()?`Урок ${LESSON.lesson.number}. `:`${LESSON.lesson.number}-${t.lesson}. `}${esc(lessonTitle())}</h1>
    <nav class="tabs">${tabs}</nav>${body}`;
}

/* --- Сөздік: карточкалар → сөздік тапсырмалары → грамматика --- */
function vocabHTML(){
  const t=T(), p=S.pos.vocabulary ?? "cards";
  if(p==="cards"){
    const V=LESSON.vocabulary, i=Math.min(S.card, V.length-1), v=V[i];
    return `<div class="step"><span>${t.cards}</span><span>${t.card(i+1,V.length)}</span></div>
      <div class="flip ${S.flipped?"on":""}" id="flip" role="button" tabindex="0" aria-label="${t.tapFront}">
        <div class="in"><div class="face front"><div class="ru">${esc(v.ru)}</div><div class="tap">${t.tapFront}</div></div>
        <div class="face back"><div class="kk">${esc(v.word)}</div><div class="col">${esc(v.collocation)}</div><div class="ex">${esc(v.example)}</div><div class="tap">${t.tapBack}</div></div></div></div>
      <div class="nav"><button class="btn" type="button" data-card="-1" ${i===0?"disabled":""}>${t.prev}</button>
        ${i<V.length-1 ? `<button class="btn primary" type="button" data-card="1">${t.next}</button>` : `<button class="btn primary" type="button" data-vpos="0">${t.toTasks}</button>`}</div>`;
  }
  const list=VQ.concat(GQ); if(p>=list.length) return secDoneHTML(0);
  const it=list[p], g=it.section==="grammar";
  const num = g ? p-VQ.length : p, tot = g ? GQ.length : VQ.length;
  return itemHTML(it, `${g?t.gtasks:t.vtasks}`, t.q(num+1,tot), "vpos", p, list.length);
}

/* --- Бір тапсырма бір экранда --- */
function itemHTML(it, title, counter, posKey, p, n){
  const t=T(), s=st(it.id), fin=isDone(it);
  const opts=it.options.map((o,j)=>{ const L_=LETTERS[j];
    let cls=""; if(fin && j===it.answer) cls="ok"; else if(s.tries.includes(L_)) cls="bad";
    return `<button type="button" class="opt ${cls}" data-ans="${j}" data-id="${it.id}" ${fin||s.tries.includes(L_)?"disabled":""}><b>${L_}</b><span>${esc(o)}</span></button>`; }).join("");
  let fb="";
  if(s.status==="ok") fb=`<div class="fb ok" role="status"><h4>${t.ok}</h4><p style="margin:0">${esc(it.explanation)}</p></div>`;
  else if(s.status==="revealed") fb=`<div class="fb bad" role="status"><h4>${t.revealed}: ${LETTERS[it.answer]}) ${esc(it.options[it.answer])}</h4><p style="margin:0">${esc(it.explanation)}</p></div>`;
  else if(s.status==="wrong1") fb=`<div class="fb hint" role="status"><h4>${t.bad}</h4><p style="margin:0"><b>${t.hint}:</b> ${esc(it.hint)}</p></div>`;
  const peek = it.section==="reading" ? `<details class="peek"><summary>${t.peek}</summary>${textHTML()}</details>` : "";
  return `<div class="step"><span>${esc(title)}</span><span>${counter}</span></div>${peek}
    <div class="card"><p class="prompt">${esc(it.prompt)}</p><div class="opts">${opts}</div>${fb}</div>
    <div class="nav"><button class="btn" type="button" data-${posKey}="${p-1}" ${p===0?"disabled":""}>${t.prev}</button>
      <button class="btn ${fin?"primary":""}" type="button" data-${posKey}="${p+1}" ${fin?"":"disabled"}>${t.next}</button></div>`;
}
function secDoneHTML(i){
  const t=T(), list = i===0 ? VQ.concat(GQ) : RQ, f=list.filter(isFirst).length;
  const all = doneCount()===LESSON.items.length;
  return `<div class="card stack" style="text-align:center"><h2>${all?t.finished:t.secDone}</h2>
    <div class="score">${f} / ${list.length}</div><p class="meta" style="margin:0">${t.firstOk(f,list.length)}</p>
    ${all?`<p class="meta" style="margin:0">${t.firstOk(LESSON.items.filter(isFirst).length, LESSON.items.length)}</p>`:""}
    <div class="row" style="justify-content:center"><button class="btn" type="button" data-reset="${i}">${t.again}</button>
    <button class="btn primary" type="button" data-sec="${i+1}">${t.nextSec}</button></div></div>${saveNote()}`;
}

/* --- Тірек сөйлемдер: 4 қадам + қысым --- */
function phraseGroups(){
  const g=LESSON.lesson.steps.map((s,i)=>({title:`${T().steps} ${i+1}. ${s}`, list:LESSON.key_phrases.filter(p=>p.step===i+1)}));
  g.push({title:T().pressure, list:LESSON.key_phrases.filter(p=>p.step==="pressure")});
  return g.filter(x=>x.list.length);
}
function phrasesHTML(){
  const t=T(), G=phraseGroups(), i=Math.min(S.grp,G.length-1), g=G[i];
  return `<div class="step"><span>${t.secs[1]}</span><span>${t.group(i+1,G.length)}</span></div>
    <div class="card"><h2>${esc(g.title)}</h2>${g.list.map(p=>`<div class="phr"><div class="k">${esc(p.kk)}</div><div class="r">${esc(p.ru)}</div></div>`).join("")}</div>
    <div class="nav"><button class="btn" type="button" data-grp="${i-1}" ${i===0?"disabled":""}>${t.prev}</button>
      ${i<G.length-1?`<button class="btn primary" type="button" data-grp="${i+1}">${t.next}</button>`:`<button class="btn primary" type="button" data-sec="2">${t.nextSec}</button>`}</div>`;
}

/* --- Мәтін: орысша аудармасыз --- */
function textHTML(){ return `<div class="text">${LESSON.reading.paragraphs.map((p,i)=>`<p><span class="pn">${i+1}</span>${esc(p)}</p>`).join("")}</div>`; }
function readingHTML(){
  const t=T(), p=S.pos.reading ?? "text";
  if(p==="text") return `<div class="step"><span>${t.readText}</span></div>
    <div class="card"><h2>${esc(LESSON.reading.title)}</h2>${textHTML()}</div>
    <div class="nav"><span></span><button class="btn primary" type="button" data-rpos="0">${t.toQs}</button></div>`;
  if(p>=RQ.length) return secDoneHTML(2);
  return itemHTML(RQ[p], t.rtasks, t.q(p+1,RQ.length), "rpos", p, RQ.length);
}

/* --- Сөйлеу --- */
const fmtT = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function speakingHTML(){
  const t=T();
  if(!S.sit) return `<div class="step"><span>${t.situations}</span></div><div class="stack">${LESSON.speaking.map(x=>`
    <button type="button" class="sit" data-sit="${x.id}"><span><span class="t">${esc(x.title)}</span><br><span class="m">${x.level}-${t.level} · ${fmtT(x.time_limit_sec)}</span></span>${S.recDone[x.id]?`<span class="st">✓ ${t.done}</span>`:""}</button>`).join("")}</div>`;
  const x=LESSON.speaking.find(y=>y.id===S.sit), ln=Math.min(S.line[x.id]||0, x.citizen_lines.length-1), rec=REC.sid===x.id?REC:null, done=!!S.recDone[x.id];
  const lines=x.citizen_lines.slice(0,ln+1).map(l=>`<div class="bubble"><small>${t.citizen}</small>${esc(l)}</div>`).join("");
  const left = rec ? rec.left : x.time_limit_sec;
  let ctrl;
  if(rec && rec.on) ctrl=`<div class="timer run" aria-live="polite"><span class="recdot"></span>${fmtT(left)}</div><p class="meta" style="text-align:center;margin:0">${rec.audio===false?"":t.recording}</p>
      <button class="btn rec" type="button" data-rec="stop">${rec.audio===false?t.timerStop:t.recStop}</button>`;
  else if(MICERR===x.id) ctrl=`<div class="timer">${fmtT(x.time_limit_sec)}</div><p class="note">${t.noMic}</p><button class="btn primary" type="button" data-rec="timer">${t.noMicGo}</button>`;
  else if(!done) ctrl=`<div class="timer">${fmtT(x.time_limit_sec)}</div><button class="btn primary" type="button" data-rec="start">${t.recStart}</button>`;
  else ctrl=`<div class="stack">${AUDIO[x.id]?`<div><p class="meta" style="margin:0 0 6px">${t.yourRec}</p><audio controls src="${AUDIO[x.id]}"></audio></div>`:""}
      <div class="check"><h2 style="font-size:19px">${t.self}</h2>${LESSON.self_check.map((c,i)=>`<label><input type="checkbox" data-chk="${i}" ${(S.checks[x.id]||[])[i]?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>
      ${S.model[x.id]?`<div><h2 style="font-size:19px">${t.modelH}</h2><div class="model">${esc(x.model_answer)}</div></div>`:`<button class="btn primary" type="button" data-model="1">${t.model}</button>`}
      <button class="btn" type="button" data-rec="start">${t.recAgain}</button></div>`;
  return `<button class="btn ghost back" type="button" data-sit="">‹ ${t.situations}</button>
    <div class="card stack"><h2>${esc(x.title)}</h2><p style="margin:0">${esc(x.situation)}</p>
      <div class="box know"><b class="lbl">${t.know}</b>${esc(x.facts_for_leader)}</div>
      ${lines}${ln<x.citizen_lines.length-1?`<button class="btn" type="button" data-line="1">${t.nextLine}</button>`:""}</div>
    <div class="card stack" style="margin-top:14px">${ctrl}</div>`;
}

/* ---------- Дауыс жазу (MediaRecorder). Жазба серверге жіберілмейді: IndexedDB-де, тек осы құрылғыда ---------- */
let REC={}, MICERR=null; const AUDIO={};
const idb = () => new Promise((res,rej)=>{ const r=indexedDB.open("aitil-gov",1); r.onupgradeneeded=()=>r.result.createObjectStore("rec"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function putRec(id,blob){ try{ const db=await idb(); db.transaction("rec","readwrite").objectStore("rec").put(blob, KEY+":"+id); }catch(e){} }
async function getRec(id){ try{ const db=await idb(); return await new Promise(r=>{ const q=db.transaction("rec").objectStore("rec").get(KEY+":"+id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }catch(e){ return null; } }
function tick(){ if(!REC.on) return; REC.left=Math.max(0, REC.total-Math.floor((Date.now()-REC.t0)/1000));
  const el=document.querySelector(".timer.run"); if(el) el.innerHTML=`<span class="recdot"></span>${fmtT(REC.left)}`;
  if(REC.left<=0) stopRec(); }
async function startRec(x, withMic){
  MICERR=null; REC={sid:x.id, on:true, t0:Date.now(), total:x.time_limit_sec, left:x.time_limit_sec, audio:withMic};
  if(withMic){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mr=new MediaRecorder(stream), chunks=[];
      mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      mr.onstop=async()=>{ stream.getTracks().forEach(tr=>tr.stop()); const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
        if(AUDIO[x.id]) URL.revokeObjectURL(AUDIO[x.id]); AUDIO[x.id]=URL.createObjectURL(blob); await putRec(x.id, blob); render(); };
      REC.mr=mr; mr.start(); REC.t0=Date.now();
    }catch(e){ console.warn(e); REC={}; MICERR=x.id; render(); return; }
  }
  REC.iv=setInterval(tick, 250); render();
}
function stopRec(){ if(!REC.on) return; clearInterval(REC.iv); REC.on=false; S.recDone[REC.sid]=true; save();
  if(REC.mr && REC.mr.state!=="inactive") REC.mr.stop(); else render(); }

/* ---------- Оқиғалар ---------- */
app.addEventListener("click", async e=>{
  const b=e.target.closest("button,[data-flip]"); const flip=e.target.closest("#flip");
  if(flip && !b){ S.flipped=!S.flipped; save(); flip.classList.toggle("on", S.flipped); return; }
  if(!b) return; const d=b.dataset;
  if(d.go){ S.view=d.go; save(); render(); return; }
  if(d.sec!=null){ S.sec=+d.sec; if(S.sec===3) S.sit=null; save(); render(); return; }
  if(d.card){ S.card=Math.max(0, Math.min(LESSON.vocabulary.length-1, S.card+ +d.card)); S.flipped=false; save(); render(); return; }
  if(d.vpos!=null){ S.pos.vocabulary=+d.vpos<0?"cards":+d.vpos; save(); render(); return; }
  if(d.rpos!=null){ S.pos.reading=+d.rpos<0?"text":+d.rpos; save(); render(); return; }
  if(d.reset!=null){ if(d.reset==="0"){ resetList(VQ.concat(GQ)); S.pos.vocabulary=0; } else { resetList(RQ); S.pos.reading=0; } save(); render(); return; }
  if(d.grp!=null){ S.grp=+d.grp; save(); render(); return; }
  if(d.ans!=null){ answer(LESSON.items.find(x=>x.id===d.id), +d.ans); return; }
  if(d.sit!=null){ if(REC.on) stopRec(); S.sit=d.sit||null; MICERR=null; save(); if(S.sit && !AUDIO[S.sit]){ const bl=await getRec(S.sit); if(bl) AUDIO[S.sit]=URL.createObjectURL(bl); } render(); return; }
  if(d.line){ S.line[S.sit]=(S.line[S.sit]||0)+1; save(); render(); return; }
  const x=LESSON.speaking.find(y=>y.id===S.sit);
  if(d.rec==="start"){ startRec(x, !!(navigator.mediaDevices && window.MediaRecorder)); return; }
  if(d.rec==="timer"){ startRec(x, false); return; }
  if(d.rec==="stop"){ stopRec(); return; }
  if(d.model){ S.model[S.sit]=true; save(); render(); return; }
});
app.addEventListener("keydown", e=>{ if(e.target.id==="flip" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.target.click(); } });
app.addEventListener("change", e=>{ const c=e.target.closest("[data-chk]"); if(!c) return; (S.checks[S.sit] ||= [])[+c.dataset.chk]=c.checked; save(); });
function resetList(list){ for(const it of list) delete S.items[it.id]; if(doneCount()===0) S.attempt=null; }
function answer(it, j){
  const s=st(it.id); if(isDone(it)) return; const Lt=LETTERS[j];
  if(j===it.answer) s.status="ok";
  else if(!s.tries.length){ s.tries.push(Lt); s.status="wrong1"; }
  else { s.tries.push(Lt); s.status="revealed"; }
  save(); render(); syncItem(it);
  if(doneCount()===LESSON.items.length) syncFinish();
}
document.querySelector(".seg").addEventListener("click", e=>{ const b=e.target.closest("[data-lang]"); if(!b) return; S.lang=b.dataset.lang; try{localStorage.setItem("tilkz-lang",S.lang);}catch(e){} save(); render(); });
document.getElementById("themeBtn").addEventListener("click", ()=>{ const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const th=dark?"light":"dark"; document.documentElement.dataset.theme=th; try{localStorage.setItem("tilkz-theme",th);}catch(e){} });

/* ---------- Кіру: курс бетімен ортақ сессия (tilkz-auth) ---------- */
async function boot(){
  if(SB_CFG && window.supabase){
    sb=window.supabase.createClient(SB_CFG.url, SB_CFG.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"tilkz-auth"}});
    try{ const {data:{session}}=await sb.auth.getSession();
      if(session){ const u=session.user; const {data:p}=await sb.from("students").select("first_name,last_name").eq("user_id",u.id).maybeSingle();
        USER={id:u.id, name: p?`${p.first_name} ${p.last_name}`:(u.email||"")}; const lang=S.lang; KEY="gov-v1:"+u.id; S=load(); S.lang=lang; }
    }catch(e){ console.warn(e); }
  }
  render();
}
boot();
</script>
